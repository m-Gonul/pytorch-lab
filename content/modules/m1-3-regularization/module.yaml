id: m1-3-regularization
code: M1.3
title: "Regularization: ridge ve lasso"
phase: 1
minutes: 210
prereq: [m1-1-linreg, m1-2-gd-variants]
summary: >
  Ağırlıkları küçük tutmanın iki yolu. 2×2'lik bir ridge sistemini elle çözüp
  soft-threshold'u uyguluyor, saf Python'da coordinate descent ile lasso
  yazıyor, NumPy'da tüm regularization yolunu tek SVD'den çıkarıyor,
  PyTorch'ta `weight_decay`'in L2 cezasıyla ilişkisini kuruyor ve en sonda
  k-fold cross-validation'ı λ'lar üzerinde döngüsüz yapıyorsun.
goals:
  - "Ridge kapalı formunu $(X^\\top X+\\lambda I)w=X^\\top y$ olarak türetip uygulamak; bias'ın neden cezalandırılmadığını açıklamak"
  - "Lasso'nun [[soft-threshold]] adımıyla nasıl tam sıfır katsayı ürettiğini göstermek"
  - "Ridge yolunu $w(\\lambda)=V\\,\\text{diag}\\!\\big(\\tfrac{s}{s^2+\\lambda}\\big)U^\\top y$ ile tüm λ'lar için tek SVD'den hesaplamak"
  - "SGD'nin `weight_decay` parametresinin hangi L2 katsayısına karşılık geldiğini bulmak"
  - "[[cross-validation|Cross-validation]] ile λ seçmek"
sources:
  - {title: "ISLP — Bölüm 6.2 Shrinkage Methods (ridge, lasso)", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "Elements of Statistical Learning — Bölüm 3.4", url: "https://hastie.su.domains/ElemStatLearn/", license: "doğrulanmadı", use: link}
  - {title: "Dive into Deep Learning §3.7 Weight Decay", url: "https://d2l.ai/chapter_linear-regression/weight-decay.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "Friedman, Hastie, Tibshirani — Regularization Paths via Coordinate Descent (glmnet)", url: "https://www.jstatsoft.org/article/view/v033i01", license: "CC BY 3.0", use: link}

hand:
  groups:
    - title: "$X=\\begin{bmatrix}1&0\\\\0&1\\\\1&1\\end{bmatrix}$, $y=[1,2,3]$, bias yok. Önce $X^\\top X$ ve $X^\\top y$"
      layout: matrix
      rows: 2
      cols: 2
      fields:
        - {id: a11, label: "$(X^\\top X)_{11}$", answer: 2, hint: "1. sütunun kendisiyle iç çarpımı: $1+0+1$"}
        - {id: a12, label: "$(X^\\top X)_{12}$", answer: 1, hint: "1. ve 2. sütun: $0+0+1$"}
        - {id: xy1, label: "$(X^\\top y)_1$", answer: 4, hint: "$1+0+3$"}
        - {id: xy2, label: "$(X^\\top y)_2$", answer: 5, hint: "$0+2+3$"}
    - title: "Çözümler: OLS ($\\lambda=0$) ve ridge ($\\lambda=1$); $2\\times2$ ters: $\\frac1{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$"
      fields:
        - {id: o1, label: "OLS $w_1$", answer: 1, tol: 0.001, hint: "$\\frac13(2\\cdot4-1\\cdot5)$"}
        - {id: o2, label: "OLS $w_2$", answer: 2, tol: 0.001, hint: "$\\frac13(-1\\cdot4+2\\cdot5)$"}
        - {id: r1, label: "Ridge $w_1$", answer: 0.875, tol: 0.002, hint: "$X^\\top X+I=\\begin{bmatrix}3&1\\\\1&3\\end{bmatrix}$, det 8: $\\frac18(3\\cdot4-5)$"}
        - {id: r2, label: "Ridge $w_2$", answer: 1.375, tol: 0.002, hint: "$\\frac18(-4+3\\cdot5)$"}
    - title: "Soft-threshold $S(z,t)=\\text{sign}(z)\\max(|z|-t,0)$, $t=0.5$"
      fields:
        - {id: s1, label: "$S(1.5,\\,0.5)$", answer: 1, tol: 0.001, hint: "$1.5-0.5$"}
        - {id: s2, label: "$S(-0.3,\\,0.5)$", answer: 0, tol: 0.001, hint: "$|z|<t$ → tam sıfır"}
        - {id: s3, label: "$S(-2,\\,0.5)$", answer: -1.5, tol: 0.001, hint: "işaret korunur, büyüklük $t$ kadar küçülür"}
  verify: |
    X = [[1, 0], [0, 1], [1, 1]]; y = [1, 2, 3]
    A = [[sum(X[k][i] * X[k][j] for k in range(3)) for j in range(2)] for i in range(2)]
    c = [sum(X[k][i] * y[k] for k in range(3)) for i in range(2)]
    def solve(A, c):
        (a, b), (cc, d) = A; det = a * d - b * cc
        return (d * c[0] - b * c[1]) / det, (-cc * c[0] + a * c[1]) / det
    o = solve(A, c); r = solve([[A[0][0] + 1, A[0][1]], [A[1][0], A[1][1] + 1]], c)
    S = lambda z, t: (1 if z > 0 else -1) * max(abs(z) - t, 0)
    answers = dict(a11=A[0][0], a12=A[0][1], xy1=c[0], xy2=c[1], o1=o[0], o2=o[1], r1=r[0], r2=r[1],
                   s1=S(1.5, 0.5), s2=S(-0.3, 0.5), s3=S(-2, 0.5))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Lasso tam sıfır katsayı üretirken ridge neden üretmez?"
    options:
      - {t: "L1 cezasının 0'da köşesi var (türevi $[-\\lambda,\\lambda]$ aralığında); küçük gradyanlar bu aralığa düşünce optimum tam 0'da kalır. L2'nin 0'daki türevi 0, katsayı yalnız küçülür", ok: true, why: "Coordinate descent'te bu, soft-threshold'un $|z|<t$ için 0 döndürmesi olarak görünür. Geometrik olarak: L1 topu köşeli, kayıp elipsleri köşeye değer."}
      - {t: "Lasso daha büyük λ kullanır", why: "Aynı λ ile de davranış farkı var; konu cezanın şekli."}
      - {t: "Ridge'in kapalı formu sıfırı temsil edemez", why: "Edebilir; ama $(X^\\top X+\\lambda I)^{-1}X^\\top y$ genel durumda hiçbir bileşeni tam sıfır yapmaz."}
  - q: "Ridge'de özellikleri neden standardize ederiz?"
    options:
      - {t: "Ceza $\\lambda\\lVert w\\rVert^2$ tüm katsayılara aynı ağırlığı verir; birimi büyük (ör. milimetre) bir özelliğin katsayısı zaten küçük olduğu için daha az cezalanır", ok: true, why: "Ölçek değişince çözüm değişir: ridge ölçeğe göre değişmez değildir. OLS ise değişmezdir."}
      - {t: "Matris tersinin var olması için", why: "$\\lambda>0$ ile $X^\\top X+\\lambda I$ zaten her zaman terslenebilir."}
      - {t: "Hız için", why: "Konu sonucun anlamı, hız değil."}
  - q: "`SGD(weight_decay=wd)` hangi cezaya denk gelir?"
    options:
      - {t: "$\\frac{wd}{2}\\lVert w\\rVert^2$; çünkü gradyana $wd\\cdot w$ ekler", ok: true, why: "$\\nabla\\frac{wd}{2}\\lVert w\\rVert^2=wd\\cdot w$. Kayıpta $\\lambda\\lVert w\\rVert^2$ kullanıyorsan $wd=2\\lambda$. Adam'da ise eşdeğerlik bozulur; AdamW bunu düzeltir (M3.4)."}
      - {t: "$wd\\cdot\\lVert w\\rVert^2$", why: "Gradyanı $2wd\\cdot w$ olurdu; PyTorch yalnız $wd\\cdot w$ ekler."}
      - {t: "$wd\\cdot\\lVert w\\rVert_1$", why: "L1 cezası için ayrı bir parametre yok; elle eklenir."}

homework:
  - title: "Tibshirani (1996): Lasso"
    paper: "Tibshirani — Regression Shrinkage and Selection via the Lasso (JRSS-B 1996)"
    url: "https://www.jstor.org/stable/2346178"
    level: orta
    hours: 6
    goal: |
      Lasso'yu koordinat inişiyle (yumuşak eşikleme) yaz, düzenlileştirme yolunu (λ'ya göre katsayılar, makale Şekil 2) prostate veri setinde ya da sentetik seyrek bir problemde çiz; ridge ile karşılaştır. Seyrek gerçek katsayılı (s ≪ d) problemde destek kurtarma oranını λ'ya göre ölç; makalenin ortogonal tasarımdaki kapalı form çözümünü (Denk. 3: sign(β̂)(|β̂| − γ)₊) doğrula.
    steps:
      - "Sıcak başlangıçla (warm start) λ yolunu büyükten küçüğe izle."
    accept:
      - "Yol grafikleri: Lasso katsayıları tam sıfıra iner, ridge inmez."
      - "Ortogonal tasarımda kapalı formla birebir sonuç."

labs:
  - id: l1
    lab: biasvar
    title: "Derece, ridge λ ve veri miktarı: yanlılık–varyans"
    goal: |
      Aynı veriye giderek esnekleşen polinomlar uydur. Eğitim hatası dereceyle hep düşer; **test** hatası önce düşer sonra yükselir. Ridge cezası $\lambda\|w\|^2$ ağırlıkları küçülterek esnekliği dereceden bağımsız olarak kısar. Taban: gürültü varyansı $\sigma^2$'nin altına hiçbir model inemez.
    predict:
      q: "Derece 9, n = 15, λ ≈ 0. n'yi 200'e çıkarırsan test hatası ne olur?"
      options:
        - {t: "Belirgin düşer, σ²'ye yaklaşır", ok: true, why: "Varyans terimi ≈ (parametre sayısı)·σ²/n: n büyüdükçe esnek model de gürültüyü ezberleyemez."}
        - {t: "Değişmez; derece aynı", why: "Yanlılık değişmez ama varyans n ile azalır."}
        - {t: "Artar; daha çok gürültü var", why: "Gürültü düzeyi aynı, örnek sayısı arttı."}
    presets:
      - {name: "Aşırı uyum", params: {d: 12, lam: 1.0e-8, n: 15}, note: "13 parametre, 15 nokta: eğri noktalar arasında çılgınca salınır."}
      - {name: "Ridge kurtarır", params: {d: 12, lam: 0.01, n: 15}, note: "Aynı derece; ceza ağırlık normunu küçültür, test hatası düşer."}
      - {name: "Eksik uyum", params: {d: 1, lam: 1.0e-8, n: 50}, note: "Doğru eğriyi doğruyla yaklaşmak: eğitim hatası da yüksek."}
      - {name: "Çok veri", params: {d: 12, lam: 1.0e-8, n: 200}, note: "Varyans n ile söner."}
      - {name: "λ karşılaştırması", params: {d: 12, n: 20, lam: 1.0e-8, B: {lam: 0.05}}, note: "A cezasız, B ridge: kesikli çizgi B."}
    questions:
      - q: "Hata–λ grafiğinde λ çok büyüyünce test hatası neden yeniden yükseliyor?"
        a: "Ceza ağırlıkları sıfıra iter; model sabit fonksiyona yaklaşır (yüksek yanlılık). En iyi λ, iki uç arasındaki U'nun dibidir — çapraz doğrulamayla seçilir."
      - q: "Gürültü σ = 0 yapınca derece 15 hâlâ kötü mü?"
        a: "Gürültü yoksa varyans terimi ortadan kalkar; yüksek derece düzgün bir fonksiyonu iyi yaklaşır (sayısal koşul dışında). Aşırı uyum, gürültüyü öğrenmenin adıdır."
    limits: "Legendre tabanı ve kapalı form çözüm kullanılıyor (sayısal kararlılık için); x ∈ [−1, 1]'de düzgün örnekleme. Test hatası 200 noktalı ızgarada gerçek fonksiyona uzaklık + σ²."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Ridge çözümü ve özdeğer büzülmesi
    goal: Ridge'in katsayıları hangi yönlerde ne kadar küçülttüğünü görmek
    needs: Normal denklemler (M1.1), özayrışım
    q: |-
      $L(w)=\|Xw-y\|^2+\lambda\|w\|^2$'nin minimumunu bul ve $X=U D V^\top$ (SVD) cinsinden yorumla.
    solution: |-
      **Gradyan:** $\nabla L=2X^\top(Xw-y)+2\lambda w=0\Rightarrow(X^\top X+\lambda I)w=X^\top y$. $\lambda>0$ iken $X^\top X+\lambda I$ her zaman pozitif tanımlıdır (özdeğerleri $d_i^2+\lambda>0$), yani çözüm **her zaman tektir** — M1.1 P6'daki tekillik sorunu biter.

      **SVD ile:** $X^\top X=VD^2V^\top$, $X^\top y=VDU^\top y$. Yerine koy: $w_\lambda=V\,\mathrm{diag}\!\big(\tfrac{d_i}{d_i^2+\lambda}\big)U^\top y$. Karşılaştır: en küçük kareler $w_0=V\,\mathrm{diag}(1/d_i)\,U^\top y$.

      **Yorum:** $i$. tekil yön boyunca katsayı $\frac{d_i^2}{d_i^2+\lambda}$ oranında küçülür. Verinin çok değiştiği yönler ($d_i^2\gg\lambda$) neredeyse dokunulmaz; az bilgi taşıyan, gürültüye açık yönler ($d_i^2\ll\lambda$) neredeyse sıfırlanır. Etkin serbestlik derecesi $\sum_i\frac{d_i^2}{d_i^2+\lambda}$: λ = 0'da d, λ → ∞'da 0.
  - id: p2
    type: hesap
    level: 1
    title: Tek değişkenli ridge
    goal: Kapalı formu uygulamak
    needs: P1
    q: |-
      Kesişimsiz tek öznitelik: $\sum x_i^2=10$, $\sum x_iy_i=20$, $\lambda=10$. Ridge katsayısı $w$ kaç?
    answer: 1.0
    calc: "20/(10+10)"
    mistakes:
      - {answer: 2.0, msg: "λ'yı paydaya eklemeyi unuttun: bu cezasız en küçük kareler çözümü."}
      - {answer: 1.3333333333333333, msg: "Kayıpta λ‖w‖² varsa paydada λ, (λ/2)‖w‖² varsa λ/2 olur; burada kayıp L = ‖Xw−y‖² + λ‖w‖²."}
    hints:
      - "Tek boyutta $(X^\\top X+\\lambda)w=X^\\top y$."
    solution: |-
      $w=\frac{\sum x_iy_i}{\sum x_i^2+\lambda}=\frac{20}{20}=1$; cezasız çözüm 2 idi, ceza yarıya indirdi ($d^2/(d^2+\lambda)=0.5$).
  - id: p3
    type: hesap
    level: 1
    title: Yumuşak eşikleme
    goal: Lasso'nun tek koordinat çözümünü uygulamak
    needs: L1'in alt türevi
    q: |-
      $\min_w\frac12(w-z)^2+\lambda|w|$'nin çözümü $S_\lambda(z)=\mathrm{sign}(z)\max(|z|-\lambda,0)$. $z=1.2$, $\lambda=0.5$ için $w$?
    answer: 0.7
    calc: "1.2-0.5"
    mistakes:
      - {answer: 1.7, msg: "Ceza katsayıyı sıfıra doğru çeker: |z|'den λ çıkarılır."}
      - {answer: 0.7999999999999999, msg: "Bu L2 (ridge) büzülmesi: oranla küçültür. L1 sabit miktar (λ) çıkarır."}
    hints:
      - "$|z|>\\lambda$ mı?"
    solution: |-
      $|z|=1.2>0.5$ → $w=1.2-0.5=0.7$. $|z|\le\lambda$ olsaydı $w=0$: L1'in seyreklik üretmesi tam olarak bu eşikten gelir.
  - id: p4
    type: açıkla
    level: 2
    title: Neden L1 sıfırlar da L2 sıfırlamaz?
    goal: Seyrekliğin geometrisini kendi cümlelerinle açıklamak
    needs: P3, kontur çizgileri
    q: |-
      İki parametreli bir problemde L1 cezasının katsayıları tam sıfıra götürüp L2'nin götürmediğini hem geometrik hem cebirsel olarak açıkla.
    rubric:
      - "Kısıtlı biçimi ($\\|w\\|_1\\le t$ elmas, $\\|w\\|_2\\le t$ disk) çizdim/anlattım"
      - "Kayıp elipslerinin elmasa köşede (eksen üzerinde) değme olasılığının yüksek olduğunu söyledim"
      - "Cebirsel olarak: L2 cezasının türevi $2\\lambda w$ sıfırda kaybolur, L1'in alt türevi $[-\\lambda,\\lambda]$ sıfırı bir aralıkta 'tutar' dedim"
      - "Soft threshold ile ridge büzülmesini karşılaştırdım"
    hints:
      - "L2 cezasının $w$ küçükken itme kuvveti ne olur?"
    solution: |-
      Kısıtlı biçimde L1 bölgesi köşeleri eksenlerde olan bir elmastır; kayıp elipsi büyüdükçe bölgeye ilk değdiği nokta çoğunlukla bir köşedir — bir koordinat tam 0. L2 diski pürüzsüzdür; değme noktası genel konumdadır. Cebirsel: L2'nin cezası küçük $w$'de $\lambda w^2$, türevi $2\lambda w\to0$ — sıfıra yaklaşırken itme söner, katsayı küçülür ama sıfırlanmaz. L1'in itmesi $|w|$ ne kadar küçük olursa olsun sabit $\lambda$; veri gradyanı $\lambda$'dan küçükse katsayı sıfırda kalır (P3).
  - id: p5
    type: yöntem-seç
    level: 2
    title: İlişkili öznitelik grupları
    goal: Ridge, lasso, elastic net arasında seçim yapmak
    needs: P4
    q: |-
      1000 öznitelik; gerçekten ilgili olanlar 50, ama bunlar 10'luk gruplar hâlinde birbirleriyle çok ilişkili (aynı ölçümün farklı sensörleri). Hangisi?
    choices:
      - {t: "Lasso", why: "İlişkili gruptan genellikle keyfi tek bir öznitelik seçer ve seçim örneklemden örneklemle değişir."}
      - {t: "Ridge", why: "Grupları birlikte tutar ama 950 gereksiz özniteliği de sıfırlamaz."}
      - {t: "Elastic net (L1 + L2)", ok: true, why: "L1 seyreklik, L2 ilişkili öznitelikleri birlikte seçme (gruplama) etkisi verir."}
    hints:
      - "Lasso iki özdeş öznitelik arasında nasıl seçim yapar?"
    solution: |-
      Elastic net $\lambda_1\|w\|_1+\lambda_2\|w\|^2$: L2 terimi kesinlikle dışbükey yapar ve özdeş özniteliklere eşit ağırlık verdirir (gruplama), L1 terimi alakasız grupları sıfırlar (Zou & Hastie 2005).
  - id: p6
    type: birleştir
    level: 3
    title: Ridge = Gauss önsel ile MAP
    goal: Düzenlileştirmeyi olasılıksal yorumla bağlamak (M0.4)
    needs: Bayes kuralı, Gauss yoğunluğu
    q: |-
      $y_i=w^\top x_i+\varepsilon_i$, $\varepsilon_i\sim\mathcal N(0,\sigma^2)$, önsel $w\sim\mathcal N(0,\tau^2I)$. MAP kestiriminin ridge olduğunu göster ve λ'yı σ, τ cinsinden yaz. Lasso hangi önsele karşılık gelir?
    rubric:
      - "$\\log p(w|y)=\\log p(y|w)+\\log p(w)+$ sabit yazdım"
      - "Olabilirlikten $-\\frac1{2\\sigma^2}\\|Xw-y\\|^2$, önselden $-\\frac1{2\\tau^2}\\|w\\|^2$ çıktığını gösterdim"
      - "$\\lambda=\\sigma^2/\\tau^2$ buldum ve yorumladım (geniş önsel → az ceza)"
      - "Lasso'nun Laplace önseline karşılık geldiğini söyledim"
    hints:
      - "MAP = argmax log-posterior; sabitleri at."
      - "Her iki tarafı $-2\\sigma^2$ ile çarp."
    solution: |-
      $-\log p(w|y)=\frac1{2\sigma^2}\|Xw-y\|^2+\frac1{2\tau^2}\|w\|^2+c$. $2\sigma^2$ ile çarp: $\|Xw-y\|^2+\frac{\sigma^2}{\tau^2}\|w\|^2$ → ridge, $\lambda=\sigma^2/\tau^2$. Gürültü büyük ya da önsel dar → ceza büyük. Laplace önseli $p(w)\propto e^{-|w|/b}$ log'da $|w|/b$ verir → lasso, $\lambda=2\sigma^2/b$. **Fark:** MAP tek bir nokta verir; tam Bayes çözümü belirsizliği de taşır (posterior Gauss, ortalaması ridge çözümü).
pitfalls:
  - wrong: "Kesişim terimini (bias) de cezalandır."
    right: "Kesişimi cezalandırma; aksi hâlde model y'nin ortalamasını kaydırmak için cezalandırılır ve sonuç y'nin ölçeğine/öteleme seçimine bağlı olur."
  - wrong: "Öznitelikleri ölçeklemeden ridge/lasso uygulamak sorun değil."
    right: "Ceza katsayılara eşit davranır; birimi küçük (değerleri büyük) özniteliğin katsayısı küçük olacağı için az cezalanır. Önce standartlaştır."
  - wrong: "λ'yı test kümesinde en iyi sonucu verene göre seç."
    right: "λ bir hiperparametredir: doğrulama kümesi ya da çapraz doğrulamayla seçilir; test kümesi yalnız son raporlama içindir (M3.9 sızıntı)."
whatif:
  - q: "n ≫ d (çok veri, az öznitelik) olsaydı ridge'e ihtiyaç kalır mı?"
    a: "Varyans terimi ≈ dσ²/n zaten küçüktür; en iyi λ 0'a yaklaşır. Ama öznitelikler çok ilişkiliyse (küçük tekil değerler) ridge yine kararlılık kazandırır."
  - q: "Ceza ‖w‖₂ (karesiz) olsaydı?"
    a: "Hâlâ dışbükey ama sıfırda türevlenemez; grup lasso'nun bir grubuna karşılık gelir: tüm vektörü birden sıfıra çekebilir (grup düzeyinde seyreklik)."
