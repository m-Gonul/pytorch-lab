id: m1-3-regularization
code: M1.3
title: "Regularization: ridge ve lasso"
phase: 1
minutes: 210
prereq: [m1-1-linreg, m1-2-gd-variants]
summary: >
  Ağırlıkları küçük tutmanın iki yolu. 2×2'lik bir ridge sistemini elle çözüp
  soft-threshold'u uyguluyor, saf Python'da coordinate descent ile lasso
  yazıyor, NumPy'da tüm regularization yolunu tek SVD'den çıkarıyor,
  PyTorch'ta `weight_decay`'in L2 cezasıyla ilişkisini kuruyor ve en sonda
  k-fold cross-validation'ı λ'lar üzerinde döngüsüz yapıyorsun.
goals:
  - "Ridge kapalı formunu $(X^\\top X+\\lambda I)w=X^\\top y$ olarak türetip uygulamak; bias'ın neden cezalandırılmadığını açıklamak"
  - "Lasso'nun [[soft-threshold]] adımıyla nasıl tam sıfır katsayı ürettiğini göstermek"
  - "Ridge yolunu $w(\\lambda)=V\\,\\text{diag}\\!\\big(\\tfrac{s}{s^2+\\lambda}\\big)U^\\top y$ ile tüm λ'lar için tek SVD'den hesaplamak"
  - "SGD'nin `weight_decay` parametresinin hangi L2 katsayısına karşılık geldiğini bulmak"
  - "[[cross-validation|Cross-validation]] ile λ seçmek"
sources:
  - {title: "ISLP — Bölüm 6.2 Shrinkage Methods (ridge, lasso)", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "Elements of Statistical Learning — Bölüm 3.4", url: "https://hastie.su.domains/ElemStatLearn/", license: "doğrulanmadı", use: link}
  - {title: "Dive into Deep Learning §3.7 Weight Decay", url: "https://d2l.ai/chapter_linear-regression/weight-decay.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "Friedman, Hastie, Tibshirani — Regularization Paths via Coordinate Descent (glmnet)", url: "https://www.jstatsoft.org/article/view/v033i01", license: "CC BY 3.0", use: link}

hand:
  groups:
    - title: "$X=\\begin{bmatrix}1&0\\\\0&1\\\\1&1\\end{bmatrix}$, $y=[1,2,3]$, bias yok. Önce $X^\\top X$ ve $X^\\top y$"
      layout: matrix
      rows: 2
      cols: 2
      fields:
        - {id: a11, label: "$(X^\\top X)_{11}$", answer: 2, hint: "1. sütunun kendisiyle iç çarpımı: $1+0+1$"}
        - {id: a12, label: "$(X^\\top X)_{12}$", answer: 1, hint: "1. ve 2. sütun: $0+0+1$"}
        - {id: xy1, label: "$(X^\\top y)_1$", answer: 4, hint: "$1+0+3$"}
        - {id: xy2, label: "$(X^\\top y)_2$", answer: 5, hint: "$0+2+3$"}
    - title: "Çözümler: OLS ($\\lambda=0$) ve ridge ($\\lambda=1$); $2\\times2$ ters: $\\frac1{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$"
      fields:
        - {id: o1, label: "OLS $w_1$", answer: 1, tol: 0.001, hint: "$\\frac13(2\\cdot4-1\\cdot5)$"}
        - {id: o2, label: "OLS $w_2$", answer: 2, tol: 0.001, hint: "$\\frac13(-1\\cdot4+2\\cdot5)$"}
        - {id: r1, label: "Ridge $w_1$", answer: 0.875, tol: 0.002, hint: "$X^\\top X+I=\\begin{bmatrix}3&1\\\\1&3\\end{bmatrix}$, det 8: $\\frac18(3\\cdot4-5)$"}
        - {id: r2, label: "Ridge $w_2$", answer: 1.375, tol: 0.002, hint: "$\\frac18(-4+3\\cdot5)$"}
    - title: "Soft-threshold $S(z,t)=\\text{sign}(z)\\max(|z|-t,0)$, $t=0.5$"
      fields:
        - {id: s1, label: "$S(1.5,\\,0.5)$", answer: 1, tol: 0.001, hint: "$1.5-0.5$"}
        - {id: s2, label: "$S(-0.3,\\,0.5)$", answer: 0, tol: 0.001, hint: "$|z|<t$ → tam sıfır"}
        - {id: s3, label: "$S(-2,\\,0.5)$", answer: -1.5, tol: 0.001, hint: "işaret korunur, büyüklük $t$ kadar küçülür"}
  verify: |
    X = [[1, 0], [0, 1], [1, 1]]; y = [1, 2, 3]
    A = [[sum(X[k][i] * X[k][j] for k in range(3)) for j in range(2)] for i in range(2)]
    c = [sum(X[k][i] * y[k] for k in range(3)) for i in range(2)]
    def solve(A, c):
        (a, b), (cc, d) = A; det = a * d - b * cc
        return (d * c[0] - b * c[1]) / det, (-cc * c[0] + a * c[1]) / det
    o = solve(A, c); r = solve([[A[0][0] + 1, A[0][1]], [A[1][0], A[1][1] + 1]], c)
    S = lambda z, t: (1 if z > 0 else -1) * max(abs(z) - t, 0)
    answers = dict(a11=A[0][0], a12=A[0][1], xy1=c[0], xy2=c[1], o1=o[0], o2=o[1], r1=r[0], r2=r[1],
                   s1=S(1.5, 0.5), s2=S(-0.3, 0.5), s3=S(-2, 0.5))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Lasso tam sıfır katsayı üretirken ridge neden üretmez?"
    options:
      - {t: "L1 cezasının 0'da köşesi var (türevi $[-\\lambda,\\lambda]$ aralığında); küçük gradyanlar bu aralığa düşünce optimum tam 0'da kalır. L2'nin 0'daki türevi 0, katsayı yalnız küçülür", ok: true, why: "Coordinate descent'te bu, soft-threshold'un $|z|<t$ için 0 döndürmesi olarak görünür. Geometrik olarak: L1 topu köşeli, kayıp elipsleri köşeye değer."}
      - {t: "Lasso daha büyük λ kullanır", why: "Aynı λ ile de davranış farkı var; konu cezanın şekli."}
      - {t: "Ridge'in kapalı formu sıfırı temsil edemez", why: "Edebilir; ama $(X^\\top X+\\lambda I)^{-1}X^\\top y$ genel durumda hiçbir bileşeni tam sıfır yapmaz."}
  - q: "Ridge'de özellikleri neden standardize ederiz?"
    options:
      - {t: "Ceza $\\lambda\\lVert w\\rVert^2$ tüm katsayılara aynı ağırlığı verir; birimi büyük (ör. milimetre) bir özelliğin katsayısı zaten küçük olduğu için daha az cezalanır", ok: true, why: "Ölçek değişince çözüm değişir: ridge ölçeğe göre değişmez değildir. OLS ise değişmezdir."}
      - {t: "Matris tersinin var olması için", why: "$\\lambda>0$ ile $X^\\top X+\\lambda I$ zaten her zaman terslenebilir."}
      - {t: "Hız için", why: "Konu sonucun anlamı, hız değil."}
  - q: "`SGD(weight_decay=wd)` hangi cezaya denk gelir?"
    options:
      - {t: "$\\frac{wd}{2}\\lVert w\\rVert^2$; çünkü gradyana $wd\\cdot w$ ekler", ok: true, why: "$\\nabla\\frac{wd}{2}\\lVert w\\rVert^2=wd\\cdot w$. Kayıpta $\\lambda\\lVert w\\rVert^2$ kullanıyorsan $wd=2\\lambda$. Adam'da ise eşdeğerlik bozulur; AdamW bunu düzeltir (M3.4)."}
      - {t: "$wd\\cdot\\lVert w\\rVert^2$", why: "Gradyanı $2wd\\cdot w$ olurdu; PyTorch yalnız $wd\\cdot w$ ekler."}
      - {t: "$wd\\cdot\\lVert w\\rVert_1$", why: "L1 cezası için ayrı bir parametre yok; elle eklenir."}
  - q: "k-fold CV'de standartlaştırma (ortalama/std) nerede yapılmalı?"
    options:
      - {t: "Her fold'un yalnız eğitim kısmıyla; doğrulama kısmına o fold'un istatistikleriyle uygulanır", ok: true, why: "Tüm veride standartlaştırıp bölmek, doğrulama bilgisini eğitime sızdırır ve CV hatasını iyimser gösterir (veri sızıntısı)."}
      - {t: "Tüm veride bir kez, bölmeden önce", why: "En yaygın hata bu: doğrulama fold'unun ortalaması/std'si eğitime sızar."}
      - {t: "Fark etmez; CV hatası ölçeklemeden bağımsız", why: "Etkilenir: sızıntı küçük görünür ama sistematik iyimserlik yaratır."}
  - q: "Elastic net'in tek koordinat çözümü (ölçekli öznitelikte) nedir?"
    options:
      - {t: "S(z, λ₁)/(1+λ₂): önce λ₁ eşiği, sonra λ₂'nin paydaya girdiği oransal büzülme", ok: true, why: "Türev w − z + λ₁·sign(w) + λ₂w = 0'dan gelir; λ₁ seyreklik, λ₂ kararlılık ve gruplama etkisi sağlar."}
      - {t: "S(z, λ₁ + λ₂): iki ceza tek eşikte toplanır", why: "λ₂ eşiklemez, paydaya girer; L2 cezasının türevi 2λ₂w sıfırlanmaz."}
      - {t: "S(z, λ₁)·(1+λ₂): büzülme çarpılarak güçlenir", why: "Ters yön: λ₂ w'yi daha çok küçültmez, w = S/(1+λ₂) ile böler."}

homework:
  - title: "Tibshirani (1996): Lasso"
    paper: "Tibshirani — Regression Shrinkage and Selection via the Lasso (JRSS-B 1996)"
    url: "https://www.jstor.org/stable/2346178"
    level: orta
    hours: 6
    goal: |
      Lasso'yu koordinat inişiyle (yumuşak eşikleme) yaz, düzenlileştirme yolunu (λ'ya göre katsayılar, makale Şekil 2) prostate veri setinde ya da sentetik seyrek bir problemde çiz; ridge ile karşılaştır. Seyrek gerçek katsayılı (s ≪ d) problemde destek kurtarma oranını λ'ya göre ölç; makalenin ortogonal tasarımdaki kapalı form çözümünü (Denk. 3: sign(β̂)(|β̂| − γ)₊) doğrula.
    steps:
      - "Sıcak başlangıçla (warm start) λ yolunu büyükten küçüğe izle."
    accept:
      - "Yol grafikleri: Lasso katsayıları tam sıfıra iner, ridge inmez."
      - "Ortogonal tasarımda kapalı formla birebir sonuç."

labs:
  - id: l1
    lab: biasvar
    title: "Derece, ridge λ ve veri miktarı: yanlılık–varyans"
    goal: |
      Aynı veriye giderek esnekleşen polinomlar uydur. Eğitim hatası dereceyle hep düşer; **test** hatası önce düşer sonra yükselir. Ridge cezası $\lambda\|w\|^2$ ağırlıkları küçülterek esnekliği dereceden bağımsız olarak kısar. Taban: gürültü varyansı $\sigma^2$'nin altına hiçbir model inemez.
    predict:
      q: "Derece 9, n = 15, λ ≈ 0. n'yi 200'e çıkarırsan test hatası ne olur?"
      options:
        - {t: "Belirgin düşer, σ²'ye yaklaşır", ok: true, why: "Varyans terimi ≈ (parametre sayısı)·σ²/n: n büyüdükçe esnek model de gürültüyü ezberleyemez."}
        - {t: "Değişmez; derece aynı", why: "Yanlılık değişmez ama varyans n ile azalır."}
        - {t: "Artar; daha çok gürültü var", why: "Gürültü düzeyi aynı, örnek sayısı arttı."}
    presets:
      - {name: "Aşırı uyum", params: {d: 12, lam: 1.0e-8, n: 15}, note: "13 parametre, 15 nokta: eğri noktalar arasında çılgınca salınır."}
      - {name: "Ridge kurtarır", params: {d: 12, lam: 0.01, n: 15}, note: "Aynı derece; ceza ağırlık normunu küçültür, test hatası düşer."}
      - {name: "Eksik uyum", params: {d: 1, lam: 1.0e-8, n: 50}, note: "Doğru eğriyi doğruyla yaklaşmak: eğitim hatası da yüksek."}
      - {name: "Çok veri", params: {d: 12, lam: 1.0e-8, n: 200}, note: "Varyans n ile söner."}
      - {name: "λ karşılaştırması", params: {d: 12, n: 20, lam: 1.0e-8, B: {lam: 0.05}}, note: "A cezasız, B ridge: kesikli çizgi B."}
    questions:
      - q: "Hata–λ grafiğinde λ çok büyüyünce test hatası neden yeniden yükseliyor?"
        a: "Ceza ağırlıkları sıfıra iter; model sabit fonksiyona yaklaşır (yüksek yanlılık). En iyi λ, iki uç arasındaki U'nun dibidir — çapraz doğrulamayla seçilir."
      - q: "Gürültü σ = 0 yapınca derece 15 hâlâ kötü mü?"
        a: "Gürültü yoksa varyans terimi ortadan kalkar; yüksek derece düzgün bir fonksiyonu iyi yaklaşır (sayısal koşul dışında). Aşırı uyum, gürültüyü öğrenmenin adıdır."
    limits: "Legendre tabanı ve kapalı form çözüm kullanılıyor (sayısal kararlılık için); x ∈ [−1, 1]'de düzgün örnekleme. Test hatası 200 noktalı ızgarada gerçek fonksiyona uzaklık + σ²."

  - id: l2
    lab: regpath
    title: "Ridge ve lasso yolları; doğrulama hatası ile λ seçimi"
    goal: |
      d öznitelikli sentetik veri: yalnız ilk k tanesi gerçekten etkili (kalın, renkli), diğerlerinin gerçek katsayısı 0 (gri kesikli). Sol grafik her katsayının λ ile nasıl değiştiğini, sağ grafik 400 ayrı doğrulama örneğinde hatayı gösterir. Ölçekleme: amaç $\frac1{2n}\|y-Xw\|^2+\lambda\,\Omega(w)$.
    predict:
      q: "Lasso'da λ'yı çok büyükten küçüğe doğru azaltırken hangi katsayılar ilk sıfırdan ayrılır?"
      options:
        - {t: "Artıkla korelasyonu en büyük olanlar — genelde gerçekten etkili ve büyük katsayılı öznitelikler", ok: true, why: "KKT: |xⱼᵀr|/n > λ olan öznitelik girer. λ_max'ta ilk giren, y ile en ilişkili özniteliktir."}
        - {t: "Hepsi aynı anda", why: "Bu ridge'in davranışıdır (hepsi birden, düzgünce)."}
        - {t: "Rastgele sırayla", why: "Sıra veriyle belirlenir; korelasyonlu özniteliklerde ise kararsız olabilir."}
    presets:
      - {name: "Seyrek gerçek, lasso", params: {method: 1, n: 40, d: 10, k: 3, rho: 0.3, noise: 1, lam: 0.1}, note: "Uygun λ'da 3 etkili öznitelik kalır, gerisi tam 0."}
      - {name: "Aynısı, ridge", params: {method: 0, n: 40, d: 10, k: 3, rho: 0.3, noise: 1, lam: 0.1}, note: "Gereksiz katsayılar küçülür ama sıfır olmaz."}
      - {name: "n < d", params: {method: 0, n: 15, d: 20, k: 3, rho: 0.3, noise: 1, lam: 0.1}, note: "En küçük kareler tanımsız (sonsuz çözüm); ridge her λ > 0 için tek çözüm verir."}
      - {name: "Çok ilişkili, lasso", params: {method: 1, n: 40, d: 10, k: 4, rho: 0.9, noise: 1, lam: 0.05}, note: "Lasso ilişkili grubun içinden birkaçını seçer; tohumu değiştir, seçim değişir."}
      - {name: "Yoğun gerçek", params: {method: 1, n: 60, d: 10, k: 10, rho: 0.3, noise: 1, lam: 0.05}, note: "Tüm öznitelikler etkiliyken lasso'nun seyreklik varsayımı yanlıştır; en iyi λ küçük çıkar."}
    questions:
      - q: "Doğrulama eğrisinin en sağında (büyük λ) hata neye yaklaşır?"
        a: "Tüm katsayılar 0: model yalnız ortalamayı tahmin eder; hata y'nin varyansına yaklaşır (yanlılık baskın)."
      - q: "En iyi doğrulama hatası neden σ²'nin altına inemez?"
        a: "σ² indirgenemez gürültüdür (yanlılık–varyans ayrışımının üçüncü terimi); en iyi model bile yeni örneklerin gürültüsünü tahmin edemez."
    limits: "Öznitelikler tek bir ortak faktörle eşit korelasyonlu Gauss. Doğrulama 400 ayrı örnekle yapılır (CV değil). Lasso coordinate descent ile, 200 tur ya da 10⁻⁷ değişime kadar."
  - id: l3
    lab: l1l2geom
    title: "Neden L1 seyreklik üretir? Elmasın köşeleri"
    goal: |
      Kayıp, cezasız optimum $w^*$ (gri) etrafında elipslerdir (koyu = küçük). Mavi şekil kısıt bölgesi, yeşil nokta kısıtlı çözüm, turuncu kesikli eğri çözümden geçen kayıp elipsi. Çözüm, büyüyen elipsin bölgeye ilk değdiği yerdir.
    predict:
      q: "w* = (2, 1), t = 1, elips neredeyse çember. L1 kısıtında çözüm nerededir?"
      options:
        - {t: "(1, 0) köşesinde: w₂ tam sıfır", ok: true, why: "w*'a en yakın elmas noktası köşedir; Öklid izdüşümü (2,1)'i köşeye taşır."}
        - {t: "(2/3, 1/3) gibi kenarın ortasında", why: "Bu, w* elmasın kenarına dik yönde olsaydı olurdu."}
        - {t: "(2, 1)", why: "w* bütçenin dışında: |2| + |1| = 3 > 1."}
    presets:
      - {name: "Köşe (seyrek)", params: {p: 0, wx: 2, wy: 1, t: 1, kap: 1, ang: 0}, note: "w₂ = 0."}
      - {name: "Aynısı, L2", params: {p: 1, wx: 2, wy: 1, t: 1, kap: 1, ang: 0}, note: "Çözüm (0.89, 0.45): iki katsayı da sıfırdan farklı."}
      - {name: "Kenar", params: {p: 0, wx: 1.5, wy: 1.4, t: 1, kap: 1, ang: 0}, note: "w* köşegene yakın: elmasın kenarına değer, seyreklik yok."}
      - {name: "Uzun elips", params: {p: 0, wx: 1.5, wy: 1.4, t: 1, kap: 10, ang: 0}, note: "Aynı w*, ama kayıp w₂ yönünde çok yatık (w₂'yi değiştirmek ucuz): çözüm (1, 0) köşesine kayar. Açıyı 90°'ye getir: bu kez w₁ = 0. Seyreklik verinin korelasyon yapısına da bağlıdır."}
      - {name: "Bütçe yeterli", params: {p: 0, wx: 0.6, wy: 0.3, t: 1.5, kap: 4, ang: 20}, note: "w* bölgenin içinde: ceza etkisiz, çözüm = w*."}
    questions:
      - q: "Bütçe t'yi küçültmek cezalı biçimde neye karşılık gelir?"
        a: "λ'yı büyütmeye. Her t'ye bir Lagrange çarpanı λ ≥ 0 karşılık gelir; t küçüldükçe λ büyür."
      - q: "Yüksek boyutta seyreklik neden daha olası?"
        a: "L1 topunun köşeleri ve düşük boyutlu yüzleri (bazı koordinatların sıfır olduğu kısımlar), yüzeyin büyük bölümünün 'yakalama alanını' oluşturur; rastgele bir elips büyük olasılıkla böyle bir yüze değer."
    limits: "İki boyut; kayıp kesin kuadratik. Çözüm izdüşümlü gradyan inişiyle (4000 adıma kadar) bulunur; sınırda sayısal hata ~10⁻⁹."

  - id: l4
    lab: shrinklab
    title: "Tek koordinatta küçültme: lasso, ridge ve elastic net"
    goal: |
      Cezasız çözüm z'yi sürükle, λ ve α ile cezayı ayarla. Üç eğri: lasso $S(z,\lambda)$ — sabit $\lambda$ kaydırma, küçük değerleri **tam sıfıra** çarpar; ridge $z/(1+\lambda)$ — oransal küçültme, sıfırlamaz; elastic net $S(z,\alpha\lambda)/(1+(1-\alpha)\lambda)$ — ikisinin çarpımı. Gölgeli bölge $\lvert z\rvert\le\lambda_1$: elastic net'in tam sıfır dediği alan.
    predict:
      q: "z = 0.5, λ = 1, α = 0.5 iken elastic net çıktısı kaçtır?"
      options:
        - {t: "0 — λ₁ = αλ = 0.5, |z| ≤ λ₁: soft-threshold tam sıfır verir", ok: true, why: "Eşik tam |z|'ye denk gelince w* = 0. Sınırda alt-gradyan koşulu sağlanır (ders metnindeki türetim)."}
        - {t: "1/3 — ridge küçültmesi z/(1+λ)", why: "Bu α = 0 (saf ridge) davranışı; λ₁ sıfır olmadığı sürece eşik devrede."}
        - {t: "0.25 — lasso küçültmesi S(z, λ)", why: "S(0.5, 1) zaten 0; üstelik elastic net paydaya (1+λ₂) da koyar."}
    presets:
      - {name: "Saf lasso (α = 1)", params: {lam: 1, alpha: 1, z: 0.7}, note: "S(0.7, 1) = 0: z λ'nın altında, katsayı tam sıfır. Ridge eğrisi z/(1+λ) ile küçülür ama sıfıra inmez."}
      - {name: "Saf ridge (α = 0)", params: {lam: 1, alpha: 0, z: 0.7}, note: "λ₁ = 0: lasso eğrisi kimliğe (S(z,0) = z) döner; ridge 0.7'yi 0.35'e indirir — yarıya böldü, sıfırlamadı."}
      - {name: "Elastic net (α = 0.5)", params: {lam: 1, alpha: 0.5, z: 0.7}, note: "w = S(0.7, 0.5)/1.5 = 0.2/1.5 ≈ 0.13: hem eşiğin hem oransal büzülmenin izi."}
      - {name: "Eşik üstü", params: {lam: 1, alpha: 0.5, z: 2.5}, note: "|z| = 2.5 > λ₁ = 0.5: katsayı hayatta kalır ama S ile λ₁ kayar, sonra (1+λ₂) ile oransal küçülür: 2/1.5 ≈ 1.33."}
      - {name: "λ büyüt", params: {lam: 2.5, alpha: 0.5, z: 0.7}, note: "λ₁ = 1.25, λ₂ = 1.25: sıfırlama bölgesi genişledi ve büzülme sertleşti — daha basit modeller."}
    questions:
      - q: "λ büyüdükçe lasso eğrisinin kırılma noktası (köşesi) nereye gider?"
        a: "Kırılma |z| = λ'dadır: λ büyüdükçe köşe sıfırdan uzaklaşır, daha geniş bir z aralığı tam sıfıra gider. Elastic net'te bu eşik λ₁ = αλ'dır."
      - q: "α'yı 1'e çekersen hangi eğri hangisiyle çakışır?"
        a: "λ₁ = λ, λ₂ = 0: elastic net eğrisi lasso eğrisiyle çakışır; ridge eğrisi z/(1+λ)'dan kimliğe, yani cezasız çözüme gider. α = 0'da tersi."
    limits: "Tek koordinat, (1/n)‖x‖² = 1 ölçeklemesi (öznitelikler standartlaştırılmış varsayımı); ders metnindeki tek koordinat türetimiyle birebir aynı formüller. z aralığı −4..4."

  - id: l5
    lab: svdlab
    title: "Ridge'in SVD bakışı: hangi yönler küçülür?"
    goal: |
      Ridge her tekil yönü kendi çarpanıyla küçültür: $s_j^2/(s_j^2+n\lambda)$. Sol grafik çubukları yön başına çarpanı, sağ grafik df(λ) = Σ çarpanlar — etkili serbestlik derecesini gösterir. Büyük tekil değerli (bilgi yüklü) yönler korunur; küçük olanlar (gürültü baskın) bastırılır. Koşul sayısının iyileşmesini de ölçüm tablosunda oku.
    predict:
      q: "s₁ = 5, s₆ = 0.3, n = 40, λ = 0.5 iken hangisi doğrudur?"
      options:
        - {t: "Büyük yön çoğunlukla korunur (çarpan ≈ 0.56), küçük yön fiilen sıfırlanır (≈ 0.004)", ok: true, why: "Çarpan s²/(s²+nλ): 25/(25+20) ≈ 0.56, 0.09/(0.09+20) ≈ 0.004. Ridge bilgi azlığına göre bastırır."}
        - {t: "Tüm yönler aynı oranda küçülür", why: "Sabit çarpan yalnız tüm tekil değerler eşitse olur; çarpan s_j'ye bağlıdır."}
        - {t: "Küçük yönler korunur, büyükler küçülür", why: "Tersi: verinin az değiştiği yönler gürültüye açıktır; ridge tam onları bastırır."}
    presets:
      - {name: "İyi koşullu", params: {sb: 5, ss: 2, n: 40, lam: 0.5}, note: "κ = 6.25: tüm çarpanlar 0.5'in üstünde, ridge hafif dokunuyor, df yüksek."}
      - {name: "Kötü koşullu", params: {sb: 5, ss: 0.1, n: 40, lam: 0.5}, note: "κ = 2500: küçük yönler bastırılır; koşul sayısı 2500'den çok daha küçük bir değere iner — çözüm kararlılaşır."}
      - {name: "λ küçük", params: {sb: 5, ss: 0.3, n: 40, lam: 0.01}, note: "nλ = 0.4: çarpanlar 1'e yakın, df ≈ 6 = d. Ceza fiilen yok."}
      - {name: "λ büyük", params: {sb: 5, ss: 0.3, n: 40, lam: 50}, note: "nλ = 2000: herkes bastırılır, df → 0; model ortalamayı tahmin eden sabite yaklaşır."}
      - {name: "Çok veri", params: {sb: 5, ss: 0.3, n: 200, lam: 0.5}, note: "nλ = 100 büyüdü: aynı λ çok daha sert vurur — ceza veriyle ölçeklenir, λ'yı n'ye göre seçmek gerekir."}
    questions:
      - q: "df(λ) neden model karmaşıklığının daha iyi ölçüsü?"
        a: "Ridge d parametre bildirir ama hiçbirini tam serbest bırakmaz: etkin serbestlik df(λ) = Σ s²/(s²+nλ). Cp/AIC türü ölçütler cezayı df ile verir; λ büyüdükçe model 'd parametreli' değil, df(λ) parametreli davranır."
      - q: "n büyüyünce aynı λ'nın etkisi neden artar?"
        a: "Çarpan s²/(s²+nλ)'da λ n ile ölçeklenir. Veri büyürken λ'yı sabit tutmak cezayı sertleştirir; pratikte λ n ile (ya da standartlaştırılmış ölçekte) taranır."
    limits: "6 tekil yön, geometrik alçalan spektrum (sb → ss arası). Gerçek problemlerde spektrum verinin şekline bağlıdır; burada yön kavramını net göstermek için basit spektrum kullanılıyor."

  - id: l6
    lab: cvlab
    title: "k-fold çapraz doğrulama ile λ seçimi; 1-SE kuralı"
    goal: |
      Veri k fold'a bölünür; her fold içinde merkezleme **yalnız eğitim kısmından** öğrenilir (sızıntı yok). Her λ için ridge yolu, o fold'un eğitim kısmından tek özdeğer ayrışımıyla tüm λ'lar için birden hesaplanır. Sol grafik ortalama CV hatası ± 1 std bandı; işaretler min kuralı ile 1-SE kuralının λ'ları. Sağ grafik fold'ların ayrı ayrı eğrileri — saçılmışlık, λ seçiminin belirsizliğidir.
    predict:
      q: "1-SE kuralı neden en iyi λ yerine daha büyük bir λ seçebilir?"
      options:
        - {t: "En iyinin bir standart hatası içinde kalan en büyük λ'yı (en basit modeli) seçer: benzer hata, daha az karmaşıklık", ok: true, why: "Eşik = min MSE + SE(min). Eşiğin altında kalan λ'ların en büyüğü seçilir; hata istatistiksel olarak aynı, model daha basit ve daha kararlı."}
        - {t: "Hata çok yüksek olduğu için", why: "Seçilen λ'nın hatası en iyiyle istatistiksel olarak ayrışmaz; fark basitlikte."}
        - {t: "Fold sayısı az olduğu için", why: "k daha çok fold = daha kararlı ölçüm; 1-SE kuralının mantığı fold sayısına bağlı değildir."}
    presets:
      - {name: "Temel", params: {k: 5, n: 60, d: 6, ktrue: 2, rho: 0.3, noise: 1}, note: "min ve 1-SE yakında: seçim kararlı, U eğrisi belirgin."}
      - {name: "Az veri", params: {k: 5, n: 30, d: 6, ktrue: 2, rho: 0.3, noise: 1}, note: "Fold eğrileri saçılıyor; 1-SE basitliği daha belirgin tercih eder."}
      - {name: "Gürültülü", params: {k: 5, n: 60, d: 6, ktrue: 2, rho: 0.3, noise: 2}, note: "σ² = 4 tabanı: en iyi CV hatası ona yaklaşır ama asla altına inemez."}
      - {name: "İlişkili öznitelikler", params: {k: 5, n: 60, d: 6, ktrue: 2, rho: 0.9, noise: 1}, note: "ρ = 0.9: küçük özdeğerli yönler çok — ridge'in faydası geniş λ bölgesinde görünür."}
      - {name: "10 fold", params: {k: 10, n: 60, d: 6, ktrue: 2, rho: 0.3, noise: 1}, note: "Daha çok fold: ortalama daha kararlı; ama her turda eğitim kümesi küçüldüğü için hata biraz yukarı kayabilir."}
    questions:
      - q: "Standartlaştırmayı tüm veride yapıp sonra fold'lara bölsaydık ne olurdu?"
        a: "Doğrulama fold'unun ortalama/std'si eğitime sızardı: CV hatası iyimser çıkar. Merkezleme ve ölçekleme her fold'un yalnız eğitim kısmıyla yapılır — bu deney de öyle yapıyor."
      - q: "k = n (leave-one-out) seçmek ne değiştirir?"
        a: "Her fold'da n−1 örnek eğitim: eğitimler birbirine çok benzer, CV tahmini az yanlı ama fold'lar bağımsız değil. Doğrusal modelde ridge yolu ucuz olduğundan hesap maliyeti kabul edilebilir; küçük k ise daha bağımsız fold'lar verir."
    limits: "Ridge yolu, her fold'un merkezlenmiş Gram matrisinin özdeğer ayrışımından (Jacobi) tüm λ'lar için birden hesaplanır — e aşamasındaki SVD formülünün Gram hilesi hâli. λ ızgarası 33 nokta (10⁻³…10), büyükten küçüğe. Sentetik veri ortak faktörlü Gauss, ön karıştırma yok: fold i, idx[i::k]."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Ridge çözümü ve özdeğer büzülmesi
    goal: Ridge'in katsayıları hangi yönlerde ne kadar küçülttüğünü görmek
    needs: Normal denklemler (M1.1), özayrışım
    q: |-
      $L(w)=\|Xw-y\|^2+\lambda\|w\|^2$'nin minimumunu bul ve $X=U D V^\top$ (SVD) cinsinden yorumla.
    solution: |-
      **Gradyan:** $\nabla L=2X^\top(Xw-y)+2\lambda w=0\Rightarrow(X^\top X+\lambda I)w=X^\top y$. $\lambda>0$ iken $X^\top X+\lambda I$ her zaman pozitif tanımlıdır (özdeğerleri $d_i^2+\lambda>0$), yani çözüm **her zaman tektir** — M1.1 P6'daki tekillik sorunu biter.

      **SVD ile:** $X^\top X=VD^2V^\top$, $X^\top y=VDU^\top y$. Yerine koy: $w_\lambda=V\,\mathrm{diag}\!\big(\tfrac{d_i}{d_i^2+\lambda}\big)U^\top y$. Karşılaştır: en küçük kareler $w_0=V\,\mathrm{diag}(1/d_i)\,U^\top y$.

      **Yorum:** $i$. tekil yön boyunca katsayı $\frac{d_i^2}{d_i^2+\lambda}$ oranında küçülür. Verinin çok değiştiği yönler ($d_i^2\gg\lambda$) neredeyse dokunulmaz; az bilgi taşıyan, gürültüye açık yönler ($d_i^2\ll\lambda$) neredeyse sıfırlanır. Etkin serbestlik derecesi $\sum_i\frac{d_i^2}{d_i^2+\lambda}$: λ = 0'da d, λ → ∞'da 0.
  - id: p2
    type: hesap
    level: 1
    title: Tek değişkenli ridge
    goal: Kapalı formu uygulamak
    needs: P1
    q: |-
      Kesişimsiz tek öznitelik: $\sum x_i^2=10$, $\sum x_iy_i=20$, $\lambda=10$. Ridge katsayısı $w$ kaç?
    answer: 1.0
    calc: "20/(10+10)"
    mistakes:
      - {answer: 2.0, msg: "λ'yı paydaya eklemeyi unuttun: bu cezasız en küçük kareler çözümü."}
      - {answer: 1.3333333333333333, msg: "Kayıpta λ‖w‖² varsa paydada λ, (λ/2)‖w‖² varsa λ/2 olur; burada kayıp L = ‖Xw−y‖² + λ‖w‖²."}
    hints:
      - "Tek boyutta $(X^\\top X+\\lambda)w=X^\\top y$."
    solution: |-
      $w=\frac{\sum x_iy_i}{\sum x_i^2+\lambda}=\frac{20}{20}=1$; cezasız çözüm 2 idi, ceza yarıya indirdi ($d^2/(d^2+\lambda)=0.5$).
  - id: p3
    type: hesap
    level: 1
    title: Yumuşak eşikleme
    goal: Lasso'nun tek koordinat çözümünü uygulamak
    needs: L1'in alt türevi
    q: |-
      $\min_w\frac12(w-z)^2+\lambda|w|$'nin çözümü $S_\lambda(z)=\mathrm{sign}(z)\max(|z|-\lambda,0)$. $z=1.2$, $\lambda=0.5$ için $w$?
    answer: 0.7
    calc: "1.2-0.5"
    mistakes:
      - {answer: 1.7, msg: "Ceza katsayıyı sıfıra doğru çeker: |z|'den λ çıkarılır."}
      - {answer: 0.7999999999999999, msg: "Bu L2 (ridge) büzülmesi: oranla küçültür. L1 sabit miktar (λ) çıkarır."}
    hints:
      - "$|z|>\\lambda$ mı?"
    solution: |-
      $|z|=1.2>0.5$ → $w=1.2-0.5=0.7$. $|z|\le\lambda$ olsaydı $w=0$: L1'in seyreklik üretmesi tam olarak bu eşikten gelir.
  - id: p4
    type: açıkla
    level: 2
    title: Neden L1 sıfırlar da L2 sıfırlamaz?
    goal: Seyrekliğin geometrisini kendi cümlelerinle açıklamak
    needs: P3, kontur çizgileri
    q: |-
      İki parametreli bir problemde L1 cezasının katsayıları tam sıfıra götürüp L2'nin götürmediğini hem geometrik hem cebirsel olarak açıkla.
    rubric:
      - "Kısıtlı biçimi ($\\|w\\|_1\\le t$ elmas, $\\|w\\|_2\\le t$ disk) çizdim/anlattım"
      - "Kayıp elipslerinin elmasa köşede (eksen üzerinde) değme olasılığının yüksek olduğunu söyledim"
      - "Cebirsel olarak: L2 cezasının türevi $2\\lambda w$ sıfırda kaybolur, L1'in alt türevi $[-\\lambda,\\lambda]$ sıfırı bir aralıkta 'tutar' dedim"
      - "Soft threshold ile ridge büzülmesini karşılaştırdım"
    hints:
      - "L2 cezasının $w$ küçükken itme kuvveti ne olur?"
    solution: |-
      Kısıtlı biçimde L1 bölgesi köşeleri eksenlerde olan bir elmastır; kayıp elipsi büyüdükçe bölgeye ilk değdiği nokta çoğunlukla bir köşedir — bir koordinat tam 0. L2 diski pürüzsüzdür; değme noktası genel konumdadır. Cebirsel: L2'nin cezası küçük $w$'de $\lambda w^2$, türevi $2\lambda w\to0$ — sıfıra yaklaşırken itme söner, katsayı küçülür ama sıfırlanmaz. L1'in itmesi $|w|$ ne kadar küçük olursa olsun sabit $\lambda$; veri gradyanı $\lambda$'dan küçükse katsayı sıfırda kalır (P3).
  - id: p5
    type: yöntem-seç
    level: 2
    title: İlişkili öznitelik grupları
    goal: Ridge, lasso, elastic net arasında seçim yapmak
    needs: P4
    q: |-
      1000 öznitelik; gerçekten ilgili olanlar 50, ama bunlar 10'luk gruplar hâlinde birbirleriyle çok ilişkili (aynı ölçümün farklı sensörleri). Hangisi?
    choices:
      - {t: "Lasso", why: "İlişkili gruptan genellikle keyfi tek bir öznitelik seçer ve seçim örneklemden örneklemle değişir."}
      - {t: "Ridge", why: "Grupları birlikte tutar ama 950 gereksiz özniteliği de sıfırlamaz."}
      - {t: "Elastic net (L1 + L2)", ok: true, why: "L1 seyreklik, L2 ilişkili öznitelikleri birlikte seçme (gruplama) etkisi verir."}
    hints:
      - "Lasso iki özdeş öznitelik arasında nasıl seçim yapar?"
    solution: |-
      Elastic net $\lambda_1\|w\|_1+\lambda_2\|w\|^2$: L2 terimi kesinlikle dışbükey yapar ve özdeş özniteliklere eşit ağırlık verdirir (gruplama), L1 terimi alakasız grupları sıfırlar (Zou & Hastie 2005).
  - id: p6
    type: birleştir
    level: 3
    title: Ridge = Gauss önsel ile MAP
    goal: Düzenlileştirmeyi olasılıksal yorumla bağlamak (M0.4)
    needs: Bayes kuralı, Gauss yoğunluğu
    q: |-
      $y_i=w^\top x_i+\varepsilon_i$, $\varepsilon_i\sim\mathcal N(0,\sigma^2)$, önsel $w\sim\mathcal N(0,\tau^2I)$. MAP kestiriminin ridge olduğunu göster ve λ'yı σ, τ cinsinden yaz. Lasso hangi önsele karşılık gelir?
    rubric:
      - "$\\log p(w|y)=\\log p(y|w)+\\log p(w)+$ sabit yazdım"
      - "Olabilirlikten $-\\|Xw-y\\|^2/2\\sigma^2$, önselden $-\\|w\\|^2/2\\tau^2$ terimlerinin çıktığını gösterdim"
      - "$\\lambda=\\sigma^2/\\tau^2$ buldum ve yorumladım (geniş önsel → az ceza)"
      - "Lasso'nun Laplace önseline karşılık geldiğini söyledim"
    hints:
      - "MAP = argmax log-posterior; sabitleri at."
      - "Her iki tarafı $-2\\sigma^2$ ile çarp."
    solution: |-
      $-\log p(w|y)=\frac1{2\sigma^2}\|Xw-y\|^2+\frac1{2\tau^2}\|w\|^2+c$. $2\sigma^2$ ile çarp: $\|Xw-y\|^2+\frac{\sigma^2}{\tau^2}\|w\|^2$ → ridge, $\lambda=\sigma^2/\tau^2$. Gürültü büyük ya da önsel dar → ceza büyük. Laplace önseli $p(w)\propto e^{-|w|/b}$ log'da $|w|/b$ verir → lasso, $\lambda=2\sigma^2/b$. **Fark:** MAP tek bir nokta verir; tam Bayes çözümü belirsizliği de taşır (posterior Gauss, ortalaması ridge çözümü).
  - id: p7
    type: hesap
    level: 1
    title: Elastic net'in tek koordinat çözümü
    goal: Payda ve eşiğin sırasını doğru kurmak
    needs: P3
    q: |-
      Standartlaştırılmış tek öznitelik: $\frac1n\lVert x\rVert^2=2$, $z=\frac1nx^\top y=1.2$. Elastic net $\lambda_1=1$, $\lambda_2=0.5$ iken katsayı $w$ kaç?
    answer: 0.08
    calc: "(1.2-1)/2.5"
    mistakes:
      - {answer: 0.1, msg: "Payda (1/n)‖x‖² = 2 yalnız; λ₂ paydaya eklenmeli: 2 + 0.5 = 2.5."}
      - {answer: 0.2, msg: "Paydayı tamamen unuttun: bu S(z, λ₁) sonucunun kendisi."}
      - {answer: 0.13333333333333333, msg: "Payda (1+λ₂) alındı; λ₂ ½‖w‖² cezasının paydasıdır: (1/n)‖x‖² + λ₂ = 2.5."}
    hints:
      - "Önce soft-threshold, sonra payda: S(z, λ₁)/((1/n)‖x‖² + λ₂)."
    solution: |-
      $S(1.2,\,1)=0.2$; payda $\frac1n\lVert x\rVert^2+\lambda_2=2+0.5=2.5$; $w=0.2/2.5=0.08$. Sıra önemli: önce eşik (L1), sonra oransal büzülme (L2'nin paydaya girişi). λ₂ = 0 olsaydı saf lasso formülüyle $w=0.2/2=0.1$ olurdu.
  - id: p8
    type: hesap
    level: 2
    title: 1-SE kuralı ile λ seçimi
    goal: CV çıktısından kuralı doğru uygulamak
    needs: P6, çapraz doğrulama
    q: |-
      5-fold CV üç λ'da şu ortalamaları (std) verdi: λ = 0.3 → 2.00 (0.50), λ = 0.1 → 1.90 (0.30), λ = 0.03 → 1.85 (0.20). 1-SE kuralı hangi λ'yı seçer?
    answer: 0.1
    calc: "0.1"
    mistakes:
      - {answer: 0.03, msg: "En düşük ortalamayı seçtin: bu min kuralı. 1-SE eşiği 1.85 + 0.20/√5 ≈ 1.94; 0.1 bu eşiğin içindeki en büyük λ."}
      - {answer: 0.3, msg: "0.3'ün ortalaması 2.00, eşik ≈ 1.94'ün üstünde: bütçe dışı. Std'si de yüksek."}
      - {answer: 1.85, msg: "1.85 bir λ değil, en iyi MSE'nin kendisi; kural λ'lar arasında seçim yapar."}
    hints:
      - "Eşik = min ort + std(min)/√k. Sonra eşiğin altında kalan λ'ların en büyüğü."
    solution: |-
      SE(min) = 0.20/√5 ≈ 0.089; eşik 1.85 + 0.089 ≈ 1.94. Eşiğin altında kalanlar: λ = 0.03 (1.85) ve λ = 0.1 (1.90). Aralarından **en büyük** λ seçilir: λ = 0.1. Hata istatistiksel olarak en iyiden ayrışmaz ama model daha basit, λ'ya karşı daha az hassastır.
pitfalls:
  - wrong: "Kesişim terimini (bias) de cezalandır."
    right: "Kesişimi cezalandırma; aksi hâlde model y'nin ortalamasını kaydırmak için cezalandırılır ve sonuç y'nin ölçeğine/öteleme seçimine bağlı olur."
  - wrong: "Öznitelikleri ölçeklemeden ridge/lasso uygulamak sorun değil."
    right: "Ceza katsayılara eşit davranır; birimi küçük (değerleri büyük) özniteliğin katsayısı küçük olacağı için az cezalanır. Önce standartlaştır."
  - wrong: "λ'yı test kümesinde en iyi sonucu verene göre seç."
    right: "λ bir hiperparametredir: doğrulama kümesi ya da çapraz doğrulamayla seçilir; test kümesi yalnız son raporlama içindir (M3.9 sızıntı)."
  - wrong: "k-fold CV'de standartlaştırmayı tüm veriye uygulayıp sonra fold'lara bölmek sorun değil."
    right: "Doğrulama fold'unun ortalama/std'si eğitime sızar; CV hatası iyimser çıkar. Merkezleme ve ölçekleme her fold'un yalnız eğitim kısmıyla yapılır (l6 deneyi bunu birebir uygular)."
whatif:
  - q: "n ≫ d (çok veri, az öznitelik) olsaydı ridge'e ihtiyaç kalır mı?"
    a: "Varyans terimi ≈ dσ²/n zaten küçüktür; en iyi λ 0'a yaklaşır. Ama öznitelikler çok ilişkiliyse (küçük tekil değerler) ridge yine kararlılık kazandırır."
  - q: "Ceza ‖w‖₂ (karesiz) olsaydı?"
    a: "Hâlâ dışbükey ama sıfırda türevlenemez; grup lasso'nun bir grubuna karşılık gelir: tüm vektörü birden sıfıra çekebilir (grup düzeyinde seyreklik)."
  - q: "Erken durdurmayı λ yerine süreyle ayarlayıp öğrenme oranını yarıya indirse idik ne değişirdi?"
    a: "Eşdeğer λ ≈ 1/(kη)'de η yarıya, k iki katına çıkarsa çarpım değişmez: aynı ≈ λ, yalnız süre iki kat. Erken durdurmanın cezası süre × öğrenme oranı çarpımıyla belirlenir — bu yüzden küçük η ile uzun eğitim, büyük η ile erken durdurmaya tercih edilir; aynı cezayı daha kısa sürede alırsın."

