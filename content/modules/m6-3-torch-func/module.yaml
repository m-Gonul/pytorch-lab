id: m6-3-torch-func
code: M6.3
title: "torch.func: vmap, grad, jvp, jacrev"
phase: 6
minutes: 270
prereq: [m6-1-autograd-internals]
summary: >
  Fonksiyonel dönüşümlerle türev. Örnek başı gradyanları, Jacobian'ı, JVP/VJP'yi
  ve Hessian-vektör çarpımını elle hesaplıyor, saf Python'da dual sayılarla
  forward-mode AD yazıyor, NumPy'da lojistik regresyon için örnek başı
  gradyan ve Hessian'ı matris oluşturmadan çarpan HVP'yi kuruyor, PyTorch'ta
  `vmap(grad(…))`, `jacrev`/`jacfwd` ve `jvp(grad)` kullanıyor ve en sonda
  örnek başı kırpmalı DP-SGD adımını vmap ile yazıyorsun.
goals:
  - "Forward-mode ([[jvp]]) ve reverse-mode (VJP) AD'nin maliyet asimetrisini bilmek: girdi mi çıktı mı az?"
  - "`functional_call` ile modeli parametrelerin saf fonksiyonu olarak görmek"
  - "`vmap(grad(f))` ile örnek başı gradyan almak"
  - "Hessian'ı kurmadan Hessian-vektör çarpımı (forward-over-reverse)"
sources:
  - {title: "PyTorch Docs — torch.func (functorch) ve tutorial'ları: per-sample gradients, Jacobians/Hessians", url: "https://docs.pytorch.org/docs/stable/func.html", license: "BSD-3-Clause", use: adapt}
  - {title: "JAX — The Autodiff Cookbook", url: "https://docs.jax.dev/en/latest/notebooks/autodiff_cookbook.html", license: "Apache-2.0", use: adapt}
  - {title: "Baydin ve ark. — Automatic Differentiation in Machine Learning: a Survey", url: "https://arxiv.org/abs/1502.05767", license: "arXiv", use: link}
  - {title: "Abadi ve ark. — Deep Learning with Differential Privacy (DP-SGD)", url: "https://arxiv.org/abs/1607.00133", license: "arXiv", use: link}

hand:
  groups:
    - title: "$\\ell_i(w)=(wx_i-y_i)^2$, $w=1$, örnekler $(x,y)=(1,3),(2,1)$"
      fields:
        - {id: g1, label: "Örnek 1'in gradyanı", answer: -4}
        - {id: g2, label: "Örnek 2'nin gradyanı", answer: 4}
        - {id: gm, label: "Ortalama gradyan", answer: 0, hint: "Örnek başı normlar 4, ortalama 0: DP-SGD neden örnek başı kırpar"}
    - title: "$f(x_1,x_2)=(x_1x_2,\\ x_1^2)$, $x=(1,2)$"
      fields:
        - {id: jvp1, label: "JVP $J v$, $v=(1,1)$: 1. bileşen", answer: 3, hint: "$J=\\begin{bmatrix}2&1\\\\2&0\\end{bmatrix}$"}
        - {id: vjp1, label: "VJP $u^\\top J$, $u=(1,1)$: 1. bileşen", answer: 4}
        - {id: hvp1, label: "$g(x)=x_1^2x_2$ için $Hv$, $v=(1,0)$: 1. bileşen", answer: 4, hint: "$H=\\begin{bmatrix}2x_2&2x_1\\\\2x_1&0\\end{bmatrix}$"}
  verify: |
    import numpy as np
    w, xs, ys = 1.0, [1.0, 2.0], [3.0, 1.0]
    gs = [2 * (w * x - y) * x for x, y in zip(xs, ys)]
    J = np.array([[2.0, 1.0], [2.0, 0.0]])
    H = np.array([[4.0, 2.0], [2.0, 0.0]])
    answers = dict(g1=gs[0], g2=gs[1], gm=sum(gs) / 2, jvp1=(J @ [1, 1])[0], vjp1=(np.array([1, 1]) @ J)[0], hvp1=(H @ [1, 0])[0])

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "$f:\\mathbb R^{1000}\\to\\mathbb R^{3}$ fonksiyonunun tam Jacobian'ı için hangisi daha ucuz?"
    options:
      - {t: "Reverse-mode (`jacrev`): 3 VJP", ok: true, why: "Reverse-mode çıktı sayısı kadar, forward-mode girdi sayısı kadar geçiş ister. Kayıp fonksiyonları (çıktı 1) için backprop bu yüzden ideal."}
      - {t: "Forward-mode (`jacfwd`): 1000 JVP", why: "Girdi boyutu büyük; forward-mode pahalı."}
      - {t: "İkisi aynı", why: "Maliyet giriş/çıkış boyutuna göre asimetrik."}
  - q: "`vmap(grad(loss))(params, x, y)` neden örnek başı döngüden çok daha hızlıdır?"
    options:
      - {t: "vmap batch boyutunu işlemlerin içine iter: B ayrı küçük geri geçiş yerine tek bir batch'li geri geçiş çalışır", ok: true, why: "Örneğin her matmul batch'li bir matmul'e dönüşür; Python döngüsü ve kernel başlatma maliyeti kalkar."}
      - {t: "Gradyanları yaklaşık hesapladığı için", why: "Sonuç birebir aynı (e aşamasında karşılaştırıyorsun)."}
      - {t: "Paralel thread'ler açtığı için", why: "Mekanizma vektörleştirme, thread değil."}
  - q: "Hessian-vektör çarpımı için `jvp(grad(f), (x,), (v,))` (forward-over-reverse) neden tercih edilir?"
    options:
      - {t: "Maliyeti birkaç gradyan hesabı kadar; $d\\times d$ Hessian hiç kurulmaz", ok: true, why: "Newton-CG, eğrilik analizi, influence functions gibi yöntemler bu yüzden milyonlarca parametrede çalışabilir."}
      - {t: "Tam Hessian'dan daha doğru", why: "Aynı sayı; fark maliyet."}
      - {t: "Yalnız konveks fonksiyonlarda çalışır", why: "Her iki kez türevlenebilir fonksiyonda çalışır."}
