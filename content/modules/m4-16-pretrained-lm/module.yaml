id: m4-16-pretrained-lm
code: M4.16
title: Önceden eğitilmiş LM'ler — ELMo, BERT, BART, GPT, RLHF ve DPO
phase: 4
minutes: 400
prereq: [m4-14-transformer-ed, m4-12-word2vec]
summary: >
  Sabit gömmelerden (word2vec) bağlamsal gömmelere: ELMo'nun çift yönlü
  LSTM dil modeli ve katman karışımı, GPT-1'in yalnız kod çözücülü ön eğitimi
  ve tek doğrusal katmanla ince ayarı, BERT'in maskeli dil modeli (15%;
  80/10/10) ve sonraki cümle tahmini, BART'ın gürültü giderici
  kodlayıcı–kod çözücüsü, GPT-2/3'ün ölçek ve sıfır/az örnekli kullanımı,
  InstructGPT/ChatGPT'nin insan geri bildirimiyle pekiştirmeli öğrenmesi
  (ödül modeli, KL cezalı ödül) ve DPO. Saf Python'da MLM maskesi ve BERT
  parametre sayımı, NumPy'da toplu maskeleme, ELMo karışımı, dizi log
  olasılıkları ve Bradley–Terry ödül modeli, PyTorch'ta sentetik bir dilde
  MLM ön eğitimi → az etiketle ince ayar, sonda DPO'nun analitik optimum
  politikaya yakınsaması. Ekler: best-of-n'in KL'si, BART gürültüleri, ELECTRA.
goals:
  - "[[bağlamsal gömme]]: ELMo (biLSTM), GPT (kod çözücü), BERT (kodlayıcı), BART (kodlayıcı–kod çözücü)"
  - "[[maskeli dil modeli]]: %15 seçim, 80/10/10 kuralı; ön eğitim + ince ayar vs sıfırdan"
  - "RLHF: [[bradley–terry modeli|Bradley–Terry]] ödül modeli, KL cezalı ödül"
  - "[[dpo]]: kapalı form optimum $\\pi^*\\propto\\pi_{ref}e^{r/\\beta}$ ve kayıp"
sources:
  - {title: "Peters ve ark. — Deep contextualized word representations (ELMo, NAACL 2018)", url: "https://arxiv.org/abs/1802.05365", license: "arXiv", use: link}
  - {title: "Radford ve ark. — Improving Language Understanding by Generative Pre-Training (GPT-1, 2018)", url: "https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf", license: "©", use: link}
  - {title: "Devlin ve ark. — BERT (NAACL 2019)", url: "https://arxiv.org/abs/1810.04805", license: "arXiv", use: link}
  - {title: "Lewis ve ark. — BART (ACL 2020)", url: "https://arxiv.org/abs/1910.13461", license: "arXiv", use: link}
  - {title: "Brown ve ark. — Language Models are Few-Shot Learners (GPT-3, NeurIPS 2020)", url: "https://arxiv.org/abs/2005.14165", license: "arXiv", use: link}
  - {title: "Ouyang ve ark. — Training language models to follow instructions with human feedback (InstructGPT, 2022)", url: "https://arxiv.org/abs/2203.02155", license: "arXiv", use: link}
  - {title: "Rafailov ve ark. — Direct Preference Optimization (NeurIPS 2023)", url: "https://arxiv.org/abs/2305.18290", license: "arXiv", use: link}
  - {title: "Clark ve ark. — ELECTRA (ICLR 2020)", url: "https://arxiv.org/abs/2003.10555", license: "arXiv", use: link}
  - {title: "Hugging Face LLM Course — Transformer models, fine-tuning", url: "https://huggingface.co/learn/llm-course", license: "Apache-2.0", use: link}
  - {title: "Stanford CS224n — Pretraining; Post-training (RLHF, DPO)", url: "https://web.stanford.edu/class/cs224n/", license: "©", use: link}

hand:
  groups:
    - title: "BERT"
      fields:
        - {id: sel, label: "512 token'lık dizide MLM için seçilen token sayısının beklentisi", answer: 76.8, tol: 1.0e-9}
        - {id: rnd, label: "Bunlardan rastgele token'la değiştirilenlerin beklentisi", answer: 7.68, tol: 1.0e-9}
        - {id: bert, label: "BERT-base parametresi: V = 30 522, 512 konum, 2 segment, d = 768, 12 katman, FFN 3072, pooler dahil (MLM başı hariç)", answer: 109482240}
    - title: "GPT ölçeği ($\\approx12Ld^2$)"
      fields:
        - {id: gpt2, label: "GPT-2: L = 48, d = 1600", answer: 1474560000}
        - {id: gpt3, label: "GPT-3: L = 96, d = 12 288", answer: 173946175488}
    - title: "RLHF ve DPO"
      fields:
        - {id: bt, label: "Ödül modeli: $r(y_w)=2$, $r(y_l)=0.5$ → $-\\log\\sigma(r_w-r_l)$", answer: 0.20141327798275246, tol: 1.0e-6}
        - {id: kl, label: "KL cezalı ödül $r-\\beta\\log(\\pi/\\pi_{ref})$: r = 1, β = 0.1, log oran 2", answer: 0.8, tol: 1.0e-9}
        - {id: dpo, label: "DPO, β = 0.1: $\\log\\frac{\\pi_\\theta}{\\pi_{ref}}(y_w)=2$, $(y_l)=-1$ → kayıp", answer: 0.5543552444685271, tol: 1.0e-6}
  verify: |
    import math
    sig = lambda x: 1 / (1 + math.exp(-x))
    d = 768
    layer = 4 * (d * d + d) + 2 * d * 3072 + 3072 + d + 4 * d
    emb = (30522 + 512 + 2) * d + 2 * d
    answers = dict(sel=512 * 0.15, rnd=512 * 0.15 * 0.1, bert=emb + 12 * layer + d * d + d, gpt2=12 * 48 * 1600 ** 2, gpt3=12 * 96 * 12288 ** 2,
                   bt=-math.log(sig(1.5)), kl=1 - 0.1 * 2, dpo=-math.log(sig(0.1 * (2 - (-1)))))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Best-of-n örnekleme ve KL bütçesi", engine: browser}
  - {id: x2, title: "BART'ın gürültü fonksiyonları", engine: browser}
  - {id: x3, title: "ELECTRA: değiştirilmiş token tespiti", engine: browser}

quiz:
  - q: "BERT neden seçilen token'ların hepsini [MASK] yapmaz (80/10/10)?"
    options:
      - {t: "[MASK] ince ayarda ve çıkarımda hiç görülmez; ön eğitim–ince ayar uyumsuzluğunu azaltmak ve modelin her token'ın temsilini anlamlı tutması için bazen rastgele ya da aynı token bırakılır", ok: true, why: "Model hangi token'ın bozulduğunu bilemez; her konumda bağlamdan tahmin yapmak zorunda kalır."}
      - {t: "Hesap tasarrufu için", why: "Maliyet aynı."}
      - {t: "Sözlüğü genişletmek için", why: "Hayır."}
  - q: "GPT-1 ile BERT'in temel mimari farkı nedir?"
    options:
      - {t: "GPT yalnız kod çözücü (nedensel maske, soldan sağa LM); BERT yalnız kodlayıcı (çift yönlü attention, MLM). BART ikisini kodlayıcı–kod çözücüde birleştirir", ok: true, why: "Ders slaytındaki üçlü şema."}
      - {t: "BERT LSTM kullanır", why: "Bu ELMo."}
      - {t: "GPT çift yönlüdür", why: "Nedenseldir."}
  - q: "DPO RLHF'in hangi adımlarını ortadan kaldırır?"
    options:
      - {t: "Ayrı bir ödül modeli eğitmeyi ve PPO ile örnekleme tabanlı RL döngüsünü: KL cezalı ödül maksimizasyonunun kapalı form optimumu, ödülü politika/referans log oranıyla ifade eder ve tercih verisinde doğrudan sınıflandırma kaybı olur", ok: true, why: "Rafailov ve ark. 2023; e aşamasında optimuma yakınsama gözlenir."}
      - {t: "Tercih verisini", why: "DPO da tercih verisi kullanır."}
      - {t: "Referans modeli", why: "Referans model kayıpta yer alır."}

homework:
  - title: "Devlin ve ark. (2019): küçük bir BERT"
    paper: "Devlin, Chang, Lee, Toutanova — BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding (NAACL 2019)"
    url: "https://arxiv.org/abs/1810.04805"
    level: ileri
    hours: 18
    goal: |
      d aşamasındaki kodlayıcıyı WikiText-103'ün bir alt kümesinde (BPE, M4.5) MLM + NSP ile ön eğit (L = 4, d = 256); SST-2 ve MRPC'de (GLUE) ince ayar yap. Makale Tablo 5'in küçük ablasyonu: (a) NSP'siz, (b) yalnız soldan sağa LM (GPT tarzı, nedensel maske), (c) 80/10/10 yerine %100 [MASK] (Tablo 8). Ayrıca öznitelik tabanlı kullanımı (dondurulmuş katmanların ağırlıklı toplamı, ELMo tarzı) ince ayarla karşılaştır.
    steps:
      - "Ön eğitim adım sayısını sabit tut; ablasyonları aynı bütçeyle eğit."
    accept:
      - "Çift yönlü MLM, soldan sağa LM'den GLUE'da iyi."
      - "%100 [MASK] özellikle öznitelik tabanlı kullanımda geride kalır."
  - title: "Rafailov ve ark. (2023): DPO'yu küçük bir LM'de"
    paper: "Rafailov, Sharma, Mitchell, Ermon, Manning, Finn — Direct Preference Optimization: Your Language Model is Secretly a Reward Model (NeurIPS 2023)"
    url: "https://arxiv.org/abs/2305.18290"
    level: ileri
    hours: 14
    goal: |
      Makale Bölüm 6.1'in "kontrollü duygu üretimi" deneyini küçük ölçekte tekrarla: GPT-2 small'ı (ya da M8.1'deki mini-LLM'i) IMDb film yorumu önekleriyle referans politika olarak kullan; bir duygu sınıflandırıcısını "gerçek ödül" say, tercih çiftlerini ondan üret. DPO ile PPO-RLHF'i (ödül modeli + KL cezalı PPO, M11.12) ödül–KL sınırında (Şekil 2 sol) karşılaştır; β ve tercih verisi miktarını değiştir.
    steps:
      - "KL'yi tamamlama düzeyinde $\\sum_t\\log\\pi_\\theta/\\pi_{ref}$ ile tahmin et."
    accept:
      - "DPO aynı KL'de PPO'dan yüksek ya da eşit ödül verir."
      - "β küçüldükçe ödül ve KL birlikte artar (sınır eğrisi)."

labs:
  - id: l1
    lab: softmaxT
    title: "Örnekleme sıcaklığı: aynı logitler, farklı dağılımlar"
    goal: "Dil modeli bir sonraki token için logit üretir; örnekleme $p\\propto e^{z/T}$'den yapılır. T < 1 dağılımı keskinleştirir (tekrarcı, güvenli), T > 1 düzleştirir (yaratıcı, hatalı). Sabit eklemek hiçbir şeyi değiştirmez — softmax kayma değişmezdir."
    presets:
      - {name: "Greedy'ye yakın", params: {T: 0.1}, note: "Neredeyse argmax."}
      - {name: "Yaratıcı", params: {T: 2}, note: "Kuyruktaki token'ların payı belirgin."}
      - {name: "Kayma değişmezliği", params: {shift: 40, B: {shift: -40}}, note: "Çubuklar birebir aynı."}
    questions:
      - q: "Entropi T ile nasıl değişir? Hangi T'de ln K'ya ulaşır?"
        a: "Monoton artar; yalnız T → ∞ limitinde (ya da tüm logitler eşitse) ln K olur."
    limits: "Sabit, yapay logit dizisi; gerçek modellerde top-k/top-p ile kuyruk ayrıca kesilir."

  - id: l2
    lab: noiselab
    title: "Ön eğitim amaçlarının gürültüleri: MLM, BART, ELECTRA"
    goal: |
      Aynı Türkçe paragrafı BERT'in maskeli dil modeli (80/10/10), BART'ın beş gürültü fonksiyonu ve ELECTRA'nın değiştirilmiş token tespiti ile boz. Bozulmuş metni, bozulan token sayısını ve kaybın dizinin ne kadarından sinyal aldığını karşılaştır.
    predict:
      q: "BERT'in MLM'sinde (p = 0.15) kaybın sinyal aldığı konumların oranı nedensel dil modelininkinin kaçta kaçıdır?"
      options:
        - {t: "Aynı: her konum tahmin edilir", why: "Yalnız seçilen %15 konumda kayıp hesaplanır."}
        - {t: "≈ 0.15", ok: true, why: "Seçilmeyen konumlar kayba girmez; bu örnekte 32 konumdan 4'ü (%12.5). ELECTRA'da ayırt edici her konumda karar verir: 32/32."}
        - {t: "≈ 0.5", why: "NSP'deki %50 ile karıştırılmamalı."}
    presets:
      - {name: "BERT MLM", params: {mode: 0, p: 0.15}, note: "4 token seçildi (beklenti 4.05); kayıp 32 konumun 4'ünde."}
      - {name: "Yüksek maskeleme", params: {mode: 0, p: 0.4}, note: "p = 0.4: daha çok sinyal, ama bağlam azalır; tahmin edilecek kelimenin komşuları da maskeli."}
      - {name: "BART metin doldurma", params: {mode: 3, p: 0.3, lam: 3}, note: "Poisson(3) uzunluklu aralıklar tek <mask> ile değişir; bozulmuş dizi kısalır, model eksik token sayısını da tahmin etmeli."}
      - {name: "Cümle karıştırma", params: {mode: 4}, note: "Beş cümlenin sırası karışıyor; kelimeler tam ama söylem yapısı bozuk."}
      - {name: "ELECTRA", params: {mode: 6, p: 0.15, gacc: 0.3}, note: "Üretecin önerdiği tokenlar seçilen konumlara konuyor; ayırt edici 32 konumun hepsinde gerçek/değiştirilmiş kararı veriyor."}
    questions:
      - q: "Metin doldurmada aralığın tamamı neden tek bir <mask> ile değiştirilir?"
        a: "Böylece model yalnız eksik kelimeleri değil kaç kelimenin eksik olduğunu da tahmin etmek zorunda kalır. Her token için ayrı maske koymak (BERT) uzunluk bilgisini ele verir."
      - q: "ELECTRA'da üreteç doğru tokenı önerirse o konum nasıl etiketlenir, neden?"
        a: "'Özgün' olarak etiketlenir. Ayırt edicinin görevi 'bu token bu bağlamda doğru mu?' sorusudur; üreteç doğru tokenı bulduysa o konumda bozulma yoktur."
    limits: "Tek bir kısa paragraf; ELECTRA'nın üreteci burada rastgele bir sözlük örneği (gerçekte küçük bir MLM). Sinyal oranı, kaybın hangi konumlarda hesaplandığını sayar; konum başına bilgi miktarı amaçlar arasında farklıdır."
  - id: l3
    lab: rlhfdpo
    title: "KL cezalı optimum, best-of-n ve DPO"
    goal: |
      K olası yanıtlı tam izlenebilir bir oyuncakta referans politika ve gerçek ödül rastgele seçilir. KL cezalı amacın kapalı form optimumunu, best-of-n seçimini ve Bradley–Terry ile etiketlenmiş tercih çiftlerinde eğitilen DPO politikasını ödül–KL düzleminde karşılaştır.
    predict:
      q: "DPO'yu 300 yerine 3000 tercih çiftiyle eğitirsen öğrenilen politika KL cezalı optimum π*'a ne kadar yaklaşır?"
      options:
        - {t: "Değişmez: DPO kapalı form çözümü zaten kullanır", why: "Kapalı form gerçek ödül için geçerli; DPO ödülü sonlu tercihlerden örtük kestirir."}
        - {t: "Çok yaklaşır", ok: true, why: "Ölçülen KL(π_DPO‖π*): 300 çiftte 0.56, 3000 çiftte 0.005."}
        - {t: "Uzaklaşır: daha çok veri aşırı uyum demektir", why: "Daha çok veri, ödül farklarının kestirimini iyileştirir."}
    presets:
      - {name: "Varsayılan", params: {K: 12, sharp: 1, beta: 0.5, n: 4, N: 300, steps: 800}, note: "π*: E[r] 1.68, KL 1.40; best-of-4: 1.01, KL 0.62; DPO: 1.38, KL 1.36; KL(π_DPO‖π*) = 0.56."}
      - {name: "Bol tercih verisi", params: {N: 3000}, note: "DPO π*'a yakınsıyor: E[r] 1.68, KL(π_DPO‖π*) = 0.005."}
      - {name: "Az veri", params: {N: 20}, note: "20 çift: DPO KL'si 1.93'e çıkıyor ama ödülü 1.28'de kalıyor (KL(π_DPO‖π*) = 1.33): az görülen yanıtlara gürültülü ağırlık."}
      - {name: "Küçük β", params: {beta: 0.1}, note: "π* çok sivri (KL 2.58, E[r] 2.02); 300 çiftle DPO bu hedefin çok uzağında (KL(π_DPO‖π*) = 5.9)."}
      - {name: "Best-of-64", params: {n: 64}, note: "Best-of-64: E[r] 2.02, KL 2.56 (sınır log 64 − 63/64 = 3.17). Eğitim yok, ama her istemde 64 kat çıkarım."}
    questions:
      - q: "DPO kaybında bölüşüm fonksiyonu Z neden hiç hesaplanmaz?"
        a: "Örtük ödül r = β log(π/π_ref) + β log Z'dir; Bradley–Terry yalnız iki yanıtın ödül farkına bağlı olduğu için β log Z farkta sadeleşir."
      - q: "Best-of-n ile KL cezalı optimum aynı KL bütçesinde neden farklı ödül verir?"
        a: "KL cezalı optimum, verilen KL'de beklenen ödülü en büyükleyen dağılımdır (tanımı gereği sınırın üstündedir). Best-of-n basit bir seçim kuralıdır; ödül–KL düzleminde sınırın altında ama ona yakın kalır ve eğitim gerektirmez."
    limits: "Tek istem, K ayrık yanıt, tablo politikası; gerçek dil modellerinde yanıt uzayı üstel büyüklüktedir ve politika bir ağ olduğu için π* tam temsil edilemeyebilir. Gerçek ödül biliniyor; RLHF'nin ödül modeli hatası (sömürü) burada modellenmiyor."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: BERT'in 80/10/10 maskeleme kuralı
    goal: Maskeleme stratejisinin gerekçesini anlamak
    needs: Maskeli dil modeli
    q: |-
      BERT token'ların %15'ini tahmin hedefi seçer; bunların %80'ini [MASK], %10'unu rastgele bir token, %10'unu olduğu gibi bırakır. 512 token'lık bir dizide beklenen [MASK] sayısı kaç? Neden hepsi [MASK] değil?
    solution: |-
      **Sayı:** $512\cdot0.15\cdot0.8=61.4$ [MASK]; ayrıca ~7.7 rastgele, ~7.7 değişmemiş hedef. Toplam ~76.8 tahmin hedefi.

      **Gerekçe:** [MASK] ince ayar ve çıkarımda hiç görünmez. Hepsi [MASK] olsaydı model yalnız [MASK] konumlarında iyi temsil öğrenmeyi, diğer token'ların temsillerini ise önemsememeyi öğrenebilirdi (ön eğitim–ince ayar uyuşmazlığı). Rastgele token, modeli her konumun "bozulmuş olabileceğine" karşı hazırlar; değiştirilmemiş hedefler, gerçek token'ın temsilinin de iyi olmasını teşvik eder.

      **Bedel:** her dizide yalnız %15 konumdan kayıp gelir: otoregresif LM'e göre örnek verimliliği düşüktür. ELECTRA tüm konumlardan sinyal alarak bunu düzeltir.
  - id: p2
    type: hesap
    level: 1
    title: Beklenen [MASK] sayısı
    goal: P1'i uygulamak
    needs: P1
    q: |-
      256 token'lık dizide beklenen [MASK] token sayısı?
    answer: 30.72
    calc: "256*0.15*0.8"
    tol: 1e-6
    mistakes:
      - {answer: 38.4, msg: "Bu tüm tahmin hedefleri; yalnız %80'i [MASK] ile değiştirilir."}
    hints:
      - "$256\\cdot0.15\\cdot0.8$."
    solution: |-
      $30.72$.
  - id: p3
    type: hesap
    level: 1
    title: Bradley–Terry tercih olasılığı
    goal: Ödül modelinin olasılık yorumunu kullanmak
    needs: Sigmoid
    q: |-
      Ödül modeli: $r(a)=1.5$, $r(b)=-0.5$. $P(a\succ b)=\sigma(r(a)-r(b))$?
    answer: 0.8807970779778823
    calc: "1/(1+math.exp(-2))"
    tol: 1e-3
    mistakes:
      - {answer: 0.8175744761936437, msg: "Fark kullanılır: 1.5 − (−0.5) = 2."}
    hints:
      - "$\\sigma(2)$."
    solution: |-
      $\sigma(2)=0.881$. Ödül yalnız farkla tanımlıdır: tüm ödüllere sabit eklemek tercihleri değiştirmez.
  - id: p4
    type: yöntem-seç
    level: 2
    title: Sınıflandırma için hangi ön eğitimli model?
    goal: Kodlayıcı, kod çözücü ve kodlayıcı–kod çözücü arasında seçmek
    needs: BERT, GPT, BART
    q: |-
      Etiketli 5000 örnekle müşteri yorumlarında duygu sınıflandırması yapacaksın; çıkarım ucuz olmalı. Hangisi?
    choices:
      - {t: "Yalnız kod çözücülü büyük LM ile metin üretip cevabı ayrıştırmak", why: "Çalışır ama çıkarım pahalı; küçük ince ayarlı kodlayıcı genelde daha ucuz ve iyi."}
      - {t: "BERT tarzı kodlayıcı + sınıflandırma başlığıyla ince ayar", ok: true, why: "Çift yönlü bağlam, tek ileri geçiş; anlama görevleri için standart."}
      - {t: "word2vec ortalaması + lojistik regresyon", why: "Güçlü taban çizgisi; bağlam ve kelime sırası kaybolur."}
    hints:
      - "Görev üretim mi, anlama mı?"
    solution: |-
      Anlama görevlerinde çift yönlü kodlayıcı (BERT/RoBERTa/DeBERTa) ince ayarı verimli ve güçlüdür. Etiket çok azsa büyük LM ile az örnekli istem (few-shot prompting) bir alternatif; bu durumda taban çizgisi olarak hep raporlanmalı.
  - id: p5
    type: birleştir
    level: 3
    title: DPO'nun RLHF'den farkı
    goal: Tercih öğrenmede ödül modelinin rolünü tartışmak
    needs: P3, M4.16 anlatımı, KL ıraksaması (M5.1)
    q: |-
      RLHF: ödül modeli eğit, sonra KL cezalı RL (PPO) ile politikayı optimize et. DPO bunu tek bir sınıflandırma benzeri kayba indirger. Hangi gözlem bunu mümkün kılar ve ne kaybedilir/kazanılır?
    rubric:
      - "KL kısıtlı ödül en büyüklemenin kapalı form çözümünü ($\\pi^*\\propto\\pi_{ref}e^{r/\\beta}$) yazdım"
      - "Bunu ödül için çözüp ($r=\\beta\\log\\frac{\\pi}{\\pi_{ref}}+$ sabit) Bradley–Terry'ye koyunca sabitin sadeleştiğini söyledim"
      - "Kazanç: ayrı ödül modeli ve RL döngüsü yok, kararlı; kayıp: çevrimiçi keşif yok, sabit tercih verisine bağlı"
      - "β'nın referans modelden uzaklaşmayı kontrol ettiğini belirttim"
    hints:
      - "Ödül, politikanın kendisi cinsinden yazılabilir mi?"
    solution: |-
      $\max_\pi\mathbb E[r]-\beta\mathrm{KL}(\pi\|\pi_{ref})$'nin çözümü $\pi^*(y|x)=\frac1Z\pi_{ref}(y|x)e^{r(x,y)/\beta}$. Ters çevir: $r=\beta\log\frac{\pi^*}{\pi_{ref}}+\beta\log Z(x)$. Bradley–Terry yalnız ödül farkına baktığı için $Z(x)$ sadeleşir: $\mathcal L=-\log\sigma\big(\beta\log\frac{\pi(y_w)}{\pi_{ref}(y_w)}-\beta\log\frac{\pi(y_l)}{\pi_{ref}(y_l)}\big)$ (Rafailov ve ark. 2023). Kazanç: basit, kararlı, ödül modeli yok. Kayıp: politika kendi örnekleriyle keşif yapmaz; dağılım dışına genelleme ve aşırı optimizasyon davranışı farklıdır.
pitfalls:
  - wrong: "BERT metin üretmek için idealdir."
    right: "Çift yönlü maskeli model doğal bir soldan sağa olasılık vermez; üretim için otoregresif (GPT) ya da kodlayıcı–kod çözücü (BART/T5) kullanılır."
  - wrong: "Ön eğitimli modelin tüm katmanlarını her zaman ince ayarlamak gerekir."
    right: "Az veride son katmanları ya da adaptörleri (LoRA) eğitmek daha kararlı ve ucuzdur; büyük öğrenme oranı ön eğitim bilgisini silebilir (felaket unutma)."
whatif:
  - q: "Maskeleme oranı %15'ten %40'a çıkarılırsa?"
    a: "Wettig ve ark. (2023) büyük modellerde %40'ın %15'ten iyi olabildiğini gösterdi; çok yüksek oranda bağlam yetersiz kalır."
