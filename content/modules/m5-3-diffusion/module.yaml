id: m5-3-diffusion
code: M5.3
title: Diffusion (DDPM) ve flow matching
phase: 5
minutes: 360
prereq: [m5-1-vae]
summary: >
  Gürültü ekleyip geri almayı öğrenmek. İki adımlık bir ileri süreçte
  $x_t$'yi ve geri adımın ortalamasını elle hesaplıyor, saf Python'da tek
  boyutlu Gauss veri için kapalı formdaki "kâhin" gürültü tahmincisiyle DDPM
  örnekleyicisi yazıyor, NumPy'da tüm örnekleri paralel yürüten DDPM ve
  DDIM örnekleyicilerini kuruyor, PyTorch'ta bir gürültü tahmin ağı eğitip
  8 Gauss'lu halkayı üretiyor ve en sonda flow matching ile aynı işi birkaç
  Euler adımında yapıyorsun.
goals:
  - "Kapalı form $q(x_t\\mid x_0)$ ve $\\varepsilon$-tahmini eğitim amacını türetmek"
  - "DDPM geri adımını ve DDIM'in deterministik adımını uygulamak"
  - "Örnekleyiciyi eğitilmiş bir ağdan bağımsız, kapalı formdaki optimal tahminciyle doğrulamak"
  - "[[flow matching]]: doğrusal yol, hız hedefi $x_1-x_0$ ve ODE ile örnekleme"
sources:
  - {title: "Ho, Jain, Abbeel — Denoising Diffusion Probabilistic Models", url: "https://arxiv.org/abs/2006.11239", license: "arXiv", use: link}
  - {title: "Song, Meng, Ermon — Denoising Diffusion Implicit Models", url: "https://arxiv.org/abs/2010.02502", license: "arXiv", use: link}
  - {title: "Lipman ve ark. — Flow Matching for Generative Modeling", url: "https://arxiv.org/abs/2210.02747", license: "arXiv", use: link}
  - {title: "Liu, Gong, Liu — Rectified Flow", url: "https://arxiv.org/abs/2209.03003", license: "arXiv", use: link}
  - {title: "fast.ai Part 2 — From Deep Learning Foundations to Stable Diffusion", url: "https://course.fast.ai/Lessons/part2.html", license: "course22p2 kodu Apache-2.0", use: adapt}
  - {title: "Prince — Understanding Deep Learning, Bölüm 18 (Diffusion)", url: "https://udlbook.github.io/udlbook/", license: "kitap ©; notebook'lar MIT", use: link}
  - {title: "MIT 6.S184 — Generative AI with Stochastic Differential Equations (flow matching notları)", url: "https://diffusion.csail.mit.edu/", license: "doğrulanmadı", use: link}

hand:
  groups:
    - title: "$\\beta_1=0.1$, $\\beta_2=0.2$; $x_0=2$, $\\varepsilon=0.5$ (1'den başlayan $t$)"
      fields:
        - {id: ab2, label: "$\\bar\\alpha_2=(1-\\beta_1)(1-\\beta_2)$", answer: 0.72}
        - {id: x2, label: "$x_2=\\sqrt{\\bar\\alpha_2}\\,x_0+\\sqrt{1-\\bar\\alpha_2}\\,\\varepsilon$", answer: 1.961632, tol: 0.0005}
        - {id: x0h, label: "$\\hat x_0=(x_2-\\sqrt{1-\\bar\\alpha_2}\\,\\varepsilon)/\\sqrt{\\bar\\alpha_2}$", answer: 2, tol: 0.0005}
    - title: "Geri adım (doğru $\\varepsilon$ ile): $\\mu=\\frac1{\\sqrt{\\alpha_2}}\\big(x_2-\\frac{\\beta_2}{\\sqrt{1-\\bar\\alpha_2}}\\varepsilon\\big)$"
      fields:
        - {id: mu, label: "$\\mu$", answer: 1.981884, tol: 0.0005}
        - {id: var, label: "$\\tilde\\beta_2=\\frac{1-\\bar\\alpha_1}{1-\\bar\\alpha_2}\\beta_2$", answer: 0.071429, tol: 0.0005}
        - {id: fmv, label: "Flow matching: $z=-1$, $x_1=3$, $t=0.25$ için $x_t=(1-t)z+tx_1$", answer: 0, hint: "Hız hedefi her $t$'de $x_1-z=4$"}
  verify: |
    import math
    b1, b2, x0, e = 0.1, 0.2, 2.0, 0.5
    ab1 = 1 - b1; ab2 = ab1 * (1 - b2)
    x2 = math.sqrt(ab2) * x0 + math.sqrt(1 - ab2) * e
    answers = dict(ab2=ab2, x2=x2, x0h=(x2 - math.sqrt(1 - ab2) * e) / math.sqrt(ab2),
                   mu=(x2 - b2 / math.sqrt(1 - ab2) * e) / math.sqrt(1 - b2),
                   var=(1 - ab1) / (1 - ab2) * b2, fmv=0.75 * -1 + 0.25 * 3)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "DDPM neden $x_0$ yerine eklenen gürültü $\\varepsilon$'u tahmin edecek şekilde eğitilir?"
    options:
      - {t: "İkisi birbirine $x_t$ üzerinden doğrusal olarak bağlı; ama $\\varepsilon$-tahmini tüm $t$'lerde benzer ölçekte bir hedef verir ve kayıp, ELBO'nun yeniden ağırlıklandırılmış hâline denk gelir", ok: true, why: "Ho ve ark. 'basitleştirilmiş' kaybın ($\\lVert\\varepsilon-\\varepsilon_\\theta\\rVert^2$) örnek kalitesini artırdığını gösterdi. $x_0$- ya da $v$-tahmini de kullanılır."}
      - {t: "$x_0$ bilinmediği için", why: "Eğitimde $x_0$ biliniyor; $x_t$'yi ondan üretiyoruz."}
      - {t: "Gürültü tahmini örneklemeyi deterministik yapar", why: "Determinizm DDIM'in güncelleme kuralından gelir."}
  - q: "DDIM, aynı eğitilmiş ağla neden çok daha az adımda örnekleyebilir?"
    options:
      - {t: "Aynı marjinallere sahip deterministik (ODE benzeri) bir süreç tanımlar; adımları seyreltmek bir ODE'yi daha büyük adımlarla çözmek gibidir", ok: true, why: "Yeniden eğitim gerekmez: eğitim yalnız $q(x_t\\mid x_0)$ marjinallerine bağlı."}
      - {t: "Farklı bir kayıpla eğitildiği için", why: "DDPM ile aynı ağı kullanır."}
      - {t: "Gürültüyü daha büyük ekler", why: "η = 0'da hiç gürültü eklemez."}
  - q: "Flow matching'te tek Euler adımıyla ($z\\to z+v(z,0)$) örnek üretmek neden genelde bulanık sonuç verir?"
    options:
      - {t: "$v(z,0)$, $z$ verildiğinde $x_1-z$'nin koşullu beklentisi; tek adım tüm olası hedeflerin ortalamasına gider", ok: true, why: "e aşamasında Gauss için bunu tam görüyorsun: tek adım her örneği ortalamaya taşır, varyans sıfıra iner. Yollar kesiştiği için çok adım gerekir (rectified flow bunları düzleştirmeye çalışır)."}
      - {t: "Euler yöntemi kararsız olduğu için", why: "Kararlılık sorunu değil; ortalama alma etkisi."}
      - {t: "Ağ yeterince eğitilmediği için", why: "Kâhin (optimal) hızla bile aynı sonuç çıkar."}

extras:
  - {id: x1, title: "İleri süreç: √(1 − β) ölçeklemesi, varyansın 1'e yakınsaması, SNR", engine: browser}
  - {id: x2, title: "Geri adımın kapalı formu q(x_(t−1) | x_t, x₀): Monte Carlo doğrulama", engine: browser}

homework:
  - title: "Ho, Jain, Abbeel (2020): DDPM"
    paper: "Ho, Jain, Abbeel — Denoising Diffusion Probabilistic Models (NeurIPS 2020)"
    url: "https://arxiv.org/abs/2006.11239"
    level: ileri
    hours: 16
    goal: |
      Küçük bir U-Net (zaman embedding'i, artık bloklar, 16×16'da self-attention) ile MNIST ya da CIFAR-10'da DDPM eğit (T = 1000, doğrusal β, ε-tahmini, basitleştirilmiş kayıp L_simple). Makale Tablo 2'nin ablasyonunu küçük ölçekte yap: ε- vs μ̃-tahmini, sabit σ² = β vs β̃ (x2), L_simple vs ağırlıklı VLB; FID'i (M5.7) raporla. Şekil 6'daki "aşamalı üretim" görselini (x̂₀'ın t'ye göre değişimi) üret.
    steps:
      - "EMA'lı ağırlıklarla örnekle (makale: 0.9999)."
    accept:
      - "ε-tahmini + L_simple en iyi FID."
      - "Büyük t'de x̂₀ kaba yapıyı, küçük t'de ayrıntıyı belirler."
  - title: "Song, Meng, Ermon (2021): DDIM"
    paper: "Song, Meng, Ermon — Denoising Diffusion Implicit Models (ICLR 2021)"
    url: "https://arxiv.org/abs/2010.02502"
    level: orta
    hours: 8
    goal: |
      Yukarıdaki eğitilmiş DDPM'i yeniden eğitmeden DDIM ile örnekle: adım sayısı S ∈ {10, 20, 50, 100, 1000} ve η ∈ {0, 0.5, 1} için FID tablosu (makale Tablo 1). η = 0'da aynı x_T'den farklı S ile üretilen görüntülerin tutarlılığını ve gizli uzayda interpolasyonu (Şekil 6, slerp — M5.1 x3) göster.
    steps:
      - "Alt dizi seçimi: doğrusal ve karesel aralıklı τ."
    accept:
      - "η = 0, az adımda DDPM'den çok daha iyi FID."
      - "Aynı x_T farklı S'lerde benzer üst düzey yapı üretir."

labs:
  - id: l1
    lab: diffsched
    title: "Gürültü takvimi: ᾱ_t, SNR ve gürültülenmiş sinyal"
    goal: |
      İleri süreç kapalı formda: $x_t=\sqrt{\bar\alpha_t}x_0+\sqrt{1-\bar\alpha_t}\,\varepsilon$, $\bar\alpha_t=\prod_{s\le t}(1-\beta_s)$. Takvim, sinyal-gürültü oranının ($\mathrm{SNR}=\bar\alpha/(1-\bar\alpha)$) zamanla nasıl söndüğünü belirler. Son adımda $\bar\alpha_T\approx0$ olmalı ki örnekleme N(0, I)'dan başlayabilsin.
    predict:
      q: "Doğrusal takvim (10⁻⁴ → 0.02, T = 1000): SNR = 1'e (ᾱ = 0.5) hangi t civarında ulaşılır?"
      options:
        - {t: "t ≈ 500", why: "β doğrusal artarken log ᾱ ≈ −Σβ karesel azalır."}
        - {t: "t ≈ 260", ok: true, why: "Σβ ≈ 10⁻⁴t + 10⁻⁵t² = ln 2 → t ≈ 260."}
        - {t: "t ≈ 900", why: "Doğrusal takvim sinyali erken söndürür."}
    presets:
      - {name: "Doğrusal vs kosinüs", params: {kind: 0, B: {kind: 1}}, note: "Kosinüs SNR'yi daha dengeli düşürür: adımlar ortada yoğunlaşır."}
      - {name: "Kısa T", params: {T: 50, t: 40}, note: "β aynı aralıkta ama 50 adım: ᾱ_T ≈ 0.6 — son adımda veri hâlâ duruyor (örneklemeyle uyuşmaz)."}
      - {name: "Sonda", params: {t: 900}, note: "Sinyal neredeyse görünmüyor; bu adımlar 'kaba yapı', erken adımlar 'ince ayrıntı' üretir."}
    questions:
      - q: "T'yi 1000'den 200'e indirip β aralığını değiştirmezsen ne bozulur?"
        a: "ᾱ_T büyür (≈ 0.13): son x_T hâlâ sinyal içerir ama örnekleme saf gürültüden başlar. DDPM'de T küçültülünce β_T büyütülür (M8.2'de 0.05)."
    limits: "Tek bir 1B sinyal; ε her ayar değişiminde aynı tohumla yeniden çekilir."

  - id: l2
    lab: diff1d
    title: "Kâhin gürültü tahminiyle DDPM ve DDIM: adım sayısı ve takvim"
    goal: |
      Veri iki tepeli bir Gauss karışımı; bu durumda en iyi gürültü tahmini E[ε | x_t] kapalı formdadır (kâhin). Eğitim hatası olmadan DDPM ve DDIM örnekleyicilerini çalıştır. Adım sayısı, takvim ve T değişince örneklerin dağılımının veriye ne kadar uyduğunu ölç; 12 örneğin gürültüden veriye yörüngesini izle.
    predict:
      q: "Kâhin ε ile DDIM'i yalnız 3 adımla çalıştırırsan örneklerin ne kadarı bir tepenin yakınına düşer?"
      options:
        - {t: "Neredeyse hepsi: kâhin kusursuz", why: "Kâhin her adımda doğru ε'yu verir ama büyük adımlarda x̂₀ tahmini iki tepe arasında kalır."}
        - {t: "Yaklaşık yarısı", ok: true, why: "Ölçülen: 3 adımda %48.7, 5 adımda %86.7, 20 adımda %99.4 (DDPM 200 adımda %99.9)."}
        - {t: "Hiçbiri", why: "Bir kısmı yine tepelere düşer."}
    presets:
      - {name: "DDPM, T = 200", params: {sampler: 0, T: 200, sched: 0, m: 2, w: 0.3, n: 1000}, note: "Sol tepe oranı 0.308 (hedef 0.3); örneklerin %99.9'u bir tepenin yakınında."}
      - {name: "DDIM, 20 adım", params: {sampler: 1, steps: 20, T: 200}, note: "20 ağ değerlendirmesiyle %99.4: DDPM'nin 200 adımına yakın."}
      - {name: "DDIM, 3 adım", params: {sampler: 1, steps: 3, T: 200}, note: "Örneklerin yalnız %48.7'si tepelerde; sol tepe oranı 0.17'ye düşüyor."}
      - {name: "Kısa zincir, kosinüs", params: {sampler: 0, T: 20, sched: 1}, note: "Kosinüs takvimiyle 20 adımlık DDPM bile tepeleri buluyor (%99.9)."}
    questions:
      - q: "Kâhin varken DDIM neden az adımda bozuluyor?"
        a: "Her adımda x̂₀ = (x_t − √(1−ᾱ)ε̂)/√ᾱ, x_t'ye göre E[x₀|x_t] tahminidir. Gürültü yüksekken bu tahmin iki tepenin ağırlıklı ortalamasıdır. Büyük bir adım bu ortalamayı doğrudan düşük gürültüye taşır ve örnek tepelerin arasında kalır. Küçük adımlarda belirsizlik kademeli çözülür."
    limits: "Tek boyut ve kapalı form kâhin; gerçek ağlar kâhinin yaklaşığıdır ve hataları da katılır. Doğrusal takvimde β_T = min(0.5, 0.02·1000/T) olarak T'ye göre ölçeklenir."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: "q(x_t | x_0) kapalı formu"
    goal: Adım adım gürültülemenin tek adımda yazılabildiğini türetmek
    needs: Bağımsız Gauss'ların toplamı
    q: |-
      $x_t=\sqrt{\alpha_t}x_{t-1}+\sqrt{1-\alpha_t}\varepsilon_t$, $\alpha_t=1-\beta_t$, $\varepsilon_t\sim\mathcal N(0,I)$ bağımsız. $x_t=\sqrt{\bar\alpha_t}x_0+\sqrt{1-\bar\alpha_t}\varepsilon$ olduğunu tümevarımla göster.
    solution: |-
      **Taban:** $t=1$: $\bar\alpha_1=\alpha_1$ ✓.

      **Adım:** $x_{t-1}=\sqrt{\bar\alpha_{t-1}}x_0+\sqrt{1-\bar\alpha_{t-1}}\varepsilon'$ varsay. Yerine koy:
      $x_t=\sqrt{\alpha_t\bar\alpha_{t-1}}x_0+\underbrace{\sqrt{\alpha_t(1-\bar\alpha_{t-1})}\varepsilon'+\sqrt{1-\alpha_t}\varepsilon_t}_{\text{iki bağımsız sıfır ortalamalı Gauss}}$.

      Bağımsız Gauss'ların toplamı Gauss'tur, varyanslar toplanır: $\alpha_t-\alpha_t\bar\alpha_{t-1}+1-\alpha_t=1-\bar\alpha_t$. Dolayısıyla gürültü terimi $\sqrt{1-\bar\alpha_t}\varepsilon$ ✓.

      **Neden önemli:** eğitimde her örnek için rastgele bir $t$ seçip $x_t$'yi tek adımda üretebiliriz — $t$ adım simüle etmeye gerek yok. **Varsayım:** gürültüler bağımsız ve Gauss; bu bozulursa (ör. ilişkili gürültü) kapalı form değişir.
  - id: p2
    type: hesap
    level: 1
    title: Gürültülü örnek
    goal: Kapalı formu uygulamak
    needs: P1
    q: |-
      $\bar\alpha_t=0.36$, $x_0=2$, $\varepsilon=0.5$. $x_t$?
    answer: 1.6
    calc: "0.6*2+0.8*0.5"
    mistakes:
      - {answer: 1.04, msg: "Katsayılar karekök: √ᾱ = 0.6, √(1 − ᾱ) = 0.8."}
    hints:
      - "$\\sqrt{0.36}=0.6$, $\\sqrt{0.64}=0.8$."
    solution: |-
      $0.6\cdot2+0.8\cdot0.5=1.6$.
  - id: p3
    type: hesap
    level: 1
    title: ε tahmininden x₀ tahmini
    goal: Ağın ε çıktısını veri tahminine çevirmek
    needs: P1
    q: |-
      $x_t=1.6$, $\bar\alpha_t=0.36$, ağın tahmini $\hat\varepsilon=0.5$. $\hat x_0$?
    answer: 2.0000000000000004
    calc: "(1.6-0.8*0.5)/0.6"
    mistakes:
      - {answer: 1.8333333333333335, msg: "ε̂'yı √(1 − ᾱ) = 0.8 ile çarpmayı unuttun."}
      - {answer: 1.2000000000000002, msg: "√ᾱ = 0.6'ya bölmeyi unuttun."}
    hints:
      - "Kapalı formu $x_0$ için çöz."
    solution: |-
      $\hat x_0=(x_t-\sqrt{1-\bar\alpha}\hat\varepsilon)/\sqrt{\bar\alpha}=(1.6-0.4)/0.6=2$ (ε̂ doğru olduğu için tam $x_0$). DDIM bu $\hat x_0$'ı kullanır ve kırpar (M8.2).
  - id: p4
    type: yöntem-seç
    level: 2
    title: ε mi, x₀ mı, v mi tahmin etmeli?
    goal: Tahmin hedefinin farklı SNR'lerdeki davranışını değerlendirmek
    needs: P3
    q: |-
      Çok yüksek gürültüde ($\bar\alpha\approx0$) ε tahmininden $\hat x_0=(x_t-\sqrt{1-\bar\alpha}\hat\varepsilon)/\sqrt{\bar\alpha}$ hesaplamak neden sorunludur ve hangi hedef bu bölgede daha kararlıdır?
    choices:
      - {t: "Sorun yok; ε her yerde en iyisi", why: "√ᾱ → 0'a bölmek ε̂'deki küçük hatayı dev x̂₀ hatasına çevirir."}
      - {t: "v-tahmini (v = √ᾱ ε − √(1−ᾱ) x₀): iki ucun ortasında ölçekli, x̂₀ ve ε̂'ya kararlı biçimde çevrilir", ok: true, why: "Salimans & Ho 2022; damıtma ve sıfır son-SNR takvimlerinde standart."}
      - {t: "Hiçbir hedef çalışmaz; T'yi azalt", why: "Hedef seçimi bu sorunu doğrudan çözer."}
    hints:
      - "$\\bar\\alpha\\to0$ iken P3'teki bölme ne olur?"
    solution: |-
      ε-tahmininde düşük SNR'de $\hat x_0$'ın hatası $\sqrt{(1-\bar\alpha)/\bar\alpha}$ ile büyür (sonsuza gider). x₀-tahmini yüksek SNR'de kötüdür (küçük farkları öğrenmek zor). v-tahmini iki ucu dengeler. Hepsi aynı bilgiyi taşır; fark, kaybın SNR'lere nasıl ağırlık verdiği ve sayısal kararlılıktır.
  - id: p5
    type: birleştir
    level: 3
    title: Denoising ↔ skor eşlemesi
    goal: ε-tahmininin skor fonksiyonunu kestirdiğini göstermek
    needs: Gauss yoğunluğunun log-gradyanı, M5.6 (gürültü giderici AE)
    q: |-
      $q(x_t|x_0)=\mathcal N(\sqrt{\bar\alpha}x_0,(1-\bar\alpha)I)$ için $\nabla_{x_t}\log q(x_t|x_0)=-\varepsilon/\sqrt{1-\bar\alpha}$ olduğunu göster. Bu, ε-tahmin eden ağın neyi öğrendiği hakkında ne söyler?
    rubric:
      - "Gauss log-yoğunluğunun gradyanını $-(x_t-\\sqrt{\\bar\\alpha}x_0)/(1-\\bar\\alpha)$ olarak yazdım"
      - "Kapalı formla payın $\\sqrt{1-\\bar\\alpha}\\,\\varepsilon$ olduğunu yerine koydum"
      - "MSE ile eğitilmiş ağın koşullu beklenen değeri, dolayısıyla marjinal skoru $\\nabla\\log q(x_t)$ kestirdiğini (Vincent 2011) söyledim"
      - "Bunun örneklemenin skor tabanlı/SDE yorumuna bağlandığını ekledim"
    hints:
      - "$\\nabla_x\\log\\mathcal N(x;m,s^2I)=-(x-m)/s^2$."
    solution: |-
      $\nabla_{x_t}\log q=-\frac{x_t-\sqrt{\bar\alpha}x_0}{1-\bar\alpha}=-\frac{\sqrt{1-\bar\alpha}\varepsilon}{1-\bar\alpha}=-\frac{\varepsilon}{\sqrt{1-\bar\alpha}}$. MSE ile eğitilen $\hat\varepsilon(x_t,t)$, $\mathbb E[\varepsilon|x_t]$'ye yakınsar; beklenen değerin doğrusallığıyla bu, $-\sqrt{1-\bar\alpha}\,\nabla\log q(x_t)$ — marjinal **skor**. Dolayısıyla difüzyon modeli bir gürültü giderici otomatik kodlayıcıdır (M5.6) ve aynı zamanda veri dağılımının gürültülenmiş sürümlerinin skorlarını öğrenir; DDPM/DDIM bu skorla ters SDE/ODE'yi çözer.
pitfalls:
  - wrong: "Difüzyon modeli her adımda görüntünün tamamını yeniden üretir."
    right: "Ağ gürültüyü (ya da x̂₀'ı) tahmin eder; örnekleme bu tahminle küçük bir adım atar."
  - wrong: "T büyüdükçe örnekleme kalitesi otomatik artar."
    right: "Eğitimde T ince taneli bir zaman ayrıklaştırmasıdır; örneklemede DDIM ile çok daha az adım yeterli olabilir (M8.2: 10 adım ≈ 25 adım)."
  - wrong: "Son adımda x_T tamamen gürültüdür."
    right: "Takvime bağlıdır: ᾱ_T > 0 kalırsa sinyal sızar ve eğitim–örnekleme uyuşmazlığı doğar (deney: 'Kısa T')."
whatif:
  - q: "Gürültü Gauss değil de maskeleme (token silme) olsaydı?"
    a: "Kesikli difüzyon (D3PM, maskeli difüzyon dil modelleri) elde edilir; kapalı form geçiş matrislerinin çarpımıyla yazılır."
  - q: "Ağ t'yi girdi olarak almasaydı?"
    a: "Gürültü düzeyini girdiden kestirmek zorunda kalır; mümkün ama zor ve düşük SNR'de belirsiz. Zaman embedding'i bu yüzden standart (M8.2)."
