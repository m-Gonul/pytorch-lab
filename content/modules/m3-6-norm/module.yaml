id: m3-6-norm
code: M3.6
title: BatchNorm, LayerNorm, RMSNorm
phase: 3
minutes: 240
prereq: [m3-5-init]
summary: >
  Aktivasyonları her adımda yeniden ölçeklemek. Üç örnekte BatchNorm'un ileri
  ve (meşhur) geri geçişini elle hesaplıyor, saf Python'da yazıyor, NumPy'da
  CS231n'in train/test modlu BatchNorm'unu ve LayerNorm'unu kuruyor,
  PyTorch'ta `nn.BatchNorm1d` ve `nn.RMSNorm` ile bit düzeyinde eşleşen kendi
  modüllerini yazıyor ve en sonda BN/LN/IN/GN'yi tek bir "hangi eksenlerde
  normalize?" fonksiyonuna indiriyorsun.
goals:
  - "BatchNorm'un ileri geçişini ve sadeleşmiş geri geçiş formülünü türetmek"
  - "Eğitimde batch istatistiği, değerlendirmede running istatistik kullanımını ve PyTorch'un momentum/unbiased varyans konvansiyonunu uygulamak"
  - "BN, LayerNorm, InstanceNorm, GroupNorm ve RMSNorm'un yalnız istatistik alınan eksenlerde farklılaştığını görmek"
  - "`register_buffer` ile öğrenilmeyen durum tutmak"
sources:
  - {title: "Ioffe & Szegedy — Batch Normalization", url: "https://arxiv.org/abs/1502.03167", license: "arXiv", use: link}
  - {title: "CS231n Assignment 2 — BatchNorm / LayerNorm (forward, backward, backward_alt)", url: "https://cs231n.github.io/assignments2025/assignment2/", license: "MIT", use: adapt}
  - {title: "Ba, Kiros, Hinton — Layer Normalization; Zhang & Sennrich — RMSNorm", url: "https://arxiv.org/abs/1910.07467", license: "arXiv", use: link}
  - {title: "Wu & He — Group Normalization", url: "https://arxiv.org/abs/1803.08494", license: "arXiv", use: link}
  - {title: "Stanford CS336 — Lecture 3: Architectures (pre-norm, RMSNorm)", url: "https://stanford-cs336.github.io/", license: "doğrulanmadı", use: link}

hand:
  groups:
    - title: "BatchNorm, tek özellik, batch $x=[1,2,3]$, $\\epsilon=0$, $\\gamma=2$, $\\beta=1$"
      fields:
        - {id: mu, label: "$\\mu$", answer: 2}
        - {id: var, label: "$\\sigma^2$ (MLE, $\\frac1N$)", answer: 0.666667, tol: 0.001, hint: "$(1+0+1)/3$"}
        - {id: xh1, label: "$\\hat x_1=(x_1-\\mu)/\\sigma$", answer: -1.224745, tol: 0.002, hint: "$-1/0.8165$"}
        - {id: y1, label: "$y_1=\\gamma\\hat x_1+\\beta$", answer: -1.449490, tol: 0.003}
    - title: "Geri geçiş, $\\partial L/\\partial y=[1,0,0]$: $dx=\\frac{1}{N\\sigma}\\big(N\\,d\\hat x-\\sum d\\hat x-\\hat x\\sum d\\hat x\\,\\hat x\\big)$, $d\\hat x=\\gamma\\,dy$"
      fields:
        - {id: dx1, label: "$\\partial L/\\partial x_1$", answer: 0.408248, tol: 0.002, hint: "$\\frac{1}{3\\cdot0.8165}(6-2-(-1.2247)(-2.4495))$"}
        - {id: dx2, label: "$\\partial L/\\partial x_2$", answer: -0.816497, tol: 0.002, hint: "$\\hat x_2=0$: $\\frac{1}{2.4495}(0-2-0)$"}
        - {id: dg, label: "$\\partial L/\\partial\\gamma=\\sum dy\\,\\hat x$", answer: -1.224745, tol: 0.002}
    - title: "RMSNorm: $x=[3,4]$, $g=1$, $\\epsilon=0$: $y=x/\\sqrt{\\text{mean}(x^2)}$"
      fields:
        - {id: rms1, label: "$y_1$", answer: 0.848528, tol: 0.002, hint: "$\\sqrt{(9+16)/2}=3.5355$"}
  verify: |
    import math
    x = [1, 2, 3]; N = 3; g, b = 2, 1
    mu = sum(x) / N; var = sum((v - mu) ** 2 for v in x) / N; s = math.sqrt(var)
    xh = [(v - mu) / s for v in x]
    dy = [1, 0, 0]; dxh = [g * d for d in dy]
    S1, S2 = sum(dxh), sum(a * c for a, c in zip(dxh, xh))
    dx = [(N * a - S1 - c * S2) / (N * s) for a, c in zip(dxh, xh)]
    answers = dict(mu=mu, var=round(var, 6), xh1=round(xh[0], 6), y1=round(g * xh[0] + b, 6),
                   dx1=round(dx[0], 6), dx2=round(dx[1], 6), dg=round(sum(a * c for a, c in zip(dy, xh)), 6),
                   rms1=round(3 / math.sqrt(12.5), 6))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "BatchNorm geri geçişinde neden ekstra terimler ($-\\sum d\\hat x$ ve $-\\hat x\\sum d\\hat x\\hat x$) var?"
    options:
      - {t: "$\\mu$ ve $\\sigma$ batch'in tüm örneklerine bağlı; bir örneği değiştirmek tüm $\\hat x$'leri değiştirir. Bu terimler o dolaylı yolları taşır", ok: true, why: "Sonuç: $\\sum_i dx_i=0$ ve $\\sum_i dx_i\\hat x_i=0$. Gradyan, normalizasyonun yok ettiği iki yönden (kaydırma, ölçek) arındırılır."}
      - {t: "Sayısal kararlılık için", why: "Matematiksel olarak gerekli; zincir kuralının çok yollu hâli (M0.3)."}
      - {t: "Yalnız $\\gamma\\ne1$ iken gerekli", why: "Her durumda gerekli."}
  - q: "Transformer'lar neden BatchNorm değil LayerNorm/RMSNorm kullanır?"
    options:
      - {t: "LN istatistiği her token'ın kendi özelliklerinden alır: batch boyutundan, dizi uzunluğundan ve train/eval farkından bağımsızdır", ok: true, why: "Değişken uzunluklu diziler ve küçük batch'lerde BN istatistikleri gürültülü ve dolgu (padding) ile kirli olur."}
      - {t: "BN türevlenemez", why: "Türevlenebilir; b ve c aşamalarında geri geçişini yazdın."}
      - {t: "LN daha çok parametre öğrenir", why: "İkisinin de $\\gamma,\\beta$ sayısı özellik sayısı kadar."}
  - q: "`nn.BatchNorm1d(momentum=0.1)` running_mean'i nasıl günceller?"
    options:
      - {t: "$\\text{running}\\leftarrow0.9\\cdot\\text{running}+0.1\\cdot\\mu_B$; running_var için batch'in **yansız** ($\\frac1{N-1}$) varyansı kullanılır", ok: true, why: "Normalize ederken ise yanlı ($\\frac1N$) varyans kullanılır. CS231n'in momentum'u bunun tersi tanımlıdır (0.9 = eski değerin ağırlığı); d aşamasında bu farka dikkat."}
      - {t: "$\\text{running}\\leftarrow0.1\\cdot\\text{running}+0.9\\cdot\\mu_B$", why: "PyTorch'ta momentum yeni gözlemin ağırlığıdır."}
      - {t: "Tüm batch'lerin aritmetik ortalaması", why: "O `momentum=None` durumudur (kümülatif ortalama)."}

extras:
  - {id: x1, title: "Batch boyutu, BN gürültüsü ve yansız kayan varyans", engine: browser}
  - {id: x2, title: "Çıkarımda BN'i önceki katmana katlamak", engine: browser}
  - {id: x3, title: "BN'in ölçek değişmezliği ve etkin öğrenme oranı", engine: browser}

homework:
  - title: "Ioffe & Szegedy (2015): Batch Normalization"
    paper: "Ioffe & Szegedy — Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift (ICML 2015)"
    url: "https://arxiv.org/abs/1502.03167"
    level: orta
    hours: 8
    goal: |
      Makale Şekil 1'i tekrarla: MNIST'te 3 gizli katmanlı (100'er sigmoid) ağı BN'li ve BN'siz eğit; doğruluk eğrisini ve son gizli katmandaki tek bir nöronun girdisinin {15, 50, 85}. yüzdeliklerinin eğitim boyunca değişimini çiz. BN'li ağda öğrenme oranını 5× ve 30× artırıp (Bölüm 4.2.1) hâlâ eğitilebildiğini göster; x2'deki katlamayla çıkarım hızını ölç.
    steps:
      - "Yüzdelikleri sabit bir doğrulama batch'i üzerinde hesapla."
    accept:
      - "BN'siz ağda dağılım yüzdelikleri kayar, BN'li ağda kararlı."
      - "BN'li ağ yüksek öğrenme oranında da yakınsar."
  - title: "Wu & He (2018): Group Normalization"
    paper: "Wu & He — Group Normalization (ECCV 2018)"
    url: "https://arxiv.org/abs/1803.08494"
    level: orta
    hours: 8
    goal: |
      Makale Şekil 1'in küçük sürümü: CIFAR-10'da bir ResNet'i batch boyutu {32, 16, 8, 4, 2} ile BN ve GN (G = 32 ya da kanal/2) kullanarak eğit; doğruluğu batch boyutuna göre çiz. x1'deki gürültü ölçümünün, BN'in küçük batch'teki çöküşünü öngördüğünü göster; GN'in grup sayısı ablasyonu (Tablo 3).
    steps:
      - "Aynı epoch sayısında, öğrenme oranını batch boyutuyla doğrusal ölçekle."
    accept:
      - "BN küçük batch'te belirgin kötüleşir, GN hemen hemen sabit kalır."
      - "Grup sayısı ablasyon tablosu."

labs:
  - id: l1
    lab: bnnoise
    title: "Batch normalizasyonu bir örneği nasıl görür: batch'e bağlı gürültü"
    goal: |
      Eğitimde BN, bir örneği **o batch'in** ortalaması ve varyansıyla normalize eder: aynı örnek her batch'te biraz farklı bir değere eşlenir. Bu gürültü küçük bir düzenlileştiricidir ama küçük batch'te ya da batch bileşimi değiştiğinde eğitim–çıkarım farkına dönüşür.
    predict:
      q: "B = 4 ile B = 64 arasında BN(x)'in batch'ten batch'e std'si kabaca kaç kat değişir?"
      options:
        - {t: "≈ 16 kat", why: "Std √B ile ölçeklenir, B ile değil."}
        - {t: "≈ 4 kat", ok: true, why: "Örnek ortalama/varyansın standart hatası ∝ 1/√B: √(64/4) = 4."}
        - {t: "Değişmez", why: "Batch istatistiklerinin belirsizliği B ile azalır."}
    presets:
      - {name: "Küçük batch", params: {B: 4}, note: "Dağılım geniş ve çarpık: aynı örnek bazen 0.5'e bazen 3'e eşleniyor."}
      - {name: "Büyük batch", params: {B: 256}, note: "Batch istatistikleri popülasyona yaklaşıyor."}
      - {name: "Karışık kaynak", params: {B: 32, mix: 0.5}, note: "İki farklı dağılımdan karışık batch: hem gürültü hem kayma."}
      - {name: "B = 2", params: {B: 2}, note: "İki örnekli batch'te normalize değer yalnız ±1 olabilir — işaret dışında bilgi kalmaz."}
    questions:
      - q: "B = 2 iken neden çıktı yalnız ±1 civarında?"
        a: "İki sayıyı kendi ortalamaları ve (yanlı) std'leriyle normalize edersen her zaman −1 ve +1 elde edersin; x'in büyüklüğü kaybolur."
    limits: "Tek özellik, Gauss veri; ε = 10⁻⁵. Gerçek ağda BN'in etkisi optimizasyon manzarasını da değiştirir (M3.6 anlatımı)."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: BN eğitimde ve çıkarımda iki farklı fonksiyondur
    goal: Batch istatistiği ile koşu istatistiğinin farkını görmek
    needs: Ortalama, varyans
    q: |-
      Bir özellik için batch $[1,2,3,6]$, $\gamma=1$, $\beta=0$, $\epsilon\approx0$. (a) Eğitimde 6'nın BN çıktısı nedir? (b) Çıkarımda koşu ortalaması $\mu=2$, koşu varyansı $\sigma^2=4$ ise aynı 6 neye eşlenir?
    solution: |-
      **(a)** $\mu_B=3$, $\sigma_B^2=\frac14[(1-3)^2+(2-3)^2+0+(6-3)^2]=\frac{14}4=3.5$ (BN **yanlı**, $n$'ye bölünen varyans kullanır). $\hat x=(6-3)/\sqrt{3.5}=1.604$.

      **(b)** $(6-2)/\sqrt4=2$.

      **Yorum:** aynı girdi eğitimde 1.60, çıkarımda 2.00 oluyor. Eğitimde çıktı batch'teki **diğer** örneklere bağlıdır (batch'ler arası gürültü ve örnekler arası bilgi sızıntısı); çıkarımda deterministiktir. `model.eval()`'i unutmak bu yüzden sonuçları değiştirir. Koşu istatistikleri eğitim boyunca EMA ile ($\mu\leftarrow(1-m)\mu+m\mu_B$, PyTorch'ta $m=0.1$) güncellenir; PyTorch koşu varyansında yansız ($n-1$) tahmini saklar.
  - id: p2
    type: hesap
    level: 1
    title: Normalize değer
    goal: BN ileri geçişini elle yapmak
    needs: P1
    q: |-
      Batch $[2,4,6,8]$, $\gamma=1$, $\beta=0$, $\epsilon=0$. 8'in BN çıktısı?
    answer: 1.3416407864998738
    calc: "(8-5)/math.sqrt(5)"
    tol: 1e-3
    mistakes:
      - {answer: 1.161895003862225, msg: "BN yanlı varyans kullanır: n'ye böl (4), n − 1'e değil."}
      - {answer: 0.6, msg: "Varyansın karekökü (std) ile böl, varyansla değil."}
    hints:
      - "$\\mu=5$, $\\sigma^2=\\frac14(9+1+1+9)$."
    solution: |-
      $\sigma^2=5$, $(8-5)/\sqrt5=1.342$.
  - id: p3
    type: hesap
    level: 1
    title: BN'i önceki katmana katla
    goal: Çıkarımda BN'in doğrusal bir dönüşüm olduğunu kullanmak
    needs: P1(b)
    q: |-
      $y=\gamma\frac{(wx+b)-\mu}{\sigma}+\beta$, $w=0.5$, $b=1$, $\gamma=2$, $\beta=1$, $\mu=3$, $\sigma=2$. Katlanmış katmanın biası $b'$ (yani $y=w'x+b'$)?
    answer: -1.0
    calc: "2*(1-3)/2+1"
    mistakes:
      - {answer: -2.0, msg: "β'yı eklemeyi unuttun."}
      - {answer: -2.0, msg: "γ/σ ölçeği hem w'ye hem (b − μ)'ye uygulanır."}
    hints:
      - "$y=\\frac\\gamma\\sigma w\\,x+\\big(\\frac\\gamma\\sigma(b-\\mu)+\\beta\\big)$."
    solution: |-
      $w'=\gamma w/\sigma=0.5$, $b'=\gamma(b-\mu)/\sigma+\beta=2(-2)/2+1=-1$. Çıkarımda BN ek maliyetsizdir (M3.6 ek alıştırması).
  - id: p4
    type: yöntem-seç
    level: 2
    title: Batch boyu 2, segmentasyon
    goal: Normalizasyon türünü koşula göre seçmek
    needs: BN, LN, GN farkı
    q: |-
      Büyük görüntülerle segmentasyon; GPU belleği yüzünden batch boyu 2. BN mi, LayerNorm mu, GroupNorm mu?
    choices:
      - {t: "BatchNorm", why: "İki örnekten kestirilen istatistik çok gürültülü; eğitim–çıkarım farkı büyür (deney: B = 2)."}
      - {t: "GroupNorm: kanal gruplarında, örnek başına normalize eder; batch boyundan bağımsız", ok: true, why: "Wu & He 2018'in tam bu durum için önerisi; M8.2'deki U-Net'te de bu var."}
      - {t: "Normalizasyon kullanma", why: "Mümkün ama derin ağı eğitmek zorlaşır."}
    hints:
      - "Hangi yöntemin istatistiği batch'teki diğer örneklere bağlı?"
    solution: |-
      BN istatistiği batch ekseni üzerinden alır; B = 2'de çok gürültülüdür. LN tüm kanallar ve konumlar üzerinden alır — evrişimli ağlarda kanallar farklı ölçekte olduğu için kötü olabilir. GN (ör. 32 grup) arada: örnek başına, kanal grupları içinde; B'den bağımsız.
  - id: p5
    type: açıkla
    level: 2
    title: BN neden ağırlık ölçeğinden bağımsız?
    goal: Ölçek değişmezliğinin optimizasyona etkisini açıklamak
    needs: P1
    q: |-
      BN'den önce gelen $W$'yi $cW$ ($c>0$) yapmak çıktıyı değiştirmez. Bunu göster; bunun gradyan ve ağırlık bozunması için ne anlama geldiğini açıkla.
    rubric:
      - "$\\mathrm{BN}(cWx)=\\mathrm{BN}(Wx)$ çünkü ortalama ve std da c ile ölçeklenir dedim"
      - "Gradyanın $W$'ye dik olduğunu ($\\langle\\nabla_WL,W\\rangle=0$) ve $\\|\\nabla_{cW}L\\|=\\|\\nabla_WL\\|/c$ olduğunu söyledim"
      - "Ağırlık bozunmasının normu küçültüp etkin öğrenme oranını artırdığını açıkladım"
    hints:
      - "$L(cW)=L(W)$'nin iki tarafının $c$'ye göre türevini $c=1$'de al."
    solution: |-
      $\mu(cz)=c\mu(z)$, $\sigma(cz)=c\sigma(z)$ ⇒ $\hat x$ değişmez. $L(cW)=L(W)$ ⇒ $c$'ye göre türev: $\langle\nabla L(W),W\rangle=0$ — gradyan $W$'ye diktir, SGD normu yalnız büyütür. Zincir kuralıyla $\nabla L(cW)=\nabla L(W)/c$: norm büyüdükçe etkin adım $\eta/\|W\|^2$ küçülür. Ağırlık bozunması normu küçük tutarak etkin öğrenme oranını yüksek tutar — BN'li ağlarda L2'nin düzenlileştirmeden çok bir **öğrenme oranı ayarı** olmasının nedeni.
pitfalls:
  - wrong: "BN eğitimde ve testte aynı hesabı yapar."
    right: "Eğitimde batch istatistiği, testte koşu istatistiği kullanılır; `model.eval()` unutulursa test sonuçları batch bileşimine bağlı olur."
  - wrong: "BN, iç ortak değişken kayması (internal covariate shift) azalttığı için çalışır."
    right: "Bu ilk açıklamaydı; sonraki çalışmalar (Santurkar ve ark. 2018) asıl etkinin kayıp yüzeyini pürüzsüzleştirmek (daha büyük kararlı η) olduğunu gösterdi."
  - wrong: "Konvolüsyondan sonra bias + BN gereklidir."
    right: "BN ortalamayı çıkardığı için önceki bias işe yaramaz; β onun yerini alır (`bias=False`)."
whatif:
  - q: "Batch'ler sınıfa göre sıralanmış (her batch tek sınıf) olsaydı?"
    a: "Batch istatistiği sınıfı kodlar; model eğitimde bu sızıntıyı kullanır, testte (koşu istatistikleriyle) çöker. Veriyi karıştır."
  - q: "Dizi modellerinde (değişken uzunluk) BN?"
    a: "Konum başına batch istatistiği tutarsızdır (dolgu, farklı uzunluklar); bu yüzden Transformer ve RNN'lerde LayerNorm kullanılır."
