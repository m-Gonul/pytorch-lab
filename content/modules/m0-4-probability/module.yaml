id: m0-4-probability
code: M0.4
title: Olasılık ve MLE özeti
phase: 0
minutes: 180
prereq: [m0-1-dot]
summary: >
  ML'deki her kayıp fonksiyonunun arkasındaki fikir: maximum likelihood. Bir
  yazı-tura, bir Gauss ve bir zar için MLE'yi elle buluyor, saf Python'da
  log-likelihood yazıyor, NumPy'da bir ızgara üzerinde döngüsüz arıyor,
  `torch.distributions` ile gradyanla optimize ediyor ve en sonda bootstrap'ı
  tek tensör işlemiyle yapıyorsun.
goals:
  - "Bernoulli, Gauss ve kategorik dağılım için [[mle|MLE]] tahminlerini türetmek: oran, ortalama, varyans, frekans"
  - "Çarpım yerine log-likelihood toplamı kullanmanın sayısal nedenini göstermek"
  - "MLE varyansı ($\\frac1n$) ile yansız varyansın ($\\frac1{n-1}$) farkını bilmek"
  - "Negatif log-likelihood'u gradyanla minimize edip kapalı formla karşılaştırmak; MSE ve cross-entropy'nin birer [[nll|NLL]] olduğunu görmek"
  - "Bootstrap ile bir tahminin belirsizliğini döngüsüz ölçmek"
sources:
  - {title: "Mathematics for Machine Learning, Bölüm 6 (Probability) ve 8.3 (Parameter Estimation)", url: "https://mml-book.github.io/", license: "© (PDF ücretsiz)", use: link}
  - {title: "Murphy — Probabilistic Machine Learning: An Introduction, Bölüm 2 ve 4", url: "https://probml.github.io/pml-book/book1.html", license: "CC BY-NC-ND", use: link}
  - {title: "Dive into Deep Learning §2.6 Probability and Statistics", url: "https://d2l.ai/chapter_preliminaries/probability.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "PyTorch — torch.distributions", url: "https://docs.pytorch.org/docs/stable/distributions.html", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "Yazı-tura: $y=[1,0,1,1]$ (1 = tura), $y_i\\sim\\text{Bernoulli}(p)$"
      fields:
        - {id: lik05, label: "$L(p=0.5)=\\prod_i p^{y_i}(1-p)^{1-y_i}$", answer: 0.0625, tol: 0.0001, hint: "her atış $0.5$; $0.5^4$"}
        - {id: lik075, label: "$L(p=0.75)$", answer: 0.10546875, tol: 0.0005, hint: "$0.75^3\\cdot0.25=0.421875\\cdot0.25$"}
        - {id: phat, label: "$\\hat p_{\\text{MLE}}$", answer: 0.75, tol: 0.001, hint: "$\\frac{d}{dp}\\log L=0\\Rightarrow\\hat p=\\frac1n\\sum y_i$"}
        - {id: ll, label: "$\\log L(\\hat p)=3\\ln0.75+\\ln0.25$", answer: -2.249340, tol: 0.003, hint: "$\\ln0.75\\approx-0.2877$, $\\ln0.25\\approx-1.3863$"}
    - title: "Gauss: $x=[2,4,6]$, $x_i\\sim\\mathcal N(\\mu,\\sigma^2)$"
      fields:
        - {id: mu, label: "$\\hat\\mu$", answer: 4, hint: "ortalama"}
        - {id: var_mle, label: "$\\hat\\sigma^2_{\\text{MLE}}=\\frac1n\\sum(x_i-\\hat\\mu)^2$", answer: 2.666667, tol: 0.002, hint: "$(4+0+4)/3$"}
        - {id: var_unb, label: "Yansız $s^2=\\frac1{n-1}\\sum(x_i-\\hat\\mu)^2$", answer: 4, tol: 0.001, hint: "$8/2$"}
    - title: "Zar: atışlar $[1,3,3,6,3,1]$; $\\hat p_k=\\frac{\\#k}{n}$"
      fields:
        - {id: p1, label: "$\\hat p_1$", answer: 0.333333, tol: 0.002, hint: "6 atışın 2'si"}
        - {id: p3, label: "$\\hat p_3$", answer: 0.5, tol: 0.001, hint: "3 kez"}
        - {id: p2, label: "$\\hat p_2$", answer: 0, tol: 0.0001, hint: "hiç gelmedi → MLE sıfır olasılık verir; Laplace düzeltmesi (M2.2) bu yüzden var"}
  verify: |
    import math
    y = [1, 0, 1, 1]; x = [2, 4, 6]; r = [1, 3, 3, 6, 3, 1]
    L = lambda p: math.prod(p ** v * (1 - p) ** (1 - v) for v in y)
    ph = sum(y) / len(y); mu = sum(x) / 3; ss = sum((v - mu) ** 2 for v in x)
    answers = dict(lik05=L(0.5), lik075=L(0.75), phat=ph, ll=round(math.log(L(ph)), 6),
                   mu=mu, var_mle=round(ss / 3, 6), var_unb=ss / 2,
                   p1=round(r.count(1) / 6, 6), p3=r.count(3) / 6, p2=r.count(2) / 6)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Neden likelihood'u değil log-likelihood'u maksimize ederiz?"
    options:
      - {t: "Çarpım 10 000 örnekte float64'ün en küçük pozitif değerinin altına düşer; log toplama çevirir ve argmax'ı değiştirmez", ok: true, why: "$0.5^{10000}\\approx10^{-3010}$, float64 alt sınırı $\\approx10^{-308}$. log monoton artan olduğu için en iyi parametre aynı kalır; toplamın gradyanı da çok daha kolaydır."}
      - {t: "Log-likelihood farklı bir (daha iyi) tahmin verir", why: "Monoton dönüşüm argmax'ı değiştirmez; aynı tahmin."}
      - {t: "Likelihood negatif olabilir", why: "Olasılık (yoğunluk) çarpımı her zaman ≥ 0."}
  - q: "Sabit $\\sigma$ ile Gauss gürültü varsayımı altında NLL'yi minimize etmek neye eşittir?"
    options:
      - {t: "MSE'yi minimize etmeye", ok: true, why: "$-\\log\\mathcal N(y\\mid\\hat y,\\sigma^2)=\\frac{(y-\\hat y)^2}{2\\sigma^2}+\\text{sabit}$. M1.1'deki kayıp aslında bir Gauss NLL."}
      - {t: "Cross-entropy'yi minimize etmeye", why: "O, Bernoulli/kategorik NLL (M1.4–M1.5)."}
      - {t: "Mutlak hatayı (L1) minimize etmeye", why: "L1, Laplace dağılımının NLL'sidir."}
  - q: "$\\hat\\sigma^2_{\\text{MLE}}$ neden sistematik olarak küçük çıkar?"
    options:
      - {t: "Sapmalar gerçek $\\mu$ yerine verinin kendi ortalamasından ölçülür; ortalama veriye en yakın nokta olduğu için kareler toplamı küçülür", ok: true, why: "$\\mathbb E[\\hat\\sigma^2_{\\text{MLE}}]=\\frac{n-1}{n}\\sigma^2$. Bir serbestlik derecesi ortalamaya harcanır; $n-1$ ile bölmek bunu düzeltir (Bessel düzeltmesi)."}
      - {t: "Kayan nokta hatası yüzünden", why: "Tam aritmetikte de geçerli; istatistiksel bir yanlılık."}
      - {t: "Küçük çıkmaz; MLE her zaman yansızdır", why: "MLE tutarlıdır ($n\\to\\infty$'da doğru) ama her zaman yansız değildir."}

homework:
  - title: "Box & Muller (1958): normal sapmaların üretimi"
    paper: "Box & Muller — A Note on the Generation of Random Normal Deviates (Annals of Mathematical Statistics 1958)"
    url: "https://projecteuclid.org/journals/annals-of-mathematical-statistics/volume-29/issue-2/A-Note-on-the-Generation-of-Random-Normal-Deviates/10.1214/aoms/1177706645.full"
    level: başlangıç
    hours: 4
    goal: |
      Box–Muller dönüşümünü ve Marsaglia'nın kutupsal yöntemini yalnız düzgün sayılardan üret; Kolmogorov–Smirnov ve moment testleriyle N(0, 1)'e uyumu, kuyruk olasılıklarını (|z| > 4) ve hız farkını (trigonometri vs ret örneklemesi) ölç. Ters CDF yöntemiyle (Beasley–Springer–Moro ya da kendi rasyonel yaklaşımın) karşılaştır.
    steps:
      - "Kutupsal yöntemin kabul oranının π/4 olduğunu doğrula."
    accept:
      - "Üç yöntem de KS testinden geçer."
      - "Hız ve kuyruk doğruluğu tablosu."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bernoulli için en çok olabilirlik
    goal: MLE'yi türevle bulmak
    needs: Logaritma, türev
    q: |-
      $n$ atışta $h$ tura. $p$'nin MLE'sini türet.
    solution: |-
      **Olabilirlik:** $L(p)=p^h(1-p)^{n-h}$ (atışlar bağımsız). Logaritma tekdüze olduğundan $\log L$'yi en büyüklemek aynıdır ve çarpımı toplama çevirir: $\ell(p)=h\log p+(n-h)\log(1-p)$.

      **Türev:** $\ell'(p)=\frac hp-\frac{n-h}{1-p}=0\Rightarrow h(1-p)=(n-h)p\Rightarrow\hat p=h/n$. $\ell''<0$: maksimum.

      **Bağlantı:** $-\ell(p)/n$, ikili çapraz entropidir. Lojistik regresyon (M1.4) aynı olabilirliği $p=\sigma(w^\top x)$ ile en büyükler. **Sınır:** $h=0$ ise $\hat p=0$ — "hiç görmediğim şey imkânsız" (P5).
  - id: p2
    type: hesap
    level: 1
    title: Yazı-tura MLE'si
    goal: P1'i uygulamak
    needs: P1
    q: |-
      10 atışta 7 tura. $\hat p$?
    answer: 0.7
    calc: "7/10"
    mistakes:
      - {answer: 0.5, msg: "Bu önsel bir varsayım; MLE gözlenen orandır."}
    hints:
      - "$h/n$."
    solution: |-
      $0.7$.
  - id: p3
    type: hesap
    level: 1
    title: Negatif log-olabilirlik
    goal: NLL'yi hesaplamak
    needs: P1
    q: |-
      Aynı veri, $p=0.7$. NLL $=-[7\ln0.7+3\ln0.3]$ (nat)?
    answer: 6.108643020548936
    calc: "-(7*math.log(0.7)+3*math.log(0.3))"
    tol: 1e-3
    mistakes:
      - {answer: 2.6529499557412155, msg: "Doğal log (ln) kullan; log₁₀ farklı ölçek verir."}
      - {answer: 1.5606477482646686, msg: "Her gözlem katkı yapar: 7 tura, 3 yazı."}
    hints:
      - "$\\ln0.7=-0.357$, $\\ln0.3=-1.204$."
    solution: |-
      $7\cdot0.357+3\cdot1.204=6.109$.
  - id: p4
    type: hesap
    level: 2
    title: Gauss'un MLE varyansı
    goal: Yanlı MLE varyansını hesaplamak
    needs: Ortalama, varyans
    q: |-
      Veri $[1,2,3,6]$. Gauss MLE'sinin varyansı ($\frac1n\sum(x-\bar x)^2$)?
    answer: 3.5
    calc: "(4+1+0+9)/4"
    mistakes:
      - {answer: 4.666666666666667, msg: "Bu yansız (n − 1) tahmin; MLE n'ye böler."}
    hints:
      - "$\\bar x=3$."
    solution: |-
      $14/4=3.5$. MLE varyansı yanlıdır: $\mathbb E[\hat\sigma^2]=\frac{n-1}n\sigma^2$, çünkü $\bar x$ veriye uydurulmuştur (bir serbestlik derecesi harcanır). BN tam bu yanlı tahmini kullanır (M3.6).
  - id: p5
    type: karşı-örnek
    level: 3
    title: Az veride MLE aşırı güvenlidir
    goal: Önselin rolünü göstermek
    needs: P1, Bayes kuralı
    q: |-
      3 atışta 0 tura: MLE $\hat p=0$. Bu neden kötü bir tahmin ve Beta(α, β) önseliyle posterior ortalaması ne olur? α = β = 1 için hesapla ve yorumla.
    rubric:
      - "p = 0'ın gelecekte tura gelme olasılığını sıfır saydığını, log-kaybı sonsuz yapabileceğini söyledim"
      - "Beta önselinin posteriorunun Beta(α + h, β + n − h) olduğunu yazdım"
      - "Posterior ortalamasını (h + α)/(n + α + β) = 1/5 buldum"
      - "Bunun Laplace düzeltmesiyle (M2.2) aynı olduğunu ve n büyüdükçe MLE'ye yaklaştığını söyledim"
    hints:
      - "Beta–Bernoulli eşleniktir."
    solution: |-
      $\hat p=0$ ile bir sonraki tura için log-kayıp ∞. Önsel Beta(1, 1) (düzgün): posterior Beta(1, 4), ortalaması $\frac{0+1}{3+2}=0.2$. Bu Laplace "+1" kuralıdır. Veri arttıkça önselin etkisi $\frac{\alpha+\beta}{n}$ oranında söner.
pitfalls:
  - wrong: "Olabilirlik, parametrenin olasılığıdır."
    right: "$L(\\theta)=p(\\text{veri}|\\theta)$, θ'nın fonksiyonu olarak verinin olasılığıdır; θ üzerinde integrali 1 olmak zorunda değil. θ'nın olasılığı posteriordur."
  - wrong: "MLE her zaman yansızdır."
    right: "Gauss varyansında olduğu gibi yanlı olabilir (P4); tutarlıdır (n → ∞'da doğruya gider)."
whatif:
  - q: "Gözlemler bağımsız değilse (zaman serisi)?"
    a: "Olabilirlik çarpana ayrılmaz; koşullu çarpım $\\prod p(x_t|x_{<t})$ kullanılır — dil modellerinin kaybı tam olarak budur."

labs:
  - id: l1
    lab: bayesgrid
    title: "Bayes kuralı 1000 kişide: pozitif test ne anlama gelir?"
    goal: |
      Her kare bir kişi. Turuncu tonlar hastaları, mavi ve gri sağlıklıları gösterir; koyu turuncu ve mavi kareler testi pozitif çıkanlardır. Pozitiflerin içinde gerçekten hasta olanların oranı $P(H\mid+)$'dır: hem sayarak hem Bayes formülüyle hesaplanır. Sürgülerin yanındaki kutulara kesin değer (yüzde) yazabilirsin.
    predict:
      q: "Yaygınlık %1, duyarlılık %90, özgüllük %95. Testi pozitif çıkan biri yaklaşık hangi olasılıkla hastadır?"
      options:
        - {t: "%15 civarı", ok: true, why: "1000 kişide 9 doğru pozitif ve ~50 yanlış pozitif: 9/59 ≈ %15. Nadir hastalıkta sağlıklıların küçük hata oranı bile hastalardan çok pozitif üretir."}
        - {t: "%90", why: "%90, P(+ | H)'dir (duyarlılık). Sorulan ters koşul P(H | +)."}
        - {t: "%95", why: "%95 özgüllüktür: sağlıklıların negatif çıkma oranı."}
    presets:
      - {name: "Nadir hastalık", params: {prev: 0.01, sens: 0.9, spec: 0.95, second: false}, note: "Ders metnindeki örnek: P(H | +) ≈ %15."}
      - {name: "İkinci test", params: {prev: 0.01, sens: 0.9, spec: 0.95, second: true}, note: "İlk testin sonsalı (%15) ikinci testin önseli olur: iki pozitif sonrası ≈ %77. (Testlerin hastalık durumu verildiğinde bağımsız olduğu varsayımıyla.)"}
      - {name: "Yaygın hastalık", params: {prev: 0.3, sens: 0.9, spec: 0.95, second: false}, note: "Aynı test, önsel %30: P(H | +) ≈ %89. Testin anlamı nüfusa bağlıdır."}
      - {name: "Çok iyi özgüllük", params: {prev: 0.01, sens: 0.9, spec: 0.999, second: false}, note: "Yanlış pozitifler 50'den 1'e iner: P(H | +) ≈ %90. Nadir olayları tespit etmede özgüllük belirleyicidir."}
    questions:
      - q: "Duyarlılığı %90'dan %99'a çıkarmak mı, özgüllüğü %95'ten %99'a çıkarmak mı $P(H\\mid+)$'yı (önsel %1) daha çok artırır? Önce tahmin et, sonra dene."
        a: "Özgüllük: yanlış pozitifler 50'den 10'a iner, P(H | +) ≈ %48. Duyarlılık artışı doğru pozitifi 9'dan 10'a çıkarır, P ≈ %17. Nadir sınıfta yanlış pozitif oranı baskındır."
      - q: "Makine öğrenmesinde bunun karşılığı nedir?"
        a: "Dengesiz sınıflarda yüksek doğruluk (accuracy) yanıltıcıdır; kesinlik (precision) = P(gerçek pozitif | tahmin pozitif) tam olarak bu sonsaldır ve taban oranına bağlıdır."
    limits: "Izgara 1000 kişiyle sayılar yuvarlanır (çok nadir hastalıkta 0–1 hasta). İkinci test hastalık durumu verildiğinde birinciyle bağımsız varsayılır; gerçekte aynı kişide hatalar ilişkili olabilir."
  - id: l2
    lab: distsample
    title: "Dağılımdan örnek çek: histogram, PMF/PDF ve büyük sayılar yasası"
    goal: |
      Bir dağılım ve parametrelerini seç; N örnek çekilir. Soldaki grafik örneklemin göreli frekansını (ayrık) ya da yoğunluk histogramını (sürekli) teorik eğriyle karşılaştırır. Sağdaki grafik ilk n örneğin ortalamasının gerçek ortalamaya nasıl yaklaştığını gösterir. "Yeni tohum" aynı ayarla başka bir örneklem çeker.
    predict:
      q: "N'yi 100'den 10 000'e çıkarırsan örneklem ortalamasının gerçek ortalamadan tipik sapması kaç kat küçülür?"
      options:
        - {t: "10 kat", ok: true, why: "Standart hata σ/√N: N 100 kat artınca √100 = 10 kat azalır."}
        - {t: "100 kat", why: "Hata N ile değil √N ile azalır."}
        - {t: "Değişmez", why: "Büyük sayılar yasası: ortalama gerçek değere yakınsar."}
    presets:
      - {name: "Az örnek", params: {dist: 2, mu: 0, sigma: 1, N: 20}, note: "20 örnekle histogram çok pürüzlü; birkaç tohum dene."}
      - {name: "Çok örnek", params: {dist: 2, mu: 0, sigma: 1, N: 20000}, note: "Histogram PDF'yi neredeyse tam izler."}
      - {name: "Yoğunluk > 1", params: {dist: 2, mu: 0, sigma: 0.2, N: 5000}, note: "σ = 0.2: tepe yoğunluk ≈ 2. Olasılık değil yoğunluk; alan yine 1."}
      - {name: "Binom", params: {dist: 1, p: 0.3, m: 20, N: 2000}, note: "20 Bernoulli(0.3)'ün toplamı: ortalama 6, varyans 4.2; şekil şimdiden çana benziyor (MLT)."}
      - {name: "Üstel, çarpık", params: {dist: 3, lam: 1, N: 300}, note: "Ortalama 1 ama örneklerin çoğu ortalamanın altında; uzun sağ kuyruk koşan ortalamayı arada bir yukarı sıçratır."}
    questions:
      - q: "Tabloda 1/N ve 1/(N−1) varyansları N = 5'te ve N = 20 000'de ne kadar farklı?"
        a: "Oranları N/(N−1): N = 5'te %25 fark, N = 20 000'de ihmal edilebilir. Bessel düzeltmesi yalnız küçük örneklemde önemlidir."
      - q: "Koşan ortalama neden bazen bandın dışına çıkıyor?"
        a: "Bant yaklaşık %95 aralığıdır (±2σ/√n): zamanın ~%5'inde dışarıda olması beklenir. Ayrıca her nokta öncekilere bağlı olduğu için dışarı çıkınca bir süre orada kalabilir."
    limits: "Örnekler tohumlu sözde-rastgele üreteçle çekilir (Gauss için Box–Muller). Sürekli dağılımlarda histogram yalnız gösterilen aralığı kapsar; dışarıda kalan örnekler sayılmaz (Gauss'ta ±4σ dışı ≈ %0.006)."
  - id: l3
    lab: clt
    title: "Merkezi limit teoremi: ortalamaların dağılımı"
    goal: |
      Seçilen temel dağılımdan n örnek çekilip ortalaması alınır; bu R kez tekrarlanır ve R ortalamanın histogramı çizilir. Turuncu eğri MLT'nin öngörüsüdür: $\mathcal N(\mu,\sigma^2/n)$. Sağ grafik ortalamanın yayılımının n ile nasıl küçüldüğünü gösterir.
    predict:
      q: "Üstel dağılım (çok çarpık) için n = 1'de histogram nasıl görünür, n = 50'de nasıl?"
      options:
        - {t: "n = 1'de temel dağılımın kendisi (çarpık); n = 50'de çana çok yakın ve dar", ok: true, why: "n = 1'de 'ortalama' tek örnektir. n büyüdükçe çarpıklık ~1/√n ile söner, genişlik σ/√n ile daralır."}
        - {t: "Her n'de çan eğrisi", why: "MLT asimptotiktir: küçük n'de temel dağılımın şekli görünür."}
        - {t: "n büyüdükçe üstel dağılıma daha çok benzer", why: "Tersi: ortalamalar çarpıklığı kaybeder."}
    presets:
      - {name: "n = 1", params: {base: 1, n: 1, R: 4000}, note: "Temel dağılımın kendisi."}
      - {name: "n = 30", params: {base: 1, n: 30, R: 4000}, note: "Çarpıklık hâlâ hafifçe görünür ama çan belirgin."}
      - {name: "Bernoulli, n = 10", params: {base: 2, n: 10, R: 4000}, note: "Ortalama yalnız 0, 0.1, …, 1 değerlerini alabilir: ayrık ve çarpık. Çok çarpık dağılımlarda MLT yavaş işler."}
      - {name: "İki tepeli", params: {base: 3, n: 2, R: 4000}, note: "n = 2'de üç tepe (−2, 0, 2); n'yi artırınca tek bir çana kaynaşırlar."}
      - {name: "Cauchy", params: {base: 4, n: 100, R: 4000}, note: "Varyans yok: 100 örneğin ortalaması yine aynı Cauchy dağılımı. MLT'nin koşulu bozuldu."}
    questions:
      - q: "Sağdaki grafikte log ölçekte eğim neden −1/2?"
        a: "Standart hata σ·n^(−1/2): log(SE) = log σ − ½ log n. Yatay eksen log₂ n, dikey log ölçek; eğim −½ (logaritma tabanları farklı olsa da doğru düzdür)."
      - q: "SGD bağlamında n neye karşılık gelir?"
        a: "Mini-batch boyutu: batch gradyanı, örnek gradyanlarının ortalamasıdır; gürültüsü 1/√B ile azalır ve büyük B'de yaklaşık Gauss'tur."
    limits: "Sağ grafik her n için ayrı 300 tekrarlı küçük bir benzetimdir (gürültülü). Cauchy için yayılım çeyrekler arası genişlikle ölçülür, çünkü standart sapma tanımsızdır."
  - id: l4
    lab: likelihood
    title: "Olabilirlik eğrisi, MLE ve MAP"
    goal: |
      n atışta k tura gözlediğini varsay. Mavi eğri $L(p)=p^k(1-p)^{n-k}$, tepesine bölünmüş. Alt grafik log-olabilirlik ve incelenen p'deki teğeti: eğim MLE'de sıfırdır. Önsel gücü a > 1 ise turuncu kesikli sonsal ve MAP çizilir.
    predict:
      q: "k/n = 0.7 sabit kalacak şekilde n = 10'dan n = 100'e geçersen olabilirlik eğrisi nasıl değişir?"
      options:
        - {t: "Tepe yine 0.7'de, ama eğri yaklaşık √10 ≈ 3 kat daralır", ok: true, why: "Genişlik ~√(p(1−p)/n): n 10 kat artınca genişlik √10 kat azalır. Daha çok veri, daha kesin tahmin."}
        - {t: "Tepe 0.7'den uzaklaşır", why: "MLE k/n'dir; oran aynıysa tepe aynı yerde."}
        - {t: "Hiç değişmez", why: "Log-olabilirlik n ile ölçeklenir; eğrilik artar."}
    presets:
      - {name: "7 / 10", params: {n: 10, k: 7, a: 1, probe: 0.5}, note: "MLE 0.7; p = 0.5'te eğim pozitif: p'yi artırmak olabilirliği artırır."}
      - {name: "70 / 100", params: {n: 100, k: 70, a: 1, probe: 0.5}, note: "Aynı oran, çok daha dar eğri."}
      - {name: "3 / 3 (aşırı güven)", params: {n: 3, k: 3, a: 1, probe: 0.9}, note: "MLE = 1: yazı imkânsız sayılıyor. Uyarıyı oku."}
      - {name: "3 / 3 + önsel", params: {n: 3, k: 3, a: 2, probe: 0.9}, note: "Beta(2, 2): her yana bir sahte gözlem. MAP = 4/5 = 0.8."}
      - {name: "Çok veri, güçlü önsel", params: {n: 200, k: 150, a: 10, probe: 0.75}, note: "a = 10 güçlü bir önsel, ama 200 gözlem karşısında MAP (0.73) MLE'ye (0.75) çok yakın."}
    questions:
      - q: "MLE'de ℓ'nin eğimi neden 0? İkinci türevin işareti ne söyler?"
        a: "İç noktadaki maksimumda türev 0'dır (dℓ/dp = k/p − (n−k)/(1−p) = 0 ⇒ p = k/n). ℓ'' < 0 olduğu için bu bir maksimumdur; |ℓ''| ne kadar büyükse tepe o kadar sivri (Fisher bilgisi)."
      - q: "L(p) değerleri neden çok küçük (n = 100'de ~10⁻²⁷)?"
        a: "Her biri < 1 olan 100 olasılığın çarpımı. Daha büyük n'de float64'ün altına iner: bu yüzden log-olabilirlikle çalışılır."
    limits: "Tek parametreli Bernoulli modeli; önsel simetrik Beta(a, a) ile sınırlı (a ≥ 1). Standart hata, büyük n varsayımlı yaklaşık formüldür; k = 0 ya da n'de 0 verir (yanıltıcı)."
