id: m5-1-vae
code: M5.1
title: Autoencoder ve VAE
phase: 5
minutes: 300
prereq: [m2-6-pca, m3-4-optimizers]
summary: >
  Üretken modellere ilk adım. İki Gauss arasındaki KL'yi ve reparametrization
  gradyanlarını elle hesaplıyor, saf Python'da KL'nin kapalı formunu Monte
  Carlo tahminiyle doğruluyor, NumPy'da doğrusal bir autoencoder'ı elle
  türettiğin gradyanlarla eğitip PCA optimumuna indiğini görüyor, PyTorch'ta
  bir VAE yazıyor ve en sonda K örnekli IWAE sınırını tek bir batch'li
  hesapla, döngüsüz kuruyorsun.
goals:
  - "ELBO = yeniden yapılandırma − KL ayrışmasını ve [[reparametrization trick]]'i anlamak"
  - "Gauss KL'nin kapalı formunu ve gradyanlarını türetmek"
  - "Doğrusal autoencoder'ın PCA alt uzayını öğrendiğini deneyle görmek"
  - "[[iwae]] sınırını log-mean-exp ile, K örneği batch boyutuna katlayarak hesaplamak"
sources:
  - {title: "Kingma & Welling — Auto-Encoding Variational Bayes", url: "https://arxiv.org/abs/1312.6114", license: "arXiv", use: link}
  - {title: "Burda, Grosse, Salakhutdinov — Importance Weighted Autoencoders", url: "https://arxiv.org/abs/1509.00519", license: "arXiv", use: link}
  - {title: "Prince — Understanding Deep Learning, Bölüm 17 (VAE)", url: "https://udlbook.github.io/udlbook/", license: "kitap ©; notebook'lar MIT", use: link}
  - {title: "UvA Deep Learning Tutorials — Autoencoders", url: "https://uvadlc-notebooks.readthedocs.io/", license: "MIT", use: adapt}
  - {title: "Stanford CS236 — Deep Generative Models", url: "https://deepgenerativemodels.github.io/", license: "doğrulanmadı", use: link}

hand:
  groups:
    - title: "$q=\\mathcal N(\\mu,\\sigma^2)$, $p=\\mathcal N(0,1)$, $\\mu=1$, $\\sigma=0.5$"
      fields:
        - {id: kl, label: "$\\mathrm{KL}(q\\,\\|\\,p)=\\tfrac12(\\mu^2+\\sigma^2-1-\\log\\sigma^2)$", answer: 0.818147, tol: 0.0005}
        - {id: dmu, label: "$\\partial\\mathrm{KL}/\\partial\\mu$", answer: 1}
        - {id: dsig, label: "$\\partial\\mathrm{KL}/\\partial\\sigma$", answer: -1.5, hint: "$\\sigma-1/\\sigma$"}
    - title: "Reparametrization: $z=\\mu+\\sigma\\varepsilon$, $\\varepsilon=0.4$"
      fields:
        - {id: z, label: "$z$", answer: 1.2}
        - {id: dzds, label: "$\\partial z/\\partial\\sigma$", answer: 0.4}
        - {id: dlv, label: "$\\log\\sigma^2$ parametrizasyonunda $\\partial\\mathrm{KL}/\\partial(\\log\\sigma^2)$", answer: -0.375, hint: "$\\tfrac12(\\sigma^2-1)$"}
  verify: |
    import math
    mu, s, e = 1.0, 0.5, 0.4
    kl = lambda m, sg: 0.5 * (m * m + sg * sg - 1 - math.log(sg * sg))
    h = 1e-6
    answers = dict(kl=kl(mu, s), dmu=(kl(mu + h, s) - kl(mu - h, s)) / (2 * h), dsig=(kl(mu, s + h) - kl(mu, s - h)) / (2 * h),
                   z=mu + s * e, dzds=e,
                   dlv=(kl(mu, math.exp(0.5 * (math.log(s * s) + h))) - kl(mu, math.exp(0.5 * (math.log(s * s) - h)))) / (2 * h))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Reparametrization trick neden gerekli?"
    options:
      - {t: "$z\\sim q_\\phi$ örneklemesi $\\phi$'ye göre türevlenemez; $z=\\mu+\\sigma\\varepsilon$ yazınca rastgelelik $\\varepsilon$'a taşınır ve gradyan $\\mu,\\sigma$'dan akar", ok: true, why: "Alternatif REINFORCE tahmincisi (M5.5) yansızdır ama çok daha yüksek varyanslıdır."}
      - {t: "KL'yi kapalı formda hesaplamak için", why: "KL kapalı formu reparametrization'dan bağımsız."}
      - {t: "Decoder'ı deterministik yapmak için", why: "Decoder'a dokunmaz; kodlayıcıdan gradyan akışı içindir."}
  - q: "VAE eğitiminde KL terimi hemen sıfıra iniyor ve decoder $z$'yi yok sayıyor. Buna ne denir?"
    options:
      - {t: "Posterior collapse", ok: true, why: "Güçlü decoder'larda sık görülür; KL annealing (β'yı 0'dan 1'e çıkarma) ya da free-bits gibi çözümler var."}
      - {t: "Mode collapse", why: "O, GAN'larda üretecin tek bir moda çökmesi."}
      - {t: "Overfitting", why: "Ezberleme değil; gizil değişken kullanılmıyor."}
  - q: "IWAE sınırı K arttıkça ne olur?"
    options:
      - {t: "$\\log p(x)$'e alttan monoton yaklaşır; K = 1'de ELBO'dur", ok: true, why: "Jensen boşluğu, ağırlıkların ortalaması alındıkça küçülür."}
      - {t: "Varyansı artar", why: "Sınır sıkılaşır; tahmin edicinin varyansı da genelde düşer."}
      - {t: "$\\log p(x)$'i aşar", why: "Beklentide hep alt sınırdır."}

extras:
  - {id: x1, title: "Gizli kayıp (γ = log σ²) ve ELBO boşluğu", engine: browser}
  - {id: x2, title: "β-VAE ve posterior çöküşü: doğrusal VAE'nin kapalı form optimumu", engine: browser}
  - {id: x3, title: "Gizli uzayda interpolasyon: lerp vs slerp", engine: browser}

homework:
  - title: "Kingma & Welling (2014): Auto-Encoding Variational Bayes"
    paper: "Kingma & Welling — Auto-Encoding Variational Bayes (ICLR 2014)"
    url: "https://arxiv.org/abs/1312.6114"
    level: orta
    hours: 8
    goal: |
      Makalenin Şekil 2 deneyini tekrarla: MNIST/Frey Face'te gizli boyut N_z ∈ {3, 5, 10, 20} için d aşamasındaki VAE'yi eğitip ELBO'yu (alt sınır) eğitim örneği sayısına göre çiz; Şekil 4'teki 2B gizli uzay manifoldunu (ızgara üzerinde kod çözme) üret. Önemli örneklemeli tahminci (M5.1 e: IWAE) ile log p(x) tahminini ELBO ile karşılaştır.
    steps:
      - "Izgarayı Gauss önselin ters CDF'iyle oluştur (makalenin önerisi)."
    accept:
      - "Daha büyük N_z aşırı uyum göstermeden ELBO'yu iyileştirir (makaleyle uyumlu)."
      - "2B manifold rakamlar arasında yumuşak geçişler gösterir."
  - title: "Higgins ve ark. (2017): β-VAE"
    paper: "Higgins ve ark. — β-VAE: Learning Basic Visual Concepts with a Constrained Variational Framework (ICLR 2017)"
    url: "https://openreview.net/forum?id=Sy2fzU9gl"
    level: orta
    hours: 10
    goal: |
      dSprites veri setinde (şekil, ölçek, açı, x, y) β ∈ {1, 4, 16} ile konvolüsyonel VAE eğit; her gizli boyutu tek tek gezerek (latent traversal, Şekil 7) hangi üretici faktörü kodladığını göster ve x2'deki gibi aktif boyut sayısını (KL > 0.01 nat) β'ya göre raporla. Makalenin ayrıklık (disentanglement) ölçütünü basitleştirilmiş biçimde uygula.
    steps:
      - "KL ısınması (β'yı 0'dan hedefe doğrusal) ile ve onsuz çöken boyut sayısını karşılaştır."
    accept:
      - "β arttıkça daha az ama daha yorumlanabilir aktif boyut."
      - "Yeniden yapılandırma kalitesi–ayrıklık ödünleşimi tablosu."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: ELBO'yu iki yoldan türet
    goal: VAE kaybının nereden geldiğini görmek
    needs: Bayes kuralı, KL ıraksaması, Jensen eşitsizliği
    q: |-
      $\log p(x)\ge\mathbb E_{q(z|x)}[\log p(x|z)]-\mathrm{KL}(q(z|x)\,\|\,p(z))$'yi türet ve eşitsizliğin açığını bul.
    solution: |-
      **Yol 1 (eşitlik ile):** $\log p(x)=\mathbb E_q[\log p(x)]=\mathbb E_q\big[\log\frac{p(x,z)}{p(z|x)}\big]=\mathbb E_q\big[\log\frac{p(x,z)}{q(z|x)}\big]+\mathbb E_q\big[\log\frac{q(z|x)}{p(z|x)}\big]$. İkinci terim $\mathrm{KL}(q\,\|\,p(z|x))\ge0$. İlk terim ELBO: $\mathbb E_q[\log p(x|z)]-\mathrm{KL}(q\,\|\,p(z))$.

      **Sonuç:** $\log p(x)=\mathrm{ELBO}+\mathrm{KL}(q(z|x)\,\|\,p(z|x))$ — bu bir **eşitliktir**; açık, kodlayıcının gerçek posteriordan uzaklığıdır. ELBO'yu büyütmek hem olabilirliği artırır hem kodlayıcıyı posteriora yaklaştırır.

      **Yol 2 (Jensen):** $\log p(x)=\log\mathbb E_q\big[\frac{p(x,z)}{q(z|x)}\big]\ge\mathbb E_q\big[\log\frac{p(x,z)}{q(z|x)}\big]$ (log içbükey). Daha kısa ama açığın ne olduğunu söylemez.
  - id: p2
    type: hesap
    level: 1
    title: Tek boyutta KL terimi
    goal: Kapalı form KL'yi uygulamak
    needs: $\mathrm{KL}(\mathcal N(\mu,\sigma^2)\|\mathcal N(0,1))=\frac12(\mu^2+\sigma^2-1-\ln\sigma^2)$
    q: |-
      $\mu=1$, $\sigma=0.5$. KL kaç (nat)?
    answer: 0.8181471805599453
    calc: "0.5*(1+0.25-1-math.log(0.25))"
    tol: 1e-3
    mistakes:
      - {answer: 0.5965735902799727, msg: "Formülde σ² var; σ = 0.5 ise σ² = 0.25."}
      - {answer: 1.6362943611198906, msg: "½ çarpanını unuttun."}
    hints:
      - "$\\ln0.25=-1.386$."
    solution: |-
      $\frac12(1+0.25-1+1.386)=0.818$. $\mu$ terimi kodu merkeze, $\sigma^2-1-\ln\sigma^2$ terimi (minimumu σ = 1'de 0) varyansı 1'e çeker.
  - id: p3
    type: hesap
    level: 1
    title: Yeniden parametrelendirme
    goal: Örneklemenin türevlenebilir yazılışını uygulamak
    needs: $z=\mu+\sigma\varepsilon$
    q: |-
      $\mu=1$, $\log\sigma^2=\ln0.25$, $\varepsilon=-2$. $z$?
    answer: 0.0
    calc: "1+0.5*(-2)"
    mistakes:
      - {answer: 0.5, msg: "log σ² verildi; σ = exp(½ log σ²) = 0.5, varyans değil std ile çarp."}
    hints:
      - "$\\sigma=e^{\\frac12\\log\\sigma^2}$."
    solution: |-
      $\sigma=0.5$, $z=1+0.5\cdot(-2)=0$. $\partial z/\partial\mu=1$, $\partial z/\partial\sigma=\varepsilon$: rastgelelik ε'ya taşındığı için gradyan μ ve σ'ya akar.
  - id: p4
    type: yorumla
    level: 2
    title: KL sıfıra yapıştı
    goal: Posterior çöküşünü tanımak
    needs: P1
    q: |-
      Güçlü bir otoregresif kod çözücüyle VAE eğittin: KL terimi hızla ≈ 0'a indi, yeniden yapılandırma iyi, ama kod $z$'yi değiştirmek çıktıyı değiştirmiyor. Ne oldu?
    choices:
      - {t: "Mükemmel model: KL 0 en iyisi", why: "KL = 0, q(z|x) = p(z) demek: kod x hakkında hiçbir bilgi taşımıyor."}
      - {t: "Posterior çöküşü: kod çözücü x'i z olmadan modelleyebildiği için z'yi yok sayıyor; KL ısınması, serbest bit ya da daha zayıf kod çözücü gerekir", ok: true, why: "Bowman ve ark. 2016."}
      - {t: "Öğrenme oranı fazla", why: "Sistematik bir yerel optimum; η ile ilgili değil."}
    hints:
      - "KL = 0 ⇔ $q(z|x)=p(z)$ her x için."
    solution: |-
      ELBO'nun iki terimi çatışır: KL bedeli z'yi kullanmamayı ödüllendirir; kod çözücü tek başına yeterliyse optimum z'yi atmaktır. Çareler: KL ağırlığını 0'dan 1'e ısıtmak, boyut başına KL alt sınırı (free bits), kod çözücünün bağlamını kısıtlamak. β-VAE'de β > 1 bunu kötüleştirir (M5.1 ek alıştırması).
  - id: p5
    type: karşı-örnek
    level: 3
    title: Ortalama kod iyi örnek değildir
    goal: Önselden örnekleme ile gizli uzay deliklerini ilişkilendirmek
    needs: Toplam posterior (aggregate posterior)
    q: |-
      Yeniden yapılandırması iyi bir VAE'de $p(z)=\mathcal N(0,I)$'dan örneklenen kodlar neden bazen bulanık/anlamsız görüntü verir? $q(z)=\frac1N\sum_iq(z|x_i)$ ile $p(z)$'yi karşılaştırarak açıkla, bir örnek dağılım çiz/tarif et.
    rubric:
      - "Toplam posteriorun $p(z)$'ye eşit olmak zorunda olmadığını söyledim (KL her örnek için ayrı cezalandırır)"
      - "Örnek: iki küme hâlinde kodlar, aradaki bölge p(z)'de yüksek yoğunluklu ama q(z)'de boş"
      - "Kod çözücünün hiç görmediği bölgede ne üreteceğinin belirsiz olduğunu açıkladım"
      - "Çözüm olarak daha esnek önsel (VampPrior, karışım), ikinci aşama önsel modeli ya da latent diffusion önerdim"
    hints:
      - "Önselin yoğun olduğu ama hiçbir eğitim örneğinin kodlanmadığı bir bölge var mı?"
    solution: |-
      KL terimi her $q(z|x_i)$'yi $p(z)$'ye çeker ama toplamları $p(z)$'yi tam doldurmayabilir: ör. sınıflar iki ayrı kümeye kodlanırsa aradaki "delik" p(z)'de olası, kod çözücü için yabancıdır → bulanık ortalama görüntüler. Çözümler: öğrenilmiş önsel, iki aşamalı VAE ya da gizli uzayda ikinci bir üretken model (latent diffusion, M5.8).
pitfalls:
  - wrong: "VAE'nin kod çözücüsü doğrudan p(x|z)'den örnek üretir, bulanıklık kaçınılmazdır."
    right: "Bulanıklık çoğunlukla Gauss olabilirlik + ortalamayı çizmekten gelir; ayrık/otoregresif ya da algısal kayıplı kod çözücüler keskin örnek verir."
  - wrong: "KL terimini kaldırırsam daha iyi bir model olur."
    right: "Yeniden yapılandırma iyileşir ama önselden örnekleme anlamsızlaşır: kodlar önselle uyumsuz yerlere dağılır (sıradan AE)."
  - wrong: "log σ yerine σ'yı doğrudan çıkarmak sorun değil."
    right: "σ > 0 kısıtı ve sayısal kararlılık için log σ² (ya da softplus) çıkarılır."
whatif:
  - q: "Kodlayıcı varyansı her zaman çok küçük olsaydı?"
    a: "KL'nin −ln σ² terimi büyür; yeniden yapılandırma deterministik AE'ye yaklaşır ama ceza çok artar. Denge, bilgi miktarını (bit) belirler."
  - q: "Gizli boyut 2'den 200'e çıkarsa?"
    a: "Kullanılmayan boyutlar önsele çöker (KL ≈ 0, 'etkin olmayan birimler'); etkin boyut sayısı verinin karmaşıklığı ve β tarafından belirlenir."

labs:
  - id: l1
    lab: klasym
    title: "KL'nin iki yönü: moment eşleme ve tepe arama"
    goal: |
      İki tepeli bir dağılıma tek bir Gauss uydur. İleri KL(p‖q)'nün kapalı form çözümünü (ortalama ve varyans eşleme) ters KL(q‖p)'nin ızgara ya da yerel inişle bulunan çözümüyle karşılaştır. Tepelerin uzaklığı, genişliği ve ağırlığı değişince iki çözümün nasıl davrandığını izle.
    predict:
      q: "Eşit ağırlıklı, iyi ayrık iki tepe. Ters KL(q‖p)'yi en küçükleyen Gauss nereye yerleşir?"
      options:
        - {t: "İki tepenin ortasına, ikisini de örterek", why: "Bu ileri KL'nin çözümüdür (moment eşleme)."}
        - {t: "Tepelerden birinin üstüne", ok: true, why: "q'nun olasılık verdiği yerde p küçükse ceza büyüktür; tek tepeye oturan q için KL(q‖p) ≈ log(1/0.5) = 0.693 (ölçülen 0.693–0.70)."}
        - {t: "Rastgele bir yere", why: "Ters KL'nin iki yerel minimumu var ama ikisi de tepelerin üstünde."}
    presets:
      - {name: "Ayrık eşit tepeler", params: {m: 2.5, s: 0.6, w: 0.5, start: 0}, note: "İleri çözüm μ = 0, σ = 2.57; ters çözüm tepelerden birinde (σ ≈ 0.65), KL(q‖p) ≈ 0.70. İleri çözümün ters KL'si 14.1."}
      - {name: "Ağır sol tepe", params: {w: 0.8, start: 0}, note: "Ters KL büyük tepeyi seçiyor: KL(q‖p) = 0.23 ≈ log(1/0.8)."}
      - {name: "Yanlış başlangıç", params: {w: 0.8, start: 1}, note: "Sağ (hafif) tepeden başlayan gradyan inişi orada kalıyor: KL(q‖p) = 1.61 ≈ log(1/0.2). Ters KL dışbükey değil."}
      - {name: "Örtüşen tepeler", params: {m: 0.5, w: 0.5, start: 0}, note: "p neredeyse tek tepeli: iki yön de μ ≈ 0, σ ≈ 0.78 civarında çözüm veriyor."}
    questions:
      - q: "VAE'nin ELBO'su neden ters KL'yi kullanır, ileriyi değil?"
        a: "ELBO = log p(x) − KL(q‖p(z|x)) özdeşliği ters yönü verir ve beklenti q altında alındığı için q'dan örnekleyerek kestirilebilir. İleri KL(p(z|x)‖q) gerçek posteriordan örnek gerektirirdi; o hesaplanamıyor."
    limits: "Tek boyut ve tek Gauss q; KL'ler 600 noktalı ızgarada sayısal integralle hesaplanıyor. Ters KL çözümü 0.1'lik ızgarada ya da sonlu farklı gradyan inişiyle bulunuyor."
  - id: l2
    lab: gradest
    title: "Örnekleme içinden gradyan: reparametrizasyon ve skor fonksiyonu"
    goal: |
      ∂/∂μ E_{z~N(μ,σ²)}[f(z)] gradyanını n örnekle iki yoldan kestir: reparametrizasyon (f'nin türevi) ve skor fonksiyonu (f'nin değeri × log-yoğunluğun türevi). 400 tekrarda kestiricilerin ortalamasını (yanlılık) ve standart sapmasını (gürültü) karşılaştır; türevlenemeyen bir f'de ne olduğunu gör.
    predict:
      q: "f(z) = 1[z > 0] (basamak) için reparametrizasyon kestiricisi ne verir?"
      options:
        - {t: "Gerçek gradyanı, gürültüyle", why: "Basamağın türevi neredeyse her yerde 0'dır; yol türevi her örnekte 0 verir."}
        - {t: "Her zaman 0", ok: true, why: "Ölçülen: 0 ± 0; gerçek gradyan 0.352. Skor fonksiyonu 0.357 ± 0.20 ile doğru."}
        - {t: "Sonsuz", why: "Türev 0 noktasında tanımsız ama örnek tam 0'a düşmez."}
    presets:
      - {name: "f = z²", params: {f: 0, mu: 0.5, sigma: 1, n: 10, base: 0}, note: "Gerçek 1.0. Reparametrizasyon 1.016 ± 0.638, skor 1.074 ± 1.54: skor kestiricisi 2.4 kat gürültülü."}
      - {name: "Basamak", params: {f: 2, mu: 0.5, sigma: 1, n: 10}, note: "Reparametrizasyon 0 ± 0 (yanlış); skor 0.357 ± 0.20 (gerçek 0.352)."}
      - {name: "Taban çizgisi işe yarıyor", params: {f: 0, mu: 2, sigma: 1, n: 10, base: 1}, note: "μ = 2: skor std'si 3.17'den 2.23'e iniyor; ama örnek ortalaması aynı örneklerden geldiği için ortalama 4 yerine 3.71 ((n−1)/n yanlılığı)."}
      - {name: "Taban çizgisi işe yaramıyor", params: {f: 1, mu: 0.5, sigma: 1, n: 10, base: 1}, note: "f = sin z: taban çizgisi std'yi 0.183'ten 0.203'e çıkarıyor."}
    questions:
      - q: "Skor fonksiyonu kestiricisi neden yansızdır?"
        a: "∇_μ E_q[f] = ∫ f ∇_μ q = ∫ f q ∇_μ log q = E_q[f ∇_μ log q]; Gauss için ∇_μ log q = (z − μ)/σ². Sabit bir b için E_q[b ∇ log q] = b ∇ ∫ q = 0, bu yüzden sabit taban çizgisi yanlılık getirmez."
    limits: "Tek boyut, analitik gerçek gradyan; R = 400 tekrar. Gerçek VAE'de f bir sinir ağı ve z yüksek boyutludur; skor kestiricisinin varyansı boyutla hızla büyür."
  - id: l3
    lab: betavae
    title: "Doğrusal β-VAE: hangi gizil boyutlar çöker?"
    goal: |
      Doğrusal kodlayıcı ve kod çözücülü, Gauss olabilirlikli bir VAE'nin analitik optimumunda gizil boyutların hangilerinin kullanıldığını gör. Veri özdeğerleri, gözlem gürültüsü σ², KL ağırlığı β ve gizil boyut k değiştikçe aktif boyut sayısını, boyut başına KL'yi ve modellenen sinyal varyansını ölç.
    predict:
      q: "β = 1, σ² = 0.02 ve özdeğerler 0.7'nin kuvvetleriyken k = 8 gizil boyutun kaçı kullanılır? β'yı 10'a çıkarınca?"
      options:
        - {t: "8 ve 8", why: "Eşik βσ² = 0.2'ye çıkınca küçük özdeğerli yönler eşiğin altında kalır."}
        - {t: "8 ve 5", ok: true, why: "λ_8 = 0.7⁷ = 0.082 > 0.02, ama β = 10'da eşik 0.2 ve yalnız ilk 5 özdeğer (0.24'e kadar) aşıyor."}
