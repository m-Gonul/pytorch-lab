    right: "Ağırlıklar her pikselde içeriğe göre değişir; doğrusal ve uzayda değişmez değildir. Hızlandırmalar (bilateral ızgara, değer ekseninde ayrıklaştırma) farklı fikirlere dayanır."
  - wrong: "NLM bütün görüntüyü tarar."
