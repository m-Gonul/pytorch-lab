  - q: "NLM'de yama yerine derin öznitelikler karşılaştırılsa?"
    a: "Benzerlik yapısal (dönmüş, ölçeklenmiş) eşleşmeleri de yakalayabilir; non-local bloklar (Wang ve ark. 2018) bu fikri CNN katmanı olarak öğrenir ve öz-dikkatin (M4.13) görüntüdeki karşılığıdır."
