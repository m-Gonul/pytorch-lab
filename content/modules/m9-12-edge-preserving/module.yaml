id: m9-12-edge-preserving
code: M9.12
title: CLAHE, bilateral ve non-local means
phase: 9
minutes: 420
prereq: [m9-2-intensity-histogram, m9-5-restoration]
summary: >
  Yerel kontrast ve kenar koruyan gürültü giderme: uyarlamalı histogram
  eşitleme (AHE), kontrast sınırlama ve döşeme (tile) enterpolasyonu ile
  CLAHE; uzaysal ve değer (range) çekirdeğinin çarpımı olan bilateral süzgeç;
  benzer yamaları tüm arama penceresinden toplayan non-local means ve
  "yöntem gürültüsü". Alıştırma 7, 8, 9'un hepsi: saf Python'da OpenCV'nin
  kırpma–yeniden dağıtma kuralı ve bilateral; NumPy'da `cv2.createCLAHE`
  ile piksel piksel aynı CLAHE; PyTorch'ta türevlenebilir bilateral ve
  σ'ları gradyanla bulma; en sonda ofset döngüsü + kutu süzgeciyle hızlı
  NLM.
goals:
  - "AHE'nin düz bölgelerde gürültüyü neden büyüttüğü; kırpma eşiğiyle CDF eğimini sınırlamak"
  - "Döşeme başına LUT ve dört LUT'un bilineer karışımı; sınır ve köşe pikselleri"
  - "[[bilateral süzgeç]]: $G_{\\sigma_s}(\\lVert p-q\\rVert)\\,G_{\\sigma_r}(|I_p-I_q|)$ ve parametrelerin anlamı"
  - "[[non-local means]] ve yöntem gürültüsü (method noise)"
sources:
  - {title: "Zuiderveld — Contrast Limited Adaptive Histogram Equalization (Graphics Gems IV, 1994)", url: "https://doi.org/10.1016/B978-0-12-336156-1.50061-6", license: "©", use: link}
  - {title: "Paris, Kornprobst, Tumblin, Durand — A Gentle Introduction to Bilateral Filtering and its Applications (SIGGRAPH kursu)", url: "https://people.csail.mit.edu/sparis/bf_course/", license: "©", use: link}
  - {title: "Buades, Coll, Morel — A non-local algorithm for image denoising (CVPR 2005)", url: "https://doi.org/10.1109/CVPR.2005.38", license: "©", use: link}
  - {title: "Buades, Coll, Morel — Non-Local Means Denoising (IPOL 2011)", url: "https://doi.org/10.5201/ipol.2011.bcm_nlm", license: "CC-BY-NC-SA", use: link}
  - {title: "OpenCV — imgproc/src/clahe.cpp, bilateral_filter", url: "https://github.com/opencv/opencv/blob/4.x/modules/imgproc/src/clahe.cpp", license: "Apache-2.0", use: adapt}

hand:
  groups:
    - title: "CLAHE (OpenCV kuralı)"
      fields:
        - {id: cl, label: "64 × 64 döşeme, clipLimit = 2.0: tamsayı kırpma eşiği $\\lfloor2\\cdot4096/256\\rfloor$", answer: 32}
        - {id: b0, label: "8 bölmeli $[10,2,0,0,0,0,0,4]$, eşik 4: kırpma + yeniden dağıtma sonrası bölme 0", answer: 5}
        - {id: b6, label: "Aynı, bölme 6", answer: 0}
        - {id: lut2, label: "Aynı, $L=8$: LUT[2] = round(7 · cdf(2) / 16)", answer: 4}
        - {id: xa, label: "Döşeme genişliği 32, $x=20$: sağdaki döşemenin ağırlığı $x/32-0.5-\\lfloor\\cdot\\rfloor$", answer: 0.125}
    - title: "Ağırlıklar"
      fields:
        - {id: bw, label: "Bilateral: uzaklık 1, $\\sigma_s=2$; fark 20, $\\sigma_r=10$: $w$", answer: 0.119433, tol: 0.0001}
        - {id: nw, label: "NLM: yama MSE'si 50, $h=10$: $e^{-d^2/h^2}$", answer: 0.606531, tol: 0.0001}
  verify: |
    import math
    h = [10, 2, 0, 0, 0, 0, 0, 4]
    clip = 4
    ex = sum(max(v - clip, 0) for v in h)
    h = [min(v, clip) for v in h]
    batch, res = ex // 8, ex % 8
    h = [v + batch for v in h]
    step = max(8 // res, 1)
    i = 0
    while i < 8 and res > 0:
        h[i] += 1; i += step; res -= 1
    cdf = [sum(h[:k + 1]) for k in range(8)]
    answers = dict(cl=int(2.0 * 4096 / 256), b0=h[0], b6=h[6], lut2=round(7 * cdf[2] / 16), xa=20 / 32 - 0.5,
                   bw=math.exp(-1 / 8) * math.exp(-400 / 200), nw=math.exp(-0.5))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "HE, kayan pencereli AHE ve CLAHE: gürültü büyütme", engine: browser}
  - {id: x2, title: "Renkli ve ortak (joint) bilateral", engine: browser}
  - {id: x3, title: "Yöntem gürültüsü: hangi süzgeç görüntüye en az dokunur?", engine: browser}

quiz:
  - q: "CLAHE'de histogramı kırpmak neyi sınırlar?"
    options:
      - {t: "CDF'nin, yani dönüşüm fonksiyonunun eğimini; böylece düz bölgelerde kontrast (ve gürültü) aşırı büyümez", ok: true, why: "Kazanç histogram yüksekliğiyle orantılıdır; kırpma onu tavanlar."}
      - {t: "Döşeme sayısını", why: "Döşeme ızgarası ayrı bir parametredir."}
      - {t: "Çıkışın en büyük değerini", why: "Çıkış yine 0–255."}
  - q: "Bilateral süzgecin σ_r'si sonsuza giderse ne olur?"
    options:
      - {t: "Değer ağırlığı hep 1 olur, süzgeç Gauss bulanıklaştırmaya döner", ok: true, why: "σ_r, 'kenar sayılacak en küçük genlik' ölçeğidir."}
      - {t: "Görüntü değişmez", why: "Bu σ_s → 0 ya da σ_r → 0 durumudur."}
      - {t: "Medyan süzgeci olur", why: "Ağırlıklı ortalama kalır."}
  - q: "NLM'yi bilateral'den ayıran fikir nedir?"
    options:
      - {t: "Benzerliği tek piksel değeriyle değil, çevresindeki yamayla ölçer ve uzaklığı cezalandırmadan geniş bir pencerede arar", ok: true, why: "Tekrarlayan doku ve kenarlarda çok daha fazla 'benzer' örnek bulur."}
      - {t: "Medyan kullanır", why: "Ağırlıklı ortalama kullanır."}
      - {t: "Frekans uzayında çalışır", why: "Uzaysal bir yöntemdir."}

homework:
  - title: "HDRNet: derin bilateral öğrenme"
    paper: "Gharbi, Chen, Barron, Hasinoff, Durand — Deep Bilateral Learning for Real-Time Image Enhancement (SIGGRAPH 2017)"
    url: "https://arxiv.org/abs/1707.02880"
    level: ileri
    hours: 16
    goal: |
      Düşük çözünürlüklü bir CNN'in bilateral ızgara (bilateral grid) içinde yerel afin renk dönüşümleri tahmin ettiği, tam çözünürlüğe ise öğrenilen bir rehber (guide) haritasıyla "dilimleme" (slicing) yaparak geçtiği HDRNet'i uygula. MIT-Adobe FiveK'den bir alt kümeyle (ya da kendi ürettiğin bir hedefle: CLAHE + doygunluk artırma) eğit.
    steps:
      - "Bilateral ızgara: (x, y, yoğunluk) 3-B ızgara; trilineer dilimleme işlemini `grid_sample` (5-B) ile türevlenebilir yaz."
      - "Düşük çözünürlük yolu: yerel ve küresel öznitelikler, ızgara başına 3 × 4 afin katsayı."
      - "Tam çözünürlük yolu: piksel başına öğrenilen rehber $g(p)$; çıkış $A[x,y,g(p)]\\,[r,g,b,1]^T$."
      - "Hedef olarak bu modüldeki CLAHE'yi (Lab'ın L kanalında) kullanıp ağın onu taklit etmesini dene; 4K görüntüde süre ölç."
    accept:
      - "Test PSNR ≥ 25 dB (kendi hedefin için) ve 1080p'de CPU'da bile < 100 ms çıkarım."
      - "Rehber haritasının görselleştirmesi."
      - "Izgara derinliği (8, 16) ve uzaysal çözünürlük (8, 16) ablasyonu."

labs:
  - id: l1
    lab: bilateral1d
    title: "Bilateral süzgeç: σ_s, σ_r ve yineleme"
    goal: "Bilateral ağırlık = uzamsal Gauss × değer Gauss'u: $w=e^{-\\|p-q\\|^2/2\\sigma_s^2}\\,e^{-(I_p-I_q)^2/2\\sigma_r^2}$. Değer farkı σ_r'yi aşan komşular ortalamaya girmez: kenar korunur. Ama kontrastı σ_r'den küçük ince yapılar da 'gürültü' sayılır."
    predict:
      q: "σ_r'yi çok büyük yaparsan bilateral neye dönüşür?"
      options:
        - {t: "Medyan süzgecine", why: "Ağırlıklı ortalama kalır."}
        - {t: "Gauss süzgecine", ok: true, why: "Değer terimi ≈ 1 olur."}
        - {t: "Hiçbir şey yapmaz", why: "Bu σ_r → 0 limiti."}
    presets:
      - {name: "Bilateral ≈ Gauss", params: {sr: 2}, note: "Kenarlar yayıldı."}
      - {name: "σ_r < gürültü", params: {sr: 0.03, noise: 0.1}, note: "Hiç düzleştirmiyor."}
      - {name: "Yineleme", params: {it: 6, B: {it: 1}}, note: "Yinelemek düz bölgeleri iyice düzleştirir, eğimleri basamaklandırır (karikatür)."}
    limits: "1B sinyal; 2B'de aynı ilke, maliyet pencere alanıyla büyür."
  - id: l2
    lab: clahelab
    title: "Global HE, AHE ve CLAHE: kazanç, gürültü ve döşeme sınırları"
    goal: |
      Karanlık ve parlak bölgelerde ±8 gri seviyelik ayrıntılar ve ortada düz, gürültülü bir bant içeren görüntüye global HE, döşemeli AHE ve CLAHE uygula. Ayrıntı karşıtlığını, düz banttaki gürültü büyümesini ve enterpolasyonsuz döşeme sınırlarındaki sıçramayı ölç; sol üst döşemenin dönüşüm fonksiyonunu gör. Gerçekleştirim cv2.createCLAHE ile karşılaştırıldı (en çok 1 gri seviye fark).
    predict:
      q: "Kırpmasız AHE (4 × 4) karanlık bölgedeki disk karşıtlığını 7.9'dan 101'e çıkarıyor. Düz banttaki gürültüye ne olur (girdi ≈ 2)?"
      options:
        - {t: "Değişmez", why: "Düz bantta histogram tek bir tepe: CDF orada çok dik."}
        - {t: "≈ 24'e çıkar", ok: true, why: "Tepe dar bir aralığı geniş bir aralığa eşler; CLAHE (clip 2) bunu 5.2'de tutuyor."}
        - {t: "Azalır", why: "Eşitleme gürültüyü azaltmaz."}
    presets:
      - {name: "Global HE", params: {m: 0, noise: 2}, note: "Disk karşıtlığı 46, gürültü 12."}
      - {name: "AHE", params: {m: 1, g: 1, interp: 1}, note: "Karşıtlık 101 ama gürültü 24."}
      - {name: "CLAHE clip 2", params: {m: 2, g: 1, clip: 2, interp: 1}, note: "Karşıtlık 20, gürültü 5.2."}
      - {name: "CLAHE clip 8", params: {m: 2, clip: 8}, note: "Karşıtlık 50, gürültü 15: AHE'ye yaklaşıyor."}
      - {name: "Enterpolasyonsuz", params: {m: 2, interp: 0}, note: "Döşeme sınırında sıçrama 6.4'ten 28'e."}
      - {name: "8 × 8 döşeme", params: {m: 2, g: 2}, note: "Döşemeler disklerden küçük: karşıtlık 2.2'ye düşüyor."}
    questions:
      - q: "CLAHE'de clipLimit = 1 ne yapar, neden global HE'den bile az karşıtlık kazandırabilir?"
        a: "Eşik ⌊alan/256⌋'ya, yani düz histogramın yüksekliğine iner: kırpılıp dağıtılan histogram neredeyse düzdür ve CDF neredeyse doğrusal (kimlik dönüşümüne yakın) olur. Kazanç her değerde ≈ 1 ile sınırlanır."
    limits: "96 × 96 yapay görüntü; OpenCV kuralı (tek geçişli yeniden dağıtma); yansıtmalı kenar yerine kenar döşemesine sabitleme."
  - id: l3
    lab: nlmlab
    title: "Gauss, bilateral ve non-local means: PSNR, doku ve yöntem gürültüsü"
    goal: |
      Çizgili doku, kare ve rampa içeren gürültülü bir sahneye Gauss, 2-B bilateral ve NLM uygula. PSNR'ı, doku karşıtlığının korunmasını ve temiz görüntüye uygulanınca kalan yöntem gürültüsünü (RMS ve görüntü) karşılaştır; NLM'nin yama, arama penceresi ve h parametrelerini ve hesap maliyetini incele.
    predict:
      q: "σ = 0.08 gürültüde (girdi 21.9 dB) hangi süzgeç en yüksek PSNR'ı verir?"
      options:
        - {t: "Gauss σ = 1", why: "22.3 dB: doku ve kenarlar da yumuşuyor."}
        - {t: "Bilateral", why: "27.9 dB: iyi, ama yalnız tek piksel değerine bakıyor."}
        - {t: "NLM", ok: true, why: "29.5 dB (3 × 3 yamayla 30.6): aynı fazdaki çizgiler uzakta da olsa birbirini ortalıyor."}
    presets:
      - {name: "Gauss", params: {m: 0, gs: 1, noise: 0.08}, note: "22.3 dB, doku 0.23."}
      - {name: "Bilateral", params: {m: 1, ss: 1.5, sr: 0.15}, note: "27.9 dB, doku 0.40, yöntem gürültüsü 0.009."}
      - {name: "NLM", params: {m: 2, P: 1, S: 2, h: 0.1}, note: "29.5 dB; maliyet Gauss'un 114 katı; yöntem gürültüsü 0.025 (rampada)."}
      - {name: "NLM h büyük", params: {m: 2, h: 0.3}, note: "19.3 dB: farklı yamalar da benzer sayılıyor, görüntü bulanıklaşıyor."}
      - {name: "NLM küçük pencere", params: {m: 2, S: 0}, note: "7 × 7 pencere: 28.4 dB, maliyet 4.7 kat az."}
      - {name: "Yüksek gürültü, NLM", params: {m: 2, noise: 0.15, h: 0.18}, note: "22.7 dB (bilateral σ_r = 0.3: 22.1, Gauss: 21.4)."}
    questions:
      - q: "Bu sahnede bilateral'in yöntem gürültüsü neden NLM'ninkinden küçük, bu NLM'nin daha kötü bir süzgeç olduğunu mu gösterir?"
        a: "Sahne parçalı sabit ve kenarları keskin: σ_r = 0.15 bütün kenarları dışladığı için bilateral temiz görüntüyü neredeyse hiç değiştirmiyor. NLM ise rampada eğim kadar farklı yamaları h'ye göre benzer sayıp rampayı hafifçe düzleştiriyor. Doğal görüntülerde ve gürültülü girdide asıl ölçüt PSNR ve yöntem gürültüsünün yapısızlığıdır; orada NLM üstündür."
    limits: "48 × 48 yapay sahne; NLM yama uzaklığı ağırlıksız ortalama kare fark; bilateral pencere ±2σ_s."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bilateral ağırlıkları
    goal: İki terimin çarpımını hesaplamak
    needs: $w=e^{-d^2/2\sigma_s^2}e^{-\Delta I^2/2\sigma_r^2}$
    q: |-
      $\sigma_s=2$, $\sigma_r=0.1$. Merkez değeri 0.5. Komşu A: uzaklık 1, değer 0.52; komşu B: uzaklık 1, değer 0.8. Ağırlıklar?
    solution: |-
      Uzay terimi ikisinde $e^{-1/8}=0.882$. Değer terimi A: $e^{-0.0004/0.02}=0.980$, B: $e^{-0.09/0.02}=0.011$. $w_A=0.865$, $w_B=0.0098$: B kenarın öbür yanında, ortalamaya neredeyse girmez.
  - id: p2
    type: hesap
    level: 1
    title: OpenCV kırpma eşiği
    goal: clipLimit'i tamsayı eşiğe çevirmek
    needs: $\max(1,\lfloor\text{clip}\cdot\text{alan}/256\rfloor)$
    q: |-
      512 × 512 görüntü, 8 × 8 döşeme ızgarası, clipLimit = 3. Tamsayı eşik?
    answer: 48
    calc: "max(1, math.floor(3*(512//8)**2/256))"
    tol: 0
    mistakes:
      - {answer: 3072, msg: "Alan döşemenin alanıdır (64 × 64 = 4096), görüntünün değil; ayrıca 256'ya bölünür."}
      - {answer: 16, msg: "clipLimit = 1 için; 3 ile çarp."}
    hints:
      - "Döşeme 64 × 64 = 4096 piksel."
    solution: |-
      $\lfloor3\cdot4096/256\rfloor=48$: bir bölmede en çok 48 piksel; düz histogramda bölme başına 16 olurdu.
  - id: p3
    type: hesap
    level: 1
    title: CLAHE enterpolasyon ağırlığı
    goal: Döşeme merkezlerine göre konum
    needs: $f=x/t-0.5$, ağırlık $f-\lfloor f\rfloor$
    q: |-
      Döşeme genişliği 64, $x=100$. Sağdaki döşemenin LUT'unun ağırlığı?
    answer: 0.0625
    calc: "100/64-0.5-math.floor(100/64-0.5)"
    tol: 1e-9
    mistakes:
      - {answer: 0.5625, msg: "0.5 kayması unutulmuş: merkezler x = 32, 96, … ."}
      - {answer: 0.9375, msg: "Bu soldaki döşemenin ağırlığı."}
    hints:
      - "Merkezler 32 ve 96; 100, 96'nın 4 piksel sağında."
    solution: |-
      $100/64-0.5=1.0625$: soldaki döşeme 1 (merkez 96) ağırlığı 0.9375, sağdaki (merkez 160) 0.0625.
  - id: p4
    type: hesap
    level: 2
    title: NLM maliyeti
    goal: Arama penceresi ve yamanın etkisi
    needs: Piksel başına (S² − 1) · P² çarpım
    q: |-
      1024 × 1024 görüntü, 7 × 7 yama, 21 × 21 arama penceresi. Toplam yama farkı terimi (milyar, 2 basamak)?
    answer: 22.61
    calc: "round(1024*1024*(21*21-1)*49/1e9, 2)"
    tol: 0.01
    mistakes:
      - {answer: 0.46, msg: "Yama boyu (49) ile çarpılmadı."}
      - {answer: 26.31, msg: "Arama penceresi 21² − 1 = 440, 512 değil."}
    hints:
      - "$1\\,048\\,576\\cdot440\\cdot49$."
    solution: |-
      $\approx2.26\cdot10^{10}$ işlem. Hızlı uygulamalar yama farkını bir kutu süzgeciyle (integral görüntü) her ofset için bir kez hesaplar: maliyet $P^2$'den bağımsız olur (aşama e).
  - id: p5
    type: yorumla
    level: 2
    title: CLAHE'de gökyüzü kumlanıyor
    goal: Kırpma eşiğini ayarlamak
    needs: Kazanç = CDF eğimi
    q: |-
      Bir manzara fotoğrafına clipLimit = 20 ile CLAHE uygulanıyor. Ön plandaki ayrıntılar güzel çıkıyor ama düz gökyüzü kumlu, benekli bir görünüm alıyor. Neden ve ne yapılmalı?
    choices:
      - {t: "Döşeme ızgarası çok kaba", why: "Izgara gökyüzündeki gürültü büyütmesini açıklamaz."}
      - {t: "Düz gökyüzü döşemelerinde histogram dar bir tepe; büyük eşik kırpmayı neredeyse kaldırıyor ve CDF dikleşip gürültüyü büyütüyor; clipLimit 2–4'e indirilmeli", ok: true, why: "Lab l2: clip 8'de gürültü 15, clip 2'de 5.2."}
      - {t: "Enterpolasyon kapalı", why: "O, döşeme sınırlarında basamak yapar; benek değil."}
    hints:
      - "Kırpma neyin eğimini sınırlıyordu?"
    solution: |-
      Gürültü büyütmesi CDF'in eğimiyle orantılıdır; düz bölgenin dar histogram tepesi kırpılmadıkça eğim çok büyüktür. clipLimit'i küçültmek tepeyi keser, kazancı sınırlar.
  - id: p6
    type: kanıt
    level: 3
    title: Bilateral'in Gauss'a indirgenmesi ve normalizasyon
    goal: Sınır durumlarını kanıtlamak
    needs: Değer teriminin limitleri
    q: |-
      (a) $\sigma_r\to\infty$'da bilateral süzgecin Gauss bulanıklaştırmaya, (b) $\sigma_r\to0$'da (sürekli değerli, eşit değeri olmayan bir görüntüde) kimlik dönüşümüne indirgendiğini göster. (c) $W_{\mathbf p}$ olmadan sabit bir görüntünün neden değişeceğini açıkla.
    rubric:
      - "σ_r → ∞ için G_σr → 1 (sabit) ve W_p'nin uzay ağırlıklarının toplamına indiğini gösterdim"
      - "σ_r → 0 için yalnız I_q = I_p olan terimlerin (q = p) kaldığını gösterdim"
      - "Sabit I = c için Σ w·c / Σ w = c olduğunu, normalizasyonsuz ise Σw·c ≠ c olduğunu belirttim"
      - "Ağırlıkların konuma bağlı olduğu için normalizasyonun her pikselde ayrı yapılması gerektiğini söyledim"
    hints:
      - "Gauss değer teriminin σ_r'ye göre limitlerine bak."
    solution: |-
      (a) $G_{\sigma_r}(\Delta)\to$ sabit, sadeleşir: $BF=\sum G_{\sigma_s}I_q/\sum G_{\sigma_s}$, Gauss bulanıklaştırma. (b) $\Delta\ne0$ için $G_{\sigma_r}(\Delta)/G_{\sigma_r}(0)\to0$: yalnız $q=p$ terimi kalır, $BF=I_p$. (c) Ağırlıklar konuma ve içeriğe bağlıdır; toplamları her pikselde farklıdır. $W_{\mathbf p}$ ile bölmek, ağırlıkların toplamını 1 yaparak sabit görüntüyü değiştirmemeyi (ortalama parlaklığı korumayı) garanti eder.
pitfalls:
  - wrong: "AHE her zaman global HE'den iyidir."
    right: "Düz bölgelerde dar histogram CDF'i dikleştirir ve gürültüyü aşırı büyütür; kontrast sınırlama (CLAHE) olmadan çoğu zaman daha kötü görünür."
  - wrong: "CLAHE'de döşeme ne kadar küçükse o kadar yerel ve iyi."
    right: "Döşeme, korunmak istenen ayrıntıdan büyük olmalı; aksi hâlde ayrıntı döşemenin 'zemini' olur ve karşıtlık kaybolur (lab l2'de 8 × 8 ızgara)."
