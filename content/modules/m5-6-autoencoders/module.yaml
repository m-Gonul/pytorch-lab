id: m5-6-autoencoders
code: M5.6
title: Autoencoder ailesi — yığılmış, bağlı ağırlıklı, gürültü giderici, seyrek, konvolüsyonel
phase: 5
minutes: 360
prereq: [m5-1-vae, m3-7-regularization-nn]
summary: >
  Kısıtlar altında özdeşlik fonksiyonunu öğrenmenin yan ürünü olarak
  temsiller: eksik (undercomplete) ve aşırı tam (overcomplete) kodlar,
  yığılmış (derin) autoencoder'lar, kodlayıcı–kod çözücü ağırlıklarını
  bağlamak ($W_{N-L+1}=W_L^\top$), açgözlü katman katman ön eğitim,
  autoencoder ile denetimsiz ön eğitim ve az etiketle sınıflandırma,
  gürültü giderici (Gauss ve maskeleme gürültüsü), seyrek (L1 ve KL
  cezası) ve konvolüsyonel/rekürent autoencoder'lar. NumPy'da bağlı
  ağırlıklı seyrek autoencoder'ın gradyanları elle, PyTorch'ta yığılmış AE,
  bağlı ağırlık, DAE ve ön eğitimle sınıflandırma, sonda konvolüsyonel vs
  yoğun AE. Ekler: doğrusal DAE'nin kapalı form çözümü, büzüşen
  (contractive) AE, yeniden yapılandırma hatasıyla anomali tespiti.
goals:
  - "Eksik / aşırı tam kod; [[bağlı ağırlıklar]] ile parametreyi yarıya indirmek"
  - "[[gürültü giderici autoencoder]]: maskeleme ve Gauss gürültüsü; doğrusal DAE = büzülme"
  - "[[seyrek autoencoder]]: KL($\\rho\\Vert\\hat\\rho$) cezası ve gradyanı"
  - "Denetimsiz ön eğitim: AE kodlayıcısı + az etiket"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 17", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Hinton & Salakhutdinov — Reducing the Dimensionality of Data with Neural Networks (Science 2006)", url: "https://www.cs.toronto.edu/~hinton/absps/science.pdf", license: "©", use: link}
  - {title: "Vincent ve ark. — Stacked Denoising Autoencoders (JMLR 2010)", url: "https://www.jmlr.org/papers/v11/vincent10a.html", license: "©", use: link}
  - {title: "Ng — Sparse autoencoder (CS294A ders notları)", url: "https://web.stanford.edu/class/cs294a/sparseAutoencoder.pdf", license: "©", use: link}
  - {title: "Rifai ve ark. — Contractive Auto-Encoders (ICML 2011)", url: "https://icml.cc/2011/papers/455_icmlpaper.pdf", license: "©", use: link}
  - {title: "Bengio ve ark. — Greedy Layer-Wise Training of Deep Networks (NeurIPS 2006)", url: "https://papers.nips.cc/paper/2006/hash/5da713a690c067105aeb2fae32403405-Abstract.html", license: "©", use: link}
  - {title: "UvA DL Notebooks — Tutorial 9: Autoencoders", url: "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial9/AE_CIFAR10.html", license: "MIT", use: link}

hand:
  groups:
    - title: "Yığılmış AE 784 → 100 → 30 → 100 → 784 (bias dahil)"
      fields:
        - {id: full, label: "Bağsız parametre sayısı", answer: 163814}
        - {id: tied, label: "Bağlı ağırlıklarla ($W_{dec}=W_{enc}^\\top$, kod çözücü bias'ları ayrı)", answer: 82414}
    - title: "Seyrek AE: hedef $\\rho=0.05$, ölçülen ortalama aktivasyon $\\hat\\rho=0.2$"
      fields:
        - {id: kl, label: "$\\mathrm{KL}(\\rho\\Vert\\hat\\rho)=\\rho\\log\\frac{\\rho}{\\hat\\rho}+(1-\\rho)\\log\\frac{1-\\rho}{1-\\hat\\rho}$", answer: 0.09394302602433154, tol: 1.0e-6}
        - {id: dkl, label: "$\\partial\\mathrm{KL}/\\partial\\hat\\rho$", answer: 0.9375, tol: 1.0e-9}
    - title: "Diğer"
      fields:
        - {id: pca, label: "Doğrusal AE, 2 boyutlu kod; veri kovaryansının özdeğerleri 5, 3, 1, 0.5 → en küçük toplam yeniden yapılandırma hatası (örnek başına beklenen)", answer: 1.5, tol: 1.0e-9}
        - {id: up, label: "Konvolüsyonel kod çözücü: 7 × 7 → ConvTranspose(k = 3, s = 2, p = 1, output_padding = 1) → kenar", answer: 14}
  verify: |
    import math
    lin = lambda a, b: a * b + b
    full = lin(784, 100) + lin(100, 30) + lin(30, 100) + lin(100, 784)
    tied = lin(784, 100) + lin(100, 30) + 100 + 784
    answers = dict(full=full, tied=tied, kl=0.05 * math.log(0.05 / 0.2) + 0.95 * math.log(0.95 / 0.8), dkl=-0.05 / 0.2 + 0.95 / 0.8,
                   pca=1 + 0.5, up=(7 - 1) * 2 - 2 + 3 + 1)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Doğrusal gürültü giderici AE'nin kapalı form çözümü", engine: browser}
  - {id: x2, title: "Büzüşen (contractive) autoencoder: Jacobian cezası", engine: browser}
  - {id: x3, title: "Yeniden yapılandırma hatasıyla anomali tespiti ve ROC AUC", engine: browser}

quiz:
  - q: "Aşırı tam (kod girdiden büyük) bir autoencoder neden kısıtsız eğitilemez?"
    options:
      - {t: "Özdeşliği doğrudan kopyalayabilir: yeniden yapılandırma mükemmel olur ama hiçbir yapı öğrenilmez. Gürültü, seyreklik ya da Jacobian cezası gibi kısıtlar gerekir", ok: true, why: "Eksik kodda darboğazın kendisi kısıttır."}
      - {t: "Çok yavaş olduğu için", why: "Sorun öğrenilen temsil."}
      - {t: "Gradyanlar sıfır olduğu için", why: "Hayır."}
  - q: "Seyreklik için neden aktivasyonlara L2 değil L1 cezası?"
    options:
      - {t: "L1 önemsiz kodları tam sıfıra iterken önemlileri korur; L2 tüm kodları orantılı küçültür", ok: true, why: "Géron; M1.3'teki Lasso/Ridge farkının aynısı."}
      - {t: "L1 türevlenebilir, L2 değil", why: "Tersi daha doğru (0'da)."}
      - {t: "Fark yok", why: "Var."}
  - q: "Bağlı ağırlıklarda W'nin gradyanı neden iki terimden oluşur?"
    options:
      - {t: "Aynı matris hem kodlayıcıda ($XW$) hem kod çözücüde ($zW^\\top$) kullanılır; zincir kuralı iki kullanımın katkısını toplar", ok: true, why: "c aşamasında elle türetilir."}
      - {t: "Momentum yüzünden", why: "Hayır."}
      - {t: "Bias'tan dolayı", why: "Hayır."}

homework:
  - title: "Vincent ve ark. (2010): yığılmış gürültü giderici AE'ler"
    paper: "Vincent, Larochelle, Lajoie, Bengio, Manzagol — Stacked Denoising Autoencoders: Learning Useful Representations in a Deep Network with a Local Denoising Criterion (JMLR 2010)"
    url: "https://www.jmlr.org/papers/v11/vincent10a.html"
    level: orta
    hours: 10
    goal: |
      MNIST'te 3 katmanlı SDAE'yi açgözlü katman katman eğit (her katman bir öncekinin kodunu maskeleme gürültüsüyle yeniden yapılandırır), sonra denetimli ince ayar yap. Makale Tablo 3'ün küçük sürümü: gürültü türü (maskeleme, Gauss, tuz-biber) × düzeyi için sınıflandırma hatası; ilk katman filtrelerini (Şekil 6–7) gürültü düzeyine göre görselleştir — gürültü arttıkça filtrelerin yerelleşip kenar dedektörlerine dönüştüğünü göster.
    steps:
      - "d aşamasındaki greedy_pretrain ve maskeleme gürültüsünü kullan."
    accept:
      - "Gürültüsüz AE ön eğitimine göre SDAE daha düşük test hatası."
      - "Filtre görselleri gürültüyle yapılanır."
  - title: "Hinton & Salakhutdinov (2006): derin AE ile boyut indirgeme"
    paper: "Hinton & Salakhutdinov — Reducing the Dimensionality of Data with Neural Networks (Science 2006)"
    url: "https://www.cs.toronto.edu/~hinton/absps/science.pdf"
    level: orta
    hours: 8
    goal: |
      784-1000-500-250-2 derin autoencoder'ı (RBM ön eğitimi yerine katman katman AE ön eğitimi ya da modern başlatma + Adam ile) eğit; 2B kodları PCA'nın ilk iki bileşeniyle yan yana çiz (makale Şekil 3) ve 30 boyutlu kodda yeniden yapılandırma hatasını PCA-30 ile karşılaştır (Şekil 2). Ön eğitimsiz, rastgele başlatılmış derin AE'nin (2006 koşullarında) neden takıldığını sigmoid aktivasyon + SGD ile gözle.
    steps:
      - "Aynı ağı ReLU + BatchNorm + Adam ile ön eğitimsiz de eğit: 2006'nın problemi bugün çözülmüş mü?"
    accept:
      - "Derin AE 2B'de sınıfları PCA'dan belirgin daha iyi ayırır."
      - "30 boyutta yeniden yapılandırma hatası PCA'dan düşük."

labs:
  - id: l1
    lab: dae1d
    title: "En iyi gürültü giderici: E[x | x′] ve Tweedie skoru"
    goal: |
      İki tepeli 1-B bir veride (x′ = gürültülü girdi, metindeki x̃), kare hatayla eğitilmiş sonsuz kapasiteli bir gürültü giderici otomatik kodlayıcının optimumunu kesin hesapla: r*(x′) = E[x | x′]. Artığın σ² · skor'a eşit olduğunu (Tweedie) ve iki tepenin ortasında çıktının ortalamaya (bulanığa) düştüğünü gör.
    predict:
      q: "Tepeler ±2'de, eşit ağırlıklı. Gürültülü girdi tam ortada (x′ = 0) olursa en iyi gürültü gidericinin çıktısı nedir?"
      options:
        - {t: "+2 ya da −2: en yakın tepeye gider", why: "İki tepe eşit uzaklıkta ve eşit olası; MSE'yi en küçükleyen tahmin birini seçmez."}
        - {t: "0: iki tepenin ortalaması", ok: true, why: "E[x | x′ = 0] = 0.5·(−2) + 0.5·(+2) ölçeğinde bir ortalamadır; verinin hiç bulunmadığı bir yerdir. MSE'li gürültü gidericilerin bulanıklığı buradan gelir."}
        - {t: "x′'nin kendisi; gürültü giderici değiştirmez", why: "Sonuç burada sayısal olarak 0 çıkar ama sebep özdeşlik değil simetridir; sol tepenin ağırlığını 0.8 yap ve çıktının −0.96'ya kaydığını gör."}
    presets:
      - {name: "Varsayılan", params: {sig: 0.6, m: 2, s: 0.3, w: 0.5, n: 400}, note: "Gürültülü örneklerin hatası 0.392 (≈ σ² = 0.36), en iyi gürültü gidericiden sonra 0.0714. Artık ile σ²·skor arasındaki en büyük fark 10⁻¹⁵ (yuvarlama hatası)."}
      - {name: "Az gürültü", params: {sig: 0.1}, note: "Hata 0.0109 → 0.0096: r* neredeyse özdeşlik, yalnız yerel yapı. Difüzyonun son adımları böyledir."}
      - {name: "Çok gürültü", params: {sig: 3}, note: "Hata 9.79 → 2.78: r* her şeyi veri ortalamasına çeker; iki tepe artık ayırt edilemez. Difüzyonun ilk adımları böyledir."}
      - {name: "Dengesiz tepeler", params: {w: 0.8}, note: "Sol tepe %80: r*(0) = −0.96. Belirsiz noktada çıktı olası tepeye kayar; skor da o yöne işaret eder."}
      - {name: "Örtüşen tepeler", params: {m: 1, s: 0.5}, note: "Tepeler örtüşünce gürültü giderme zorlaşır: hata 0.392 → 0.253."}
    questions:
      - q: "Gerçek bir DAE (sonlu kapasite, sonlu veri) bu optimumu öğrenir mi?"
        a: "Ancak yaklaşık olarak. Optimum, veri dağılımına göre tanımlanır; ağ yeterli kapasite ve veriyle buna yaklaşır. Tweedie bağıntısı yine de 'iyi eğitilmiş bir DAE'nin artığı skora yaklaşır' anlamına gelir (Alain ve Bengio 2014), skor tabanlı üretim bunu kullanır."
      - q: "Neden yalnız tek bir σ yetmez, difüzyon birçok σ kullanır?"
        a: "Küçük σ'da skor yalnız verinin çok yakınında doğru kestirilir (uzakta hiç örnek yok); büyük σ'da her yerde tanımlıdır ama ayrıntıyı bulanıklaştırır. Gürültü düzeylerini büyükten küçüğe sırayla kullanmak ikisinin iyi yanını birleştirir (M5.3)."
    limits: "Veri 1-B Gauss karışımı; optimum kapalı formdan, eğitim yok. Gerçek DAE bu fonksiyona yalnız yaklaşır."
  - id: l2
    lab: sparsecode
    title: "Seyrek kod: L1 ile L2, aşırı tam sözlük"
    goal: |
      64 örnekli bir sinyali 128 atomluk (aşırı tam) bir sözlükle açıkla. L1 cezası (FISTA, yumuşak eşikleme) birkaç atomlu seyrek bir kod, L2 cezası (ridge) ise neredeyse tüm atomlara yayılan yoğun bir kod verir. λ, gürültü ve atomlar arası uzaklıkla seyrek kurtarmanın ne zaman başarılı olduğunu izle.
    predict:
      q: "Gerçek kodda 4 etkin atom var. L2 cezasıyla bulunan kodda kaç katsayı sıfırdan farklı (|z| > 0.001) olur?"
      options:
        - {t: "≈ 4", why: "L2 küçültür ama sıfırlamaz; enerji birbirine benzeyen komşu atomlara yayılır."}
        - {t: "≈ 15", why: "Bu L1 kodunun sayısı (varsayılanda 15)."}
        - {t: "128'e yakın", ok: true, why: "Varsayılanda 120. L2'nin çözümü (DᵀD + 2λI)⁻¹Dᵀx'tir; hiçbir bileşeni tam sıfırlayan bir mekanizma yoktur."}
    presets:
      - {name: "Varsayılan (L1)", params: {k: 4, gap: 8, lam: 0.05, noise: 0.05, pen: 0, iters: 800}, note: "L1: 15 etkin katsayı, en büyük 4 katsayının 4'ü de gerçek atomlarda; temiz sinyale hata 4.6·10⁻⁴. L2: 120 katsayı, hata 9.7·10⁻⁴."}
      - {name: "Aynı veri, L2", params: {pen: 1}, note: "120 katsayı; en büyük 4 katsayıdan yalnız 1'i gerçek atomda. Kod yoğun, yorumlanamaz."}
      - {name: "Büyük λ", params: {lam: 0.5}, note: "L1: yalnız 6 katsayı ama hata 0.0157 (L2: 0.0021). Katsayılar λ kadar küçüldüğü için genlik düşük kalır: L1'in yanlılığı."}
      - {name: "Küçük λ", params: {lam: 0.005}, note: "L1: 42 katsayı; ceza zayıfladıkça kod yoğunlaşır."}
      - {name: "Yakın atomlar", params: {gap: 0}, note: "Gerçek atomlar üst üste binebilir: en büyük 4 katsayının hiçbiri gerçek atomlarda değil, ama hata yine küçük (6·10⁻⁴). Sözlük yüksek tutarlılıkta; aynı sinyali açıklayan farklı seyrek kodlar var."}
      - {name: "Az FISTA adımı", params: {iters: 20}, note: "20 adımda 46 katsayı: yakınsamamış çözüm henüz seyrek değil. Seyreklik optimumun özelliğidir, ara adımların değil."}
      - {name: "Gürültülü, λ ayarlı", params: {noise: 0.2, lam: 0.15}, note: "σ = 0.2: λ = 0.05'te 36 katsayı ve 1 doğru atom; λ = 0.15 ile 17 katsayı, 3 doğru atom, hata 0.0071 (L2: 0.0102)."}
    questions:
      - q: "Seyrek otomatik kodlayıcıdaki L1 cezası bu deneydeki sözlük öğrenmeden nasıl farklıdır?"
        a: "Burada sözlük sabit, kod bir optimizasyonla bulunuyor. Seyrek AE'de kod, kodlayıcı ağın tek ileri geçişiyle üretilir ve sözlük (kod çözücü) birlikte öğrenilir. Kodlayıcı bu optimizasyonun bir yaklaşığıdır; LISTA (Gregor ve LeCun 2010) ISTA adımlarını doğrudan ağ katmanlarına açar."
    limits: "Sabit Gauss tümseği sözlüğü, tek sinyal. 'Gerçek desteğe düşen' sayımı ±1 konum toleranslıdır; L2 için 'sıfırdan farklı' eşiği 0.001."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bağlı ağırlıklarla parametre sayısı
    goal: Ağırlık bağlamanın kazancını hesaplamak
    needs: Doğrusal katman parametresi = girdi × çıktı + çıktı
    q: |-
      Simetrik yığılmış AE: 100 → 20 → 100 (tek gizli katman, biaslar dahil). Bağsız ve bağlı parametre sayısı?
    solution: |-
      Bağsız: $(100\cdot20+20)+(20\cdot100+100)=2020+2100=4120$. Bağlı: kod çözücünün ağırlığı $\mathbf W^\top$, yalnız 100 bias'ı yeni: $2020+100=2120$.

      Oran $4120/2120\approx1.94$: kazanç bias'lar yüzünden tam 2 değil.
  - id: p2
    type: hesap
    level: 1
    title: Yumuşak eşikleme
    goal: L1 yakınsal adımını uygulamak
    needs: $\mathrm{sign}(u)\max(|u|-\lambda,0)$
    q: |-
      $u=(0.8,\,-0.3,\,0.05,\,-1.2)$, $\lambda=0.25$. Yumuşak eşiklemeden sonra sıfırdan farklı bileşenlerin mutlak değerlerinin toplamı?
    answer: 1.55
    calc: "(0.8-0.25)+(0.3-0.25)+0+(1.2-0.25)"
    tol: 1e-6
    mistakes:
      - {answer: 2.0, msg: "Sert eşikleme yapılmış (|u| > λ olanlar aynen tutulmuş): 0.8 + 0.3 + 1.2. Yumuşak eşikleme kalanları da λ kadar küçültür."}
      - {answer: 1.5, msg: "−0.3 de eşiği geçiyor: |−0.3| − 0.25 = 0.05."}
    hints:
      - "Önce hangi bileşenlerin |u| > 0.25 olduğunu bul."
    solution: |-
      $(0.55,\,-0.05,\,0,\,-0.95)$; toplam $0.55+0.05+0.95=1.55$. $0.05$ tam sıfır oldu; büyük bileşenler $\lambda$ kadar küçüldü (yanlılık).
  - id: p3
    type: hesap
    level: 1
    title: Doğrusal DAE'nin küçültmesi
    goal: Gürültünün düzenlileştirme etkisini sayıyla görmek
    needs: $\mathbf W^*=\boldsymbol\Sigma(\boldsymbol\Sigma+\sigma^2\mathbf I)^{-1}$
    q: |-
      Veri kovaryansının bir özdeğeri $\lambda=3$, bozma gürültüsü $\sigma=1$. Doğrusal gürültü giderici AE o özyöndeki bileşeni hangi katsayıyla çarpar?
    answer: 0.75
    calc: "3/(3+1)"
    tol: 1e-6
    mistakes:
      - {answer: 1.0, msg: "Gürültü yokken (σ = 0) özdeşlik; gürültüyle küçültme var."}
      - {answer: 0.25, msg: "Bu σ²/(λ + σ²), atılan kısım."}
    hints:
      - "Özyönlerde matrisler köşegendir: $\\lambda/(\\lambda+\\sigma^2)$."
    solution: |-
      $3/(3+1)=0.75$. Küçük özdeğerli (gürültüye göre zayıf) yönler daha çok bastırılır, ridge regresyonla aynı biçim.
  - id: p4
    type: yorumla
    level: 2
    title: Mükemmel yeniden yapılandırma, işe yaramaz kod
    goal: Kısıtsız AE'nin kopyalamasını tanımak
    needs: Eksik/aşırı tamamlanmış AE
    q: |-
      784 → 1000 → 784 bir AE (kod girdiden büyük, başka kısıt yok) eğitim ve testte neredeyse sıfır yeniden yapılandırma hatası veriyor; ama kodlar üzerinde eğitilen doğrusal sınıflandırıcı ham piksellerden daha iyi değil. Ne olmuş olabilir?
    choices:
      - {t: "Eğitim yetersiz; daha uzun eğit", why: "Hata zaten sıfıra yakın; sorun eğitimde değil."}
      - {t: "Ağ özdeşliği öğrendi; kısıt ekle (gürültü, seyreklik ya da dar kod)", ok: true, why: "Aşırı tamamlanmış ve kısıtsız AE girdiyi koda kopyalayabilir; yararlı öznitelik öğrenmeye zorlanmaz."}
      - {t: "Öğrenme oranı fazla büyük", why: "Büyük öğrenme oranı düşük hatayla değil kararsızlıkla kendini gösterir."}
    hints:
      - "Kod katmanı 1000 birimse girdiyi saklamak için yer var mı?"
    solution: |-
      Kısıtsız aşırı tamamlanmış AE için özdeşlik (ya da ona yakın bir şey) bir çözümdür ve düşük hata yararlı temsil anlamına gelmez. Gürültü giderme (DAE), L1/KL seyreklik ya da dar bir kod katmanı ağı veri yapısını öğrenmeye zorlar.
  - id: p5
    type: kanıt
    level: 3
    title: Tweedie formülü
    goal: DAE artığının skor olduğunu göstermek
    needs: Gauss yoğunluğunun türevi, koşullu beklenti
    q: |-
      $\tilde x=x+\sigma\varepsilon$, $\varepsilon\sim\mathcal N(0,1)$, $p_\sigma(\tilde x)=\int p(x)\,\mathcal N(\tilde x;x,\sigma^2)\,dx$. $\mathbb E[x\mid\tilde x]=\tilde x+\sigma^2\frac{d}{d\tilde x}\log p_\sigma(\tilde x)$ olduğunu kanıtla.
    rubric:
      - "Gauss yoğunluğunun x′'ye göre türevini N · (x − x′)/σ² olarak yazdım"
      - "Türevi integralin içine aldım"
      - "Bayes kuralıyla p(x)N(x′; x, σ²)/p_σ(x′) = p(x | x′) olduğunu kullandım"
      - "Her iki yanı p_σ'ya bölüp log-türeve çevirdim"
    hints:
      - "$\\frac{d}{d\\tilde x}\\mathcal N(\\tilde x;x,\\sigma^2)=\\mathcal N(\\tilde x;x,\\sigma^2)\\frac{x-\\tilde x}{\\sigma^2}$."
    solution: |-
      $p_\sigma'(\tilde x)=\int p(x)\mathcal N(\tilde x;x,\sigma^2)\frac{x-\tilde x}{\sigma^2}dx$. İki yanı $p_\sigma(\tilde x)$'e bölünce sağda $p(x\mid\tilde x)$ ağırlıklı bir ortalama kalır: $\frac{p_\sigma'}{p_\sigma}=\frac{\mathbb E[x\mid\tilde x]-\tilde x}{\sigma^2}$. Sol yan $\frac{d}{d\tilde x}\log p_\sigma$'dır; düzenleyince sonuç çıkar. Kare hatayla eğitilmiş en iyi gürültü giderici tam olarak $\mathbb E[x\mid\tilde x]$ olduğu için artığı skoru verir.
pitfalls:
  - wrong: "Yeniden yapılandırma hatası ne kadar düşükse otomatik kodlayıcı o kadar iyi temsil öğrenmiştir."
    right: "Kısıtsız ya da çok güçlü bir AE özdeşliği (ya da her girdiyi bir indekse eşlemeyi) öğrenebilir. Temsilin kalitesi aşağı akış görevinde (sınıflandırma, anomali tespiti) ölçülmelidir."
  - wrong: "Bağlı ağırlıklı AE'de kod çözücü bias'ı da kodlayıcıdan alınır."
    right: "Yalnız ağırlık matrisi paylaşılır (Wᵀ); bias'ların boyutu farklıdır (kod çözücü bias'ı çıktı boyutunda), ayrı parametredir."
  - wrong: "Seyrek AE için L2 cezası da iş görür."
    right: "L2 tüm kodları orantılı küçültür, sıfırlamaz; seyreklik L1'in köşesinden (yumuşak eşikleme) ya da KL ile ortalama aktivasyonu hedefe çekmekten gelir."
  - wrong: "MSE ile eğitilmiş gürültü giderici belirsiz bir girdide olası temiz örneklerden birini seçer."
    right: "Koşullu ortalamayı verir; birden çok olası temiz örnek varsa ortalamaları, verinin hiç bulunmadığı bulanık bir noktadır. Keskin örnek için üretken model (difüzyon, GAN) gerekir."
whatif:
  - q: "Gürültü giderici AE'de σ → 0 olsaydı?"
    a: "Bozma kalkar ve sıradan (kısıtsız) AE'ye dönülür; aşırı tamamlanmış bir ağ yine özdeşliği öğrenebilir. Küçük σ'da DAE, kodlayıcının Jacobian'ını cezalandıran büzüşen AE'ye benzer bir düzenlileştirme yapar."
  - q: "Seyrek AE'de KL cezasının hedefi ρ = 0.5 olsaydı?"
    a: "Sigmoid kodlarda ortalama aktivasyonun 0.5 olması seyreklik değildir; ceza seyreklik yerine 'yarı yarıya etkin' kodları isterdi. Seyreklik için ρ küçük (0.01–0.1) seçilir."
  - q: "Doğrusal AE'ye derinlik eklesek (doğrusal katmanlar)?"
    a: "Doğrusal katmanların bileşimi yine doğrusaldır; en iyi çözüm aynı PCA alt uzayıdır. Doğrusal olmayan aktivasyon olmadan derinlik temsil gücü katmaz (optimizasyon dinamiğini değiştirir ama)."
