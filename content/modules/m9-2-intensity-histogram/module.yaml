id: m9-2-intensity-histogram
code: M9.2
title: Yoğunluk dönüşümleri ve histogram eşitleme
phase: 9
minutes: 270
prereq: [m9-1-digital-image]
summary: >
  Tek piksel işlemleri: negatif, log, gamma, parçalı doğrusal germe ve en
  önemlisi histogram eşitleme. 8 seviyeli klasik örnekte eşitleme dönüşümünü
  elle çıkarıyor, saf Python'da derste anlatılan ve OpenCV'nin kullandığı iki
  eşitleme formülünü yazıp OpenCV ile birebir karşılaştırıyor, NumPy'da tüm
  dönüşümleri arama tablosu (LUT) olarak döngüsüz kuruyor, PyTorch'ta
  türevlenebilir "yumuşak histogram" ile ton eğrisini gradient descent ile
  öğreniyor ve en sonda yüzlerce görüntüyü tek bir `bincount` ile
  eşitliyorsun.
goals:
  - "Nokta işlemlerini $s=T(r)$ arama tablosu olarak görmek; monotonluk koşulları"
  - "[[histogram eşitleme]]: $T(r)=(L-1)\\,\\mathrm{CDF}(r)$ ve OpenCV'nin $\\mathrm{cdf}_{\\min}$ düzeltmeli varyantı"
  - "Histogram eşleme (specification) ve yerel histogram istatistikleriyle iyileştirme"
  - "Türevlenebilir histogram: ayrık sayımı Gauss çekirdekleriyle yumuşatmak"
sources:
  - {title: "Gonzalez & Woods — Digital Image Processing, Bölüm 3.2–3.3", url: "https://www.imageprocessingplace.com/", license: "©", use: link}
  - {title: "OpenCV — Histogram Equalization tutorial ve equalizeHist", url: "https://docs.opencv.org/4.x/d4/d1b/tutorial_histogram_equalization.html", license: "Apache-2.0", use: adapt}
  - {title: "scikit-image — exposure modülü (equalize_hist, match_histograms)", url: "https://scikit-image.org/docs/stable/api/skimage.exposure.html", license: "BSD-3-Clause", use: adapt}

hand:
  groups:
    - title: "3 bit ($L=8$), $64\\times64$ görüntü; histogram $n_k=(790,1023,850,656,329,245,122,81)$. Ders formülü $s_k=\\operatorname{round}\\big(7\\sum_{j\\le k}p_j\\big)$"
      fields:
        - {id: s0, label: "$s_0$", answer: 1}
        - {id: s1, label: "$s_1$", answer: 3}
        - {id: s3, label: "$s_3$", answer: 6}
        - {id: n6, label: "Eşitlenmiş görüntüde 6 değerli piksel sayısı", answer: 985}
    - title: "OpenCV varyantı $s_k=\\operatorname{round}\\big(7\\,\\frac{c_k-c_{\\min}}{MN-c_{\\min}}\\big)$, $c_k$ birikimli sayım"
      fields:
        - {id: o0, label: "$s_0$", answer: 0}
        - {id: o1, label: "$s_1$", answer: 2, hint: "$7\\cdot1023/3306=2.17$"}
    - title: "Nokta dönüşümleri, 8 bit"
      fields:
        - {id: gam, label: "Gamma $\\gamma=0.5$: $r=64$ → $255\\,(64/255)^{0.5}$", answer: 127.749755, tol: 0.01}
        - {id: lg, label: "Log: $c=255/\\ln256$, $r=15$ → $c\\ln(1+r)$", answer: 127.5, tol: 0.01}
  verify: |
    import math
    n = [790, 1023, 850, 656, 329, 245, 122, 81]
    N = sum(n)
    c = [sum(n[:k + 1]) for k in range(8)]
    s = [round(7 * ck / N) for ck in c]
    o = [round(7 * (ck - c[0]) / (N - c[0])) for ck in c]
    answers = dict(s0=s[0], s1=s[1], s3=s[3], n6=sum(nk for nk, sk in zip(n, s) if sk == 6), o0=o[0], o1=o[1],
                   gam=255 * (64 / 255) ** 0.5, lg=255 / math.log(256) * math.log(16))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Histogram eşleme (specification)", engine: browser}
  - {id: x2, title: "Yerel histogram istatistikleriyle iyileştirme", engine: browser}
  - {id: x3, title: "Kontrast germe ve yoğunluk dilimleme", engine: browser}

quiz:
  - q: "Ders formülü ile OpenCV'nin `equalizeHist`'i hangi görüntülerde farklı sonuç verir?"
    options:
      - {t: "En karanlık seviyede çok piksel olanlarda: ders formülü en düşük seviyeyi $\\operatorname{round}(255\\,c_{\\min}/MN)>0$'a eşler, OpenCV $c_{\\min}$'i çıkarıp çıkışı tam 0'dan başlatır", ok: true, why: "`camera`'da en düşük seviyedeki piksel sayısı küçük olduğundan iki formül aynı; `moon`'da farklı. Eşitlenmiş görüntü hep tam aralığı (0–255) kullanmalıysa OpenCV varyantı doğru tercih."}
      - {t: "Her görüntüde farklı sonuç verir", why: "$c_{\\min}$ küçükse yuvarlama sonrası aynı LUT çıkar."}
      - {t: "Yalnız renkli görüntülerde", why: "İkisi de tek kanallı."}
  - q: "Ayrık histogram eşitleme neden tam düz bir histogram üretmez?"
    options:
      - {t: "Dönüşüm piksel değerlerini birleştirebilir ama bölemez: aynı seviyedeki tüm pikseller aynı çıkışa gider", ok: true, why: "Sürekli durumda çıkış düzgün dağılır; ayrık durumda yalnızca yaklaşık. 8 seviyeli örnekte 8 değil 5 farklı seviye çıktı."}
      - {t: "Yuvarlama hatası yüzünden", why: "Yuvarlama katkı yapar ama temel sebep seviyelerin bölünememesi."}
      - {t: "Üretir", why: "Yalnız sürekli limitte."}
  - q: "Gamma $\\gamma<1$ ne yapar?"
    options:
      - {t: "Karanlık bölgeleri genişletir (açar), parlak bölgeleri sıkıştırır", ok: true, why: "$s=r^\\gamma$ eğrisi $\\gamma<1$'de köşegenin üstündedir; ekran gamma düzeltmesinde ve karanlık görüntülerde kullanılır."}
      - {t: "Görüntüyü koyulaştırır", why: "O, $\\gamma>1$."}
      - {t: "Kontrastı her yerde artırır", why: "Bir aralığı genişletmek diğerini sıkıştırmak demek."}

homework:
  - title: "Kendi tone-mapping hattın: HDR'den 8 bite"
    paper: "Reinhard ve ark. — Photographic Tone Reproduction for Digital Images (SIGGRAPH 2002)"
    url: "https://doi.org/10.1145/566654.566575"
    level: orta
    hours: 6
    goal: |
      Bu modülün nokta dönüşümlerini bir HDR görüntüyü (ör. `cv2.createMergeDebevec` ile birleştirilmiş çok pozlamalı seri ya da sentetik bir HDR sahne) 8 bite indiren bir hatta birleştir: log ortalama parlaklıkla ölçekleme, Reinhard global operatörü, gamma ve isteğe bağlı CLAHE (M9.12).
    steps:
      - "Log-ortalama parlaklık $\\bar L_w=\\exp(\\operatorname{mean}\\log(\\delta+L_w))$ ve anahtar değer $a$ ile ölçekleme yaz."
      - "Global operatör $L_d=L(1+L/L_{white}^2)/(1+L)$; renk kanallarını parlaklık oranıyla koru."
      - "Aynı sahneye basit histogram eşitleme ve gamma uygula; sonuçları yan yana göster."
      - "`cv2.createTonemapReinhard` ile karşılaştır."
    accept:
      - "Çıkış 8 bit ve kırpılan piksel oranı %1'in altında."
      - "Parlak ve karanlık bölgelerin ikisinde de ayrıntı görünüyor (her ikisinde yerel std > 5 gri seviye)."
      - "OpenCV'nin Reinhard operatörüyle aynı parametrelerde ortalama mutlak fark < 10 gri seviye."

labs:
  - id: l1
    lab: histeq
    title: "Gamma, germe ve histogram eşitleme aynı karanlık görüntüde"
    goal: "Üç noktasal dönüşüm: $s=r^\\gamma$, yüzdelik tabanlı doğrusal germe ve HE ($s=\\mathrm{CDF}(r)$). Görüntü, iki histogram ve dönüşüm eğrisi birlikte güncellenir: dönüşümün eğimi > 1 olduğu yerde kontrast açılır."
    predict:
      q: "HE'den sonra dolu histogram kovası sayısı artar mı?"
      options:
        - {t: "Artar: histogram düzgünleşir", why: "Düzgünleşen kovaların aralığı; ayrık değerler birleşebilir ama ayrılamaz."}
        - {t: "Artmaz (aynı ya da azalır)", ok: true, why: "T monoton bir eşleme: bir kova ya bir kovaya gider ya da başka kovalarla birleşir."}
    presets:
      - {name: "γ < 1", params: {m: 1, gamma: 0.4}, note: "Koyu tonlar açıldı."}
      - {name: "Germe vs HE", params: {m: 2, clip: 1, B: {m: 3}}, note: "A şekli korur, B dağılımı düzgünleştirir."}
      - {name: "Gürültülü düz alan", params: {m: 3, noise: 0.06}, note: "HE gürültüyü de gerer: düz bölgeler 'kumlu' — CLAHE'nin kırpma motivasyonu."}
    limits: "Sentetik 96 × 72 görüntü, 256 seviye."
  - id: l2
    lab: histmatch
    title: "Histogram eşleme: istenen dağılıma götürmek"
    goal: |
      Sentetik bir görüntünün (karanlık, düşük karşıtlıklı ya da iki tepeli) yoğunluk dağılımını, istenen bir dağılıma (düzgün, Gauss ya da iki tepeli) z = G⁻¹(T(r)) eşlemesiyle götür. Çıkış histogramının istenene ne kadar yaklaştığını, kullanılan seviye sayısını ve eşleme eğrisini gör.
    predict:
      q: "İstenen dağılım düzgün seçilirse histogram eşleme neye dönüşür?"
      options:
        - {t: "Özdeşliğe", why: "Girdi düzgün değilse değiştirir."}
        - {t: "Histogram eşitlemeye", ok: true, why: "G düzgün dağılımda özdeşliktir; z = T(r)."}
        - {t: "Karşıtlık germeye", why: "Germe doğrusaldır; eşitleme CDF'yi kullanır."}
    presets:
      - {name: "Karanlık → Gauss", params: {src: 0, tgt: 1, mu: 128, sd: 40, N: 10000}, note: "Ortalama 39.9 → 129.3, std 17.8 → 39.2; KS uzaklığı 0.021."}
      - {name: "Karanlık → düzgün", params: {tgt: 0}, note: "Eşitleme: std 73.9; kullanılan seviye 106 → 81 (birleşmeler)."}
      - {name: "Düşük karşıtlık", params: {src: 1}, note: "63 seviye geniş bir aralığa yayılıyor: KS 0.047, histogramda dişler."}
      - {name: "İki tepeli → iki tepeli", params: {src: 2, tgt: 2}, note: "Ortalama 91.9 → 129.4; 172 seviyenin 115'i kalıyor."}
    questions:
      - q: "Eşleme neden histogramı tam istenen biçime getiremez?"
        a: "Aynı girdi seviyesindeki bütün pikseller aynı çıkışa gider; bir kova bölünemez, yalnız birleştirilebilir. Tam eşleme için eşit değerli pikselleri komşuluk ortalaması gibi ikincil bir ölçütle sıralayıp bölmek gerekir (tam histogram eşleme)."
    limits: "Sentetik piksel örneklemi (uzamsal yapı yok); 256 seviye."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Gama düzeltmesi
    goal: Ekran gamasını telafi etmek
    needs: $s=r^{1/\gamma}$
    q: |-
      Bir ekranın $\gamma=2.2$. Normalize $r=0.25$ değerinin ekranda doğru parlaklıkta görünmesi için ekrana hangi değer gönderilmeli?
    solution: |-
      Ekran $v^{2.2}$ gösterir; $v^{2.2}=0.25$ için $v=0.25^{1/2.2}=0.25^{0.4545}\approx0.533$. Düzeltme, koyu tonları yukarı çeker; ekranın kuvvet yanıtı onları geri indirir.
  - id: p2
    type: hesap
    level: 1
    title: Ders formülüyle eşitleme
    goal: Ayrık CDF dönüşümünü uygulamak
    needs: $s_k=\mathrm{round}((L-1)\sum_{j\le k}p_j)$
    q: |-
      $L=4$, 100 piksel, sayımlar $(50, 30, 15, 5)$. $s_1$?
    answer: 2
    calc: "round(3*80/100)"
    tol: 0
    mistakes:
      - {answer: 3, msg: "Birikimli: (50 + 30)/100 = 0.8; 3 · 0.8 = 2.4."}
      - {answer: 1, msg: "Bu yalnız p₁ · 3 = 0.9'un yuvarlanmışı; birikimli toplam kullanılır."}
    hints:
      - "$3\\cdot0.8=2.4$."
    solution: |-
      $s=(1.5, 2.4, 2.85, 3)$ → $(2, 2, 3, 3)$. Hem $r_0$ hem $r_1$ 2'ye düşer: eşitleme seviyeleri birleştirir.
  - id: p3
    type: hesap
    level: 1
    title: Log dönüşümü
    goal: c sabitini ve çıkışı hesaplamak
    needs: $c=255/\ln256$
    q: |-
      $s=c\ln(1+r)$, $c=255/\ln256$. $r=63$ için $s$ (en yakın tamsayı)?
    answer: 191
    calc: "round(255/log(256)*log(64))"
    tol: 0
    mistakes:
      - {answer: 63, msg: "Dönüşüm uygulanmamış."}
      - {answer: 128, msg: "ln 64 / ln 256 = 6/8 = 0.75; 255 · 0.75 ≈ 191."}
    hints:
      - "$\\ln64/\\ln256=0.75$."
    solution: |-
      $255\cdot\ln64/\ln256=255\cdot0.75=191.25\to191$: girdinin alt çeyreği çıkışın dörtte üçüne yayılıyor.
  - id: p4
    type: yorumla
    level: 2
    title: Eşitleme sonrası kumlu gökyüzü
    goal: Eşitlemenin gürültüyü germesini tanımak
    needs: CDF dönüşümünün eğimi
    q: |-
      Düz, hafif gürültülü bir gökyüzü içeren bir fotoğrafa histogram eşitleme uygulanınca gökyüzü kumlu ve lekeli görünüyor. Neden, ne yapılır?
    choices:
      - {t: "Eşitleme hatalı uygulandı", why: "Doğru uygulanınca da olur."}
      - {t: "Gökyüzü dar bir yoğunluk aralığında çok piksel içerir; CDF orada çok dik ve gürültüyü de geriyor. CLAHE (kırpma) ya da daha yumuşak bir eğri kullanılır", ok: true, why: "Dönüşümün eğimi (L − 1)·p(r)'dir; dolu kovalarda büyüktür."}
      - {t: "Görüntü 8 bitten az", why: "İlgisiz."}
    hints:
      - "ds/dr neye eşit?"
    solution: |-
      $ds/dr=(L-1)p_r(r)$: çok dolu kovaların çevresinde eğim büyüktür ve küçük gürültü farkları büyük yoğunluk farklarına dönüşür. CLAHE histogramı bir sınırda kırparak eğimi sınırlar.
  - id: p5
    type: kanıt
    level: 3
    title: Eşitlemenin idempotentliği (sürekli)
    goal: Eşitlenmiş görüntüyü yeniden eşitlemenin bir şey değiştirmediğini göstermek
    needs: CDF dönüşümü
    q: |-
      Sürekli durumda eşitlenmiş bir görüntüye histogram eşitlemeyi tekrar uygulamanın özdeşlik olduğunu göster.
    rubric:
      - "Eşitlenmiş görüntünün PDF'sinin 1/(L − 1) olduğunu kullandım"
      - "İkinci dönüşümü (L − 1)∫₀ˢ 1/(L − 1) dw olarak yazdım"
      - "Sonucun s olduğunu buldum"
      - "Ayrık durumda bunun neden yalnız yaklaşık doğru olduğunu (birleşmiş seviyeler) belirttim"
    hints:
      - "Düzgün dağılımın CDF'si doğrusaldır."
    solution: |-
      $T_2(s)=(L-1)\int_0^s\frac1{L-1}dw=s$. Ayrık durumda eşitlenmiş histogram tam düz olmadığı için ikinci uygulama küçük değişiklikler yapabilir, ama seviyeler zaten birleşmiş olduğundan yeni bir yayılma olmaz.
pitfalls:
  - wrong: "Histogram eşitleme her zaman düz histogram verir."
    right: "Yalnız sürekli durumda; ayrık durumda kovalar birleşir ama bölünemez, histogram yalnız genişler."
  - wrong: "8 bitlik görüntüde L = 255'tir."
    right: "L seviye sayısıdır: 256; aralık [0, L − 1] = [0, 255]."
  - wrong: "Monoton artan bir dönüşüm değerleri azaltamaz."
    right: "Azaltabilir (γ > 1); monotonluk yalnız sıranın korunmasını, yani yoğunlukların ters dönmemesini garanti eder."
  - wrong: "Görüntü dosyasındaki piksel değerleri doğrusal ışık şiddetidir."
    right: "Çoğu görüntü (sRGB) gama kodludur; doğrusal ışıkla hesap (ör. bulanıklaştırma, harmanlama) için önce gama çözülmelidir."
whatif:
  - q: "Eşitleme her renk kanalına ayrı uygulanırsa?"
    a: "Kanalların göreli oranları değişir ve renk tonları kayar. Genellikle yalnız parlaklık kanalı (ör. HSV'nin V'si ya da Lab'ın L'si) eşitlenir (M9.9)."
  - q: "Görüntü tek renkli (bütün pikseller aynı) olsaydı?"
    a: "Ders formülü bütün pikselleri 255'e götürür; OpenCV varyantında pay ve payda sıfırdır, görüntü olduğu gibi döndürülür (aşama b bu durumu ayrıca ele alır)."
  - q: "Log dönüşümünde c = 1 seçilseydi?"
    a: "8 bitte en büyük çıkış ln 256 ≈ 5.5 olurdu: görüntü neredeyse siyah. c, çıkışın tam aralığı kullanacağı biçimde (255 / ln 256) seçilir."
