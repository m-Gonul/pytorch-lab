quiz:
  - q: "Konum kodlaması neden gerekli?"
    options:
      - {t: "Attention katmanları kelimelerin sırasına bakmaz, yalnız ilişkilerine; diğer katmanlar zamanca dağıtılmıştır. Konum bilgisi verilmezse cümle bir torba olur (permütasyona eşdeğerlik)", ok: true, why: "Géron: konum embedding'i her kelimenin embedding'ine eklenir."}
      - {t: "Gradyanları stabilize etmek için", why: "Hayır."}
      - {t: "Sözlüğü küçültmek için", why: "Hayır."}
  - q: "Kod çözücünün üst (cross) attention katmanında Q, K, V nereden gelir?"
    options:
      - {t: "Q kod çözücüden, K ve V kodlayıcının son çıktısından; kodlayıcı çıktısı N kod çözücü katmanının hepsine verilir", ok: true, why: "Kod çözücü burada girdi cümlesindeki kelimelere bakar ('Queen' çevirirken 'Queen'e)."}
      - {t: "Hepsi kod çözücüden", why: "Bu öz-attention."}
      - {t: "Q kodlayıcıdan, K, V kod çözücüden", why: "Ters."}
  - q: "Embedding'ler √d ile çarpılıyorsa başlatma ölçeği neden önemli?"
    options:
      - {t: "N(0, 1) başlatılmış embedding × √d, genliği 1 olan konum kodlamasını boğar; model konum bilgisini neredeyse göremez. Paylaşılan embedding N(0, 1/d) ile başlatılınca √d çarpanı onları O(1)'e taşır", ok: true, why: "d aşamasında aynı model yalnız bu farkla öğrenir ya da öğrenemez."}
      - {t: "Önemli değil", why: "d aşamasında fark çok büyük."}
      - {t: "Yalnız hızı etkiler", why: "Doğruluğu etkiler."}

homework:
  - title: "Vaswani ve ark. (2017): küçük bir çeviri modeli"
    paper: "Vaswani ve ark. — Attention Is All You Need (NeurIPS 2017)"
    url: "https://arxiv.org/abs/1706.03762"
    level: ileri
    hours: 20
    goal: |
      d aşamasındaki modeli Multi30k (de→en, ~30 bin cümle) ya da Tatoeba en–tr üzerinde BPE ile eğit: paylaşılan kaynak/hedef sözlük ve embedding–çıktı ağırlık bağlama, Noam takvimi, etiket yumuşatma 0.1, dropout 0.1, beam search (k = 4, α = 0.6, M4.13). Makale Tablo 3'ün küçük ablasyonunu yap: (A) head sayısı 1/4/8, (B) d_k küçültme, (D) dropout ve ε_ls = 0, (E) öğrenilmiş konum embedding'i — BLEU ile raporla. M4.13'teki RNN + attention modeliyle aynı veride karşılaştır.
    steps:
      - "Kontrol noktası ortalaması (son 5) ve çözümlemede uzunluk cezası."
    accept:
      - "Transformer, RNN + attention modelinden daha yüksek BLEU'ya daha kısa sürede ulaşır."
      - "Etiket yumuşatma perpleksiteyi kötüleştirip BLEU'yu iyileştirir (makaledeki gözlem)."
  - title: "Xiong ve ark. (2020): Post-LN vs Pre-LN"
    paper: "Xiong ve ark. — On Layer Normalization in the Transformer Architecture (ICML 2020)"
    url: "https://arxiv.org/abs/2002.04745"
    level: orta
    hours: 8
    goal: |
      Makalenin kuramsal sonucunu (Post-LN'de son katmanların gradyanı başlangıçta büyük → warm-up şart) deneyle göster: d aşamasındaki katmanların Pre-LN sürümünü yaz; 6 ve 12 katmanlı modellerde başlangıçta katman başına gradyan normlarını çiz (Şekil 3), warm-up'lı/warm-up'sız ve farklı tepe öğrenme oranlarında eğitim eğrilerini karşılaştır.
    steps:
      - "Pre-LN: $x+\\mathrm{Sublayer}(\\mathrm{LN}(x))$ ve en sonda ek bir LN."
    accept:
      - "Post-LN'de gradyan normu çıkışa doğru artar; Pre-LN'de yaklaşık sabittir."
      - "Pre-LN warm-up olmadan eğitilebilir; Post-LN büyük öğrenme oranında warm-up'sız ıraksar."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Sinüzoidal konum kodlaması göreli konumu nasıl taşır?
    goal: Konum farkının doğrusal bir dönüşüm olduğunu göstermek
    needs: Trigonometri toplam formülleri
    q: |-
      $PE(p)_{2i}=\sin(\omega_ip)$, $PE(p)_{2i+1}=\cos(\omega_ip)$, $\omega_i=10000^{-2i/d}$. $PE(p+k)$'nın $PE(p)$'nin $p$'den bağımsız bir doğrusal dönüşümü olduğunu göster.
    solution: |-
      Bir frekans çifti için: $\sin(\omega(p+k))=\sin\omega p\cos\omega k+\cos\omega p\sin\omega k$, $\cos(\omega(p+k))=\cos\omega p\cos\omega k-\sin\omega p\sin\omega k$. Matris biçiminde:
      $$\begin{bmatrix}\sin\omega(p+k)\\\cos\omega(p+k)\end{bmatrix}=\begin{bmatrix}\cos\omega k&\sin\omega k\\-\sin\omega k&\cos\omega k\end{bmatrix}\begin{bmatrix}\sin\omega p\\\cos\omega p\end{bmatrix}.$$
      Matris yalnız $k$'ya bağlı bir dönmedir. Tüm frekanslar için blok köşegen bir dönme matrisi $R_k$ ile $PE(p+k)=R_kPE(p)$ ✓.

      **Ne söyler:** attention bir doğrusal izdüşümle "k adım ötedeki" ilişkisini öğrenebilir (Vaswani ve ark.'ın gerekçesi). **Ne söylemez:** konum kodlaması girdiye **eklendiği** için bu ilişki içerikle karışır; RoPE dönmeyi doğrudan q ve k'ya uygulayarak $q_p^\top k_{p'}$'nın yalnız $p-p'$'ye bağlı olmasını sağlar.
  - id: p2
    type: hesap
    level: 1
    title: Bir konum kodlaması bileşeni
    goal: Formülü uygulamak
    needs: P1
    q: |-
      $p=1$, $i=0$ (ilk frekans, $\omega_0=1$). $PE(1)_0$?
    answer: 0.8414709848078965
    calc: "math.sin(1)"
    tol: 1e-4
    mistakes:
      - {answer: 0.5403023058681398, msg: "Çift indisler sinüs, tek indisler kosinüs."}
      - {answer: 0.01745240643728351, msg: "Argüman radyan: sin(1 rad)."}
    hints:
      - "$\\sin(1)$, radyan."
    solution: |-
      $\sin1=0.841$.
  - id: p3
    type: hesap
    level: 1
    title: Etiket yumuşatma hedefi
    goal: Yumuşatılmış hedef dağılımı hesaplamak
    needs: Softmax hedefi
    q: |-
      $K=4$ sınıf, $\varepsilon=0.1$, hedef $q=(1-\varepsilon)\,\mathrm{onehot}+\varepsilon/K$. Doğru sınıfın hedef olasılığı?
    answer: 0.925
    calc: "0.9+0.1/4"
    mistakes:
      - {answer: 0.9, msg: "ε/K payı doğru sınıfa da eklenir."}
      - {answer: 0.9333333333333333, msg: "Bu sürüm ε'yu yalnız yanlış sınıflara (K − 1) dağıtır; soru ε/K tanımını kullanıyor."}
    hints:
      - "Her sınıf ε/K = 0.025 alır."
    solution: |-
      $0.925$; yanlış sınıflar 0.025. Model logit'leri sonsuza itmez, kalibrasyon iyileşir (perplexity biraz kötüleşir, BLEU iyileşir — Vaswani ve ark.).
  - id: p4
    type: hesap
    level: 2
    title: Noam takvimi
    goal: Isınmalı öğrenme oranı takvimini hesaplamak
    needs: Kuvvet
    q: |-
      $\eta=d^{-0.5}\min(t^{-0.5},\,t\cdot w^{-1.5})$, $d=512$, $w=4000$. Zirve öğrenme oranı ($t=w$)?
    answer: 0.0006987712429686843
    calc: "512**-0.5*4000**-0.5"
    tol: 1e-6
    mistakes:
      - {answer: 0.015811388300841896, msg: "d^(−0.5) çarpanını unuttun."}
    hints:
      - "$t=w$'de iki terim eşit: $w^{-0.5}$."
    solution: |-
      $512^{-0.5}\cdot4000^{-0.5}=0.0442\cdot0.0158=6.99\cdot10^{-4}$. Önce doğrusal artış (Adam'ın ilk adımlarındaki güvenilmez ikinci moment ve Post-LN kararsızlığı için), sonra $1/\sqrt t$ azalış.
  - id: p5
    type: açıkla
    level: 2
    title: Cross-attention'da Q, K, V nereden gelir?
    goal: Kodlayıcı–kod çözücü bağlantısını açıklamak
    needs: M4.6
    q: |-
      Kod çözücüdeki cross-attention'da sorgu, anahtar ve değer hangi kaynaktan gelir? Maske gerekli mi? Kodlayıcının çıktısı çıkarım sırasında kaç kez hesaplanır?
    rubric:
      - "Q'nun kod çözücüden, K ve V'nin kodlayıcı çıktısından geldiğini söyledim"
      - "Nedensel maskenin gerekmediğini (kaynağın tamamı bilinir), yalnız dolgu maskesi gerektiğini söyledim"
      - "Kodlayıcı çıktısının bir kez hesaplanıp her kod çözme adımında yeniden kullanıldığını (K, V önbelleklenir) açıkladım"
    hints:
      - "Kod çözücü kaynağın hangi kısmını görmemeli?"
    solution: |-
      Q = kod çözücü durumu ("ne arıyorum"), K, V = kodlayıcı çıktısı ("kaynakta ne var"). Kaynak cümle tamamen bilindiği için nedensel maske yok; dolgu maskesi var. Kodlayıcı bir kez çalışır; her katmanın cross-attention K, V izdüşümleri bir kez hesaplanıp önbelleğe alınır.
pitfalls:
  - wrong: "Konum kodlaması öğrenilebilir olmalı, sabit sinüzoidal işe yaramaz."
    right: "Vaswani ve ark. ikisini benzer buldu; sinüzoidal, eğitimde görülmemiş uzunluklara (sınırlı da olsa) genellenir."
  - wrong: "Kod çözücü eğitimde de token token çalışır."
    right: "Eğitimde nedensel maske sayesinde tüm konumlar tek geçişte paralel hesaplanır; token token çalışma yalnız çıkarımdadır."
whatif:
  - q: "Konum kodlaması tamamen kaldırılırsa?"
    a: "Kodlayıcı kelime torbasına döner (M4.6 P6); kod çözücü nedensel maske sayesinde sırayı kısmen çıkarabilir ama zayıf."

labs:
  - id: l1
    lab: maskviz
    title: "Dikkat maskeleri ve çok katmanlı erişim"
    goal: |
      Transformer'daki üç maskeyi (kodlayıcı dolgusu, kod çözücü nedensel + dolgu, çapraz dikkat) ve uzun bağlam için önerilen maske ailesini (kayan pencere, önek-LM, seyrek stride) izin matrisi olarak çiz. Bir konumun birkaç katman sonra hangi girdilerden etkilenebildiğini erişim matrisi (A ∨ I)^L ile gör.
    predict:
      q: "Pencere w = 3 olan kayan pencere maskesiyle 4 katman sonra son konum kaç girdiden etkilenebilir?"
      options:
        - {t: "3", why: "Bu tek katmanda görülen anahtar sayısı."}
        - {t: "9", ok: true, why: "Her katman erişimi w − 1 = 2 konum geriye uzatır: 1 + 4·2 = 9 (ölçülen)."}
        - {t: "Tümü (12)", why: "Bu, stride'lı seyrek maskede 2 katmanda olur."}
    presets:
      - {name: "Kod çözücü öz-dikkati", params: {kind: 1, T: 12, tpad: 2}, note: "75 izinli çift: nedensel üçgenin 78 çiftinden, dolgu anahtarlarına giden 3 tanesi çıkarılmış."}
      - {name: "Ders el hesabı (T = 4)", params: {kind: 1, T: 4, tpad: 0}, note: "Nedensel maske T(T+1)/2 = 10 çifte izin verir."}
      - {name: "Çapraz dikkat", params: {kind: 2, T: 12, S: 9, spad: 2}, note: "12 × 9 matriste 84 izinli çift: her sorgu 7 gerçek kaynak tokenının hepsine bakar."}
      - {name: "Kayan pencere, 4 katman", params: {kind: 3, T: 12, w: 3, L: 4}, note: "Tek katmanda 3 anahtar, 4 katmanda erişim 9 girdi: 1 + L(w − 1)."}
      - {name: "Seyrek stride", params: {kind: 5, T: 12, w: 3, L: 2}, note: "Yerel 3 + her 3. konum: satır başına en fazla 6 anahtar, ama 2 katmanda son konum 12 girdinin hepsine erişiyor."}
    questions:
      - q: "Kod çözücü öz-dikkatinde dolgu konumlarının sorgu satırları neden tamamen yasaklanmaz?"
        a: "Tamamen yasak bir satırın softmax'ı 0/0 olur (NaN). Dolgu sorguları normal hesaplanır; çıktıları kayıpta maskelendiği için öğrenmeyi etkilemez."
      - q: "Nedensel maske neden yalnız kod çözücüde gerekir?"
        a: "Kod çözücü üretim yapar ve çıkarımda geleceği göremez; eğitim aynı koşulu taklit etmelidir. Kaynak cümle ise baştan tamamen bilinir; kodlayıcı her kelimeyi her yöne bakarak kodlayabilir (çift yönlü)."
    limits: "Maskeler ikili; erişim yalnız 'etkileyebilir mi' sorusunu yanıtlar, etkinin büyüklüğünü değil. Dolgu hep dizinin sonunda varsayıldı."
  - id: l2
    lab: posenc
    title: "Sinüzoidal konum kodlaması: dalga boyları, döndürme, yalnız sinüs"
    goal: |
      Konum kodlamasının ısı haritasını çiz, bir boyut çiftinin sinüs ve kosinüs dalgalarını ve dalga boyunu oku. P_p · P_(p+k) iç çarpımının yalnız k'ya bağlı olduğunu iki farklı p için gör. 'Yalnız sinüs' seçeneğiyle hangi özelliğin kaybolduğunu ölç.
    predict:
      q: "d = 512'de boyut 100–101 çiftinin dalga boyu kaç konumdur?"
      options:
        - {t: "Tam 38", why: "Slayt böyle anlatıyor, ama 2π·10000^(100/512) tam sayı değil."}
        - {t: "≈ 37.97", ok: true, why: "2π / ω = 2π·10000^0.1953 = 37.969; p = 22 ve 60 yalnız yaklaşık aynı değerleri alır."}
        - {t: "≈ 100", why: "Dalga boyu boyut indisiyle doğrusal değil, geometrik büyür."}
    presets:
      - {name: "Slayttaki çift (22 ve 60)", params: {d: 512, n: 128, base: 10000, pair: 50, p: 22, k: 38, mode: 0}, note: "Dalga boyu 37.969; boyut 100–101'de (−0.4786, −0.8781) ve (−0.483, −0.8756): yaklaşık aynı ama tam değil. Tüm vektörler arasındaki uzaklık 15.3."}
      - {name: "Yalnız sinüs: 25 ve 32", params: {d: 512, n: 128, base: 10000, pair: 50, p: 25, k: 7, mode: 1}, note: "Boyut 100'de sin değerleri −0.839 ve −0.835: bu frekansta ayırt edilemez. İç çarpım eğrileri artık p'ye bağlı."}
      - {name: "Küçük d", params: {d: 128, n: 128, base: 10000, pair: 25, p: 22, k: 38, mode: 0}, note: "d = 128'de aynı indisli çiftin dalga boyu 229: indis/d oranı belirleyici."}
      - {name: "Küçük taban", params: {d: 128, n: 128, base: 100, pair: 25, p: 22, k: 38, mode: 0}, note: "Taban 100: en uzun dalga boyu 585 konum; uzun dizilerde yavaş boyutlar konumları ayırmaya yetmez."}
    questions:
      - q: "Neden sinüs VE kosinüs? Yalnız sinüs, farklı frekanslarla da her konuma benzersiz bir vektör vermez mi?"
        a: "Çoğunlukla verir (en yakın iki konumun uzaklığı sin + cos'ta 3.71, yalnız sinüste 2.84; d = 512). Kaybolan, göreli konumun doğrusal yapısıdır: (sin, cos) çifti çember üzerinde bir noktadır ve k kaydırma bir döndürmedir. Yalnız sinüste P_(p+k), P_p'nin konumdan bağımsız doğrusal bir fonksiyonu değildir ve iç çarpım p'ye de bağlıdır."
      - q: "RoPE bu fikri nasıl kullanır?"
        a: "Konumu eklemek yerine sorgu ve anahtar vektörlerinin her çiftini pω açısıyla döndürür. Döndürmeler birbirini götürdüğü için q_p · k_(p+k) yalnız k'ya bağlı bir döndürmeyle değişir: skor doğrudan göreli konuma bağlı olur (ek x1)."
    limits: "Yalnız kodlamanın kendi geometrisi gösteriliyor; modelin bu bilgiyi nasıl kullandığı (dikkat skorlarına etkisi) burada yok."
  - id: l3
    lab: noamlr
    title: "Noam takvimi ve ısınma + kosinüs"
    goal: |
      Transformer'ın öğrenme oranı takvimini (d^−0.5 · min(s^−0.5, s·w^−1.5)) çiz. d ve ısınma uzunluğunun tepe değeri nasıl belirlediğini, aynı tepe ve ısınmayla kosinüs takvimine göre farkı gör.
    predict:
      q: "Isınmayı 4000'den 16 000 adıma çıkarırsan Noam'ın tepe öğrenme oranı ne olur?"
      options:
        - {t: "Aynı kalır, yalnız daha geç ulaşılır", why: "Tepe d^−0.5 · w^−0.5'tir: w'ye bağlıdır."}
        - {t: "Yarıya iner", ok: true, why: "w dört katına çıkınca w^−0.5 yarıya iner: 6.99·10⁻⁴ → 3.49·10⁻⁴."}
        - {t: "Dört katına çıkar", why: "Isınma uzadıkça doğrusal artışın eğimi de küçülür."}
    presets:
      - {name: "Makale (base)", params: {d: 512, w: 4000, f: 1, S: 100000, floor: 0.1}, note: "Tepe 6.99·10⁻⁴ (adım 4000); 100 000 adımda 1.4·10⁻⁴. Σ lr: Noam 23.8, kosinüs 38.3."}
      - {name: "Uzun ısınma", params: {w: 16000}, note: "Tepe yarıya iniyor (3.49·10⁻⁴)."}
      - {name: "Büyük model", params: {d: 4096, w: 4000}, note: "d = 4096: tepe 2.5·10⁻⁴; büyük modeller daha küçük lr alır."}
    questions:
      - q: "Noam takviminde 'factor' neden genellikle eklenir?"
        a: "Takvim tepe değeri d ve w'den kendiliğinden belirler; bu değer her model ve batch boyu için en iyi olmayabilir. Çarpan, takvimin biçimini koruyarak ölçeğini ayarlar (Annotated Transformer'da 1–2)."
    limits: "Takvimler yalnız çiziliyor; eğitim kararlılığına etkileri için M4.7'deki lnplace deneyine bak."
  - id: l4
    lab: labelsmooth
    title: "Etiket yumuşatma: NLL, kalibrasyon ve logit aralığı"
    goal: |
      Yüksek boyutlu, az örnekli bir sınıflandırma probleminde doğrusal softmax modelini düz çapraz entropiyle ve yumuşatılmış hedefle eğit. Test doğruluğunu, yumuşatılmamış NLL'yi (perpleksitenin logu), beklenen kalibrasyon hatasını (ECE) ve en büyük iki logit arasındaki farkı karşılaştır.
    predict:
      q: "Varsayılan ayarda (kümeler iyi ayrık) ε = 0.1 test NLL'yi nasıl etkiler?"
      options:
        - {t: "İyileştirir: yumuşatma her zaman kalibrasyonu düzeltir", why: "Düz CE zaten iyi kalibre ise yumuşatma güveni gereğinden çok düşürür."}
        - {t: "Kötüleştirir", ok: true, why: "Ölçülen: NLL 0.125 → 0.331, ECE 0.016 → 0.140; ortalama güven 0.97'den 0.79'a iniyor, doğruluk 0.93. Model eksik güvenli hâle geliyor (makaledeki 'perpleksiteyi kötüleştirir' gözlemi)."}
        - {t: "Etkilemez", why: "Hedef dağılım değiştiği için optimum logitler değişir."}
    presets:
      - {name: "İyi ayrık kümeler (varsayılan)", params: {eps: 0.1, V: 5, D: 40, n: 120, sep: 0.6, iters: 300}, note: "Düz CE iyi kalibre (ECE 0.016); ε = 0.1 NLL'yi 0.125'ten 0.331'e çıkarıyor, logit farkı 8.2 → 2.3."}
      - {name: "Zor problem, aşırı uyum", params: {eps: 0.1, sep: 0.1}, note: "Ayrışma 0.1: test doğruluğu ≈ 0.28 (rastgele 0.2) ama düz CE eğitim kümesini ezberleyip aşırı güvenli: NLL 13.0, ECE 0.66. ε = 0.1: NLL 4.13, ECE 0.51."}
      - {name: "Orta zorluk", params: {eps: 0.1, sep: 0.3}, note: "Ayrışma 0.3: NLL 2.36 → 1.24, ECE 0.29 → 0.15; yumuşatma yardım ediyor."}
      - {name: "Güçlü yumuşatma", params: {eps: 0.3, sep: 0.6}, note: "ε = 0.3: logit farkı 1.47'ye iniyor (optimum sınır 2.54), NLL 0.52."}
    questions:
      - q: "Yumuşatılmış hedefle optimum logit farkı neden sonlu?"
        a: "Optimumda p = q; q_y / q_k = (1 − ε + ε/V)/(ε/V) sonlu olduğu için z_y − z_k = log((1 − ε + ε/V)/(ε/V)) de sonludur. One-hot hedefte q_k = 0 olduğundan oran sonsuzdur."
      - q: "Etiket yumuşatma BLEU'yu iyileştirip perpleksiteyi kötüleştirebiliyorsa, hangisine bakmalı?"
        a: "Perpleksite, modelin gerçek dağılıma verdiği olasılığı ölçer; yumuşatma olasılıkları bilerek düzleştirdiği için onu cezalandırır. BLEU ise argmax/beam çıktısının kalitesini ölçer. Çeviri hedefse BLEU (ya da COMET); olasılıkların kendisi kullanılacaksa (yeniden sıralama, damıtma) yumuşatma dikkatle seçilmeli."
    limits: "Doğrusal model ve Gauss kümeleri; Transformer'daki etkiler (BLEU, beam ile etkileşim) burada yok. Sonuçlar tohum 1 içindir; diğer tohumlarda sayılar oynuyor (ör. varsayılanda NLL 0.33–0.40)."
