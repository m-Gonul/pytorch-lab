id: m0-3-chain-rule
code: M0.3
title: Türev, gradyan, Jacobian, zincir kuralı
phase: 0
minutes: 180
prereq: [m0-2-matmul]
summary: >
  Backprop'un tamamı bu modülde: küçük bir hesap grafiğinde ileri ve geri geçişi
  elle yapıyor, sayısal türevle doğruluyor, NumPy'da tüm kısmi türevleri tek
  çağrıda alıyor, autograd'a bırakıyor ve en sonda yüzlerce noktanın
  Jacobian'ını `vmap` ile birden hesaplıyorsun.
goals:
  - "Bir ifadeyi [[hesap grafiği]] olarak yazıp yerel türevleri zincir kuralıyla geriye taşımak"
  - "Bir değişken birden fazla yoldan çıktıya bağlanınca gradyanların **toplandığını** görmek"
  - "Merkezi farkla [[sayısal türev]] almak ve neden $O(h^2)$ hatalı olduğunu bilmek"
  - "$\\mathbb{R}^n\\to\\mathbb{R}^m$ bir fonksiyonun [[jacobian|Jacobian]]'ını sayısal ve otomatik olarak hesaplamak"
  - "`torch.func.grad`, `jacrev` ve `vmap` ile nokta başına türevleri döngüsüz almak"
sources:
  - {title: "CS231n — Backpropagation, Intuitions", url: "https://cs231n.github.io/optimization-2/", license: "MIT", use: adapt}
  - {title: "Karpathy — micrograd / Zero to Hero, 1. bölüm", url: "https://github.com/karpathy/micrograd", license: "MIT", use: adapt}
  - {title: "Mathematics for Machine Learning, Bölüm 5 (Vector Calculus)", url: "https://mml-book.github.io/", license: "© (PDF ücretsiz)", use: link}
  - {title: "PyTorch — torch.func (grad, jacrev, vmap)", url: "https://docs.pytorch.org/docs/stable/func.html", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "İleri geçiş: $f(x,y)=(x+y)\\cdot y$, $x=2$, $y=3$; ara düğüm $a=x+y$"
      fields:
        - {id: a, label: "$a = x+y$", answer: 5, hint: "$2+3$"}
        - {id: f, label: "$f = a\\cdot y$", answer: 15, hint: "$5\\cdot3$"}
    - title: "Geri geçiş (yerel türev × yukarıdan gelen)"
      fields:
        - {id: dfda, label: "$\\partial f/\\partial a$", answer: 3, hint: "$f=a\\cdot y$; $a$'ya göre türev $y$"}
        - {id: dfdy_dir, label: "$\\partial f/\\partial y$ yalnız çarpım düğümü üzerinden", answer: 5, hint: "$f=a\\cdot y$'de $a$ sabitken $y$'ye göre türev $a$"}
        - {id: dfdx, label: "$\\partial f/\\partial x$", answer: 3, hint: "$\\frac{\\partial f}{\\partial a}\\cdot\\frac{\\partial a}{\\partial x}=3\\cdot1$"}
        - {id: dfdy, label: "$\\partial f/\\partial y$ (toplam)", answer: 8, hint: "$y$ iki yoldan bağlı: doğrudan ($5$) + $a$ üzerinden ($3\\cdot1$). Gradyanlar toplanır."}
    - title: "Sayısal kontrol, $h=0.1$: $\\frac{f(x+h)-f(x-h)}{2h}$"
      fields:
        - {id: num_dx, label: "$x$'e göre", answer: 3, tol: 0.001, hint: "$f(2.1,3)=15.3$, $f(1.9,3)=14.7$"}
        - {id: num_dy, label: "$y$'ye göre", answer: 8, tol: 0.001, hint: "$f(2,3.1)=5.1\\cdot3.1$, $f(2,2.9)=4.9\\cdot2.9$"}
    - title: "Jacobian: $g(x,y)=[\\,xy,\\;x+y^2\\,]$, $(x,y)=(2,3)$; $J_{ij}=\\partial g_i/\\partial x_j$"
      layout: matrix
      rows: 2
      cols: 2
      fields:
        - {id: j11, label: "$\\partial g_1/\\partial x$", answer: 3, hint: "$\\partial(xy)/\\partial x=y$"}
        - {id: j12, label: "$\\partial g_1/\\partial y$", answer: 2, hint: "$\\partial(xy)/\\partial y=x$"}
        - {id: j21, label: "$\\partial g_2/\\partial x$", answer: 1, hint: "$\\partial(x+y^2)/\\partial x=1$"}
        - {id: j22, label: "$\\partial g_2/\\partial y$", answer: 6, hint: "$2y$"}
  verify: |
    x, y, h = 2.0, 3.0, 0.1
    f = lambda x, y: (x + y) * y
    a = x + y
    answers = dict(a=a, f=f(x, y), dfda=y, dfdy_dir=a, dfdx=y * 1, dfdy=a + y * 1,
                   num_dx=round((f(x + h, y) - f(x - h, y)) / (2 * h), 9),
                   num_dy=round((f(x, y + h) - f(x, y - h)) / (2 * h), 9),
                   j11=y, j12=x, j21=1, j22=2 * y)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "$h=0.1$ ile merkezi fark burada **tam** doğru sonucu verdi. Neden?"
    options:
      - {t: "$f$ ikinci dereceden bir polinom; merkezi farkın hatası $f'''$ ile orantılı ve o burada 0", ok: true, why: "Taylor açılımında $f(x\\pm h)$ farkı alınınca çift dereceli terimler sadeleşir; hata $\\tfrac{h^2}{6}f'''$. Kuadratik fonksiyonda $f'''=0$."}
      - {t: "$h=0.1$ yeterince küçük", why: "Genel bir fonksiyonda $h=0.1$ ile hata $\\sim10^{-2}\\cdot f'''$ olurdu; tam eşitlik fonksiyonun yapısından."}
      - {t: "Sayısal türev her zaman tamdır", why: "Hem kesme hatası ($O(h^2)$) hem yuvarlama hatası ($O(\\epsilon/h)$) vardır; $h\\approx10^{-5}$ civarı iyi bir dengedir."}
  - q: "$y$'nin gradyanı neden $5+3$?"
    options:
      - {t: "$y$ çıktıya iki ayrı yoldan bağlı; çok değişkenli zincir kuralı yolların katkılarını toplar", ok: true, why: "Autograd motorları bu yüzden `grad +=` yazar, `grad =` değil. M3.1'de bunu kendin yaşayacaksın."}
      - {t: "Toplama düğümünün türevi 2'dir", why: "Toplama düğümü gradyanı her girdisine 1 ile çarparak aynen dağıtır."}
      - {t: "Hata; doğru cevap 5", why: "5 yalnız çarpım düğümünün katkısı; $a=x+y$ üzerinden gelen 3'ü unutuyor."}
  - q: "$g:\\mathbb{R}^{1000}\\to\\mathbb{R}$ (bir kayıp fonksiyonu) için sayısal gradyan kaç fonksiyon değerlendirmesi ister, reverse-mode autograd kaç?"
    options:
      - {t: "Sayısal: 2000 (her koordinat için ±h); reverse-mode: ~1 ileri + 1 geri geçiş", ok: true, why: "Backprop'un bütün değeri bu: maliyet parametre sayısından bağımsız, ileri geçişin sabit katı."}
      - {t: "İkisi de 1000", why: "Reverse-mode tek bir geri geçişle tüm kısmi türevleri verir."}
      - {t: "Sayısal: 2, reverse-mode: 1000", why: "Tersine; reverse-mode $m=1$ çıktı için en ucuz moddur. Forward-mode ise girdi başına bir geçiş ister."}

homework:
  - title: "Baydin ve ark. (2018): makine öğrenmesinde otomatik türev"
    paper: "Baydin, Pearlmutter, Radul, Siskind — Automatic Differentiation in Machine Learning: a Survey (JMLR 2018)"
    url: "https://arxiv.org/abs/1502.05767"
    level: orta
    hours: 6
    goal: |
      Makalenin Tablo 2–3'teki ileri ve geri mod izlerini kendi kodunla üret: ikili sayılar (dual numbers) ile ileri mod ve bir kayıt bandı (tape) ile geri mod yaz; $f(x_1,x_2)=\ln x_1+x_1x_2-\sin x_2$ örneğinde ara değerleri makaleyle karşılaştır. n girdi, m çıktı için Jacobian'ı ileri modda n, geri modda m geçişle hesaplayıp maliyet ödünleşimini (Bölüm 3.1–3.2) n ≫ m ve n ≪ m durumlarında ölç.
    steps:
      - "Dual sayı sınıfında +, ×, sin, exp, log için operatör aşırı yüklemesi."
    accept:
      - "İzler makaledeki tablolarla birebir."
      - "Jacobian maliyet tablosu: ileri mod ∝ n, geri mod ∝ m."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bir hesap grafiğinde ileri ve geri geçiş
    goal: Yerel türevleri zincirleyerek gradyanı bulmak
    needs: Kısmi türev
    q: |-
      $f(x,y,z)=(x+y)\,z$, $x=-2$, $y=5$, $z=-4$. Tüm kısmi türevleri hesap grafiği üzerinden bul.
    solution: |-
      **İleri:** $q=x+y=3$, $f=qz=-12$.

      **Geri (sondan başa):** $\partial f/\partial f=1$. Çarpma düğümü: $\partial f/\partial q=z=-4$, $\partial f/\partial z=q=3$ (her girdiye **diğerinin** değeri). Toplama düğümü gelen gradyanı aynen dağıtır: $\partial f/\partial x=\partial f/\partial q\cdot1=-4$, $\partial f/\partial y=-4$.

      **Kural özeti:** toplama → dağıtıcı, çarpma → değiştokuşçu, max → yönlendirici (yalnız kazanana), bir değişken birden çok yerde kullanılıyorsa gradyanlar **toplanır** (çok değişkenli zincir kuralı).
  - id: p2
    type: hesap
    level: 1
    title: Sigmoid kapısı
    goal: Sigmoid'in yerel türevini kullanmak
    needs: $\sigma'=\sigma(1-\sigma)$
    q: |-
      $f=\sigma(wx+b)$, $w=2$, $x=-1$, $b=2$. $\partial f/\partial w$?
    answer: -0.25
    calc: "0.5*0.5*(-1)"
    mistakes:
      - {answer: 0.25, msg: "σ'(0) = 0.25 doğru; ama ∂(wx + b)/∂w = x = −1 ile çarp."}
      - {answer: -0.5, msg: "σ'(z) = σ(z)(1 − σ(z)) = 0.25, σ(z) değil."}
    hints:
      - "$z=wx+b=0$, $\\sigma(0)=0.5$."
    solution: |-
      $z=0$, $\sigma'(0)=0.25$, $\partial z/\partial w=x=-1$ → $-0.25$.
  - id: p3
    type: hesap
    level: 1
    title: Değişken iki kez kullanılırsa
    goal: Dallanmada gradyanların toplandığını görmek
    needs: P1
    q: |-
      $f(x)=x\cdot x+3x$, $x=2$. Hesap grafiğiyle $f'(x)$?
    answer: 7.0
    calc: "2*2+3"
    mistakes:
      - {answer: 5.0, msg: "x çarpmaya iki kez giriyor: her kolun katkısı x, toplam 2x."}
      - {answer: 4.0, msg: "3x kolunun katkısı (3) da toplanmalı."}
    hints:
      - "$x$ üç yerde kullanılıyor; her kolun gradyanını topla."
    solution: |-
      Çarpmanın iki girdisi de $x$: katkılar $x+x=4$; $3x$ kolundan 3. Toplam 7 $=2x+3$ ✓. Autograd'da `.grad` biriktirmesinin (`+=`) matematiksel nedeni budur (M3.1).
  - id: p4
    type: hata-bul
    level: 2
    title: Max düğümünde gradyan
    goal: Max'ın yönlendirici davranışını uygulamak
    needs: P1
    q: |-
      $f=\max(a,b)$, $a=3$, $b=1$, $\partial L/\partial f=5$. Bir öğrenci $\partial L/\partial a=\partial L/\partial b=2.5$ yazmış. Doğrusu?
    choices:
      - {t: "İkisi de 5", why: "Bu toplama düğümünün kuralı."}
      - {t: "∂L/∂a = 5, ∂L/∂b = 0", ok: true, why: "Küçük değişimde yalnız kazanan girdi çıktıyı etkiler."}
      - {t: "Öğrenci haklı", why: "Eşit bölüşüm yalnız a = b iken (türevlenemez nokta) bir alt gradyan seçimidir."}
    hints:
      - "$b$'yi biraz artırırsan $f$ değişir mi?"
    solution: |-
      $a>b$ iken $f=a$ yerel olarak; $\partial f/\partial a=1$, $\partial f/\partial b=0$. Max havuzlamada gradyanın yalnız en büyük piksele gitmesi bundandır.
  - id: p5
    type: kanıt
    level: 3
    title: Vektör zincir kuralı ve shape'ler
    goal: Jacobian çarpımının sırasını ve boyutunu gerekçelendirmek
    needs: Jacobian
    q: |-
      $x\in\mathbb R^n$, $u=g(x)\in\mathbb R^m$, $L=h(u)\in\mathbb R$. $\nabla_xL=J_g^\top\nabla_uL$ olduğunu göster; bu çarpımı Jacobian'ı kurmadan hesaplamanın neden mümkün olduğunu ($y=Wx$ örneğiyle) açıkla.
    rubric:
      - "$\\frac{\\partial L}{\\partial x_j}=\\sum_i\\frac{\\partial L}{\\partial u_i}\\frac{\\partial u_i}{\\partial x_j}$ yazdım"
      - "Bunu $J_g^\\top\\nabla_uL$ (n × m · m) olarak tanıdım"
      - "$y=Wx$ için $J=W$, dolayısıyla VJP'nin $W^\\top g$ olduğunu söyledim"
      - "Eleman eleman fonksiyonlarda Jacobian köşegen olduğu için VJP'nin ⊙ olduğunu söyledim"
    hints:
      - "Tek bir $x_j$, $L$'yi tüm $u_i$'ler üzerinden etkiler."
    solution: |-
      Çok değişkenli zincir kuralı: $\partial L/\partial x_j=\sum_i(\partial L/\partial u_i)(J_g)_{ij}$ → $\nabla_xL=J_g^\top\nabla_uL$. Autograd her düğüm için tam Jacobian'ı değil bu **vektör–Jacobian çarpımını** (VJP) uygular: $y=Wx$'te $J=W$ ve VJP $W^\top g$ — $m\times n$ boyutunda bir matris zaten var, yeni bir şey kurulmaz. $\tanh$ gibi eleman eleman fonksiyonlarda $J$ köşegendir, VJP $g\odot\tanh'(x)$. Bu, ters modun bellek ve hesap açısından verimliliğidir (M6.3).
pitfalls:
  - wrong: "Bir değişkenin gradyanı, onun kullanıldığı son yerden gelir."
    right: "Değişken birden çok yerde kullanılıyorsa tüm yollardan gelen gradyanlar toplanır (P3)."
  - wrong: "Zincir kuralında Jacobian'lar hangi sırayla çarpılsa olur."
    right: "Matris çarpımı değişmeli değildir; shape'ler sırayı belirler (P5). Sıra yalnız hesap maliyetini (ileri vs ters mod) değiştirmek için yeniden gruplanabilir (birleşme özelliği)."
whatif:
  - q: "Fonksiyon bir noktada türevlenemezse (ReLU'da 0, max'ta eşitlik)?"
    a: "Alt gradyan seçilir (ReLU'da 0'da genelde 0); ölçüsü sıfır kümede olduğu için pratikte sorun çıkmaz."
  - q: "Çıktı skaler değil de vektörse?"
    a: "Tek bir gradyan yoktur, Jacobian vardır; ters mod her çıktı için bir geçiş ister (ya da `backward(v)` ile bir VJP)."

labs:
  - id: l1
    lab: numdiff
    title: "Sekanttan teğete: ileri fark, merkezi fark ve en iyi h"
    goal: |
      Soldaki grafikte $x_0$ ve $x_0+h$'den geçen sekant (turuncu kesikli) ile gerçek teğeti (yeşil) karşılaştır. Sağdaki grafik, $h$'yi $10^{-14}$'ten $1$'e kadar tarayıp iki yaklaşımın mutlak hatasını log–log çizer. Seçili $h$ dikey çizgiyle işaretlidir.
    predict:
      q: "float64'te ileri farkla $f'(x)$'i hesaplarken $h=10^{-14}$ seçmek $h=10^{-8}$'e göre daha mı doğrudur?"
      options:
        - {t: "Hayır, daha kötüdür: f(x+h) − f(x) farkı yuvarlama gürültüsüne gömülür", ok: true, why: "Yuvarlama hatası ~ε|f|/h: h = 10⁻¹⁴'te ~10⁻², h = 10⁻⁸'de ~10⁻⁸. Kesme hatası ise ~h|f''|/2. Toplamın en küçüğü h ≈ √ε ≈ 10⁻⁸ civarında."}
        - {t: "Evet, h küçüldükçe her zaman daha doğru", why: "Bu, gerçek sayılarda (sonsuz hassasiyet) doğrudur; kayan noktada farkı alınan iki sayı neredeyse eşit olunca göreli hata patlar."}
        - {t: "İkisi aynıdır", why: "Hata eğrisi V biçimlidir; iki uç farklı mekanizmalardan gelir."}
    presets:
      - {name: "Büyük h", params: {fn: 0, x0: 1, h: 0.8, prec: 0}, note: "Sekant teğetten belirgin biçimde ayrılıyor: kesme hatası (eğrilik f''(1) = 6)."}
      - {name: "En iyi bölge", params: {fn: 0, x0: 1, h: 0.00001, prec: 0}, note: "Merkezi fark için h ≈ ∛ε ≈ 10⁻⁵ civarı: hata ~10⁻¹⁰."}
      - {name: "Çok küçük h", params: {fn: 1, x0: 1, h: 1e-13, prec: 0}, note: "Yuvarlama baskın: ileri fark bile birkaç basamakta yanlış."}
      - {name: "float32", params: {fn: 3, x0: 0.5, h: 0.0001, prec: 1}, note: "float32'de ε ≈ 10⁻⁷: V'nin dibi ~10⁻³–10⁻⁵. Gradyan kontrolünü bu yüzden float64'te yap."}
      - {name: "ReLU kırılması", params: {fn: 4, x0: 0, h: 0.001, prec: 0}, note: "x₀ = 0'da sol ve sağ eğim farklı (0 ve 1): merkezi fark 0.5 verir, hangi h olursa olsun."}
      - {name: "Kırılmaya yakın", params: {fn: 5, x0: 0.0005, h: 0.001, prec: 0}, note: "x₀ türevli bir noktada (türev 1) ama h kırılmayı aşıyor: merkezi fark yanlış (0.5). Gradyan kontrolündeki yanlış alarmların kaynağı."}
    questions:
      - q: "Hata grafiğinin sağ kolunda ileri farkın eğimi ~1, merkezi farkın eğimi ~2. Nedenini Taylor açılımıyla açıkla."
        a: "İleri fark hatası $\\tfrac12f''(x)h$ (h'nin 1. kuvveti), merkezi farkta çift dereceli terimler sadeleştiği için $\\tfrac16f'''(x)h^2$. Log–log ölçekte $h^p$ eğimi $p$ olan bir doğrudur."
      - q: "$f=$ eˣ, $x_0$ büyükken (ör. 3) V'nin dibi neden yükselir?"
        a: "Yuvarlama hatası $\\varepsilon|f|/h$ ile orantılıdır ve $|f|=e^3\\approx20$; mutlak hata büyür. Göreli hataya bakmak bu yüzden daha anlamlıdır."
      - q: "$f=x^3-2x$ için merkezi fark, $h$ büyükken bile neden çok doğru?"
        a: "Merkezi farkın hatası $\\tfrac16f'''h^2$ ve $f'''=6$ sabit: hata tam olarak $h^2$, daha yüksek dereceli terim yok. $h=0.3$'te hata $0.09$; ileri farkta ise $\\tfrac12f''(x)h=3xh$ ($x_0=1$'de $0.9$) artı $h^2$."
    limits: "float32 benzetimi, her ara sonucu Math.fround ile yuvarlar; gerçek float32 donanım hesabına çok yakındır ama fonksiyonun kendisi (sin, exp) float64'te hesaplanıp sonra yuvarlanır. Yalnız tek değişkenli fonksiyonlar."
  - id: l2
    lab: graphstep
    title: "Hesap grafiğinde adım adım geri yayılım"
    goal: |
      Bir ifade seç, girdileri değiştir ve "İleri" düğmesiyle (ya da ← → tuşlarıyla) ilerle. Önce düğüm değerleri soldan sağa (yeşil), sonra gradyanlar sağdan sola (turuncu) hesaplanır. Her geri adımda hangi kenardan ne aktığı ve neyin çarpıldığı yazılır. Son adımda sonuç merkezi farkla karşılaştırılır.
    predict:
      q: "Üçüncü ifadede ($f=\\max(x\\cdot y,0)+x$) $x=2$, $y=-1$ iken $\\partial f/\\partial y$ kaçtır?"
      options:
        - {t: "0 — ReLU kapalı (xy = −2 < 0), gradyan y'ye ulaşmaz", ok: true, why: "max kapısı yönlendiricidir: kaybeden (burada xy, çünkü 0 > −2) gradyan almaz."}
        - {t: "x = 2", why: "Bu, ReLU açık olsaydı çarpma kapısının y'ye vereceği değerdi."}
        - {t: "1", why: "1, x'in doğrudan (toplama) yolundan gelen katkıdır; y'nin böyle bir yolu yok."}
    presets:
      - {name: "Modülün el hesabı", params: {expr: 0, x: 2, y: 3, step: 0}, note: "Hand bölümündeki örnek: sonda ∂f/∂y = 5 + 3 = 8 olduğunu, iki yolun toplandığını izle."}
      - {name: "Nöron, sonucu göster", params: {expr: 1, w: 0.8, x: 1.5, b: -0.5, t: 1, step: -1}, note: "Ders metnindeki 'Tam bir örnek' bölümüyle aynı sayılar. Geri adımlarla tek tek doğrula."}
      - {name: "Doymuş sigmoid", params: {expr: 1, w: 4, x: 2, b: 1, t: 0, step: -1}, note: "z = 9: σ'(z) ≈ 1.2·10⁻⁴. Kayıp büyük (a ≈ 1, hedef 0) ama gradyan neredeyse sıfır — sigmoid + kare kaybın öğrenmeyi durdurduğu durum (M2.3: çapraz entropi bunu çözer)."}
      - {name: "ReLU kapalı", params: {expr: 2, x: 2, y: -1, step: -1}, note: "y'nin gradyanı 0; x yalnız doğrudan yoldan 1 alır."}
      - {name: "ReLU açık", params: {expr: 2, x: 2, y: 1.5, step: -1}, note: "Artık iki yol da açık: ∂f/∂x = y + 1 = 2.5, ∂f/∂y = x = 2."}
    questions:
      - q: "Nöron ifadesinde $x$'i 0 yaparsan $\\partial L/\\partial w$ ne olur? Neden?"
        a: "0 olur: $\\partial L/\\partial w=\\partial L/\\partial z\\cdot x$. Girdisi sıfır olan bağlantının ağırlığı o örnekten hiç öğrenmez; bias ise öğrenmeye devam eder."
      - q: "Birinci ifadede geri geçişte $y$'ye neden iki ayrı adımda gradyan gelir?"
        a: "$y$ iki düğümde kullanılıyor ($a=x+y$ ve $f=a\\cdot y$). Çok değişkenli zincir kuralı her yolun katkısını toplar; ters topolojik sıra sayesinde $y$ işlenmeden önce iki katkı da gelmiş olur."
    limits: "Skaler düğümlerle küçük grafikler; gerçek ağlarda düğümler tensördür ve yerel türevler Jacobian–vektör çarpımı olarak uygulanır (ders metni, 'İleri mod ve ters mod'). Girdi kutularına sayı yazınca grafik hemen yeniden hesaplanır."
  - id: l3
    lab: jacmap
    title: "Jacobian: eğri dönüşümün yerel doğrusal yaklaşımı"
    goal: |
      Soldaki düzlemde $p$ noktasını sürükle (ya da odaklanıp ok tuşlarıyla taşı). $p$'nin çevresindeki küçük kare (kenarı $2\varepsilon$) sağda $g$ ile dönüşür (mavi, eğri olabilir). Turuncu kesikli paralelkenar aynı karenin $J(p)$ ile doğrusal görüntüsüdür. $\varepsilon$'u küçült ve "yakınlaştır"ı aç: ikisi çakışır. Tablo $J$'yi formülle ve sayısal olarak, $\det J$'yi ve görüntünün alan oranını verir.
    predict:
      q: "Kutupsal dönüşümde $r$ küçülürken (θ sabit) aynı küçük karenin görüntüsünün alanı nasıl değişir?"
      options:
        - {t: "Küçülür: det J = r, r → 0'da sıfıra gider", ok: true, why: "θ yönündeki adım çıktıda r·dθ uzunluğunda bir yay olur; orijine yaklaştıkça yaylar kısalır. r = 0'da tüm θ'lar aynı noktaya gider: dönüşüm orada tersinmez."}
        - {t: "Hep aynı kalır", why: "Bu yalnız det J sabitse (ör. döndürmeler) olur."}
        - {t: "Büyür", why: "det J = r; r büyüdükçe büyür, küçüldükçe küçülür."}
    presets:
      - {name: "Modülün alıştırması", params: {map: 0, px: 2, py: 2.4, eps: 0.2, zoom: false}, note: "g(x, y) = (xy, x + y²): J = [[y, x], [1, 2y]]. Hand bölümündeki Jacobian (2, 3)'te; burada kenara sığsın diye (2, 2.4)."}
      - {name: "Küçük ε, yakın", params: {map: 0, px: 1, py: 1, eps: 0.02, zoom: true}, note: "Eğri görüntü ile paralelkenar neredeyse aynı: türev = en iyi doğrusal yaklaşım."}
      - {name: "Büyük ε, yakın", params: {map: 0, px: 1, py: 1, eps: 0.8, zoom: true}, note: "Yaklaşım bozuluyor: göreli hata ε ile orantılı."}
      - {name: "det J = 0", params: {map: 0, px: 0.5, py: 0.5, eps: 0.15, zoom: true}, note: "det J = 2y² − x = 0.5 − 0.5 = 0: kare bir doğruya ezilir. Bu noktada g yerel olarak tersinmez."}
      - {name: "Kutupsal, orijine yakın", params: {map: 1, px: 0.3, py: 0.8, eps: 0.15, zoom: false}, note: "det J = r = 0.3: görüntü küçük ve eğri bir yay parçası."}
      - {name: "Doğrusal dönüşüm", params: {map: 3, px: 0.5, py: 0.5, eps: 0.8, zoom: false}, note: "J her yerde aynı ve yaklaşım tam (hata 0): doğrusal bir dönüşümün türevi kendisidir."}
    questions:
      - q: "Tabloda görüntü alanı / kare alanı ile det J ne zaman birbirinden ayrılıyor?"
        a: "ε büyükken: alan oranı karenin her noktasındaki det J'nin ortalamasıdır, det J ise yalnız p'deki değer. ε → 0'da ikisi eşitlenir (değişken değiştirme formülünün temeli; normalizing flow'larda log|det J|)."
      - q: "J'nin birinci sütunu çıktı düzleminde neye karşılık gelir?"
        a: "Girdide yalnız birinci koordinat yönünde (x ya da r) küçük bir adımın çıktıdaki yer değiştirme vektörüne (birim adım başına). Paralelkenarın bir kenarı."
    limits: "Yalnız ℝ² → ℝ² dönüşümler. Girdap dönüşümünün J'si analitik değil, merkezi farkla hesaplanır (tablodaki iki sütun bu yüzden aynı). Alan oranı sınırın 240 noktasıyla yaklaşık hesaplanır."
  - id: l4
    lab: gradfield
    title: "Gradyan, konturlar ve yönlü türev"
    goal: |
      Koyu bölgeler küçük $f$ değerleridir. Gri noktalar $p$'den geçen eş-yükselti eğrisidir. Kırmızı ok $\nabla f(p)$'nin yönü, mavi ok seçtiğin birim yön $u$. Sağdaki grafik, $u$'yu tam bir tur döndürünce yönlü türevin nasıl değiştiğini gösterir.
    predict:
      q: "Eliptik çanakta (½x² + 2y²) $p=(1.2,\\ 0.6)$ iken $-\\nabla f$ doğrudan minimuma (orijine) mı bakar?"
      options:
        - {t: "Hayır: ∇f = (1.2, 2.4), −∇f orijin yönüne (−1.2, −0.6) göre dar eksene doğru sapar", ok: true, why: "Gradyan konturlara diktir; uzun elipslerde kontura dik yön merkeze bakmaz. Gradyan inişinin zikzakının nedeni."}
        - {t: "Evet, gradyan her zaman minimumu gösterir", why: "Yalnız konturlar çemberse (izotropik çanak) doğru."}
        - {t: "Gradyan minimuma dik bakar", why: "Gradyan konturlara diktir, minimuma değil."}
    presets:
      - {name: "Gradyan yönünde", params: {fn: 0, px: 1.2, py: 0.6, th: 63}, note: "θ ≈ ∇f'nin açısı (63.4°): yönlü türev ‖∇f‖'ye eşit (en büyük)."}
      - {name: "Kontura teğet", params: {fn: 0, px: 1.2, py: 0.6, th: 153}, note: "θ = 63° + 90°: u konturlara teğet, yönlü türev ≈ 0."}
      - {name: "Eyer noktası", params: {fn: 1, px: 0, py: 0, th: 0}, note: "∇f = 0 ama minimum değil: x yönünde yukarı, y yönünde aşağı kıvrılır. Gradyan tek başına minimumu eyerden ayıramaz (Hessian gerekir)."}
      - {name: "Muz vadisi", params: {fn: 2, px: -1, py: 0.5, th: 0}, note: "Gradyan vadinin dik duvarına bakar; minimum (1, 1) çok farklı yönde."}
    questions:
      - q: "Sağdaki eğri neden her fonksiyonda saf bir kosinüs?"
        a: "$D_uf=\\nabla f\\cdot(\\cos\\theta,\\sin\\theta)=\\|\\nabla f\\|\\cos(\\theta-\\theta_\\nabla)$. Fonksiyon ne olursa olsun, sabit bir noktada yönlü türev $u$'nun doğrusal bir fonksiyonudur (türevlenebilirliğin anlamı)."
      - q: "Tablodaki formülle hesaplanan ve sayısal yönlü türev neden aynı?"
        a: "Türevlenebilir bir fonksiyonda $D_uf=\\nabla f\\cdot u$ eşitliği kesindir; sayısal değer $u$ boyunca merkezi farkla, $h=10^{-5}$ ile hesaplanır ve hata ~$10^{-10}$'dur."
    limits: "Eş-yükselti eğrisi 220 × 220 ızgarada işaret değişimiyle bulunur (noktalı görünür). Isı haritası rengi göreli; muz vadisinde log ölçekli. Görselde eksenler eşit ölçekli olsun diye grafik kare tutulur."
