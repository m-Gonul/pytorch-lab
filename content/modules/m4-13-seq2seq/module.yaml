id: m4-13-seq2seq
code: M4.13
title: Seq2seq, Bahdanau attention ve beam search
phase: 4
minutes: 400
prereq: [m4-4-lstm-gru, m4-6-attention]
summary: >
  Sinirsel makine çevirisinin (NMT) kodlayıcı–kod çözücü mimarisi: tüm
  kaynak cümleyi tek bir vektöre sıkıştıran RNN, öğretmen zorlaması
  (teacher forcing), EOS, dolgu ve maskeleme, uzunluğa göre kovalama,
  büyük çıktı sözlüğü için örneklenmiş softmax, zamanlanmış örnekleme ve
  çift yönlü RNN'ler. Açgözlü çözümlemenin hatası ve beam search (uzunluk
  normalizasyonuyla), Bahdanau (toplamsal) ve Luong (çarpımsal) attention.
  Saf Python'da beam search, NumPy'da maskeli toplamsal/çarpımsal attention
  ve maskeli kayıp, PyTorch'ta tarih biçimi çevirisinde attention'sız ve
  attention'lı seq2seq ile hizalama haritası, sonda toplu (batched) beam
  search. Ekler: BLEU, kovalama, örneklenmiş softmax'ın yanlılığı.
goals:
  - "Kodlayıcı–kod çözücü, [[öğretmen zorlaması]], EOS / dolgu maskeleme, çift yönlü kodlayıcı"
  - "[[beam search]]: açgözlünün geri dönemeyen hatası, k aday, uzunluk normalizasyonu"
  - "[[toplamsal attention]] (Bahdanau) ve çarpımsal (Luong): skor, softmax, bağlam vektörü"
  - "Darboğaz vektörü sorununu ölçmek: attention'sız vs attention'lı doğruluk"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 16", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Sutskever, Vinyals, Le — Sequence to Sequence Learning with Neural Networks (NeurIPS 2014)", url: "https://arxiv.org/abs/1409.3215", license: "arXiv", use: link}
  - {title: "Bahdanau, Cho, Bengio — Neural Machine Translation by Jointly Learning to Align and Translate (ICLR 2015)", url: "https://arxiv.org/abs/1409.0473", license: "arXiv", use: link}
  - {title: "Luong, Pham, Manning — Effective Approaches to Attention-based NMT (EMNLP 2015)", url: "https://arxiv.org/abs/1508.04025", license: "arXiv", use: link}
  - {title: "Bengio ve ark. — Scheduled Sampling for Sequence Prediction with RNNs (NeurIPS 2015)", url: "https://arxiv.org/abs/1506.03099", license: "arXiv", use: link}
  - {title: "Jean ve ark. — On Using Very Large Target Vocabulary for NMT (ACL 2015)", url: "https://arxiv.org/abs/1412.2007", license: "arXiv", use: link}
  - {title: "Papineni ve ark. — BLEU (ACL 2002)", url: "https://aclanthology.org/P02-1040/", license: "©", use: link}
  - {title: "Stanford CS224n — Lecture 7: Machine Translation, Seq2Seq, Attention", url: "https://web.stanford.edu/class/cs224n/", license: "©", use: link}
  - {title: "d2l.ai — 10.7 Seq2Seq, 10.8 Beam Search, 11.4 Bahdanau Attention", url: "https://d2l.ai/chapter_attention-mechanisms-and-transformers/bahdanau-attention.html", license: "CC-BY-SA 4.0", use: link}

hand:
  groups:
    - title: "Beam search"
      fields:
        - {id: howare, label: "P(How) = 0.75, P(are | How) = 0.32: P(\"How are\")", answer: 0.24, tol: 1.0e-9}
        - {id: cand, label: "Beam genişliği 3, sözlük 10 000: bir adımda değerlendirilen aday sayısı", answer: 30000}
        - {id: greedy, label: "Ağaç: P(A) = 0.6, P(B) = 0.4; A'dan sonra x 0.4, y 0.3, z 0.3; B'den sonra x 0.9. Açgözlü iki kelimelik dizinin olasılığı", answer: 0.24, tol: 1.0e-9}
        - {id: beam, label: "Aynı ağaç, k = 2 beam search sonucu", answer: 0.36, tol: 1.0e-9}
        - {id: norm, label: "Uzunluk normalizasyonu (α = 1): 4 token'lık, olasılığı 0.2 olan hipotezin skoru $\\log p/L$", answer: -0.40235947810852507, tol: 1.0e-6}
    - title: "Attention"
      fields:
        - {id: alpha1, label: "Luong (nokta çarpım): $s=[1,0]$, kodlayıcı çıktıları $[1,0]$, $[0,1]$, $[1,1]$ → $\\alpha_1$", answer: 0.42231879825151096, tol: 1.0e-6}
        - {id: ctx, label: "Aynı örnek: bağlam vektörünün ilk bileşeni", answer: 0.8446375965030219, tol: 1.0e-6}
        - {id: n2, label: "50 kelimelik girdi, 50 kelimelik çıktı: hesaplanan attention ağırlığı sayısı", answer: 2500}
        - {id: bi, label: "Çift yönlü GRU, her yön 128 birim: birleştirilmiş durum boyutu", answer: 256}
  verify: |
    import math
    e = math.e
    answers = dict(howare=0.75 * 0.32, cand=3 * 10000, greedy=0.6 * 0.4, beam=0.4 * 0.9, norm=math.log(0.2) / 4,
                   alpha1=e / (2 * e + 1), ctx=2 * e / (2 * e + 1), n2=2500, bi=256)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "BLEU: değiştirilmiş n-gram kesinliği ve kısalık cezası", engine: browser}
  - {id: x2, title: "Kovalama: dolgu israfını ölçmek", engine: browser}
  - {id: x3, title: "Örneklenmiş softmax ve log Q düzeltmesi", engine: browser}

quiz:
  - q: "Açgözlü çözümleme neden yetersiz kalabilir?"
    options:
      - {t: "Her adımda en olası kelimeyi seçer ve geri dönemez: erken bir yanlış ('How will…') sonraki tüm adımları kilitler; dizinin toplam olasılığı en büyük olmayabilir", ok: true, why: "Beam search k hipotezi açık tutarak düzeltme şansı verir."}
      - {t: "Çok yavaş olduğu için", why: "En hızlı yöntemdir."}
      - {t: "Olasılıkları normalize etmediği için", why: "Konu bu değil."}
  - q: "Attention'sız seq2seq'in temel darboğazı nedir?"
    options:
      - {t: "Tüm kaynak cümle kodlayıcının son gizli durumuna sıkıştırılır; uzun cümlelerde bilgi kaybolur. Attention kod çözücünün her adımda tüm kodlayıcı çıktılarına bakmasını sağlar", ok: true, why: "d aşamasında aynı eğitimde doğruluk farkı bunu gösterir."}
      - {t: "Embedding boyutunun küçük olması", why: "İkincil."}
      - {t: "Öğretmen zorlaması", why: "Eğitim tekniği; darboğaz değil."}
  - q: "Örneklenmiş softmax neden çıkarımda (inference) kullanılamaz?"
    options:
      - {t: "Normalizasyonu doğru kelime + birkaç rastgele kelime üzerinden yapar; doğru kelimeyi bilmeyi gerektirir ve tüm sözlük üzerinde olasılık vermez", ok: true, why: "Çıkarımda tam softmax (ya da en az argmax) gerekir."}
      - {t: "Çok yavaş olduğu için", why: "Hızlıdır."}
      - {t: "Gradyan hesaplayamadığı için", why: "Eğitimde zaten gradyan için kullanılır."}

homework:
  - title: "Bahdanau, Cho, Bengio (2015): hizalamayı birlikte öğrenmek"
    paper: "Bahdanau, Cho, Bengio — Neural Machine Translation by Jointly Learning to Align and Translate (ICLR 2015)"
    url: "https://arxiv.org/abs/1409.0473"
    level: ileri
    hours: 16
    goal: |
      d aşamasındaki modeli gerçek bir paralel derleme (ör. Tatoeba İngilizce–Türkçe, ~100 bin cümle, BPE ile — M4.5) taşı: çift yönlü GRU kodlayıcı, toplamsal attention, maxout'lu çıktı (Bölüm A.2.2). RNNencdec ve RNNsearch'ü cümle uzunluğuna göre BLEU ile karşılaştır (makale Şekil 2: attention'sız modelin uzun cümlelerde çöküşü) ve birkaç cümle için hizalama haritası çiz (Şekil 3).
    steps:
      - "BLEU için x1'deki uygulamanı kullan (korpus düzeyi)."
      - "Uzunluk kovaları: 0–10, 10–20, 20–30, 30+ kelime."
    accept:
      - "Uzunluk arttıkça attention'sız modelin BLEU'su attention'lıdan hızla düşer."
      - "Hizalama haritaları kelime sırası farklarını (Türkçe SOV) yansıtır."
  - title: "Bengio ve ark. (2015): zamanlanmış örnekleme"
    paper: "Bengio, Vinyals, Jaitly, Shazeer — Scheduled Sampling for Sequence Prediction with Recurrent Neural Networks (NeurIPS 2015)"
    url: "https://arxiv.org/abs/1506.03099"
    level: orta
    hours: 8
    goal: |
      Öğretmen zorlamasının "maruz kalma yanlılığını" (exposure bias) ölç: tarih çevirisinde kod çözücüye eğitimde gerçek önceki token yerine ε_i olasılıkla kendi tahminini ver; makaledeki doğrusal, üstel ve ters sigmoid azalma takvimlerini karşılaştır. Girdiye gürültü eklenmiş (yazım hatalı ay adları) bir test setinde tam eşleşme doğruluğunu ve hatanın ilk görüldüğü adımdan sonraki hata yayılımını raporla.
    steps:
      - "Ters sigmoid: $\\epsilon_i=k/(k+\\exp(i/k))$."
    accept:
      - "Zamanlanmış örnekleme gürültülü testte hata yayılımını azaltır."
      - "Takvimlerin karşılaştırma tablosu ve eğitim eğrileri."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Işın araması ve uzunluk normalizasyonu
    goal: Dizi olasılıklarını log uzayında karşılaştırmak
    needs: Logaritma, koşullu olasılık
    q: |-
      İki aday çeviri. A: token olasılıkları 0.5, 0.4, 0.9 (sonra EOS). B: 0.6 (sonra EOS). Hangisi seçilir: ham log-olasılıkla ve token başına normalize edilmiş log-olasılıkla?
    solution: |-
      **Ham:** $\log P(A)=\ln0.5+\ln0.4+\ln0.9=\ln0.18=-1.715$; $\log P(B)=\ln0.6=-0.511$ → **B** (kısa olan).

      **Normalize:** A: $-1.715/3=-0.572$; B: $-0.511/1=-0.511$ → yine B, ama fark küçüldü. Her ek token olasılığı 1'den küçük bir sayıyla çarptığı için ham skor kısa dizileri sistematik olarak kayırır; uzunluk normalizasyonu (Wu ve ark. 2016'da $\mathrm{lp}=\frac{(5+|Y|)^\alpha}{6^\alpha}$, α ≈ 0.6–0.7) bunu dengeler.

      **Işın araması:** her adımda en iyi $B$ kısmi diziyi tutar, her birini tüm sözlükle genişletir ($B\cdot V$ aday), yine en iyi $B$'yi seçer. Greedy ($B=1$) ilk adımdaki yerel en iyiye kilitlenir.
  - id: p2
    type: hesap
    level: 1
    title: Dizi log-olasılığı
    goal: Zincir kuralıyla dizi olasılığı hesaplamak
    needs: P1
    q: |-
      Token olasılıkları 0.5, 0.4, 0.9. Dizinin toplam log-olasılığı (doğal log)?
    answer: -1.7147984280919266
    calc: "math.log(0.5*0.4*0.9)"
    tol: 1e-3
    mistakes:
      - {answer: 0.18000000000000002, msg: "Bu olasılığın kendisi; logaritmasını al."}
      - {answer: 0.5877866649021191, msg: "Olasılıklar çarpılır, log'lar toplanır."}
    hints:
      - "$\\ln(0.18)$."
    solution: |-
      $\ln0.18=-1.715$.
  - id: p3
    type: hesap
    level: 1
    title: Işın aramasının maliyeti
    goal: Adım başına aday sayısını hesaplamak
    needs: P1
    q: |-
      Işın genişliği 4, hedef sözlük 10 000. Her adımda kaç aday skorlanır?
    answer: 40000.0
    calc: "4*10000"
    mistakes:
      - {answer: 4.0, msg: "Her ışın tüm sözlükle genişletilir."}
    hints:
      - "$B\\cdot V$."
    solution: |-
      40 000; en iyi 4'ü `topk` ile seçilir. Kod çözücü ağın çağrısı ise 4 dizi için tek batch'tir.
  - id: p4
    type: yorumla
    level: 2
    title: Eğitimde iyi, çıkarımda saçmalıyor
    goal: Maruz kalma yanlılığını tanımak
    needs: Öğretmen zorlaması
    q: |-
      Öğretmen zorlamasıyla eğitilen model, eğitim ve doğrulama kaybında çok iyi; ama kendi ürettiği token'larla çalışırken bir hatadan sonra çorba üretiyor. Neden?
    choices:
      - {t: "Aşırı uyum", why: "Doğrulama kaybı da iyi."}
      - {t: "Maruz kalma yanlılığı: eğitimde hep doğru önceki token'ı gördü, kendi hatalarından sonraki durumları hiç görmedi", ok: true, why: "Eğitim ve çıkarım dağılımları farklı."}
      - {t: "Işın genişliği küçük", why: "Işın yardımcı olabilir ama asıl neden dağılım farkı."}
    hints:
      - "Eğitimde kod çözücünün girdisi nereden geliyor?"
    solution: |-
      Öğretmen zorlaması eğitimi paralel ve kararlı yapar ama çıkarım koşullarını hiç göstermez. Azaltma: zamanlanmış örnekleme (Bengio ve ark. 2015: eğitimde giderek artan oranda modelin kendi tahminini girdi yapmak), dizi düzeyinde eğitim, ışın araması.
  - id: p5
    type: açıkla
    level: 3
    title: Darboğaz vektörü
    goal: Sabit boyutlu bağlam vektörünün sınırını açıklamak
    needs: RNN kodlayıcı
    q: |-
      Bahdanau ve ark. (2015), attention'sız kodlayıcı–kod çözücünün BLEU skorunun cümle uzunluğu arttıkça düştüğünü gösterdi. Neden ve attention nasıl çözer?
    rubric:
      - "Tüm kaynak cümlenin tek bir sabit boyutlu vektöre sıkıştırıldığını söyledim"
      - "Uzun cümlede bilginin bu vektöre sığmadığını ve baştaki kelimelerin unutulduğunu açıkladım"
      - "Attention'ın her çıkış adımında tüm kodlayıcı durumlarına ağırlıklı erişim verdiğini söyledim"
      - "Gradyan yolunun da kısaldığını ekledim"
    hints:
      - "50 kelimelik bir cümle, 512 sayıya nasıl sığar?"
    solution: |-
      Sabit vektör bir bilgi darboğazıdır; uzun cümlelerde ilk kelimelerin bilgisi kaybolur (kaynağı ters çevirmek, Sutskever ve ark. 2014, bu yüzden yardımcı oldu). Attention her kod çözücü adımında $c_t=\sum_s\alpha_{ts}h_s$ hesaplar: bellek kaynak uzunluğuyla büyür ve her kaynak kelimesine doğrudan (kısa) bir gradyan yolu açılır — Transformer'ın çıkış noktası.
pitfalls:
  - wrong: "Işın genişliği büyüdükçe çeviri her zaman iyileşir."
    right: "Çok büyük ışın kısa ve genel çevirileri seçer (ışın araması laneti); uzunluk normalizasyonu ve ılımlı ışın (4–10) gerekir."
  - wrong: "Dolgu token'ları kayba katılabilir."
    right: "Kayıp ve attention dolguyu maskelemeli; aksi hâlde model dolguyu tahmin etmeyi öğrenir."
whatif:
  - q: "Kaynak cümle ters çevrilip verilirse (attention'sız modelde)?"
    a: "İlk hedef kelimeler ilk kaynak kelimelere zaman olarak yaklaşır, gradyan yolu kısalır; Sutskever ve ark. bunun BLEU'yu belirgin artırdığını buldu."

labs:
  - id: l1
    lab: padwaste
    title: "Dolgu israfı: rastgele batch, tam sıralama ve kovalama"
    goal: |
      Değişken uzunluklu cümleleri batch'lere koyunca her batch en uzun cümlesine kadar doldurulur. Uzunluk dağılımını ve batch boyunu seç, üç stratejinin dolgu oranını ölç. Kovalama parçası büyüdükçe israfın rastgele batch'ten tam sıralamaya nasıl indiğini izle.
    predict:
      q: "Log-normal uzunluklar (ortalama 20), B = 64. Rastgele batch'lerde dolgulu tensör hücrelerinin yaklaşık ne kadarı dolgu olur?"
      options:
        - {t: "≈ %10", why: "Bu, kovalamayla bile zor ulaşılan bir oran."}
        - {t: "≈ %35", why: "64 cümlelik bir batch'te en uzun cümle genelde ortalamanın 3–4 katıdır."}
        - {t: "≈ %75", ok: true, why: "Ölçülen %74: batch başına en uzun cümle ortalama 78 token, ortalama cümle 20 token. Gerçek token başına 3.9 hücre hesaplanıyor."}
    presets:
      - {name: "Kovalama (varsayılan)", params: {n: 5000, dist: 0, mean: 20, spread: 0.6, B: 64, strat: 2, chunk: 20}, note: "İsraf %20.4. Aynı veride rastgele batch %73.6, tümünü sıralamak %4.1."}
      - {name: "Rastgele batch", params: {strat: 0}, note: "İsraf %74.2; gerçek token başına 3.88 hücre hesaplanıyor."}
      - {name: "Tümünü sırala", params: {strat: 1}, note: "İsraf %4.1, ama batch'lerin bileşimi her epoch aynı."}
      - {name: "Uzun kuyruk", params: {strat: 2, spread: 1.2}, note: "σ = 1.2: kovalanmış batch'lerde bile israf %63 (rastgele %91). Birkaç çok uzun cümle kendi parçalarındaki batch'leri şişiriyor."}
      - {name: "Küçük batch", params: {strat: 2, B: 4}, note: "B = 4: israf %8.3; rastgele batch'lerde %41. Dolgu batch içindeki uzunluk farkından gelir."}
    questions:
      - q: "Parça boyu 1 olduğunda kovalama neden rastgele batch'le aynı sonucu verir?"
        a: "Parça = 1 batch: her parça kendi içinde sıralanır ama aynı cümleler aynı batch'te kalır; batch'in en uzun cümlesi değişmez."
      - q: "Maskeleme dolgunun hesap maliyetini kaldırır mı?"
        a: "Hayır. Maske sonucu yok sayar ama dolgu hücreleri yine hesaplanır. Maliyeti gerçekten kaldırmak için pack_padded_sequence (RNN), değişken uzunluklu dikkat çekirdekleri ya da dizileri uç uca ekleyip blok-köşegen maske kullanmak gerekir."
    limits: "Uzunluklar sentetik dağılımlardan; maliyet hücre sayısıyla ölçülüyor (gerçek GPU süresi ayrıca çekirdek verimine bağlıdır). Batch'lerin homojenleşmesinin eğitim kalitesine etkisi burada ölçülmüyor."
  - id: l2
    lab: sampledsm
    title: "Örneklenmiş softmax: yanlılık, düzeltme ve örnek sayısı"
    goal: |
      Büyük bir çıktı sözlüğünde çapraz entropinin gizli duruma göre gradyanını, hedef + m örnek üzerinden kestir. Öneri dağılımını (düzgün ya da Zipf) ve logitlerden çıkarılan düzeltmeyi (hiç, log q, log(m·q)) değiştir. 120 farklı örnek kümesinin ortalama gradyanının tam gradyandan ne kadar saptığını ölç.
    predict:
      q: "Zipf öneri dağılımıyla örnekleyip hiçbir düzeltme yapmazsan, m'yi 50'den 2000'e çıkarmak yanlılığı nasıl etkiler?"
      options:
        - {t: "Sıfıra indirir", why: "Örnekler sık kelimelere doğru eğilimli kalır; m büyüdükçe bu eğilim daha kesin kestirilir, ama ortadan kalkmaz."}
        - {t: "Değiştirmez ya da biraz artırır", ok: true, why: "Ölçülen: göreli yanlılık m = 50'de 0.58, m = 2000'de 0.63. Düzeltme yoksa kestirici yanlış bir dağılıma yakınsar."}
        - {t: "Varyansı artırır", why: "Varyans m ile azalır; sorun yanlılık."}
    presets:
      - {name: "log(m·q) düzeltmesi", params: {V: 5000, m: 50, prop: 1, corr: 2, t: 30}, note: "Yanlılık 0.024, tek kümenin göreli hatası 0.23, kosinüs 0.97; maliyet 98 kat düşük."}
      - {name: "Düzeltme yok", params: {V: 5000, m: 50, prop: 1, corr: 0, t: 30}, note: "Yanlılık 0.60: gradyanın 'beklenen çıktı' kısmı sık kelimelere doğru kayıyor."}
      - {name: "Sık hedef, log q", params: {V: 5000, m: 50, prop: 1, corr: 1, t: 1}, note: "Hedef en sık kelime (p_t = 0.11): log q düzeltmesiyle yanlılık 0.12 ve m = 2000'de bile 0.13. Hedef terimi m kat küçük kalıyor."}
      - {name: "Sık hedef, log(m·q)", params: {V: 5000, m: 50, prop: 1, corr: 2, t: 1}, note: "Aynı hedef, log(m·q): yanlılık 0.026, m = 2000'de 0.015."}
      - {name: "Düzgün öneri", params: {V: 5000, m: 50, prop: 0, corr: 2, t: 30}, note: "Düzgün q ile yanlılık 0.17: önem ağırlıkları çok değişken, model olasılığı yüksek kelimeler nadiren çekiliyor."}
    questions:
      - q: "Öneri dağılımı neden model dağılımına yakın olmalı?"
        a: "Önem örneklemesinin varyansı, ağırlıkların (e^{z_s}/q_s) ne kadar dalgalandığına bağlıdır. q, model olasılığı yüksek kelimelere de yüksek olasılık verirse ağırlıklar dengelidir; düzgün q nadiren önemli kelimeleri çeker ve çektiğinde onlara dev ağırlık verir."
      - q: "Çıkarımda neden yine tam softmax gerekir?"
        a: "Çıkarımda doğru kelime bilinmez ve sözlüğün tamamı üzerinde bir dağılım (ya da en azından argmax) gerekir; örneklenmiş kayıp yalnız eğitim gradyanını ucuzlatır."
    limits: "Tek bir gizli durum ve sabit, rastgele bir çıktı matrisi; modelin logitleri Zipf benzeri bir önyargı + rastgele terim. Gerçek eğitimde W ve h birlikte değişir ve örnekler genellikle batch içinde paylaşılır."
  - id: l3
    lab: beamlab
    title: "Açgözlü, beam ve kesin arama: arama hatası ve kısa çıktı yanlılığı"
    goal: |
      Rastgele bigram dil modellerinde açgözlü çözümlemeyi, k genişlikli beam search'ü ve kesin aramayı (bigram modelde Viterbi ile) karşılaştır. Beam genişledikçe en olası diziyi kaçırma oranının nasıl düştüğünü, ama çıktıların nasıl kısaldığını ölç; uzunluk normalizasyonu α ile dengele.
    predict:
      q: "Beam genişliğini 5'ten 30'a çıkarınca (α = 0) ortalama çıktı uzunluğu ne olur?"
      options:
        - {t: "Uzar: daha çok aday daha iyi çeviri demektir", why: "Daha geniş arama, modelin skoruna göre daha iyi diziyi bulur; bu modeller kısa dizilere daha yüksek olasılık veriyor."}
        - {t: "Kısalır", ok: true, why: "Ölçülen: 4.37 → 1.85 token (EOS dahil); boş çıktı oranı %35 → %38. k = 30'da beam kesin optimumu buluyor ve modellerin %38'inde optimum boş dizi."}
        - {t: "Değişmez", why: "Arama genişledikçe sonuç modelin gerçek optimumuna yaklaşır; o da kısa."}
    presets:
      - {name: "Beam k = 5", params: {V: 12, sharp: 2, eos: 0, T: 15, k: 5, alpha: 0}, note: "Arama hatası %26.7, ortalama uzunluk 4.37, boş çıktı %35. Kesin optimum modellerin %38.3'ünde boş dizi."}
      - {name: "Açgözlü", params: {k: 1, alpha: 0}, note: "Açgözlü modellerin %78.3'ünde optimumu kaçırıyor; çıktılar uzun (10.5 token) ve ortalama log p −10.1 (kesin optimum −2.55)."}
      - {name: "Geniş beam", params: {k: 30, alpha: 0}, note: "k = 30: arama hatası 0, uzunluk 1.85, boş çıktı %38.3 (kesin optimumla aynı)."}
      - {name: "Uzunluk normalizasyonu", params: {k: 30, alpha: 0.7}, note: "α = 0.7: uzunluk 5.77, boş çıktı %11.7. Beam bu skorla da optimumu %11.7 oranında kaçırıyor."}
      - {name: "Seyrek EOS", params: {k: 5, alpha: 0, eos: -2}, note: "EOS logit'i −2: açgözlü ve beam uzun dizilere gidiyor (k = 5'te 11.4 token, arama hatası %73), ama kesin optimum yine modellerin %33'ünde boş dizi."}
    questions:
      - q: "k = 1 beam neden açgözlü çözümlemeyle aynıdır?"
        a: "Her adımda tek hipotez tutulur ve onun tüm uzantılarından en olası olanı seçilir; bu tam olarak açgözlü kuraldır."
      - q: "Kesin arama neden gerçek NMT modellerinde yapılamaz da burada yapılabiliyor?"
        a: "Bigram modelde bir sonraki token yalnız bir öncekine bağlıdır; aynı tokenda biten önekler arasından yalnız en iyisini tutmak yeterlidir (Viterbi, O(T·V²)). RNN ve Transformer'ın durumu tüm öneke bağlıdır, bu indirgeme yoktur; Stahlberg ve Byrne kesin aramayı dal-sınır budamasıyla ve çok pahalı biçimde yaptı."
    limits: "Bigram modeller rastgele: dil yapısı yok, yalnız olasılık profili. 'Arama hatası', beam'in aynı skor fonksiyonuyla kesin optimumdan düşük skor bulmasıdır. Son adımda (T) yalnız EOS'a izin veriliyor."
  - id: l4
    lab: alignattn
    title: "Dikkat skorlarıyla hizalama öğrenmek: nokta, genel, toplamsal, tek nöron"
    goal: |
      Kaynak tokenların bir permütasyonla hedefe kopyalandığı bir görevde küçük bir dikkat modelini tarayıcıda eğit. Kodlayıcı yalnız token + konum, kod çözücü yalnız adım bilgisi taşıyor: hangi kaynağın okunacağını bulmak tamamen dikkatin işi. Dört skor fonksiyonunu karşılaştır, öğrenilen α haritasını gör.
    predict:
      q: "Slayttaki tarifteki gibi 'tek nöronlu' skor e = a·s_t + b·h_i ile model özdeşlik hizalamasını (y_t = x_t) öğrenebilir mi?"
      options:
        - {t: "Evet: özdeşlik en kolay hizalama", why: "Özdeşlik de adım t'de t. konumu okumayı gerektirir; α'nın t'ye bağlı olması gerekir."}
        - {t: "Hayır: α her adımda aynı olur", ok: true, why: "a·s_t terimi softmax'ta sadeleşir. Ölçülen: α satırları arası std 0.000, doğruluk 0.34 (rastgele 0.10), hizalama doğruluğu 0.17 = 1/n."}
        - {t: "Ancak d büyükse", why: "Boyut, a·s_t'nin i'ye bağlı olmamasını değiştirmez."}
    presets:
      - {name: "Bahdanau, ters hizalama", params: {kind: 2, task: 1, n: 6, V: 10, d: 12, steps: 300, lr: 0.03}, note: "Token ve hizalama doğruluğu 1.00; α haritası ters köşegen."}
      - {name: "Tek nöron (tanh'sız)", params: {kind: 3, task: 1, n: 6, V: 10, d: 12, steps: 300, lr: 0.03}, note: "Doğruluk 0.34, hizalama 0.17, α satırları özdeş (std 0.000): her adım aynı karışımı okuyor."}
      - {name: "Nokta, rastgele permütasyon", params: {kind: 0, task: 4, n: 6, V: 10, d: 12, steps: 300, lr: 0.03}, note: "Parametresiz nokta skoru da rastgele bir permütasyonu tam öğreniyor (1.00): Q[t]·P[i] konumları eşleştiriyor."}
      - {name: "Dar nokta skoru", params: {kind: 0, task: 1, n: 6, V: 10, d: 4, steps: 300, lr: 0.03}, note: "d = 4 < n = 6: hizalama 0.97 ama token doğruluğu 0.84. Aynı 4 boyut hem token kimliğini hem konumu taşımak zorunda."}
      - {name: "Çok dar", params: {kind: 2, task: 1, n: 6, V: 10, d: 2, steps: 300, lr: 0.03}, note: "d = 2: doğruluk 0.27. İki boyut 10 tokenı ayırt etmeye yetmiyor, hizalama doğru olsa bile kopyalanan içerik kayboluyor."}
    questions:
      - q: "Toplamsal skorda tanh neden gerekli? W₁h + W₂s'yi doğrudan v ile çarpsak ne olur?"
        a: "vᵀ(W₁h + W₂s) = (W₁ᵀv)ᵀh + (W₂ᵀv)ᵀs: yine 'tek nöron' biçimine indirgenir; s'ye bağlı terim softmax'ta sadeleşir. Doğrusal olmayan katman, s ile h'nin çarpımsal etkileşimini sağlar."
      - q: "Nokta skoru parametresiz olduğu hâlde neden öğrenebiliyor?"
        a: "Skoru belirleyen vektörlerin kendisi (E, P, Q) öğreniliyor: model Q[t]'yi P[π(t)]'ye benzeyecek biçimde ayarlıyor. 'Genel' skordaki W, kodlayıcı ve kod çözücü uzayları farklıyken bu eşlemeyi ayrı bir matrise bırakır."
    limits: "Kodlayıcı bağlamsız (RNN yok), kod çözücü önceki tokenı görmüyor; görev saf hizalama + kopyalama. Batch 16, Adam, tam gradyan elle türetildi (sayısal türevle 1e−10 düzeyinde doğrulandı). Sonuçlar tohum 1 içindir."
