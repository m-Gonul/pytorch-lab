id: m0-1-dot
code: M0.1
title: Vektör, iç çarpım, norm
phase: 0
minutes: 120
prereq: []
summary: >
  Lineer cebirin atomu olan iç çarpımı ve ondan türeyen norm ile kosinüs
  benzerliğini 3 elemanlı vektörlerde elle, sonra döngüyle, NumPy'da bir
  benzerlik matrisi olarak, PyTorch'ta gradyanıyla ve en sonda binlerce çift için
  tek çağrıda hesaplıyorsun.
goals:
  - "$u\\cdot v=\\sum_i u_iv_i$, $\\lVert u\\rVert=\\sqrt{u\\cdot u}$ ve $\\cos\\theta=\\frac{u\\cdot v}{\\lVert u\\rVert\\lVert v\\rVert}$'yı elle hesaplayabilmek"
  - "Satır normalizasyonu + matris çarpımıyla tüm çiftlerin kosinüs benzerliğini döngüsüz bulmak"
  - "$\\partial\\cos\\theta/\\partial u$'yu türetip autograd ile doğrulamak"
  - "`einsum` indis notasyonunu (`\"nd,nd->n\"`, `\"nd,md->nm\"`) okuyup yazabilmek"
sources:
  - {title: "MIT 18.06 Linear Algebra (Strang)", url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", license: "CC BY-NC-SA 4.0", use: link}
  - {title: "3Blue1Brown — Dot products and duality", url: "https://www.3blue1brown.com/lessons/dot-products", license: "©", use: link}
  - {title: "Mathematics for Machine Learning, Bölüm 3 (Analytic Geometry)", url: "https://mml-book.github.io/", license: "© (PDF ücretsiz)", use: link}
  - {title: "Dive into Deep Learning §2.3.10 Dot Products", url: "https://d2l.ai/chapter_preliminaries/linear-algebra.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}

hand:
  groups:
    - title: "$u=[1,\\,2,\\,3]$, $v=[4,\\,-5,\\,6]$: eleman çarpımları ve iç çarpım"
      fields:
        - {id: p1, label: "$u_1v_1$", answer: 4, hint: "$1\\cdot4$"}
        - {id: p2, label: "$u_2v_2$", answer: -10, hint: "$2\\cdot(-5)$ — işarete dikkat"}
        - {id: p3, label: "$u_3v_3$", answer: 18, hint: "$3\\cdot6$"}
        - {id: dot, label: "$u\\cdot v$", answer: 12, hint: "üç çarpımın toplamı"}
    - title: "Normlar ve açı"
      fields:
        - {id: nu2, label: "$\\lVert u\\rVert^2 = u\\cdot u$", answer: 14, hint: "$1+4+9$"}
        - {id: nv2, label: "$\\lVert v\\rVert^2$", answer: 77, hint: "$16+25+36$"}
        - {id: nu, label: "$\\lVert u\\rVert$ (2 ondalık)", answer: 3.7417, tol: 0.006, hint: "$\\sqrt{14}$; $3.7^2=13.69$, $3.75^2=14.06$"}
        - {id: cos, label: "$\\cos\\theta$ (3 ondalık)", answer: 0.36549, tol: 0.0012, hint: "$12/\\sqrt{14\\cdot77}=12/\\sqrt{1078}$, $\\sqrt{1078}\\approx32.83$"}
        - {id: acute, label: "Açı dar mı? (dar: 1, geniş: 0)", answer: 1, hint: "$\\cos\\theta>0$ ise açı 90°'den küçüktür"}
  verify: |
    import math
    u = [1, 2, 3]; v = [4, -5, 6]
    d = sum(a * b for a, b in zip(u, v))
    answers = dict(p1=u[0]*v[0], p2=u[1]*v[1], p3=u[2]*v[2], dot=d,
                   nu2=sum(a*a for a in u), nv2=sum(b*b for b in v),
                   nu=round(math.sqrt(14), 4), cos=round(d / math.sqrt(14 * 77), 5), acute=int(d > 0))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Kosinüs benzerliği neden embedding'leri karşılaştırmada iç çarpımdan daha sık kullanılır?"
    options:
      - {t: "Vektörlerin uzunluğundan bağımsızdır; yalnız yönü ölçer", ok: true, why: "$\\cos\\theta$ her iki vektörü birim uzunluğa ölçekler. Sık geçen kelimelerin büyük normlu embedding'leri ham iç çarpımı şişirir."}
      - {t: "Hesaplaması daha ucuzdur", why: "Tersine: iç çarpıma ek olarak iki norm ve bir bölme gerekir."}
      - {t: "Her zaman pozitiftir", why: "$[-1,1]$ aralığındadır; zıt yönlü vektörlerde negatiftir."}
  - q: "`torch.einsum(\"nd,md->nm\", X, Y)` neyi hesaplar?"
    options:
      - {t: "`X @ Y.T` — her X satırının her Y satırıyla iç çarpımı", ok: true, why: "`d` iki girdide var, çıktıda yok → toplanır. `n` ve `m` çıktıda kalır."}
      - {t: "Eleman eleman çarpım", why: "O `\"nd,nd->nd\"` olurdu; burada `d` çıktıda yok."}
      - {t: "`X.T @ Y`", why: "Bu `(d, d)` shape'inde bir sonuç verirdi; çıktı indisleri `nm`."}
  - q: "$f(u)=u\\cdot v$ ise $\\nabla_u f$ nedir?"
    options:
      - {t: "$v$", ok: true, why: "$\\partial(\\sum_i u_iv_i)/\\partial u_j = v_j$. Lineer bir fonksiyonun gradyanı katsayı vektörüdür."}
      - {t: "$u$", why: "O $\\tfrac12\\lVert u\\rVert^2$'nin gradyanı olurdu."}
      - {t: "$u\\cdot v$ (bir skaler)", why: "Bir skaler fonksiyonun $u$'ya göre gradyanı $u$ ile aynı shape'te bir vektördür."}

homework:
  - title: "Goldberg (1991): kayan nokta aritmetiği"
    paper: "Goldberg — What Every Computer Scientist Should Know About Floating-Point Arithmetic (ACM Computing Surveys 1991)"
    url: "https://dl.acm.org/doi/10.1145/103162.103163"
    level: başlangıç
    hours: 5
    goal: |
      Makalenin toplama hatası analizini (Bölüm 4.2) iç çarpım üzerinde dene: naif toplam, ikili (pairwise) toplam ve Kahan telafili toplamı yaz; 10³–10⁷ uzunluklu, işaretleri karışık ve büyüklükleri 10 mertebe yayılan vektörlerde float32/float64 sonucu, kesin (fractions.Fraction ya da math.fsum) değere göre göreli hata ile karşılaştır. Hatanın n ile büyüme hızını (naif O(nε), ikili O(ε log n), Kahan O(ε)) log-log grafikte göster; NumPy'ın np.dot ve np.sum'ının hangi stratejiyi kullandığını deneyle çıkar.
    steps:
      - "Koşul sayısı Σ|xᵢyᵢ| / |Σxᵢyᵢ| büyük örnekler üret: hata bu sayıyla orantılı."
    accept:
      - "Üç yöntemin hata büyüme hızları kuramla uyumlu."
      - "np.dot / np.sum davranışı için deneysel gerekçe."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Cauchy–Schwarz ve kosinüsün [−1, 1]'de kalması
    goal: Kosinüs benzerliğinin neden iyi tanımlı olduğunu kanıtlamak
    needs: İç çarpım, ikinci dereceden polinom
    q: |-
      $|a\cdot b|\le\|a\|\,\|b\|$'yi kanıtla ve bunun $\cos\theta=\frac{a\cdot b}{\|a\|\|b\|}$ için ne anlama geldiğini söyle.
    solution: |-
      **Kanıt:** $b\ne0$ olsun (aksi hâlde iki taraf 0). Her gerçel $t$ için $\|a-tb\|^2\ge0$: $p(t)=\|b\|^2t^2-2(a\cdot b)t+\|a\|^2\ge0$. Hiç negatif olmayan ikinci dereceden polinomun diskriminantı ≤ 0: $4(a\cdot b)^2-4\|a\|^2\|b\|^2\le0$ ⇒ iddia. **Eşitlik** ancak $a=tb$ (bir $t$ için $p(t)=0$), yani vektörler paralelken.

      **Sonuç:** kosinüs her zaman $[-1,1]$'dedir ve ±1 yalnız aynı/zıt yönde vektörlerde. **Varsayım:** sıfırdan farklı vektörler; sıfır vektörünün kosinüsü tanımsız (pratikte paydaya küçük ε eklenir).
  - id: p2
    type: hesap
    level: 1
    title: Kosinüs benzerliği
    goal: Kosinüsü hesaplamak
    needs: P1
    q: |-
      $a=(1,2,3)$, $b=(4,-5,6)$. $\cos\theta$?
    answer: 0.3654869423239036
    calc: "12/(math.sqrt(14)*math.sqrt(77))"
    tol: 1e-3
    mistakes:
      - {answer: 12.0, msg: "Bu iç çarpım; normların çarpımına böl."}
      - {answer: 0.011131725417439703, msg: "Normlar karekök: ‖a‖ = √14, ‖b‖ = √77."}
    hints:
      - "$a\\cdot b=4-10+18$."
    solution: |-
      $a\cdot b=12$, $\|a\|=\sqrt{14}$, $\|b\|=\sqrt{77}$ → $12/32.83=0.366$ (≈ 68.5°).
  - id: p3
    type: hesap
    level: 1
    title: İç çarpımın gradyanı
    goal: $\nabla_a(a\cdot b)=b$'yi uygulamak
    needs: Kısmi türev
    q: |-
      $f(a)=a\cdot b$, $b=(4,-5,6)$. $\partial f/\partial a_2$?
    answer: -5.0
    calc: "-5"
    mistakes:
      - {answer: 2.0, msg: "Gradyan a'ya değil b'ye eşittir: ∂(Σaᵢbᵢ)/∂a₂ = b₂."}
    hints:
      - "$f=a_1b_1+a_2b_2+a_3b_3$."
    solution: |-
      $b_2=-5$. Doğrusal katmanda $\partial(w\cdot x)/\partial w=x$: ağırlığın gradyanı girdidir (M3.2).
  - id: p4
    type: yorumla
    level: 2
    title: Yüksek boyutta rastgele vektörler
    goal: Boyutla kosinüs dağılımının daralmasını yorumlamak
    needs: Bağımsız rastgele değişkenler
    q: |-
      Bağımsız N(0, I) vektörler arasındaki kosinüs, $d=3$'te geniş bir dağılım gösterirken $d=1000$'de hemen hep 0 civarında (±0.06). Neden ve ne anlama gelir?
    choices:
      - {t: "Yüksek boyutta vektörler daha kısa olur", why: "Normlar √d ile büyür."}
      - {t: "a·b'nin std'si √d, normların çarpımı ≈ d: kosinüs std'si ≈ 1/√d. Rastgele yönler neredeyse diktir; anlamlı benzerlik 0'dan belirgin sapmadır", ok: true, why: "Ölçüm yoğunlaşması."}
      - {t: "Sayısal hata", why: "Gerçek bir olasılık sonucu."}
    hints:
      - "$\\mathrm{Var}(a\\cdot b)=d$."
    solution: |-
      $\cos\approx\frac{\mathcal N(0,d)}{d}$ → std $1/\sqrt d=0.032$ ($d=1000$). Yüksek boyutta birbirine neredeyse dik çok sayıda yön sığar; gömme uzaylarında 0.2'lik bir kosinüs bile anlamlı olabilir. Attention'daki √d ölçeği (M4.6) aynı hesaptan gelir.
  - id: p5
    type: karşı-örnek
    level: 3
    title: Kosinüs uzaklığı bir metrik midir?
    goal: Benzerlikten uzaklığa geçişin koşullarını sınamak
    needs: Metrik aksiyomları
    q: |-
      $d(a,b)=1-\cos(a,b)$ bir metrik mi? Aksiyomları sına, bozulan için karşı örnek ver; metrik olan bir alternatif öner.
    rubric:
      - "Aynı yönlü farklı uzunluklu vektörlerde d = 0 ama a ≠ b (özdeşlik aksiyomu bozuk) dedim"
      - "Üçgen eşitsizliğinin bozulduğu bir örnek verdim (ör. 0°, 45°, 90° yönlü birim vektörler)"
      - "Açısal uzaklık θ = arccos(cos) ya da birim vektörlerde Öklid uzaklığını √(2 − 2cos) metrik olarak önerdim"
    hints:
      - "$a=e_1$, $b=(e_1+e_2)/\\sqrt2$, $c=e_2$ için $d(a,c)$ ile $d(a,b)+d(b,c)$'yi karşılaştır."
    solution: |-
      $d(a,c)=1$; $d(a,b)=d(b,c)=1-\frac1{\sqrt2}=0.293$ → toplam 0.586 < 1: üçgen eşitsizliği bozuk. Ayrıca $d(a,2a)=0$. Açı $\theta=\arccos\cos$ birim küre üzerinde gerçek bir metriktir; normalize vektörlerde Öklid uzaklığı $\sqrt{2-2\cos}$ da öyle (ve aynı sıralamayı verir). Metrik özellik, ağaç tabanlı indeksler ve bazı ANN yöntemleri için önemlidir.
pitfalls:
  - wrong: "İç çarpım büyükse vektörler benzerdir."
    right: "İç çarpım normlara da bağlıdır; benzerlik için kosinüs (normalize edilmiş iç çarpım) kullanılır."
  - wrong: "Sıfır vektörünün kosinüsü 0'dır."
    right: "Tanımsızdır (0/0); uygulamalarda ε eklenir ve bu bir uzlaşmadır."
whatif:
  - q: "Vektörler önce ortalamaları çıkarılarak merkezlenirse kosinüs neye dönüşür?"
    a: "Pearson korelasyon katsayısına."

labs:
  - id: l1
    lab: dotdrag
    title: "İki vektörü sürükle: iç çarpım, açı, izdüşüm"
    goal: |
      Mavi ($a$) ve turuncu ($b$) okların uçlarını sürükle (ya da uca odaklanıp ok tuşlarını kullan). Tablo iç çarpımı iki yoldan hesaplar: bileşenlerden ($a_1b_1+a_2b_2$) ve uzunluk–açıdan ($\|a\|\|b\|\cos\theta$). "Tam sayılara yapıştır" ile el hesabı alıştırmalarını burada kontrol edebilirsin.
    predict:
      q: "$b$'yi sabit tutup $a$'yı $b$'nin etrafında bir tur döndürsen $a\\cdot b$ en büyük ve en küçük değerini nerede alır?"
      options:
        - {t: "En büyük $a$ $b$ ile aynı yöndeyken, en küçük zıt yöndeyken; dikken 0", ok: true, why: "‖a‖ ve ‖b‖ sabitken a·b yalnız cos θ ile değişir: +1, 0, −1."}
        - {t: "En büyük dikken", why: "Dik vektörlerin iç çarpımı 0'dır."}
        - {t: "Döndürmek iç çarpımı değiştirmez", why: "Uzunluklar değişmez ama açı değişir."}
    presets:
      - {name: "Dik", params: {ax: 3, ay: 1, bx: -1, by: 3, mode: 0}, note: "a·b = −3 + 3 = 0: izdüşüm sıfır, açı 90°."}
      - {name: "Zıt yön", params: {ax: 2, ay: 2, bx: -3, by: -3, mode: 0}, note: "cos θ = −1: Cauchy–Schwarz'ın eşitlik durumu (paralel vektörler)."}
      - {name: "Alıştırmadaki gibi", params: {ax: 1, ay: 2, bx: 4, by: -5, mode: 0, snap: true}, note: "a = (1, 2), b = (4, −5): a·b = 4 − 10 = −6, açı 90°'den büyük."}
      - {name: "İşaret bölgeleri", params: {ax: 2, ay: -1, bx: 1, by: 2, mode: 1}, note: "b, kesikli doğruya diktir; a gölgeli taraftaysa a·b > 0. Doğrusal sınıflandırıcının karar sınırı tam olarak budur (Şekil 5)."}
      - {name: "Birim vektörler", params: {mode: 2}, note: "İki vektör de birim çembere izdüşürülür: a·b doğrudan cos θ olur — kosinüs benzerliği."}
    questions:
      - q: "Yalnız $a$'yı 2 katına uzatırsan $a\\cdot b$, $\\cos\\theta$ ve izdüşüm nasıl değişir?"
        a: "$a\\cdot b$ ve skaler izdüşüm 2 katına çıkar (doğrusallık); $\\cos\\theta$ değişmez (yalnız yöne bakar)."
      - q: "İzdüşüm görünümünde artık (kesikli çizgi) neden her zaman $b$'ye dik?"
        a: "$r=a-\\frac{a\\cdot b}{b\\cdot b}b$ için $r\\cdot b=0$ (İzdüşüm bölümündeki türetim)."
      - q: "$b$'yi sıfır vektörüne sürüklersen ne olur?"
        a: "Açı ve izdüşüm tanımsızdır (sıfıra bölme); tablo bunu açıkça yazar. Kodda $\\varepsilon$ eklemenin nedeni."
    limits: "2B; yüksek boyutta aynı formüller geçerli ama görselleştirilemez — oradaki davranış için son deneye bak."
  - id: l2
    lab: normball
    title: "Lp normları: birim top nasıl değişir?"
    goal: "$p$'yi değiştir ve $\\|x\\|_p=1$ eğrisini izle; bir $v$ noktasının L1, L2, L∞ ve Lp normlarını karşılaştır."
    predict:
      q: "$v=(1,\\ 0.6)$ için hangisi en büyük: $\\|v\\|_1$, $\\|v\\|_2$, $\\|v\\|_\\infty$?"
      options:
        - {t: "$\\|v\\|_1=1.6$", ok: true, why: "‖v‖∞ ≤ ‖v‖₂ ≤ ‖v‖₁ her zaman: 1 ≤ 1.166 ≤ 1.6."}
        - {t: "$\\|v\\|_2$", why: "L2, L1 ile L∞ arasında kalır."}
        - {t: "$\\|v\\|_\\infty$", why: "L∞ en küçüğüdür: yalnız en büyük bileşen."}
    presets:
      - {name: "Elmas (L1)", params: {p: 1}, note: "Köşeler eksenlerde: L1 cezası optimumu eksen üzerine (bir bileşen 0) çekmeye eğilimlidir."}
      - {name: "Neredeyse kare", params: {p: 20}, note: "p büyüdükçe L∞'a yaklaşır."}
      - {name: "Norm olmayan", params: {p: 0.5}, note: "Birim 'top' içbükey yıldız: üçgen eşitsizliği bozulur."}
    questions:
      - q: "Neden her zaman $\\|v\\|_\\infty\\le\\|v\\|_2\\le\\|v\\|_1$?"
        a: "En büyük bileşenin karesi tüm karelerin toplamından büyük olamaz ($\\max|v_i|\\le\\|v\\|_2$); $(\\sum|v_i|)^2=\\sum v_i^2+2\\sum_{i<j}|v_i||v_j|\\ge\\sum v_i^2$."
    limits: "2B. d boyutta da sıralama aynıdır; ayrıca ‖v‖₁ ≤ √d·‖v‖₂ ≤ d·‖v‖∞."
  - id: l3
    lab: highdimcos
    title: "Yüksek boyutta rastgele vektörler neden neredeyse diktir?"
    goal: "Boyutu artır ve 1500 rastgele çiftin kosinüs histogramının 0 çevresinde nasıl daraldığını gör; teorik std $1/\\sqrt d$ ile karşılaştır."
    predict:
      q: "$d=1000$'de rastgele iki N(0, I) vektörün kosinüsü tipik olarak hangi aralıktadır?"
      options:
        - {t: "−1 ile 1 arasında düzgün", why: "Bu ancak d = 2 civarında yaklaşık doğrudur."}
        - {t: "±0.06 civarı (std ≈ 1/√1000 ≈ 0.032)", ok: true, why: "Ölçünün yoğunlaşması."}
        - {t: "Hep 1'e yakın", why: "Bağımsız yönler hizalanmaz."}
    presets:
      - {name: "d = 2", params: {d: 2}, note: "Düzlemde rastgele açı: kosinüs dağılımı uçlarda yoğun (arcsin dağılımı)."}
      - {name: "d = 1000", params: {d: 1000}, note: "Neredeyse hepsi dik."}
      - {name: "Pozitif bileşenler", params: {d: 500, dist: 1}, note: "Hepsi pozitif bileşenli vektörler 0.75 civarına yığılır: merkezlemeden benzerlik ölçmenin tuzağı."}
    limits: "Bağımsız bileşenli rastgele vektörler; gerçek gömmeler ilişkili ve düşük içsel boyutludur."
