id: m3-2-mlp-backprop
code: M3.2
title: MLP ve matris formunda backprop
phase: 3
minutes: 240
prereq: [m3-1-micrograd, m1-5-softmax]
summary: >
  İlk gerçek sinir ağı. 2-2-1'lik bir ağda ileri ve geri geçişi elle yapıyor,
  saf Python'da katman katman forward/backward fonksiyonları yazıyor,
  NumPy'da CS231n tarzı modüler katmanlarla spiral veriyi ayıran iki katmanlı
  bir ağ eğitiyor, PyTorch'ta gradyanlarını autograd ile doğruluyor ve en
  sonda `torch.func` ile 16 ağı tek ileri geçişte (model ensembling) koşturuyorsun.
goals:
  - "Lineer katmanın geri geçişini $dX=dY\\,W^\\top$, $dW=X^\\top dY$, $db=\\mathbf1^\\top dY$ olarak türetmek"
  - "ReLU geri geçişini bir maske olarak uygulamak"
  - "Modüler forward/backward (cache) tasarımını kurmak"
  - "`stack_module_state` + `vmap(functional_call)` ile çok sayıda modeli tek çağrıda çalıştırmak"
sources:
  - {title: "CS231n — Neural Networks Part 1: Setting up the Architecture", url: "https://cs231n.github.io/neural-networks-1/", license: "MIT", use: adapt}
  - {title: "CS231n Assignment 2 — Fully-connected nets (affine_forward/backward)", url: "https://cs231n.github.io/assignments2025/assignment2/", license: "MIT", use: adapt}
  - {title: "Prince — Understanding Deep Learning, Bölüm 7 (Gradients and initialization)", url: "https://udlbook.github.io/udlbook/", license: "CC BY-NC-ND", use: link}
  - {title: "PyTorch Tutorials — Model ensembling (torch.func)", url: "https://docs.pytorch.org/tutorials/intermediate/ensembling.html", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "Ağ: $z=W_1x$, $h=\\text{ReLU}(z)$, $\\hat y=w_2\\cdot h$, $L=\\tfrac12(\\hat y-y)^2$. $x=(1,2)$, $W_1=\\begin{bmatrix}1&2\\\\-1&1\\end{bmatrix}$, $w_2=(1,-2)$, $y=1$, bias yok"
      fields:
        - {id: z1, label: "$z_1$", answer: 5, hint: "$1\\cdot1+2\\cdot2$"}
        - {id: z2, label: "$z_2$", answer: 1, hint: "$-1\\cdot1+1\\cdot2$"}
        - {id: yhat, label: "$\\hat y$", answer: 3, hint: "$h=(5,1)$; $5-2$"}
        - {id: L, label: "$L$", answer: 2, hint: "$\\tfrac12(3-1)^2$"}
    - title: "Geri geçiş, $\\partial L/\\partial\\hat y=\\hat y-y=2$"
      fields:
        - {id: dw21, label: "$\\partial L/\\partial w_{2,1}$", answer: 10, hint: "$2\\cdot h_1$"}
        - {id: dh2, label: "$\\partial L/\\partial h_2$", answer: -4, hint: "$2\\cdot w_{2,2}$"}
        - {id: dW11, label: "$\\partial L/\\partial W_{1,11}$", answer: 2, hint: "$dz=dh\\odot[z>0]=(2,-4)$; $dW_1=dz\\,x^\\top$"}
        - {id: dW22, label: "$\\partial L/\\partial W_{1,22}$", answer: -8, hint: "$-4\\cdot x_2$"}
        - {id: dx1, label: "$\\partial L/\\partial x_1$", answer: 6, hint: "$W_1^\\top dz$: $1\\cdot2+(-1)(-4)$"}
  verify: |
    x = [1, 2]; W1 = [[1, 2], [-1, 1]]; w2 = [1, -2]; y = 1
    z = [sum(W1[i][j] * x[j] for j in range(2)) for i in range(2)]
    h = [max(0, v) for v in z]
    yh = sum(a * b for a, b in zip(w2, h))
    dy = yh - y
    dh = [dy * w for w in w2]
    dz = [g if v > 0 else 0 for g, v in zip(dh, z)]
    answers = dict(z1=z[0], z2=z[1], yhat=yh, L=0.5 * dy ** 2, dw21=dy * h[0], dh2=dh[1],
                   dW11=dz[0] * x[0], dW22=dz[1] * x[1], dx1=sum(W1[i][0] * dz[i] for i in range(2)))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Lineer katmanın ağırlık gradyanı neden $dW=X^\\top dY$ ve shape'i neden $W$ ile aynı?"
    options:
      - {t: "$Y=XW$'de $W_{jk}$, her örnekte $Y_{ik}$'ye $X_{ij}$ katsayısıyla girer; örnekler üzerinden toplanınca $\\sum_iX_{ij}dY_{ik}=(X^\\top dY)_{jk}$", ok: true, why: "Shape kuralı en hızlı kontrol: $(D\\times N)(N\\times M)=(D\\times M)$, yani $W$'nin shape'i. M0.2'deki formülün batch hâli."}
      - {t: "Yalnız tek örnek için doğrudur", why: "Batch toplamını matris çarpımı otomatik yapar."}
      - {t: "$dW=dY\\,X^\\top$", why: "Shape tutmaz: $(N\\times M)(D\\times N)$ çarpılamaz."}
  - q: "Tüm ağırlıkları sıfırla başlatmak neden çalışmaz?"
    options:
      - {t: "Simetri: aynı katmandaki tüm nöronlar aynı çıktıyı ve aynı gradyanı alır, eğitim boyunca aynı kalır", ok: true, why: "Rastgele başlatma simetriyi kırar. Ölçeğin nasıl seçileceği M3.5'in konusu."}
      - {t: "Gradyan tanımsız olur", why: "Tanımlı; sorun hepsinin eşit olması."}
      - {t: "Çalışır, yalnız yavaştır", why: "Gizli katman tek bir nörona eşdeğer kalır."}
  - q: "`vmap(functional_call)` ile ensemble çalıştırmanın döngüye göre kazancı nereden gelir?"
    options:
      - {t: "E modelin ağırlıkları bir batch boyutuna dizilir; her katman E ayrı küçük matmul yerine tek bir batched matmul olur", ok: true, why: "Kernel çağrı sayısı E kat azalır. Küçük modellerde maliyetin çoğu çağrı başına sabit maliyettir (M0.2'deki ders)."}
      - {t: "Modeller ağırlık paylaşır", why: "Paylaşmaz; her biri kendi parametrelerini taşır."}
      - {t: "Gradyan hesaplamaz", why: "Kazanç ileri geçişte de var; vmap autograd ile de birleşir."}

extras:
  - {id: x1, title: "Dört geri yayılım denklemi (BP1–BP4) ve yavaş öğrenme", engine: browser}
  - {id: x2, title: "Sigmoid vs tanh: sıfır merkezlilik ve doyma (ders alıştırması 2)", engine: browser}
  - {id: x3, title: "MSE vs çapraz entropi: doymuş çıkışta öğrenme yavaşlaması", engine: browser}

homework:
  - title: "Rumelhart, Hinton, Williams (1986): geri yayılımın orijinal deneyleri"
    paper: "Rumelhart, Hinton, Williams — Learning representations by back-propagating errors (Nature 1986)"
    url: "https://www.nature.com/articles/323533a0"
    level: başlangıç
    hours: 6
    goal: |
      Makalenin iki deneyini c aşamasındaki NumPy ağınla tekrarla: (1) simetri tespiti — 6 girdili, 2 gizli nöronlu ağın, girdi vektörünün ayna simetrik olup olmadığını öğrenmesi ve öğrenilen ağırlıkların makaledeki Şekil 1'deki gibi "ayna" desenini (eşit büyüklük, zıt işaret, 1:2:4 oranları) alması; (2) 8-3-8 kodlayıcı — gizli katmanın 3 bitlik ikili kod keşfetmesi. Momentum (makale Denk. 9, α = 0.9) ile ve onsuz yakınsama sürelerini karşılaştır.
    steps:
      - "Ağırlıkları küçük rastgele değerlerle başlat; simetri kırma gerekliliğini sıfır başlatmayla göster."
    accept:
      - "Simetri ağında gizli ağırlık oranları ≈ 1:2:4 ve aynalı işaretler."
      - "8-3-8'de gizli aktivasyonlar 8 farklı köşeye (ikili kod) yakınsar."
  - title: "Nielsen (2015), Bölüm 2: geri yayılımın matris biçimi ve hız"
    paper: "Nielsen — Neural Networks and Deep Learning, Ch. 2 'How the backpropagation algorithm works'"
    url: "http://neuralnetworksanddeeplearning.com/chap2.html"
    level: başlangıç
    hours: 4
    goal: |
      x1'deki tek örnekli BP1–BP4'ü mini-batch matris biçimine çevir (tüm batch tek matris çarpımlarıyla) ve bölümün sonundaki "neden hızlı" argümanını ölç: parametre sayısı P olan ağda sonlu farklarla gradyan (P + 1 ileri geçiş) ile geri yayılımın (≈ 2 ileri geçiş) süresini P = 10²…10⁵ için karşılaştır.
    steps:
      - "Sonlu farkın doğruluğunu h ∈ {10⁻², 10⁻⁴, 10⁻⁶, 10⁻⁸} için çiz: kesme ve yuvarlama hatası dengesi."
    accept:
      - "Matris biçimi, döngülü sürümle aynı gradyanı verir."
      - "Süre oranı P ile doğrusal büyür."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: İki katmanlı ağda geri yayılım, sayılarla
    goal: BP1–BP4'ü tek bir örnekte uygulamak
    needs: Zincir kuralı (M0.3)
    q: |-
      $x=1$, $z_1=w_1x+b_1$ ($w_1=2$, $b_1=0$), $h=\mathrm{ReLU}(z_1)$, $\hat y=w_2h+b_2$ ($w_2=-1.5$, $b_2=0$), $L=\frac12(\hat y-y)^2$, $y=1$. Tüm gradyanları bul.
    solution: |-
      **İleri:** $z_1=2$, $h=2$, $\hat y=-3$, $L=\frac12(-4)^2=8$.

      **Çıkış hatası (BP1):** $\delta_2=\partial L/\partial\hat y=\hat y-y=-4$.

      **Çıkış katmanı parametreleri (BP3, BP4):** $\partial L/\partial w_2=\delta_2\,h=-8$, $\partial L/\partial b_2=\delta_2=-4$.

      **Gizli katmana yayılım (BP2):** $\delta_1=(w_2\,\delta_2)\odot\mathrm{ReLU}'(z_1)=(-1.5)(-4)(1)=6$.

      **Gizli katman parametreleri:** $\partial L/\partial w_1=\delta_1x=6$, $\partial L/\partial b_1=\delta_1=6$.

      **Kontrol (sayısal fark):** $w_1\to2.001$: $\hat y=-3.0015$, $L=8.006$ → eğim ≈ 6 ✓. **Gözlem:** bias gradyanı her katmanda o katmanın $\delta$'sının kendisidir; ağırlık gradyanı $\delta$ ile girdinin dış çarpımı (ders alıştırması 2'nin sorusu).
  - id: p2
    type: hesap
    level: 1
    title: Gizli birim ölüyse
    goal: ReLU türevinin geri yayılıma etkisini görmek
    needs: P1
    q: |-
      P1'de yalnız $b_1=-3$ olsun (diğer her şey aynı). $\partial L/\partial w_1$ kaç?
    answer: 0.0
    calc: "0"
    mistakes:
      - {answer: 6.0, msg: "z₁ = 2 − 3 = −1 < 0: ReLU'nun türevi 0, gradyan gizli katmana geçmez."}
    hints:
      - "Önce $z_1$'i hesapla."
    solution: |-
      $z_1=-1$, $h=0$, $\mathrm{ReLU}'(z_1)=0$ ⇒ $\delta_1=0$ ⇒ $\partial L/\partial w_1=0$. Bu birim, girdilerin hepsinde negatif kalırsa hiç güncellenmez: "ölü ReLU" (M3.5 ek alıştırması).
  - id: p3
    type: hesap
    level: 1
    title: Çıkış ağırlığının gradyanı, başka bir hedefle
    goal: BP4'ü uygulamak
    needs: P1
    q: |-
      P1'deki ağ ve aynı ileri geçiş ($\hat y=-3$, $h=2$), ama hedef $y=-2$. $\partial L/\partial w_2$ kaç?
    answer: -2.0
    calc: "(-3-(-2))*2"
    mistakes:
      - {answer: -1.0, msg: "Bu δ₂ (bias gradyanı); ağırlık için h = 2 ile çarp."}
      - {answer: 2.0, msg: "İşaret: δ₂ = ŷ − y = −3 − (−2) = −1."}
    hints:
      - "$\\delta_2=\\hat y-y$, sonra $\\delta_2h$."
    solution: |-
      $\delta_2=-3-(-2)=-1$, $\partial L/\partial w_2=-1\cdot2=-2$.
  - id: p4
    type: kod
    level: 2
    title: Shape'ler uyuşmuyor
    goal: Batch'li geri yayılımda boyutları akıl yürütmek
    needs: Matris çarpımı (M0.2)
    q: |-
      $X$ (B, d), $W_1$ (d, h), $H=\mathrm{relu}(XW_1)$ (B, h), $\hat Y=HW_2$ (B, k). `dY` (B, k) verildi. Hangisi $\partial L/\partial W_1$'dir?
    choices:
      - {t: "`X.T @ ((dY @ W2.T) * (H > 0))`", ok: true, why: "(d, B) @ (B, h) = (d, h) ✓; maske ReLU türevi."}
      - {t: "`((dY @ W2.T) * (H > 0)) @ X.T`", why: "(B, h) @ (d, B) çarpılamaz."}
      - {t: "`X.T @ (dY @ W2.T)`", why: "Shape doğru ama ReLU türevi (maske) unutulmuş."}
    hints:
      - "Her gradyan, türev alınan tensörle aynı shape'te olmalı."
    solution: |-
      $dH=dY\,W_2^\top$ (B, h); $dZ_1=dH\odot\mathbb 1[Z_1>0]$; $dW_1=X^\top dZ_1$ (d, h). Kural: "shape'i tutturan tek çarpım genelde doğrudur" — ama maske gibi eleman eleman çarpanlar shape'i değiştirmediği için unutulur; P4'teki 3. seçenek sessiz bir hatadır, gradyan kontrolü yakalar.
  - id: p5
    type: açıkla
    level: 2
    title: Geri yayılım neden ucuz?
    goal: Ters mod türevin maliyetini açıklamak
    needs: Hesap grafiği
    q: |-
      Milyonlarca parametreli bir ağın tüm gradyanının yaklaşık bir ileri geçiş maliyetinde (sabit bir katı) hesaplanabilmesinin nedenini, sonlu farkla karşılaştırarak açıkla.
    rubric:
      - "Sonlu farkın her parametre için ayrı ileri geçiş (P geçiş) gerektirdiğini söyledim"
      - "Ters modun skaler çıkıştan geriye bir kez gidip ara türevleri (δ'ları) paylaştığını açıkladım"
      - "Bedelin bellek olduğunu (ileri aktivasyonlar saklanır) ekledim"
      - "İleri modun girdi başına, ters modun çıktı başına ucuz olduğunu (Jacobian satırı vs sütunu) belirttim"
    hints:
      - "δ'lar kaç parametre tarafından ortak kullanılıyor?"
    solution: |-
      Sonlu fark: $P$ parametre için $P+1$ ileri geçiş. Ters mod: tek ileri geçiş (ara değerler saklanır) + tek geri geçiş; her düğüm yerel türevini bir kez uygular ve $\delta$'lar o düğümün altındaki tüm parametrelerce paylaşılır. Geri geçiş ileri geçişin ~2 katı iş yapar (her matmul için iki matmul: $dW$ ve $dX$). Bedel: aktivasyon belleği — M6.4'teki gradyan checkpointing bunu hesapla takas eder. Skaler kayıp (tek çıktı) için ters mod idealdir; çok çıktılı/az girdili fonksiyonlarda ileri mod (JVP) daha ucuzdur.
  - id: p6
    type: kanıt
    level: 3
    title: BP2'yi genel katmanda türet
    goal: Matris biçimli geri yayılım denklemini kanıtlamak
    needs: P1, Hadamard çarpımı ⊙
    q: |-
      $z^{l+1}=W^{l+1}a^l+b^{l+1}$, $a^l=\sigma(z^l)$, $\delta^l:=\partial L/\partial z^l$. $\delta^l=\big((W^{l+1})^\top\delta^{l+1}\big)\odot\sigma'(z^l)$ olduğunu indis düzeyinde kanıtla.
    rubric:
      - "$z^l_j$'nin $L$'yi yalnız $z^{l+1}_k$'lar üzerinden etkilediğini (çok değişkenli zincir kuralı) yazdım"
      - "$\\partial z^{l+1}_k/\\partial z^l_j=W^{l+1}_{kj}\\sigma'(z^l_j)$ türettim"
      - "$k$ üzerinden toplamı matris–vektör çarpımı olarak tanıdım"
      - "σ'nın eleman eleman olmasının ⊙'yu (köşegen Jacobian) verdiğini açıkladım"
    hints:
      - "$\\delta^l_j=\\sum_k\\frac{\\partial L}{\\partial z^{l+1}_k}\\frac{\\partial z^{l+1}_k}{\\partial z^l_j}$."
    solution: |-
      $\delta^l_j=\sum_k\delta^{l+1}_k\frac{\partial z^{l+1}_k}{\partial z^l_j}$. $z^{l+1}_k=\sum_iW^{l+1}_{ki}\sigma(z^l_i)+b_k$ ⇒ $\frac{\partial z^{l+1}_k}{\partial z^l_j}=W^{l+1}_{kj}\sigma'(z^l_j)$ (yalnız $i=j$ terimi). Yerine: $\delta^l_j=\sigma'(z^l_j)\sum_kW^{l+1}_{kj}\delta^{l+1}_k=\sigma'(z^l_j)\,[(W^{l+1})^\top\delta^{l+1}]_j$. Aktivasyon eleman eleman olmasaydı (ör. softmax) $\sigma'$ köşegen olmaz, ⊙ yerine tam Jacobian çarpımı gerekirdi.
pitfalls:
  - wrong: "Geri yayılım bir öğrenme algoritmasıdır."
    right: "Geri yayılım yalnız gradyanı **hesaplama** yöntemidir; öğrenmeyi optimizasyon algoritması (SGD, Adam) yapar."
  - wrong: "Tüm ağırlıkları sıfırla başlatmak güvenlidir."
    right: "Simetri bozulmaz: aynı katmandaki tüm birimler aynı gradyanı alır, hep eşit kalır (M3.5)."
  - wrong: "Gradyanı doğru türettiysem kontrol etmeye gerek yok."
    right: "Shape'i doğru ama maskesi/işareti yanlış gradyanlar sessizce yanlış öğrenir; merkezi farkla gradyan kontrolü ucuz bir sigortadır."
whatif:
  - q: "Aktivasyon ReLU yerine doğrusal olsaydı derin ağ ne olurdu?"
    a: "Katmanların bileşimi tek bir doğrusal dönüşümdür ($W_2W_1$): derinlik ifade gücü kazandırmaz (ama optimizasyon dinamiği yine ilginçtir)."
  - q: "Kayıp ortalama yerine toplam olsaydı?"
    a: "Tüm gradyanlar B kat büyür; aynı davranış için öğrenme oranı B'ye bölünmelidir. Batch boyu değişince ortalama kayıp daha kararlıdır."

labs:
  - id: l1
    lab: slowlearn
    title: "Doymuş çıkış: kuadratik maliyet mi, çapraz entropi mi?"
    goal: |
      Tek bir sigmoid nöron, girdi x = 1, hedef y = 0. Başlangıçta w₀ = b₀ = 2 ise çıkış ≈ 0.98: çok emin ve çok yanlış. Aynı η ile iki maliyetin öğrenmesini karşılaştır; sağda BP1'in verdiği çıkış hatası δᴸ.
    predict:
      q: "w₀ = b₀ = 2 (a₀ ≈ 0.98, y = 0). İlk epoch'larda hangi maliyet daha hızlı öğrenir?"
      options:
        - {t: "Çapraz entropi: δᴸ = a − y ≈ 0.98, MSE'de ise δᴸ = (a − y)σ′(z) ≈ 0.017", ok: true, why: "σ′(4) = σ(4)(1 − σ(4)) ≈ 0.0177: MSE'nin öğrenme sinyali ~55 kat küçük."}
        - {t: "MSE: hata büyükken kare daha büyük ceza verir", why: "Ceza büyük ama gradyanı σ′ ile çarpılıyor; doymuş nöronda σ′ ≈ 0."}
        - {t: "İkisi aynı", why: "BP1'deki ∂C/∂a terimi maliyetten maliyete değişir."}
    presets:
      - {name: "Kötü başlangıç", params: {w0: 2, b0: 2, eta: 0.15, T: 300}, note: "MSE'de uzun bir plato; CE hemen iner."}
      - {name: "İyi başlangıç", params: {w0: 0.6, b0: 0.9, eta: 0.15, T: 300}, note: "a₀ ≈ 0.82: doyma yok, iki maliyet de makul hızda."}
      - {name: "Daha da kötü", params: {w0: 3, b0: 3, eta: 0.15, T: 600}, note: "z = 6, σ′ ≈ 0.0025: MSE yüzlerce epoch neredeyse kıpırdamaz."}
    questions:
      - q: "MSE'nin platosundan sonra öğrenme neden aniden hızlanıyor?"
        a: "a, 1'den uzaklaşıp orta bölgeye girince σ′(z) büyür (en çok a = 0.5'te, 1/4); δᴸ artar. Sonra a → 0'a yaklaşırken σ′ yine küçülür."
      - q: "Bu sorun gizli katmanlarda da var mı? Çapraz entropi orada da çözer mi?"
        a: "Var (BP2'deki σ′(zˡ) çarpanı) ve çapraz entropi orada çözmez — yalnız çıkış katmanındaki σ′'yi sadeleştirir. Gizli katmanlar için doymayan aktivasyonlar ve iyi başlatma gerekir."
    limits: "Tek nöron, tek örnek, tam gradyan. η aynı alındı; adil karşılaştırma için her maliyette η ayrıca ayarlanabilir, ama doyma bölgesindeki fark ayardan büyüktür."
  - id: l2
    lab: mlpmoons
    title: "BP1–BP4 ile eğitilen MLP: aktivasyon ve derinlik"
    goal: |
      Aynı ağ (M3.1'deki deney), bu kez dört denklemin gözüyle. Sigmoid aktivasyonla derinliği artırınca aynı adım sayısında öğrenmenin nasıl yavaşladığını izle (BP2'deki σ′ ≤ 1/4 çarpanları).
    predict:
      q: "3 gizli katman, sigmoid, 300 adım. tanh'lı aynı ağa göre ne beklersin?"
      options:
        - {t: "Belirgin daha yüksek kayıp: σ′ ≤ 1/4 ve sıfır merkezli olmayan çıktılar ilk katmanların öğrenmesini yavaşlatır", ok: true, why: "BP2 her katmanda en fazla 1/4'lük bir çarpan ekler; ayrıca tüm girdiler pozitif olduğu için ağırlık gradyanları aynı işaretli (BP4)."}
        - {t: "Aynı", why: "Aktivasyonun türevi BP2'de doğrudan çarpan olarak görünür."}
        - {t: "Daha hızlı", why: "tanh'ın türevi en fazla 1, sigmoid'inki 1/4."}
    presets:
