      Otoregresif üretimde yeni her token için tüm öneki yeniden işlemek ile geçmişin K ve V'sini saklayıp yalnız yeni token'ı işlemek arasındaki toplam FLOP farkını ve önbelleğin belleğini hesapla. K/V başlarını paylaşmanın (MQA/GQA) önbelleği nasıl küçülttüğünü gör.
