id: m4-7-transformer
code: M4.7
title: Transformer ve GPT
phase: 4
minutes: 360
prereq: [m4-6-attention, m3-6-norm]
summary: >
  Attention'ı LayerNorm, MLP ve residual bağlantılarla bir Transformer
  bloğuna, blokları da bir GPT'ye dönüştürüyorsun. GPT-2 small'ın 124M
  parametresini elle sayıyor, saf Python'da temperature/top-k örnekleme
  yazıyor, NumPy'da küçük bir GPT'nin ileri geçişini kuruyor, PyTorch'ta
  nanoGPT tarzı bir model yazıp ezberletiyor ve en sonda KV-cache ile
  üretimi yeniden hesaplamaya kıyasla hızlandırıyorsun.
goals:
  - "Pre-LN Transformer bloğunu ve GPT'nin parametre sayısını ($12d^2+13d$ blok başına) çıkarmak"
  - "[[weight tying]]: giriş embedding'i ile çıkış katmanının aynı matris olması"
  - "Temperature ve top-k örneklemenin dağılımı nasıl değiştirdiğini hesaplamak"
  - "[[kv-cache]] ile otoregresif üretimde her adımı O(T²) yerine O(T) işe indirmek"
sources:
  - {title: "Karpathy — nanoGPT ve Zero to Hero: Let's build GPT / Let's reproduce GPT-2", url: "https://github.com/karpathy/nanoGPT", license: "MIT", use: adapt}
  - {title: "Radford ve ark. — Language Models are Unsupervised Multitask Learners (GPT-2)", url: "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf", license: "OpenAI", use: link}
  - {title: "Stanford CS336 — Assignment 1 (Transformer LM from scratch)", url: "https://github.com/stanford-cs336/assignment1-basics", license: "MIT", use: adapt}
  - {title: "Harvard NLP — The Annotated Transformer", url: "https://nlp.seas.harvard.edu/annotated-transformer/", license: "MIT", use: adapt}
  - {title: "Holtzman ve ark. — The Curious Case of Neural Text Degeneration (sampling)", url: "https://arxiv.org/abs/1904.09751", license: "arXiv", use: link}

hand:
  groups:
    - title: "Blok: LN₁ (γ, β), qkv Linear d→3d, proj d→d, LN₂, MLP d→4d→d; tüm Linear'larda bias var"
      fields:
        - {id: blk4, label: "$d=4$ için blok parametresi", answer: 244, hint: "$12d^2+13d$"}
        - {id: blk768, label: "$d=768$ için blok parametresi", answer: 7087872}
        - {id: gpt2, label: "GPT-2 small: $V=50257$, $T=1024$, $d=768$, 12 blok, son LN, çıkış = wte (tied)", answer: 124439808, hint: "$Vd+Td+12(12d^2+13d)+2d$"}
    - title: "Logit'ler $[2, 1, 0]$"
      fields:
        - {id: p1, label: "$T=1$: $p(\\text{token}_1)$", answer: 0.665241, tol: 0.0005}
        - {id: topk, label: "top-k = 2: $p(\\text{token}_1)$", answer: 0.731059, tol: 0.0005, hint: "3. token atılır, kalanlar yeniden normalize"}
        - {id: temp, label: "temperature 0.5: $p(\\text{token}_1)$", answer: 0.866813, tol: 0.0005, hint: "logit'leri 0.5'e böl: [4, 2, 0]"}
  verify: |
    import math
    blk = lambda d: 12 * d * d + 13 * d
    V, T, d = 50257, 1024, 768
    def sm(z):
        e = [math.exp(x - max(z)) for x in z]; return [x / sum(e) for x in e]
    answers = dict(blk4=blk(4), blk768=blk(768), gpt2=V * d + T * d + 12 * blk(d) + 2 * d,
                   p1=sm([2, 1, 0])[0], topk=sm([2, 1])[0], temp=sm([4, 2, 0])[0])

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Pre-LN (`x + attn(LN(x))`) neden orijinal Post-LN'den (`LN(x + attn(x))`) daha kolay eğitilir?"
    options:
      - {t: "Residual yol normalize edilmeden baştan sona akar; gradyan derin ağda doğrudan girişe ulaşır, warmup'a daha az bağımlıdır", ok: true, why: "GPT-2 ve sonrası Pre-LN kullanır ve en sona bir LN (`ln_f`) ekler."}
      - {t: "Daha az parametre kullanır", why: "Parametre sayısı aynı (son LN hariç)."}
      - {t: "Attention'ı hızlandırır", why: "Hız değil, optimizasyon kararlılığı."}
  - q: "Temperature 0'a yaklaşınca örnekleme neye dönüşür?"
    options:
      - {t: "Greedy (argmax) seçim", ok: true, why: "Logit'ler $1/T$ ile büyür; softmax en büyük logit'e tek-nokta dağılımına yakınsar."}
      - {t: "Düzgün (uniform) dağılım", why: "O, $T\\to\\infty$ limiti."}
      - {t: "Top-k = 2", why: "Top-k ayrı bir kesme kuralı."}
  - q: "KV-cache yalnızca key ve value'yu saklar, query'yi değil. Neden?"
    options:
      - {t: "Yeni token yalnız kendi query'siyle geçmişin tüm key/value'larına bakar; eski query'ler bir daha hiç kullanılmaz (causal)", ok: true, why: "Eski konumların çıktıları da değişmez; bu yüzden onları yeniden hesaplamak tamamen boşa iş."}
      - {t: "Query'ler çok büyük", why: "Boyutları key'lerle aynı."}
      - {t: "Query'ler de saklanabilir, fark etmez", why: "Saklamak yalnız bellek harcar; kullanılmazlar."}

homework:
  - title: "Radford ve ark. (2019): GPT-2"
    paper: "Radford, Wu, Child, Luan, Amodei, Sutskever — Language Models are Unsupervised Multitask Learners (OpenAI 2019)"
    url: "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"
    level: orta
    hours: 10
    goal: |
      d aşamasındaki nanoGPT tarzı modeli GPT-2'nin mimari değişiklikleriyle hizala (Bölüm 2.3: Pre-LN, son LN, artık katmanların 1/√N ile başlatılması, 50 257'lik bayt düzeyli BPE) ve Hugging Face'teki GPT-2 small ağırlıklarını kendi modeline yükleyip aynı logit'leri üret. Sıfır örnekli görevlerden birini (ör. LAMBADA benzeri son kelime tahmini ya da 'TL;DR:' istemiyle özetleme, Bölüm 3) küçük bir örneklemde dene.
    steps:
      - "Ağırlık adlarını eşlerken Conv1D'nin transpoze ağırlık düzenine dikkat."
    accept:
      - "Yüklenen ağırlıklarla logit'ler HF ile 10⁻⁴ içinde."
      - "Sıfır örnekli görevden nitel örnekler."
  - title: "Kaplan ve ark. (2020): dil modelleri için ölçekleme yasaları"
    paper: "Kaplan ve ark. — Scaling Laws for Neural Language Models (2020)"
    url: "https://arxiv.org/abs/2001.08361"
    level: ileri
    hours: 12
    goal: |
      Küçük ölçekte ölçekleme yasası çıkar: TinyStories ya da Shakespeare üzerinde 6–8 farklı boyutta (10⁵–10⁷ parametre, embedding hariç) model eğit; kaybı parametre sayısına ve hesaba (C ≈ 6ND) göre log-log çiz, L(N) = (N_c/N)^α_N uydur (makale Şekil 1). Erken durdurulmuş eğrilerden hesap-optimal sınırı çıkar ve Chinchilla (M8.1 ödevi) ile karşılaştır.
    steps:
      - "Her boyutta öğrenme oranını küçük bir taramayla ayarla."
    accept:
      - "Kayıp–N ilişkisi log-log'da yaklaşık doğrusal; α_N raporlanmış."
      - "Hesap-optimal sınır grafiği."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bir Transformer bloğunun parametreleri
    goal: 12d² kuralını türetmek
    needs: Doğrusal katman parametreleri
    q: |-
      Model boyu $d$, MLP genişliği $4d$, bias'lı doğrusal katmanlar, iki LayerNorm. Blok başına parametre sayısını türet; $d=768$ için hesapla.
    solution: |-
      **Attention:** Q, K, V, O izdüşümleri $4(d^2+d)$.
      **MLP:** $d\to4d$: $4d^2+4d$; $4d\to d$: $4d^2+d$. Toplam $8d^2+5d$.
      **LayerNorm:** iki tane, her biri γ ve β: $4d$.
      **Blok:** $12d^2+13d$. $d=768$: $12\cdot589\,824+9\,984=7\,087\,872$.

      **GPT-2 small:** 12 blok ≈ 85M + gömmeler (token 38.6M + konum 1024 × 768 ≈ 0.8M) + son LN ≈ 124M. **Gözlem:** büyük modellerde parametrelerin çoğu $12d^2L$ terimindedir; FLOP sayısı token başına ≈ $2\times$ parametre (ileri geçiş).
  - id: p2
    type: hesap
    level: 1
    title: KV önbelleği
    goal: Çıkarım belleğini hesaplamak
    needs: Attention'ın K, V'yi saklaması
    q: |-
      12 katman, $d=768$, bağlam 1024 token, fp16, batch 1. K ve V önbelleği kaç MiB?
    answer: 36.0
    calc: "2*12*1024*768*2/2**20"
    unit: MiB
    mistakes:
      - {answer: 18.0, msg: "Hem K hem V saklanır: 2 ile çarp."}
      - {answer: 72.0, msg: "fp16 2 bayt."}
    hints:
      - "Katman × token × d × (K ve V) × bayt."
    solution: |-
      $2\cdot12\cdot1024\cdot768\cdot2$ B $=36$ MiB. Uzun bağlam ve büyük batch'te KV önbelleği model ağırlıklarını geçebilir; çok sorgulu attention (MQA/GQA) K ve V başlarını paylaşarak bunu küçültür.
  - id: p3
    type: hesap
    level: 1
    title: Sıcaklıklı örnekleme
    goal: Sıcaklığın olasılığa etkisini hesaplamak
    needs: Softmax (M1.5)
    q: |-
      Logitler $[2,1]$, sıcaklık $T=0.5$. Birinci token'ın olasılığı?
    answer: 0.8807970779778823
    calc: "1/(1+math.exp(-(2-1)/0.5))"
    tol: 1e-3
    mistakes:
      - {answer: 0.7310585786300049, msg: "Bu T = 1; logitleri T'ye böl."}
      - {answer: 0.6224593312018546, msg: "T ile çarpmadın mı? Bölmelisin: (2 − 1)/0.5 = 2."}
    hints:
      - "İki sınıfta softmax = farkın sigmoid'i."
    solution: |-
      $\sigma(2)=0.881$ (T = 1'de 0.731). Deney alanı: M4.16.
  - id: p4
    type: yöntem-seç
    level: 2
    title: Pre-LN mi Post-LN mi?
    goal: Normalizasyon yerleşimini seçmek
    needs: Artık bağlantı
    q: |-
      48 katmanlı bir dil modelini ısınma (warmup) olmadan eğitmek istiyorsun. Post-LN ($x\leftarrow\mathrm{LN}(x+F(x))$) mi Pre-LN ($x\leftarrow x+F(\mathrm{LN}(x))$) mi?
    choices:
      - {t: "Post-LN", why: "Derin Post-LN'de çıkışa yakın katmanların gradyanı büyüktür; ısınma olmadan kararsız (Xiong ve ark. 2020)."}
      - {t: "Pre-LN", ok: true, why: "Artık yol normalizasyonsuz kaldığı için gradyan doğrudan akar; derin modellerde kararlı, ısınmaya daha az duyarlı."}
      - {t: "Normalizasyonsuz", why: "Derin modelde aktivasyonlar katmanlarla büyür."}
    hints:
      - "Artık yolda bir LN var mı?"
    solution: |-
      Pre-LN'de $x_L=x_0+\sum_lF_l(\cdot)$: özdeşlik yolu temiz. Bedel: son katmanda bir LN daha gerekir ve temsil normları derinlikle büyür. Modern LLM'ler Pre-LN (ya da RMSNorm) kullanır.
  - id: p5
    type: kod
    level: 3
    title: Nedensel maske hatası
    goal: Maskelemeyi kodda doğrulamak
    needs: M4.6 P6
    q: |-
      ```python
      mask = torch.tril(torch.ones(T, T))
      att = (q @ k.transpose(-2, -1)) / math.sqrt(d)
      att = att * mask
      att = att.softmax(-1)
      ```
      Eğitim kaybı inanılmaz hızlı düşüyor ama üretilen metin anlamsız. Hata ne, nasıl doğrularsın?
    rubric:
      - "Maskelenen skorların 0 olduğunu, softmax'ta e⁰ = 1 ağırlık alıp geleceğe sızdırdığını açıkladım"
      - "Doğrusunun `masked_fill(mask == 0, float('-inf'))` olduğunu yazdım"
      - "Hızlı düşen kaybın sızıntı belirtisi olduğunu söyledim"
      - "Test: t. konumdaki çıktının t'den sonraki girdileri değiştirince değişmediğini doğrulayan bir birim testi önerdim"
    hints:
      - "Softmax'a 0 giren bir skor hangi ağırlığı alır?"
    solution: |-
      Çarpmayla maskelenen skor 0 olur, softmax'ta $e^0=1$ ağırlık alır: gelecek token'lar attention'a girer. Model eğitimde cevabı görür (kayıp sahte düşer), üretimde gelecek yoktur. Düzeltme: softmax'tan önce `-inf`. Test: girdinin t+1. konumunu rastgele değiştir; 0..t çıktıları değişmemeli.
pitfalls:
  - wrong: "Parametrelerin çoğu attention'dadır."
    right: "Blokta MLP 8d², attention 4d²: parametrelerin ~⅔'ü MLP'de (P1)."
  - wrong: "Uzun bağlamın maliyeti yalnız attention hesabıdır."
    right: "Çıkarımda KV önbelleği belleği de bağlamla doğrusal büyür (P2)."
whatif:
  - q: "MLP genişliği 4d yerine 8/3·d ve SwiGLU olsaydı?"
    a: "Üç matris (geçitli) ile parametre sayısı ≈ aynı kalır; LLaMA ailesinin tercihi, aynı bütçede biraz daha iyi."
