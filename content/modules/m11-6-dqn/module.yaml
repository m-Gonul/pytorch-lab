  - t: Aynı gerçek S üzerinden bağımsız iki gelecek örneği
    ok: true
    why: Koşullu iki beklentinin çarpımını örnekler.
  - t: Aynı özellikte herhangi iki geçiş
    why: Gizli durum farklıysa koşullu yasa değişebilir.
  - t: Tek TD hatasının karesini tam türevlemek
