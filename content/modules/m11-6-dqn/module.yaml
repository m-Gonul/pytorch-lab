- id: p21
  type: kanıt
  level: 3
  title: 'Kaynak11.4*: RE ile VE aynı minimizeri paylaşır'
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: '(Kaynak: Sutton–Barto, s.275, yıldızlı Alıştırma11.4.) On-policy getiri G için (11.24) eşitliğini
    kanıtlayın. Duruma koşullanın; karma terimin sıfır olmasını ve gerekli moment/dağılım koşullarını
    belirtin.'
  solution: $e=G-v_\pi(S)$, $d=v_\pi(S)-\hat v(S,w)$ yazın. $G-\hat v=e+d$ ve karesi $e^2+2ed+d^2$. On-policy
    tanım $\mathbb E[e|S]=0$ verir. d, S ve sabit w ile belirli olduğundan $\mathbb E[ed]=\mathbb E[d\mathbb
    E[e|S]]=0$. Sonuç RE=$\mathbb E e^2$+VE. Aynı durum ağırlığı µ ile bütün beklentiler alınmalı, getiri
    ve tahminin ikinci momentleri sonlu olmalı; parametre türevi gerekmez. İlk terim w bağımsız olduğundan
    argmin kümeleri aynıdır. X rankı eksikse tek parametre garantisi yoktur. Sol/sağ iid0/2 MRP ve γ0
    için w1 noktasında VE0/1, return varyansı1/0; RE iki tarafta1. Off-policy ham b getirisi otomatik
    olarak π değerine koşullu sıfır hata vermez; bu kanıt uygun düzeltilmemiş b getirisine taşınmaz.
  hints:
  - G−vhat içine vπ ekleyip çıkarın.
  - d duruma koşullanınca sabittir; çapraz terime kule özelliğini uygulayın.
  rubric:
  - Kare açılımı ve koşullu çapraz terim0.
  - Aynı µ, on-policy, sonlu ikinci moment.
  - w bağımsız sabit ve aynı argmin kümesi.
- id: p22
  type: hesap
  level: 1
  title: 'Kendi hesabımız: PBE sıfırlanmayan doğrusal model'
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: İki durum x=(1,2),µ=(4/7,3/7),γ4/5,hedef daima ikinci duruma gider,her ödül1. C16/7,A0,b10/7 veriliyor.
    Her w için PBE kaçtır? Bu, kitabın alıştırması değil koşul denetimidir.
  solution: PBE=$(b-Aw)^2/C=(10/7)^2/(16/7)=25/28\approx.8928571429$. C terslenebilir olsa da A0 ve b≠0
    olduğundan TD sabit noktası yoktur. Sıfır PBE için Aw=b tutarlılığı gerekir.
  hints:
  - Önce hangi değişkene koşullandığınızı ve hangi ağırlıkları dondurduğunuzu yazın.
  answer: 0.8928571428571429
  calc: (10/7)**2/(16/7)
  tol: 1.0e-08
