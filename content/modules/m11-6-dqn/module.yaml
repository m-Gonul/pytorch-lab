  type: hesap
  level: 1
  title: Tampon belleği
  goal: Deneyim tekrarının bellek bedelini hesaplamak
  needs: Kare boyutu, kare yığını
  q: Tamponda 10⁶ geçiş tutuluyor ve her geçiş için hem $\phi_t$ hem $\phi_{t+1}$ (her biri 84 × 84 × 4, uint8)
    ayrı ayrı saklanıyor. Kaç GB (10⁹ bayt) gerekir?
  answer: 56.448
  calc: 1e6*2*84*84*4/1e9
  mistakes:
  - answer: 28.224
    msg: Bu yalnız φ_t; φ_{t+1} de saklanıyor.
  - answer: 225.792
    msg: 'uint8: piksel başına 1 bayt, float32 değil.'
  hints:
  - Bir yığın $84\cdot84\cdot4=28\,224$ bayt.
  solution: '$10^6\cdot2\cdot28\,224=5.6\cdot10^{10}$ bayt ≈ 56 GB. Uygulamalar yalnız tek tek kareleri (84·84 bayt)
    saklayıp yığınları indekslerle yeniden kurar: ≈ 7 GB.'
- id: p4
  type: yöntem-seç
  level: 2
  title: Tampondan hangi hedef?
  goal: Deneyim tekrarının politika dışı öğrenme gerektirdiğini görmek
  needs: SARSA ve Q-öğrenme hedefleri
  q: Bir ajan deneyim tekrarıyla eğitiliyor; tamponda 500 000 adım önceki politikayla toplanmış geçişler de var.
    Hangi hedef doğrudur?
  choices:
  - t: 'SARSA: r + γQ(s⁺, a⁺), a⁺ tampondaki sonraki eylem'
    why: a⁺ eski politikayla seçilmiş; hedef eski politikanın değerini kestirir.
  - t: 'Q-öğrenme: r + γ max_{a⁺} Q_{w̄}(s⁺, a⁺)'
    ok: true
    why: 'Hedef davranış politikasından bağımsız: politika dışı.'
  - t: Monte Carlo getirisi
    why: Getiri de eski politikanın sonraki eylemlerine bağlı.
  hints:
  - Hangi hedef, verinin hangi politikayla toplandığından bağımsızdır?
  solution: Tampondaki veri bir politika karışımından gelir. Q-öğrenmenin $\max$ hedefi yalnız $(s,a,r,s^+)$'ya
    bağlıdır. Çok adımlı hedefler (Rainbow'daki n adımlı getiri) yaklaşık olarak kullanılır; düzeltme için önem
    örneklemesi ya da Retrace gerekir.
- id: p5
  type: hata-bul
  level: 2
  title: Hedeften akan gradyan
  goal: Yarı-gradyan güncellemeyi PyTorch'ta doğru kurmak
  needs: '`detach`, `torch.no_grad`'
  q: Bir öğrencinin DQN kodu `target = r + gamma * q_net(s_next).max(1).values` ve `loss = F.mse_loss(q_net(s).gather(1,
    a), target)` kullanıyor; hedef ağ yok. Eğitim kararsız ve kayıp beklenmedik biçimde dalgalanıyor. Ne yanlış?
  choices:
  - t: MSE yerine Huber kullanılmalı
    why: Huber yardımcı olur ama asıl hata başka.
  - t: 'Hedef aynı ağla ve gradyanla hesaplanıyor: geri yayılım hedefi de kestirime doğru itiyor (tam gradyan, yarı-gradyan
      değil) ve hedef her adımda kayıyor. Hedef ayrı bir ağla ve torch.no_grad() / detach() ile hesaplanmalı'
    ok: true
    why: Hedefin türevi alınmamalı; DQN hedef ağı C adım dondurur.
  - t: max yerine argmax kullanılmalı
    why: Hedef değeri ister, indeksi değil.
  hints:
  - '`target.requires_grad` nedir?'
  solution: '`with torch.no_grad(): target = r + gamma * (1 - done) * target_net(s_next).max(1).values` ve her C
    adımda `target_net.load_state_dict(q_net.state_dict())`. Son durumlarda bootstrapping de kapatılmalı (`1 - done`).'
- id: p6
  type: kanıt
  level: 3
  title: Politika dışı doğrusal TD'nin ıraksaması
  goal: Iraksamanın en küçük örneğini çözümlemek
  needs: Doğrusal yineleme
  q: 'Tek ağırlıklı doğrusal bir değer fonksiyonu düşünün: $v(s_1)=w$, $v(s_2)=2w$. Yalnız $s_1\to s_2$ geçişi (ödül
    0) güncelleniyor (politika dışı dağılım: $s_2$''den çıkan geçiş hiç örneklenmiyor). Yarı-gradyan TD güncellemesinin
    $w$''yi her $\alpha>0$ için $\gamma>1/2$ iken ıraksattığını gösterin.'
  rubric:
  - δ = 0 + γ·2w − w = (2γ − 1)w yazdım
  - ∇v(s₁) = 1 ile w ← w + α(2γ − 1)w = (1 + α(2γ − 1))w buldum
  - γ > 1/2 iken çarpanın 1'den büyük olduğunu ve w ≠ 0 ise |w|'nin üstel büyüdüğünü gösterdim
  - s₂'den çıkan geçiş de örneklenseydi (politika üstü) ek terimin büyümeyi dengeleyeceğini belirttim
  hints:
  - Gerçek değer 0 ve $w=0$ temsil edilebilir.
  solution: $w_{k+1}=(1+\alpha(2\gamma-1))w_k$; $\gamma>1/2$ ise $w\to\pm\infty$. Bu Sutton & Barto'nun "w → 2w"
    örneğidir (Örnek 11.1'in ilk biçimi). $s_2$ de ziyaret edilseydi onun güncellemesi $\alpha(\gamma v(s')-2w)\cdot2$
    ile w'yi küçültürdü; politika üstü dağılımda toplam etki büzülmedir.
- id: p7
  type: kanıt
