practice:
- id: p1
  type: çözülmüş
  level: 0
  title: Bir doğrusal Q-öğrenme adımı
  goal: Yarı-gradyan güncellemesini elle uygulamak
  needs: $\nabla_wQ_w(s,a)=x$
  q: '$Q_w(s,a)=w^\top x$, $x=(1,0,2)$, $w=(0.5,1,0.25)$. Geçiş: $r=1$, $\gamma=0.9$, $\max_{a^+}Q_{\bar
    w}(s^+,a^+)=2$, $\alpha=0.1$. Güncellenmiş $w$ nedir?'
  solution: $Q_w(s,a)=0.5+0+0.5=1$. Hedef $1+0.9\cdot2=2.8$, $\delta=1.8$. $w\leftarrow w+0.1\cdot1.8\cdot
    x=(0.68,1,0.61)$. Yalnız $x$'in sıfır olmayan bileşenleri değişir; hedefin $w$'ye bağımlılığı türevlenmez
    (yarı-gradyan).
- id: p2
  type: hesap
  level: 1
  title: Nature DQN'nin evrişim çıktısı
  goal: Evrişim boyutlarını hesaplamak
  needs: $\lfloor(H-k)/s\rfloor+1$
  q: 2013 DQN ağında girdi 84 × 84 × 4, ardından 16 tane 8 × 8 filtre (adım 4) ve 32 tane 4 × 4 filtre
    (adım 2). İkinci evrişimden sonra düzleştirilmiş vektörün boyu nedir?
  answer: 2592
  calc: ((((84-8)//4+1)-4)//2+1)**2*32
  tol: 0
  mistakes:
  - answer: 3136
    msg: 'Bu 2015 ağı (üç evrişim, 64 kanal: 7·7·64).'
  - answer: 6400
    msg: Bu birinci evrişimden sonra (20 · 20 · 16); ikinci katmanı unutmayın.
  hints:
  - Birinci katmandan sonra kenar $(84-8)/4+1=20$.
  solution: $20\to(20-4)/2+1=9$; $9\cdot9\cdot32=2592$. Tam bağlı katman $2592\cdot256+256\approx6.6\cdot10^5$
    parametreyle ağın en büyük parçası.
- id: p3
  type: hesap
  level: 1
  title: Tampon belleği
  goal: Deneyim tekrarının bellek bedelini hesaplamak
  needs: Kare boyutu, kare yığını
  q: Tamponda 10⁶ geçiş tutuluyor ve her geçiş için hem $\phi_t$ hem $\phi_{t+1}$ (her biri 84 × 84 ×
    4, uint8) ayrı ayrı saklanıyor. Kaç GB (10⁹ bayt) gerekir?
  answer: 56.448
  calc: 1e6*2*84*84*4/1e9
  mistakes:
  - answer: 28.224
    msg: Bu yalnız φ_t; φ_{t+1} de saklanıyor.
  - answer: 225.792
    msg: 'uint8: piksel başına 1 bayt, float32 değil.'
  hints:
  - Bir yığın $84\cdot84\cdot4=28\,224$ bayt.
  solution: '$10^6\cdot2\cdot28\,224=5.6\cdot10^{10}$ bayt ≈ 56 GB. Uygulamalar yalnız tek tek kareleri
    (84·84 bayt) saklayıp yığınları indekslerle yeniden kurar: ≈ 7 GB.'
- id: p4
  type: yöntem-seç
  level: 2
  title: Tampondan hangi hedef?
  goal: Deneyim tekrarının politika dışı öğrenme gerektirdiğini görmek
  needs: SARSA ve Q-öğrenme hedefleri
  q: Bir ajan deneyim tekrarıyla eğitiliyor; tamponda 500 000 adım önceki politikayla toplanmış geçişler
    de var. Hangi hedef doğrudur?
  choices:
  - t: 'SARSA: r + γQ(s⁺, a⁺), a⁺ tampondaki sonraki eylem'
    why: a⁺ eski politikayla seçilmiş; hedef eski politikanın değerini kestirir.
  - t: 'Q-öğrenme: r + γ max_{a⁺} Q_{w̄}(s⁺, a⁺)'
    ok: true
    why: 'Hedef davranış politikasından bağımsız: politika dışı.'
  - t: Monte Carlo getirisi
    why: Getiri de eski politikanın sonraki eylemlerine bağlı.
  hints:
  - Hangi hedef, verinin hangi politikayla toplandığından bağımsızdır?
  solution: Tampondaki veri bir politika karışımından gelir. Q-öğrenmenin $\max$ hedefi yalnız $(s,a,r,s^+)$'ya
    bağlıdır. Çok adımlı hedefler (Rainbow'daki n adımlı getiri) yaklaşık olarak kullanılır; düzeltme
    için önem örneklemesi ya da Retrace gerekir.
- id: p5
  type: hata-bul
  level: 2
  title: Hedeften akan gradyan
  goal: Yarı-gradyan güncellemeyi PyTorch'ta doğru kurmak
  needs: '`detach`, `torch.no_grad`'
  q: Bir öğrencinin DQN kodu `target = r + gamma * q_net(s_next).max(1).values` ve `loss = F.mse_loss(q_net(s).gather(1,
    a), target)` kullanıyor; hedef ağ yok. Eğitim kararsız ve kayıp beklenmedik biçimde dalgalanıyor.
    Ne yanlış?
  choices:
  - t: MSE yerine Huber kullanılmalı
    why: Huber yardımcı olur ama asıl hata başka.
  - t: 'Hedef aynı ağla ve gradyanla hesaplanıyor: geri yayılım hedefi de kestirime doğru itiyor (tam
      gradyan, yarı-gradyan değil) ve hedef her adımda kayıyor. Hedef ayrı bir ağla ve torch.no_grad()
      / detach() ile hesaplanmalı'
    ok: true
    why: Hedefin türevi alınmamalı; DQN hedef ağı C adım dondurur.
  - t: max yerine argmax kullanılmalı
    why: Hedef değeri ister, indeksi değil.
  hints:
  - '`target.requires_grad` nedir?'
  solution: '`with torch.no_grad(): target = r + gamma * (1 - done) * target_net(s_next).max(1).values`
    ve her C adımda `target_net.load_state_dict(q_net.state_dict())`. Son durumlarda bootstrapping de
    kapatılmalı (`1 - done`).'
- id: p6
  type: kanıt
  level: 3
  title: Politika dışı doğrusal TD'nin ıraksaması
  goal: Iraksamanın en küçük örneğini çözümlemek
  needs: Doğrusal yineleme
  q: 'Tek ağırlıklı doğrusal bir değer fonksiyonu düşünün: $v(s_1)=w$, $v(s_2)=2w$. Yalnız $s_1\to s_2$
    geçişi (ödül 0) güncelleniyor (politika dışı dağılım: $s_2$''den çıkan geçiş hiç örneklenmiyor). Yarı-gradyan
    TD güncellemesinin $w$''yi her $\alpha>0$ için $\gamma>1/2$ iken ıraksattığını gösterin.'
  rubric:
  - δ = 0 + γ·2w − w = (2γ − 1)w yazdım
  - ∇v(s₁) = 1 ile w ← w + α(2γ − 1)w = (1 + α(2γ − 1))w buldum
  - γ > 1/2 iken çarpanın 1'den büyük olduğunu ve w ≠ 0 ise |w|'nin üstel büyüdüğünü gösterdim
  - s₂'den çıkan geçiş de örneklenseydi (politika üstü) ek terimin büyümeyi dengeleyeceğini belirttim
  hints:
  - Gerçek değer 0 ve $w=0$ temsil edilebilir.
  solution: $w_{k+1}=(1+\alpha(2\gamma-1))w_k$; $\gamma>1/2$ ise $w\to\pm\infty$. Bu Sutton & Barto'nun
    "w → 2w" örneğidir (Örnek 11.1'in ilk biçimi). $s_2$ de ziyaret edilseydi onun güncellemesi $\alpha(\gamma
    v(s')-2w)\cdot2$ ile w'yi küçültürdü; politika üstü dağılımda toplam etki büzülmedir.
- id: p7
  type: kanıt
  level: 2
  title: '9.1: tablo doğrusal yaklaşımın özel durumudur'
  goal: '9.1: tablo doğrusal yaklaşımın özel durumudur'
  needs: Bölüm 9 konu anlatımı
  q: 'Tabloyla durum-değeri tahmininin doğrusal yaklaşımın özel durumu olduğunu gösterin. Öznitelik vektörleri
    nasıl seçilir? Kaynak: Sutton–Barto, s.209, Alıştırma 9.1.'
  hints:
  - Önce gösterimin boyutlarını ve varsayımları yazın.
  solution: Sonlu durumları $s_1,...,s_m$ sırala. $d=m$, $x(s_i)=e_i$ bir-sıcak vektörü ve $w_i=V(s_i)$
    seç. O zaman $w^\top x(s_i)=w_i$ ve gradyan $e_i$. Her $w\leftarrow w+\alpha(U-w_i)e_i$ adımı yalnız
    o tablo hücresini değiştirir. Eylem değerleri için her $(s,a)$ çiftine ayrı bir-sıcak koordinat ayırılır.
    Genelleyen düşük boyutlu yaklaşımda bu ayrılık kalkar.
  rubric:
  - Her duruma bir koordinat verdim
  - İç çarpımın tablo hücresini seçtiğini gösterdim
  - Gradyan güncellemesinin yalnız o hücreyi değiştirdiğini yazdım
- id: p8
