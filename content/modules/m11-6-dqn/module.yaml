  predict:
    q: Seçili noktada hatanın tamamını gidermek için genel doğru ölçek hangisidir?
    options:
    - t: 1/||x||²
      ok: true
      why: Δv=αδ||x||².
    - t: Her ailede 1/özellik sayısı
      why: Bu yalnız n farklı aktif binary özellikte tamdır.
  presets:
  - name: Fourier
    params:
      kind: 1
      n: 5
      at: 0.4
      step: 1
    note: Küresel ve işaret değiştirebilen iç çarpım.
  - name: Polinom
