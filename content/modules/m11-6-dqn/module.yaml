  solution: İlk durumun 2-adım hedefi 2+w 2 olduğu için S 3 değerine ihtiyaç vardır. Yalnız Iile S 3 güncellenmez;
    w 2 başlangıç 0 kalır ve w 1→2. M=I+M_(t−2), M=(1,0,1,0) üretir; S 3 hedefi 2 ile w 2→2, sonra w 1→4.
    Düz 2-adım(3.5,1.5), vurgulu 2-adım(4,2). Azalan adım limitleri, sonlu koşu sayılarıyla karıştırılmaz.
  rubric:
  - Bootstrap edilen S 3
  - M=(1,0,1,0)
  - Yalnız I:2; vurgu:4 başlangıç değeri
- id: p15
  type: açıkla
  level: 2
  title: 10.1 — Yaklaşımla Monte Carlo kontrolü
  goal: 10.1 — Yaklaşımla Monte Carlo kontrolü
  needs: MC getiri, iyimser başlangıç ve n-adım halka tamponu
  q: 'Bu bölümdeki yarı-gradyan kontrol yöntemlerinin MC karşılığı nedir? Ayrıca yeni sözde-kod gerekir
    mi? Mountain Car performansı için ne beklersiniz? (Kaynak: Sutton–Barto, s.248, Alıştırma10.1.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını
    ayırın.
  solution: 'Bölüm bitene kadar (S_t,A_t,R_{t+1}) kaydedilir; geriye G_t=R_{t+1}+γG_{t+1} hesaplanır ve
    w←w+α[G_t−qhat(S_t,A_t,w)]∇qhat yapılır; kontrol ε-greedy ile iyileştirilir. n-adım kutusunda n≥T
    seçilmesi zaten bütün hedefleri tam getiriye çevirir; ayrı bir temel kutu gerekmez. Çevrimiçi TD,
    ilk bölüm içinde gidilmiş yerleri negatif yaparak Q0 iyimserliğini kullanır. MC bölüm bitmeden bu
    bilgiyi yayamaz: ilk bölümde deterministik eşitlik seçimi her zaman nötr itişi seçerse x=−π/6,v0 sabit
    noktasında hiç bitmeyebilir. Rastgele eşitlik veya ε keşfi sonlanmaya yardım eder; MC için ölçülmemiş
    evrensel süre iddiası kurmayız. Kaynağın kontrol görevinde MC davranışı bu gecikmeden zorlanabilir,
    ama bütün ortamlarda daha kötü teoremi değildir.'
  rubric:
  - Tam episodik getiriyle yarı-gradyan güncelleme yazılır.
  - n≥T eşdeğerliği ve bölüm içi gecikme açıklanır.
  - Eşitlik seçimi/sonlanma varsayımı görünür tutulur.
- id: p16
  type: kod
  level: 2
  title: 10.2 — Yarı-gradyan Expected SARSA
  goal: 10.2 — Yarı-gradyan Expected SARSA
  needs: SARSA, ε-greedy ve stop-gradient
  q: 'Tek-adım yarı-gradyan Expected SARSA kontrolü için sözde-kod verin. (Kaynak: Sutton–Barto, s.248,
    Alıştırma10.2.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını
    ayırın.
  solution: w,α,ε başlatın. Her bölümde S başlangıcını alın ve mevcut ε-greedy politikadan A seçin. R,S′
    gözleyin. Terminalse U=R; değilse her izinli b için eski qhat(S′,b,w) hesaplayıp aynı ε-greedy π ile
    U=R+γΣ_b π(b|S′)qhat(S′,b,w) kurun ve sonraki davranış eylemi A′ seçin. Sonra w←w+α[U−qhat(S,A,w)]∇qhat(S,A,w).
    Terminalde bölüm bitsin; değilse S,A←S′,A′. Hedefe stop-gradient uygulanır. k eylem/m eşit maksimum
    varsa π(b)=ε/k+(1−ε)/m maksimumlarda, diğerlerinde ε/k. Bu sıra sonraki eylemi güncellemeden önce
    seçen kutuyla eşlenir. Beklentiyi hesaplamak örneklenmiş sonraki eylemin koşullu gürültüsünü giderir;
    bütün öğrenme varyansını sıfırlamaz.
  rubric:
  - ΣπQ hedefi ve terminal0 bootstrap kullanılır.
  - Aynı ε-greedy politikanın eşitlik olasılıkları belirtilir.
  - Yalnız mevcut Q türevi alınır.
- id: p17
  type: açıkla
  level: 1
  title: 10.3 — Uzun getiri ve standart hata
  goal: 10.3 — Uzun getiri ve standart hata
  needs: Örnek standart sapma ve SE
  q: 'Şekil10.4 içinde büyük n ayarlarında standart hatalar neden daha büyük raporlanmış olabilir? (Kaynak:
    Sutton–Barto, s.248, Alıştırma10.3.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını
    ayırın.
  solution: Daha uzun getiri daha çok rastgele geçiş/başlangıç etkisini taşır; kontrollü deneyde ağırlıklar
    ve dolayısıyla politika da değiştiğinden küçük erken farklar sonraki yörüngeleri ayırabilir. Başarısız
    uzun bölümler ve n ile birlikte seçilen α duyarlılığı koşular arası saçılmayı büyütebilir. Kaynağın
    yaklaşık SE0.5→4 gözlemi bu Mountain Car/ilk50 bölüm/100 koşu düzenine aittir; SE=s_runs/√100. Uzun
    n için varyansın her problemde monoton arttığı teoremi değildir; ödül kovaryansları ve bootstrap hatası
    bunu değiştirebilir. Kendi taramamız SE değerlerini ayrı gösterir ve bir sansürlü ayarı başarılı99
    koşunun ortalamasıyla doldurmaz.
  rubric:
  - Koşular arası SE ve100 koşu paydası ayrılır.
  - Daha uzun dönüş ve adaptif politika etkisi açıklanır.
  - Monoton genel garanti ileri sürülmez.
- id: p18
  type: açıkla
  level: 3
  title: 'Kaynak11.1: n-adım off-policy yarı-gradyan TD'
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: '(Kaynak: Sutton–Barto, s.259, Alıştırma11.1.) (7.9) n-adım off-policy TD güncellemesini parametreli
    durum değerine çevirin. Bölümlü/indirimli ve sürekli/ortalama-ödül getirisini, oran aralığını, terminal
    koşulunu verin.'
  solution: $h=\min(t+n,T)$ ve güncellemeden önce $w^-=w_{t+n-1}$. Bölümlü hedef $G=\sum_{k=t}^{h-1}\gamma^{k-t}R_{k+1}+\mathbf1_{h<T}\gamma^{h-t}\hat
    v(S_h,w^-)$. Oran $c=\prod_{i=t}^{\min(t+n-1,T-1)}\rho_i$. Güncelleme $w^+=w^-+\alpha c[G-\hat v(S_t,w^-)]\nabla\hat
    v(S_t,w^-)$. Durum değerinde ilk eylem henüz koşullanmamıştır; ürün **t** ile başlar. Eylem değerindeki
    t+1 başlangıcıyla karıştırmayın. Sürekli ortalama-ödül durumda $T=\infty$, $\gamma=1$, $G=\sum_{k=t}^{t+n-1}(R_{k+1}-\bar
    R_k)+\hat v(S_{t+n},w^-)$; oran t…t+n−1. Kaynağın zamanlı kazançları saklanır; bütün ödüllerden tek
    güncel kazanç çıkaran Bölüm10 tercihi ayrıca belirtilir. Gerçek terminalde bootstrap0; boş ürün1,
    T sonrasında oran1. Grad yalnız başlangıç tahmininden alınır, getiri türevlenmez. Kapsama ve kazanç
    tahmini koşulları gerekir.
  hints:
  - Tablo hücresinin birim vektörü yerine başlangıç tahmininin gradyanı gelir.
  - Durum değerinde A_t henüz koşullanmamıştır; ilk oranı düşürmeyin.
  rubric:
  - İki getiri ve terminali doğru tanımlar.
  - Oran t…t+n−1, bütün tahmin/gradyan aynı güncelleme öncesi parametrede.
  - Ortalama-ödül kazanç zamanını ve yarı-gradyanı açıklar.
- id: p19
  type: açıkla
  level: 3
  title: 'Kaynak11.2*: yarı-gradyan Q(σ), iki getiri rejimi'
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: '(Kaynak: Sutton–Barto, s.259, yıldızlı Alıştırma11.2.) (7.11)/(7.17) içindeki Q(σ) için yarı-gradyan
    biçimi verin; bölümlü ve sürekli durumları kapsayın. Kitaptaki kontrol-değişkenli getirinin oranını
    iki kez kullanmayın.'
  solution: 'Güncelleme anında $w^-$ dondurun; $Q_k=\hat q(S_k,A_k,w^-)$, $\bar Q_k=\sum_a\pi(a|S_k)\hat
    q(S_k,a,w^-)$. Nonterminal ufuk h için $G_{h:h}=Q_h$. Geriye doğru $c_{k+1}=\sigma_{k+1}\rho_{k+1}+(1-\sigma_{k+1})\pi(A_{k+1}|S_{k+1})$,
    $G_{k:h}=R_{k+1}+\gamma[\bar Q_{k+1}+c_{k+1}(G_{k+1:h}-Q_{k+1})]$. Gerçek son geçişte $G_{T-1:T}=R_T$;
    terminalde eylem/π/ρ aranmaz. Güncelleme $w^+=w^-+\alpha[G_{t:h}-\hat q(S_t,A_t,w^-)]\nabla\hat q(S_t,A_t,w^-)$.
    **Ek dış önem çarpımı yoktur**: oran (7.17) içindedir. Süreklide h=t+n, γ1, her R yerine $R_{k+1}-\bar
    R_k$; diğer sınır ve katsayılar aynıdır. σ0 Tree backup; σ1 kontrol-değişkenli (7.14), düz örneklemeli
    SARSA ile her yolda aynı değildir. n1 nonterminal sınırında G_h−Q_h0 olduğundan her σ Expected SARSA
    verir. Kaynak düzeltmesi: (7.11) dış oranını iç oranlı (7.17) üzerine tekrar çarpmak yanlış beklenti
    verir. π(.75,.25),b(.5,.5),Q0,iki-adım son ödül2/0 örneğinde doğru beklenti1.5; çift oran2.25. Çözüm
    Bölüm7 içinde düzeltilen aynı CV biçimini korur; başka Qσ varyantıymış gibi sunulmaz.'
  hints:
  - 'Bölüm7 #sutton-sigma içinde kaynak(7.17) kontrol-değişkenli özyinelemeyi kullanın.'
  - Nonterminal uç Q; terminal uç son ödül. İç oran üzerine dış oran eklemeyin.
  rubric:
  - Özyineleme, σ ve oran katsayısı doğru.
  - Tek-anlık yarı-gradyan, iki rejim ve terminal sınırı tam.
  - Çift oran ve σ1/pathwise ayrımını belirtir.
- id: p20
  type: kod
  level: 3
  title: 'Kaynak11.3: Baird üzerinde Q-learning ıraksaması'
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: '(Kaynak: Sutton–Barto, s.264, Alıştırma11.3, programlama.) Yedi durumlu Baird modeline tek-adım
    yarı-gradyan Q-learning uygulayıp ağırlıkların büyüdüğünü gerçek geçişlerle gösterin. Eylem özelliklerini
    ve başlatmayı açıklayın. x7 başlangıç/çözüm/kontrol dosyalarını kullanın.'
  solution: 'Her eyleme ayrı sekiz parametre verin: $q(s,a)=x(s)^\top w_a$. Bu doğal 16-parametreli uzantı
    bizim açık seçimimizdir; kitabın durum-değer özellikleri tek başına eylem kodlamasını belirlemez.
    İki bloğu da (1,1,1,1,1,1,10,1) ile başlatın. b sabit kesik6/7,düz1/7; γ.99,R0,α.01. Gerçek her geçişte
    δ=γmax_a q(S′,a)−q(S,A), yalnız oynanan bloğu αδx ile güncelleyin; önem oranı yoktur. Tohum1 gerçek
    100000 geçişte norm14.6287→3.35030946e16; 1000 adımda26.5059,10000 adımda1711.49635. Diğer önceden
    seçilmiş tohumlar2/1000001/1000002 son normları1.634844717e16/4.777212926e16/4.598774384e16. Bütün14
    durum-eylem çifti ziyaret edildi. x7 kontrolü ilk geçişin yalnız doğru bloğunu ve uzun koşuyu denetler.
    Sonlu deney büyümeyi gösterir; her başlatma/adım için evrensel ıraksama kanıtı değildir. İki eyleme
    aynı sekiz ağırlığı paylaşmak farklı bir modeldir.'
  hints:
  - Önce hangi değişkene koşullandığınızı ve hangi ağırlıkları dondurduğunuzu yazın.
