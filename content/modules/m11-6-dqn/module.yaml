  q: 'Tabloyla durum-değeri tahmininin doğrusal yaklaşımın özel durumu olduğunu gösterin. Öznitelik vektörleri nasıl
    seçilir? Kaynak: Sutton–Barto, s.209, Alıştırma 9.1.'
