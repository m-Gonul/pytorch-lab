id: m11-6-dqn
code: M11.6
title: Fonksiyon yaklaştırma ve derin Q-ağları (DQN)
phase: 11
minutes: 960
prereq:
- m11-5-sarsa-q
summary: "Tablo sığmayınca (Go'da ~3^361 durum, Atari'de 210×160×3 piksel) değer bir fonksiyonla yaklaşık hesaplanır:\
  \ $Q_w(s,a)$. Yarı-gradyan güncelleme, hedefin de w'ye bağlı olması sorunu, durum toplama, karo kodlama, \"ölümcül\
  \ üçlü\" (yaklaştırma + önyükleme + politika dışı) ve Baird karşı örneği; DQN'nin iki hilesi deneyim tekrarı ve\
  \ hedef ağ, Huber kaybı, çift DQN hedefi, Atari ön işleme. Saf Python'da 1000 durumlu yürüyüş, NumPy'da Baird\
  \ ıraksaması ve TDC, PyTorch'ta CartPole'u çözen DQN, sonda binlerce doğrusal politikayı paralel değerlendiren\
  \ rastgele arama.\n Sutton–Barto Bölüm9: µ-ağırlıklı VE, gradyan MC, doğrusal TD momentleri/rank koşulları, n-adım,\
  \ polinom/Fourier, kaba/karo/hash/RBF, LSTD, bellek/çekirdek ve ilgi/vurgu; tam bütçeli kaynak deneyleri ve beş\
  \ kaynak alıştırmasının çözümleri."
goals:
- 'Yarı-gradyan TD: $w\leftarrow w+\alpha[r+\gamma\hat v(s'',w)-\hat v(s,w)]\nabla\hat v(s,w)$ — hedefin gradyanı
  alınmaz'
- '[[ölümcül üçlü]]: üçü bir aradayken ıraksama mümkündür'
- '[[deneyim tekrarı]] ve hedef ağ neden kararlılık sağlar'
- DQN hedefi $r+\gamma\max_{a'}Q_{\bar w}(s',a')$, çift DQN hedefi $r+\gamma Q_{\bar w}(s',\arg\max_{a'}Q_w(s',a'))$
- MC minimum VE ile TD sabit noktasını ve iki farklı RMS ölçütünü ayırmak
- Özellik iç çarpımından genellemeyi ve doğru adım normalizasyonunu hesaplamak
- LSTD paydasını ve kernel primal–dual katsayılarını denetlemek
- İlgi I ile bootstrap zincirine yayılan vurgu M farkını açıklamak
