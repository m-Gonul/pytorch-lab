- id: p25
  type: çözülmüş
  level: 0
  title: 'Çözülmüş A-split: sürprizi azaltmanın bedeli'
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: 'Kendi çözülmüş örneğimiz: A→B/C eşit, ilk ödül0,B→son ödül1,C→son ödül0,γ1. Gerçek(.5,1,0) ile(.5,.75,.25)
    tahminlerini VE/BE/TDE bakımından karşılaştırın.'
  solution: Durum ağırlıkları(.5,.25,.25). Gerçek tahmin VE=BE0,TDE1/8. Diğer tahminde A beklenen artık0,B/C
    artık±.25; BE=.25(.25²)+.25(.25²)=1/32. VE de1/32. Dört eşit olasılıklı geçiş hatasının büyüklüğü.25
    olduğundan TDE1/16. TDE düşerken VE ve BE artar; doğru temsil mümkün olsa bile yanlış amacı iyi optimize
    etmek yanlış değer üretir.
pitfalls:
- wrong: Doğrusal fonksiyon yaklaşımıyla Q-öğrenme her zaman yakınsar; ıraksama yalnız sinir ağlarında
    olur.
  right: Baird'in karşı örneğinde doğrusal politika dışı TD bile ıraksar. Ölümcül üçlü (yaklaşım + bootstrapping
    + politika dışı) doğrusal modellerde de geçerlidir.
- wrong: Q-öğrenmenin güncellemesi kare TD hatasının gradyan inişidir.
  right: 'Hedefin türevi alınmaz: yöntem yarı-gradyandır ve hiçbir fonksiyonun inişi değildir. Bu yüzden
    gradyan inişinin yakınsama güvenceleri geçerli değildir.'
- wrong: 2013 DQN makalesi deneyim tekrarı ve hedef ağ kullandı.
  right: 2013 makalesinde ayrı bir hedef ağ yoktur; hedef aynı parametrelerle hesaplanır. Hedef ağ (C
    = 10 000) 2015 Nature sürümünde gelir.
- wrong: Deneyim tekrarı yalnız veri verimliliği içindir.
  right: Asıl kazançlardan biri ardışık örneklerin ilişkisini kırmaktır; tek örnekli tekrar bile çevrimiçi
    SGD'den çok daha düşük hata verir (lab l2). Ayrıca politika ile veri dağılımı arasındaki geri besleme
    döngüsünü yumuşatır.
- wrong: TD sabit noktası minimum VE çözümüdür.
  right: Genelde farklıdır; aynı 10 grupta popülasyon kökVE .1167353, MCminimumu .0543770.
- wrong: εI bütün LSTD matrislerini terslenebilir yapar.
  right: Nonsimetrik TD dış çarpımlarında tekillik olabilir; payda denetlenir.
