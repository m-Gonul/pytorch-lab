- q: Ödül kırpılmasaydı?
  a: Oyundan oyuna puan ölçekleri (Pong'da ±1, Seaquest'te yüzler) gradyan büyüklüklerini çok farklı yapar;
    tek bir öğrenme oranı her oyunda çalışmaz. Kırpma bunu çözer ama ajan büyük ve küçük ödülü ayıramaz.
    Sonraki çalışmalar (Pop-Art, 2016) hedefleri uyarlamalı olarak normalize ederek kırpmadan aynı kararlılığı
    sağlar.
- q: Hedef ağ her adımda güncellenseydi (C = 1)?
  a: 'Hedef ağ olmayan duruma döner: her gradyan adımı hedefi de kaydırır ve geri besleme döngüsü kararsızlık
    yaratabilir. Çok büyük C ise yeni bilginin hedefe geç yansıması demektir: öğrenme yavaşlar. Pratik
    değerler 10³–10⁴ adım ya da yumuşak güncellemede τ ≈ 0.005.'
- q: Eylem uzayı sürekli olsaydı (ör. robot eklem torkları)?
  a: 'max_a Q(s, a) her adımda bir eniyileme problemi olur ve DQN doğrudan uygulanamaz. Çözümler: eylem
    uzayını ızgaraya bölmek (boyutla üstel büyür), ya da max''ı öğrenilmiş bir aktörle yaklaşmak (DDPG,
    TD3, SAC: aktör–eleştirmen, M11.9).'
- q: Özellik sütunları bağımlı olsaydı?
  a: Atekil olabilir; aynı değeri veren ağırlıklar tek değildir. Ters yerine uygun altuzay veya sözde
    ters koşulları açıklanır.
- q: İlgi yalnız başlangıçta olsa ve 2-adımda M yerine I kullansaydık?
  a: Bootstrap edilen üçüncü durum öğrenilmez; başlangıç tahmini 4 yerine 2 ye gider.
- q: Hash bütün aktif karoları tek kovada birleştirseydi?
  a: Sayılı φ=n, norm n²; tam adım 1/n². İlgisiz bölgeler aynı ağırlığı paylaşır.
- q: PBE küçük, VE büyük ölçülürse?
  a: İzdüşümün görmediği veya yavaş sönen yönleri inceleyin; Baird TDC1000süpürme somut örnektir.
- q: Oranları davranışı hedefe bağlayarak sınırlarsak?
  a: Recognizer tipi seçim varyansı azaltabilir ama serbest hedef politikadan ödün verir.
- q: Baird ağırlıkları sıfır dışı kalır ama değerler sıfırsa?
  a: Null özellik yönü nedeniyle bu geçerli çözümdür; parametre tekliği yoktur.
