  level: 2
  title: '9.2: tensor polinom ailesinin sayısı'
  goal: '9.2: tensor polinom ailesinin sayısı'
  needs: Bölüm 9 konu anlatımı
  q: '(9.17) gösteriminin k-boyutlu durumda neden $(n+1)^k$ farklı özellik verdiğini açıklayın. Kaynak:
    Sutton–Barto, s.211, Alıştırma 9.2.'
  hints:
  - Önce gösterimin boyutlarını ve varsayımları yazın.
  solution: 'Her üs $c_{ij}$ için 0..n arasında n+1 seçim var. k koordinatın seçimleri bağımsız olduğundan
    tuple sayısı $(n+1)^k$. Her tuple bir monom verir. Bir açık sürekli alanda farklı üs tuple''ları farklı
    polinom fonksiyonlarıdır; kısıtlı/ayrık bir veri kümesinde sütunlar yine bağımlı olabilir. Bu sayım
    toplam derece≤n değildir: her koordinat ayrı ayrı≤n, toplam derece en çok kn olur.'
  rubric:
