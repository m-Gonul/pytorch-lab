  limits: Önceden hesaplanan kendi verimiz; etkileşim yeni koşu başlatmaz. Kaynak tohumları bilinmiyor. SE noktasaldır.
- id: l4
  lab: basisvalue
  title: 'Baz iç çarpımı: tek örnek nereye geneller?'
