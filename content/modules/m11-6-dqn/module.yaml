- id: p1
  type: çözülmüş
  level: 0
  title: Bir doğrusal Q-öğrenme adımı
  goal: Yarı-gradyan güncellemesini elle uygulamak
  needs: $\nabla_wQ_w(s,a)=x$
  q: '$Q_w(s,a)=w^\top x$, $x=(1,0,2)$, $w=(0.5,1,0.25)$. Geçiş: $r=1$, $\gamma=0.9$, $\max_{a^+}Q_{\bar w}(s^+,a^+)=2$,
    $\alpha=0.1$. Güncellenmiş $w$ nedir?'
  solution: $Q_w(s,a)=0.5+0+0.5=1$. Hedef $1+0.9\cdot2=2.8$, $\delta=1.8$. $w\leftarrow w+0.1\cdot1.8\cdot x=(0.68,1,0.61)$.
    Yalnız $x$'in sıfır olmayan bileşenleri değişir; hedefin $w$'ye bağımlılığı türevlenmez (yarı-gradyan).
- id: p2
  type: hesap
  level: 1
  title: Nature DQN'nin evrişim çıktısı
  goal: Evrişim boyutlarını hesaplamak
  needs: $\lfloor(H-k)/s\rfloor+1$
  q: 2013 DQN ağında girdi 84 × 84 × 4, ardından 16 tane 8 × 8 filtre (adım 4) ve 32 tane 4 × 4 filtre (adım 2).
    İkinci evrişimden sonra düzleştirilmiş vektörün boyu nedir?
  answer: 2592
  calc: ((((84-8)//4+1)-4)//2+1)**2*32
  tol: 0
  mistakes:
  - answer: 3136
    msg: 'Bu 2015 ağı (üç evrişim, 64 kanal: 7·7·64).'
  - answer: 6400
    msg: Bu birinci evrişimden sonra (20 · 20 · 16); ikinci katmanı unutmayın.
  hints:
  - Birinci katmandan sonra kenar $(84-8)/4+1=20$.
  solution: $20\to(20-4)/2+1=9$; $9\cdot9\cdot32=2592$. Tam bağlı katman $2592\cdot256+256\approx6.6\cdot10^5$ parametreyle
    ağın en büyük parçası.
