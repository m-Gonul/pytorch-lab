- id: p24
  type: yöntem-seç
  level: 1
  title: BE gradyanı için hangi erişim gerekir?
  goal: Politika dışı yaklaşımda hedef, dağılım ve hata amacını ayırmak
  needs: Bölüm7 n-adım getirileri; doğrusal yaklaşım ve koşullu beklenti
  q: Yalnız özellik/ödül akışı var; iki gizli durum aynı özellikte. Gerçek BE gradyanını genel olarak
    yansız örneklemek için hangi ek olanak yeterlidir? Kendi öğretim sorumuz.
  solution: Aynı gerçek durumdan koşullu bağımsız iki sonraki örnek üreten reset/simülatör oracle iki
    beklentinin çarpımını örnekler. Aynı özellikte rastgele başka bir gizli durum yeterli değildir. Örnek
    karesinin tam türevi ise genel olarak TDEyi izler.
  hints:
  - Önce hangi değişkene koşullandığınızı ve hangi ağırlıkları dondurduğunuzu yazın.
