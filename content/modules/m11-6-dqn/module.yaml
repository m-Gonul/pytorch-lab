- id: l4
  lab: basisvalue
  title: 'Baz iç çarpımı: tek örnek nereye geneller?'
  goal: Aynı noktadaki tek güncellemenin polinom, Fourier ve RBF ile başka noktalara etkisini hesapla.
  predict:
    q: Seçili noktada hatanın tamamını gidermek için genel doğru ölçek hangisidir?
    options:
    - t: 1/||x||²
      ok: true
      why: Δv=αδ||x||².
    - t: Her ailede 1/özellik sayısı
      why: Bu yalnız n farklı aktif binary özellikte tamdır.
