quiz:
- q: DQN'de hedef ağ neden kullanılır?
  options:
  - t: Hedef $r+\gamma\max Q$ de w'ye bağlı; her güncelleme hedefi de kaydırır. Hedefi C adım dondurmak
      problemi denetimli regresyona yaklaştırır.
    ok: true
    why: Hareketli hedef geri besleme döngüsü yaratır.
  - t: Hesabı hızlandırmak için
    why: Ek ileri geçiş gerektirir.
  - t: Keşfi artırmak için
    why: Keşif ε-açgözlüden gelir.
- q: Deneyim tekrarı neden politika dışı bir algoritma (Q-öğrenme) gerektirir?
  options:
  - t: Tampondaki geçişler eski politikalarla toplanmıştır; SARSA gibi politika üstü bir hedef yanlış
      olur
    ok: true
    why: Q-öğrenmenin max hedefi davranış politikasından bağımsızdır.
  - t: Tampon çok büyük olduğu için
    why: Boyutla ilgisi yok.
  - t: Gerektirmez
    why: Mnih ve ark. bunu açıkça not eder.
- q: Baird örneğinde yarı-gradyan TD neden ıraksar?
  options:
  - t: 'Güncellemeler davranış dağılımıyla (düzgün) ağırlıklanır ama hedef politika başka bir dağılım
      üretir: yaklaştırma + önyükleme + politika dışı'
    ok: true
    why: Politika üstü dağılımda aynı güncelleme kararlıdır.
  - t: Öğrenme oranı çok büyük
    why: Her α > 0 için ıraksar.
  - t: Öznitelikler doğrusal bağımlı
    why: Gerçek değer (0) temsil edilebilir; sorun dağılım.
homework:
- title: 'Mnih ve ark. (2013): Atari için DQN'
  paper: Mnih ve ark. — Playing Atari with Deep Reinforcement Learning (arXiv:1312.5602)
  url: https://arxiv.org/abs/1312.5602
  level: ileri
  hours: 20
  goal: 'Makaledeki DQN''yi uygula ve Pong ile Breakout''ta (Gymnasium + ALE) eğit: ön işleme (x2), 4
    kare yığını, ağ (16 adet 8×8/4, 32 adet 4×4/2, 256 tam bağlı), RMSProp, mini-batch 32, ε 1''den 0.1''e
    ilk 1 M karede doğrusal, tampon 1 M, kare atlama k = 4, ödül kırpma. Nature (2015) sürümüne (hedef
    ağ, 3 conv) ve çift DQN hedefine geç ve farkı ölç.

    '
  steps:
  - Bu modülün d aşamasındaki Replay, td_target ve soft_update'i kullan; tamponu uint8 kareler olarak
    sakla (bellek!).
  - Ortalama Q değerini sabit bir durum kümesinde izle (makale Şekil 2).
  - Pong'da ≥ +18 ortalama skor; Breakout'ta eğitim eğrisi.
  accept:
  - 'Pong: 2–5 M kare içinde öğrenme eğrisi −21''den pozitife.'
  - Tutulan durumlardaki ortalama max Q düzgün artar (makalenin gözlemi).
  - Çift DQN, Q değerlerinin aşırı kestirimini azaltır (van Hasselt 2016 Şekil 3 nitel).
- title: 'van Hasselt ve ark. (2016): Çift DQN'
  paper: van Hasselt, Guez, Silver — Deep Reinforcement Learning with Double Q-learning (AAAI 2016)
  url: https://arxiv.org/abs/1509.06461
  level: orta
  hours: 6
  goal: 'Makalenin Bölüm 3 deneyini yeniden üret: gerçek $Q_*(s,a)=V_*(s)$ (ör. $\sin s$) ve her eylem
    için ayrı polinom yaklaştırıcı (derece 6), birkaç örnek noktadan uydurulmuş; $\max_aQ_t(s,a)$ ile
    $V_*$ arasındaki fark ve çift kestirimci. Ardından d aşamasındaki DQN''yi double=False/True ile CartPole''da
    5 tohumla çalıştır ve tutulan durumlardaki Q ortalamasını gerçek getiriyle karşılaştır.

    '
  steps:
  - NumPy ile polinom uydurma; eylem sayısı 2, 10 ve 100.
  accept:
  - Eylem sayısı arttıkça tek kestirimcinin yanlılığı artar, çift kestirimci yanlılığı küçük tutar (makale
    Şekil 2).
labs:
- id: l1
  lab: baird
  title: 'Baird''in karşı örneği: ölümcül üçlü'
  goal: 'Yedi durumlu, sekiz ağırlıklı doğrusal değer fonksiyonunda bütün ödüller 0 ve doğru çözüm temsil
    edilebilir (w = 0). Politika dışı yarı-gradyan TD(0)''ın ağırlıklarının ıraksamasını izle; aynı yöntemi
    politika üstü örneklemeyle ve politika dışı gradyan-TD (TDC) ile karşılaştır.

    '
  predict:
    q: Ödüller hep 0, doğru değer her yerde 0 ve bu değer temsil edilebilir. Politika dışı yarı-gradyan
      TD(0) (γ = 0.99) 1000 adımda ağırlıklara ne yapar?
    options:
    - t: 'Sıfıra götürür: doğru çözüm temsil edilebilir'
      why: Temsil edilebilirlik yakınsamayı güvence etmez.
    - t: Iraksatır
      ok: true
      why: ‖w‖ 10'dan 336'ya; 5000 adımda 10⁶'yı geçiyor.
    - t: Başladığı yerde bırakır
      why: 'Güncellemeler sıfır değil: TD hataları γv(s'') − v(s).'
  presets:
  - name: Politika dışı TD, γ = 0.99
    params:
      alg: 0
      g: 0.99
      alpha: 0.01
      N: 1000
    note: ‖w‖ = 336.
  - name: Uzun koşu
    params:
      alg: 0
      g: 0.99
      alpha: 0.01
      N: 5000
    note: ‖w‖ ≈ 2·10⁶.
  - name: Küçük adım
    params:
      alg: 0
      g: 0.99
      alpha: 0.005
      N: 1000
    note: Daha yavaş ama yine ıraksıyor (85).
  - name: γ = 0.8
    params:
      alg: 0
      g: 0.8
      alpha: 0.01
      N: 1000
    note: Bu adım sayısında ıraksama görünmüyor.
  - name: Politika üstü TD
    params:
      alg: 1
      g: 0.99
      alpha: 0.01
      N: 1000
    note: İlk geçişten sonra yalnız alt durum ziyaret edilir; üst değerler belirlenmez.
  - name: TDC
    params:
      alg: 2
      g: 0.99
      alpha: 0.01
      N: 5000
    note: Iraksamıyor; değer hatası ≈ 1.6'da dalgalanıyor.
  questions:
  - q: Küçük bir öğrenme oranı neden ıraksamayı önlemiyor, yalnız geciktiriyor?
    a: 'Beklenen yarı-gradyan TD güncellemesi w ← w + α(b − Aw) biçimindedir. Politika dışı dağılımda
      A matrisinin negatif reel kısımlı özdeğerleri vardır: I − αA''nın bir özdeğeri 1''den büyüktür ve
      her α > 0 için o yönde üstel büyüme olur. α yalnız büyüme hızını belirler. Politika üstü dağılımda
      A pozitif tanımlıdır ve yeterince küçük α ile güncelleme bir büzülmedir.'
  limits: Sutton & Barto Örnek 11.1'in örneklemeli sürümü; önem örneklemesi ρ ∈ {0, 7}; TDC'de β = 5α.
    Ağırlıklar 10¹² aşınca simülasyon durduruluyor.
- id: l2
  lab: replaylab
  title: 'Deneyim tekrarı: ilişkili örneklerden öğrenmek'
  goal: 'Durum [0, 1] aralığında yavaşça ileri geri kayarken bir fonksiyonu gürültülü örneklerden öğren.
    Yalnız son örnekle güncellenen çevrimiçi SGD''yi, son N örneği tutan bir tampondan düzgün mini yığınlar
    çeken deneyim tekrarıyla karşılaştır; hata bütün aralıkta ölçülüyor.

    '
  predict:
    q: Küresel (Fourier) özniteliklerle ve aynı sayıda güncellemeyle, son 2000 adımda bütün aralıktaki
      hatayı hangisi daha düşük tutar?
    options:
    - t: 'Çevrimiçi SGD: her zaman en taze örneği kullanıyor'
      why: En taze örnek yalnız o anki bölgeyi temsil ediyor (0.29).
    - t: Deneyim tekrarı
      ok: true
      why: '0.013: mini yığın yakın geçmişin bütün bölgelerini içeriyor.'
    - t: 'Aynı: aynı veriyi görüyorlar'
      why: Aynı veri, farklı sıra ve tekrar sayısı.
  presets:
  - name: Küresel öznitelik
    params:
      feat: 1
      P: 2000
      lr: 0.1
      N: 2000
      B: 16
      T: 6000
    note: Çevrimiçi 0.29, tekrar 0.013.
  - name: Yerel öznitelik
    params:
      feat: 0
      P: 2000
      lr: 0.1
      N: 2000
      B: 16
      T: 6000
    note: Çevrimiçi 0.48 (yavaş), tekrar 0.013.
  - name: Hızlı kayma
    params:
      feat: 1
      P: 200
      lr: 0.1
      N: 2000
      B: 16
      T: 6000
    note: 'Çevrimiçi de iyi: 0.037.'
  - name: Küçük adım
    params:
      feat: 1
      P: 2000
      lr: 0.02
      N: 2000
      B: 16
      T: 6000
    note: 'Çevrimiçi 0.017: küçük adımlar ilişkiyi ortalıyor.'
  - name: Tek örnekli tekrar
    params:
      feat: 1
      P: 2000
      lr: 0.1
      N: 2000
      B: 1
      T: 6000
    note: 'B = 1 bile 0.034: kazancın çoğu karıştırmadan.'
  - name: Küçük tampon
    params:
      feat: 1
      P: 2000
      lr: 0.1
      N: 100
      B: 16
      T: 6000
    note: Bu basit problemde 100'lük tampon da yetiyor (0.022).
  questions:
  - q: Tek örnekli tekrar (B = 1) çevrimiçi SGD ile aynı sayıda gradyan hesaplar. Yine de hata neden sekiz
      kat düşük?
    a: 'Fark örneklerin sırasındadır. Çevrimiçi SGD ardışık, neredeyse aynı x''lerle güncellenir: gradyanlar
      aynı yöne iter ve küresel özniteliklerde o an bulunulan bölgeye aşırı uyulur, uzak bölgeler bozulur.
      Tampondan düzgün çekilen örnekler yakın geçmişin bütün dağılımından gelir; ardışık güncellemeler
      birbirinden bağımsıza yakındır ve SGD''nin varsaydığı i.i.d. koşula yaklaşılır. Mini yığın (B >
      1) bunun üstüne varyansı azaltır ve her örneği birçok kez kullanır.'
  limits: 'Gözetimli bir benzer: hedef sabit bir fonksiyon (bootstrapping yok), doğrusal model, 20 öznitelik;
    kayma sinüs biçiminde. DQN''deki hareketli hedef ve hedef ağın etkisi bu deneyde yok.'
