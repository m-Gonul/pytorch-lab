  goal: Kernel hedefleri katsayı sanmak
  needs: Bölüm 9 konu anlatımı
  q: X=(1,2),g=(1,0),sorgu 3. Bir öğrenci dot-kernel hedef toplamının OLS ile aynı olduğunu söylüyor. OLS, ham toplam
    ve normalize ortalamayı karşılaştırın. Kendi öğretim sorumuz.
  hints:
  - Önce gösterimin boyutlarını ve varsayımları yazın.
  solution: 'OLS w=(1²+2²)⁻¹(1 × 1+2 × 0)=.2→.6. Ham kernel toplamı 3; normalize toplam 3/(3+6)=1/3. Doğru ridge/OLS
    dual karşılıkta katsayılar öğrenilir: λ>0 için β=(K+λI)⁻¹g ve w=Xᵀβ; ham g doğrudan β değildir. Örneğin λ1 için
    primal ve dual.5 verir.'
  rubric:
  - .6 /3 /1⁄3 üç farklı sonuç
  - Öğrenilen dual katsayıların gereği
- id: p14
  type: yorumla
  level: 2
  title: İlgi 0 olan durumu neden öğrenelim?
  goal: İlgi 0 olan durumu neden öğrenelim?
  needs: Bölüm 9 konu anlatımı
  q: Örnek 9.4 zincirinde ilgi yalnız S 1 için 1. İki adımlı TD neden S 3 değerini de güncellemelidir? Yalnız ilgi
    ve vurgu sonuçlarını ayırın. Kaynak örneğinden kendi öğretim sorumuz.
  hints:
  - Önce gösterimin boyutlarını ve varsayımları yazın.
  solution: İlk durumun 2-adım hedefi 2+w 2 olduğu için S 3 değerine ihtiyaç vardır. Yalnız Iile S 3 güncellenmez;
    w 2 başlangıç 0 kalır ve w 1→2. M=I+M_(t−2), M=(1,0,1,0) üretir; S 3 hedefi 2 ile w 2→2, sonra w 1→4. Düz 2-adım(3.5,1.5),
    vurgulu 2-adım(4,2). Azalan adım limitleri, sonlu koşu sayılarıyla karıştırılmaz.
  rubric:
  - Bootstrap edilen S 3
  - M=(1,0,1,0)
  - Yalnız I:2; vurgu:4 başlangıç değeri
pitfalls:
- wrong: Doğrusal fonksiyon yaklaşımıyla Q-öğrenme her zaman yakınsar; ıraksama yalnız sinir ağlarında olur.
  right: Baird'in karşı örneğinde doğrusal politika dışı TD bile ıraksar. Ölümcül üçlü (yaklaşım + bootstrapping
    + politika dışı) doğrusal modellerde de geçerlidir.
- wrong: Q-öğrenmenin güncellemesi kare TD hatasının gradyan inişidir.
  right: 'Hedefin türevi alınmaz: yöntem yarı-gradyandır ve hiçbir fonksiyonun inişi değildir. Bu yüzden gradyan
    inişinin yakınsama güvenceleri geçerli değildir.'
- wrong: 2013 DQN makalesi deneyim tekrarı ve hedef ağ kullandı.
  right: 2013 makalesinde ayrı bir hedef ağ yoktur; hedef aynı parametrelerle hesaplanır. Hedef ağ (C = 10 000)
    2015 Nature sürümünde gelir.
- wrong: Deneyim tekrarı yalnız veri verimliliği içindir.
  right: Asıl kazançlardan biri ardışık örneklerin ilişkisini kırmaktır; tek örnekli tekrar bile çevrimiçi SGD'den
    çok daha düşük hata verir (lab l2). Ayrıca politika ile veri dağılımı arasındaki geri besleme döngüsünü yumuşatır.
- wrong: TD sabit noktası minimum VE çözümüdür.
  right: Genelde farklıdır; aynı 10 grupta popülasyon kökVE .1167353, MCminimumu .0543770.
- wrong: εI bütün LSTD matrislerini terslenebilir yapar.
  right: Nonsimetrik TD dış çarpımlarında tekillik olabilir; payda denetlenir.
- wrong: Dot-kernel ham hedef toplamı doğrusal regresyondur.
  right: OLS/ridge eşdeğerliği öğrenilmiş dual katsayı ister.
- wrong: 1/(τn),τsunumda hedefi istenen doğrulukta öğrenmeyi garantiler.
  right: Zaman sabiti kuralıdır; τ10 ise 10 sunum sonrası .9^10 hata kalır.
whatif:
- q: Ödül kırpılmasaydı?
  a: Oyundan oyuna puan ölçekleri (Pong'da ±1, Seaquest'te yüzler) gradyan büyüklüklerini çok farklı yapar; tek
    bir öğrenme oranı her oyunda çalışmaz. Kırpma bunu çözer ama ajan büyük ve küçük ödülü ayıramaz. Sonraki çalışmalar
    (Pop-Art, 2016) hedefleri uyarlamalı olarak normalize ederek kırpmadan aynı kararlılığı sağlar.
- q: Hedef ağ her adımda güncellenseydi (C = 1)?
  a: 'Hedef ağ olmayan duruma döner: her gradyan adımı hedefi de kaydırır ve geri besleme döngüsü kararsızlık yaratabilir.
    Çok büyük C ise yeni bilginin hedefe geç yansıması demektir: öğrenme yavaşlar. Pratik değerler 10³–10⁴ adım
    ya da yumuşak güncellemede τ ≈ 0.005.'
- q: Eylem uzayı sürekli olsaydı (ör. robot eklem torkları)?
  a: 'max_a Q(s, a) her adımda bir eniyileme problemi olur ve DQN doğrudan uygulanamaz. Çözümler: eylem uzayını
    ızgaraya bölmek (boyutla üstel büyür), ya da max''ı öğrenilmiş bir aktörle yaklaşmak (DDPG, TD3, SAC: aktör–eleştirmen,
    M11.9).'
- q: Özellik sütunları bağımlı olsaydı?
  a: Atekil olabilir; aynı değeri veren ağırlıklar tek değildir. Ters yerine uygun altuzay veya sözde ters koşulları
    açıklanır.
- q: İlgi yalnız başlangıçta olsa ve 2-adımda M yerine I kullansaydık?
  a: Bootstrap edilen üçüncü durum öğrenilmez; başlangıç tahmini 4 yerine 2 ye gider.
- q: Hash bütün aktif karoları tek kovada birleştirseydi?
  a: Sayılı φ=n, norm n²; tam adım 1/n². İlgisiz bölgeler aynı ağırlığı paylaşır.
