id: m9-6-edges
code: M9.6
title: Kenar tespiti — Kirsch, Marr-Hildreth, Canny
phase: 9
minutes: 420
prereq: [m9-4-sharpening]
summary: >
  Kenar modelleri (basamak, rampa, çatı), gürültünün türevleri nasıl bozduğu,
  gradyan operatörleri ve pusula (Kirsch) çekirdekleri; Laplacian of Gaussian
  ile sıfır geçişleri (Marr-Hildreth) ve Canny'nin dört adımı. Elle Sobel,
  yön nicemleme, çekirdek boyutu ve histerezis; saf Python'da non-maxima
  suppression, histerezis ve sıfır geçişleri; NumPy'da `cv2.Canny` ile
  piksel piksel aynı Canny; PyTorch'ta gürültülü basamaklardan öğrenilen
  1-B filtrenin Gauss türevine dönüştüğünü (Canny'nin optimallik sonucu)
  görüyor; en sonda tüm toplu işi GPU'ya uygun tensör işlemleriyle yapan
  ve yine `cv2.Canny` ile birebir aynı sonuç veren bir Canny yazıyorsun.
goals:
  - "Birinci türevin büyüklüğü kenarın varlığını, ikinci türevin işareti kenarın hangi tarafında olduğunu söyler"
  - "[[LoG]] ve [[sıfır geçişi]]: ölçeğe ayarlanabilir, yönden bağımsız kenar"
  - "Canny: Gauss + gradyan + [[non-maxima suppression]] + [[histerezis eşikleme]]"
  - "OpenCV Canny'nin tamsayı aritmetiğiyle yön nicemlemesini birebir tekrar üretmek"
sources:
  - {title: "Gonzalez & Woods — Digital Image Processing, Bölüm 10.2", url: "https://www.imageprocessingplace.com/", license: "©", use: link}
  - {title: "Canny — A Computational Approach to Edge Detection (IEEE PAMI 1986)", url: "https://doi.org/10.1109/TPAMI.1986.4767851", license: "©", use: link}
  - {title: "Marr & Hildreth — Theory of Edge Detection (Proc. R. Soc. B 1980)", url: "https://doi.org/10.1098/rspb.1980.0020", license: "©", use: link}
  - {title: "OpenCV — imgproc/src/canny.cpp", url: "https://github.com/opencv/opencv/blob/4.x/modules/imgproc/src/canny.cpp", license: "Apache-2.0", use: adapt}
  - {title: "scikit-image — hough_line", url: "https://scikit-image.org/docs/stable/api/skimage.transform.html#skimage.transform.hough_line", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "Sobel (OpenCV yönü: x sağa, y aşağı), yama $\\begin{bmatrix}0&0&50\\\\0&50&100\\\\50&100&100\\end{bmatrix}$, merkezde"
      fields:
        - {id: gx, label: "$g_x$", answer: 300}
        - {id: gy, label: "$g_y$", answer: 300}
        - {id: m2, label: "$M=\\sqrt{g_x^2+g_y^2}$", answer: 424.264, tol: 0.001}
        - {id: m1, label: "$|g_x|+|g_y|$ (OpenCV varsayılanı)", answer: 600}
    - title: "Canny yön nicemleme: normal açısını 0, 45, 90, 135'ten birine ata"
      fields:
        - {id: q100, label: "$\\alpha=100°$", answer: 90}
        - {id: q160, label: "$\\alpha=160°$", answer: 0}
        - {id: q30, label: "$\\alpha=-30°$ (yani 150°)", answer: 135}
    - title: "Ölçek"
      fields:
        - {id: n14, label: "$\\sigma=1.4$ için Gauss çekirdek boyutu $n$ (en küçük tek $\\ge\\lceil6\\sigma\\rceil$)", answer: 9}
        - {id: n2, label: "$\\sigma=2$ için $n$", answer: 13}
        - {id: zc, label: "$\\sigma=2$ LoG'un sıfır geçiş çemberinin yarıçapı", answer: 2.828427, tol: 0.001}
    - title: "Histerezis ve Kirsch"
      fields:
        - {id: hys, label: "NMS sonrası satır $[0, 40, 120, 60, 0, 70, 0]$, $T_L=50$, $T_H=100$, 8-komşuluk: kaç kenar pikseli kalır?", answer: 2}
        - {id: kir, label: "Kirsch K çekirdeği $\\begin{bmatrix}5&5&5\\\\-3&0&-3\\\\-3&-3&-3\\end{bmatrix}$'nin üstü 100, altı 0 olan basamaktaki yanıtı", answer: 1500}
  verify: |
    import math
    P = [[0, 0, 50], [0, 50, 100], [50, 100, 100]]
    KX = [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]
    KY = [[-1, -2, -1], [0, 0, 0], [1, 2, 1]]
    gx = sum(P[i][j] * KX[i][j] for i in range(3) for j in range(3))
    gy = sum(P[i][j] * KY[i][j] for i in range(3) for j in range(3))
    q = lambda a: [0, 45, 90, 135, 0][int(((a % 180) + 22.5) // 45)]
    odd = lambda s: math.ceil(6 * s) + (1 - math.ceil(6 * s) % 2)
    row, lo, hi = [0, 40, 120, 60, 0, 70, 0], 50, 100
    keep = {i for i, v in enumerate(row) if v >= hi}
    changed = True
    while changed:
        changed = False
        for i, v in enumerate(row):
            if lo <= v < hi and i not in keep and ({i - 1, i + 1} & keep):
                keep.add(i); changed = True
    K = [[5, 5, 5], [-3, 0, -3], [-3, -3, -3]]
    S = [[100] * 3, [0] * 3, [0] * 3]
    answers = dict(gx=gx, gy=gy, m2=math.hypot(gx, gy), m1=abs(gx) + abs(gy), q100=q(100), q160=q(160), q30=q(-30),
                   n14=odd(1.4), n2=odd(2.0), zc=math.sqrt(2) * 2, hys=len(keep),
                   kir=sum(K[i][j] * S[i][j] for i in range(3) for j in range(3)))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Kirsch pusula çekirdekleri: 8 yön, en güçlü yanıt", engine: browser}
  - {id: x2, title: "Hough dönüşümü: kenarlardan doğrulara", engine: browser}
  - {id: x3, title: "Gürültü türevleri ve LoG çekirdeğinin iki yolu", engine: browser}

quiz:
  - q: "Canny neden tek eşik yerine iki eşik (histerezis) kullanır?"
    options:
      - {t: "Güçlü kenarlara bağlı zayıf pikselleri tutup yalnız başına kalan zayıf yanıtları atarak hem kopuklukları hem sahte kenarları azaltmak için", ok: true, why: "Tek eşik düşükse sahte kenar, yüksekse kopuk kenar verir; bağlantı bilgisi ikisini birden azaltır."}
      - {t: "İki farklı yönü ayırmak için", why: "Yön NMS'te kullanılır."}
      - {t: "Gürültüyü yumuşatmak için", why: "Yumuşatma ilk adımdaki Gauss'un işidir."}
  - q: "Laplacian of Gaussian'ın Sobel'e göre avantajı nedir?"
    options:
      - {t: "Yönden bağımsızdır (izotropik) ve σ ile istenen ölçeğe ayarlanabilir", ok: true, why: "Marr ve Hildreth'in iki şartı: türev operatörü olmak ve ölçeğe ayarlanabilmek."}
      - {t: "Gürültüye hiç duyarlı değildir", why: "İkinci türev gürültüyü daha çok büyütür; Gauss bu yüzden var."}
      - {t: "Kenar yönünü de verir", why: "Laplacian skalerdir, yön vermez."}
  - q: "Non-maxima suppression ne yapar?"
    options:
      - {t: "Gradyan yönü boyunca iki komşusundan küçük olan büyüklükleri sıfırlayarak kalın kenar sırtlarını inceltir", ok: true, why: "Canny'nin 'tek kenar noktası yanıtı' hedefine hizmet eder."}
      - {t: "Kenar boyunca komşularla karşılaştırır", why: "Kenara dik, yani gradyan yönünde karşılaştırılır."}
      - {t: "Zayıf kenarları siler", why: "Bu histerezisin işidir."}

homework:
  - title: "HED: derin denetimli bütünsel kenar tespiti"
    paper: "Xie & Tu — Holistically-Nested Edge Detection (ICCV 2015)"
    url: "https://arxiv.org/abs/1504.06375"
    level: ileri
    hours: 14
    goal: |
      VGG16 omurgasının beş aşamasından yan çıkışlar (side outputs) alan, her birine sınıf dengeli ikili çapraz entropi uygulayan ve öğrenilen ağırlıklarla birleştiren HED'i uygula; BSDS500 üzerinde eğitip ODS/OIS F-ölçüsünü Canny ile karşılaştır.
    steps:
      - "BSDS500'ü indir; çoklu insan etiketini ortalayıp eşiğe göre ikili etiket üret."
      - "Yan çıkışlar: 1 × 1 konvolüsyon + transposed conv ile tam çözünürlüğe getir; sınıf dengeli kayıp $\\beta=|Y_-|/|Y|$."
      - "Birleşim katmanı (fuse) ve derin denetim (deep supervision) kayıplarını topla."
      - "Değerlendirme: tahmini NMS ile incelt (bu modüldeki NMS'i yeniden kullan), toleranslı eşleştirmeyle ODS ve OIS hesapla."
    accept:
      - "BSDS500 testinde ODS ≥ 0.75 (makale 0.782); Canny satırı da tabloda."
      - "Derin denetim kapalıyken ve açıkken eğitim eğrileri karşılaştırılmış."
      - "Yan çıkışların görselleri: sığ katmanların ince, derin katmanların kaba kenarlar verdiği gösterilmiş."

labs:
  - id: l1
    lab: edgeop
    title: "Gradyan operatörleri: yön yanıtı ve eşiklenmiş kenar haritası"
    goal: |
      Roberts, Prewitt, Sobel ve Kirsch'i karşılaştır. İdeal bir basamağın 0–180° arasında döndürülmesiyle ölçülen yön yanıtında L2 büyüklük ile |g_x| + |g_y| yaklaşımının farkını gör; gürültülü bir desende eşiklenmiş gradyanın neden kalın ve kopuk kenarlar verdiğini F1 ile ölç.
    predict:
      q: "Sobel ile |g_x| + |g_y| kullanınca 45°'lik bir kenarın yanıtı, 0°'lik kenarınkinin kaç katı olur?"
      options:
        - {t: "≈ 1", why: "Bu L2 büyüklük için doğru (1–1.04)."}
        - {t: "≈ 1.41", ok: true, why: "İki bileşen 1/√2'şer; toplamları √2. Ölçülen en büyük 1.43."}
        - {t: "≈ 0.71", why: "Bu Roberts + L1'in 45°'deki değeri: Roberts'ın bileşenleri köşegen yönlerdedir."}
    presets:
      - {name: "Sobel L2", params: {op: 2, L1: 0, s: 0, noise: 10, t: 20}, note: "Yön yanıtı 1–1.04; kenar haritası 1650 piksel (gerçek 488), F1 0.89."}
      - {name: "Sobel L1", params: {op: 2, L1: 1}, note: "Yön yanıtı 45° civarında 1.43'e çıkıyor."}
      - {name: "Roberts L1", params: {op: 0, L1: 1}, note: "Tersine: 45°'de 0.70. Gürültüye en duyarlısı: F1 0.56."}
      - {name: "Kirsch", params: {op: 3}, note: "8 çekirdeğin en büyüğü; yön yanıtı 0.91–1.03."}
      - {name: "Roberts + Gauss σ = 1.5", params: {op: 0, L1: 0, s: 1.5}, note: "Önce düzleştirmek Roberts'ın F1'ini 0.62'den 0.79'a çıkarıyor."}
      - {name: "Yüksek eşik", params: {op: 2, t: 40}, note: "Kesinlik 0.99 ama duyarlılık 0.78: zayıf kenarlar kopuyor."}
    questions:
      - q: "Gürültüsüz desende bile Sobel + eşik neden gerçeğin üç katı kenar pikseli veriyor?"
        a: "Bulanık (rampa) bir kenarda gradyan büyüklüğü birkaç piksel boyunca eşiğin üstündedir: kenar kalın çıkar. İnceltme için yerel maksimumları seçen NMS gerekir."
    limits: "96 × 96 yapay desen ve tek bir mercek bulanıklığı; yön yanıtı yumuşatılmış ideal bir basamakta, dört alt-piksel fazın ortalaması."
  - id: l2
    lab: cannylab
    title: "Canny, Marr–Hildreth ve tek eşik"
    goal: |
      Aynı gürültülü desende Canny'nin aşamalarını tek tek gör (düzleştirme, gradyan, NMS, güçlü/zayıf, son kenarlar); Marr–Hildreth'in sıfır geçişleri ve Sobel + tek eşikle karşılaştır. Kesinlik, duyarlılık, F1 ve bağlı bileşen sayısıyla (desende 4 nesne var) ölç.
    predict:
      q: "Canny'de T_H = 12 sabitken T_H/T_L oranını 2.5'ten 1'e indirirsen (histerezis yok) ne olur?"
      options:
        - {t: "Hiçbir şey", why: "Zayıf pikseller artık kabul edilmiyor."}
        - {t: "Kenarlar kopar: duyarlılık 0.996 → 0.939, bileşen 4 → 9", ok: true, why: "Histerezis güçlü piksellere bağlı zayıfları ekleyerek boşlukları kapatıyordu."}
        - {t: "Sahte kenarlar artar", why: "Tersine: daha az piksel kabul ediliyor."}
    presets:
      - {name: "Canny varsayılan", params: {m: 0, noise: 10, s: 1.4, th: 12, ratio: 2.5, stage: 4}, note: "F1 0.998, 512 piksel (gerçek 488), 4 bileşen."}
      - {name: "NMS öncesi", params: {m: 0, stage: 1}, note: "Gradyan büyüklüğü: geniş sırtlar."}
      - {name: "Güçlü ve zayıf", params: {m: 0, stage: 3}, note: "Beyaz güçlü (476), gri zayıf (38); histerezis zayıfları yalnız güçlülere bağlıysa tutuyor."}
      - {name: "Histerezis yok", params: {m: 0, ratio: 1}, note: "Duyarlılık 0.939, 9 bileşen: kenarlar kopuyor."}
      - {name: "Büyük σ", params: {m: 0, s: 3}, note: "Tepe gradyan düşüyor; aynı eşiklerle iki nesne kayboluyor (duyarlılık 0.50). σ büyüyünce eşikler de düşürülmeli."}
      - {name: "Güçlü gürültü", params: {m: 0, noise: 25}, note: "F1 0.964, 6 bileşen; NMS sonrası zayıf piksel 38'den 476'ya çıkıyor."}
      - {name: "Marr–Hildreth, gürültüsüz", params: {m: 1, noise: 0, s: 1.4, zt: 4}, note: "F1 0.987 ama 1133 piksel: karşılıklı komşu kuralı kenarı iki piksel kalın işaretler."}
      - {name: "Marr–Hildreth, gürültü 10", params: {m: 1, noise: 10, zt: 4}, note: "5404 piksel, kesinlik 0.21: gürültünün sıfır geçişleri. Eşik %20'de kesinlik 0.55 ama 204 parça."}
      - {name: "Sobel + tek eşik", params: {m: 2, th: 12}, note: "1549 piksel, F1 0.87: NMS olmadan kalın kenarlar."}
    questions:
      - q: "Marr–Hildreth gürültüde neden Canny'den çok daha kötü?"
        a: "Sıfır geçişi yalnız işaret değişimine bakar; gürültü düz bölgelerde LoG'un işaretini sürekli değiştirir. Eşik bunları farkın büyüklüğüyle ayıklamaya çalışır ama gerçek kenarları da parçalar. Canny ise büyüklüğe bakar (düz bölgede küçük), NMS ile inceltir ve histerezisle bağlantıyı korur."
    limits: "Tek bir yapay desen, beyaz Gauss gürültüsü; NMS kayan noktalı atan2 ile (OpenCV'nin tamsayı kuralı değil); inceltme adımı yok."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Sobel ve açının nicemlenmesi
    goal: Gradyanı ve NMS yönünü bulmak
    needs: Sobel çekirdekleri, 180° modunda dört aralık
    q: |-
      Yama $\begin{bmatrix}10&10&10\\10&10&10\\90&90&90\end{bmatrix}$ (OpenCV yönü). Merkezde $g_x$, $g_y$, açı ve NMS yönü?
    solution: |-
      $g_x=0$ (sağ ve sol sütun aynı), $g_y=(90+180+90)-(10+20+10)=320$. Açı $\operatorname{atan2}(320,0)=90°$: normal aşağı doğru, kenar yataydır; NMS üst ve alt komşuları karşılaştırır.
  - id: p2
    type: hesap
    level: 1
    title: LoG'un sıfır çemberi
    goal: Sıfır geçişi yarıçapını hesaplamak
    needs: $x^2+y^2=2\sigma^2$
    q: |-
      $\sigma=3$ için LoG'un sıfır geçiş çemberinin çapı (piksel, 3 basamak)?
    answer: 8.485
    calc: "round(2*sqrt(2)*3, 3)"
    tol: 0.001
    mistakes:
      - {answer: 12.0, msg: "Slaydın yazdığı 2σ yarıçapı; doğrusu √2σ."}
      - {answer: 4.243, msg: "Bu yarıçap; çap iki katı."}
    hints:
      - "Yarıçap $\\sqrt2\\sigma$."
    solution: |-
      Yarıçap $3\sqrt2=4.243$, çap $8.485$.
  - id: p3
    type: hesap
    level: 1
    title: Gauss çekirdek boyutu
    goal: ⌈6σ⌉ kuralını uygulamak
    needs: En küçük tek tamsayı $\ge\lceil6\sigma\rceil$
    q: |-
      $\sigma=2.6$ için $n$?
    answer: 17
    calc: "(lambda c: c + (1 - c % 2))(math.ceil(6*2.6))"
    tol: 0
    mistakes:
      - {answer: 16, msg: "⌈15.6⌉ = 16 çift; bir sonraki tek sayı."}
      - {answer: 15, msg: "15 < 15.6: çekirdek LoG'u keser."}
    hints:
      - "$6\\cdot2.6=15.6$."
    solution: |-
      $\lceil15.6\rceil=16$, en küçük tek $\ge16$: 17.
  - id: p4
    type: hesap
    level: 2
    title: Histerezis
    goal: Bağlantıyla zayıf pikselleri seçmek
    needs: $T_L$, $T_H$, 8-komşuluk
    q: |-
      NMS sonrası satır $[30, 110, 70, 55, 20, 80, 130, 45]$, $T_L=50$, $T_H=100$, tek satır (komşular sol ve sağ). Kaç kenar pikseli kalır?
    answer: 5
    calc: "5"
    tol: 0
    mistakes:
      - {answer: 2, msg: "Bu yalnız güçlüler (110, 130); bağlı zayıflar eklenmeli."}
      - {answer: 6, msg: "45 < T_L: zayıf bile değil."}
    hints:
      - "Güçlüler 110 ve 130. Hangi zayıflar onlara bitişik bir zincirle bağlı?"
    solution: |-
      110'dan sağa 70 ve 55 (55 ≥ 50) bağlı; 20 zinciri keser. 130'un solundaki 80 bağlı; 45 < 50. Toplam: 110, 70, 55, 80, 130 = 5.
  - id: p5
    type: yorumla
    level: 2
    title: Canny çıkışı nesneleri kaybediyor
    goal: σ ve eşik etkileşimini görmek
    needs: Tepe gradyanın σ'ya bağlılığı
    q: |-
      Gürültülü görüntülerde daha temiz kenar için Canny'nin Gauss σ'sı 1.4'ten 3'e çıkarılıyor; eşikler aynı bırakılıyor. Gürültü azalıyor ama düşük karşıtlıklı nesnelerin kenarları tamamen kayboluyor. Neden?
    choices:
      - {t: "NMS büyük σ'da çalışmaz", why: "NMS ölçekten bağımsızdır."}
      - {t: "Düzleştirme kenarı yayar ve tepe gradyanı ≈ σ ile ters orantılı düşürür; sabit T_H artık düşük karşıtlıklı kenarların tepesinin üstünde kalır", ok: true, why: "Lab l2'de σ = 3'te iki nesne kayboluyor (duyarlılık 0.50)."}
      - {t: "Histerezis 4-komşulukla çalışıyor", why: "Komşuluk değişmedi."}
    hints:
      - "Basamak yüksekliği h, toplam bulanıklık σ: tepe gradyan $h/(\\sqrt{2\\pi}\\sigma)$."
    solution: |-
      Bir $h$ basamağının σ ile düzleştirilmiş gradyan tepesi $h/(\sqrt{2\pi}\sigma)$'dır. σ'yı ≈ 2 kat artırmak tepeyi ≈ yarıya indirir; eşikler de buna göre ölçeklenmeli ya da görüntü istatistiğinden (ör. medyanın katı) seçilmelidir.
  - id: p6
    type: kanıt
    level: 3
    title: LoG = Laplasyen ∘ Gauss ve sıfır çemberi
    goal: Doğrusallığı ve türetimi göstermek
    needs: Konvolüsyonun türevle yer değiştirmesi
    q: |-
      (a) $\nabla^2(G\circledast f)=(\nabla^2G)\circledast f$ olduğunu göster. (b) $\nabla^2G$'yi türet ve sıfırlarının yarıçapı $\sqrt2\sigma$ çember olduğunu göster. (c) $\nabla^2G$'nin integralinin sıfır olduğunu göster ve bunun sabit bölgelerdeki yanıt için anlamını söyle.
    rubric:
      - "Türevin konvolüsyon integralinin içine girebildiğini (ya da Fourier'de çarpım (−ω²)Ĝf̂) kullandım"
      - "∂²G/∂x² = (x²/σ⁴ − 1/σ²)G türettim ve toplamı (x² + y² − 2σ²)/σ⁴·G olarak yazdım"
      - "Sıfırları x² + y² = 2σ² olarak buldum"
      - "∫∇²G = 0'ı (diverjans teoremi ya da Fourier'de ω = 0'da −ω²Ĝ = 0) gösterdim ve sabit bölgede yanıtın 0 olduğunu belirttim"
    hints:
      - "Fourier'de $\\nabla^2\\leftrightarrow-(\\omega_x^2+\\omega_y^2)$."
    solution: |-
      (a) $\partial^2/\partial x^2\int G(x-u,y-v)f(u,v)\,du\,dv=\int\partial^2_xG(x-u,y-v)f\,du\,dv$. (b) Türetim metindeki gibi; sıfırlar $r^2=2\sigma^2$. (c) $\widehat{\nabla^2G}(\omega)=-|\omega|^2\hat G(\omega)$, $\omega=0$'da sıfır: integral 0. Sabit $f=c$ için $(\nabla^2G)\circledast c=c\int\nabla^2G=0$; ayrık çekirdeklerde katsayılar toplamının 0 olması bu yüzden gerekir.
pitfalls:
  - wrong: "Gradyanın açısı kenarın yönüdür."
    right: "Gradyan kenara diktir; kenarın yönü α ± 90°'dir. NMS de bu yüzden normal (gradyan) yönündeki komşuları karşılaştırır."
  - wrong: "cv2.Canny görüntüyü kendi içinde Gauss ile düzleştirir."
    right: "Düzleştirmez: yalnız Sobel (apertureSize) + NMS + histerezis yapar. Gürültülü görüntüde önce GaussianBlur uygulanmalı."
  - wrong: "Canny'nin eşikleri her görüntüde aynı olabilir."
    right: "Eşikler gradyan büyüklüğünün ölçeğine bağlıdır: σ, görüntü karşıtlığı ve L1/L2 seçimi değişince eşikler de ölçeklenmeli."
  - wrong: "Sıfır geçişleri g(x, y) = 0 olan pikselleri aramakla bulunur."
    right: "Örneklenmiş, gürültülü bir görüntüde tam sıfır nadiren olur; karşılıklı komşuların işaret değişimine (ve farkın bir eşiği aşmasına) bakılır."
whatif:
  - q: "NMS'de dört yerine sekiz yön ve komşular arasında enterpolasyon kullanılsa?"
    a: "Normal yönündeki iki komşu değeri doğrusal enterpolasyonla hesaplanır: köşegene yakın açılarda inceltme daha doğru olur, kenar konumu alt piksel düzeyine yaklaşır. Maliyeti piksel başına birkaç çarpmadır."
  - q: "Histerezis 8 yerine 4-komşulukla yapılsa?"
    a: "Köşegen yönlü kenarlarda NMS sonrası pikseller yalnız köşelerinden değer; 4-komşuluk bunları bağlamaz, köşegen kenarlar kopuk ve kısa parçalara bölünür."
  - q: "Canny'nin Gauss'u yerine medyan süzgeci kullanılsa?"
    a: "Medyan darbe gürültüsünde iyi ve kenarları korur, ama doğrusal değildir: Canny'nin türetimindeki 'Gauss'un türevi' yorumu kaybolur ve köşeler yuvarlanır. Tuz-biber gürültülü görüntüde önce medyan, sonra Canny pratikte sık kullanılır."
