id: m4-2-cnn
code: M4.2
title: CNN mimarileri (LeNet → ResNet)
phase: 4
minutes: 270
prereq: [m4-1-conv, m3-6-norm]
summary: >
  Katmanları üst üste koymanın kuralları. Receptive field'ı, çıktı boyutlarını
  ve residual bağlantının gradyan akışına etkisini elle hesaplıyor, saf
  Python'da bunları yazıyor, NumPy'da 20 katmanlık düz ve residual ağlarda
  gradyan normlarını elle geri yayıyor, PyTorch'ta ResNet'in BasicBlock'unu ve
  küçük bir ResNet'i kuruyor ve en sonda çıkarım için Conv+BatchNorm
  birleştirmesini (fusion) yapıyorsun.
goals:
  - "Receptive field'ı katman katman $r\\leftarrow r+(k-1)\\cdot j$, $j\\leftarrow j\\cdot s$ ile hesaplamak"
  - "İki 3×3 katmanın bir 5×5'in receptive field'ını daha az parametreyle verdiğini göstermek (VGG fikri)"
  - "[[residual bağlantı|Residual bağlantının]] Jacobian'a birim matris ekleyerek gradyanın sönmesini nasıl engellediğini ölçmek"
  - "ResNet BasicBlock'unu (projection shortcut dahil) yazmak"
  - "Eval modunda BatchNorm'u önceki conv'a katlamak (inference fusion)"
sources:
  - {title: "He et al. — Deep Residual Learning for Image Recognition", url: "https://arxiv.org/abs/1512.03385", license: "arXiv", use: link}
  - {title: "Dive into Deep Learning §8 Modern CNNs (LeNet, VGG, ResNet)", url: "https://d2l.ai/chapter_convolutional-modern/index.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "UvA DL Tutorial 5: Inception, ResNet and DenseNet", url: "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial5/Inception_ResNet_DenseNet.html", license: "MIT", use: adapt}
  - {title: "PyTorch Tutorials — Fusing Convolution and Batch Norm", url: "https://docs.pytorch.org/tutorials/intermediate/custom_function_conv_bn_tutorial.html", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "Gradyan akışı: 10 katman, her katmanın yerel türevi $a=0.1$"
      fields:
        - {id: plain, label: "Düz: $\\prod a$", answer: 1e-10, tol: 1e-12, hint: "$0.1^{10}$"}
        - {id: res, label: "Residual $h+f(h)$: $\\prod(1+a)$", answer: 2.593742, tol: 0.001, hint: "$1.1^{10}$"}
    - title: "Receptive field (stride 1)"
      fields:
        - {id: rf2, label: "İki 3×3 conv", answer: 5, hint: "her 3×3 kenara 1 piksel ekler: $3+2$"}
        - {id: rf3, label: "Üç 3×3 conv", answer: 7}
        - {id: ratio, label: "Üç 3×3 ($C\\to C$) / bir 7×7 parametre oranı (bias yok)", answer: 0.55102, tol: 0.001, hint: "$27C^2/49C^2$"}
        - {id: rfs, label: "3×3 s1 → 3×3 s2 → 3×3 s1", answer: 9, hint: "$r$: 1→3→5, sonra jump 2 ile $5+2\\cdot2$"}
    - title: "ResNet giriş katmanları, 224×224"
      fields:
        - {id: stem, label: "7×7, stride 2, pad 3 sonrası", answer: 112, hint: "$\\lfloor(224+6-7)/2\\rfloor+1$"}
        - {id: pool, label: "ardından 3×3 max-pool, stride 2, pad 1", answer: 56}
  verify: |
    def rf(layers):
        r, j = 1, 1
        for k, s in layers:
            r += (k - 1) * j; j *= s
        return r
    out = lambda H, k, s, p: (H + 2 * p - k) // s + 1
    answers = dict(plain=0.1 ** 10, res=round(1.1 ** 10, 6), rf2=rf([(3, 1)] * 2), rf3=rf([(3, 1)] * 3), ratio=round(27 / 49, 6),
                   rfs=rf([(3, 1), (3, 2), (3, 1)]), stem=out(224, 7, 2, 3), pool=out(out(224, 7, 2, 3), 3, 2, 1))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Residual bağlantı neden 1000 katmanlık ağları bile eğitilebilir kılar?"
    options:
      - {t: "$y=x+F(x)$'in Jacobian'ı $I+J_F$; gradyan her katmanda en az birim yoldan geçer ve çarpımlar sıfıra gitmez", ok: true, why: "Gradyan, katmanları atlayan bir 'otoyol' bulur. Ayrıca ağ başlangıçta $F\\approx0$ ile kimlik fonksiyonuna yakın davranır."}
      - {t: "Parametre sayısını azaltır", why: "Shortcut parametresizdir (projection hariç); kazanç optimizasyonda."}
      - {t: "Aktivasyonları normalize eder", why: "O BatchNorm'un işi."}
  - q: "BasicBlock'ta projection shortcut (1×1 conv) ne zaman gerekir?"
    options:
      - {t: "Ana yolun çıktısı girdiyle aynı shape'te olmadığında: stride > 1 (uzamsal küçülme) ya da kanal sayısı değişince", ok: true, why: "Toplama için shape'ler eşit olmalı; 1×1 stride'lı conv hem kanalı hem çözünürlüğü eşler."}
      - {t: "Her blokta", why: "Shape korunuyorsa kimlik shortcut kullanılır (parametresiz)."}
      - {t: "Yalnız son blokta", why: "Her aşama geçişinin ilk bloğunda."}
  - q: "Conv + BN birleştirmesi neden yalnız eval modunda geçerlidir?"
    options:
      - {t: "Eval'de BN sabit running istatistiklerle bir afin dönüşümdür ve conv'un ağırlık/bias'ına katlanabilir; eğitimde istatistik batch'e bağlıdır", ok: true, why: "Çıkarımda bir kernel ve bir bellek okuma/yazma turu kazanılır. ONNX/TensorRT gibi araçlar bunu otomatik yapar."}
      - {t: "Eğitimde gradyan tanımsız olur", why: "Sorun gradyan değil, istatistiklerin sabit olmaması."}
      - {t: "Her zaman geçerlidir", why: "Train modunda çıktılar farklı olur; kontrol eval'de karşılaştırıyor."}

homework:
  - title: "He ve ark. (2016): derin artık öğrenme (ResNet)"
    paper: "He, Zhang, Ren, Sun — Deep Residual Learning for Image Recognition (CVPR 2016)"
    url: "https://arxiv.org/abs/1512.03385"
    level: orta
    hours: 10
    goal: |
      Makalenin Şekil 6 deneyini CIFAR-10'da tekrarla: 20, 32, 56 katmanlı 'düz' ağlar ve aynı derinlikte ResNet'ler (Bölüm 4.2 mimarisi: 3 aşama, 16/32/64 kanal). Düz ağlarda derinlik arttıkça eğitim hatasının da arttığını (bozulma problemi) ve artık bağlantıların bunu çözdüğünü göster. Kestirme türleri A (sıfır dolgu) ve B (izdüşüm) karşılaştırması ve katman yanıtlarının std'si (Şekil 7) ekle.
    steps:
      - "Aynı öğrenme oranı takvimi: 0.1, 32k ve 48k adımda 10'a böl (ya da ölçekli sürümü)."
    accept:
      - "Düz-56'nın eğitim hatası düz-20'den yüksek; ResNet-56 düşük."
      - "Artık bloklarda yanıt std'leri daha küçük."
  - title: "LeCun ve ark. (1998): LeNet-5"
    paper: "LeCun, Bottou, Bengio, Haffner — Gradient-Based Learning Applied to Document Recognition (Proc. IEEE 1998)"
    url: "http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf"
    level: başlangıç
    hours: 6
    goal: |
      LeNet-5'i makaledeki ayrıntılarla yaz: C3'ün kısmi bağlantı tablosu (Tablo I), ölçekli tanh (1.7159 tanh(2x/3)), S katmanlarındaki eğitilebilir katsayı ve bias, RBF çıkış katmanı (ya da softmax ile karşılaştır). MNIST'te test hatasını (makale: %0.95) ve veri artırmanın etkisini (Şekil 9) ölç; parametre ve bağlantı sayılarını makaleyle karşılaştır.
    steps:
      - "Kısmi bağlantıyı maskelenmiş ağırlıklarla uygula."
    accept:
      - "Parametre sayıları makaleyle aynı."
      - "Test hatası %1 civarı."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Adımlı katmanlarda alıcı alan
    goal: Alıcı alanı "sıçrama" (jump) ile hesaplamak
    needs: M4.1 P4
    q: |-
      Sırasıyla: 3 × 3 konv (adım 1), 3 × 3 konv (adım 2), 3 × 3 konv (adım 1). Son katmandaki bir birimin alıcı alanı kaç piksel?
    solution: |-
      İki değişkeni katman katman izle: alıcı alan $r$ ve **sıçrama** $j$ (çıkışta komşu iki birimin girdi uzayında kaç piksel ayrık olduğu). Başlangıç $r_0=1$, $j_0=1$. Her katman: $r\leftarrow r+(k-1)\,j$, ardından $j\leftarrow j\cdot s$.

      | katman | $r$ | $j$ |
      |---|---|---|
      | 1. (k=3, s=1) | $1+2\cdot1=3$ | 1 |
      | 2. (k=3, s=2) | $3+2\cdot1=5$ | 2 |
      | 3. (k=3, s=1) | $5+2\cdot2=9$ | 2 |

      **Yorum:** adımdan **sonraki** katmanlar alıcı alanı daha hızlı büyütür (sıçrama çarpanı). Bu teorik alıcı alandır; etkin alıcı alan (gradyanın gerçekten anlamlı olduğu bölge) merkezde yoğunlaşan Gauss benzeri bir lekedir ve çok daha küçüktür (Luo ve ark. 2016).
  - id: p2
    type: hesap
    level: 1
    title: ResNet gövdesinin çıkışı
    goal: Ardışık katmanlarda çıkış boyunu izlemek
    needs: M4.1 P1
    q: |-
      224 × 224 girdi → 7 × 7 konv (adım 2, dolgu 3) → 3 × 3 maks havuzlama (adım 2, dolgu 1). Çıkışın bir kenarı?
    answer: 56.0
    calc: "((224+6-7)//2+1+2-3)//2+1"
    mistakes:
      - {answer: 112.0, msg: "Bu yalnız konvolüsyondan sonra (112); havuzlama boyu yine yarıya indirir."}
    hints:
      - "Önce $\\lfloor(224+6-7)/2\\rfloor+1$."
    solution: |-
      Konv: $\lfloor223/2\rfloor+1=112$. Havuz: $\lfloor(112+2-3)/2\rfloor+1=56$.
  - id: p3
    type: hesap
    level: 1
    title: Artık bağlantısız gradyan
    goal: Derin düz ağda gradyan sönmesini sayıyla görmek
    needs: Zincir kuralı
    q: |-
      Düz ağda her katmanın yerel türevi (Jacobian normu) yaklaşık 0.5. 10 katman geriye ulaşan gradyan oranı?
    answer: 0.0009765625
    calc: "0.5**10"
    tol: 1e-5
    mistakes:
      - {answer: 5.0, msg: "Zincir kuralında türevler çarpılır."}
    hints:
      - "$0.5^{10}$."
    solution: |-
      $0.5^{10}\approx0.001$. Artık blokta $y=x+F(x)$: $\partial y/\partial x=I+\partial F/\partial x$; $F$ küçükken çarpan ≈ 1, gradyan özdeşlik yolundan neredeyse kayıpsız akar.
  - id: p4
    type: açıkla
    level: 2
    title: Artık bağlantı neden işe yarar?
    goal: Artık öğrenmenin optimizasyon argümanını açıklamak
    needs: P3
    q: |-
      He ve ark. (2016) 56 katmanlı düz ağın 20 katmanlıdan **eğitimde** daha kötü olduğunu gördü. Bu neden aşırı uyum değildir ve artık bağlantı nasıl çözer?
    rubric:
      - "Eğitim hatasının da kötü olduğunu, yani sorunun genelleme değil optimizasyon olduğunu söyledim"
      - "Derin ağın sığ ağı (fazla katmanlar özdeşlik) taklit edebileceğini ama SGD'nin bunu bulamadığını açıkladım"
      - "F(x) = 0'ın özdeşlik vermesi sayesinde 'hiçbir şey yapmamanın' kolay olduğunu söyledim"
      - "Gradyan yolunu (P3) ve sıfır-γ başlatmayı andım"
    hints:
      - "Ekstra katmanlar özdeşlik olsaydı derin ağın eğitim hatası ne olurdu?"
    solution: |-
      Derin ağ, sığ ağın üstüne özdeşlik katmanları koyarak en az onun kadar iyi olabilir; eğitim hatası daha kötüyse optimizasyon bu çözümü bulamıyor demektir (bozulma problemi). Artık parametrizasyonda özdeşlik $F\equiv0$'dır ve küçük ağırlıklarla kolayca yakınlanır; gradyan özdeşlik yolundan tüm katmanlara ulaşır. Bloğun son BN'sinin γ'sını 0 başlatmak başlangıçta tüm blokları özdeşlik yapar (Goyal ve ark. 2017).
  - id: p5
    type: yöntem-seç
    level: 2
    title: Global ortalama havuzlama mı, tam bağlı başlık mı?
    goal: Sınıflandırma başlığını seçmek
    needs: Parametre sayımı
    q: |-
      Son öznitelik haritası 7 × 7 × 512. Sınıflandırma başlığı için düzleştirip 4096'lık tam bağlı katman mı, global ortalama havuzlama + doğrusal katman mı?
    choices:
      - {t: "Düzleştir + FC: daha çok parametre, daha çok güç", why: "7·7·512·4096 ≈ 103M parametre; aşırı uyum ve sabit girdi boyutu."}
      - {t: "Global ortalama havuzlama + doğrusal", ok: true, why: "Parametre sayısı 512·K; girdi boyutundan bağımsız, öteleme değişmezliği verir (NiN, ResNet)."}
      - {t: "Fark etmez", why: "Parametre sayısı iki mertebe farklı."}
    hints:
      - "Düzleştirilmiş vektör kaç boyutlu?"
    solution: |-
      VGG-16'nın 138M parametresinin ~%90'ı tam bağlı başlıktadır. GAP her kanalı tek sayıya indirir; başlık yalnız 512 × K. Farklı çözünürlükte girdilerle de çalışır.
pitfalls:
  - wrong: "Alıcı alan, katmanların çekirdek boylarının toplamıdır."
    right: "Adımlar sıçramayı çarpar; adımdan sonraki katmanlar alıcı alanı daha hızlı büyütür (P1)."
  - wrong: "Daha derin düz ağ her zaman en az sığ ağ kadar iyi eğitilir."
    right: "Kuramsal olarak öyle, pratikte optimizasyon bulamaz; artık bağlantı ya da normalizasyon gerekir (P4)."
whatif:
  - q: "Artık bloğun iki yolu farklı kanal sayısına sahipse?"
    a: "Atlama yoluna 1 × 1 konvolüsyon (adımlıysa adımlı) eklenir: izdüşüm kısayolu."
