id: m7-4-ddp-fsdp
code: M7.4
title: "Dağıtık eğitim: DDP, all-reduce, ZeRO/FSDP"
phase: 7
minutes: 300
prereq: [m6-4-memory]
summary: >
  Birden çok işçiyle eğitmek. İki işçinin all-reduce'unu, ring all-reduce'un
  iletişim hacmini ve ZeRO-3 bellek payını elle hesaplıyor, saf Python'da
  ring all-reduce'u adım adım simüle ediyor, NumPy'da veri paralel SGD'nin
  tam batch gradyanına eşit olduğunu ve optimizer durumunu işçilere bölen
  ZeRO-1 Adam'ın tek işçili Adam'la aynı sonucu verdiğini gösteriyor,
  PyTorch'ta `gloo` ile iki CPU sürecinde DDP eğitiyor ve en sonda gerçek
  kolektiflerle (all-reduce + all-gather) kendi ZeRO-1 optimizer'ını
  yazıyorsun.
goals:
  - "Veri paralelliği: gradyan ortalaması = büyük batch gradyanı"
  - "[[all-reduce]] ve ring algoritmasının bant genişliği maliyeti $2(N-1)/N$"
  - "`torch.distributed`: süreç grubu, rank, world size, kolektifler; DDP"
  - "[[ZeRO]] / FSDP: optimizer durumunu, gradyanları ve parametreleri işçilere bölmek"
sources:
  - {title: "PyTorch Tutorials — Getting Started with Distributed Data Parallel; Writing Distributed Applications", url: "https://docs.pytorch.org/tutorials/intermediate/ddp_tutorial.html", license: "BSD-3-Clause", use: adapt}
  - {title: "Li ve ark. — PyTorch Distributed: Experiences on Accelerating Data Parallel Training", url: "https://arxiv.org/abs/2006.15704", license: "arXiv", use: link}
  - {title: "Rajbhandari ve ark. — ZeRO: Memory Optimizations Toward Training Trillion Parameter Models", url: "https://arxiv.org/abs/1910.02054", license: "arXiv", use: link}
  - {title: "Zhao ve ark. — PyTorch FSDP: Experiences on Scaling Fully Sharded Data Parallel", url: "https://arxiv.org/abs/2304.11277", license: "arXiv", use: link}
  - {title: "Stanford CS336 — Assignment 2 (DDP, sharded optimizer)", url: "https://github.com/stanford-cs336/assignment2-systems", license: "MIT", use: adapt}
  - {title: "Gibiansky — Bringing HPC Techniques to Deep Learning (ring all-reduce)", url: "https://andrew.gibiansky.com/blog/machine-learning/baidu-allreduce/", license: "©", use: link}

hand:
  groups:
    - title: "İki işçi, gradyanlar $g_1=(1,3)$, $g_2=(3,5)$"
      fields:
        - {id: ar, label: "All-reduce (ortalama) sonrası 1. bileşen", answer: 2}
        - {id: batch, label: "İşçi başına batch 32, 4 işçi: eşdeğer tek batch boyutu", answer: 128}
    - title: "Ring all-reduce, $N=4$ işçi, 100 MB gradyan"
      fields:
        - {id: ring, label: "İşçi başına gönderilen veri (MB): $2(N-1)/N\\cdot100$", answer: 150}
        - {id: steps, label: "Toplam adım sayısı (reduce-scatter + all-gather)", answer: 6, hint: "$2(N-1)$"}
    - title: "1 milyar parametre, fp32 Adam (16 bayt/parametre), 8 GPU"
      fields:
        - {id: ddp, label: "DDP: GPU başına bayt", answer: 16000000000}
        - {id: z3, label: "ZeRO-3 / FSDP (her şey bölünmüş): GPU başına bayt", answer: 2000000000}
        - {id: z1, label: "ZeRO-1 (yalnız Adam durumu bölünmüş): GPU başına bayt", answer: 9000000000, hint: "$4+4+8/8$ bayt/parametre"}
  verify: |
    N, P = 4, 1e9
    answers = dict(ar=(1 + 3) / 2, batch=32 * 4, ring=2 * (N - 1) / N * 100, steps=2 * (N - 1),
                   ddp=16 * P, z3=16 * P / 8, z1=(4 + 4 + 8 / 8) * P)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Ring all-reduce'da işçi başına gönderilen veri işçi sayısı $N$ arttıkça ne olur?"
    options:
      - {t: "$2(N-1)/N\\cdot$ boyut: $N$ büyüdükçe $2\\times$'e yaklaşır, işçi sayısından neredeyse bağımsız", ok: true, why: "Bu yüzden ring (ve ağaç) algoritmaları ölçeklenir; gecikme ise adım sayısıyla ($2(N-1)$) artar."}
      - {t: "$N$ ile doğrusal artar", why: "O, her işçinin herkese gönderdiği naif yöntem."}
      - {t: "Azalır", why: "Toplam iş bölünür ama işçi başına hacim ~2× sabite gider."}
  - q: "DDP, geri geçiş bitmeden all-reduce'a nasıl başlayabilir?"
    options:
      - {t: "Gradyanları kovalara (bucket) gruplar; bir kovadaki tüm gradyanlar hazır olunca (autograd hook'u) o kovanın all-reduce'unu başlatır, geri geçiş sürerken iletişim örtüşür", ok: true, why: "Kova boyutu (`bucket_cap_mb`) iletişim çağrısı sayısı ile örtüşme arasında bir denge."}
      - {t: "Gradyanları tahmin eder", why: "Kesin gradyanlar; yalnız zamanlama örtüşür."}
      - {t: "Başlayamaz; her zaman sonra yapar", why: "Örtüşme DDP'nin ana optimizasyonu."}
  - q: "FSDP (ZeRO-3) ileri geçişte bir katmanı hesaplamak için ne yapar?"
    options:
      - {t: "O katmanın parametre parçalarını tüm işçilerden all-gather ile toplar, hesaplar, sonra tam kopyayı serbest bırakır", ok: true, why: "Bellek yerine iletişim harcar: parametreler kalıcı olarak yalnız $1/N$ boyutunda tutulur."}
      - {t: "Her işçi farklı katmanları hesaplar", why: "O, pipeline paralelliği."}
      - {t: "Parametreleri hiç toplamaz", why: "Hesap için tam katman ağırlığı gerekir."}

homework:
  - title: "Rajbhandari ve ark. (2020): ZeRO"
    paper: "Rajbhandari, Rasley, Ruwase, He — ZeRO: Memory Optimizations Toward Training Trillion Parameter Models (SC 2020)"
    url: "https://arxiv.org/abs/1910.02054"
    level: ileri
    hours: 10
    goal: |
      ZeRO'nun üç aşamasını (optimizer durumu, gradyan, parametre bölümleme) torch.distributed ile CPU üzerinde gloo arka ucuyla, 4 süreçte kendin yaz: aşama 1'de her süreç parametrelerin 1/N'inin Adam durumunu tutar, reduce-scatter + all-gather ile güncelleme. Makalenin bellek formülünü (Şekil 1: (2 + 2 + K)Ψ / N) her aşamada ölçülen bellekle karşılaştır ve iletişim hacmini (aşama 1–2: DDP ile aynı, aşama 3: 1.5×) sayarak doğrula; sonuçları torch FSDP ile karşılaştır.
    steps:
      - "İletişim hacmini kolektif çağrılarda gönderilen bayt sayısıyla say."
    accept:
      - "Bellek ölçümleri formülle uyumlu."
      - "Aşamaların iletişim hacmi tablosu."
  - title: "Li ve ark. (2020): PyTorch Distributed (DDP)"
    paper: "Li ve ark. — PyTorch Distributed: Experiences on Accelerating Data Parallel Training (VLDB 2020)"
    url: "https://arxiv.org/abs/2006.15704"
    level: orta
    hours: 8
    goal: |
      DDP'nin gradyan kovalama (bucketing) ve hesap–iletişim örtüşmesini (Bölüm 3.2) kendi küçük DDP'nle yeniden üret: parametre hook'larıyla gradyanlar hazır oldukça kovaları asenkron all-reduce'a gönder. Kova boyutuna göre adım süresini ölç (makale Şekil 7); no_sync ile gradyan biriktirmenin iletişimi azalttığını göster.
    steps:
      - "register_post_accumulate_grad_hook ile kovaları doldur."
    accept:
      - "Örtüşmeli sürüm örtüşmesizden hızlı."
      - "Kova boyutu–süre grafiği."

labs:
  - id: l1
    lab: ringar
    title: "Ring all-reduce adım adım"
    goal: |
      N işçinin parça durumlarını reduce-scatter ve all-gather adımları boyunca izle: hangi işçinin hangi parçada kaç katkı topladığını gör. İşçi başına gönderilen veriyi ve α–β modeliyle süreyi merkezi sunucu yaklaşımıyla karşılaştır; gecikmenin baskın olduğu durumu bul.
    predict:
      q: "N = 4, reduce-scatter'ın sonunda (3. adım) her işçi ne tutar?"
      options:
        - {t: "Bütün vektörün toplamı", why: "Bu all-gather'dan sonra."}
        - {t: "Bir parçanın tam toplamı (diğer parçalar kısmi)", ok: true, why: "İşçi i, parça (i + 1) mod N'nin dört katkısını toplamış olur."}
        - {t: "Yalnız kendi gradyanı", why: "Bu başlangıç."}
    presets:
      - {name: "Reduce-scatter sonu", params: {N: 4, step: 3, MB: 100, alpha: 10, bw: 25}, note: "Her satırda tek bir tam parça. Toplam 6 adım, işçi başına 150 MB; ring 6.06 ms, merkezi 24.0 ms."}
      - {name: "All-gather sonu", params: {step: 6}, note: "Bütün hücreler tam toplam."}
      - {name: "8 işçi", params: {N: 8, step: 14}, note: "14 adım, işçi başına 175 MB (2 · 100'e yaklaşıyor); ring 7.1 ms, merkezi 56.0 ms."}
      - {name: "Gecikme baskın", params: {N: 16, step: 30, MB: 1, alpha: 100}, note: "1 MB, α = 100 µs: ring 3.08 ms, merkezi 1.40 ms; 30 adımlık gecikme bant tasarrufunu aşıyor."}
    questions:
      - q: "Ring all-reduce'da işçi sayısı iki katına çıkınca süre neden neredeyse değişmez?"
        a: "İşçi başına gönderilen veri 2(N − 1)/N · M, N büyüdükçe 2M'ye yaklaşır; her bağlantı eşit yük taşır ve hepsi paralel çalışır. Artan yalnız 2(N − 1)α gecikme terimidir."
    limits: "α–β modeli; topoloji, çakışma, NVLink/InfiniBand ayrımı ve ağaç algoritmaları modellenmedi."
  - id: l2
    lab: zeromem
    title: "GPU başına bellek: DDP ve ZeRO aşamaları"
    goal: |
      Parametre sayısı, GPU sayısı ve hassasiyete göre DDP, ZeRO-1, ZeRO-2 ve ZeRO-3/FSDP'de GPU başına model durumu belleğini hesapla; aktivasyonları ekleyip GPU belleğine sığıp sığmadığını ve stratejilerin iletişim bedelini gör.
    predict:
      q: "1 milyar parametre, fp32 Adam, 8 GPU, ZeRO-1. GPU başına model durumu?"
      options:
        - {t: "16 GB", why: "Bu DDP."}
        - {t: "9 GB", ok: true, why: "Ağırlık 4 + gradyan 4 + durum 8/8 = 9 bayt/parametre."}
        - {t: "2 GB", why: "Bu ZeRO-3."}
    presets:
      - {name: "El hesabı (ZeRO-3)", params: {P: 1, N: 8, prec: 0, mode: 3, act: 0, cap: 80}, note: "DDP 16, ZeRO-1 9, ZeRO-2 5.5, ZeRO-3 2 GB."}
      - {name: "El hesabı (ZeRO-1)", params: {mode: 1, act: 0}, note: "9 GB."}
      - {name: "70 milyar, 64 GPU", params: {P: 70, N: 64, prec: 1, mode: 3, act: 4}, note: "Karışık hassasiyet: DDP 1120 GB (imkânsız), ZeRO-1 297, ZeRO-2 159, ZeRO-3 21.5 GB (+ 4 GB aktivasyon) sığıyor."}
      - {name: "70 milyar, ZeRO-2", params: {P: 70, N: 64, prec: 1, mode: 2, act: 4}, note: "163 GB: 80 GB'a sığmıyor; ağırlıkların da bölünmesi gerekiyor."}
    questions:
      - q: "GPU sayısı çok büyüdüğünde ZeRO-3'ün GPU başına belleği neden yine de sıfıra inmez?"
        a: "Bölünmüş durum 16Ψ/N ile küçülür ama aktivasyonlar, geçici olarak toplanan katman parametreleri (bir FSDP biriminin tam ağırlıkları) ve iletişim tamponları bölünmez. Bu sabit kısım bir taban oluşturur."
    limits: "Aktivasyonlar sabit kabul edildi; geçici tamponlar, parçalanma ve ZeRO-3'te toplanan birimin belleği dahil değil."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: All-reduce ortalaması
    goal: Veri paralelliğinin eşdeğerliğini sayıyla görmek
    needs: Ortalama
    q: |-
      Üç işçi, eşit parçalar; yerel gradyanlar $2$, $-1$, $5$. All-reduce (ortalama) sonrası herkesin gradyanı nedir? Bu neye eşittir?
    solution: |-
      $(2-1+5)/3=2$. Parçalar eşit olduğu için bu, üç parçanın birleşiminden oluşan büyük batch'in gradyanıdır.
  - id: p2
    type: hesap
    level: 1
    title: Ring trafiği
    goal: 2(N − 1)/N kuralını uygulamak
    needs: Ring all-reduce
    q: |-
      8 işçi, 400 MB gradyan. Ring all-reduce'da işçi başına gönderilen veri (MB)?
    answer: 700
    calc: "2*7/8*400"
    tol: 1e-9
    mistakes:
      - {answer: 800, msg: "Bu N → ∞ sınırı (2M)."}
      - {answer: 350, msg: "Reduce-scatter ve all-gather'ın ikisi de sayılır: 2(N − 1)/N."}
    hints:
      - "$2\\cdot7/8\\cdot400$."
    solution: |-
      $2\cdot7/8\cdot400=700$ MB, 14 adımda.
  - id: p3
    type: hesap
    level: 1
    title: ZeRO-2 belleği
    goal: Aşama formülünü uygulamak
    needs: Bayt/parametre dökümü
    q: |-
      2 milyar parametre, fp32 Adam (4 + 4 + 8), 16 GPU, ZeRO-2. GPU başına model durumu (GB, 10⁹ bayt)?
    answer: 9.5
    calc: "2*(4 + 4/16 + 8/16)"
    tol: 1e-9
    mistakes:
      - {answer: 17.0, msg: "Bu ZeRO-1: 2 · (4 + 4 + 8/16); ZeRO-2'de gradyan da bölünür."}
      - {answer: 2.0, msg: "Bu ZeRO-3: ağırlıklar ZeRO-2'de bölünmez."}
    hints:
      - "Ağırlık 4, gradyan 4/16, durum 8/16 bayt/parametre."
    solution: |-
      $2\cdot(4+0.25+0.5)=2\cdot4.75=9.5$ GB. Kalan en büyük kalem bölünmeyen ağırlıklardır (8 GB).
  - id: p4
    type: yorumla
    level: 2
    title: DDP'de kopyalar ayrıştı
    goal: Ayrışmanın nedenini bulmak
    needs: DDP kurulumu
    q: |-
      Elle yazılmış bir veri paralel eğitimde (DDP yok, gradyanlar all-reduce ile ortalanıyor) birkaç yüz adım sonra işçilerin parametreleri farklılaşıyor. Olası neden?
    choices:
      - {t: "All-reduce yanlış toplar", why: "Kolektifler deterministiktir."}
      - {t: "Başlangıç parametreleri farklı (tohum ya da broadcast yok) ya da işçilerden birinde ek bir rastgele işlem (dropout tohumu farklıyken) parametreleri etkiliyor", ok: true, why: "Aynı gradyan farklı parametrelere uygulanınca kopyalar ayrı kalır; DDP başlangıçta rank 0'ı yayınlar."}
      - {t: "Öğrenme oranı çok küçük", why: "Ayrışmayla ilgisi yok."}
    hints:
      - "Aynı güncelleme farklı başlangıçlara uygulanırsa ne olur?"
    solution: |-
      Veri paralelliğinin varsayımı kopyaların özdeş başlaması ve özdeş güncellenmesidir. Ya başlangıçta dist.broadcast ile eşitlenmeli ya da aynı tohum kullanılmalıdır; ayrıca optimizasyon durumu ve BN istatistikleri de eşit tutulmalıdır.
  - id: p5
    type: kanıt
    level: 3
    title: Ring all-reduce'un alt sınırı
    goal: 2(N − 1)/N · M'nin optimal olduğunu göstermek
    needs: İletişim argümanı
    q: |-
      Her işçinin $M$ boyutlu bir vektörü var ve sonunda hepsi toplamı tutmalı. Her işçinin en az $\frac{N-1}NM$ veri göndermesi ve en az $\frac{N-1}NM$ veri alması gerektiğini, dolayısıyla ring'in toplam $\frac{2(N-1)}NM$'sinin sabit çarpana kadar optimal olduğunu tartış.
    rubric:
      - "Her işçinin toplamın her parçası için diğer N − 1 işçinin katkısını alması gerektiğini belirttim"
      - "Toplam alınan verinin en az (N − 1)/N · M olduğunu (parçalar dengeliyse) savundum"
      - "Simetriyle gönderilen için de aynı sınırı yazdım"
      - "Ring'in hem reduce-scatter hem all-gather'da bu sınıra ulaştığını ve toplamın 2 katı olduğunu belirttim"
    hints:
      - "Her parçanın toplamı en az bir yerde hesaplanmalı ve sonra herkese ulaşmalı."
    solution: |-
      Toplamın bir parçası bir işçide hesaplanacaksa diğer N − 1 işçinin o parçadaki katkıları oraya gitmelidir; yük dengeliyse her işçi (N − 1)/N · M alır (reduce-scatter sınırı). Sonra her işçi, kendisinde olmayan (N − 1)/N · M'lik tam toplamları almalıdır (all-gather sınırı). Ring her iki aşamada da bu sınıra ulaşır.
pitfalls:
  - wrong: "Veri paralelliği belleği N'ye böler."
    right: "Hesabı böler, belleği kopyalar; belleği bölmek için ZeRO/FSDP gerekir."
  - wrong: "All-reduce'un maliyeti işçi sayısıyla doğrusal artar."
    right: "Ring algoritmasında işçi başına bant maliyeti 2(N − 1)/N · M, N'den neredeyse bağımsızdır; artan gecikme terimidir."
  - wrong: "ZeRO-1 ve ZeRO-2 ek iletişim getirir."
    right: "Reduce-scatter + all-gather, all-reduce ile aynı hacimdir (2Ψ); ek iletişim yalnız ZeRO-3'tedir (3Ψ)."
  - wrong: "Gradyan biriktirmede her mikro batch'te all-reduce gerekir."
    right: "Yalnız son mikro batch'te gerekir; arada model.no_sync() ile atlanır."
whatif:
  - q: "İşçiler farklı hızdaysa (yavaş bir GPU)?"
    a: "Kolektifler eşzamanlıdır; her adım en yavaş işçiyi bekler. Veri paralel eğitimin hızı en yavaş işçiyle sınırlıdır; heterojen kümelerde iş yükünü dengelemek ya da eşzamansız yöntemler gerekir."
  - q: "Kovalama yapılmasaydı?"
    a: "Her parametre ayrı bir all-reduce olurdu; küçük mesajlarda gecikme terimi baskınlaşır ve iletişim geri geçişle iyi örtüşemez. 25 MB'lık kovalar bu iki etkiyi dengeler."
  - q: "ZeRO-3'te bir katmanın parametreleri ileri geçişten sonra serbest bırakılmasaydı?"
    a: "Bellek kazancı kaybolur (toplanan parametreler birikir); geri geçişte yeniden toplamak gerekmezdi ama tepe bellek DDP'ye yaklaşırdı. FSDP'nin reshard_after_forward seçeneği bu ödünleşimi ayarlar."
