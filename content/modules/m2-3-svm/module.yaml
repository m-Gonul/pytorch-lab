id: m2-3-svm
code: M2.3
title: "SVM: hinge loss ve margin"
phase: 2
minutes: 210
prereq: [m1-4-logreg, m1-5-softmax]
summary: >
  Olasılık yerine margin. İkili ve çok sınıflı hinge kaybını elle hesaplıyor,
  saf Python'da alt-gradyanla lineer SVM eğitiyor, CS231n'in vektörize çok
  sınıflı SVM kaybını NumPy'da yazıyor, PyTorch'ta `multi_margin_loss` ile
  karşılaştırıyor ve en sonda RBF kernel matrisiyle doğrusal olmayan bir
  sınırı döngüsüz öğreniyorsun.
goals:
  - "[[hinge loss|Hinge kaybını]] $\\max(0,1-y\\,f(x))$ ve margin kavramını yorumlamak"
  - "Türevlenemeyen noktalarda [[alt-gradyan]] kullanmak"
  - "Çok sınıflı SVM kaybını ve gradyanını CS231n tarzı döngüsüz yazmak"
  - "[[kernel trick|Kernel trick]] ile özellik uzayını açıkça kurmadan doğrusal olmayan sınıflandırma yapmak"
sources:
  - {title: "CS231n — Linear classification: Multiclass SVM loss", url: "https://cs231n.github.io/linear-classify/#svm", license: "MIT", use: adapt}
  - {title: "CS231n Assignment 1 — svm_loss_naive / svm_loss_vectorized", url: "https://cs231n.github.io/assignments2025/assignment1/", license: "MIT", use: adapt}
  - {title: "Stanford CS229 — Lecture notes: Support Vector Machines, kernels", url: "https://cs229.stanford.edu/main_notes.pdf", license: "doğrulanmadı", use: link}
  - {title: "Shalev-Shwartz et al. — Pegasos: Primal Estimated sub-GrAdient SOlver for SVM", url: "https://home.ttic.edu/~nati/Publications/PegasosMPB.pdf", license: "©", use: link}

hand:
  groups:
    - title: "İkili: $w=[1,-1]$, $b=0$; $f(x)=w\\cdot x+b$, kayıp $\\max(0,1-yf(x))$"
      fields:
        - {id: m1, label: "$x=(2,1)$, $y=+1$: margin $yf(x)$", answer: 1, hint: "$2-1=1$"}
        - {id: h1, label: "… hinge", answer: 0, hint: "margin tam 1: sınırda, kayıp 0"}
        - {id: m3, label: "$x=(1,1)$, $y=+1$: margin", answer: 0, hint: "$1-1=0$"}
        - {id: h3, label: "… hinge", answer: 1, hint: "$\\max(0,1-0)$"}
        - {id: gw1, label: "… $\\partial\\ell/\\partial w_1$", answer: -1, hint: "aktifse $-y\\,x_1$"}
    - title: "Çok sınıflı (CS231n): skorlar $s=[3.2,\\,5.1,\\,-1.7]$, doğru sınıf $y=0$, $\\Delta=1$"
      fields:
        - {id: l1, label: "$\\max(0,s_1-s_0+\\Delta)$", answer: 2.9, tol: 0.001, hint: "$5.1-3.2+1$"}
        - {id: l2, label: "$\\max(0,s_2-s_0+\\Delta)$", answer: 0, tol: 0.001, hint: "$-1.7-3.2+1<0$"}
        - {id: L, label: "toplam kayıp", answer: 2.9, tol: 0.001, hint: "doğru sınıf hariç toplam"}
        - {id: nviol, label: "doğru sınıfın skor gradyanı $\\partial L/\\partial s_0$", answer: -1, hint: "ihlal eden sınıf sayısı × (−1)"}
  verify: |
    w = (1, -1)
    f = lambda x: w[0] * x[0] + w[1] * x[1]
    s = [3.2, 5.1, -1.7]
    l = [max(0, s[j] - s[0] + 1) for j in (1, 2)]
    answers = dict(m1=f((2, 1)), h1=max(0, 1 - f((2, 1))), m3=f((1, 1)), h3=max(0, 1 - f((1, 1))), gw1=-1 * 1,
                   l1=round(l[0], 6), l2=l[1], L=round(sum(l), 6), nviol=-sum(v > 0 for v in l))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Doğru sınıflandırılmış ve margin'i 1'den büyük bir örnek kayba ve gradyana ne katar?"
    options:
      - {t: "Hiçbir şey: hinge 0, gradyan 0. Model artık o örnekle ilgilenmez", ok: true, why: "Karar sınırını yalnız margin içindeki ya da yanlış taraftaki örnekler (destek vektörleri) belirler. Cross-entropy ise her örneği sonsuza kadar biraz daha iter."}
      - {t: "Küçük ama pozitif bir kayıp", why: "Cross-entropy'de öyle; hinge tam 0."}
      - {t: "Negatif kayıp", why: "max(0, ·) negatif olamaz."}
  - q: "RBF kernel $k(x,x')=e^{-\\gamma\\lVert x-x'\\rVert^2}$ hangi özellik uzayına karşılık gelir?"
    options:
      - {t: "Sonsuz boyutlu bir uzaya; ama yalnız iç çarpımlar gerektiği için o uzay hiç kurulmaz", ok: true, why: "Kernel trick: model $f(x)=\\sum_i\\alpha_ik(x_i,x)+b$ yalnız $n\\times n$ Gram matrisine ihtiyaç duyar."}
      - {t: "2. dereceden polinom özelliklerine", why: "O $k(x,x')=(x\\cdot x'+c)^2$."}
      - {t: "Orijinal uzayın kendisine", why: "O lineer kernel $x\\cdot x'$."}
  - q: "`F.multi_margin_loss` ile CS231n SVM kaybı arasındaki fark?"
    options:
      - {t: "PyTorch toplamı sınıf sayısı $C$'ye böler; CS231n bölmez", ok: true, why: "PyTorch: $\\frac1C\\sum_{j\\ne y}\\max(0,\\Delta-s_y+s_j)$. Aynı minimizer, farklı ölçek; lr'yi buna göre ayarla."}
      - {t: "PyTorch margin'i 0 alır", why: "Varsayılan `margin=1`."}
      - {t: "Fark yok", why: "Bir $1/C$ çarpanı var; kontrol bunu sınar."}

homework:
  - title: "Platt (1998): Sequential Minimal Optimization"
    paper: "Platt — Sequential Minimal Optimization: A Fast Algorithm for Training Support Vector Machines (Microsoft Research TR 1998)"
    url: "https://www.microsoft.com/en-us/research/publication/sequential-minimal-optimization-a-fast-algorithm-for-training-support-vector-machines/"
    level: ileri
    hours: 10
    goal: |
      SMO'yu sıfırdan yaz: iki Lagrange çarpanını analitik olarak güncelleme (kırpma sınırları L, H), ikinci çarpan seçme sezgisi (|E₁ − E₂| maksimum), bias güncellemesi ve KKT ihlali kontrolü. RBF çekirdekli ikili bir problemde sonucu sklearn.svm.SVC (libsvm) ile karşılaştır: aynı destek vektörleri ve karar fonksiyonu; n = 10³…10⁴ için süre ölçeklemesi.
    steps:
      - "Hata önbelleği (error cache) ekleyip etkisini ölç."
    accept:
      - "Karar fonksiyonu libsvm ile 10⁻³ içinde aynı."
      - "KKT koşulları tolerans içinde sağlanıyor."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Hinge kaybı ve alt-gradyanı
    goal: SVM'nin gradyanla nasıl eğitildiğini görmek
    needs: Intro'daki türetim kutusu, alt-gradyan
    q: |-
      $L(w)=\frac\lambda2\|w\|^2+\max(0,1-y\,w^\top x)$. Tek örnek için alt-gradyanı yaz; $x=(1,2)$, $y=+1$, $w=(0.2,0.1)$, $\lambda=0.1$ için hesapla.
    solution: |-
      **Hinge'in alt-gradyanı:** $m=y\,w^\top x$ (marj). $m<1$ ise $-yx$; $m>1$ ise 0; $m=1$'de $[-yx,0]$ aralığından herhangi biri (genelde 0 seçilir).

      **Sayılar:** $m=1\cdot(0.2+0.2)=0.4<1$ → hinge aktif. $\nabla=\lambda w-yx=(0.02,0.01)-(1,2)=(-0.98,-1.99)$. Adım $w\leftarrow w-\eta\nabla$, $w$'yi $x$ yönüne iter (marjı büyütür).

      **Yorum:** marjı 1'i aşan örnekler yalnız düzenlileştirme terimiyle $w$'yi küçültür; öğrenmeye katkı veren yalnız marjı yetersiz örneklerdir — destek vektörlerinin gradyan dilindeki karşılığı. Lojistik kayıpta ise her örnek (azalan da olsa) katkı verir.
  - id: p2
    type: hesap
    level: 1
    title: Marj genişliği
    goal: 2/‖w‖ formülünü uygulamak
    needs: Intro'daki türetim kutusu
    q: |-
      Kanonik biçimde $w=(3,4)$. Sınıflar arası şeridin genişliği?
    answer: 0.4
    calc: "2/5"
    mistakes:
      - {answer: 0.08, msg: "‖w‖² değil, ‖w‖ = 5 ile böl."}
      - {answer: 0.2, msg: "Bu sınırdan en yakın noktaya uzaklık; şerit iki yanı kapsar: 2/‖w‖."}
    hints:
      - "$\\|w\\|=5$."
    solution: |-
      $2/\|w\|=0.4$.
  - id: p3
    type: hesap
    level: 1
    title: Çok sınıflı SVM kaybı
    goal: Weston–Watkins (CS231n) kaybını hesaplamak
    needs: Hinge
    q: |-
      Skorlar $s=[3.2,\ 5.1,\ -1.7]$, doğru sınıf 0, $\Delta=1$. $L=\sum_{j\ne y}\max(0,s_j-s_y+\Delta)$?
    answer: 2.8999999999999995
    calc: "max(0,5.1-3.2+1)+max(0,-1.7-3.2+1)"
    tol: 1e-6
    mistakes:
      - {answer: 3.8999999999999995, msg: "Doğru sınıfın kendisi toplama girmez (j ≠ y); girseydi her zaman Δ eklerdi."}
      - {answer: -1.0000000000000009, msg: "Negatif terimler max(0, ·) ile sıfırlanır."}
    hints:
      - "İki terim: sınıf 1 ve sınıf 2."
    solution: |-
      $\max(0,2.9)+\max(0,-3.9)=2.9$. Yalnız sınıf 1 marjı ihlal ediyor.
  - id: p4
    type: yorumla
    level: 2
    title: C'yi büyütmek
    goal: C'nin düzenlileştirme rolünü okumak
    needs: Yumuşak marj
    q: |-
      RBF SVM'de C = 0.1 iken karar sınırı düz ve eğitim hatası %8; C = 1000 iken sınır her eğitim noktasını dolanıyor, eğitim hatası %0, doğrulama hatası arttı. Hangi yorum doğru?
    choices:
      - {t: "C büyüdükçe marj büyür", why: "Tersi: büyük C ihlalleri pahalı yapar, dar marjı kabul eder."}
      - {t: "C = 1/λ: büyük C zayıf düzenlileştirme, yüksek varyans; C çapraz doğrulamayla (γ ile birlikte) seçilmeli", ok: true, why: "Amaç ½‖w‖² + C Σ hinge."}
      - {t: "RBF çekirdeği bu veri için yanlış", why: "Küçük C ile makul çalışıyor; sorun düzenlileştirme düzeyi."}
    hints:
      - "Amaçta C hangi terimi çarpıyor?"
    solution: |-
      C ihlal cezasını ölçekler; C → ∞ sert marja (her noktayı doğru sınıflama) gider. RBF'de γ da esnekliği belirler: büyük γ dar çekirdek, her nokta kendi adası. İkisi birlikte ızgara aramayla seçilir.
  - id: p5
    type: kanıt
    level: 3
    title: Polinom çekirdeğinin öznitelik haritası
    goal: Çekirdek hilesini somut bir öznitelik uzayıyla doğrulamak
    needs: İç çarpım, açılım
    q: |-
      $d=2$ için $k(x,z)=(x^\top z+1)^2$'nin bir $\phi$ ile $\phi(x)^\top\phi(z)$ olarak yazılabildiğini göster. $\phi$ kaç boyutlu? Genel $d$ ve derece $p$ için boyutun nasıl büyüdüğünü söyle.
    rubric:
      - "$(x_1z_1+x_2z_2+1)^2$'yi açtım"
      - "$\\phi(x)=(x_1^2,\\ x_2^2,\\ \\sqrt2x_1x_2,\\ \\sqrt2x_1,\\ \\sqrt2x_2,\\ 1)$ (6 boyut) buldum"
      - "Genel boyutun $\\binom{d+p}{p}$ olduğunu söyledim"
      - "Çekirdeğin bu boyutu hiç kurmadan O(d)'de hesaplandığını, RBF'nin sonsuz boyutlu φ'ye karşılık geldiğini belirttim"
    hints:
      - "$\\sqrt2$ katsayıları çapraz terimlerden gelir."
    solution: |-
      $(x^\top z+1)^2=x_1^2z_1^2+x_2^2z_2^2+2x_1x_2z_1z_2+2x_1z_1+2x_2z_2+1=\phi(x)^\top\phi(z)$, $\phi$ 6 boyutlu. Genelde $\binom{d+p}{p}$: d = 100, p = 3'te 176 851; çekirdek yine tek iç çarpım + kuvvet. RBF'nin Taylor açılımı tüm derecelerden terim içerir: sonsuz boyutlu φ. Bedel: n × n çekirdek matrisi (P6).
  - id: p6
    type: yöntem-seç
    level: 2
    title: Bir milyon örnek
    goal: Çekirdekli ve doğrusal SVM arasında ölçeğe göre seçmek
    needs: P5
    q: |-
      10⁶ örnek, 100 öznitelik. Çekirdekli SVM (RBF) mi, doğrusal SVM (SGD/liblinear) mi?
    choices:
      - {t: "Çekirdekli SVM", why: "Çekirdek matrisi 10¹² eleman (~4 TB float32); eğitim O(n²)–O(n³)."}
      - {t: "Doğrusal SVM ya da rastgele Fourier öznitelikleri (RFF) + doğrusal model", ok: true, why: "Maliyet n'de doğrusal; RFF RBF çekirdeğini yaklaşık açık öznitelikle taklit eder (Rahimi & Recht 2007)."}
      - {t: "kNN", why: "Sınıflandırıcı değiştirmek soruyu atlamak; ayrıca sorgu maliyeti yüksek."}
    hints:
      - "Çekirdek matrisi kaç elemanlı?"
    solution: |-
      Çekirdek yöntemleri n² bellek/hesap ister; ~10⁵'in üstünde pratik değildir. Doğrusal SVM ya da çekirdeğin rastgele öznitelik yaklaşımı (RFF, Nyström) + doğrusal model ölçeklenir.
  - id: p7
    type: karşı-örnek
    level: 3
    title: SVM skoru olasılık değildir
    goal: Marj skorunun olasılık olarak yorumlanamayacağını göstermek
    needs: Lojistik regresyon (M1.4)
    q: |-
      SVM'nin $f(x)=w^\top x+b$ çıktısını $\sigma(f(x))$ ile olasılığa çevirmek neden hatalıdır? Hinge kaybının neyi optimize etmediğini göster ve doğru yolu öner.
    rubric:
      - "Marjı ≥ 1 olan tüm noktaların kayba katkısının 0 olduğunu, dolayısıyla f'nin ölçeğinin olasılık bilgisi taşımadığını söyledim"
      - "C değiştikçe f'nin ölçeğinin değiştiğini ama sınıflamanın aynı kalabildiğini gösterdim"
      - "Platt ölçeklemesi (doğrulama kümesinde σ(Af + B) uydurma) ya da izotonik regresyon önerdim"
    hints:
      - "Hinge kaybı uygun kayıp (proper scoring rule) mudur?"
    solution: |-
      Hinge kaybı yalnız işaretin doğruluğunu ve marjı önemser; marjı geçen noktalar için kayıp sabit 0 olduğundan "ne kadar emin" bilgisi öğrenilmez. f'yi 10 ile çarpmak sınıflamayı değiştirmez ama σ(f) olasılıklarını tamamen değiştirir. Doğru yol: ayrı bir doğrulama kümesinde $P(y=1|f)=\sigma(Af+B)$ uydurmak (Platt 1999) ya da izotonik kalibrasyon; sklearn'de `probability=True` bunu çapraz doğrulamayla yapar.
pitfalls:
  - wrong: "SVM her zaman lojistik regresyondan iyidir."
    right: "Doğrusal durumda ikisi çoğu zaman benzer sonuç verir; fark kayıp biçiminde (hinge seyrek destek vektörü, lojistik olasılık verir)."
  - wrong: "Destek vektörü sayısı az olmalı, çoksa model kötüdür."
    right: "Örtüşen sınıflarda ve büyük C'de çok destek vektörü doğaldır; sayıları genelleme sınırıyla ilişkilidir ama tek başına ölçüt değildir."
  - wrong: "Çekirdek seçimi önemsizdir, RBF her şeyi çözer."
    right: "RBF'nin γ'sı ve özniteliklerin ölçeklenmesi kritik; ölçeklenmemiş veride RBF anlamsız uzaklıklarla çalışır."
whatif:
  - q: "Hinge yerine kare hinge kullanılsaydı?"
    a: "Türevlenebilir (L2-SVM) olur ve ihlalleri daha sert cezalandırır; aykırı değerlere daha duyarlıdır."
  - q: "Veri tam ayrılabilir ve C → ∞?"
    a: "Sert marj SVM; tek bir aykırı nokta sınırı tamamen değiştirebilir. Ayrılamazsa çözüm yoktur."
