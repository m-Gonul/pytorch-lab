id: m2-4-tree
code: M2.4
title: Decision tree
phase: 2
minutes: 210
prereq: [m0-4-probability]
summary: >
  Gradyansız öğrenen model. Altı örnekte Gini ve en iyi bölünmeyi elle
  buluyor, saf Python'da özyinelemeli bir ağaç kuruyor, NumPy'da tüm
  özelliklerin tüm eşiklerini cumsum ile tek seferde değerlendiriyor,
  PyTorch'ta türevlenebilir "yumuşak" bir karar düğümünü autograd ile eğitiyor
  ve en sonda örnek ağırlıklı bölünmeyi (boosting'in ihtiyacı) döngüsüz
  hesaplıyorsun.
goals:
  - "[[gini|Gini]] safsızlığı ve entropiyi hesaplayıp bir bölünmenin ağırlıklı safsızlığını bulmak"
  - "Açgözlü (greedy) özyinelemeli ağaç kurma algoritmasını yazmak"
  - "Sıralama + kümülatif sınıf sayımlarıyla $O(nd)$ adayın hepsini döngüsüz değerlendirmek"
  - "Sert eşik $[x_j\\le t]$ yerine $\\sigma((w^\\top x+b)/\\tau)$ kullanarak bir ağacı gradyanla eğitilebilir yapmak"
sources:
  - {title: "ISLP — Bölüm 8.1 The Basics of Decision Trees", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "Elements of Statistical Learning — §9.2 Tree-Based Methods", url: "https://hastie.su.domains/ElemStatLearn/", license: "doğrulanmadı", use: link}
  - {title: "scikit-learn User Guide — Decision Trees (CART, Gini)", url: "https://scikit-learn.org/stable/modules/tree.html", license: "BSD-3", use: link}
  - {title: "Frosst & Hinton — Distilling a Neural Network Into a Soft Decision Tree", url: "https://arxiv.org/abs/1711.09784", license: "arXiv", use: link}

hand:
  groups:
    - title: "$x=[1,2,3,4,5,6]$, $y=[0,0,1,1,1,0]$. Gini $G=1-\\sum_c p_c^2$"
      fields:
        - {id: groot, label: "Kök Gini", answer: 0.5, tol: 0.001, hint: "$p_0=p_1=\\tfrac12$: $1-(\\tfrac14+\\tfrac14)$"}
        - {id: eroot, label: "Kök entropi (bit)", answer: 1, tol: 0.001, hint: "$-2\\cdot\\tfrac12\\log_2\\tfrac12$"}
    - title: "Eşik $t=2.5$: sol $x\\le t$, sağ $x>t$"
      fields:
        - {id: gl, label: "Sol Gini", answer: 0, tol: 0.001, hint: "sol $[0,0]$: saf"}
        - {id: gr, label: "Sağ Gini", answer: 0.375, tol: 0.001, hint: "sağ $[1,1,1,0]$: $1-(\\tfrac{9}{16}+\\tfrac1{16})$"}
        - {id: wg, label: "Ağırlıklı Gini $\\frac{n_L}{n}G_L+\\frac{n_R}{n}G_R$", answer: 0.25, tol: 0.001, hint: "$\\tfrac26\\cdot0+\\tfrac46\\cdot0.375$"}
    - title: "Tüm eşikler (1.5, 2.5, 3.5, 4.5, 5.5) içinde"
      fields:
        - {id: w45, label: "$t=4.5$ ağırlıklı Gini", answer: 0.5, tol: 0.002, hint: "sol $[0,0,1,1]$ ve sağ $[1,0]$, ikisi de 0.5"}
        - {id: best, label: "En iyi eşik", answer: 2.5, tol: 0.001, hint: "en küçük ağırlıklı Gini"}
        - {id: gain, label: "Kazanç (kök − ağırlıklı)", answer: 0.25, tol: 0.001, hint: "$0.5-0.25$"}
  verify: |
    import math
    x = [1, 2, 3, 4, 5, 6]; y = [0, 0, 1, 1, 1, 0]
    G = lambda s: 1 - sum((s.count(c) / len(s)) ** 2 for c in (0, 1)) if s else 0.0
    def W(t):
        L = [b for a, b in zip(x, y) if a <= t]; Rr = [b for a, b in zip(x, y) if a > t]
        return len(L) / 6 * G(L) + len(Rr) / 6 * G(Rr)
    ts = [1.5, 2.5, 3.5, 4.5, 5.5]
    best = min(ts, key=W)
    answers = dict(groot=G(y), eroot=-sum(y.count(c) / 6 * math.log2(y.count(c) / 6) for c in (0, 1)),
                   gl=G([0, 0]), gr=G([1, 1, 1, 0]), wg=W(2.5), w45=W(4.5), best=best, gain=G(y) - W(best))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Derinliği sınırsız bir ağaç eğitim verisinde ne olur?"
    options:
      - {t: "Her yaprak saflaşana kadar böler; eğitim hatası 0'a iner ve aşırı uyum riski çok yüksektir", ok: true, why: "Tek ağaç yüksek varyanslı bir modeldir. Derinlik/yaprak sınırı, budama ya da topluluk (M2.5) ile kontrol edilir."}
      - {t: "Yakınsamaz", why: "Sonlu sayıda bölünme var; her zaman durur."}
      - {t: "Lineer modele indirgenir", why: "Tam tersi: eksene paralel parçalı sabit bir fonksiyon olur."}
  - q: "Ağaçlar neden özellik ölçeklemeye ihtiyaç duymaz?"
    options:
      - {t: "Bölünmeler yalnız tek bir özelliğin sıralamasına bakar; monoton dönüşümler sıralamayı değiştirmez", ok: true, why: "log, standartlaştırma, birim değişikliği: hepsi aynı ağacı verir (eşik değerleri dönüşür)."}
      - {t: "Gini ölçek bağımsız bir sayı olduğu için", why: "Gini sınıf oranlarına bakar; asıl neden eşiğin sıraya dayanması."}
      - {t: "İhtiyaç duyar", why: "Mesafe ya da iç çarpım kullanmayan modeller ölçekten etkilenmez."}
  - q: "c aşamasında neden her özelliği **sıralıyoruz**?"
    options:
      - {t: "Sıralı sırada eşik bir adım kaydıkça yalnız bir örnek sağdan sola geçer; sol sınıf sayımları bir cumsum'dur", ok: true, why: "Böylece $n-1$ eşiğin hepsi $O(n)$'de değerlendirilir; sıralama $O(n\\log n)$. Naive yol her eşik için $O(n)$ sayım: $O(n^2)$."}
      - {t: "Sıralamadan eşik tanımlanamaz", why: "Tanımlanabilir; sıralama hız için."}
      - {t: "Gini sıralı veri ister", why: "Gini yalnız sayımlara bakar."}

homework:
  - title: "Quinlan (1986): karar ağaçlarının tümevarımı (ID3)"
    paper: "Quinlan — Induction of Decision Trees (Machine Learning 1986)"
    url: "https://link.springer.com/article/10.1007/BF00116251"
    level: orta
    hours: 6
    goal: |
      ID3'ü makaledeki gibi bilgi kazancıyla yaz, çok değerli özniteliklere olan yanlılığı (Bölüm 7) bir 'kimlik' özniteliği ekleyerek göster ve kazanç oranıyla (gain ratio) düzelt. Gürültülü veride ağacın aşırı uyumunu çiz; makalenin χ² tabanlı erken durdurmasını ve maliyet-karmaşıklık budamasını (CART) karşılaştır. Makalenin 'Cumartesi sabahı' oyuncak verisinde ağacı birebir üret.
    steps:
      - "Sürekli öznitelikler için eşik aramayı (C4.5) ekle."
    accept:
      - "Oyuncak veride makaledeki ağaç."
      - "Kazanç oranı yanlılığı giderir; budama test hatasını düşürür."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: En iyi bölünmeyi saf kirlilikle bul
    goal: Gini kazancını adım adım hesaplamak
    needs: Olasılık, ağırlıklı ortalama
    q: |-
      8 örnek: 4 A, 4 B. Bölünme 1: sol {3A, 1B}, sağ {1A, 3B}. Bölünme 2: sol {4A, 2B}, sağ {0A, 2B}. Gini'ye göre hangisi daha iyi?
    solution: |-
      **Tanım:** $G=1-\sum_kp_k^2$ (rastgele seçilen bir örneğin, düğümün sınıf dağılımına göre rastgele etiketlenirse yanlış etiketlenme olasılığı). Kök: $1-(0.5^2+0.5^2)=0.5$.

      **Bölünme 1:** her iki çocuk $1-(0.75^2+0.25^2)=0.375$; ağırlıklı $\frac48\cdot0.375+\frac48\cdot0.375=0.375$; kazanç $0.125$.

      **Bölünme 2:** sol $1-(\frac{4}{6}^2+\frac26^2)=1-\frac{20}{36}=0.444$, sağ saf: 0. Ağırlıklı $\frac68\cdot0.444=0.333$; kazanç $0.167$ → **bölünme 2 daha iyi**.

      **Yorum:** Gini saf bir yaprak üretmeyi ödüllendirir. Entropiyle ($H=-\sum p\log_2p$) aynı hesap: bölünme 1 kazanç 0.189, bölünme 2 kazanç 0.311 — burada aynı seçim; iki ölçüt pratikte nadiren farklı ağaç üretir. Sınıflandırma hatası ($1-\max p$) ise ikisine de 0.25 verir: kazancı ayırt edemez, bu yüzden bölünme seçiminde kullanılmaz.
  - id: p2
    type: hesap
    level: 1
    title: Gini
    goal: Gini kirliliğini hesaplamak
    needs: P1
    q: |-
      Düğümde 3 A, 1 B. Gini?
    answer: 0.375
    calc: "1-(0.75**2+0.25**2)"
    mistakes:
      - {answer: 0.625, msg: "Bu Σp²; Gini 1 − Σp²."}
      - {answer: 0.25, msg: "Bu sınıflandırma hatası 1 − max p, Gini değil."}
    hints:
      - "$p_A=0.75$, $p_B=0.25$."
    solution: |-
      $1-(0.5625+0.0625)=0.375$.
  - id: p3
    type: hesap
    level: 1
    title: Entropi
    goal: Entropiyi bit cinsinden hesaplamak
    needs: Logaritma
    q: |-
      Aynı düğüm (3 A, 1 B): entropi kaç bit?
    answer: 0.8112781244591328
    calc: "-(0.75*math.log2(0.75)+0.25*math.log2(0.25))"
    tol: 1e-3
    mistakes:
      - {answer: 0.5623351446188083, msg: "Bu nat cinsinden (doğal log); bit için log₂."}
    hints:
      - "$\\log_20.25=-2$, $\\log_20.75\\approx-0.415$."
    solution: |-
      $0.75\cdot0.415+0.25\cdot2=0.811$ bit (azami 1 bit, 50/50'de).
  - id: p4
    type: karşı-örnek
    level: 3
    title: Açgözlü bölünme XOR'da tıkanır
    goal: Açgözlü ağaç kurmanın sınırını görmek
    needs: P1
    q: |-
      İki ikili öznitelik, etiket $y=x_1\oplus x_2$, dört nokta eşit sayıda. Kökte hiçbir bölünmenin Gini kazancı vermediğini göster; buna rağmen derinliği 2 olan bir ağacın hatasız olduğunu açıkla. Bu, durdurma kuralları için ne anlama gelir?
    rubric:
      - "x₁'e (ya da x₂'ye) göre bölününce her çocuğun hâlâ 50/50 olduğunu, kazancın 0 olduğunu gösterdim"
      - "İkinci düzeyde öteki özniteliğe göre bölmenin saf yapraklar verdiğini gösterdim"
      - "'Kazanç eşiğin altındaysa dur' kuralının burada ağacı hiç büyütmeyeceğini söyledim"
      - "Çözüm olarak tam büyütüp sonra budamayı (cost-complexity pruning) önerdim"
    hints:
      - "x₁ = 0 olan noktaların etiketleri neler?"
    solution: |-
      x₁ = 0 → {(0,0): 0, (0,1): 1}; x₁ = 1 → {(1,0): 1, (1,1): 0}: her iki çocuk 50/50, kazanç 0 (x₂ için de aynı). İkinci düzeyde x₂'ye bölmek dört saf yaprak verir. Açgözlü yöntem etkileşimleri tek adımda göremez; erken durdurma ("kazanç < ε ise dur") bu yapıyı kaçırır. Bu yüzden ağaç genelde tam büyütülüp sonra maliyet–karmaşıklık budamasıyla küçültülür.
  - id: p5
    type: açıkla
    level: 2
    title: Ağaçlar ölçekten bağımsız ama dışarıya genelleyemez
    goal: Ağaçların tümevarımsal yanlılığını tanımlamak
    needs: Eşik bölünmesi
    q: |-
      Karar ağacının neden öznitelik ölçeklemesine ihtiyaç duymadığını ve neden eğitim aralığının dışına (ekstrapolasyon) genelleyemediğini açıkla.
    rubric:
      - "Bölünmelerin yalnız sıralamaya bağlı olduğunu (tekdüze dönüşümler sonucu değiştirmez) söyledim"
      - "Yaprak tahminlerinin eğitim hedeflerinin ortalaması olduğunu, dolayısıyla aralık dışına çıkamayacağını açıkladım"
      - "Eksen hizalı sınırların eğik sınırları basamak basamak yaklaştırdığını belirttim"
    hints:
      - "x yerine log x kullanınca hangi bölünmeler mümkün olur?"
    solution: |-
      Bölünme "x_j < t" biçiminde; herhangi bir tekdüze dönüşüm noktaların sırasını korur, aynı bölünmeleri (farklı eşiklerle) mümkün kılar. Regresyon yaprağı eğitim hedeflerinin ortalamasıdır: zaman serisinde eğilimli bir hedefi gelecekte sürdüremez (son yaprağın değerinde kalır). Eğik bir sınırı (x₁ + x₂ = 1) çok sayıda eksen hizalı basamakla yaklaştırır.
  - id: p6
    type: yöntem-seç
    level: 2
    title: Müşteri numarası özniteliği
    goal: Çok değerli özniteliklerin yanlılığını tanımak
    needs: Bilgi kazancı
    q: |-
      Veride benzersiz "müşteri_no" sütunu var. Bilgi kazancıyla kurulan ağaç onu kökte seçiyor, test doğruluğu çok düşük. Ne yapmalı?
    choices:
      - {t: "Ağacı derinleştir", why: "Sorun ağaç değil, ezberlemeye izin veren öznitelik."}
      - {t: "Sütunu çıkar (ya da kazanç oranı gibi çok değerli öznitelikleri cezalandıran ölçüt kullan)", ok: true, why: "Her değer ayrı yaprak: eğitimde saf, testte anlamsız."}
      - {t: "Gini'ye geç", why: "Gini de aynı yanlılığa sahip."}
    hints:
      - "Her müşteri_no değerinde kaç örnek var?"
    solution: |-
      Benzersiz değerli öznitelik eğitim kümesini tamamen saf yapraklara böler (kazanç azami) ama genelleme yoktur. C4.5'in kazanç oranı bölünmenin kendi entropisine bölerek bunu cezalandırır; pratikte kimlik sütunları çıkarılır.
pitfalls:
  - wrong: "Eğitim doğruluğu %100 olan ağaç iyi bir modeldir."
    right: "Derinliği sınırsız ağaç her örneği ayrı yaprağa koyabilir; derinlik, yaprak başına en az örnek ya da budamayla düzenlileştir."
  - wrong: "Öznitelik önemleri (kirlilik azalması) güvenilirdir."
    right: "Çok değerli ve sürekli özniteliklere yanlıdır; permütasyon önemi daha güvenilirdir."
whatif:
  - q: "Eğitim verisi biraz değişirse ağaç ne kadar değişir?"
    a: "Çok: kökteki bölünme değişirse bütün ağaç değişir (yüksek varyans). Bagging ve rastgele orman bu yüzden doğar (M2.5)."
  - q: "Hedef sürekli olsaydı?"
    a: "Kirlilik yerine varyans (MSE) azalması kullanılır; yaprak tahmini ortalamadır."

labs:
  - id: l1
    lab: tree2d
    title: "Karar ağacı: derinlik, yaprak boyu ve eksene paralel bölgeler"
    goal: |
      CART'ın gerçek bir uygulaması (açgözlü, orta nokta eşikleri). Arka plan her yapraktaki sınıf-1 oranı (açık = 1'e yakın), gri çizgiler yaprakların dikdörtgen sınırları. Sağda eğitim ve test doğruluğu derinliğe göre; yatay çizgi etiket gürültüsünün izin verdiği en yüksek doğruluk.
    predict:
      q: "Eğik doğru sınırlı veride derinliği 2'den 12'ye çıkarırsan sınır nasıl görünür, test doğruluğu ne olur?"
      options:
        - {t: "Merdiven basamakları incelir; test doğruluğu önce artar, sonra (gürültü ezberlenince) düşer", ok: true, why: "Eksene paralel bölünmelerle eğik bir doğru ancak merdivenle yaklaşılır; çok derin ağaç gürültülü örneklere ada açar."}
        - {t: "Ağaç eğik bir doğru çizer", why: "CART'ın her bölünmesi tek bir öznitelik üzerinden: hep eksene paralel."}
        - {t: "Test doğruluğu sürekli artar", why: "Eğitim doğruluğu sürekli artar; test, varyans yüzünden bir noktadan sonra düşer."}
    presets:
      - {name: "Sığ ağaç", params: {data: 0, depth: 2, minLeaf: 1}, note: "Kaba merdiven: yüksek yanlılık."}
      - {name: "Derin ağaç", params: {data: 0, depth: 12, minLeaf: 1, noise: 0.1}, note: "Gürültülü noktaların etrafında küçük kutular: eğitim %100, test düşer."}
      - {name: "Yaprak boyu sınırı", params: {data: 0, depth: 12, minLeaf: 15, noise: 0.1}, note: "Her yaprakta en az 15 örnek: aynı derinlikte bile adalar kaybolur."}
      - {name: "XOR", params: {data: 1, depth: 2, minLeaf: 1, noise: 0.05}, note: "İlk bölünme neredeyse kazançsız; açgözlü seçim zorlanır ama derinlik 2 yetebilir."}
      - {name: "Ağacın kolay problemi", params: {data: 3, depth: 2, minLeaf: 1, noise: 0}, note: "Eksene paralel köşe: iki bölünme yeter."}
      - {name: "Hata ölçütü", params: {data: 2, depth: 6, minLeaf: 1, crit: 2, noise: 0.05}, note: "Sınıflandırma hatası birçok bölünmeye 0 kazanç verir; ağaç erken durabilir. Gini'ye geçip karşılaştır."}
    questions:
      - q: "Tohumu değiştirince derin ağacın bölgeleri ne kadar değişiyor? Sığ ağacınkiler?"
        a: "Derin ağaç çok değişir (yüksek varyans: veriye çok bağlı); sığ ağaç az değişir. Topluluk yöntemleri (M2.5) bu varyansı ortalama alarak düşürür."
      - q: "Öznitelikleri 1000 ile çarpsan ağaç değişir mi?"
        a: "Hayır: eşikler de 1000 ile çarpılır, sıralama aynı kalır. Ağaçlar tekdüze dönüşümlere değişmezdir; ölçekleme gerekmez."
    limits: "İki öznitelik, ikili sınıflandırma, budama yok (yalnız önceden durdurma). Test 1000 yeni örnekle. Eşit kazançta ilk bulunan bölünme seçilir."
