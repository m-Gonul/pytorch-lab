id: m2-1-knn
code: M2.1
title: k-NN ve mesafe matrisi vektörizasyonu
phase: 2
minutes: 180
prereq: [m0-2-matmul]
summary: >
  Vektörizasyonun klasik okulu. Dört noktada mesafeleri ve oyları elle
  hesaplıyor; mesafe matrisini önce iki döngüyle, sonra tek döngüyle, sonra
  hiç döngüsüz (‖a‖² + ‖b‖² − 2a·b açılımı) yazıyor; PyTorch'ta `topk` ile
  sınıflandırıyor ve en sonda 20 farklı k değerini tek sıralamayla
  değerlendiriyorsun.
goals:
  - "[[k-nn|k-NN]] tahminini (mesafe → en yakın k → çoğunluk oyu) adım adım yapmak"
  - "$\\lVert a-b\\rVert^2=\\lVert a\\rVert^2+\\lVert b\\rVert^2-2a\\cdot b$ açılımıyla [[mesafe matrisi|mesafe matrisini]] tek matris çarpımına indirgemek"
  - "İki döngü → tek döngü → sıfır döngü dönüşümünde her adımda neyin [[broadcasting]]'e devredildiğini görmek"
  - "Eşitlik (tie) kurallarını açıkça tanımlayıp tüm uygulamalarda tutarlı tutmak"
  - "`cumsum` hilesiyle tüm k değerlerinin oylarını tek geçişte hesaplamak"
sources:
  - {title: "CS231n — Image Classification: Data-driven Approach, k-Nearest Neighbor", url: "https://cs231n.github.io/classification/", license: "MIT", use: adapt}
  - {title: "CS231n Assignment 1 — kNN (compute_distances_two_loops / one_loop / no_loops)", url: "https://cs231n.github.io/assignments2025/assignment1/", license: "MIT", use: adapt}
  - {title: "ISLP — Bölüm 2.2.3 K-Nearest Neighbors", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "PyTorch — torch.cdist, torch.topk", url: "https://docs.pytorch.org/docs/stable/generated/torch.cdist.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "Eğitim: $P_1=(0,0)$ sınıf 0, $P_2=(1,3)$ sınıf 1, $P_3=(3,1)$ sınıf 0, $P_4=(4,4)$ sınıf 1. Sorgu $q=(1,2)$. Kare mesafeler $\\lVert q-P_i\\rVert^2$"
      fields:
        - {id: d1, label: "$d_1^2$", answer: 5, hint: "$(1-0)^2+(2-0)^2$"}
        - {id: d2, label: "$d_2^2$", answer: 1, hint: "$(1-1)^2+(2-3)^2$"}
        - {id: d3, label: "$d_3^2$", answer: 5, hint: "$(1-3)^2+(2-1)^2$"}
        - {id: d4, label: "$d_4^2$", answer: 13, hint: "$(1-4)^2+(2-4)^2$"}
    - title: "Oylama"
      fields:
        - {id: k1, label: "$k=1$ tahmini (sınıf)", answer: 1, hint: "en yakın tek komşu $P_2$"}
        - {id: k3, label: "$k=3$ tahmini (sınıf)", answer: 0, hint: "en yakın üç: $P_2$ (1), $P_1$ (0), $P_3$ (0) — $k$ değişince karar değişti"}
    - title: "Açılım: $\\lVert q-P_4\\rVert^2=\\lVert q\\rVert^2+\\lVert P_4\\rVert^2-2\\,q\\cdot P_4$"
      fields:
        - {id: qq, label: "$\\lVert q\\rVert^2$", answer: 5, hint: "$1+4$"}
        - {id: pp, label: "$\\lVert P_4\\rVert^2$", answer: 32, hint: "$16+16$"}
        - {id: qp, label: "$q\\cdot P_4$", answer: 12, hint: "$1\\cdot4+2\\cdot4$"}
        - {id: dd, label: "$5+32-2\\cdot12$", answer: 13, hint: "$d_4^2$ ile aynı çıkmalı"}
  verify: |
    P = [(0, 0), (1, 3), (3, 1), (4, 4)]; lab = [0, 1, 0, 1]; q = (1, 2)
    d = [(q[0] - a) ** 2 + (q[1] - b) ** 2 for a, b in P]
    order = sorted(range(4), key=lambda j: (d[j], j))
    vote = lambda k: max(sorted(set(lab)), key=lambda c: (sum(lab[j] == c for j in order[:k]), -c))
    answers = dict(d1=d[0], d2=d[1], d3=d[2], d4=d[3], k1=vote(1), k3=vote(3),
                   qq=q[0] ** 2 + q[1] ** 2, pp=32, qp=q[0] * 4 + q[1] * 4, dd=5 + 32 - 24)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "`((Xte[:, None, :] - Xtr[None, :, :]) ** 2).sum(-1)` de döngüsüzdür. Açılım yöntemine göre dezavantajı?"
    options:
      - {t: "(nte, ntr, d) boyutunda ara tensör oluşturur; bellek d kat büyür", ok: true, why: "5000 × 50000 × 3072 float32 ≈ 3 TB. Açılım yalnız (nte, ntr) çıktıyı ve bir matris çarpımını gerektirir; ayrıca BLAS'ı kullanır."}
      - {t: "Sonucu yanlıştır", why: "Matematiksel olarak doğru; hatta açılımdan daha kesindir (iptal hatası yok)."}
      - {t: "GPU'da çalışmaz", why: "Çalışır; sorun bellek ve hız."}
  - q: "Açılım yönteminde neden `clamp(min=0)` gerekebilir?"
    options:
      - {t: "Kayan nokta iptali yüzünden çok yakın noktalarda $\\lVert a\\rVert^2+\\lVert b\\rVert^2-2a\\cdot b$ küçük negatif çıkabilir; sonra karekök NaN olur", ok: true, why: "Büyük iki sayının farkı alınırken anlamlı basamaklar kaybolur (catastrophic cancellation)."}
      - {t: "Mesafeler doğası gereği negatif çıkar", why: "Gerçek kare mesafe her zaman ≥ 0; negatiflik tamamen sayısal."}
      - {t: "Gerekmez", why: "Aynı noktayla kendisi arasında bile $10^{-6}$ mertebesinde negatif değerler görülebilir."}
  - q: "k-NN'de eğitim maliyeti ve tahmin maliyeti nedir?"
    options:
      - {t: "Eğitim $O(1)$ (veriyi sakla), tahmin örnek başına $O(n\\,d)$", ok: true, why: "Bu yüzden büyük veri setlerinde yaklaşık en yakın komşu yapıları (KD-tree, HNSW, FAISS) kullanılır."}
      - {t: "Eğitim $O(n^2)$, tahmin $O(1)$", why: "Tersine: k-NN tembel (lazy) bir öğrenicidir; tüm iş tahminde."}
      - {t: "İkisi de $O(n\\log n)$", why: "Sıralama tahminde $O(n\\log n)$ ekleyebilir ama baskın terim mesafe hesabı."}

homework:
  - title: "Cover & Hart (1967): en yakın komşu sınıflandırması"
    paper: "Cover & Hart — Nearest Neighbor Pattern Classification (IEEE Trans. Information Theory 1967)"
    url: "https://ieeexplore.ieee.org/document/1053964"
    level: orta
    hours: 5
    goal: |
      Makalenin ana sonucunu deneyle doğrula: Bayes hatası R* bilinen sentetik problemlerde (iki Gauss, örtüşme ayarlı) 1-NN'in asimptotik hatasının R* ≤ R ≤ 2R*(1 − R*) aralığında kaldığını, örnek sayısı n = 10²…10⁵ için göster. k-NN'de k ve n birlikte büyürken (k → ∞, k/n → 0) hatanın R*'a yaklaştığını çiz; boyut arttıkça yakınsamanın yavaşladığını (boyut laneti) ölç.
    steps:
      - "R*'ı iki Gauss için kapalı form ya da büyük Monte Carlo ile hesapla."
    accept:
      - "Ölçülen 1-NN hataları Cover–Hart sınırları içinde."
      - "k-NN hatasının R*'a yaklaşma grafiği ve boyut etkisi."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Uzaklık matrisini döngüsüz yazmanın cebiri ve bedeli
    goal: ‖a − b‖² açılımını türetmek ve sayısal riskini görmek
    needs: İç çarpım, yayın (broadcasting)
    q: |-
      $X$ (n × d) ile $Y$ (m × d) arasındaki tüm kare uzaklıkları tek ifadede yaz. Bu yazımın kayan noktada nerede sorun çıkardığını göster.
    solution: |-
      **Açılım:** $\|a-b\|^2=(a-b)^\top(a-b)=a^\top a-2a^\top b+b^\top b$ (iç çarpım simetrik: $a^\top b=b^\top a$).

      **Matris biçimi:** $D=\underbrace{\mathrm{sum}(X^2,1)}_{(n,1)}+\underbrace{\mathrm{sum}(Y^2,1)^\top}_{(1,m)}-2XY^\top$. İlk iki terim yayınla (n, m)'ye genişler; asıl iş tek bir matris çarpımıdır (BLAS, GPU'da çok hızlı).

      **Bedel — yok etme (cancellation):** $a\approx b$ ve normlar büyükken $\|a\|^2+\|b\|^2$ ile $2a^\top b$ neredeyse eşit büyük sayılardır; farkları göreli hatası büyük, küçük bir sayıdır. Örnek: $a=(10^4,\,0)$, $b=(10^4,\,10^{-3})$: gerçek değer $10^{-6}$; float32'de $10^8$ civarındaki sayılar ancak ~8 birimlik adımlarla temsil edilir, sonuç 0 ya da **negatif** çıkabilir. Çare: sonucu `clamp(min=0)` ile kırp, veriyi merkezle (uzaklık ötelemeden bağımsızdır, normları küçültür), gerekirse float64 ya da `torch.cdist(..., compute_mode='donot_use_mm_for_euclid_dist')`.
  - id: p2
    type: hesap
    level: 1
    title: Açılımla bir uzaklık
    goal: Açılımı elle uygulamak
    needs: P1
    q: |-
      $a=(1,2)$, $b=(3,-1)$. $\|a\|^2+\|b\|^2-2a\cdot b$ kaç?
    answer: 13.0
    calc: "5+10-2*1"
    mistakes:
      - {answer: 15.0, msg: "−2a·b terimini unuttun."}
      - {answer: 17.0, msg: "İşaret: −2a·b. a·b = 3 − 2 = 1."}
      - {answer: 3.605551275463989, msg: "Soru kare uzaklığı soruyor; kök almana gerek yok."}
    hints:
      - "$\\|a\\|^2=5$, $\\|b\\|^2=10$, $a\\cdot b=1\\cdot3+2\\cdot(-1)$."
    solution: |-
      $5+10-2=13$; doğrudan: $(1-3)^2+(2+1)^2=4+9=13$ ✓.
  - id: p3
    type: hesap
    level: 1
    title: Boyutun laneti
    goal: Yüksek boyutta "yakın" komşunun ne kadar uzak olduğunu hesaplamak
    needs: Hacim, kök
    q: |-
      Veri $[0,1]^d$ birim küpünde düzgün dağılmış. Verinin %1'ini içine alan alt küpün kenar uzunluğu $d=10$ için kaç?
    answer: 0.6309573444801932
    calc: "0.01**(1/10)"
    tol: 1e-3
    mistakes:
      - {answer: 0.001, msg: "Hacim kenarın d. kuvvetidir: kenar = 0.01^(1/d), 0.01/d değil."}
      - {answer: 0.01, msg: "Bu d = 1 için doğru; 10 boyutta kenar çok daha uzun olmalı."}
    hints:
      - "$\\ell^{10}=0.01$."
    solution: |-
      $\ell=0.01^{1/10}=0.631$: verinin yalnız %1'ini toplamak için her eksende aralığın %63'ünü kapsamak gerekir. "Yerel" komşuluk yüksek boyutta yerel değildir; ayrıca en yakın ve en uzak komşu uzaklıklarının oranı 1'e yaklaşır. kNN'in yüksek boyutta öznitelik seçimi ya da öğrenilmiş gömmelerle (düşük içsel boyut) çalışmasının nedeni.
  - id: p4
    type: hata-bul
    level: 2
    title: Maaş ve yaş
    goal: Ölçeklemenin uzaklığa etkisini fark etmek
    needs: Öklid uzaklığı
    q: |-
      Öznitelikler: yaş (20–65) ve yıllık maaş (TL, 200 000–3 000 000). kNN'in doğruluğu, maaşı tek başına kullanmakla aynı çıkıyor. Neden?
    choices:
      - {t: "Yaş bilgisiz bir öznitelik", why: "Yaşın bilgi taşıyıp taşımadığını bu deney söyleyemez: uzaklığa katkısı zaten yok."}
      - {t: "Uzaklık, değer aralığı ~10⁶ olan maaş tarafından belirleniyor; yaş farkları yuvarlama hatası düzeyinde. Öznitelikleri standartlaştır", ok: true, why: "Öklid uzaklığı birimlere duyarlıdır."}
      - {t: "k çok küçük", why: "k ne olursa olsun komşuluk yalnız maaşa göre belirlenir."}
    hints:
      - "İki kişi arasındaki yaş farkının ve maaş farkının karelerini karşılaştır."
    solution: |-
      40 yaş farkı karede 1600 katkı; 100 000 TL fark 10¹⁰. Standartlaştırma (z-skor) ya da min-maks ölçekleme her özniteliğe eşit "söz hakkı" verir; alan bilgisi varsa ağırlıklı uzaklık ya da öğrenilmiş metrik (Mahalanobis, metrik öğrenme) daha iyidir. Ölçekleme parametreleri yalnız eğitim kümesinden hesaplanmalı (sızıntı).
  - id: p5
    type: yorumla
    level: 2
    title: k'ya karşı doğrulama hatası
    goal: k'nın yanlılık–varyans rolünü okumak
    needs: Aşırı uyum
    q: |-
      k = 1'de eğitim doğruluğu %100, doğrulama %81; k = 15'te eğitim %90, doğrulama %88; k = 200'de ikisi de %70. Yorum?
    choices:
      - {t: "k = 1 en iyisi: eğitimde hatasız", why: "1-NN eğitim noktasının kendisini bulduğu için eğitim hatası her zaman 0'dır; bilgi vermez."}
      - {t: "Küçük k yüksek varyans (gürültüyü ezberliyor), büyük k yüksek yanlılık (sınır aşırı düz); k = 15 dolayı iyi denge", ok: true, why: "Etkin parametre sayısı ≈ n/k."}
      - {t: "Veri sızıntısı var", why: "Eğri tipik U şeklini gösteriyor."}
    hints:
      - "k = n olursa model ne tahmin eder?"
    solution: |-
      k = n'de her sorguya çoğunluk sınıfı döner (sabit model). k küçüldükçe sınır esneşir; kNN'in etkin serbestlik derecesi kabaca n/k. En iyi k çapraz doğrulamayla seçilir; modülün e aşamasındaki tek sıralamayla 20 k değerini birden değerlendirme hilesi bu seçimi ucuzlatır.
  - id: p6
    type: yöntem-seç
    level: 2
    title: 10 milyon gömme vektörü
    goal: Komşu arama yöntemini ölçeğe göre seçmek
    needs: Karmaşıklık
    q: |-
      10 milyon adet 768 boyutlu metin gömmesi; sorgu başına < 10 ms'de en yakın 10 komşu lazım, %95 isabet yeterli. Kaba kuvvet mi, kd-ağacı mı, yaklaşık en yakın komşu (HNSW/IVF) mu?
    choices:
      - {t: "Kaba kuvvet", why: "Sorgu başına 10⁷ × 768 ≈ 8·10⁹ çarpma; tek sorguda saniyeler."}
      - {t: "kd-ağacı", why: "Yüksek boyutta budama çalışmaz; neredeyse tüm yaprakları ziyaret eder."}
      - {t: "Yaklaşık en yakın komşu (HNSW graf indeksi ya da IVF + nicemleme)", ok: true, why: "Kesinlikten biraz vazgeçip logaritmik benzeri sorgu süresi elde eder (FAISS, hnswlib)."}
    hints:
      - "kd-ağacının budaması hangi boyutlarda işe yarar?"
    solution: |-
      kd-ağacı ~20 boyutun altında etkilidir. 768 boyutta ANN indeksleri standarttır: HNSW (çok katmanlı yakınlık grafı) ya da IVF (kaba kümeleme + yalnız yakın kümelerde arama), çoğu zaman ürün nicemlemesiyle (PQ) sıkıştırılmış. Değerlendirme: recall@10 ve gecikme birlikte.
  - id: p7
    type: karşı-örnek
    level: 3
    title: Öklid uzaklığı yanıltıyor
    goal: Uzaklık seçiminin modelin kendisi olduğunu görmek
    needs: Kosinüs benzerliği
    q: |-
      Öklid uzaklıklı kNN'in açıkça yanlış komşu bulduğu bir veri türü ve somut bir örnek ver. Hangi uzaklık daha uygun ve neden?
    rubric:
      - "Somut bir örnek verdim (ör. kelime sayım vektörleri: aynı konudaki uzun ve kısa belge)"
      - "Öklid'in büyüklüğe (uzunluk/norm) duyarlı olduğunu gösterdim"
      - "Kosinüs (ya da normalize edilmiş vektörlerde Öklid) önerdim ve normalize vektörlerde ‖a − b‖² = 2 − 2cos olduğunu söyledim"
      - "Başka bir örnek türü (zaman serisinde kayma → DTW, görüntüde öteleme) andım"
    hints:
      - "Bir belgeyi kendisiyle iki kez birleştirince sayım vektörü ne olur?"
    solution: |-
      Belge A'nın sayım vektörü $v$, aynı metnin iki kopyası $2v$: konu aynı ama $\|v-2v\|=\|v\|$ büyük; kısa ama farklı konulu bir belge daha yakın çıkabilir. Kosinüs açıya bakar: $\cos(v,2v)=1$. Birim normlu vektörlerde $\|a-b\|^2=2-2\cos(a,b)$, yani ikisi aynı sıralamayı verir — gömmeleri normalize etmek bu yüzden yaygın. Zaman serilerinde küçük faz kayması Öklid'i büyütür (DTW), görüntülerde bir piksellik öteleme de öyle (öğrenilmiş öznitelikler).
pitfalls:
  - wrong: "kNN eğitilmez, dolayısıyla aşırı uyamaz."
    right: "k küçükken eğitim verisini ezberler ve gürültüye aşırı uyar; k, düzenlileştirme hiperparametresidir."
  - wrong: "Uzaklık hesaplamak her zaman ucuzdur."
    right: "Tahmin maliyeti O(n·d) sorgu başına; eğitim ucuzluğunun bedeli çıkarımda ödenir."
  - wrong: "Daha çok öznitelik her zaman daha iyi komşu demektir."
    right: "Bilgisiz öznitelikler uzaklığa gürültü ekler; yüksek boyutta tüm uzaklıklar birbirine yaklaşır (P3)."
whatif:
  - q: "Sınıflar çok dengesizse (%95 / %5)?"
    a: "Çoğunluk sınıfı komşuluklara hâkim olur; uzaklıkla ağırlıklı oylama, sınıf başına eşik ya da sınıf dengeli örnekleme gerekir."
  - q: "Komşuların oyları uzaklıkla ağırlıklandırılırsa?"
    a: "k'ya duyarlılık azalır; k = n bile anlamlı hâle gelir (çekirdek regresyonuna — Nadaraya–Watson — yaklaşır)."

labs:
  - id: l1
    lab: knn2d
    title: "k-NN: k, mesafe ölçüsü ve öznitelik ölçeği"
    goal: |
      Üç sınıflı 2B veri. Mor noktalar k-NN'nin karar sınırlarıdır (ızgarada tahminin değiştiği yerler). Sağ grafik eğitim hatasını (sorgu kendi komşusu sayılır), birini-dışarıda-bırak hatasını ve 300 ayrı doğrulama örneğindeki hatayı k'ya göre verir.
    predict:
      q: "k = 1'de eğitim hatası kaçtır? Doğrulama hatası en küçük k = 1'de mi olur?"
      options:
        - {t: "Eğitim hatası 0; doğrulama hatası genelde k = 1'de en küçük değildir", ok: true, why: "Her nokta kendisinin en yakın komşusudur. Gürültülü sınıflarda k = 1 yüksek varyanslıdır; orta bir k doğrulamada kazanır."}
        - {t: "İkisi de en küçük k = 1'de", why: "Eğitim hatası evet; doğrulamada aşırı uyum yüzünden genelde hayır."}
        - {t: "Eğitim hatası rastgele tahmin kadar", why: "k = 1'de eğitim noktası kendi etiketini oylar."}
    presets:
      - {name: "k = 1", params: {k: 1, spread: 0.8}, note: "Pürüzlü sınırlar, gürültülü noktaların etrafında adalar."}
      - {name: "Orta k", params: {k: 15, spread: 0.8}, note: "Sınırlar yumuşadı; doğrulama hatası genelde burada düşük."}
      - {name: "Çok büyük k", params: {k: 60, n: 90, spread: 0.8}, note: "Komşuların üçte ikisi her zaman başka sınıflardan: küçük sınıf bölgeleri kaybolmaya başlar."}
      - {name: "Ölçeksiz öznitelik", params: {k: 5, stretch: 8}, note: "x₁ 8 katına çıktı: mesafe x₁'e hükmediyor, x₂'deki ayrım kayboluyor."}
      - {name: "L∞ ölçüsü", params: {k: 5, metric: 2}, note: "Sınırlar eksenlere paralel ve 45° parçalardan oluşur: birim 'çember' bir kare."}
    questions:
      - q: "LOO hatası ile ayrı doğrulama hatası neden birbirine yakın?"
        a: "LOO, her eğitim noktasını görülmemiş bir örnek gibi değerlendirir: k-NN'de neredeyse yansız bir doğrulama tahminidir ve ayrı veri gerektirmez."
      - q: "Ağırlıklı oy, k büyükken neden daha iyi?"
        a: "Uzak komşuların oyu küçülür; etkili komşuluk k'dan bağımsız olarak yerel kalır. k'ya duyarlılık azalır."
    limits: "2B, üç Gauss kümesi; sınır 90 × 90 ızgarada argmax değişiminden çizilir. Hesap kaba kuvvettir (her sorgu için tüm uzaklıklar)."
  - id: l2
    lab: distconc
    title: "Boyutun laneti: uzaklıklar yoğunlaşır, komşuluk yerel değildir"
    goal: |
      Birim küpte düzgün n nokta ve bir rastgele sorgu. Sol: sorgudan tüm noktalara uzaklıkların histogramı. Orta: en uzak ile en yakın arasındaki göreli farkın boyutla düşüşü. Sağ: verinin r oranını kapsamak için gereken alt küp kenarı $r^{1/d}$.
    predict:
      q: "d = 1000'de en uzak komşu en yakın komşudan yaklaşık yüzde kaç uzaktadır?"
      options:
        - {t: "Yalnız %10–20 kadar", ok: true, why: "Uzaklıklar √(d/6) ≈ 12.9 etrafında yoğunlaşır, std ≈ sabit (~0.24): göreli fark birkaç std / 12.9."}
        - {t: "Yaklaşık 2 kat", why: "Bu düşük boyutta (d ≈ 10) görülür."}
        - {t: "Yüzlerce kat", why: "d = 1–2'de en yakın komşu çok yakın olabilir; yüksek boyutta tersine yaklaşır."}
    presets:
      - {name: "d = 2", params: {d: 2, n: 1000, frac: 0.01}, note: "Geniş histogram: en yakın komşu belirgin biçimde yakın."}
      - {name: "d = 100", params: {d: 100, n: 1000, frac: 0.01}, note: "Dar bir tepe: her nokta kabaca aynı uzaklıkta."}
      - {name: "d = 1000", params: {d: 1000, n: 1000, frac: 0.01}, note: "Kontrast ~%10–20."}
    questions:
      - q: "n'yi 50'den 5000'e çıkarmak d = 1000'de en yakın komşuyu ne kadar yaklaştırır?"
        a: "Çok az: daha fazla nokta, yoğunlaşmış dağılımın sol kuyruğundan biraz daha uç bir değer getirir. Yüksek boyutta veri miktarını artırmak lanetten kurtarmaz."
      - q: "Gerçek görüntülerde k-NN neden yine de bir ölçüde çalışır?"
        a: "Görüntüler 3072 boyutlu uzayda düzgün dağılmaz; düşük boyutlu bir manifolda yakındır. Etkili boyut çok daha düşüktür. İyi bir gömme bu yapıyı daha da belirginleştirir."
    limits: "Düzgün dağılmış yapay veri: gerçek verideki manifold yapısı yoktur, bu yüzden lanetin en kötü hâlini gösterir."
