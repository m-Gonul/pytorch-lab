id: m11-7-bandits
code: M11.7
title: Çok kollu haydutlar — pişmanlık, UCB, Thompson örneklemesi
phase: 11
minutes: 400
prereq: [m11-5-sarsa-q]
summary: >
  Tek durumlu RL: geçiş yok, yalnız rastgele ödül fonksiyonu öğrenilir —
  keşif–sömürü ikileminin en saf hâli (klinik deneyler, reklam yerleştirme,
  web kişiselleştirme). Pişmanlık (regret) tanımı, sabit ε'un doğrusal ve
  $\varepsilon_t\propto1/t$'nin logaritmik pişmanlığı, iyimserlik ilkesi,
  Hoeffding eşitsizliğinden UCB1, Bayesçi haydutlar ve Beta–Bernoulli
  eşleniği ile Thompson örneklemesi (k örnekli sürüm), gradyan haydut ve
  Lai–Robbins alt sınırı. Saf Python'da beş algoritma, NumPy'da Sutton'ın
  10 kollu test yatağı, PyTorch'ta Thompson'da örnek sayısı k'nın etkisi ve
  binlerce deneyin paralel simülasyonu.
goals:
  - "[[pişmanlık]] $\\mathrm{Loss}_n=\\sum_t(r^*-R(a_t))$; doğrusal ve logaritmik pişmanlık"
  - "Hoeffding: $P(|\\tilde R-R|\\ge c)\\le2e^{-2nc^2}$ → UCB1 $\\tilde R(a)+\\sqrt{2\\ln n/n_a}$"
  - "[[eşlenik önsel]]: Beta önsel + Bernoulli olabilirlik → Beta sonsal; [[Thompson örneklemesi]]"
  - "Gradyan haydut: softmax tercihleri ve taban çizgisi"
sources:
  - {title: "Auer, Cesa-Bianchi, Fischer — Finite-time Analysis of the Multiarmed Bandit Problem (Machine Learning 2002)", url: "https://doi.org/10.1023/A:1013689704352", license: "©", use: link}
  - {title: "Chapelle & Li — An Empirical Evaluation of Thompson Sampling (NeurIPS 2011)", url: "https://papers.nips.cc/paper/2011/hash/e53a0a2978c28872a4505bdb51db06dc-Abstract.html", license: "©", use: link}
  - {title: "Lai & Robbins — Asymptotically Efficient Adaptive Allocation Rules (Adv. Appl. Math. 1985)", url: "https://doi.org/10.1016/0196-8858(85)90002-8", license: "©", use: link}
  - {title: "Lattimore & Szepesvári — Bandit Algorithms (Cambridge 2020)", url: "https://tor-lattimore.com/downloads/book/book.pdf", license: "ücretsiz PDF", use: link}
  - {title: "Sutton & Barto — Reinforcement Learning: An Introduction (2. baskı), Bölüm 2", url: "http://incompleteideas.net/book/the-book-2nd.html", license: "CC BY-NC-ND 2.0", use: link}

hand:
  groups:
    - title: "Pişmanlık: kollar 0.9, 0.8, 0.5; sırasıyla 50, 30, 20 kez çekildi"
      fields:
        - {id: reg, label: "Beklenen kümülatif pişmanlık", answer: 11}
        - {id: eps, label: "Sabit ε = 0.1, büyük t'de adım başı pişmanlık (rastgele seçim 3 koldan)", answer: 0.016666666666666666, tol: 1.0e-9}
        - {id: har, label: "$\\sum_{t=1}^{100}1/t$ (≈ ln 100 + 0.5772)", answer: 5.187377517639621, tol: 1.0e-6}
    - title: "Hoeffding ve UCB1"
      fields:
        - {id: hoe, label: "$n=100$, $c=0.1$: $2e^{-2nc^2}$", answer: 0.2706705664732254, tol: 1.0e-6}
        - {id: ucb, label: "UCB1: ortalama 0.6, $n=100$, $n_a=10$", answer: 1.5597051061, tol: 1.0e-6}
    - title: "Beta–Bernoulli: önsel Beta(1,1), 3 tura 1 yazı (tura = ödül 1)"
      fields:
        - {id: ba, label: "Sonsal α", answer: 4}
        - {id: bm, label: "Sonsal ortalama", answer: 0.6666666666666666, tol: 1.0e-9}
  verify: |
    import math
    answers = dict(reg=30 * 0.1 + 20 * 0.4, eps=0.1 * (0 + 0.1 + 0.4) / 3, har=sum(1 / t for t in range(1, 101)),
                   hoe=2 * math.exp(-2 * 100 * 0.01), ucb=0.6 + math.sqrt(2 * math.log(100) / 10), ba=4, bm=4 / 6)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Hoeffding sınırı ne kadar sıkı?", engine: browser}
  - {id: x2, title: "Durağan olmayan haydut: örnek ortalaması vs sabit α", engine: browser}
  - {id: x3, title: "Reklam yerleştirme ve Bayesçi A/B testi", engine: browser}
  - id: x4
    title: 'Sutton 2.11: 200000 adımda durağan olmayan parametre taraması'
    engine: browser

quiz:
  - q: "Sabit ε ile ε-açgözlü neden doğrusal pişmanlık verir?"
    options:
      - {t: "Büyük t'de bile her adımda ε olasılıkla rastgele kol çekilir; adım başı beklenen pişmanlık sabit kalır", ok: true, why: "ε_t ∝ 1/t ile Σ1/t ≈ ln n: logaritmik."}
      - {t: "Ortalamalar yakınsamadığı için", why: "Yakınsar; sorun keşfin hiç azalmaması."}
      - {t: "Logaritmik verir", why: "Hayır."}
  - q: "UCB'nin $\\sqrt{2\\ln n/n_a}$ terimi neden her kolun sonsuz kez denenmesini sağlar?"
    options:
      - {t: "Hiç çekilmeyen kolun n_a'sı sabitken ln n büyür; sınır sonunda en iyi kolunkini aşar", ok: true, why: "Bu yüzden iyimser strateji en iyi kola yakınsar."}
      - {t: "Rastgele seçim yaptığı için", why: "UCB deterministiktir."}
      - {t: "n_a azaldığı için", why: "Sayaçlar azalmaz."}
  - q: "Thompson örneklemesinde k (örnek sayısı) büyüdükçe ne olur?"
    options:
      - {t: "R̂ sonsal ortalamaya yaklaşır, rastgelelik ve dolayısıyla keşif azalır; k → ∞ sonsal ortalamaya göre açgözlü olur", ok: true, why: "Pratikte k = 1."}
      - {t: "Keşif artar", why: "Tersine."}
      - {t: "Etkisi yoktur", why: "Keşfi doğrudan ayarlar."}

homework:
  - title: "Auer ve ark. (2002): UCB1'in sonlu zaman analizi"
    paper: "Auer, Cesa-Bianchi, Fischer — Finite-time Analysis of the Multiarmed Bandit Problem"
    url: "https://doi.org/10.1023/A:1013689704352"
    level: orta
    hours: 8
    goal: |
      UCB1, UCB1-Tuned, UCB2 ve ε_n-greedy'yi (ε_n = min(1, cK/(d²n))) makalenin Bernoulli deney düzenekleriyle (Tablo 1: 1–14 numaralı dağılımlar) karşılaştır; Teorem 1'deki pişmanlık üst sınırını $8\sum_{i:\Delta_i>0}\ln n/\Delta_i+(1+\pi^2/3)\sum\Delta_i$ deneysel pişmanlıkla aynı grafikte çiz.
    steps:
      - "e aşamasındaki vektörel simülasyonu genişlet (100 deney × 100 000 adım)."
      - "Log-x ekseninde pişmanlık."
    accept:
      - "UCB1 sınırın altında kalır; sınır gevşektir (≈ 5–10 kat)."
      - "UCB1-Tuned çoğu düzenekte en iyisidir (makale Şekil 2–5 nitel)."
  - title: "Chapelle & Li (2011): Thompson örneklemesinin deneysel değerlendirmesi"
    paper: "Chapelle & Li — An Empirical Evaluation of Thompson Sampling (NeurIPS 2011)"
    url: "https://papers.nips.cc/paper/2011/hash/e53a0a2978c28872a4505bdb51db06dc-Abstract.html"
    level: orta
    hours: 6
    goal: |
      Makalenin Bölüm 3 simülasyonunu yeniden üret: K ∈ {10, 100}, en iyi kol 0.5, diğerleri 0.5 − ε (ε ∈ {0.02, 0.1}), 10⁷ adıma kadar; Thompson, UCB ve Lai–Robbins asimptotik alt sınırını karşılaştır. Gecikmeli geri bildirim deneyini (Tablo 1) ve sonsal yapay olarak "sıkıştırma"nın (α ile ölçekleme) etkisini de dene.
    steps:
      - "Beta örneklemesini vektörel yap; 10⁷ adım için yığın halinde ilerle."
    accept:
      - "Thompson eğrisinin eğimi Lai–Robbins sınırına yaklaşır, UCB'den düşük kalır."
      - "Gecikmede Thompson UCB'den daha az etkilenir."

labs:
  - id: l1
    lab: bandit
    title: "ε-greedy, UCB1 ve Thompson: pişmanlık nasıl büyür?"
    goal: "Pişmanlık $R_T=\\sum_t(\\mu^*-\\mu_{a_t})$. Sabit ε'lu ε-greedy sonsuza dek ε oranında rastgele kol çeker: $R_T\\approx\\varepsilon\\bar\\Delta T$ (doğrusal). UCB1 ve Thompson keşfi belirsizlikle orantılı yapar: $R_T=O(\\log T)$."
    predict:
      q: "Ufku 500'den 5000'e çıkarırsan ε-greedy (ε = 0.1) ile Thompson'ın farkı nasıl değişir?"
      options:
        - {t: "Kapanır", why: "ε-greedy doğrusal, Thompson logaritmik büyür."}
        - {t: "Açılır", ok: true, why: "Doğrusal ile logaritmik arasındaki fark T ile büyür."}
    presets:
      - {name: "Uzun ufuk", params: {T: 5000}, note: "Eğrilerin şekline bak: doğru vs log."}
      - {name: "Küçük fark", params: {gap: 0.02, T: 5000}, note: "Δ küçükken en iyi kolu bulmak ≈ 1/Δ² çekiş ister; pişmanlık uzun süre doğrusal görünür."}
      - {name: "ε = 0", params: {eps: 0}, note: "Saf açgözlü: ilk şanslı kola takılabilir (tohumları dene)."}
      - {name: "UCB c küçük", params: {c: 0.3, B: {c: 2}}, note: "Az keşif hızlıdır ama yanlış kola kilitlenme riski taşır."}
    limits: "Bernoulli ödüller, 30 tekrar ortalaması; kollar sabit (durağan)."
  - id: l2
    lab: ucbbound
    title: "UCB1'in içi: güven terimleri, çekilme sayıları ve alt sınır"
    goal: |
      Bernoulli kollarda UCB1'i n adım oynat; o andaki görgül ortalamaları, güven terimlerini ve gerçek ortalamaları yan yana gör. Çekilme sayılarını Auer ve ark.'nın 8 ln n/Δ² üst sınırıyla, birikimli pişmanlığı Lai–Robbins alt sınırının öncü terimiyle karşılaştır; güven çarpanı c'nin etkisini dene.
    predict:
      q: "UCB1 (c = 1), 4 kol, n = 1000: en kötü kol (μ = 0.4) yaklaşık kaç kez çekilir?"
      options:
        - {t: "≈ 600: Auer sınırı 8 ln n / Δ²", why: "Sınır kötümser; gerçek sayı çok daha az."}
        - {t: "≈ 100", ok: true, why: "Bu tohumda 99; güven terimi √(2 ln n / n_a) bu kolu ara sıra yeniden denetiyor."}
        - {t: "0: kötü kol hiç denenmez", why: "UCB her kolu sonsuz kez (ama logaritmik sıklıkla) dener."}
    presets:
      - {name: "UCB1, n = 1000", params: {K: 4, n: 1000, c: 1}, note: "Çekilmeler 582 / 204 / 115 / 99; pişmanlık 73."}
      - {name: "Uzun ufuk", params: {K: 4, n: 5000, c: 1}, note: "Pişmanlık 167; Lai–Robbins öncü terimi 71."}
      - {name: "Altı kol", params: {K: 6, n: 5000, c: 1}, note: "Pişmanlık 175."}
      - {name: "Az keşif (c = 0.3)", params: {K: 4, n: 1000, c: 0.3}, note: "Bu tohumda şanslı: pişmanlık 5.8."}
      - {name: "Açgözlü (c = 0)", params: {K: 4, n: 1000, c: 0}, note: "Tohuma göre ya çok iyi ya da en iyi kolu hiç bulamıyor."}
    questions:
      - q: "c = 0.3 bu tohumda UCB1'den çok daha az pişmanlık yapıyor. Neden yine de UCB1'in c = 1'i tercih edilir?"
        a: "Pişmanlık rastgeledir ve tek bir çalıştırma beklenen pişmanlık hakkında az şey söyler. Küçük c az keşif demektir: çoğu çalıştırmada hızla doğru kolu bulur ama bazı çalıştırmalarda en iyi kol erken şanssız kalır ve uzun süre (belki hiç) denenmez; o çalıştırmalar doğrusal pişmanlık yapar. c = 1'in (δ = 1/n⁴) Hoeffding tabanlı güvencesi her ortamda logaritmik beklenen pişmanlık verir; daha küçük c'ler bu güvenceyi kaybeder."
    limits: "Ortalamalar sabit (0.7, 0.6, …); Bernoulli ödüller; tek çalıştırma (tohumla değişir). Lai–Robbins çizgisi yalnız öncü terim, sabitler yok."
  - id: l3
    lab: betapost
    title: "Beta sonsalları ve Thompson'ın bir sonraki seçimi"
    goal: |
      İki madeni paranın gözlenen tura ve yazı sayılarından Beta sonsallarını çiz. Thompson örneklemesinin bir sonraki atışta her parayı hangi olasılıkla seçtiğini (k = 1'de sonsal olasılık P(θ₁ > θ₂)) ve örnek sayısı k ile önselin bunu nasıl değiştirdiğini gör.
    predict:
      q: "C1: 3 tura 2 yazı (ortalama 0.57), C2: 12 tura 10 yazı (ortalama 0.54). Thompson (k = 1) bir sonraki atışta C1'i hangi olasılıkla seçer?"
      options:
        - {t: "1: ortalaması daha yüksek", why: "Bu açgözlü seçim; Thompson belirsizliği kullanır."}
        - {t: "≈ 0.56", ok: true, why: "C1'in sonsalı geniş; daha iyi olma olasılığı yalnız 0.56."}
        - {t: "≈ 0.19 (5 / 27 gözlem payı)", why: "Seçim gözlem sayısıyla değil sonsal olasılıkla."}
    presets:
      - {name: "Az gözlenen kol", params: {h1: 3, t1: 2, h2: 12, t2: 10, k: 1, a0: 1}, note: "P(C1) ≈ 0.56."}
      - {name: "k = 10", params: {h1: 3, t1: 2, h2: 12, t2: 10, k: 10, a0: 1}, note: "0.68: açgözlüye yaklaşıyor."}
      - {name: "Çok veri", params: {h1: 30, t1: 20, h2: 12, t2: 10, k: 1, a0: 1}, note: "C1 sonsalı daralıyor: 0.67."}
      - {name: "Güçlü önsel", params: {h1: 3, t1: 2, h2: 12, t2: 10, k: 1, a0: 5}, note: "Önsel iki parayı 0.5'e çekiyor: ≈ 0.51."}
      - {name: "Hiç denenmemiş C1", params: {h1: 0, t1: 0, h2: 12, t2: 10, k: 1, a0: 1}, note: "Düzgün önsel: C1 yine 0.46 olasılıkla denenir."}
    questions:
      - q: "Hiç denenmemiş C1, ortalaması 0.54 olan C2'ye karşı neden 0.46 olasılıkla seçiliyor, ve bu iyi bir şey mi?"
        a: "C1'in sonsalı önselin kendisidir (Beta(1, 1), düzgün): θ₁'in C2'nin örneğinden büyük çıkma olasılığı yaklaşık P(U > 0.54) ≈ 0.46. Bilgi eksikliği keşfe dönüşür; az bilinen kol, iyi olma olasılığıyla orantılı denenir. Bu iyidir, çünkü C1 gerçekten daha iyi olabilir; kötüyse birkaç denemede sonsalı daralır ve seçilme olasılığı hızla düşer."
    limits: "İki kol; olasılıklar 20 000 tekrarlı tohumlu Monte Carlo ile (±0.01). Önsel iki kol için aynı Beta(α₀, α₀)."
  - id: l4
    lab: suttonbandits
    title: 'Sutton: on kollu deney yatağı ve kaynak şekilleri'
    goal: Gauss ödüllerinde örnek ortalaması, iyimserlik, UCB ve gradyan yöntemini kaynak katsayılarıyla ölç.
      Durağanlık ve ölçüm aralığını değiştir; tek koşunun bir üstünlük kanıtı olmadığını gör.
    predict:
      q: 10 kolda ε=0.1 için tek en iyi kol öğrenildikten sonra seçim olasılığı kaçtır?
      options:
      - t: '0.91'
        ok: true
        why: 1−ε+ε/10 = 0.91; keşif en iyi kolu da seçebilir.
      - t: '0.9'
        why: Rastgele dalın en iyi kol payı da eklenir.
      - t: '1'
        why: Sabit keşif sürüyor.
    presets:
    - name: Şekil 2.2
      params:
        mode: 0
        T: 1000
        runs: 2000
        scale: 1
      note: 'Kaynak s. 29, Şekil 2.2: 2000 bağımsız görev × 1000 adım; algoritma parametre çarpanı 1. Kendi tohumumuzla
        yeniden hesaplanır.'
    - name: Şekil 2.3
      params:
        mode: 1
        T: 1000
        runs: 2000
        scale: 1
      note: 'Kaynak s. 34, Şekil 2.3: 2000 bağımsız görev × 1000 adım; algoritma parametre çarpanı 1. Kendi tohumumuzla
        yeniden hesaplanır.'
    - name: Şekil 2.4
      params:
        mode: 2
        T: 1000
        runs: 2000
        scale: 1
      note: 'Kaynak s. 36, Şekil 2.4: 2000 bağımsız görev × 1000 adım; algoritma parametre çarpanı 1. Kendi tohumumuzla
        yeniden hesaplanır.'
    - name: Şekil 2.5
      params:
        mode: 3
        T: 1000
        runs: 2000
        scale: 1
      note: 'Kaynak s. 38, Şekil 2.5: 2000 bağımsız görev × 1000 adım; algoritma parametre çarpanı 1. Kendi tohumumuzla
        yeniden hesaplanır.'
    - name: Şekil 2.6
      params:
        mode: 4
        T: 1000
        runs: 2000
        scale: 1
      note: 'Kaynak s. 42, Şekil 2.6: 2000 bağımsız görev × 1000 adım; algoritma parametre çarpanı 1. Kendi tohumumuzla
        yeniden hesaplanır.'
    - name: Alıştırma 2.5
      params:
        mode: 5
        T: 10000
        runs: 2000
        scale: 1
      note: 'Kaynak s.33: eşit 0 başlangıç, σ_yürüyüş=0.01, ε=0.1, α=0.1; 10000 adım.'
    - name: Alıştırma 2.11
      params:
        mode: 6
        T: 200000
        runs: 8
        scale: 1
      note: 'Kaynak s.44: 200000 adım, son 100000 ortalaması; 8 tekrar açıkça seçilen hesap bütçesidir.'
    questions:
    - q: Parametre taramasının dikey ekseni neden son adım ödülü değil?
      a: Şekil 2.6 bütün 1000 adımın ortalamasını kullanır. Alıştırma 2.11 yalnız son 100000 adımı kullanır.
        Bunlar farklı öğrenme evrelerini ölçer.
    - q: Ön ayarda eğri neden kaynakla piksel piksel aynı değil?
      a: Dağılım ve katsayılar aynı; bağımsız görev çekilişimiz, ödül gürültüsü ve tohum farklı. Monte Carlo
        gürültüsü nedeniyle sayılar değişir.
    limits: 10 kollu Gauss ortamı. Durağanda q* ~ N(0,1), gradyan karşılaştırmasında N(4,1); ödül standart sapması
      1. Değişen ortam bütün q*=0 ile başlar ve her adım bağımsız σ=0.01 yürür. Kaynak ayarları parametre çarpanı
      1 ile kullanılır. Çizgi grafikleri ilk 30 adımı ve sonra seyreltilmiş noktaları gösterir; tarama ortalaması
      bütün ilgili ödülleri kullanır. Büyük ayar bütçesi açıklamalı reddedilir. Kaynak uzun deneyleri tarayıcıda
      zaman alabilir; kısa ön izleme onların yerine geçmez.

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Pişmanlığı hesaplamak
    goal: Pişmanlık tanımını uygulamak
    needs: $\sum_a\Delta_aN_a$
    q: |-
      Üç kolun ortalamaları 0.6, 0.5, 0.2. 100 adımda kollar sırasıyla 70, 20, 10 kez çekildi. Beklenen birikimli pişmanlık nedir?
    solution: |-
      $\Delta=(0,0.1,0.4)$; pişmanlık $20\cdot0.1+10\cdot0.4=6$. En kötü kolun az çekilmesi bile pişmanlığın yarısından fazlasını oluşturur: büyük boşluklu kollardan hızlı vazgeçmek önemlidir.
  - id: p2
    type: hesap
    level: 1
    title: UCB1 indisi
    goal: UCB1 güven terimini hesaplamak
    needs: $\tilde R+\sqrt{2\ln n/n_a}$
    q: |-
      $n=1000$ adımda bir kol 50 kez çekilmiş ve ortalaması 0.55. UCB1 indisi nedir?
    answer: 1.0756522
    calc: "0.55 + sqrt(2*log(1000)/50)"
    mistakes:
      - {answer: 0.8964102, msg: "ln n yerine log₁₀ n kullanılmış."}
      - {answer: 0.9216922, msg: "Karekök içinde 2 unutulmuş: √(ln n / n_a)."}
    hints:
      - "$\\ln1000\\approx6.91$."
    solution: |-
      $\sqrt{2\cdot6.908/50}=0.5257$; indis $1.0757$. Ortalaması 0.6 olup 500 kez çekilmiş bir kolun indisi $0.6+0.166=0.766$: az denenen kol, düşük ortalamasına rağmen seçilir.
  - id: p3
    type: hesap
    level: 1
    title: Beta sonsal ortalaması
    goal: Eşlenik güncellemeyi uygulamak
    needs: $\alpha/(\alpha+\beta)$
    q: |-
      Önsel $\text{Beta}(2,2)$. 8 atışta 6 tura, 2 yazı gözlendi. Sonsal ortalama nedir?
    answer: 0.6666667
    calc: "(2+6)/(2+6+2+2)"
    mistakes:
      - {answer: 0.75, msg: "Bu görgül oran 6/8; önsel iki tura ve iki yazı daha ekliyor."}
      - {answer: 0.7, msg: "Önsel Beta(1, 1) gibi hesaplanmış: (1 + 6)/(1 + 6 + 1 + 2)."}
    hints:
      - "Sonsal $\\text{Beta}(2+6,\\,2+2)$."
    solution: |-
      $\text{Beta}(8,4)$, ortalama $8/12=0.667$. Önsel, 2 tura ve 2 yazılık sanal gözlem gibi davranır ve kestirimi 0.5'e doğru çeker.
  - id: p4
    type: yöntem-seç
    level: 2
    title: Kampanya süresince reklam seçimi
    goal: Haydut algoritmasını koşullara göre seçmek
    needs: Pişmanlık türleri
    q: |-
      Bir site 20 reklamdan birini gösterecek; tıklanma oranları %1–%3 arasında ve kampanya bir milyon gösterim sürecek. Gelir en çoklansın. Hangisi?
    choices:
      - {t: "Sabit ε = 0.1 ile ε-açgözlü", why: "Gösterimlerin %10'u sonsuza dek rastgele: doğrusal pişmanlık, bir milyon gösterimde büyük kayıp."}
      - {t: "Beta–Bernoulli Thompson örneklemesi", ok: true, why: "Logaritmik pişmanlık, ayar gerektirmez, küçük CTR farklarında pratikte UCB1'den iyi."}
      - {t: "Önce her reklamı 10 000 kez göster, sonra en iyisini seç", why: "200 000 gösterim keşfe harcanıyor; %1–%3 farkları için bile fazla, kötü reklamlardan erken vazgeçilmiyor."}
    hints:
      - "Kampanyanın sonunda kaç gösterim keşfe harcanmış olur?"
    solution: |-
      Thompson, kötü reklamları belirsizlikleri azaldıkça otomatik olarak bırakır. Reklamların bağlama (kullanıcıya) göre farklı performansı varsa bağlamlı haydut (M11.8) gerekir.
  - id: p5
    type: hata-bul
    level: 2
    title: Hiç seçilmeyen kol
    goal: UCB'de başlatmayı doğru yapmak
    needs: UCB1 başlangıcı
    q: |-
      Bir öğrencinin UCB kodunda `n_a = [1e-9]*K`, `mean = [0]*K` ve indis `mean[a] + sqrt(2*log(n+1)/n_a[a])`. Kod çalışıyor ama ilk adımlarda garip davranıyor ve ara sıra NaN üretiyor. Ne yanlış?
    choices:
      - {t: "log(n+1) yerine log(n) olmalı", why: "Küçük bir fark; asıl sorun bölme."}
      - {t: "Her kol önce bir kez oynanmalı (n_a ≥ 1); 1e-9'a bölmek devasa güven terimleri ve sayısal taşmalar üretiyor, ortalama güncellemesi de n_a = 1e-9'la bozuluyor", ok: true, why: "UCB1'in tanımı her kolun en az bir kez denenmesini varsayar."}
      - {t: "Ortalama 0 yerine 0.5 başlatılmalı", why: "Başlangıç değeri, ilk çekilişten sonra önemini yitirmeli; sorun bölmede."}
    hints:
      - "İlk K adımda hangi kollar oynanmalı?"
    solution: |-
      İlk $K$ adımda her kolu bir kez oyna, sonra indisi kullan. Alternatif olarak hiç oynanmamış kolun indisi $+\infty$ alınır (iyimserlik).
  - id: p6
    type: kanıt
    level: 3
    title: Hoeffding'den UCB1'in güven terimine
    goal: Güven teriminin türetimini yapmak
    needs: Hoeffding, $\delta=n^{-4}$
    q: |-
      $[0,1]$'de bağımsız $n_a$ ödülün ortalaması için Hoeffding $P(R\ge\tilde R+c)\le e^{-2n_ac^2}$ verir. (a) $P(R\le\tilde R+c)\ge1-\delta$ için gereken $c$'yi bulun. (b) $\delta=n^{-4}$ ile UCB1'in $\sqrt{2\ln n/n_a}$ terimini elde edin. (c) Bu seçimin neden $n$ ile azalan bir hata olasılığı istediğini açıklayın.
    rubric:
      - "(a) e^{−2n_a c²} = δ'dan c = √(ln(1/δ)/(2n_a)) buldum"
      - "(b) ln(1/δ) = 4 ln n koyup √(4 ln n/(2n_a)) = √(2 ln n/n_a) elde ettim"
      - "(c) Toplam pişmanlıkta her adımın hata olasılığı toplandığını; Σ_n n · n^{−4} (kollar ve sayılar üzerinden birleşim sınırı) sonlu kaldığı için sınırın ihlallerinin pişmanlığa sabit katkı yaptığını belirttim"
      - "Sabit δ'nın ise n ile doğrusal sayıda ihlale ve doğrusal pişmanlığa yol açabileceğini belirttim"
    hints:
      - "Her adımda yanlış bir sınır en çok bir hata yapar; hata olasılıklarının toplamı sonlu olmalı."
    solution: |-
      (a) $c=\sqrt{\ln(1/\delta)/(2n_a)}$. (b) $\sqrt{4\ln n/(2n_a)}=\sqrt{2\ln n/n_a}$. (c) Sınır ihlali bir adımda yanlış kolu seçtirebilir. Birleşim sınırıyla $t$ adımında ihlal olasılığı $O(t\cdot t^{-4})$'tür ve $\sum_tt^{-3}<\infty$: ihlallerin pişmanlığa katkısı sabittir; geriye $8\ln n/\Delta^2$ terimi kalır.
  - id: p7
    type: hesap
    level: 1
    title: 'Sutton 2.1: rastgele seçim de açgözlü olabilir'
    goal: rastgele seçim de açgözlü olabilir
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'İki eylem ve ε = 0.5 için ε-açgözlü kuralın tek açgözlü eylemi seçme olasılığı nedir?

      (Kaynak: Sutton ve Barto, s. 28, Alıştırma 2.1.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: Açgözlü dalın olasılığı 1 − ε = 0.5. Rastgele dalda aynı eylem ε/2 = 0.25 olasılıkla gelir. Toplam
      0.75. İki eylemin değerleri eşitse ikisi de açgözlüdür; bu durumda bir açgözlü eylem seçme olasılığı 1
      olur. Sorudaki tek açgözlü eylem yorumu burada açık tutuldu.
    answer: 0.75
    calc: 1-0.5+0.5/2
    tol: 1.0e-09
    mistakes:
    - answer: 0.5
      msg: Bu yalnız açgözlü dal; rastgele seçim de aynı kolu seçebilir.
  - id: p8
