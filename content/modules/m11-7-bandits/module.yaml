  - id: p13
    type: kanıt
    level: 2
    title: 'Sutton 2.7: ilk-değer yanlılığını kaldır'
    goal: ilk-değer yanlılığını kaldır
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'α>0 sabit, o₀=0, oₙ=oₙ₋₁+α(1−oₙ₋₁), βₙ=α/oₙ olsun. βₙ ile ödül güncellemenin başlangıç yanlılığı taşımayan
      üstel yakın-geçmiş ortalaması verdiğini Denklem 2.6 benzeri analizle göster.

      (Kaynak: Sutton ve Barto, s. 35, Alıştırma 2.7.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: 'Yakın-geçmiş ağırlıklı ortalama yorumu için 0<α≤1 al. İlk özyinelemeden oₙ=1−(1−α)ⁿ ve β₁=1 bulunur;
      böylece Q₁ ağırlığı hemen sıfırlanır. Ayrıca

      $$1-\beta_j=\frac{(1-\alpha)[1-(1-\alpha)^{j-1}]}{1-(1-\alpha)^j}.$$

      Genel ağırlık formülünde α yerine β koy; çarpım teleskopik olur:

      $$\beta_i\prod_{j=i+1}^{n}(1-\beta_j)=\frac{\alpha(1-\alpha)^{n-i}}{1-(1-\alpha)^n}.$$

      Böylece Qₙ₊₁ bu ağırlıklarla R₁…Rₙ toplamıdır. Payda üstel ağırlıkların toplamıdır; ağırlıklar normalize,
      başlangıç katkısı sıfırdır. α=1 için sadece son ödül kalır. α>1 genel olarak pozitif-ağırlıklı ortalama
      yorumu vermez; kaynak önceki sabit adım bölümünün koşulu burada önemlidir.'
    rubric:
    - oₙ kapalı formunu ve β₁=1 sonucunu bulur.
    - Teleskopik ağırlık çarpımını gösterir.
    - Normalize üstel ağırlıkları ve başlangıç teriminin yokluğunu açıklar.
  - id: p14
    type: açıkla
    level: 2
    title: 'Sutton 2.8: UCB 11. adımda neden sıçrar ve geri iner?'
    goal: UCB 11. adımda neden sıçrar ve geri iner?
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'Şekil 2.4 içinde UCB performansı 11. adımda yükseliyor, sonraki adımlarda düşüyor. İki yönü de açıkla.
      c=1 iken sıçramanın daha az belirgin olması açıklamana uysun.

      (Kaynak: Sutton ve Barto, s. 36, Alıştırma 2.8.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: İlk 10 adımda denenmemiş kollara öncelik verilir. 11. adım öncesinde her N=1 olduğundan bonuslar
      eşittir; seçim ilk gözlemi en yüksek koladır. Bu gözlem hem daha yüksek gerçek değere hem olumlu gürültüye
      işaret edebilir; ortalama ödül yükselir. Ardından o kolun N sayısı 2 olur ve c√(ln t/N) bonusu düşer; diğer
      kollar büyük bonusla seçilir. Tek yüksek gözlemin ortalaması sonraki ödülle gerilerken keşif daha düşük
      beklenen ödüllü kolları da getirir; eğri düşebilir. c küçülünce bonus farkı daha azdır, seçilen iyi kolun
      terk edilmesi daha az zorlanır ve ortak sıçrama/düşüş zayıflar. Sadece “ilk tur bitti” demek düşüşü açıklamaz.
    rubric:
    - Verilen tüm koşulları kullanır.
    - Ara adımları ve sonucu açıklar.
    - Sonucun hangi koşullarda geçerli olduğunu belirtir.
  - id: p15
    type: kanıt
    level: 2
    title: 'Sutton 2.9: iki kollu softmax sigmoid olur'
    goal: iki kollu softmax sigmoid olur
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'İki eylem için softmax dağılımının istatistik ve sinir ağlarında kullanılan lojistik/sigmoid fonksiyonla
      aynı olduğunu göster.

      (Kaynak: Sutton ve Barto, s. 37, Alıştırma 2.9.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: 'İlk olasılığın pay ve paydasını eᴴ¹ ile böl:

      $$\pi(1)=\frac{e^{H_1}}{e^{H_1}+e^{H_2}}=\frac1{1+e^{-(H_1-H_2)}}=\sigma(H_1-H_2).$$

      İkincisi σ(H₂−H₁)=1−π(1). Tek tercihin sigmoidi değil, tercih farkının sigmoidi olduğu önemlidir. Ortak
      sabit eklemek farkı ve olasılığı değiştirmez.'
    rubric:
    - Verilen tüm koşulları kullanır.
    - Ara adımları ve sonucu açıklar.
    - Sonucun hangi koşullarda geçerli olduğunu belirtir.
  - id: p16
    type: hesap
    level: 2
    title: 'Sutton 2.10: bağlam ipucunun değeri'
    goal: bağlam ipucunun değeri
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'Her adımda 0.5 olasılıkla A durumunda gerçek değerler (0.1,0.2), 0.5 olasılıkla B durumunda (0.9,0.8)
      geliyor. Hangi durumda olduğunu bilmiyorsan en iyi beklenen başarı ve uygun davranış nedir? A/B etiketi
      veriliyor ama değerler hâlâ bilinmiyorsa öğrenilebilecek en iyi başarı ve davranış nedir? Sayısal alana
      ipuçlu limit başarıyı gir.

      (Kaynak: Sutton ve Barto, s. 41, Alıştırma 2.10.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: 'İpucusuz kol 1 ortalaması 0.5×0.1+0.5×0.9=0.5; kol 2 de 0.5×0.2+0.5×0.8=0.5. Geçmiş, bağımsız
      seçilen o anki A/B durumunu bildirmiyorsa herhangi bir sabit seçim veya karışım en fazla 0.5 verir. Etiket
      gelince iki ayrı problem öğrenilebilir: A durumunda kol 2 (0.2), B durumunda kol 1 (0.9). Limit ortalaması
      0.5×0.2+0.5×0.9=0.55, artış 0.05. Değerler başlangıçta bilinmediği için bu politikayı deneyimle öğrenmek
      gerekir; 0.55 ilk adım garantisi değildir.'
    answer: 0.55
    calc: 0.5*0.2+0.5*0.9
    tol: 1.0e-09
  - id: p17
    type: kod
    level: 2
    title: 'Sutton 2.11: 200000 adımlık parametre taraması'
    goal: 200000 adımlık parametre taraması
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'Alıştırma 2.5 durağan olmayan ortamı için Şekil 2.6 benzeri parametre taraması üret. Örnek ortalamalı
      yöntemlere sabit α=0.1 ε-açgözlüyü de kat. Her çalıştırma 200000 adım olsun; her yöntem/ayarın ölçütü son
      100000 adımın ortalama ödülü olsun.

      (Kaynak: Sutton ve Barto, s. 44, Alıştırma 2.11.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: Tam çözüm x4 içindeki bandit_sweep fonksiyonudur. ε için 2**p, p=−7…−2; gradyan α için p=−5…2;
      UCB c için p=−4…2; iyimser Q için p=−2…2 kullan. Aynı ε aralığını constant yöntemi için de ekle. configs=[(yöntem,parametre),…]
      listesini oluşturup bandit_sweep(8,200000,configs,seed=1) çağır. Her yöntemin sonuçlarını kendi parametresine
      karşı logaritmik eksende çiz. l4 Alıştırma 2.11 ön ayarı aynı ufuk ve son-yarı ölçütünü grafikle verir.
      Sekiz tekrar kaynakta belirtilen bir sabit değildir; burada açık raporlanan hesap bütçesidir. Daha fazla
      tekrar istatistiksel belirsizliği azaltır. Kısa x4 denetiminin geçmesi, uzun deneyin yapıldığını tek başına
      kanıtlamaz.
    rubric:
    - Önceki yürüyüş ortamını ve 200000 adımı korur.
    - Ölçümü sadece son 100000 ödülden yapar.
    - Sabit α=0.1 yöntemini ekler ve farklı parametreleri tarar.
    - Tekrar, tohum ve ölçütü grafiğe/notuna yazar.

pitfalls:
  - wrong: "Sabit küçük bir ε ile ε-açgözlü uzun vadede neredeyse en iyidir."
    right: "Sabit ε sonsuza dek ε oranında rastgele kol çeker: pişmanlık doğrusaldır (ε = 0.1'de 1000 adımda ≈ 20 ekler; Şekil 1). Logaritmik pişmanlık için ε azaltılmalı."
  - wrong: "UCB1'in pişmanlığı logaritmik olduğu için her ufukta sabit ε'dan azdır."
    right: "Büyüme hızı logaritmiktir ama sabiti büyüktür: 5 kollu örnekte T = 5000'de UCB1'in toplam pişmanlığı (178) sabit ε'unkinden (135) fazla; eğimi ise azalıyor. Asimptotik sınıflar sonlu ufku tek başına belirlemez."
  - wrong: "Thompson örneklemesinde k büyük seçilirse kestirimler daha doğru olur ve sonuç iyileşir."
    right: "k büyüdükçe örneklerin ortalaması sonsal ortalamaya yaklaşır ve seçim açgözlüye döner: keşif azalır. Standart Thompson k = 1'dir; seçilme olasılığı en iyi olma olasılığına eşittir."
  - wrong: "Haydut problemlerinin hiçbir biçiminin hesaplanabilir en iyi çözümü yoktur."
    right: "İndirimli Bayesçi biçimde Gittins indisi en iyidir (Gittins 1979). Sonlu ufuklu ya da sıklıkçı biçimlerde ise basit bir en iyi çözüm yoktur ve UCB, Thompson gibi yöntemler logaritmik pişmanlık sınırına ulaşır."
whatif:
  - q: "Kolların ortalamaları zamanla değişseydi (durağan olmayan haydut)?"
    a: "Örnek ortalaması eski gözlemleri sonsuza dek eşit ağırlıkta tutar ve değişimi izleyemez; sabit adımlı (üstel) ortalama ya da kayan pencere kullanılır. UCB'nin kayan pencereli (SW-UCB) ve indirimli (D-UCB) sürümleri, Thompson'da sonsal sayımlarının zamanla söndürülmesi aynı fikirdir."
  - q: "Ödüller [0, 1] dışında ve ağır kuyruklu olsaydı?"
    a: "Hoeffding sınırlı ödüller ister; ağır kuyruklu ödüllerde görgül ortalama aykırı değerlere duyarlıdır ve UCB1'in güvencesi geçersizdir. Medyan-of-means ya da kırpılmış ortalama gibi sağlam kestiricilerle UCB çeşitleri (robust UCB) ya da uygun önselli Bayesçi yöntemler kullanılır."
  - q: "Kol sayısı ödül gözleminden çok daha büyük olsaydı (ör. 10⁶ ürün)?"
    a: "Her kolu bir kez denemek bile imkânsız olur. Kollar arasında yapı kullanılmalıdır: kolların öznitelikleriyle ödülü genelleyen doğrusal ya da sinir ağı modelleri (bağlamlı ve doğrusal haydutlar, M11.8). Pişmanlık kol sayısına değil öznitelik boyutuna bağlı hâle gelir."
