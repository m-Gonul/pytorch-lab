  - id: p12
    type: açıkla
    level: 2
    title: 'Sutton 2.6: iyimser eğrinin erken salınımları'
    goal: iyimser eğrinin erken salınımları
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'Şekil 2.3 eğrileri 2000 rastgele görev ortalaması olduğuna göre, iyimser yöntem neden erken adımlarda
      düzenli sıçrama ve salınım gösterir? Bazı erken adımları ortalamada daha iyi/kötü yapan ortak mekanizmayı
      açıkla.

      (Kaynak: Sutton ve Barto, s. 35, Alıştırma 2.6.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: Ortalama almak, görevler arasında aynı sırada ortaya çıkan geçişi silmez. Q₁=5 ve α=0.1 iken bir
      kolun ilk olağan ödülü değerini yaklaşık 4.5 çevresine indirir; denenmemiş kollar 5 olarak kalır. Böylece
      çoğu görev önce 10 kolu yaklaşık bir kez tarar. Sonraki seçimlerde iyi ilk ödül alan kollara geçiş başarıyı
      yükseltir. Aynı kol tekrar seçildikçe başlangıç iyimserliği daha fazla azalır; daha az denenmiş başka kollar
      yeniden çekici olur ve ortak tarama dalgaları doğar. Normal dağılım sınırsız olduğundan tam 10 adımda bütün
      kolların bir kez denenmesi kesin bir yasa değildir. Sıçrama Monte Carlo hatası olmak zorunda değildir;
