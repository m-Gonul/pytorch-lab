  - id: p9
    type: hesap
    level: 2
    title: 'Sutton 2.3: uzun vadeli fark'
    goal: uzun vadeli fark
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'Şekil 2.2 içindeki yöntemlerden hangisi uzun vadede birikimli ödül ve en iyi eylemi seçme bakımından
      öne çıkar? Farkı sayısallaştır. Sayısal alana en iyi kol olasılıkları arasındaki farkı gir.

      (Kaynak: Sutton ve Barto, s. 30, Alıştırma 2.3.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: Durağanlık, sonsuz ziyaret ve örnek ortalaması yakınsamasıyla ε=0.01 için P(en iyi)=0.99+0.001=0.991;
      ε=0.1 için 0.9+0.01=0.91. Fark 0.081, yani 8.1 yüzde puan. Bir görevde limit ödül hızı (1−ε)q*max+ε·ortalama(q*)
      olur; fark 0.09(q*max−ortalama(q*)). Görevler üzerinden E[ortalama(q*)]=0. On standart normalin maksimumunun
      beklenen değeri sayısal integralle 1.538752730835; hızlar 1.523365203527 ve 1.384877457752, fark 0.138487745775.
      Kaynağın yaklaşık 1.55 değeri kullanılırsa fark yaklaşık 0.1395 olur. Uzun T için birikimli farkın baskın
      terimi bu hız farkı × T olur; bu, her sonlu ufukta üstünlük garantisi değildir. ε=0 kaynak koşusunda yaklaşık
      1 ödülde ve üçte bir görevde en iyi kolda kilitlenir.
    answer: 0.081
    calc: 0.991-0.91
    tol: 1.0e-09
    rubric:
    - "En iyi kol olasılıklarını ve 8.1 yüzde puan farkını hesaplar."
    - "Ödül hızı farkını ve uzun vadeli birikimli ödülle ilişkisini ayrıca hesaplar."
  - id: p10
    type: kanıt
    level: 2
    title: 'Sutton 2.4: değişken adım ağırlıkları'
    goal: değişken adım ağırlıkları
    needs: Sutton Bölüm 2 deney modeli ve ilgili anlatım.
    q: 'Adım büyüklükleri αₙ sabit değilse, Denklem 2.6 benzeri biçimde önceki her ödülün Qₙ içindeki ağırlığını
      α dizisi cinsinden bul.

      (Kaynak: Sutton ve Barto, s. 33, Alıştırma 2.4.)'
    hints:
    - Kaynaktaki varsayımları ve gözlem sırasını yaz.
    - İlgili değer güncellemesini veya olasılık hesabını adım adım uygula.
    solution: 'Qₙ₊₁=(1−αₙ)Qₙ+αₙRₙ ile başla. Her yerine koymada önceki bütün ağırlıklar (1−αₙ) ile çarpılır;
      yeni ödül αₙ alır. İndüksiyonla

      $$Q_{n+1}=\prod_{j=1}^{n}(1-\alpha_j)Q_1+\sum_{i=1}^{n}\alpha_i\prod_{j=i+1}^{n}(1-\alpha_j)R_i.$$

      Başlangıç n=1 güncellemenin kendisidir. İndüksiyon adımında dışarıdaki (1−αₙ) bütün çarpımlara eklenir
      ve yeni αₙRₙ terimi gelir. Boş çarpım 1. Sorudaki Qₙ için n yerine n−1 kullan: Rᵢ ağırlığı αᵢ∏ⱼ₌ᵢ₊₁ⁿ⁻¹(1−αⱼ).
      αᵢ=1/i durumunda bütün ödül ağırlıkları 1/(n−1), ilk-değer ağırlığı 0 çıkar.'
    rubric:
    - Başlangıç değerinin çarpımını da gösterir.
    - Her ödülün indekslerini ve boş çarpımı doğru yazar.
    - İndüksiyon veya yerine koymayla kanıtlar.
  - id: p11
