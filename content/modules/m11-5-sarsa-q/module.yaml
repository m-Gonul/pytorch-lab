id: m11-5-sarsa-q
code: M11.5
title: Modelden bağımsız kontrol — SARSA, Q-öğrenme, keşif
phase: 11
minutes: 400
prereq: [m11-4-mc-td]
summary: >
  Değerlendirmeden kontrole: V yerine Q(s,a) öğren, çünkü açgözlü politikayı
  Q'dan model olmadan çıkarabiliriz. Monte Carlo kontrol (keşifçi
  başlangıçlar), politika üstü SARSA, politika dışı Q-öğrenme, beklenen
  SARSA, maksimizasyon yanlılığı ve çift Q-öğrenme; keşif ve sömürü
  ikilemi (ε-açgözlü, Boltzmann, iyimser başlangıç). Saf Python'da uçurum
  yürüyüşü, NumPy'da 10 000 deneyde maksimizasyon yanlılığı, PyTorch'ta
  eşzamanlı Q-öğrenmenin Q*'a yakınsaması ve 1000 paralel ortamda kontrol.
goals:
  - "Q-öğrenme hedefi $r+\\gamma\\max_{a'}Q(s',a')$, SARSA hedefi $r+\\gamma Q(s',a')$, beklenen SARSA hedefi $r+\\gamma\\sum_{a'}\\pi(a'|s')Q(s',a')$"
  - "[[politika dışı öğrenme]]: davranış politikası ε-açgözlü, öğrenilen politika açgözlü"
  - "[[maksimizasyon yanlılığı]]: $\\mathbb E[\\max\\hat Q]\\ge\\max\\mathbb E[\\hat Q]$ ve çift Q-öğrenme"
  - "[[ε-açgözlü]], Boltzmann ve iyimser başlangıçla keşif; GLIE koşulu"
sources:
  - {title: "Sutton & Barto — Reinforcement Learning: An Introduction (2. baskı), Bölüm 5.3 ve 6.4–6.7", url: "http://incompleteideas.net/book/the-book-2nd.html", license: "CC BY-NC-ND 2.0", use: link}
  - {title: "Watkins & Dayan — Q-learning (Machine Learning 1992)", url: "https://doi.org/10.1007/BF00992698", license: "©", use: link}
  - {title: "van Hasselt — Double Q-learning (NeurIPS 2010)", url: "https://papers.nips.cc/paper/2010/hash/091d584fced301b442654dd8c23b3fc9-Abstract.html", license: "©", use: link}
  - {title: "Even-Dar & Mansour — Learning Rates for Q-learning (JMLR 2003)", url: "https://www.jmlr.org/papers/v5/evendar03a.html", license: "©", use: link}

hand:
  groups:
    - title: "Tek güncelleme: $Q(s,a)=2$, $r=1$, $\\gamma=0.9$, $Q(s',\\cdot)=[3,5]$, $\\alpha=0.5$"
      fields:
        - {id: ql, label: "Q-öğrenme sonrası $Q(s,a)$", answer: 3.75}
        - {id: sa, label: "SARSA, sonraki eylem $a'=0$", answer: 2.85}
        - {id: es, label: "Beklenen SARSA, ε = 0.2 (2 eylem)", answer: 3.66}
    - title: "Keşif"
      fields:
        - {id: bz, label: "Boltzmann (τ = 1) ile $Q=[3,5]$'te eylem 1'in olasılığı", answer: 0.8807970779778823, tol: 1.0e-6}
        - {id: eg, label: "ε = 0.1, 4 eylem: açgözlü eylemin seçilme olasılığı", answer: 0.925}
    - title: "Maksimizasyon yanlılığı"
      fields:
        - {id: mb, label: "İki eylemin gerçek değeri 0, kestirimler bağımsız N(0,1): $\\mathbb E[\\max]$ (= 1/√π)", answer: 0.5641895835477563, tol: 1.0e-6}
  verify: |
    import math
    answers = dict(ql=2 + 0.5 * (1 + 0.9 * 5 - 2), sa=2 + 0.5 * (1 + 0.9 * 3 - 2),
                   es=2 + 0.5 * (1 + 0.9 * (0.1 * 3 + 0.9 * 5) - 2),
                   bz=1 / (1 + math.exp(-2)), eg=0.9 + 0.1 / 4, mb=1 / math.sqrt(math.pi))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Rüzgârlı ızgara dünyası ile SARSA", engine: browser}
  - {id: x2, title: "Keşif: zincir ortamında ε-açgözlü, Boltzmann, iyimser başlangıç", engine: browser}
  - {id: x3, title: "Monte Carlo kontrol: keşifçi başlangıçlarla blackjack", engine: browser}

quiz:
  - q: "Uçurum yürüyüşünde (ε = 0.1) Q-öğrenme uçurumun kenarından giden yolu öğrenir ama eğitim sırasında SARSA'dan daha az ödül toplar. Neden?"
    options:
      - {t: "Q-öğrenme açgözlü politikanın değerini öğrenir; ama ε-açgözlü davranırken kenarda rastgele adım uçuruma düşürür. SARSA keşfi hesaba katar ve güvenli yolu seçer.", ok: true, why: "Politika dışı ve politika üstü öğrenmenin farkı."}
      - {t: "Q-öğrenme yakınsamaz", why: "Yakınsar; öğrendiği yol en kısa yoldur."}
      - {t: "SARSA'nın öğrenme oranı daha yüksektir", why: "Aynı α."}
  - q: "Q-öğrenmede maksimizasyon yanlılığının kaynağı nedir?"
    options:
      - {t: "Aynı gürültülü kestirimlerle hem en iyi eylem seçilip hem de değerlendirilir: E[max Q̂] ≥ max E[Q̂]", ok: true, why: "Çift Q-öğrenme seçmeyi bir tabloyla, değerlendirmeyi diğeriyle yapar."}
      - {t: "İndirim faktörünün 1'den küçük olması", why: "İlgisiz."}
      - {t: "ε-açgözlü davranış", why: "Davranıştan bağımsız olarak hedefteki max'tan gelir."}
  - q: "GLIE (sonsuz keşifle sınırda açgözlü) koşulu ne gerektirir?"
    options:
      - {t: "Her (s,a) sonsuz kez denenir ve politika sınırda açgözlü olur (ör. ε_k = 1/k)", ok: true, why: "Bu koşulla SARSA/MC kontrol Q*'a yakınsar."}
      - {t: "ε sabit kalmalı", why: "Sabit ε ile sınırda açgözlü olmaz."}
      - {t: "Q başlangıçta sıfır olmalı", why: "Başlangıç değeri koşul değildir."}

homework:
  - title: "Watkins & Dayan (1992): Q-öğrenmenin yakınsaması"
    paper: "Watkins & Dayan — Q-learning (Machine Learning 1992)"
    url: "https://doi.org/10.1007/BF00992698"
    level: orta
    hours: 6
    goal: |
      Makaledeki yakınsama koşullarını (her (s,a) sonsuz kez, $\sum\alpha=\infty$, $\sum\alpha^2<\infty$, sınırlı ödül) deneysel olarak sına: rastgele MDP'lerde Q*'ı değer yinelemesiyle bul, Q-öğrenmeyi (a) ε-açgözlü, (b) bazı (s,a) çiftlerini hiç denemeyen davranış politikasıyla, (c) $\alpha_n=1/n$, $1/n^{0.6}$ ve $1/(1+(1-\gamma)n)$ ile çalıştır.
    steps:
      - "Bu modülün d aşamasındaki q_value_iteration'ı referans al."
      - "Hata ‖Q − Q*‖∞'u log-log çiz; γ = 0.9 ve 0.99 için 1/n'nin yavaşlığını göster (Even-Dar & Mansour)."
    accept:
      - "(b)'de denenmeyen çiftlerin Q değeri değişmez ve açgözlü politika yanlış olabilir."
      - "1/n ile hata γ = 0.99'da 10⁵ adımda bile büyük kalır."
  - title: "van Hasselt (2010): Çift Q-öğrenme"
    paper: "van Hasselt — Double Q-learning (NeurIPS 2010)"
    url: "https://papers.nips.cc/paper/2010/hash/091d584fced301b442654dd8c23b3fc9-Abstract.html"
    level: orta
    hours: 6
    goal: |
      Makalenin rulet ve 3×3 ızgara dünyası deneylerini yeniden üret. Izgarada her adımın ödülü −12 ya da +10 (eşit olasılık), hedefte +5; ε = 1/√n(s) ve α = 1/n(s,a). Q-öğrenme ile çift Q-öğrenmenin adım başı ortalama ödülünü ve başlangıç durumunun max Q kestirimini karşılaştır.
    steps:
      - "c aşamasındaki tablo düzenini kullan: iki Q tablosu, her adımda yazı-tura ile hangisinin güncelleneceğini seç."
      - "10 000 deney ortalaması."
    accept:
      - "Q-öğrenme max Q(s₀)'ı aşırı kestirir, çift Q-öğrenme hafifçe eksik kestirir (makale Şekil 2)."
