    options:
    - t: Hayır; sonlu tahmin model referansıyla karşılaştırılır, kalan fark açıkça ölçülür.
      ok: true
      why: Koşullar ve türetim ders içinde; deney bu ayrımı hesaplar.
    - t: Bütün sonlu örnekler her durumda tam değeri verir
      why: Sonlu örnekleme hatası ve durum ziyaretleri vardır. Tam model doğrulaması ayrı tutulur.
