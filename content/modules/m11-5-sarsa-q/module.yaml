- id: p16
  type: kanıt
  level: 3
  title: Double Expected SARSA güncellemeleri
  goal: Kaynak koşullarıyla double expected sarsa güncellemeleri
  needs: TD/SARSA hedefleri,koşullu beklenti ve temel Bellman denklemi
  q: 'ε-greedy hedef politikayla Double Expected SARSA güncelleme denklemlerini verin. Seçici/değerlendirici
    tabloların ve davranışın rollerini açıkça tanımlayın.


    Kaynak:Sutton ve Barto (2018),s.136,Alıştırma 6.13. Kaynakta yıldızlı alıştırma.'
  hints:
  - Hedefi hesapladığınız tablo sürümünü ve gerçek terminal sınırını açıkça belirtin.
  solution: 'Açık bir rol seçimi yapalım: $a_i^*=\arg\max_uQ_i(s'',u)$ tutarlı tek bir bağ kuralıyla seçilsin.
    Hedef $\pi_i(u\mid s'')=\varepsilon/m+(1-\varepsilon)\mathbf1_{u=a_i^*}$.


    Adil para Q1 güncellemesini seçerse


    $$Q_1(s,a)\leftarrow Q_1(s,a)+\alpha\left[r+\gamma\sum_u\pi_1(u\mid s'')Q_2(s'',u)-Q_1(s,a)\right].$$


    Q2 seçilirse π2 ağırlıklarıyla Q1 değerlendirilir. Davranış ayrı ε-greedy(Q1+Q2) olabilir;terminal
    devam 0. Bu bağ seçimiyle hedef ε0,Double Q güncellemesini;ε1,diğer tablonun düzgün ortalamasını verir.
    Sabit pozitif ε hedefi,ε0 optimal q* ile aynı hedef değildir. Denklemler seçici/değerlendirici rollerini
    tanımlar;iki adaptif tablonun bağımsızlığı veya genel tam yansızlık varsayılmaz.'
  rubric:
  - π1/π2 seçici rolü
  - Çapraz değerlendirme toplamları
  - Adil simetrik güncelleme
  - Davranış/terminal veε sınırları
- id: p17
  type: açıkla
  level: 2
  title: Jack için afterstate ve bilinen maliyet
  goal: Kaynak koşullarıyla jack için afterstate ve bilinen maliyet
  needs: TD/SARSA hedefleri,koşullu beklenti ve temel Bellman denklemi
  q: 'Jack’in Araba Kiralama görevini afterstate biçiminde yeniden tanımlayın. Bu görevde neden öğrenmenin
    daha hızlı yakınsamasını beklersiniz?


    Kaynak:Sutton ve Barto (2018),s.137,Alıştırma 6.14.'
  hints:
  - Hedefi hesapladığınız tablo sürümünü ve gerçek terminal sınırını açıkça belirtin.
  solution: 'Afterstate x,gece bilinen taşıma sonrası iki şubenin araç sayısı olsun.


    $$U_\pi(x)=\mathbb E[R_{\rm kira}+\gamma V_\pi(S_{\rm ertesi})\mid x],\qquad Q_\pi(s,a)=-2|a|+U_\pi(x(s,a)).$$


    Bilinen taşıma maliyeti,öğrenilen ortak devamla karıştırılmaz. (10,10),a0 ve(11,9),a1 aynı (10,10)
    x değerini verir;ama Q değerleri maliyet nedeniyle 2 farklıdır. Ortak kiralama/iade örnekleri her
    iki çifte aktarılır.441 envanter afterstate''i çok daha fazla durum/taşıma çiftinin bilinmeyen devamını
    paylaşır:daha az parametre,veri yeniden kullanımı ve bilinen ilk etkiyi hesaplama avantajı. Bir günün
    taşıma ara aşamasına ayrı γ ekleyip iki kez indirimlemeyin. Hızlanmanın evrensel oranı ileri sürülmez.'
  rubric:
  - Afterstate envanteri
  - Bilinen maliyeti ayırdım
  - Ortakx farklıQ örneği
  - Veri paylaşımı ve doğru zaman/indirim
- id: p18
  type: çözülmüş
  level: 0
  title: Q-öğrenme backup diyagramını tahmin et
  goal: Numarasız kaynak sorusundaki kök ve maksimum yayını kurmak
  needs: Örnek durum geçişi,Q hedefi
  q: 'Q-öğrenme backup diyagramının kökü ve alt düğümleri nedir? Sonraki eylemlerin maksimumu nasıl gösterilir?
    Şekil 6.4 cevabını açmadan önce tahmin edin.


    Kaynak:Sutton ve Barto (2018),s.132,numarasız metin içi soru.'
  solution: Kök siyah durum-eylem düğümü(s,a);tek örnek ödüllü geçiş açık ardıl durum düğümüne gider.
    Ondan çıkan bütün olası sonraki eylemler siyah yapraklardır. Yaprakların üstündeki yay maksimum seçimini
    belirtir;olasılık ortalaması değildir. Expected SARSA aynı yaprakları politika olasılıklarıyla tartar,yay
    kullanmaz. Şekil 4 kendi Q=(0,1,2),R1,γ0.9 örneğinde Q hedefi 2.8,ε0.2 Expected hedefi 2.62 hesaplar.
pitfalls:
- wrong: Q-öğrenmenin Q*'a yakınsaması için davranış politikası sonunda açgözlü olmalıdır.
  right: Q-öğrenme politika dışıdır; her (s, a) sonsuz kez denenir ve Robbins–Monro koşulları sağlanırsa
    sabit ε ile de yakınsar. GLIE, SARSA'nın ve davranışın kendisinin en iyi hâle gelmesi için gerekir.
- wrong: Q-öğrenme her zaman SARSA'dan daha iyi sonuç verir, çünkü en iyi politikayı öğrenir.
  right: Varsayılan uçurum koşusunda son100 bölüm SARSA−27,Q−48.7;keşif kapalı açgözlü yollar−17/−13.
    Eğitim ve değerlendirme farklı ölçütlerdir. SARSA bütün görev ve ayarlarda daha iyi değildir;Q tablosunun
    sonlu eğitimde tam optimum olması da garanti edilmez.
- wrong: Kestirimler yansızsa onların maksimumu da yansızdır.
  right: E[max Q̂]≥max E[Q̂]. İki bağımsız standart normal kestirimde fark1/√π≈0.564;onda≈1.54. Double
    Q seçim ve değerlendirmeyi ayırır;genel adaptif MDP tablolarının bağımsız veya tam yansız olduğu sonucu
    çıkmaz.
- wrong: Q^π(s, a)'da sonraki durumun dağılımı π(s) ile belirlenir.
  right: 'İlk geçiş seçilen a ile olur: Q^π(s, a) = E[r | s, a] + γ Σ P(s⁺ | s, a) V^π(s⁺); π ancak ondan
    sonra devreye girer.'
- wrong: Yarışta çarpışma terminaldir.
  right: Aynı bölümde rastgele başlangıca sıfır hızla dönülür; her geçiş−1. Hareket parçasında bitiş daha
    önceyse terminaldir.
- wrong: γ<1 indirim duyarlı kontrolünde hedef dışı eylem görünce bütün geriye tarama kesilir.
  right: Daha kısa ufuklar o eylemi içermeyebilir; yalnız ilgili iç ufuk çarpımını kes, dış zaman taramasını
    sürdür.
whatif:
- q: Keşif hiç yapılmasaydı ama Q iyimser (büyük) değerlerle başlatılsaydı?
  a: 'Her denenen eylemin değeri gerçeğe doğru düşer ve ajan henüz denenmemiş, hâlâ iyimser değerli eylemlere
    yönelir: keşif kendiliğinden ve sistematik olur. Ama yalnız başlangıçta işe yarar; ortam değişirse
    ya da gürültü büyükse yetmez. Uçurum yürüyüşünde sıfır başlangıç (bütün gerçek değerler negatif) zaten
    iyimserdir.'
- q: Ortam zamanla değişseydi (ödüller kaysaydı)?
  a: α = 1/n eski deneyimi sonsuza dek eşit ağırlıkta tutar ve değişimi izleyemez; sabit α son deneyime
    daha çok ağırlık verir. Keşif de hiç sıfırlanmamalıdır; aksi hâlde eski en iyi eylem kötüleştiğinde
    fark edilmez.
- q: Durumlar sürekli olsaydı (ör. bir arabanın konumu ve hızı)?
  a: 'Tablo kullanılamaz; ya durum uzayı ızgaraya bölünür (karo kodlama) ya da Q bir fonksiyonla yaklaşılır:
    Q(s, a; w). Q-öğrenmenin hedefi aynı kalır ama yakınsama güvencesi kaybolur (fonksiyon yaklaşımı +
    bootstrapping + politika dışı öğrenme = ''ölümcül üçlü''). DQN bu sorunu deneyim tekrarı ve hedef
    ağla hafifletir (M11.6).'
