- id: p15
  type: karşı-örnek
  level: 3
  title: Açgözlü SARSA ile Q aynı mı?
  goal: Kaynak koşullarıyla açgözlü sarsa ile q aynı mı?
  needs: TD/SARSA hedefleri,koşullu beklenti ve temel Bellman denklemi
  q: 'Eylem seçimi hep açgözlü olsun. SARSA ile Q-öğrenme tam aynı algoritma mı;aynı eylemleri ve ağırlık
    güncellemelerini mi yaparlar?


    Kaynak:Sutton ve Barto (2018),s.132,Alıştırma 6.12.'
  hints:
  - Hedefi hesapladığınız tablo sürümünü ve gerçek terminal sınırını açıkça belirtin.
  solution: 'Genel olarak hayır. Tek durumlu öz döngü ve iki eylem alın: $Q(a)=1,Q(b)=0,r_a=-2,r_b=0,\gamma=0.9,\alpha=1$.
    İlk hedef ikisinde de $-2+0.9\cdot1=-1.1$.


    Ancak SARSA sonraki A′ eylemini güncellemeden önce eski Q ile a seçmiştir. Q-öğrenme sonraki adımda
    yeni Q tablosundan b seçer. Sonraki eylemler ve güncellemeler ayrılır. Ardıl satır güncellemeden etkilenmiyorsa
    ve bağlar aynı çözülüyorsa örtüşebilirler. Fonksiyon yaklaşımında bir güncelleme başka satırları da
    değiştirebilir.'
  rubric:
  - Önce/sonra seçim farkı
  - Geçerli öz döngü karşı örneği
  - İlk−1.1 ve sonraki a/b ayrımı
