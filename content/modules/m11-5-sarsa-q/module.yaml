id: m11-5-sarsa-q
code: M11.5
title: Modelden bağımsız kontrol — SARSA, Q-öğrenme, keşif
phase: 11
minutes: 700
prereq:
- m11-4-mc-td
summary: 'Değerlendirmeden kontrole: V yerine Q(s,a) öğren, çünkü açgözlü politikayı Q''dan model olmadan
  çıkarabiliriz. Monte Carlo kontrol (keşifçi başlangıçlar), politika üstü SARSA, politika dışı Q-öğrenme,
  beklenen SARSA, maksimizasyon yanlılığı ve çift Q-öğrenme; keşif ve sömürü ikilemi (ε-açgözlü, Boltzmann,
  iyimser başlangıç). Saf Python''da uçurum yürüyüşü, NumPy''da 10 000 deneyde maksimizasyon yanlılığı,
  PyTorch''ta eşzamanlı Q-öğrenmenin Q*''a yakınsaması ve 1000 paralel ortamda kontrol.

  '
goals:
- Q-öğrenme hedefi $r+\gamma\max_{a'}Q(s',a')$, SARSA hedefi $r+\gamma Q(s',a')$, beklenen SARSA hedefi
  $r+\gamma\sum_{a'}\pi(a'|s')Q(s',a')$
- '[[politika dışı öğrenme]]: davranış politikası ε-açgözlü, öğrenilen politika açgözlü'
- '[[maksimizasyon yanlılığı]]: $\mathbb E[\max\hat Q]\ge\max\mathbb E[\hat Q]$ ve çift Q-öğrenme'
- '[[ε-açgözlü]], Boltzmann ve iyimser başlangıçla keşif; GLIE koşulu'
- MC ES, ε-yumuşak iyileştirme, ağırlıklı politika dışı kontrol
- İki kaynak yarış pistinde segment fiziği ve gerçek MC; indirim duyarlı Q güncellemesi
- 'Sutton Bölüm6: SARSA/Q eylem seçim zamanlaması, GLIE ve dört kontrol kutusu'
- King hamleleri/stokastik rüzgâr; tam kaynak bütçeli uçurum; double roller ve afterstate maliyeti
