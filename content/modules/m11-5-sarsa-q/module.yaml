  solution: 'x6 ve windytd stokastik çeşidi uygular. Yalnız WIND[c]>0 sütunlarında temel−1,temel,temel+1
    eşit olasılıklı;0 sütunları değişmez. Hedefin sağı (3,8) konumundan sol hamle,hedef (3,7),bir üst
    (2,7),iki üst (1,7) verir;her biri 1/3. SARSA sonraki eylemi güncellemeden önce seçer,bitmemiş son
    parça terminal değildir.


    Sekiz eylemin model optimumu 10.9646090534948 beklenen adım. Kendi JS koşumuzda 100000 adım,α0.1,ε0.1,tohum
    1 sonrası öğrenilmiş hedef,1000 değerlendirmede 13.982 ortalama ve 0.249648 standart hata verdi. Model/öğrenim
    ayrılır;bitmeyen örnek varsa yalnız bitenlerin koşullu ortalaması tam beklenti sayılamaz. Python ve
    JS aynı sayısal tohumla aynı yolları üretmez.'
  rubric:
  - Pozitif sütunlarda üç rüzgâr
