quiz:
- q: Uçurum yürüyüşünde (ε = 0.1) Q-öğrenme uçurumun kenarından giden yolu öğrenir ama eğitim sırasında
    SARSA'dan daha az ödül toplar. Neden?
  options:
  - t: Q-öğrenme açgözlü politikanın değerini öğrenir; ama ε-açgözlü davranırken kenarda rastgele adım
      uçuruma düşürür. SARSA keşfi hesaba katar ve güvenli yolu seçer.
    ok: true
    why: Politika dışı ve politika üstü öğrenmenin farkı.
  - t: Q-öğrenme yakınsamaz
    why: Yakınsar; öğrendiği yol en kısa yoldur.
  - t: SARSA'nın öğrenme oranı daha yüksektir
    why: Aynı α.
- q: Q-öğrenmede maksimizasyon yanlılığının kaynağı nedir?
  options:
  - t: 'Aynı gürültülü kestirimlerle hem en iyi eylem seçilip hem de değerlendirilir: E[max Q̂] ≥ max
      E[Q̂]'
    ok: true
    why: Çift Q-öğrenme seçmeyi bir tabloyla, değerlendirmeyi diğeriyle yapar.
  - t: İndirim faktörünün 1'den küçük olması
    why: İlgisiz.
  - t: ε-açgözlü davranış
    why: Davranıştan bağımsız olarak hedefteki max'tan gelir.
- q: GLIE (sonsuz keşifle sınırda açgözlü) koşulu ne gerektirir?
  options:
  - t: Her (s,a) sonsuz kez denenir ve politika sınırda açgözlü olur (ör. ε_k = 1/k)
    ok: true
    why: Bu koşulla SARSA/MC kontrol Q*'a yakınsar.
  - t: ε sabit kalmalı
    why: Sabit ε ile sınırda açgözlü olmaz.
  - t: Q başlangıçta sıfır olmalı
    why: Başlangıç değeri koşul değildir.
homework:
- title: 'Watkins & Dayan (1992): Q-öğrenmenin yakınsaması'
  paper: Watkins & Dayan — Q-learning (Machine Learning 1992)
  url: https://doi.org/10.1007/BF00992698
  level: orta
  hours: 6
  goal: 'Makaledeki yakınsama koşullarını (her (s,a) sonsuz kez, $\sum\alpha=\infty$, $\sum\alpha^2<\infty$,
    sınırlı ödül) deneysel olarak sına: rastgele MDP''lerde Q*''ı değer yinelemesiyle bul, Q-öğrenmeyi
    (a) ε-açgözlü, (b) bazı (s,a) çiftlerini hiç denemeyen davranış politikasıyla, (c) $\alpha_n=1/n$,
    $1/n^{0.6}$ ve $1/(1+(1-\gamma)n)$ ile çalıştır.

    '
  steps:
  - Bu modülün d aşamasındaki q_value_iteration'ı referans al.
  - Hata ‖Q − Q*‖∞'u log-log çiz; γ = 0.9 ve 0.99 için 1/n'nin yavaşlığını göster (Even-Dar & Mansour).
  accept:
  - (b)'de denenmeyen çiftlerin Q değeri değişmez ve açgözlü politika yanlış olabilir.
  - 1/n ile hata γ = 0.99'da 10⁵ adımda bile büyük kalır.
- title: 'van Hasselt (2010): Çift Q-öğrenme'
  paper: van Hasselt — Double Q-learning (NeurIPS 2010)
  url: https://papers.nips.cc/paper/2010/hash/091d584fced301b442654dd8c23b3fc9-Abstract.html
  level: orta
  hours: 6
  goal: 'Makalenin rulet ve 3×3 ızgara dünyası deneylerini yeniden üret. Izgarada her adımın ödülü −12
    ya da +10 (eşit olasılık), hedefte +5; ε = 1/√n(s) ve α = 1/n(s,a). Q-öğrenme ile çift Q-öğrenmenin
    adım başı ortalama ödülünü ve başlangıç durumunun max Q kestirimini karşılaştır.

    '
  steps:
  - 'c aşamasındaki tablo düzenini kullan: iki Q tablosu, her adımda yazı-tura ile hangisinin güncelleneceğini
    seç.'
  - 10 000 deney ortalaması.
  accept:
  - Q-öğrenme max Q(s₀)'ı aşırı kestirir, çift Q-öğrenme hafifçe eksik kestirir (makale Şekil 2).
labs:
- id: l1
  lab: cliffwalk
  title: 'Uçurum yürüyüşü: SARSA, Q-öğrenme ve beklenen SARSA'
  goal: '4 × 12 uçurum yürüyüşünde üç TD kontrol yöntemini aynı ε-açgözlü davranışla eğit. Bölüm başına
    toplam ödülü ve öğrenilen açgözlü yolu karşılaştır; politika üstü ve politika dışı öğrenmenin farkını
    ve keşfin bedelini gör.

    '
  predict:
    q: Varsayılan tohum1,α0.5 ve ε0.1 koşusunda son100 bölümde hangisi daha çok ödül toplar?
    options:
    - t: 'Q-öğrenme: en kısa yolu öğrenir'
      why: Q en kısa13 adımlık yolu bulur;keşif sırasında bazı aşağı hamleler düşüş yaratır. Ölçülen son100
        bölüm ortalaması−48.7.
    - t: SARSA (ve beklenen SARSA)
      ok: true
      why: Bu koşuda SARSA−27,beklenen SARSA−20.8;sonlu deney bütün ayarlar için sıralama teoremi değildir.
    - t: 'Üçü aynı: aynı ortamı öğreniyorlar'
      why: Hedefleri farklı politikaların değerini kestirir.
  presets:
  - name: Sutton ayarı
    params:
      eps: 0.1
      alpha: 0.5
      E: 500
      R: 20
    note: 'Tohum1,gerçek terminal: SARSA −27 /17 adım,Q −48.7 /13,beklenen SARSA −20.8 /15;son100 bölüm
      ortalaması.'
  - name: Keşif yok
    params:
      eps: 0
      alpha: 0.5
      E: 500
      R: 20
    note: Tohum1:üçü de13 adımlık kenar yolunu buldu ve son100 bölüm ödülü−13;bu sonlu koşu algoritmaların
      özdeşliği değildir.
  - name: Çok keşif
    params:
      eps: 0.2
      alpha: 0.5
      E: 500
      R: 20
    note: Tohum1:SARSA−39.7,Q−111,beklenen SARSA−28.6;son100 bölüm ortalaması.
  - name: Küçük α
    params:
      eps: 0.1
      alpha: 0.1
      E: 500
      R: 20
    note: Tohum1:SARSA−22.3 ve beklenen SARSA−22.5;ikisi15 adımlık açgözlü yol buldu.
  - name: Kısa eğitim
    params:
      eps: 0.1
      alpha: 0.5
      E: 100
      R: 20
    note: Tohum1:SARSA19 ve Q13 adımda biter;beklenen SARSA açgözlü değerlendirmesi60 adım içinde bitmez.
  - name: Eski1000 adım sınırını karşılaştır
    params:
      full: 0
      eps: 0.1
      alpha: 0.5
      E: 500
      R: 20
      seed: 1
    note: Tohum1:SARSA/Q/Expected kesmeleri2/0/0;son100 deneme ödülleri−27.9/−52/−20.9. Kesme terminal
      sayılmaz.
  questions:
  - q: Eğitim bittiğinde ε'u sıfıra indirip politikayı çalıştırırsak hangisi daha iyi performans gösterir?
    a: Varsayılan tohum1 koşusunda Q yolu13 adım,SARSA17,beklenen SARSA15 adım:keşif kapalıyken toplam
      ödüller−13/−17/−15. Eğitim getirisi ayrı ölçüttür. Sabit α ve sonlu veride SARSA tablosunu tam ε-soft
      optimum saymayın. Yeterli çift ziyareti,GLIE ve uygun azalan öğrenme oranları altında SARSA da optimal
      q* hedefine yakınsar.
  limits: Varsayılan kaynak çeşidinde gerçek hedefe varana kadar eğitim;1000 adımlık eski sınır ayrı seçenek
    olarak korunur ve kesmeler sayılır. Son geçiş kesmede önyüklenir,terminal uydurulmaz. Q/Expected davranışı
    güncellemeden sonra,SARSA önceden seçilmiş A′ ile devam eder. Eğriler10 deneme/bölüm ortalaması;alttaki
    yollar60 adımlık açgözlü değerlendirme bütçesidir.
- id: l2
  lab: maxbias
  title: 'Maksimizasyon yanlılığı: Q-öğrenme ve çift Q-öğrenme'
  goal: 'A''dan sol B''ye, sağ bitişe gider; B''deki her eylem N(μ, 1) ödülle biter. μ < 0 iken en iyi
    politika A''da hep sağdır. Q-öğrenmenin ve çift Q-öğrenmenin A''da solu seçme oranını bölümlere göre
    çiz ve B''deki eylem sayısının, μ''nün ve ε''un etkisini gör.

    '
  predict:
    q: B'de 10 eylem ve μ = −0.1 ile Q-öğrenme ilk bölümlerde A'da solu ne sıklıkla seçer?
    options:
    - t: '≈ %5: ε/2, en iyi davranış'
      why: Bu çift Q-öğrenmenin sonunda vardığı oran.
    - t: ≈ %90'ın üstüne kadar
      ok: true
      why: '10 gürültülü kestirimin maksimumu pozitif: sol çekici görünüyor (1000 çalıştırmada en yüksek
        %94).'
    - t: ≈ %50
      why: Bu çift Q'nun başlangıçtaki rastgele davranışına yakın.
  presets:
  - name: Sutton ayarı
    params:
      n: 10
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Q-öğrenme %94'e kadar sol, son 50 bölümde %12; çift Q %7.
  - name: Tek eylem
    params:
      n: 1
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: B içinde tek eylemde max karşılaştırma yanlılığı yoktur;iki tablonun veri geçmişi farklı olduğundan
      aynı eğri şart değildir.
  - name: 20 eylem
    params:
      n: 20
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Tohum1,1000 tekrar:Q en yüksek%96.6,son50 bölüm%20.8;çift Q son%7.44.
  - name: Sol iyi (μ = 0.1)
    params:
      n: 10
      mu: 0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Optimal ε-greedy sol oranı%95;tohum1,1000 tekrarda son50 bölüm Q%59.4,çift Q%13.4. Sonlu eğitimde
      hedef orana henüz erişilmedi.
  - name: Çok kötü sol
    params:
      n: 10
      mu: -0.5
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Q-öğrenme yine %89'a kadar sol seçiyor ama son 50 bölümde %5'e iniyor.
  - name: Kaynak Şekil6.5:10000 tekrar
    params:
      n: 10
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 10000
      seed: 1
    note: Kaynak s.135:300 bölüm,Q0,rastgele açgözlü bağ. B eylem sayısı10 bizim açık seçimimiz;metin
      çok sayıda der.
  questions:
  - q: Q-öğrenmenin yanlılığı neden B'deki eylem sayısıyla büyür?
    a: Eşit gerçek değerli,bağımsız ve aynı σ sapmalı Gauss kestirimleri örneğinde maksimumun yukarı sapması
      n ile büyür;standart normalde n2 için0.564,n10 için1.54,n20 için1.87. Büyük n yaklaşımı σ√(2 ln
      n). Uyarlanan MDP tabloları bu bağımsız Gauss modeliyle özdeş değildir. Double Q seçici ve değerlendiriciyi
      ayırır;bağımsız örnekli bandit özelinde seçim yanlılığını kaldırır,genel çevrimiçi tablolarda bağımsızlık
      veya tam yansızlık garanti edilmez.
  limits: 300 bölüm; γ = 1; Q sıfırla başlıyor; eşitlikler rastgele bozuluyor. Oranlar R çalıştırmanın
    ortalaması; R = 1000'de hesap birkaç saniye sürebilir. Kaynak bütçesi10000 tekrar seçilebilir;μ0 için
    bütün eylem karışımları optimaldir. İki adaptif tablo genel olarak bağımsız veya tam yansız kabul
    edilmez.
- id: l3
  lab: blackjackmc
