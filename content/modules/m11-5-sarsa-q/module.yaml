  - Model optimumuyla farkı raporla
- id: p10
  type: kanıt
  level: 3
  title: İndirim duyarlı Q kontrolü
  goal: Sutton Bölüm 5 içindeki koşulları koruyarak i̇ndirim duyarlı q kontrolü
  needs: MC getiri, ilk/her ziyaret ve önem oranları
  q: 'Politika dışı MC kontrol s.111 algoritmasını truncated weighted (5.10) fikriyle değiştirin; önce
    durumlardan eylem değerlerine geçin.


    Kaynak: Sutton ve Barto (2018), s.115, Alıştırma 5.14.'
  hints:
  - Getirinin hangi ziyaret anından ve hangi politika altında hesaplandığını açıkça yazın.
  solution: 'Mevcut eylem koşullu: ρ_{t+1:h−1}. c katsayılarıyla N_t=Σ_h cρ·flatG ve D_t=Σ_hcρ hesapla.
    D>0 için C+=D;Q+=(N−DQ)/C; ardından tutarlı argmax hedefi güncelle. b olasılıkları seçildikleri andaki
    kayıtlar. Sonraki hedef dışı eylem kısa önekleri yok etmez; γ<1 iken dış geriye döngüyü kırma. x 5
    O(T²) her t için o anki hedefle yeniden hesaplar. γ 0 tek ödül,γ 1 tam suffix algoritması. Sabit hedef
    için D_t=(1−γ)+γw_{t+1}D_{t+1};N_t=R_{t+1}D_t+γw_{t+1}N_{t+1}; son adım D 1,N=R_T. Değişen hedefte
    eski önbellek kullanılmaz.'
  rubric:
  - Q oranı t+1
  - N/D ve C/Q güncelleme
  - Kısa önekler için dış döngüyü sürdür
  - γ0/γ1 ve hedef değişimi
- id: p11
  type: kanıt
  level: 2
  title: Q hatalarının teleskopik toplamı
  goal: Kaynak koşullarıyla q hatalarının teleskopik toplamı
  needs: TD/SARSA hedefleri,koşullu beklenti ve temel Bellman denklemi
  q: 'Değerler adımlar arasında değişmesin. δ_t=R_{t+1}+γQ(St+1,At+1)−Q(St,At) için (6.6) eylem-değeri
    özdeşliğini kanıtlayın.


    Kaynak:Sutton ve Barto (2018),s.129,Alıştırma 6.8.'
  hints:
  - Hedefi hesapladığınız tablo sürümünü ve gerçek terminal sınırını açıkça belirtin.
  solution: '$\sum_{k=t}^{T-1}\gamma^{k-t}\delta_k$ toplamında her $+\gamma^{k-t+1}Q(S_{k+1},A_{k+1})$,sonraki
    eksi terimle sadeleşir. Ödüller $G_t$ olur;başlangıçta $-Q(S_t,A_t)$,sonda $+\gamma^{T-t}Q(S_T,A_T)$
    kalır. Terminal Q0 olduğu için


    $$G_t-Q(S_t,A_t)=\sum_{k=t}^{T-1}\gamma^{k-t}\delta_k.$$


    Q bölüm içinde değişirse tablo sürümü düzeltmeleri gerekir; soru donmuş Q varsayar.'
  rubric:
  - Ödül toplamı
  - KomşuQ iptalleri
  - Başlangıç ve terminal sınırı
  - DonmuşQ koşulu
