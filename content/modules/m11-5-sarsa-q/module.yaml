  questions:
  - q: Bir milyon MC bölümü bütün200 hücrede optimaliteyi kanıtlar mı?
    a: Hayır; sonlu tahmin model referansıyla karşılaştırılır, kalan fark açıkça ölçülür.
  limits: İlk(s,a) düzgün rastgele, sonra güncel politika; Q 0 ve 20/21 duran başlangıç. Doğal olmayan ES 21
