  goal: Kaynak koşullarıyla q-öğrenme neden politika dışıdır?
  needs: TD/SARSA hedefleri,koşullu beklenti ve temel Bellman denklemi
  q: 'Q-öğrenme neden politika dışı kontrol sayılır? Davranışın öğrendiği hedefe etkisi tamamen yok mudur?


    Kaynak:Sutton ve Barto (2018),s.132,Alıştırma 6.11.'
