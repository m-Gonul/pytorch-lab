hand:
  groups:
  - title: 'Tek güncelleme: $Q(s,a)=2$, $r=1$, $\gamma=0.9$, $Q(s'',\cdot)=[3,5]$, $\alpha=0.5$'
    fields:
    - id: ql
      label: Q-öğrenme sonrası $Q(s,a)$
      answer: 3.75
    - id: sa
      label: SARSA, sonraki eylem $a'=0$
      answer: 2.85
    - id: es
      label: Beklenen SARSA, ε = 0.2 (2 eylem)
      answer: 3.66
  - title: Keşif
    fields:
    - id: bz
      label: Boltzmann (τ = 1) ile $Q=[3,5]$'te eylem 1'in olasılığı
      answer: 0.8807970779778823
      tol: 1.0e-06
    - id: eg
      label: 'ε = 0.1, 4 eylem: açgözlü eylemin seçilme olasılığı'
      answer: 0.925
  - title: Maksimizasyon yanlılığı
    fields:
    - id: mb
      label: 'İki eylemin gerçek değeri 0, kestirimler bağımsız N(0,1): $\mathbb E[\max]$ (= 1/√π)'
      answer: 0.5641895835477563
      tol: 1.0e-06
  verify: "import math\nanswers = dict(ql=2 + 0.5 * (1 + 0.9 * 5 - 2), sa=2 + 0.5 * (1 + 0.9 * 3 - 2),\n\
    \               es=2 + 0.5 * (1 + 0.9 * (0.1 * 3 + 0.9 * 5) - 2),\n               bz=1 / (1 + math.exp(-2)),\
    \ eg=0.9 + 0.1 / 4, mb=1 / math.sqrt(math.pi))\n"
