id: m11-5-sarsa-q
code: M11.5
title: Modelden bağımsız kontrol — SARSA, Q-öğrenme, keşif
phase: 11
minutes: 540
prereq:
- m11-4-mc-td
summary: 'Değerlendirmeden kontrole: V yerine Q(s,a) öğren, çünkü açgözlü politikayı Q''dan model olmadan çıkarabiliriz.
  Monte Carlo kontrol (keşifçi başlangıçlar), politika üstü SARSA, politika dışı Q-öğrenme, beklenen SARSA,
  maksimizasyon yanlılığı ve çift Q-öğrenme; keşif ve sömürü ikilemi (ε-açgözlü, Boltzmann, iyimser başlangıç).
  Saf Python''da uçurum yürüyüşü, NumPy''da 10 000 deneyde maksimizasyon yanlılığı, PyTorch''ta eşzamanlı Q-öğrenmenin
  Q*''a yakınsaması ve 1000 paralel ortamda kontrol.

  '
goals:
- Q-öğrenme hedefi $r+\gamma\max_{a'}Q(s',a')$, SARSA hedefi $r+\gamma Q(s',a')$, beklenen SARSA hedefi $r+\gamma\sum_{a'}\pi(a'|s')Q(s',a')$
- '[[politika dışı öğrenme]]: davranış politikası ε-açgözlü, öğrenilen politika açgözlü'
- '[[maksimizasyon yanlılığı]]: $\mathbb E[\max\hat Q]\ge\max\mathbb E[\hat Q]$ ve çift Q-öğrenme'
- '[[ε-açgözlü]], Boltzmann ve iyimser başlangıçla keşif; GLIE koşulu'
- MC ES, ε-yumuşak iyileştirme, ağırlıklı politika dışı kontrol
- İki kaynak yarış pistinde segment fiziği ve gerçek MC; indirim duyarlı Q güncellemesi
sources:
- title: 'Sutton & Barto — Reinforcement Learning: An Introduction (2. baskı), Bölüm 5.3 ve 6.4–6.7'
  url: http://incompleteideas.net/book/the-book-2nd.html
  license: CC BY-NC-ND 2.0
  use: link
- title: Watkins & Dayan — Q-learning (Machine Learning 1992)
  url: https://doi.org/10.1007/BF00992698
  license: ©
  use: link
- title: van Hasselt — Double Q-learning (NeurIPS 2010)
  url: https://papers.nips.cc/paper/2010/hash/091d584fced301b442654dd8c23b3fc9-Abstract.html
  license: ©
  use: link
- title: Even-Dar & Mansour — Learning Rates for Q-learning (JMLR 2003)
  url: https://www.jmlr.org/papers/v5/evendar03a.html
  license: ©
  use: link
hand:
  groups:
  - title: 'Tek güncelleme: $Q(s,a)=2$, $r=1$, $\gamma=0.9$, $Q(s'',\cdot)=[3,5]$, $\alpha=0.5$'
    fields:
    - id: ql
      label: Q-öğrenme sonrası $Q(s,a)$
      answer: 3.75
    - id: sa
      label: SARSA, sonraki eylem $a'=0$
      answer: 2.85
    - id: es
      label: Beklenen SARSA, ε = 0.2 (2 eylem)
      answer: 3.66
  - title: Keşif
    fields:
    - id: bz
      label: Boltzmann (τ = 1) ile $Q=[3,5]$'te eylem 1'in olasılığı
      answer: 0.8807970779778823
      tol: 1.0e-06
    - id: eg
      label: 'ε = 0.1, 4 eylem: açgözlü eylemin seçilme olasılığı'
      answer: 0.925
  - title: Maksimizasyon yanlılığı
    fields:
    - id: mb
      label: 'İki eylemin gerçek değeri 0, kestirimler bağımsız N(0,1): $\mathbb E[\max]$ (= 1/√π)'
      answer: 0.5641895835477563
      tol: 1.0e-06
  verify: "import math\nanswers = dict(ql=2 + 0.5 * (1 + 0.9 * 5 - 2), sa=2 + 0.5 * (1 + 0.9 * 3 - 2),\n  \
    \             es=2 + 0.5 * (1 + 0.9 * (0.1 * 3 + 0.9 * 5) - 2),\n               bz=1 / (1 + math.exp(-2)),\
    \ eg=0.9 + 0.1 / 4, mb=1 / math.sqrt(math.pi))\n"
