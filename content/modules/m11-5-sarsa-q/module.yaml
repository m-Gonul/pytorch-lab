practice:
- id: p1
  type: çözülmüş
  level: 0
  title: Q-öğrenme, SARSA ve beklenen SARSA hedefleri
  goal: Üç hedefi aynı geçişte hesaplamak
  needs: Üç güncelleme kuralı
  q: $Q(s,a)=0$, $r=-1$, $\gamma=1$, $Q(s^+,\cdot)=[2,6]$, $\alpha=0.5$. Davranış ε-açgözlü ($\epsilon=0.2$,
    2 eylem) ve sonraki eylem olarak $a^+=0$ çekildi. Üç yöntemle güncellenmiş $Q(s,a)$ nedir?
  solution: 'Q-öğrenme hedefi $-1+6=5$, $Q=2.5$. SARSA hedefi $-1+Q(s^+,0)=1$, $Q=0.5$. Beklenen SARSA: $\pi(1\mid
    s^+)=0.9$, $\pi(0\mid s^+)=0.1$; hedef $-1+0.1\cdot2+0.9\cdot6=4.6$, $Q=2.3$.'
- id: p2
  type: hesap
  level: 1
  title: ε-açgözlüde açgözlü eylemin olasılığı
  goal: ε-açgözlü dağılımı hesaplamak
  needs: $1-\epsilon+\epsilon/|\mathcal A|$
  q: 5 eylem ve $\epsilon=0.3$ ile açgözlü eylemin seçilme olasılığı nedir?
  answer: 0.76
  calc: 1 - 0.3 + 0.3/5
  mistakes:
  - answer: 0.7
    msg: 'Rastgele adımda da açgözlü eylem seçilebilir: + ε/|A|.'
  - answer: 0.06
    msg: Bu açgözlü olmayan her bir eylemin olasılığı.
  hints:
  - Rastgele adım bütün eylemlerden düzgün seçer.
  solution: $0.7+0.3/5=0.76$; diğer dört eylemin her biri $0.06$.
- id: p3
  type: hesap
  level: 1
  title: Boltzmann olasılığı
  goal: Softmax keşfini hesaplamak
  needs: $e^{Q/T}/\sum e^{Q/T}$
  q: $Q=[1,3]$ ve $T=2$ ile ikinci eylemin seçilme olasılığı nedir?
  answer: 0.7310586
  calc: 1/(1+exp(-1))
  mistakes:
  - answer: 0.8807971
    msg: 'Bu T = 1: üsler Q/T olmalı.'
  - answer: 0.75
    msg: Değerlerin oranı (3/4) değil, üstellerin oranı.
  hints:
  - $e^{3/2}/(e^{1/2}+e^{3/2})=1/(1+e^{-1})$.
  solution: $1/(1+e^{-(3-1)/2})=1/(1+e^{-1})=0.731$. Sıcaklık iki katına çıkınca açgözlü eylemin payı 0.881'den
    0.731'e iner.
- id: p4
  type: yöntem-seç
  level: 2
  title: Gerçek bir robotun eğitimi
  goal: Politika üstü ve dışı öğrenmeyi uygulamaya göre seçmek
  needs: SARSA, Q-öğrenme, keşif
  q: Gerçek bir robot kol, eğitim sırasında da çalışıyor ve her çarpışma pahalı (keşif sırasında rastgele hareketler
    kaçınılmaz). Eğitim boyunca toplanan ödülü korumak öncelikli. Hangisi?
  choices:
  - t: 'Q-öğrenme: en iyi açgözlü politikayı öğrenir'
    why: Açgözlü politikanın değerini öğrenir ama keşifli davranışın risklerini hesaba katmaz; eğitimde uçurum
      kenarında yürür.
  - t: 'SARSA ya da beklenen SARSA: izlenen (keşifli) politikanın değerini öğrenir ve riskli bölgelerden uzak
      durur'
    ok: true
    why: Uçurum yürüyüşündeki gibi eğitimde daha çok ödül toplar.
  - t: Keşfi kapatıp (ε = 0) Q-öğrenme
    why: Hiç denenmeyen eylemler öğrenilmez; en iyi olmayan bir politikaya takılabilir.
  hints:
  - Eğitim sırasındaki davranışın riski hangi yöntemin hedefinde var?
  solution: Politika üstü yöntemler keşfin bedelini değere katar. Eğitim bitince ε azaltılarak (GLIE) en iyi
    politikaya yaklaşılır. Benzetimde eğitip gerçek robota yalnız sonucu aktarmak mümkünse Q-öğrenmenin politika
    dışı esnekliği öne çıkar.
- id: p5
  type: hata-bul
  level: 2
  title: Son durumda bootstrapping
  goal: Bölüm sonunu doğru ele almak
  needs: Son durumun değeri 0
  q: Bir öğrencinin Q-öğrenme kodu her geçişte `target = r + gamma * max(Q[s_next])` kullanıyor; `s_next` son
    durum olsa da. Son durumun Q satırı hiç sıfırlanmıyor, ve ilk bölümlerde rastgele bir sabitle başlatılmış.
    Değerler neden yanlış çıkıyor?
  choices:
  - t: γ fazla büyük
    why: Sorun γ değil, son durumun değeri.
  - t: Son durumdan sonra ödül yoktur, değeri tanım gereği 0'dır; hedef son geçişte yalnız r olmalı. Son durumun
      rastgele başlangıç değeri her bölümde hedeflere sızıyor
    ok: true
    why: Son durum hiç güncellenmediği için başlangıçtaki keyfî değer kalıcı bir yanlılık üretir.
  - t: Öğrenme oranı azaltılmamış
    why: Azalan α da sabit bir yanlılığı gidermez.
  hints:
  - Son durumdan hangi eylemler seçilip hangi ödüller alınır?
  solution: '`target = r if done else r + gamma * max(Q[s_next])`. Zaman sınırıyla kesilen bölümlerde (gerçek
    son durum değil) ise bootstrapping sürmelidir; iki durumu ayırmak için "terminated" ve "truncated" ayrı
    tutulur (Gymnasium).'
- id: p6
  type: kanıt
  level: 3
  title: Maksimizasyon yanlılığı
  goal: Yanlılığın varlığını ve iki eylemde büyüklüğünü kanıtlamak
  needs: Jensen eşitsizliği, normal dağılım
  q: (a) $\hat Q(a)$ yansız kestirimler olsun. $E[\max_a\hat Q(a)]\ge\max_aE[\hat Q(a)]$ olduğunu gösterin.
    (b) İki eylemin gerçek değeri 0 ve kestirimler bağımsız $N(0,1)$ ise $E[\max]=1/\sqrt\pi$ olduğunu gösterin.
  rubric:
  - (a) Her a için max_b Q̂(b) ≥ Q̂(a) yazıp beklenti alarak E[max] ≥ E[Q̂(a)] ve sonra a üzerinden maksimum
    aldım
  - (b) max(X, Y) = (X + Y)/2 + |X − Y|/2 yazdım
  - X − Y ~ N(0, 2) olduğunu ve E|Z| = σ√(2/π) kullandım
  - E[max] = (1/2)·√2·√(2/π) = 1/√π sonucuna vardım
  hints:
  - $\max(x,y)=\frac{x+y}2+\frac{|x-y|}2$.
  solution: (a) $\max_b\hat Q(b)\ge\hat Q(a)$ her $a$ için; beklenti alınca $E[\max]\ge E[\hat Q(a)]$, her
    $a$ için, dolayısıyla $\ge\max_aE[\hat Q(a)]$. (b) $E[\max]=0+\frac12E|X-Y|=\frac12\sqrt2\sqrt{2/\pi}=1/\sqrt\pi\approx0.564$.
- id: p7
  type: açıkla
  level: 2
  title: MC ES listelerini sayaçla değiştir
  goal: Sutton Bölüm 5 içindeki koşulları koruyarak mc es listelerini sayaçla değiştir
  needs: MC getiri, ilk/her ziyaret ve önem oranları
  q: 'MC ES her(s,a) için bütün getirileri biriktirip tekrar ortalama alıyor. Yalnız ortalama ve sayımla aynı
    işi yapan değişikliği verin.


    Kaynak: Sutton ve Barto (2018), s.99, Alıştırma 5.4.'
  hints:
  - Getirinin hangi ziyaret anından ve hangi politika altında hesaplandığını açıkça yazın.
  solution: Her çift için N 0,Qkeyfî başlat. Bölümün geriye taramasında çift daha önce zaman önekinde geçmiyorsa
    N(s,a)+=1;Q(s,a)+=(G−Q(s,a))/N(s,a);π(s)=argmaxQ(s,·). Bütün geçmiş politikaların verisi tutulur, politika
    değişince N sıfırlanmaz. İlk ziyaret çift içindir. Bu, kaynak getiri listesinin aynı aritmetik ortalamasını
    O (1) bellekle tutar.
  rubric:
  - Çift sayacı
  - Artımlı Q
  - Politika iyileştirme ve eski veriyi koruma
- id: p8
  type: açıkla
  level: 2
  title: Kontrolde neden 1/b var?
  goal: Sutton Bölüm 5 içindeki koşulları koruyarak kontrolde neden 1/b var?
  needs: MC getiri, ilk/her ziyaret ve önem oranları
  q: 'Kaynak s.111 politika dışı MC kontrolünde W güncellemesinde π(A_t|S_t)/b(A_t|S_t) yerine 1/b(A_t|S_t)
    kullanılıyor. Bu neden doğrudur?


    Kaynak: Sutton ve Barto (2018), s.111, Alıştırma 5.11.'
  hints:
  - Getirinin hangi ziyaret anından ve hangi politika altında hesaplandığını açıkça yazın.
  solution: Q ve açgözlü hedef güncellendikten sonra A_t≠π(S_t) ise geriye döngü zaten kesilir. Kalan durumda
    hedef belirlenimci olduğundan π(A_t|S_t)=1 ve oran 1/b olur. Uyuşmazlıkta pay 0; daha eski tam-son-ek katkıları
    0. Q mevcut eylemi koşulladığı için o çiftin güncellemesi bu oran eklenmeden önce yapılır.
  rubric:
  - Önce Q/hedef güncelleme
  - Uyuşmazsa çıkış
  - Uyumda hedef olasılığı1
- id: p9
  type: kod
  level: 3
  title: İki kaynak pistinde yarışçı
  goal: Sutton Bölüm 5 içindeki koşulları koruyarak i̇ki kaynak pistinde yarışçı
  needs: MC getiri, ilk/her ziyaret ve önem oranları
  q: 'Şekil 5.5 iki pist için politika dışı MC kontrolle hızlı bir politika öğrenin ve farklı başlangıçlardan
    birkaç örnek yörünge gösterin. Ayrık konum/hız, bileşen başına−1/0/+1 ivme, hız 0…4, ikisi birlikte yalnız
    başlangıçta 0. Her adım−1; düzgün başlangıç/sıfır hız; duvarda rastgele başlangıca dönüp aynı bölüme devam.
    Bitişi geçince terminal. Eğitimde %10 olasılıkla iki ivme birlikte 0; yörünge gösteriminde bu gürültü olmasın.


    Kaynak: Sutton ve Barto (2018), s.111–112, Alıştırma 5.12.'
  hints:
  - Getirinin hangi ziyaret anından ve hangi politika altında hesaplandığını açıkça yazın.
  solution: x 4 tam starter/model çözüm/kontrolleri ve racetrackmc/l 4 iki kaynak geometrisini sağlar. Hareket
    parçasının ilk bitiş/duvar kesişimini denetle. Soft b olasılığını seçilirken sakla, weighted Q güncellemesini
    geriye yap; eşleşmeyen hedefte eski tam getiriler 0. Her pist 50 bin bölüm gerçek çalıştırıldı; üç ve ayrıca
    bütün başlangıçlardan gürültüsüz yörüngeler denetlendi. Bağımsız model optimumu sol−12.112482/sağ−8.951270;
    sonlu öğrenilmiş hedef sol−14.458549/sağ−11.447987. Bu farkı gizleyip sonlu MC politikasını kanıtlanmış
    optimum adlandırma. Model optimumu da deneyde seçilip gösterilir.
  rubric:
  - İki kaynak geometri
  - Bütün hareket/gürültü/ödül koşulları
  - Weighted MC ve saklanan b
  - Birkaç gürültüsüz yörünge
  - Model optimumuyla farkı raporla
- id: p10
  type: kanıt
  level: 3
  title: İndirim duyarlı Q kontrolü
  goal: Sutton Bölüm 5 içindeki koşulları koruyarak i̇ndirim duyarlı q kontrolü
  needs: MC getiri, ilk/her ziyaret ve önem oranları
  q: 'Politika dışı MC kontrol s.111 algoritmasını truncated weighted (5.10) fikriyle değiştirin; önce durumlardan
    eylem değerlerine geçin.


    Kaynak: Sutton ve Barto (2018), s.115, Alıştırma 5.14.'
  hints:
  - Getirinin hangi ziyaret anından ve hangi politika altında hesaplandığını açıkça yazın.
  solution: 'Mevcut eylem koşullu: ρ_{t+1:h−1}. c katsayılarıyla N_t=Σ_h cρ·flatG ve D_t=Σ_hcρ hesapla. D>0
    için C+=D;Q+=(N−DQ)/C; ardından tutarlı argmax hedefi güncelle. b olasılıkları seçildikleri andaki kayıtlar.
    Sonraki hedef dışı eylem kısa önekleri yok etmez; γ<1 iken dış geriye döngüyü kırma. x 5 O(T²) her t için
    o anki hedefle yeniden hesaplar. γ 0 tek ödül,γ 1 tam suffix algoritması. Sabit hedef için D_t=(1−γ)+γw_{t+1}D_{t+1};N_t=R_{t+1}D_t+γw_{t+1}N_{t+1};
    son adım D 1,N=R_T. Değişen hedefte eski önbellek kullanılmaz.'
  rubric:
  - Q oranı t+1
  - N/D ve C/Q güncelleme
  - Kısa önekler için dış döngüyü sürdür
  - γ0/γ1 ve hedef değişimi
pitfalls:
- wrong: Q-öğrenmenin Q*'a yakınsaması için davranış politikası sonunda açgözlü olmalıdır.
  right: Q-öğrenme politika dışıdır; her (s, a) sonsuz kez denenir ve Robbins–Monro koşulları sağlanırsa sabit
    ε ile de yakınsar. GLIE, SARSA'nın ve davranışın kendisinin en iyi hâle gelmesi için gerekir.
- wrong: Q-öğrenme her zaman SARSA'dan daha iyi sonuç verir, çünkü en iyi politikayı öğrenir.
  right: Eğitim sırasında keşifli davranışın getirisi önemliyse SARSA daha çok ödül toplar (uçurum yürüyüşünde
    −27'ye karşı −48); Q-öğrenme yalnız keşif kapatıldıktan sonra üstündür.
- wrong: Kestirimler yansızsa onların maksimumu da yansızdır.
  right: 'E[max Q̂] ≥ max E[Q̂]: iki bağımsız N(0, 1) kestirimde yanlılık 0.56, onda 1.54. Çift Q-öğrenme seçimi
    ve değerlendirmeyi ayırarak bunu giderir.'
- wrong: Q^π(s, a)'da sonraki durumun dağılımı π(s) ile belirlenir.
  right: 'İlk geçiş seçilen a ile olur: Q^π(s, a) = E[r | s, a] + γ Σ P(s⁺ | s, a) V^π(s⁺); π ancak ondan sonra
    devreye girer.'
- wrong: Yarışta çarpışma terminaldir.
  right: Aynı bölümde rastgele başlangıca sıfır hızla dönülür; her geçiş−1. Hareket parçasında bitiş daha önceyse
    terminaldir.
- wrong: γ<1 indirim duyarlı kontrolünde hedef dışı eylem görünce bütün geriye tarama kesilir.
  right: Daha kısa ufuklar o eylemi içermeyebilir; yalnız ilgili iç ufuk çarpımını kes, dış zaman taramasını
    sürdür.
whatif:
- q: Keşif hiç yapılmasaydı ama Q iyimser (büyük) değerlerle başlatılsaydı?
  a: 'Her denenen eylemin değeri gerçeğe doğru düşer ve ajan henüz denenmemiş, hâlâ iyimser değerli eylemlere
    yönelir: keşif kendiliğinden ve sistematik olur. Ama yalnız başlangıçta işe yarar; ortam değişirse ya da
    gürültü büyükse yetmez. Uçurum yürüyüşünde sıfır başlangıç (bütün gerçek değerler negatif) zaten iyimserdir.'
- q: Ortam zamanla değişseydi (ödüller kaysaydı)?
  a: α = 1/n eski deneyimi sonsuza dek eşit ağırlıkta tutar ve değişimi izleyemez; sabit α son deneyime daha
    çok ağırlık verir. Keşif de hiç sıfırlanmamalıdır; aksi hâlde eski en iyi eylem kötüleştiğinde fark edilmez.
- q: Durumlar sürekli olsaydı (ör. bir arabanın konumu ve hızı)?
  a: 'Tablo kullanılamaz; ya durum uzayı ızgaraya bölünür (karo kodlama) ya da Q bir fonksiyonla yaklaşılır:
    Q(s, a; w). Q-öğrenmenin hedefi aynı kalır ama yakınsama güvencesi kaybolur (fonksiyon yaklaşımı + bootstrapping
    + politika dışı öğrenme = ''ölümcül üçlü''). DQN bu sorunu deneyim tekrarı ve hedef ağla hafifletir (M11.6).'
