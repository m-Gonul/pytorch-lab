  solution: Hedefte sonraki açgözlü eylemin maksimum Q değeri kullanılır;davranış ε-greedy veya başka
    kapsayan politika olabilir. Davranış hangi durum-eylem çiftlerinin güncelleneceğini ve verimi belirler.
    Hedefteki sonraki eylem beklentisi davranışa eşitlenmez. Yeterli ziyaret ve uygun öğrenme oranı koşulları
