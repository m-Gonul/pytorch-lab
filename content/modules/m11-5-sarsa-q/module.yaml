quiz:
- q: Uçurum yürüyüşünde (ε = 0.1) Q-öğrenme uçurumun kenarından giden yolu öğrenir ama eğitim sırasında SARSA'dan
    daha az ödül toplar. Neden?
  options:
  - t: Q-öğrenme açgözlü politikanın değerini öğrenir; ama ε-açgözlü davranırken kenarda rastgele adım uçuruma
      düşürür. SARSA keşfi hesaba katar ve güvenli yolu seçer.
    ok: true
    why: Politika dışı ve politika üstü öğrenmenin farkı.
  - t: Q-öğrenme yakınsamaz
    why: Yakınsar; öğrendiği yol en kısa yoldur.
  - t: SARSA'nın öğrenme oranı daha yüksektir
    why: Aynı α.
- q: Q-öğrenmede maksimizasyon yanlılığının kaynağı nedir?
  options:
  - t: 'Aynı gürültülü kestirimlerle hem en iyi eylem seçilip hem de değerlendirilir: E[max Q̂] ≥ max E[Q̂]'
    ok: true
    why: Çift Q-öğrenme seçmeyi bir tabloyla, değerlendirmeyi diğeriyle yapar.
  - t: İndirim faktörünün 1'den küçük olması
    why: İlgisiz.
  - t: ε-açgözlü davranış
    why: Davranıştan bağımsız olarak hedefteki max'tan gelir.
- q: GLIE (sonsuz keşifle sınırda açgözlü) koşulu ne gerektirir?
  options:
  - t: Her (s,a) sonsuz kez denenir ve politika sınırda açgözlü olur (ör. ε_k = 1/k)
    ok: true
    why: Bu koşulla SARSA/MC kontrol Q*'a yakınsar.
  - t: ε sabit kalmalı
    why: Sabit ε ile sınırda açgözlü olmaz.
  - t: Q başlangıçta sıfır olmalı
    why: Başlangıç değeri koşul değildir.
homework:
- title: 'Watkins & Dayan (1992): Q-öğrenmenin yakınsaması'
  paper: Watkins & Dayan — Q-learning (Machine Learning 1992)
  url: https://doi.org/10.1007/BF00992698
  level: orta
  hours: 6
  goal: 'Makaledeki yakınsama koşullarını (her (s,a) sonsuz kez, $\sum\alpha=\infty$, $\sum\alpha^2<\infty$,
    sınırlı ödül) deneysel olarak sına: rastgele MDP''lerde Q*''ı değer yinelemesiyle bul, Q-öğrenmeyi (a)
    ε-açgözlü, (b) bazı (s,a) çiftlerini hiç denemeyen davranış politikasıyla, (c) $\alpha_n=1/n$, $1/n^{0.6}$
    ve $1/(1+(1-\gamma)n)$ ile çalıştır.

    '
  steps:
  - Bu modülün d aşamasındaki q_value_iteration'ı referans al.
  - Hata ‖Q − Q*‖∞'u log-log çiz; γ = 0.9 ve 0.99 için 1/n'nin yavaşlığını göster (Even-Dar & Mansour).
  accept:
  - (b)'de denenmeyen çiftlerin Q değeri değişmez ve açgözlü politika yanlış olabilir.
  - 1/n ile hata γ = 0.99'da 10⁵ adımda bile büyük kalır.
- title: 'van Hasselt (2010): Çift Q-öğrenme'
  paper: van Hasselt — Double Q-learning (NeurIPS 2010)
  url: https://papers.nips.cc/paper/2010/hash/091d584fced301b442654dd8c23b3fc9-Abstract.html
  level: orta
  hours: 6
  goal: 'Makalenin rulet ve 3×3 ızgara dünyası deneylerini yeniden üret. Izgarada her adımın ödülü −12 ya da
    +10 (eşit olasılık), hedefte +5; ε = 1/√n(s) ve α = 1/n(s,a). Q-öğrenme ile çift Q-öğrenmenin adım başı
    ortalama ödülünü ve başlangıç durumunun max Q kestirimini karşılaştır.

    '
  steps:
  - 'c aşamasındaki tablo düzenini kullan: iki Q tablosu, her adımda yazı-tura ile hangisinin güncelleneceğini
    seç.'
  - 10 000 deney ortalaması.
  accept:
  - Q-öğrenme max Q(s₀)'ı aşırı kestirir, çift Q-öğrenme hafifçe eksik kestirir (makale Şekil 2).
labs:
- id: l1
  lab: cliffwalk
  title: 'Uçurum yürüyüşü: SARSA, Q-öğrenme ve beklenen SARSA'
  goal: '4 × 12 uçurum yürüyüşünde üç TD kontrol yöntemini aynı ε-açgözlü davranışla eğit. Bölüm başına toplam
    ödülü ve öğrenilen açgözlü yolu karşılaştır; politika üstü ve politika dışı öğrenmenin farkını ve keşfin
    bedelini gör.

    '
  predict:
    q: ε = 0.1 ile eğitim sırasında hangisi bölüm başına daha çok ödül toplar?
    options:
    - t: 'Q-öğrenme: en kısa yolu öğrenir'
      why: En kısa yol kenardan geçer; ε-açgözlü davranışta rastgele adımlar uçuruma düşürür (son 100 bölüm
        −48).
    - t: SARSA (ve beklenen SARSA)
      ok: true
      why: 'Keşfi değere katıp güvenli yolu seçerler: −27 ve −20.'
    - t: 'Üçü aynı: aynı ortamı öğreniyorlar'
      why: Hedefleri farklı politikaların değerini kestirir.
  presets:
  - name: Sutton ayarı
    params:
      eps: 0.1
      alpha: 0.5
      E: 500
      R: 20
    note: SARSA −27 (17 adım), Q −48 (13 adım, kenar), beklenen SARSA −20.
  - name: Keşif yok
    params:
      eps: 0
      alpha: 0.5
      E: 500
      R: 20
    note: 'Üçü de 13 adımlık kenar yolu: −13.'
  - name: Çok keşif
    params:
      eps: 0.2
      alpha: 0.5
      E: 500
      R: 20
    note: Q-öğrenme −108; beklenen SARSA −28.
  - name: Küçük α
    params:
      eps: 0.1
      alpha: 0.1
      E: 500
      R: 20
    note: SARSA ve beklenen SARSA −22, 15 adım.
  - name: Kısa eğitim
    params:
      eps: 0.1
      alpha: 0.5
      E: 100
      R: 20
    note: SARSA'nın açgözlü yolu henüz hedefe ulaşmıyor.
  questions:
  - q: Eğitim bittiğinde ε'u sıfıra indirip politikayı çalıştırırsak hangisi daha iyi performans gösterir?
    a: 'Q-öğrenmenin politikası: açgözlü en kısa yolu (13 adım, −13) öğrenmiştir. SARSA''nın politikası ε-açgözlü
      davranışa göre en iyidir ve uçurumdan uzak durur (15–17 adım). Q-öğrenme açgözlü politikanın değerini,
      SARSA izlenen politikanın değerini öğrenir; hangisinin ''daha iyi'' olduğu, keşfin devreye girip girmeyeceğine
      bağlıdır. ε zamanla sıfıra indirilirse (GLIE) SARSA da en kısa yola yakınsar.'
  limits: Sabit ε ve α; Q sıfırla başlatılıyor; bölüm en çok 1000 adım. Eğriler R çalıştırmanın ortalaması
    ve 10 bölümlük kayan ortalama; yollar son çalıştırmadan.
- id: l2
  lab: maxbias
  title: 'Maksimizasyon yanlılığı: Q-öğrenme ve çift Q-öğrenme'
  goal: 'A''dan sol B''ye, sağ bitişe gider; B''deki her eylem N(μ, 1) ödülle biter. μ < 0 iken en iyi politika
    A''da hep sağdır. Q-öğrenmenin ve çift Q-öğrenmenin A''da solu seçme oranını bölümlere göre çiz ve B''deki
    eylem sayısının, μ''nün ve ε''un etkisini gör.

    '
  predict:
    q: B'de 10 eylem ve μ = −0.1 ile Q-öğrenme ilk bölümlerde A'da solu ne sıklıkla seçer?
    options:
    - t: '≈ %5: ε/2, en iyi davranış'
      why: Bu çift Q-öğrenmenin sonunda vardığı oran.
    - t: ≈ %90'ın üstüne kadar
      ok: true
      why: '10 gürültülü kestirimin maksimumu pozitif: sol çekici görünüyor (1000 çalıştırmada en yüksek %94).'
    - t: ≈ %50
      why: Bu çift Q'nun başlangıçtaki rastgele davranışına yakın.
  presets:
  - name: Sutton ayarı
    params:
      n: 10
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Q-öğrenme %94'e kadar sol, son 50 bölümde %12; çift Q %7.
  - name: Tek eylem
    params:
      n: 1
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: 'Yanlılık yok: iki yöntem aynı.'
  - name: 20 eylem
    params:
      n: 20
      mu: -0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: 'Yanlılık daha büyük: son 50 bölümde %18.'
  - name: Sol iyi (μ = 0.1)
    params:
      n: 10
      mu: 0.1
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Doğru oran %95; çift Q yavaş öğreniyor.
  - name: Çok kötü sol
    params:
      n: 10
      mu: -0.5
      eps: 0.1
      alpha: 0.1
      R: 1000
    note: Q-öğrenme yine %89'a kadar sol seçiyor ama son 50 bölümde %5'e iniyor.
  questions:
  - q: Q-öğrenmenin yanlılığı neden B'deki eylem sayısıyla büyür?
    a: Hedef max_b Q(B, b) alınır; n bağımsız gürültülü kestirimin maksimumunun beklentisi, gerçek değerlerin
      maksimumundan yaklaşık σ√(2 ln n) kadar yukarıdadır (n = 2'de 0.56, 10'da 1.54, 20'de 1.87 standart sapma).
      Daha çok eylem, şans eseri yüksek görünen bir eylemin çıkma olasılığını artırır. Çift Q'da seçim ile
      değerlendirme bağımsız gürültüler kullandığı için bu etki ortadan kalkar.
  limits: 300 bölüm; γ = 1; Q sıfırla başlıyor; eşitlikler rastgele bozuluyor. Oranlar R çalıştırmanın ortalaması;
    R = 1000'de hesap birkaç saniye sürebilir.
