id: m3-5-init
code: M3.5
title: Initialization ve aktivasyonlar
phase: 3
minutes: 210
prereq: [m3-2-mlp-backprop]
summary: >
  Derin bir ağın ilk adımda bile eğitilebilir olması doğru başlatmaya bağlı.
  Varyansın katmanlar boyunca nasıl çarpıldığını elle hesaplıyor, saf Python'da
  altı aktivasyonu ve türevlerini yazıyor, NumPy'da 30 katmanlık ağda
  aktivasyon istatistiklerini izliyor, PyTorch'ta `nn.init` ve hook'larla
  katman katman ileri/geri istatistik topluyor ve en sonda kritik başlatma
  ölçeğini 64 ölçeği birden simüle ederek buluyorsun.
goals:
  - "$\\operatorname{Var}(z)=n_{\\text{in}}\\operatorname{Var}(w)\\,\\mathbb E[x^2]$ ilişkisinden [[xavier init|Xavier]] ve [[kaiming init|Kaiming]] ölçeklerini türetmek"
  - "ReLU'nun ikinci momenti yarıya indirdiğini ve bu yüzden Kaiming'de 2 çarpanı olduğunu göstermek"
  - "Sigmoid/tanh doymasının gradyanları nasıl söndürdüğünü ölçmek"
  - "Forward ve tensor hook'larıyla katman başına aktivasyon/gradyan istatistiği toplamak"
sources:
  - {title: "Glorot & Bengio — Understanding the difficulty of training deep feedforward neural networks", url: "https://proceedings.mlr.press/v9/glorot10a.html", license: "©", use: link}
  - {title: "He et al. — Delving Deep into Rectifiers (Kaiming init)", url: "https://arxiv.org/abs/1502.01852", license: "arXiv", use: link}
  - {title: "Karpathy — Zero to Hero 4: Activations & Gradients, BatchNorm", url: "https://karpathy.ai/zero-to-hero.html", license: "kod MIT; video ©", use: adapt}
  - {title: "UvA DL Tutorial 3–4: Activation Functions, Optimization and Initialization", url: "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial4/Optimization_and_Initialization.html", license: "MIT", use: adapt}

hand:
  groups:
    - title: "Lineer katman $z=\\sum_{j=1}^{n}w_jx_j$; $w_j,x_j$ bağımsız, ortalaması 0, $\\operatorname{Var}(x_j)=1$, $n=100$"
      fields:
        - {id: v1, label: "$\\operatorname{Var}(w)=1$ ise $\\operatorname{Var}(z)$", answer: 100, hint: "$n\\cdot\\operatorname{Var}(w)\\cdot\\operatorname{Var}(x)$"}
        - {id: xav, label: "Xavier $\\operatorname{Var}(w)=\\frac{2}{n_{in}+n_{out}}$, $n_{in}=n_{out}=100$", answer: 0.01, tol: 0.0001, hint: "$2/200$"}
        - {id: kai, label: "Kaiming (ReLU) $\\operatorname{Var}(w)=\\frac{2}{n_{in}}$", answer: 0.02, tol: 0.0001, hint: "ReLU ikinci momenti yarıya indirir; 2 ile telafi"}
    - title: "Derinlik"
      fields:
        - {id: m2, label: "$z\\sim\\mathcal N(0,2)$ ise $\\mathbb E[\\text{ReLU}(z)^2]$", answer: 1, tol: 0.001, hint: "simetriden negatif yarı 0: $\\tfrac12\\cdot2$"}
        - {id: dec, label: "Xavier + ReLU, 10 katman sonra ikinci moment çarpanı", answer: 0.000977, tol: 0.00002, hint: "her katmanda $\\times\\tfrac12$: $2^{-10}$"}
        - {id: sig, label: "$\\sigma'(0)$", answer: 0.25, tol: 0.0001, hint: "$\\sigma(0)(1-\\sigma(0))$"}
        - {id: sig10, label: "10 sigmoid katmanı boyunca $\\sigma'$ çarpımı (en iyi durum)", answer: 9.5367e-7, tol: 1e-8, hint: "$0.25^{10}$: vanishing gradient"}
  verify: |
    answers = dict(v1=100, xav=2 / 200, kai=2 / 100, m2=1, dec=round(2 ** -10, 6), sig=0.25, sig10=round(0.25 ** 10, 11))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Kaiming başlatmasındaki 2 çarpanı nereden gelir?"
    options:
      - {t: "Sıfır ortalamalı simetrik $z$ için $\\mathbb E[\\text{ReLU}(z)^2]=\\frac12\\operatorname{Var}(z)$; varyansı korumak için ağırlık varyansı 2 katına çıkarılır", ok: true, why: "$\\operatorname{Var}(z_{l+1})=n\\operatorname{Var}(w)\\cdot\\frac12\\operatorname{Var}(z_l)$; $=\\operatorname{Var}(z_l)$ için $\\operatorname{Var}(w)=2/n$."}
      - {t: "İki katman olduğu için", why: "Katman sayısından bağımsız; ReLU'nun yarım doğrultmasından."}
      - {t: "Gradyan için ayrı bir düzeltme", why: "fan_in modu ileri geçişi korur; fan_out modu geri geçişi."}
  - q: "Hook'larla ölçtüğün son katman gradyan std'si ilk katmanınkinden $10^{6}$ kat küçükse ne olur?"
    options:
      - {t: "İlk katmanlar pratikte öğrenmez (vanishing gradient); başlatma, aktivasyon, normalization ya da residual bağlantı gerekir", ok: true, why: "M3.6 (normalization) ve M4.2 (residual) bu sorunun iki standart çözümü."}
      - {t: "Learning rate'i büyütmek yeterlidir", why: "Son katmanlar ıraksar; sorun katmanlar arası oran."}
      - {t: "Sorun yok, Adam düzeltir", why: "Adam ölçeği kısmen telafi eder ama doymuş aktivasyonların sıfır gradyanını kurtaramaz."}
  - q: "GELU ve SiLU, ReLU'ya göre neden transformer'larda yaygın?"
    options:
      - {t: "Pürüzsüz ve negatif bölgede küçük gradyan geçirirler; ölü nöron sorunu azalır ve optimizasyon yüzeyi daha düzgündür", ok: true, why: "Sıfırda türevleri süreklidir. Bedeli biraz daha pahalı hesaplama."}
      - {t: "Doyarlar, bu yüzden kararlıdırlar", why: "Pozitif tarafta doymazlar (sigmoid/tanh'ın tersine)."}
      - {t: "Varyansı otomatik korurlar", why: "Başlatma hâlâ gereklidir."}

extras:
  - {id: x1, title: "SELU ve öz-normalizasyon: sabit nokta ve 50 katman", engine: browser}
  - {id: x2, title: "ReLU ailesi: RReLU, PReLU, ELU, Mish ve ölü ReLU'lar", engine: browser}
  - {id: x3, title: "Glorot, He, LeCun: ileri ve geri varyans dengesi", engine: browser}

homework:
  - title: "Klambauer ve ark. (2017): öz-normalize eden sinir ağları"
    paper: "Klambauer, Unterthiner, Mayr, Hochreiter — Self-Normalizing Neural Networks (NeurIPS 2017)"
    url: "https://arxiv.org/abs/1706.02515"
    level: orta
    hours: 8
    goal: |
      Makalenin Şekil 1'ini tekrarla: Fashion-MNIST'te 8, 16 ve 32 katmanlı tam bağlı ağları (a) SELU + LeCun normal, (b) ReLU + He + BatchNorm, (c) ReLU + He ile eğitip eğitim kaybı eğrilerini karşılaştır. x1'deki moment sabit noktasını SELU'nun (μ, ν) eşlemesinin Jacobian'ı üzerinden kararlılık analiziyle (Teorem 1: |özdeğerler| < 1) sayısal olarak doğrula. Alpha dropout'u (M3.7 x1) ekleyip normal dropout'la karşılaştır.
    steps:
      - "Moment eşlemesi: (μ, ν) → (E[selu(z)], E[selu(z)²]), z ~ N(μ, ν); Jacobian'ı sonlu farklarla."
    accept:
      - "SELU, BN'siz derin ağlarda ReLU'dan daha düzgün ve hızlı eğitim eğrisi."
      - "Sabit noktada Jacobian'ın spektral yarıçapı < 1."
  - title: "He ve ark. (2015): PReLU ve He başlatması"
    paper: "He, Zhang, Ren, Sun — Delving Deep into Rectifiers: Surpassing Human-Level Performance on ImageNet Classification (ICCV 2015)"
    url: "https://arxiv.org/abs/1502.01852"
    level: orta
    hours: 8
    goal: |
      Makale Şekil 3'ün deneyini küçük ölçekte yap: 22 ve 30 katmanlı düz (atlama bağlantısız) CNN'leri CIFAR-10'da Xavier ve He başlatmasıyla eğit; 30 katmanlıda Xavier'in hiç öğrenemediğini, He'nin öğrendiğini göster. PReLU'nun öğrendiği α'ları katman ve kanal başına çiz (makale Tablo 1: ilk katmanlarda büyük, derinde küçük α).
    steps:
      - "Kanal başına ve katman başına paylaşılan PReLU'yu karşılaştır."
    accept:
      - "30 katmanda He başlatma yakınsar, Xavier takılır."
      - "Öğrenilmiş α'ların derinlikle azaldığı grafik."

labs:
  - id: l1
    lab: initvar
    title: "Başlatma × aktivasyon: sinyal katmanlar boyunca korunuyor mu?"
    goal: |
      Rastgele girdiyi derin bir MLP'den geçirip her katmanda aktivasyonun ve geri yayılan gradyanın büyüklüğünü (RMS) ölç. Kural: $\mathrm{Var}(w)\cdot n\cdot\mathbb E[\varphi'(z)^2]\approx1$ ise iki yön de korunur. ReLU yarısını sıfırladığı için He $2/n$; tanh sıfır çevresinde doğrusal olduğu için Xavier/LeCun $1/n$.
    predict:
      q: "ReLU + Xavier (Var = 1/n), 20 katman: son katmandaki aktivasyon RMS'i girişin kabaca kaçta kaçı olur?"
      options:
        - {t: "≈ 1", why: "Xavier ReLU'nun sıfırladığı yarıyı hesaba katmaz."}
        - {t: "≈ 2^{−10} ≈ 0.001", ok: true, why: "Her katman ikinci momenti 1/2'ye indirir: RMS katman başına 1/√2, 20 katmanda 2^{−10}."}
        - {t: "≈ 2^{20}", why: "Yön ters: küçülür."}
    presets:
      - {name: "ReLU: He vs Xavier", params: {act: 1, init: 3, B: {init: 2}}, note: "A He, B Xavier. B'nin eğimi log ölçekte −½·log 2 / katman."}
      - {name: "tanh + N(0,1)", params: {act: 0, init: 0}, note: "Büyük ağırlıklar tanh'ı doyurur: aktivasyon ±1'de takılır, türev ≈ 0 — gradyan RMS'i hızla söner."}
      - {name: "SELU + LeCun", params: {act: 2, init: 4, L: 40}, note: "Kendinden normalize eden ağ: sabit nokta (ortalama 0, varyans 1) çekicidir."}
      - {name: "Doğrusal ağ ve He", params: {act: 3, init: 3}, note: "Aktivasyon yoksa He 2× fazla: RMS katman başına √2 büyür."}
      - {name: "Sonlu genişlik", params: {act: 1, init: 3, n: 8, L: 40, B: {n: 128}}, note: "Ortalamada korunum aynı ama dar ağda katman çarpanlarının rastgeleliği büyük: log-RMS rastgele yürür."}
    questions:
      - q: "Gradyan eğrisi aktivasyon eğrisinin aynası gibi. Neden?"
        a: "Geri geçişte de aynı ağırlıklar (transpozları) ve aynı φ' çarpanları uygulanır; ileri yöndeki varyans çarpanı geri yönde de görülür (n_in = n_out iken)."
      - q: "N(0, 0.01²) neden 'küçük ve güvenli' değil?"
        a: "Her katman varyansı n·10⁻⁴ ≈ 0.006 ile çarpar: sinyal birkaç katmanda sayısal sıfıra iner, tüm nöronlar aynı davranır."
    limits: "Rastgele Gauss girdi, eğitim yok (yalnız başlangıç anı); BN/artık bağlantı yok. Bunlar korunum koşulunu kendiliğinden sağlar (M3.6, M4.8)."
