id: m2-7-kmeans
code: M2.7
title: k-means
phase: 2
minutes: 180
prereq: [m2-1-knn]
summary: >
  En basit kümeleme. Dört noktada iki Lloyd iterasyonunu elle yapıyor, saf
  Python'da atama/güncelleme döngüsünü yazıyor, NumPy'da one-hot matris
  çarpımıyla merkezleri döngüsüz güncelliyor ve k-means++ başlatmasını
  kuruyor, PyTorch'ta Lloyd adımının aslında inertia'nın gradyanını sıfırlayan
  bir Newton adımı olduğunu autograd ile gösteriyor ve en sonda R rastgele
  başlatmayı tek tensörde koşturuyorsun.
goals:
  - "Lloyd algoritmasını (ata → güncelle) ve [[inertia]] amacını yazmak"
  - "Merkez güncellemesini one-hot atama matrisiyle $C=\\text{diag}(n_k)^{-1}A^\\top X$ olarak döngüsüz yapmak"
  - "Boş küme ve eşitlik durumlarını açıkça ele almak"
  - "k-means++ ile başlatmanın neden daha iyi yerel minimumlar verdiğini görmek"
  - "Birden çok rastgele başlatmayı bir batch boyutu olarak paralel koşturmak"
sources:
  - {title: "ISLP — §12.4.1 K-Means Clustering", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "Arthur & Vassilvitskii — k-means++: The Advantages of Careful Seeding", url: "https://theory.stanford.edu/~sergei/papers/kMeansPP-soda.pdf", license: "©", use: link}
  - {title: "Stanford CS229 — Notes: The k-means clustering algorithm", url: "https://cs229.stanford.edu/main_notes.pdf", license: "doğrulanmadı", use: link}
  - {title: "PyTorch — Tensor.index_add_, torch.cdist", url: "https://docs.pytorch.org/docs/stable/generated/torch.Tensor.index_add_.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "Noktalar $(0,0),(1,0),(4,4),(5,4)$; başlangıç merkezleri $c_1=(0,0)$, $c_2=(1,0)$. 1. iterasyon"
      fields:
        - {id: a3, label: "$(4,4)$'ün kümesi (1 ya da 2)", answer: 2, hint: "$\\lVert\\cdot\\rVert^2$: $c_1$'e 32, $c_2$'ye 25"}
        - {id: c2x, label: "güncellenmiş $c_2$'nin x'i", answer: 3.333333, tol: 0.002, hint: "$c_2$ kümesi: $(1,0),(4,4),(5,4)$; ortalama"}
        - {id: c2y, label: "güncellenmiş $c_2$'nin y'si", answer: 2.666667, tol: 0.002, hint: "$(0+4+4)/3$"}
    - title: "2. iterasyon"
      fields:
        - {id: a2, label: "$(1,0)$'ın yeni kümesi", answer: 1, hint: "$c_1$'e 1, $c_2$'ye $\\approx12.6$"}
        - {id: c1x, label: "güncellenmiş $c_1$'in x'i", answer: 0.5, tol: 0.001, hint: "$(0+1)/2$"}
        - {id: inertia, label: "inertia $\\sum_i\\lVert x_i-c_{z_i}\\rVert^2$", answer: 1, tol: 0.001, hint: "her nokta merkezinden 0.5 uzakta: $4\\cdot0.25$"}
  verify: |
    P = [(0, 0), (1, 0), (4, 4), (5, 4)]; C = [(0.0, 0.0), (1.0, 0.0)]
    d2 = lambda p, c: (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2
    hist = []
    for _ in range(2):
        lab = [min(range(2), key=lambda k: (d2(p, C[k]), k)) for p in P]
        hist.append(lab)
        C = [tuple(sum(p[j] for p, l in zip(P, lab) if l == k) / lab.count(k) for j in range(2)) for k in range(2)]
        if len(hist) == 1:
            c2_after1 = C[1]
    inertia = sum(d2(p, C[l]) for p, l in zip(P, hist[-1]))
    answers = dict(a3=hist[0][2] + 1, c2x=round(c2_after1[0], 6), c2y=round(c2_after1[1], 6),
                   a2=hist[1][1] + 1, c1x=C[0][0], inertia=inertia)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Lloyd algoritması neden her iterasyonda inertia'yı artırmaz?"
    options:
      - {t: "Atama adımı merkezler sabitken, güncelleme adımı atamalar sabitken inertia'yı minimize eder; iki blok koordinat inişi", ok: true, why: "Sonlu sayıda atama olduğu için sonlu adımda durur; ama bulunan bir yerel minimumdur, global değil."}
      - {t: "Gradient descent kullandığı için", why: "Lloyd kapalı form adımlar atar; gradyan kullanmaz (d aşamasında bağlantıyı kuruyoruz)."}
      - {t: "Artırabilir", why: "Kanıtlanabilir şekilde monoton azalmayandır."}
  - q: "k-means++ başlatması ne yapar?"
    options:
      - {t: "İlk merkezi rastgele, sonrakileri mevcut merkezlere kare uzaklıkla orantılı olasılıkla seçer; merkezler veriye yayılır", ok: true, why: "Beklenen inertia optimumun $O(\\log k)$ katıyla sınırlıdır. Tamamen rastgele başlatmada iki merkez aynı kümeye düşebilir."}
      - {t: "Merkezleri ızgara üzerine yerleştirir", why: "Veriye bağlı bir örnekleme; ızgara değil."}
      - {t: "En uzak noktaları deterministik seçer", why: "O farthest-point; aykırı değerlere duyarlı. k-means++ olasılıksal."}
  - q: "k-means hangi küme şekillerinde başarısız olur?"
    options:
      - {t: "Küresel olmayan (uzamış, iç içe, farklı yoğunluklu) kümelerde; kare Öklid uzaklığı her kümeyi eşit varyanslı bir küre gibi görür", ok: true, why: "GMM (M2.8) farklı kovaryanslara izin vererek bunu genelleştirir."}
      - {t: "Yalnız yüksek boyutta", why: "Boyuttan bağımsız bir şekil varsayımı sorunu."}
      - {t: "Hiçbirinde", why: "İç içe çemberler klasik başarısızlık örneğidir."}

homework:
  - title: "Arthur & Vassilvitskii (2007): k-means++"
    paper: "Arthur & Vassilvitskii — k-means++: The Advantages of Careful Seeding (SODA 2007)"
    url: "https://theory.stanford.edu/~sergei/papers/kMeansPP-soda.pdf"
    level: orta
    hours: 5
    goal: |
      k-means++ tohumlamasını (D² ağırlıklı örnekleme) yaz ve rastgele tohumlamayla karşılaştır: makalenin Tablo 1–4'teki gibi sentetik (iyi ayrılmış Gauss'lar) ve gerçek veride ortalama/en iyi potansiyel φ ve süre. O(log k) yaklaşım garantisini sentetik veride, bilinen optimuma göre oranla deneysel olarak kontrol et; tohumlamanın tek başına (Lloyd yinelemesiz) ne kadar iyi olduğunu ölç.
    steps:
      - "20 tekrar üzerinden ortalama ve en iyi φ."
    accept:
      - "k-means++ hem φ'de hem yinelenme sayısında rastgeleden iyi."
      - "Optimuma oran log k'nin çok altında."

labs:
  - id: l1
    lab: kmeans
    title: "Lloyd algoritması adım adım: atama, güncelleme, yerel minimum"
    goal: "Her iterasyon iki adım: (1) her noktayı en yakın merkeze ata, (2) her merkezi kümesinin ortalamasına taşı. İkisi de amacı $J=\\sum\\|x-\\mu_{c(x)}\\|^2$ artıramaz; J monoton iner ve sonlu adımda durur — ama başlatmaya bağlı bir **yerel** minimumda."
    predict:
      q: "'Hepsi aynı köşede' başlatmasıyla 4 gerçek küme, k = 4: sonuç ne olur?"
      options:
        - {t: "Yine doğru 4 küme", why: "Merkezler aynı noktadan başlayınca çoğu hiç nokta almaz."}
        - {t: "Boş kümeler ve birleşmiş gerçek kümeler", ok: true, why: "Tek bir merkez her şeyi alır; diğerleri boş kalır ve güncellenmez."}
    presets:
      - {name: "Rastgele vs k-means++", params: {init: 0, it: 20, B: {init: 1}}, note: "Tohumu değiştirerek rastgele başlatmanın bazen iki merkezi aynı kümeye koyduğunu gör."}
      - {name: "Kötü başlatma", params: {init: 2, it: 20}, note: "Boş küme sorunu."}
      - {name: "Yanlış k", params: {k: 2, true: 4, it: 20}, note: "k < gerçek: kümeler birleşir. k'yı artırıp J'nin nasıl düştüğüne bak (dirsek yöntemi)."}
      - {name: "Örtüşen kümeler", params: {spread: 1.6, it: 20}, note: "Sınırlar belirsiz; k-means küresel, eşit boyutlu kümeler varsayar."}
    questions:
      - q: "k'yı 8'e çıkarınca J hep düşer mi? Bu k seçimi için ne anlama gelir?"
        a: "Evet, k arttıkça en iyi J azalır (k = n'de 0). Bu yüzden J tek başına k seçemez; dirsek, siluet ya da BIC (GMM) kullanılır."
    limits: "2B, eşit varyanslı Gauss kümeleri; 20 iterasyon."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Lloyd'un bir iterasyonu
    goal: Atama ve güncelleme adımlarını sayılarla izlemek
    needs: Öklid uzaklığı, ortalama
    q: |-
      1B noktalar $[1,2,6,7,8]$, başlangıç merkezleri $\mu_1=1$, $\mu_2=2$. Bir iterasyonu yap ve amacın düştüğünü göster.
    solution: |-
      **Başlangıç amacı:** en yakın merkeze kare uzaklıklar: 1→1: 0; 2→2: 0; 6,7,8→2: 16+25+36=77. $J=77$.

      **Atama:** {1} → küme 1; {2, 6, 7, 8} → küme 2 (2'den başka hepsi de 2'ye daha yakın).

      **Güncelleme:** $\mu_1=1$, $\mu_2=(2+6+7+8)/4=5.75$. Yeni $J$: $0+(3.75^2+0.25^2+1.25^2+2.25^2)=14.06+0.06+1.56+5.06=20.75$.

      **İkinci iterasyonda** 2, $\mu_1=1$'e daha yakın olur (uzaklık 1 < 3.75): kümeler {1, 2}, {6, 7, 8}, merkezler 1.5 ve 7, $J=0.25+0.25+1+0+1=2.5$ ve sonra değişmez. Her adım J'yi artıramaz (P6).
  - id: p2
    type: hesap
    level: 1
    title: Atalet (inertia)
    goal: k-means amacını hesaplamak
    needs: P1
    q: |-
      Noktalar $[1,2,6]$, merkezler $1.5$ ve $6$ (en yakına atanmış). $J=\sum\|x-\mu_{c(x)}\|^2$?
    answer: 0.5
    calc: "0.25+0.25+0"
    mistakes:
      - {answer: 1.0, msg: "Kare uzaklık: 0.5² = 0.25."}
    hints:
      - "1 ve 2, 1.5'e; 6, 6'ya atanır."
    solution: |-
      $0.25+0.25+0=0.5$.
  - id: p3
    type: hesap
    level: 1
    title: k-means++ seçim olasılığı
    goal: D² örneklemesini uygulamak
    needs: Olasılık
    q: |-
      İlk merkez seçildi. Kalan üç noktanın ona uzaklıkları 1, 2, 3. k-means++ ikinci merkezi uzaklığın **karesiyle** orantılı olasılıkla seçer. En uzak noktanın seçilme olasılığı?
    answer: 0.6428571428571429
    calc: "9/(1+4+9)"
    tol: 1e-4
    mistakes:
      - {answer: 0.5, msg: "Olasılık uzaklığın karesiyle orantılı (D²), uzaklıkla değil."}
    hints:
      - "Ağırlıklar 1, 4, 9."
    solution: |-
      $9/14=0.643$. Uzak noktalar tercih edilir ama garanti edilmez (aykırı bir nokta her zaman seçilmesin diye). Arthur & Vassilvitskii (2007): beklenen J en iyinin $O(\log k)$ katı içinde.
  - id: p4
    type: karşı-örnek
    level: 3
    title: İç içe halkalar
    goal: k-means'in kümelerin şekli hakkındaki varsayımını görmek
    needs: Voronoi bölgeleri
    q: |-
      k-means'in, J'nin küresel minimumunu bulsa bile "yanlış" kümelediği bir veri tarif et. Neden yanlış? Hangi yöntem doğru kümeler?
    rubric:
      - "İç içe iki halka (ya da iki hilal) gibi dışbükey olmayan kümeler verdim"
      - "k-means sınırlarının merkezler arasındaki dik açıortaylar (Voronoi, dışbükey bölgeler) olduğunu söyledim"
      - "Küresel minimumun bile halkaları ikiye böldüğünü açıkladım: sorun optimizasyon değil model"
      - "Spektral kümeleme, DBSCAN ya da çekirdek k-means önerdim"
    hints:
      - "k-means'in iki kümesi arasındaki sınır ne biçimdedir?"
    solution: |-
      k-means kümeleri, merkezlerin Voronoi hücreleridir: dışbükey bölgeler. İç içe halkalarda doğru kümeleme dışbükey değildir; J'nin küresel minimumu halkaları soldan sağa ikiye böler. Spektral kümeleme (yakınlık grafının özvektörleri) ya da yoğunluk tabanlı DBSCAN bağlantılılığa bakar.
  - id: p5
    type: kanıt
    level: 3
    title: Lloyd algoritması sonlu adımda durur
    goal: Monotonluk ve sonluluk argümanını kurmak
    needs: Ortalamanın kare uzaklığı en küçüklediği
    q: |-
      Lloyd'un (i) atama ve (ii) güncelleme adımlarının J'yi artıramayacağını, ve algoritmanın sonlu adımda durduğunu kanıtla. Küresel optimum garantisi var mı?
    rubric:
      - "(i): merkezler sabitken her noktayı en yakına atamanın her terimi küçülttüğünü söyledim"
      - "(ii): atama sabitken $\\sum_{x\\in C}\\|x-\\mu\\|^2$'yi en küçükleyen μ'nün ortalama olduğunu türevle gösterdim"
      - "Bölümleme sayısının sonlu olduğunu, J kesin azaldıkça bir bölümlemenin tekrar etmeyeceğini, dolayısıyla durduğunu söyledim"
      - "Yalnız yerel optimum garantisi olduğunu (NP-zor problem) belirttim"
    hints:
      - "$\\frac{\\partial}{\\partial\\mu}\\sum_{x\\in C}\\|x-\\mu\\|^2=-2\\sum(x-\\mu)$."
    solution: |-
      (i) Her nokta en yakın merkeze geçince kendi terimi küçülür ya da aynı kalır. (ii) Türev sıfır: $\mu=\frac1{|C|}\sum_{x\in C}x$; amaç μ'de dışbükey olduğundan bu en küçüktür. J tekdüze azalır ve aşağıdan 0 ile sınırlıdır. n noktanın k kümeye bölünmeleri sonludur; J her gerçek değişimde kesin azaldığı için hiçbir bölümleme tekrar etmez → sonlu adımda durur. Küresel optimum yok: problem NP-zor; başlatma ve çok tekrar (n_init) bu yüzden.
  - id: p6
    type: yöntem-seç
    level: 2
    title: Uzun ve farklı büyüklükte kümeler
    goal: k-means ile GMM arasında seçmek
    needs: Kovaryans
    q: |-
      Kümeler eğik ve uzun elipsler, biri diğerinden 10 kat geniş. k-means mi, tam kovaryanslı GMM mi?
    choices:
      - {t: "k-means", why: "Eşit, küresel kümeler varsayar; geniş kümenin ucunu dar kümeye verir."}
      - {t: "Tam kovaryanslı GMM", ok: true, why: "Her kümenin kendi kovaryansı ve ağırlığı vardır; uzaklık Mahalanobis'tir."}
      - {t: "k'yı artırılmış k-means", why: "Kümeleri parçalar; sayıyı ve anlamı bozar."}
    hints:
      - "k-means hangi uzaklığı kullanır?"
    solution: |-
      k-means, GMM'in kovaryansları eşit ve izotropik ($\sigma^2I$), $\sigma\to0$ olan sınırıdır. Biçim ve ölçek farklıysa tam kovaryanslı GMM (M2.8) doğru modeldir; bedeli daha çok parametre ve yerel optimum riskidir.
pitfalls:
  - wrong: "J'nin en küçük olduğu k en iyisidir."
    right: "J, k ile her zaman azalır (k = n'de 0); k için dirsek, siluet ya da olasılıksal modelde BIC kullanılır."
  - wrong: "k-means sonucu deterministiktir."
    right: "Başlatmaya bağlıdır; farklı tohumlar farklı yerel minimumlar verir — en düşük J'li sonucu seç."
whatif:
  - q: "Öklid yerine L1 uzaklığı kullanılırsa?"
    a: "Güncelleme adımında ortalama yerine medyan en iyidir: k-medians; aykırı değerlere daha dayanıklıdır."
  - q: "Veri sürekli akıyorsa (akış)?"
    a: "Mini-batch k-means: her adımda küçük bir örnekle merkezleri azalan adım boyuyla günceller (SGD benzeri)."
