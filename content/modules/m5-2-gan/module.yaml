homework:
  - title: "Goodfellow ve ark. (2014): ilk GAN"
    paper: "Goodfellow ve ark. — Generative Adversarial Nets (NeurIPS 2014)"
    url: "https://arxiv.org/abs/1406.2661"
    level: orta
    hours: 8
    goal: |
      Makale Şekil 1'deki 1B örneği tekrarla: veri N(4, 0.5²), üretici gürültüyü doğrusal olmayan bir MLP ile eşler; eğitim boyunca p_g, p_data ve D'yi aynı eksende çiz ve D'nin 1/2'ye düzleştiğini göster. Algoritma 1'deki k (ayırıcı adım sayısı) ∈ {1, 5} ve doymuş/doymamış üretici kaybını karşılaştır; Parzen pencereli log-olabilirlik tahminini (Tablo 1) MNIST'te küçük bir GAN için hesapla ve sınırlılıklarını tartış.
    steps:
      - "Parzen bant genişliğini doğrulama kümesinde seç."
    accept:
      - "1B'de p_g veriye yakınsar, D ≈ 0.5."
      - "Doymuş kayıpla eğitimin başlangıçta takıldığı gözlemlenir."
  - title: "Salimans ve ark. (2016): GAN eğitimi için iyileştirilmiş teknikler"
    paper: "Salimans, Goodfellow, Zaremba, Cheung, Radford, Chen — Improved Techniques for Training GANs (NeurIPS 2016)"
    url: "https://arxiv.org/abs/1606.03498"
    level: ileri
    hours: 12
    goal: |
      M5.2 d aşamasındaki 8 Gauss halkası GAN'ına makalenin tekniklerini sırayla ekle: öznitelik eşleme (Denk. 4), mini-batch ayrımı (x1), tarihsel ortalama (θ'yı geçmiş ortalamasına yakın tutan ceza), tek taraflı etiket yumuşatma (gerçek etiketi 0.9) ve sanal batch normalizasyonu. Her tekniğin kapsanan mod sayısına ve eğitim kararlılığına etkisini 10 tohum üzerinden raporla.
    steps:
      - "Kapsanan mod: her moda en az %1 örnek düşüyorsa sayılır."
    accept:
      - "Mini-batch ayrımı mod sayısını belirgin artırır."
      - "Tekniklerin birleşimi tohumlar arası varyansı azaltır."

labs:
  - id: l1
    lab: diracgan
    title: "Dirac GAN: eşzamanlı adım ıraksar, dönüşümlü döner, R1 yakınsatır"
    goal: |
      Veri tek bir noktada, üreteç tek bir noktada, ayırt edici doğrusal: GAN oyununun en basit hâli. Eşzamanlı ve dönüşümlü gradyan adımlarını, minimaks ve doyumsuz üreteç kaybını, R1 gradyan cezasını faz düzleminde karşılaştır ve dengeye uzaklığı ölç.
    predict:
      q: "Ceza yokken, eşzamanlı gradyan adımlarıyla (θ, ψ) dengeye ne olur?"
      options:
        - {t: "Yavaşça yakınsar", why: "Dengenin yakınında dinamik saf dönmedir; eşzamanlı adımın özdeğer modülü 1'den büyüktür."}
        - {t: "Sarmal çizerek uzaklaşır", ok: true, why: "Modül √(1 + η²/4) > 1: 400 adımda (η = 0.2) uzaklık 1'den 3.1'e çıkıyor."}
        - {t: "Hemen dengeye atlar", why: "Gradyan adımı dönme bileşenini sönümlemez."}
    presets:
      - {name: "Eşzamanlı (ıraksar)", params: {upd: 0, loss: 0, gamma: 0, lr: 0.2, steps: 400, th0: 1}, note: "Uzaklık 1 → 3.1."}
      - {name: "Dönüşümlü (döner)", params: {upd: 1, loss: 0, gamma: 0, lr: 0.2, steps: 400, th0: 1}, note: "Uzaklık 1 → 0.99: kapalı eğri üzerinde dönüyor."}
      - {name: "R1 cezası", params: {upd: 0, loss: 0, gamma: 0.3, lr: 0.2, steps: 400, th0: 1}, note: "γ = 0.3: 400 adımda uzaklık 4·10⁻⁵: yakınsıyor."}
      - {name: "Doyumsuz kayıp", params: {upd: 0, loss: 1, gamma: 0, lr: 0.2, steps: 400, th0: 1}, note: "Uzaklık ≈ 0.63'te bir çevrimde kalıyor: dengede aynı Jacobian, denge dışında farklı dinamik."}
    questions:
      - q: "Dönüşümlü adımların özdeğer modülü neden tam 1'dir?"
        a: "Doğrusallaştırılmış sistemde dönüşümlü güncelleme matrisi (θ, ψ) sırasıyla [[1 − η²/4, −η/2], [η/2, 1]] olur; determinantı 1'dir. Gerçel olmayan özdeğer çifti için iki özdeğerin modülü eşittir ve çarpımları 1 olduğundan modül 1'dir: hacim korunur, yörünge kapalıdır."
    limits: "Tek noktalı veri ve üreteç, doğrusal ayırt edici; gerçek GAN'larda çok boyutlu ve doğrusal olmayan dinamik. Sonuçlar yerel (dengeye yakın) analizle uyumlu, uzak bölgelerde farklılaşabilir."
  - id: l2
    lab: gan1d
    title: "1-B GAN: tek tepeye kilitlenme, örtme ve doyum"
    goal: |
      İki tepeli bir veri dağılımına karşı tek Gauss'luk bir üreteci, RBF öznitelikli bir lojistik ayırt ediciyle gerçekten eğit. Üretecin başlangıç noktasına, kayıp türüne ve ayırt edicinin gücüne göre bir tepeye mi kilitlendiğini yoksa iki tepeyi geniş bir Gauss'la mı örttüğünü gör; minimaks ve doyumsuz kaybın gradyan büyüklüklerini karşılaştır.
    predict:
      q: "Üreteç verinin uzağında başlarsa (μ₀ = 5, tepeler ±1) ve ayırt edici güçlüyse, minimaks kayıpla üretecin ilk gradyanları nasıldır?"
      options:
        - {t: "Büyük: üreteç kötü olduğu için güçlü sinyal alır", why: "Minimaks kaybın logit gradyanı D(G(z))'dir; D sahteleri kolayca reddettiğinde ≈ 0."}
        - {t: "Çok küçük", ok: true, why: "Ölçülen |∂L/∂logit|: ilk 20 yinelemede minimaksta 0.056, doyumsuz kayıpta 0.845. 300 yinelemede minimaks üreteç μ = 1.96'da kalırken doyumsuz kayıpla μ ≈ 0."}
        - {t: "Sıfır", why: "Tam sıfır değil, ama çok küçük."}
    presets:
      - {name: "Ortadan başla (örtme)", params: {loss: 1, k: 1, m: 2.5, w: 0.5, lrd: 0.3, lrg: 0.1, T: 800, mu0: 0}, note: "Üreteç N(−0.2, 2.97²): iki tepeyi tek geniş Gauss'la örtüyor (veri std 2.55)."}
      - {name: "Bir tepeye yakın başla (çöküş)", params: {loss: 1, k: 1, m: 2.5, w: 0.5, mu0: 4}, note: "Üreteç N(2.48, 0.49²): sağ tepeye kilitlendi, sol tepe hiç üretilmiyor."}
      - {name: "Ağır sol tepe", params: {loss: 1, m: 2.5, w: 0.8, mu0: 0}, note: "Ortadan başlasa da N(−2.51, 0.49²): ağır tepeye yerleşiyor."}
      - {name: "Doyum: minimaks", params: {loss: 0, k: 5, lrd: 2, mu0: 5, m: 1, T: 300}, note: "İlk 20 yinelemede gradyan 0.056; 300 yinelemede μ = 1.96, s = 2.45: üreteç veriye ulaşamadı."}
      - {name: "Doyum yok: doyumsuz kayıp", params: {loss: 1, k: 5, lrd: 2, mu0: 5, m: 1, T: 300}, note: "Aynı ayar, doyumsuz kayıp: ilk gradyan 0.845; μ = 0.03, s = 1.07 (veri std 1.12)."}
    questions:
      - q: "Tek Gauss'luk üreteç neden bazen ortada geniş bir Gauss'ta, bazen bir tepede kalıyor?"
        a: "İki farklı yerel denge vardır. Ortadan başlayan üreteç iki tepeden de eşit gradyan alır ve genişleyerek ikisini örter. Bir tepeye yakın başlayan üreteç o tepeden güçlü, diğerinden hiç gradyan almaz (ayırt edicinin gradyanı yereldir) ve oraya kilitlenir."
    limits: "Üreteç yalnız ortalama ve std öğrenebilir (tek tepeli); gerçek GAN'larda üreteç çok tepeli dağılımları temsil edebilir ve mod çöküşü daha karmaşık biçimlerde görülür. RBF ayırt edici [−6, 6] dışını göremez; üretecin std'si 0.05–7.4 aralığında kırpılır."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: En iyi ayırt edici ve JS
    goal: GAN'ın hangi ıraksamayı küçülttüğünü türetmek
    needs: KL ıraksaması, tek değişkenli optimizasyon
    q: |-
      Sabit bir üreteç için $V(D,G)=\mathbb E_{p_d}[\log D]+\mathbb E_{p_g}[\log(1-D)]$'yi en büyükleyen $D^*$'ı bul ve $V(D^*,G)$'yi JS ıraksamasıyla yaz.
    solution: |-
      $V=\int[p_d\log D+p_g\log(1-D)]dx$; $D$ her noktada serbest olduğu için integrandı nokta nokta en büyükle. $a\log y+b\log(1-y)$'nin türevi $a/y-b/(1-y)=0$ ⇒ $y=a/(a+b)$: $D^*=\frac{p_d}{p_d+p_g}$.

      Yerine koy, $m=\frac{p_d+p_g}2$: $V(D^*,G)=\mathbb E_{p_d}\log\frac{p_d}{2m}+\mathbb E_{p_g}\log\frac{p_g}{2m}=-\log4+\mathrm{KL}(p_d\|m)+\mathrm{KL}(p_g\|m)=-\log4+2\,\mathrm{JS}(p_d\|p_g)$.

      Sonuç: en iyi ayırt edici karşısında üreteç JS'yi küçültür; minimum $p_g=p_d$, $D^*=\frac12$, $V=-\log4$. Varsayım: $D$'nin sonsuz kapasitesi.
  - id: p2
    type: hesap
    level: 1
    title: Doyumun büyüklüğü
    goal: İki üreteç kaybının gradyanını karşılaştırmak
    needs: $\partial_a\log(1-\sigma(a))=-\sigma(a)$, $\partial_a(-\log\sigma(a))=-(1-\sigma(a))$
    q: |-
      Eğitimin başında ayırt edici sahtelere $D(G(z))=0.01$ veriyor. Doyumsuz kaybın logit gradyanının büyüklüğü, minimaks kaybınkinin kaç katıdır?
    answer: 99.0
    calc: "0.99/0.01"
    tol: 1e-6
    mistakes:
      - {answer: 0.010101010101010102, msg: "Oranı ters aldın: doyumsuz kaybın gradyanı 1 − D, minimaksınki D."}
      - {answer: 1.0, msg: "İki kaybın gradyanları farklı: biri D, diğeri 1 − D."}
    hints:
      - "Minimaks: |∂/∂a| = D; doyumsuz: |∂/∂a| = 1 − D."
    solution: |-
      $(1-0.01)/0.01=99$. Üreteç en kötüyken (D ≈ 0) minimaks kayıp neredeyse hiç sinyal vermez; doyumsuz kayıp en güçlü sinyali verir. Sabit noktaları aynıdır.
  - id: p3
    type: hesap
    level: 1
    title: Dengede değer fonksiyonu
    goal: Global optimumu sayısal okumak
    needs: P1
    q: |-
      $p_g=p_{\text{veri}}$ olduğunda $V(D^*,G)$ kaç (doğal log)?
    answer: -1.3862943611198906
    calc: "-math.log(4)"
    tol: 1e-4
    mistakes:
      - {answer: 0.0, msg: "JS = 0 ama sabit terim −log 4 kalır."}
      - {answer: -0.6931471805599453, msg: "Bu −log 2: iki terimin her biri log ½, toplam −log 4."}
    hints:
      - "D* = ½ iken log ½ + log ½."
    solution: |-
      $D^*=\frac12$: $\log\frac12+\log\frac12=-\log4=-1.386$. Eğitimde ayırt edicinin BCE kaybı (ortalama) $\log2=0.693$ civarında dolaşıyorsa denge yakınındayız demektir; 0'a iniyorsa ayırt edici kazanıyor.
  - id: p4
    type: yorumla
    level: 2
    title: Ayırt edici kaybı sıfıra indi
    goal: Eğitim eğrilerinden bozulmayı tanımak
    needs: Doyum, eğitim döngüsü
    q: |-
      Birkaç yüz adımdan sonra ayırt edicinin kaybı ≈ 0, üretecin kaybı sürekli artıyor ve örnekler gürültü gibi. Ne olmuş olabilir, ilk ne denenir?
    choices:
      - {t: "Üreteç çok güçlü; üretecin öğrenme oranını artır", why: "Tablo tersini söylüyor: ayırt edici sahteleri kusursuz ayırıyor."}
      - {t: "Ayırt edici kazandı; üreteç gradyan alamıyor. Doyumsuz kayıp, gradyan cezası (R1/WGAN-GP), ayırt edicinin öğrenme oranını ya da adım sayısını düşürmek", ok: true, why: "D ≈ 0 iken minimaks kayıp doyar; dağılımlar örtüşmüyorsa JS log 2'de sabittir."}
      - {t: "Normal; sabırla bekle", why: "Ayırt edici mükemmel olduğunda dengeye doğru hareket edecek bir sinyal yok."}
    hints:
      - "Dengede ayırt edicinin BCE'si kaç olmalı?"
    solution: |-
      Dengede $D=\frac12$ ve BCE ≈ log 2. Kayıp 0 ise ayırt edici sahteleri tamamen ayırıyor: dağılımlar örtüşmüyor ya da üreteç geride kaldı. Doyumsuz kayıp, R1/WGAN-GP cezası, spektral normalizasyon (M5.7) ve ayırt edicinin öğrenme oranını düşürmek ilk denenecekler.
  - id: p5
    type: hata-bul
    level: 2
    title: Ayırt edici adımında unutulan detach
    goal: Eğitim döngüsündeki gradyan akışını izlemek
    needs: Eğitim döngüsü
    q: |-
      Bir öğrenci ayırt edici adımını şöyle yazmış: `loss_d = bce(D(x), 1) + bce(D(G(z)), 0); loss_d.backward(); optD.step()`. Sonra üreteç adımında `optG.zero_grad()` çağırmadan `loss_g.backward(); optG.step()` yapıyor. Sorun nedir?
    choices:
      - {t: "Sorun yok: optD yalnız D'yi günceller", why: "Güncelleme doğru ama gradyanlar G'nin .grad'ına da birikti."}
      - {t: "D(G(z)) ayırt edici adımında detach edilmediği için G'nin parametrelerine de ayırt edicinin kaybından gradyan birikiyor; zero_grad olmadan bu yanlış yönlü gradyan üretecin adımına karışıyor", ok: true, why: "Ayırt edici kaybı G için ters işaretlidir (G sahteleri gerçek gibi göstermek ister)."}
      - {t: "BCE yerine MSE kullanılmalı", why: "Kayıp seçimi bu hatayla ilgili değil."}
    hints:
      - "loss_d.backward() hangi parametrelerin .grad'ını doldurur?"
    solution: |-
      Ayırt edici adımında sahteleri `G(z).detach()` ile geçir (hem hesap tasarrufu hem doğru gradyan). Her adımın başında kendi optimizer'ının `zero_grad()`'ını çağır. Aksi hâlde G, ayırt edicinin kaybını küçültme yönünde (yani daha kolay ayırt edilecek yönde) itilir.
  - id: p6
    type: açıkla
    level: 3
    title: Neden Wasserstein?
    goal: JS doyumunu ve WGAN'ın çözümünü açıklamak
    needs: JS, Wasserstein-1
    q: |-
      Gerçek görüntüler ve başlangıçtaki üretecin örnekleri yüksek boyutta örtüşmeyen ince yüzeyler üzerindeyse, JS tabanlı GAN neden zorlanır? WGAN-GP bunu nasıl çözer?
    rubric:
      - "Örtüşmeyen desteklerde JS'nin log 2'de sabit olduğunu, üretecin konumuna göre gradyanının sıfır olduğunu söyledim"
      - "W1'in iki dağılım arasındaki uzaklıkla düzgün arttığını (ör. iki nokta kütlesi arasında |θ|) belirttim"
      - "Kantorovich–Rubinstein dualitesiyle eleştirmenin 1-Lipschitz bir fonksiyon olduğunu açıkladım"
      - "Gradyan cezasının gerçek–sahte arası doğrularda gradyan normunu 1'e çektiğini ve ağırlık kırpmaya göre avantajını söyledim"
    hints:
      - "δ₀ ile δ_θ arasındaki JS, θ = 1 ve θ = 10 için aynı mı?"
    solution: |-
      Destekler ayrıksa $m=p/2$ olduğundan JS = log 2, θ'dan bağımsız: en iyi ayırt edici karşısında üreteç yön bilgisi almaz. $W_1(\delta_0,\delta_\theta)=|\theta|$: uzaklıkla artar. WGAN'da eleştirmen $\mathbb E_{\text{veri}}f-\mathbb E_gf$'yi en büyükler ve 1-Lipschitz tutulur. WGAN-GP bunu $\lambda\,\mathbb E(\|\nabla f(\hat x)\|-1)^2$ ile yapar ($\hat x$ gerçek ile sahte arasında rastgele); ağırlık kırpma kapasiteyi bozar ve kırpma eşiğine çok duyarlıdır.
pitfalls:
  - wrong: "Ayırt edicinin kaybı ne kadar düşükse eğitim o kadar iyi gidiyor."
    right: "Dengede ayırt edici kararsızdır (BCE ≈ log 2). Kayıp sıfıra iniyorsa ayırt edici kazanmıştır ve üreteç sinyal alamıyor olabilir."
  - wrong: "Eğitim döngüsündeki üreteç adımı minimaks amacın aynısıdır."
    right: "Sahteleri 1 etiketiyle sınıflandırmak −log D(G(z))'yi küçültür: doyumsuz kayıp. Minimaks log(1 − D(G(z))) başta doyar."
  - wrong: "GAN kaybı düşünce örnekler de iyileşir; kaybı izlemek yeter."
    right: "GAN kayıpları birbirine görelidir ve kaliteyle zayıf ilişkilidir. Örnekleri gözle ve FID gibi ölçütlerle (M5.7) izlemek gerekir."
whatif:
  - q: "Ayırt edici her adımda optimuma kadar eğitilirse (k → ∞)?"
    a: "Kuramsal olarak üreteç JS'yi küçültür; ama dağılımlar örtüşmüyorsa JS doyar ve minimaks kayıpla gradyan söner. Pratikte k = 1–5 ve doyumsuz kayıp kullanılır; WGAN'da eleştirmen için k = 5 tipiktir."
  - q: "Üreteç ve ayırt edici aynı öğrenme oranını değil, ayırt edici daha büyük öğrenme oranını kullanırsa (TTUR)?"
    a: "Heusel ve ark. (2017) iki zaman ölçekli güncellemeyle yerel Nash dengesine yakınsamayı gösterdi; ayırt edici hızlı, üreteç yavaş öğrenir. Ayırt edici çok hızlıysa yine doyum riski vardır."
