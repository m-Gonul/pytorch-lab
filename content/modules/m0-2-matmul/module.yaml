id: m0-2-matmul
code: M0.2
title: Matris çarpımı, shape ve broadcasting
phase: 0
minutes: 150
prereq: [m0-1-dot]
summary: >
  Her sinir ağı katmanının çekirdeği olan işlemi 2×2'de elle, sonra üç iç içe
  döngüyle, NumPy'da, PyTorch'ta autograd ile ve en sonda yüzlerce matrisi tek
  çağrıda çarparak kuruyorsun.
goals:
  - "$C_{ij}=\\sum_t A_{it}B_{tj}$ tanımını uygulayabilmek ve maliyetini ($n\\cdot k\\cdot m$ çarpma) sayabilmek"
  - "Shape kuralını $(n\\times k)(k\\times m)=(n\\times m)$ hatasız kullanmak"
  - "Broadcasting kurallarıyla döngüsüz satır/sütun işlemleri yazmak"
  - "$L=\\sum (AB)$ için $\\partial L/\\partial A$ ve $\\partial L/\\partial B$'yi türetip autograd ile doğrulamak"
  - "Batched matmul (`@`, `einsum`, `bmm`) ile döngüyü kaldırıp hızlanmayı ölçmek"
sources:
  - {title: "MIT 18.06 Linear Algebra (Strang) — Ders 3: Multiplication and inverse matrices", url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", license: "CC BY-NC-SA 4.0", use: link}
  - {title: "3Blue1Brown — Matrix multiplication as composition", url: "https://www.3blue1brown.com/lessons/matrix-multiplication", license: "©", use: link}
  - {title: "Dive into Deep Learning §2.3 Linear Algebra", url: "https://d2l.ai/chapter_preliminaries/linear-algebra.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "CS231n Python/NumPy tutorial (broadcasting)", url: "https://cs231n.github.io/python-numpy-tutorial/", license: "MIT", use: adapt}
  - {title: "NumPy — Broadcasting", url: "https://numpy.org/doc/stable/user/basics.broadcasting.html", license: "BSD-3", use: link}
  - {title: "PyTorch — torch.einsum / torch.bmm", url: "https://docs.pytorch.org/docs/stable/generated/torch.einsum.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "$C = AB$ hücre hücre"
      layout: matrix
      rows: 2
      cols: 2
      fields:
        - {id: c11, label: "$C_{11}$", answer: 19, hint: "1. satır · 1. sütun: $1\\cdot5 + 2\\cdot7$"}
        - {id: c12, label: "$C_{12}$", answer: 22, hint: "1. satır · 2. sütun: $1\\cdot6 + 2\\cdot8$"}
        - {id: c21, label: "$C_{21}$", answer: 43, hint: "2. satır · 1. sütun: $3\\cdot5 + 4\\cdot7$"}
        - {id: c22, label: "$C_{22}$", answer: 50, hint: "2. satır · 2. sütun: $3\\cdot6 + 4\\cdot8$"}
    - title: "Maliyet ve shape"
      fields:
        - {id: mults, label: "$C=AB$ için toplam skaler çarpma sayısı", answer: 8, hint: "4 hücre × hücre başına 2 çarpma"}
        - {id: mults_big, label: "$(64\\times 64)(64\\times 64)$ için skaler çarpma sayısı", answer: 262144, hint: "$n\\cdot k\\cdot m = 64^3$"}
        - {id: rows, label: "$(2\\times 3)(3\\times 4)$ sonucunun satır sayısı", answer: 2, hint: "dış boyutlar kalır: $(n\\times k)(k\\times m)\\to(n\\times m)$"}
        - {id: cols, label: "… sütun sayısı", answer: 4, hint: "ikinci matrisin sütun sayısı"}
    - title: "Broadcasting: $A + v$, $v=[10,\\;20]$"
      layout: matrix
      rows: 2
      cols: 2
      fields:
        - {id: b11, label: "$(A+v)_{11}$", answer: 11, hint: "$v$ her satıra eklenir: $1+10$"}
        - {id: b12, label: "$(A+v)_{12}$", answer: 22, hint: "$2+20$"}
        - {id: b21, label: "$(A+v)_{21}$", answer: 13, hint: "2. satıra da aynı $v$: $3+10$"}
        - {id: b22, label: "$(A+v)_{22}$", answer: 24, hint: "$4+20$"}
  verify: |
    A = [[1, 2], [3, 4]]; B = [[5, 6], [7, 8]]; v = [10, 20]
    C = [[sum(A[i][t] * B[t][j] for t in range(2)) for j in range(2)] for i in range(2)]
    answers = dict(c11=C[0][0], c12=C[0][1], c21=C[1][0], c22=C[1][1],
                   mults=2 * 2 * 2, mults_big=64 ** 3, rows=2, cols=4,
                   b11=A[0][0] + v[0], b12=A[0][1] + v[1], b21=A[1][0] + v[0], b22=A[1][1] + v[1])

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "`A.shape == (32, 128)` ve `W.shape == (64, 128)`. Bir lineer katmanın çıktısı `(32, 64)` olacaksa hangisi doğru?"
    options:
      - {t: "`A @ W`", why: "İç boyutlar 128 ile 64 uyuşmaz → hata."}
      - {t: "`A @ W.T`", ok: true, why: "$(32\\times128)(128\\times64)=(32\\times64)$. `nn.Linear` ağırlığı tam olarak bu yüzden `(out, in)` saklanır ve `x @ W.T` hesaplanır."}
      - {t: "`W @ A.T`", why: "Sonuç `(64, 32)` olur; transpoze edilmiş cevap."}
      - {t: "`A * W`", why: "Eleman eleman çarpım; shape'ler broadcast bile edilemez."}
  - q: "`X.shape == (5, 3)`, `m = X.mean(axis=0)`. `X - m` neden döngüsüz çalışır?"
    options:
      - {t: "`m` shape'i `(3,)`; sağdan hizalanınca `(5,3)` ile uyumlu ve 5 satıra kopyalanmış gibi davranır", ok: true, why: "Broadcasting kuralı: boyutlar sağdan eşleştirilir, eşit ya da 1 olanlar genişletilir. Bellekte kopya yapılmaz."}
      - {t: "NumPy arka planda bir Python for döngüsü çalıştırır", why: "Döngü C seviyesinde, öğe başına Python yorumlayıcı maliyeti yok."}
      - {t: "`m` shape'i `(5,)` olduğu için", why: "`axis=0` satırlar boyunca ortalama alır, sütun sayısı kadar (3) değer kalır."}
  - q: "$L=\\sum_{ij}(AB)_{ij}$ ise $\\partial L/\\partial A$ nedir? ($A: n\\times k$, $B: k\\times m$)"
    options:
      - {t: "$B^\\top$", why: "Shape tutmaz: $\\partial L/\\partial A$, $A$ ile aynı shape'te ($n\\times k$) olmalı."}
      - {t: "$\\mathbf{1}_{n\\times m}B^\\top$", ok: true, why: "Genel kural: $G=\\partial L/\\partial C$ ise $\\partial L/\\partial A = G B^\\top$. Burada $G$ tamamen 1."}
      - {t: "$A^\\top\\mathbf{1}_{n\\times m}$", why: "Bu $\\partial L/\\partial B$'dir."}

homework:
  - title: "Strassen (1969): Gauss eliminasyonu optimal değil"
    paper: "Strassen — Gaussian Elimination is not Optimal (Numerische Mathematik 1969)"
    url: "https://link.springer.com/article/10.1007/BF02165411"
    level: orta
    hours: 6
    goal: |
      Strassen'in 7 çarpımlı 2 × 2 blok formülünü özyinelemeli yaz (NumPy blokları); bir eşik altında np.matmul'a geç. n = 2⁶…2¹¹ için süreyi ve çarpma sayısını (n^2.807 vs n³) ölç, en iyi eşiği bul; float32/float64'te sonucun hata büyümesini klasik çarpımla karşılaştır (Strassen'in daha az kararlı olduğunu göster).
    steps:
      - "İki kuvveti olmayan boyutları sıfır dolgu ile ele al."
    accept:
      - "Eşik üstünde Strassen'in daha hızlı olduğu bir n (ya da olmadığına dair ölçüm)."
      - "Hata tablosu: Strassen hatası n ile daha hızlı büyür."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Matris zinciri çarpımında sıra
    goal: Birleşme özelliğinin maliyeti nasıl değiştirdiğini görmek
    needs: Çarpma sayısı
    q: |-
      $A$ (10 × 100), $B$ (100 × 5), $C$ (5 × 50). $(AB)C$ ve $A(BC)$ için skaler çarpma sayısını karşılaştır.
    solution: |-
      $(m\times k)(k\times n)$ çarpımı $mkn$ çarpma (ve ~aynı sayıda toplama; FLOP ≈ $2mkn$).

      $(AB)C$: $AB$: $10\cdot100\cdot5=5000$ → (10 × 5); sonra $\cdot C$: $10\cdot5\cdot50=2500$. **Toplam 7500.**
      $A(BC)$: $BC$: $100\cdot5\cdot50=25\,000$ → (100 × 50); sonra $A\cdot$: $10\cdot100\cdot50=50\,000$. **Toplam 75 000.**

      Sonuç matematiksel olarak aynı ($(AB)C=A(BC)$), maliyet 10 kat farklı. **Uygulama:** geri yayılımda $\nabla_x=W_1^\top W_2^\top g$'yi sağdan sola (vektörle) hesaplamak, önce matrisleri çarpmaktan çok daha ucuzdur — ters mod türevin verimliliği (M3.2 P5). `torch.linalg.multi_dot` ve `einsum(optimize=...)` en iyi sırayı arar.
  - id: p2
    type: hesap
    level: 1
    title: En ucuz sıra
    goal: P1'i uygulamak
    needs: P1
    q: |-
      P1'deki matrisler için en ucuz sıranın skaler çarpma sayısı?
    answer: 7500.0
    calc: "10*100*5+10*5*50"
    mistakes:
      - {answer: 75000.0, msg: "Bu A(BC) sırası — 10 kat pahalı."}
    hints:
      - "Önce küçük ara sonuç üreten çarpımı yap."
    solution: |-
      $(AB)C$: 7500.
  - id: p3
    type: hesap
    level: 1
    title: Bir katmanın FLOP'u
    goal: Matris çarpımının hesap maliyetini sayıya dökmek
    needs: P1
    q: |-
      Batch 64, girdi 1024, çıktı 4096'lık doğrusal katman (bias'sız): $XW$'nin FLOP sayısı ($2mkn$)?
    answer: 536870912.0
    calc: "2*64*1024*4096"
    mistakes:
      - {answer: 268435456.0, msg: "Bu çarpma sayısı; her çarpmaya bir toplama eşlik eder: FLOP ≈ 2mkn."}
    hints:
      - "$m=64$, $k=1024$, $n=4096$."
    solution: |-
      $2\cdot64\cdot1024\cdot4096\approx5.4\cdot10^8$ FLOP. Geri geçiş $dX$ ve $dW$ için iki çarpım daha: eğitim adımı ≈ 3 × ileri.
  - id: p4
    type: hata-bul
    level: 2
    title: Batch'li çarpımda yanlış eksen
    goal: Shape'leri okuyarak hatayı bulmak
    needs: Batch matmul
    q: |-
      `A` (B, n, k), `X` (B, k, m). Bir öğrenci `torch.einsum('bnk,bmk->bnm', A, X)` yazmış ve "shape uymuyor" hatası alıyor. Doğrusu?
    choices:
      - {t: "`einsum('bnk,bkm->bnm', A, X)`", ok: true, why: "X'in eksenleri (b, k, m); toplanan indeks k."}
      - {t: "`einsum('bnk,bmk->bmn', A, X)`", why: "X'i (b, m, k) varsaymaya devam ediyor."}
      - {t: "`A @ X.T`", why: "3B tensörde .T tüm eksenleri ters çevirir (uyarıyla); batch ekseni kayar."}
    hints:
      - "Her tensörün eksen harflerini shape'iyle eşle."
    solution: |-
      Einsum dizgisindeki harfler tensörün **gerçek** eksen sırasını izlemeli: X (b, k, m) → `bkm`. Eşdeğeri `A @ X` ya da `torch.bmm(A, X)`. Transpoze gerekiyorsa `X.transpose(-1, -2)` kullan, `.T` değil.
  - id: p5
    type: açıkla
    level: 3
    title: Matris çarpımının dört görünümü
    goal: Aynı işlemi farklı yorumlarla anlatmak
    needs: Satır, sütun, dış çarpım
    q: |-
      $C=AB$'yi dört farklı biçimde yorumla (eleman, sütun, satır, dış çarpım toplamı). Hangisi hangi durumda düşünmeyi kolaylaştırır?
    rubric:
      - "$C_{ij}=a_i^{(satır)}\\cdot b_j^{(sütun)}$ (iç çarpımlar) yazdım"
      - "C'nin her sütunu A'nın sütunlarının doğrusal birleşimi (B'nin sütunu katsayı) dedim"
      - "C'nin her satırı B'nin satırlarının doğrusal birleşimi dedim"
      - "$C=\\sum_k a_{:,k}b_{k,:}$ (rank-1 dış çarpımlar toplamı) yazdım ve düşük ranklı yaklaşım/SVD ile ilişkilendirdim"
    hints:
      - "Bir sütun için $Ab_j$ ne demek?"
    solution: |-
      (1) İç çarpımlar: hesap ve benzerlik (attention skorları). (2) Sütun görünümü: $C$'nin sütun uzayı $A$'nınkinin içinde (rank ≤ rank A). (3) Satır görünümü: bir batch'teki her örnek (satır) aynı dönüşümle çarpılır. (4) Dış çarpımlar: $\sum_k$ rank-1 matrisler — SVD, LoRA (düşük ranklı güncelleme $BA$) ve gradyanın $\nabla_W=\sum_ix_i\delta_i^\top$ biçimi.
pitfalls:
  - wrong: "Matris çarpımı değişmelidir."
    right: "Genelde $AB\\ne BA$ (shape'ler uysa bile); birleşmelidir, sırayla gruplama serbesttir (P1)."
  - wrong: "`*` ve `@` aynı şeydir."
    right: "`*` eleman eleman (Hadamard), `@` matris çarpımıdır; shape'ler yayınla uyuşursa `*` sessizce yanlış sonuç verir."
whatif:
  - q: "Matrislerden biri köşegen olsaydı?"
    a: "$\\mathrm{diag}(d)A$ = A'nın satırlarını ölçeklemek: O(n²) yerine eleman eleman çarpım (`d[:, None] * A`) yeter."
