  - id: p23
    type: kanıt
    level: 3
    title: 'Sutton 3.17: Q için Bellman beklenti denklemi'
    goal: Q için Bellman beklenti denklemi
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'qπ(s,a) değerini olası sonraki durum–eylem çiftlerinin qπ(s′,a′) değerleriyle veren Bellman denklemini
      yaz. Denklem 3.14 türetimine benzer biçimde, sağdaki Q geri taşıma şemasını kullanarak adım dizisini göster.

      (Kaynak: Sutton ve Barto, s.61, Alıştırma 3.17.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Önce ilk eylemi sabitle:

      $$q_\pi(s,a)=\mathbb E_\pi[G_t\mid S_t=s,A_t=a]=\mathbb E_\pi[R_{t+1}+\gamma G_{t+1}\mid S_t=s,A_t=a].$$

      Ortamın ortak sonucu üzerinden aç:

      $$=\sum_{s'',r}p(s'',r\mid s,a)\left[r+\gamma\mathbb E_\pi[G_{t+1}\mid S_{t+1}=s'']\right].$$

      Sonraki eylem Aₜ₊₁ için toplam beklenti uygula:

      $$q_\pi(s,a)=\sum_{s'',r}p(s'',r\mid s,a)\left[r+\gamma\sum_{a''}\pi(a''\mid s'')q_\pi(s'',a'')\right].$$

      Şemada kök dolu durum–eylem düğümüdür; önce ortam p ve r ile açık durumlara dallanır, sonra π ile sonraki
      dolu eylem düğümlerine. İlk eylem sabit olduğundan kökte π(a|s) çarpanı bulunmaz.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p24
    type: açıkla
    level: 1
    title: 'Sutton 3.18: V için tek katmanlı iki yazım'
    goal: V için tek katmanlı iki yazım
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Sₜ=s verildiğinde, kök durum değeri vπ(s) ile ilk eylem yaprakları qπ(s,a) arasında bir beklenti eşitliği
      yaz. Sonra beklenti sembolü olmadan π ile açık toplamını yaz.

      (Kaynak: Sutton ve Barto, s.62, Alıştırma 3.18.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'İstenen iki ayrı biçim:

      $$v_\pi(s)=\mathbb E_\pi[q_\pi(s,A_t)\mid S_t=s],$$

      $$v_\pi(s)=\sum_{a\in\mathcal A(s)}\pi(a\mid s)q_\pi(s,a).$$

      Kök açık s, yapraklar a₁,a₂,a₃ gibi dolu durum–eylem düğümleridir. Her dalın ağırlığı π(a|s). Q yaprağı
      zaten ilk ödül ile kalan getiriyi içerdiğinden ayrıca ödül veya γ eklenmez.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p25
    type: açıkla
    level: 2
    title: 'Sutton 3.19: Q için tek katmanlı iki yazım'
    goal: Q için tek katmanlı iki yazım
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Sₜ=s,Aₜ=a verildiğinde qπ(s,a) değerini bir sonraki ödül Rₜ₊₁ ve sonraki durum değeri vπ(Sₜ₊₁) ile yaz.
      Önce π izlenmesine ayrıca koşullanmayan beklenti, sonra beklenti sembolsüz p toplamı ver.

      (Kaynak: Sutton ve Barto, s.62, Alıştırma 3.19.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'İstenen biçimler:

      $$q_\pi(s,a)=\mathbb E[R_{t+1}+\gamma v_\pi(S_{t+1})\mid S_t=s,A_t=a],$$

      $$q_\pi(s,a)=\sum_{s'',r}p(s'',r\mid s,a)[r+\gamma v_\pi(s'')].$$

      Bu beklenti ortamın bir geçişi üzerindedir; π sonrasının bilgisi vπ içinde bulunduğundan beklentiyi Eπ
      diye ayrıca koşullamak gerekli değildir. Şema dolu kökten açık s′₁,s′₂,s′₃ yapraklarına gider, dalların
      p ağırlıkları ve r ödülleri vardır.'
