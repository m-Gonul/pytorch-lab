      bütçesi ve çözülmek istenen görev hangi düzeyi yararlı yapar belirler. Bilinen mekanizmayı ortam saymak
      mümkündür. Seçim serbest bir modelleme kararıdır, ancak her seçimin yeterli durum ve uygulanabilir eylem
      sağlama yükümlülüğü vardır.
