  - id: p28
    type: yorumla
    level: 2
    title: 'Sutton 3.22: üç durumda indirim eşiği'
    goal: üç durumda indirim eşiği
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Şekildeki devam eden üç durumlu MDP içinde tek karar üst durumdadır. Sol eylem +1 ile sol alt duruma,
      oradan zorunlu 0 ile üste döner; sağ eylem 0 ile sağ alta, oradan zorunlu +2 ile üste döner. İki deterministik
      politika π_sol ve π_sağ var. γ=0, γ=0.9 ve γ=0.5 için hangi politika en iyidir?

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.22.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Üst durum değerleri geometrik seridir:

      $$V^{\mathrm{sol}}=1+\gamma^2+\cdots=\frac1{1-\gamma^2},\qquad V^{\mathrm{sağ}}=2\gamma+2\gamma^3+\cdots=\frac{2\gamma}{1-\gamma^2}.$$

      γ=0: sol 1, sağ 0 → sol. γ=0.9: sol 5.263158, sağ 9.473684 → sağ. γ=0.5: ikisi de 4/3 → her iki deterministik
      politika ve üst durumda aralarındaki her stokastik karışım en iyi. Ortak payda pozitif olduğundan eşik
      1=2γ, yani γ=1/2. Alt durumlar bir ödül ve üste dönüşten ibaret olduğundan üst değerdeki bu üstünlük onların
      değerlerinde de korunur (γ=0 için altlar eşit).'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p29
    type: açıkla
    level: 2
    title: 'Sutton 3.23: robotun beş Q en iyilik denklemi'
    goal: robotun beş Q en iyilik denklemi
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Geri dönüşüm robotunun q* Bellman en iyilik denklemini yaz; iki yüksek-pil ve üç düşük-pil eylemini açık
      göster.

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.23.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'M_h=max{q*(h,ara),q*(h,bekle)}, M_l=max{q*(l,ara),q*(l,bekle),q*(l,şarj)} tanımla. Beş denklem:

      $$\begin{aligned}

      q_*(h,\mathrm{ara})&=r_s+\gamma[\alpha M_h+(1-\alpha)M_l],\\

      q_*(h,\mathrm{bekle})&=r_w+\gamma M_h,\\

      q_*(l,\mathrm{ara})&=\beta r_s-3(1-\beta)+\gamma[(1-\beta)M_h+\beta M_l],\\

      q_*(l,\mathrm{bekle})&=r_w+\gamma M_l,\\

      q_*(l,\mathrm{şarj})&=\gamma M_h.

      \end{aligned}$$

      Düşük pilde aramada kurtarma yüksek pile götürür; onun olasılığı 1−β. Şarj anında kutu toplanmadığı için
      anlık ödül 0. M_h ve M_l sonraki durumda geçerli eylemler üzerinden maksimumdur.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p30
    type: hesap
    level: 2
    title: 'Sutton 3.24: 24.4 değerinin tam karşılığı'
    goal: 24.4 değerinin tam karşılığı
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Şekil 3.5 en iyi ızgara durumunun değerini bir ondalıkla 24.4 verir. En iyi politikayı ve Denklem 3.8
      bilgisini kullanarak sembolik değerini yaz, sonra üç ondalığa hesapla. γ=0.9. Sayısal alana üç ondalıklı
      sonucu gir.

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.24.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'A durumundan her eylem hemen +10 ile A′ konumuna taşır; A′ konumundan A konumuna dört normal adımda
      dönülür. +10 ödülleri beş adım aralıklıdır. Dolayısıyla

      $$v_*(A)=10+10\gamma^5+10\gamma^{10}+\cdots=\frac{10}{1-\gamma^5}.$$

      γ=0.9 için 24.419428096994; üç ondalık 24.419. Kaynaktaki 24.4 yalnız yuvarlamadır. Dönüşe dört adım gerektiği
      için kuvvet 4 değil, ödüller arasındaki toplam süre olan 5 kullanılır.'
    answer: 24.419
    calc: round(10/(1-0.9**5),3)
    tol: 1.0e-05
  - id: p31
    type: açıkla
    level: 1
    title: 'Sutton 3.25: V yıldızı Q yıldızıyla yaz'
    goal: V yıldızı Q yıldızıyla yaz
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'v* değerini q* cinsinden veren bir eşitlik yaz.

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.25.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Her durumda en iyi ilk eylemi seç:

      $$v_*(s)=\max_{a\in\mathcal A(s)}q_*(s,a).$$

      Ortalama değil maksimumdur; birden fazla maksimum varsa aynı V değeri elde edilir.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
