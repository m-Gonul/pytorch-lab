  - id: p9
    type: yorumla
    level: 2
    title: 'Sutton 3.3: sürüşte sınırı nereye koymalı?'
    goal: sürüşte sınırı nereye koymalı?
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Sürüşte eylem; gaz–direksiyon–fren konumu, lastik torkları, kas komutları veya gidilecek yer seçimi olabilir.
      Ajan–ortam sınırı için doğru düzey hangisidir? Birini diğerine tercih etmenin ölçütleri ve temel bir zorunluluk
      olup olmadığını tartış.

      (Kaynak: Sutton ve Barto, s.51, Alıştırma 3.3.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: Tek fiziksel doğru sınır yoktur. Karar kuralının doğrudan seçtiği değişken ajan çıktısı, geri kalanı
      ortamdır; beden sınırı zorunlu değildir. Kas komutu hızlı ve ayrıntılı durum/geri besleme ister, tork düzeyi
