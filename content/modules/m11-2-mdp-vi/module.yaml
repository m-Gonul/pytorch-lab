    solution: 'Genelde değişir: terminale kadar eklenen miktar cΣₖ₌₀^(T−t−1)γᵏ; T politikaya/yörüngeye bağlıysa
      ortak sabit değildir. İndirimsiz bir görevde a hemen +1 ile bitirsin, b önce 0 sonra +1 ile iki adımda
      bitsin. Başta ikisi de 1. Her terminal-öncesi geçiş ödülüne c=1 ekleyince a=2, b=3 olur; uzunu tercih eder.
      c=−1 için a=0, b=−1 ve kısayı tercih eder. Terminalden sonraki soğurucu döngülere de c eklemek farklı bir
      görev tanımlar; o döngüler artık sıfır değildir. Sabit bilinen bölüm uzunluğunda veya bütün sonsuz kuyruğa
