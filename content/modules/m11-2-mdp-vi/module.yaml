id: m11-2-mdp-vi
code: M11.2
title: MDP, değer yinelemesi ve yakınsama sınırları
phase: 11
minutes: 380
prereq: [m11-1-markov]
summary: >
  Markov karar süreci: durumlar, eylemler, geçiş modeli, ödül, indirim,
  ufuk. Sonlu ufukta geriye doğru dinamik programlama ve zamana bağlı
  (durağan olmayan) en iyi politika; sonsuz ufukta Bellman optimallik
  operatörünün γ-büzülme olduğu, sabit noktası ve "n adım sonra ne kadar
  uzaktayım?" sınırı. Notlardaki perakende stok örneğini elle ve saf
  Python'da tam çözüyorsun; NumPy'da einsum'lu Bellman operatörü, durma
  kuralı ve sınırın rastgele MDP'lerde sağlandığını; PyTorch'ta yığın
  halinde yüzlerce MDP ve autograd ile $\partial V^*/\partial R$'nin indirimli
  ziyaret ölçüsü olduğunu; en sonda büyük bir stok MDP'sini vektörel
  çözüyorsun.
goals:
  - "MDP $(S,A,P,R,\\gamma,h)$, politika, beklenen fayda; [[Bellman denklemi]]"
  - "Sonlu ufukta durağan olmayan, sonsuz ufukta durağan en iyi politika"
  - "$H^*$ büzülmesi: $\\lVert H^*V-H^*U\\rVert_\\infty\\le\\gamma\\lVert V-U\\rVert_\\infty$ ve $\\lVert V^*-V_n\\rVert_\\infty\\le\\frac{\\gamma}{1-\\gamma}\\lVert V_n-V_{n-1}\\rVert_\\infty$"
  - "Politika değerlendirme: $V=(I-\\gamma T_\\pi)^{-1}R_\\pi$"
sources:
  - {title: "Sutton & Barto — Reinforcement Learning: An Introduction (2. baskı), Bölüm 3–4", url: "http://incompleteideas.net/book/the-book-2nd.html", license: "CC BY-NC-ND 2.0", use: link}
  - {title: "Puterman — Markov Decision Processes (Wiley 1994), Bölüm 4 ve 6", url: "https://doi.org/10.1002/9780470316887", license: "©", use: link}
  - {title: "Poupart — CS885 Reinforcement Learning (Waterloo), Ders 2–3", url: "https://cs.uwaterloo.ca/~ppoupart/teaching/cs885-spring20/", license: "doğrulanmadı", use: link}
  - {title: "Bertsekas — Dynamic Programming and Optimal Control, Cilt 2", url: "http://www.athenasc.com/dpbook.html", license: "©", use: link}

hand:
  groups:
    - title: "Perakende stok (notlar), $h=5$, $\\gamma=1$: son gün değerleri $V_5=[0,-4,-8,-12]$"
      fields:
        - {id: v4s0, label: "$V_4(S_0)=R(S_0)+V_5(S_1)$", answer: -9}
        - {id: v4s1, label: "$V_4(S_1)$ (en iyi eylemle)", answer: -1.8}
        - {id: v4s3, label: "$V_4(S_3)$", answer: -10.8}
        - {id: v3s1, label: "$V_3(S_1)$", answer: -4.96}
        - {id: a3s1, label: "$t=3$'te $S_1$ için en iyi eylem (yüksek fiyat 1, indirim 2)", answer: 1}
    - title: "Sınırlar, $\\gamma=0.9$"
      fields:
        - {id: bd, label: "$\\lVert V_n-V_{n-1}\\rVert_\\infty=0.01$ ise $\\lVert V^*-V_n\\rVert_\\infty$ üst sınırı", answer: 0.09}
        - {id: geo, label: "Her adımda ödül 1 (sonsuz ufuk): $V$", answer: 10}
  verify: |
    R = [-5, -1, -1, -2]
    V5 = [0, -4, -8, -12]
    def step(V):
        out, pol = [R[0] + V[1]], [0]
        for k in (1, 2, 3):
            a1 = R[k] + 0.3 * V[k - 1] + 0.7 * V[k]
            a2 = R[k] + 0.8 * V[k - 1] + 0.2 * V[k]
            out.append(max(a1, a2)); pol.append(1 if a1 > a2 else 2)
        return out, pol
    V4, _ = step(V5)
    V3, p3 = step(V4)
    answers = dict(v4s0=V4[0], v4s1=V4[1], v4s3=V4[3], v3s1=V3[1], a3s1=p3[1], bd=0.9 / 0.1 * 0.01, geo=1 / (1 - 0.9))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Robot süpürge MDP'sini kur ve çöz", engine: browser}
  - {id: x2, title: "Ufuk ve indirim: politika ne zaman değişir?", engine: browser}
  - {id: x3, title: "Büzülme yalnız sonsuz normda: L2'de karşı örnek", engine: browser}

quiz:
  - q: "Sonlu ufuklu bir MDP'de en iyi politika neden zamana bağlıdır?"
    options:
      - {t: "Kalan süre değiştikçe bir eylemin uzun vadeli getirisi değişir; ör. son günde stoklu kalmanın cezası farklıdır", ok: true, why: "Sonsuz ufukta her adımda kalan süre aynı (sonsuz) olduğu için politika durağandır."}
      - {t: "Geçiş olasılıkları zamanla değiştiği için", why: "Model durağan varsayıldı."}
      - {t: "İndirim faktörü yüzünden", why: "γ = 1 iken de olur."}
  - q: "Bellman optimallik operatörü neden sabit noktaya yakınsar?"
    options:
      - {t: "Sonsuz normda γ-büzülmedir; Banach sabit nokta teoremiyle tek sabit nokta vardır ve her başlangıçtan yakınsanır", ok: true, why: "Hata her adımda en az γ katına iner."}
      - {t: "Monoton artan olduğu için", why: "Monotonluk tek başına sınırsız artışı engellemez."}
      - {t: "Doğrusal olduğu için", why: "max içerdiği için doğrusal değildir; politika değerlendirme operatörü doğrusaldır."}
  - q: "‖V_n − V_{n−1}‖∞ = ε gözlendi. V*'a uzaklık için ne söylenebilir?"
    options:
      - {t: "‖V* − V_n‖∞ ≤ γε/(1−γ)", ok: true, why: "Kalan tüm tek adım farkları geometrik dizi oluşturur."}
      - {t: "‖V* − V_n‖∞ ≤ ε", why: "γ → 1'de çok iyimser."}
      - {t: "Hiçbir şey", why: "Büzülme sayesinde açık sınır var."}

homework:
  - title: "Value Iteration Networks"
    paper: "Tamar, Wu, Thomas, Levine, Abbeel — Value Iteration Networks (NeurIPS 2016)"
    url: "https://arxiv.org/abs/1602.02867"
    level: ileri
    hours: 12
    goal: |
      Değer yinelemesini bir CNN katmanı olarak yaz: ödül haritası ve değer haritası kanalları üzerinde 3 × 3 konvolüsyon ($\\bar Q$), kanal boyunca max ($V$), K kez tekrar; ızgara dünyasında harita görüntüsünden ödülü öğrenen ve VI modülünü uçtan uca eğiten VIN'i uygula. Rastgele engel haritalarında yol bulma başarısını sıradan bir CNN politika ağıyla, eğitimde görülmeyen büyük haritalarda karşılaştır.
    steps:
      - "Veri: rastgele engelli 16 × 16 ve 28 × 28 haritalar, hedef ve en kısa yol eylemleri (BFS)."
      - "VI modülü: $\\bar Q=W_r*R+W_v*V$, $V=\\max_a\\bar Q$; K = 20 (16 × 16), K = 36 (28 × 28)."
      - "Dikkat (attention): ajanın konumundaki $\\bar Q$ vektörünü seç, eylem sınıflandırması."
      - "Bu modülün d aşamasındaki türevlenebilir VI ile bağlantıyı tartış."
    accept:
      - "28 × 28'de VIN başarı oranı ≥ %85, düz CNN'den en az 15 puan yüksek."
      - "K'ya karşı başarı grafiği; K < harita çapı olduğunda başarının düştüğü gösterilmiş."

labs:
  - id: l1
    lab: valueiter
    title: "Değer iterasyonu: γ-büzülme ve politika"
    goal: "$V_{k+1}(s)=\\max_a\\sum_{s'}P(s'|s,a)[r+\\gamma V_k(s')]$. Bellman operatörü ∞-normda γ-büzülme olduğundan $\\|V_{k+1}-V_k\\|_\\infty\\le\\gamma^k\\|V_1-V_0\\|_\\infty$: log grafikte eğimi ln γ olan bir doğru. Kayma olasılığı ve adım ödülü, greedy politikanın ne kadar risk aldığını belirler."
    predict:
      q: "γ = 0.99 ile 10⁻⁶ hassasiyete kaç iterasyon gerekir (kabaca)?"
      options:
        - {t: "≈ 14", why: "Bu γ = 0.37 için."}
        - {t: "≈ 1400", ok: true, why: "ln(10⁻⁶)/ln(0.99) ≈ 1375."}
        - {t: "≈ 140", why: "Bu γ = 0.9 için (≈ 131)."}
    presets:
      - {name: "Kısa görüş", params: {g: 0.5, k: 30}, note: "γ küçükken uzak hedefin değeri γ^mesafe ile söner: uzak durumlarda politika anlamsızlaşır."}
      - {name: "Riskli zemin", params: {slip: 0.5, k: 60}, note: "Kayma yüksek: çukurun yanından geçmek pahalı, politika dolaşır."}
      - {name: "Acele et", params: {step: -0.6, slip: 0.3, k: 60}, note: "Adım cezası büyük: çukura düşme riskini göze alıp kısa yolu seçer."}
      - {name: "Erken durdurma", params: {k: 3, B: {k: 40}}, note: "Değerler henüz yakınsamadan greedy politika çoğu zaman zaten doğrudur — politika iterasyonunun hızlı olmasının nedeni."}
    questions:
      - q: "Kalan hata sınırı γ^k R_max/(1−γ) neden gerçek farktan çok büyük?"
        a: "En kötü durum sınırıdır; gerçek yakınsama hızı geçiş yapısına (ör. sönümlenen yolların sayısına) bağlıdır. Yine de eğim (ln γ) birebir tutar."
    limits: "5 × 5 ızgara, iki duvar; kayma yalnız sağa/sola dik yönde."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bellman operatörü bir büzülmedir
    goal: Değer iterasyonunun yakınsamasını kanıtlamak
    needs: Sup-normu, Banach sabit nokta teoremi (sezgisel)
    q: |-
      $(TV)(s)=\max_a\big[r(s,a)+\gamma\sum_{s'}P(s'|s,a)V(s')\big]$. $\|TV-TU\|_\infty\le\gamma\|V-U\|_\infty$ olduğunu kanıtla.
    solution: |-
      **Lemma:** $|\max_af(a)-\max_ag(a)|\le\max_a|f(a)-g(a)|$. (Kanıt: $a^*$, $f$'nin argmax'ı olsun: $\max f-\max g\le f(a^*)-g(a^*)\le\max|f-g|$; simetrik.)

      **Uygula:** $|(TV)(s)-(TU)(s)|\le\max_a\gamma\big|\sum_{s'}P(s'|s,a)(V(s')-U(s'))\big|\le\gamma\max_a\sum_{s'}P(s'|s,a)\|V-U\|_\infty=\gamma\|V-U\|_\infty$ (olasılıklar toplamı 1).

      **Sonuç:** $s$ üzerinden maksimum alınca iddia. Banach teoremiyle tek bir sabit nokta $V^*$ vardır ve $V_k=T^kV_0\to V^*$, hata $\gamma^k\|V_0-V^*\|_\infty$ ile söner. Durdurma: $\|V_{k+1}-V_k\|_\infty<\varepsilon(1-\gamma)/(2\gamma)$ ise greedy politika $\varepsilon$-en iyidir.

      **γ = 1 olursa** büzülme kalkar; sonlu ufuk ya da sonlanan (proper) politikalar olmadan sonuç geçmez.
  - id: p2
    type: hesap
    level: 1
    title: Sabit ödülün indirimli toplamı
    goal: Geometrik seriyle değer hesaplamak
    needs: Geometrik seri
    q: |-
      Her adımda ödül 1, sonsuza dek, $\gamma=0.95$. Getiri $G=\sum_{t\ge0}\gamma^t$?
    answer: 19.999999999999982
    calc: "1/(1-0.95)"
    mistakes:
      - {answer: 18.999999999999982, msg: "Toplam t = 0'dan başlıyor: ilk ödül indirimsiz, 1/(1 − γ)."}
    hints:
      - "$\\sum_{t\\ge0}\\gamma^t=\\frac1{1-\\gamma}$."
    solution: |-
      $1/0.05=20$. γ'nın "etkin ufku" ≈ $1/(1-\gamma)=20$ adım.
  - id: p3
    type: hesap
    level: 1
    title: Bir Bellman güncellemesi
    goal: Değer iterasyonu adımını elle yapmak
    needs: P1
    q: |-
      Durum $s$, iki eylem. $a_1$: ödül 1, olasılık 1 ile $s'$'ye ($V(s')=10$). $a_2$: ödül 3, olasılık 0.5 ile $s'$'ye, 0.5 ile çukura ($V=0$). $\gamma=0.9$. $(TV)(s)$?
    answer: 10.0
    calc: "max(1+0.9*10, 3+0.9*(0.5*10+0.5*0))"
    mistakes:
      - {answer: 7.5, msg: "Bu a₂'nin değeri; max her iki eylemi karşılaştırır: a₁ = 1 + 9 = 10."}
      - {answer: 11.0, msg: "Gelecek değeri γ ile indirgemeyi unuttun."}
    hints:
      - "Her eylem için $r+\\gamma\\mathbb E[V(s')]$, sonra max."
    solution: |-
      $a_1$: $1+0.9\cdot10=10$; $a_2$: $3+0.9\cdot5=7.5$. $(TV)(s)=10$, greedy eylem $a_1$: anlık ödülü küçük ama güvenli.
  - id: p4
    type: hesap
    level: 2
    title: Kaç iterasyon yeter?
    goal: Büzülme sınırını kullanarak iterasyon sayısı bulmak
    needs: P1
    q: |-
      $\gamma=0.9$, $\|V_1-V_0\|_\infty=1$. $\|V_{k+1}-V_k\|_\infty\le\gamma^k$ sınırıyla farkın $10^{-3}$'ün altına inmesi için en küçük $k$?
    answer: 66.0
    calc: "math.ceil(math.log(1e-3)/math.log(0.9))"
    mistakes:
      - {answer: 1.0, msg: "Sınır doğrusal değil üstel: γ^k ≤ 10⁻³ ⇒ k ≥ ln 10⁻³ / ln γ."}
    hints:
      - "$0.9^k\\le10^{-3}$."
    solution: |-
      $k\ge\ln10^{-3}/\ln0.9=65.6$ → 66. γ = 0.99'da ≈ 688: uzun ufuk yavaş yakınsama demek.
  - id: p5
    type: uyarla
    level: 3
    title: Dinamik fiyatlandırmayı MDP olarak kur
    goal: Gerçek bir problemi MDP bileşenlerine çevirmek
    needs: MDP tanımı
    q: |-
      Bir mağaza her gün bir ürün için fiyat seçiyor (3 seviye); stok her sabah belli bir miktara tamamlanmıyor, sipariş 3 gün sonra geliyor. Durum, eylem, geçiş, ödül ve γ'yı tanımla; Markov varsayımının nerede zorlandığını söyle.
    rubric:
      - "Durumu (stok düzeyi + yolda olan siparişler + gerekirse haftanın günü) tanımladım"
      - "Eylemi (fiyat seviyesi, sipariş miktarı) tanımladım"
      - "Geçişi talep dağılımına (fiyata bağlı) dayandırdım"
      - "Ödülü (gelir − stok tutma − stoksuz kalma maliyeti) yazdım"
      - "Gecikmeli siparişlerin durumu genişletmeden Markov olmayacağını, mevsimselliğin de durum gerektirdiğini açıkladım"
    hints:
      - "Yarın ne olacağını bilmek için bugün neleri bilmen gerekir?"
    solution: |-
      Durum: $s=(\text{stok},\ \text{yolda olan siparişler } o_1,o_2,o_3,\ \text{gün})$; yalnız stok yetmez, çünkü 3 gün sonra gelecek sipariş geleceği belirler — durumu genişletmek Markov özelliğini geri getirir. Eylem: (fiyat, sipariş). Geçiş: talep $D\sim\mathrm{Poisson}(\lambda(\text{fiyat}))$, stok $\leftarrow\max(\text{stok}-D,0)+o_1$. Ödül: $\text{fiyat}\cdot\min(D,\text{stok})-h\cdot\text{stok}-c\cdot\max(D-\text{stok},0)$. γ ≈ 0.99 (günlük, uzun ufuk). Modül anlatımındaki perakende örneği bunun en basit hâli.
pitfalls:
  - wrong: "γ yalnız matematiksel bir kolaylıktır."
    right: "γ aynı zamanda problemin tanımıdır: küçük γ kısa vadeli, büyük γ uzun vadeli davranış ister ve yakınsamayı yavaşlatır."
  - wrong: "Değer iterasyonu değerler tam yakınsamadan durdurulursa politika kötüdür."
    right: "Greedy politika genellikle değerlerden çok önce sabitlenir (deney: 'Erken durdurma'); bu politika iterasyonunun hızlı olmasının nedenidir."
  - wrong: "Ödül her zaman pozitif olmalı."
    right: "Negatif adım ödülü (ceza) 'hızlı bitir' demektir; ödül tasarımı istenen davranışı belirler, tuhaf kısayollara da açabilir."
whatif:
  - q: "Geçiş olasılıkları bilinmiyorsa?"
    a: "Değer iterasyonu doğrudan uygulanamaz; deneyimden öğrenen modelsiz yöntemler (MC, TD, Q-öğrenme — M11.4–11.5) ya da modeli öğrenip planlama (Dyna, M11.10) gerekir."
  - q: "Durum sayısı 10¹⁰ olsaydı?"
    a: "Tablo tutulamaz; değer fonksiyonu yaklaşık temsil edilir (doğrusal ya da sinir ağı, M11.6) ve büzülme garantisi kaybolabilir (ölümcül üçlü)."
