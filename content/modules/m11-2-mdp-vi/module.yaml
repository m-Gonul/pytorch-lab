  - id: p20
    type: hesap
    level: 1
    title: 'Sutton 3.14: ızgaranın orta hücresini denetle'
    goal: ızgaranın orta hücresini denetle
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Şekil 3.2 rastgele politika ızgarasının orta değeri +0.7; komşu değerleri +2.3,+0.4,−0.4,+0.7 (bir ondalık).
      γ=0.9 ve her eylem 1/4. Bellman (3.14) eşitliğini sayısal göster. Sayısal alana yuvarlanmış komşularla
      bulunan değeri gir.

      (Kaynak: Sutton ve Barto, s.60, Alıştırma 3.14.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: Ortadaki bütün geçişlerin ödülü 0. Sağ taraf 0.9×(2.3+0.4−0.4+0.7)/4=0.675. Bir ondalığa yuvarlayınca
      0.7. Kaynak komşuları zaten yuvarlandığı için 0.675 ile yazılı 0.7 arasında tam eşitlik beklenmez. 25×25
      doğrusal sistemi tam çözersek orta değer 0.673113259838 bulunur; o da 0.7 yuvarlanır. Kaynak görüntüsünde
      negatif komşu −0.4 doğrulandı.
    answer: 0.675
    calc: 0.9*(2.3+0.4-0.4+0.7)/4
    tol: 1.0e-09
  - id: p21
    type: kanıt
    level: 2
    title: 'Sutton 3.15: devam eden görevde sabit ödül kayması'
    goal: devam eden görevde sabit ödül kayması
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Izgarada bazı ödüller pozitif, kenar ödülleri negatif, diğerleri 0. Her ödüle sabit c eklemek, herhangi
      bir politika altındaki bütün durum değerlerine aynı v_c sabitini ekler mi? Denklem 3.8 ile kanıtla, v_c
      değerini c ve γ ile ver; göreli değerler etkilenir mi?

      (Kaynak: Sutton ve Barto, s.60–61, Alıştırma 3.15.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Devam eden sınırlı ödüllü görev ve 0≤γ<1 için her yörüngede

      $$G''_t=\sum_{k\ge0}\gamma^k(R_{t+k+1}+c)=G_t+\frac{c}{1-\gamma}.$$

      Beklenti alınca v′π(s)=vπ(s)+v_c, v_c=c/(1−γ). Aynı sonuç Q için de geçer; her politika ve durum aynı miktar
      kayar. Durumların göreli değerleri ve politika/eylem sıralaması değişmez. γ=1 devam eden toplamda bu sonlu
      sabit yoktur. İşaretlerin mutlak sıfırı yerine ödüller arasındaki farkların önemli olması burada kullanılan
      ortak sonsuz zaman çizelgesine bağlıdır.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p22
