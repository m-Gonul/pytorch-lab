    solution: 'Durumda ilk eylem π ile seçilir; qπ o eylemden sonra aynı politikayla devam eden getiridir. Toplam
      beklentiyle

      $$v_\pi(s)=\sum_{a\in\mathcal A(s)}\pi(a\mid s)q_\pi(s,a).$$

      Ağırlıklı ortalamadır; maksimum ancak en iyi değer/politika koşuluyla gelir.'
    rubric:
