  - id: p32
    type: açıkla
    level: 1
    title: 'Sutton 3.26: Q yıldızını V yıldızıyla yaz'
    goal: Q yıldızını V yıldızıyla yaz
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'q* değerini v* ve dört argümanlı p cinsinden yaz.

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.26.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'İlk eylem sabit; sonraki durumdan en iyi devam edilir:

      $$q_*(s,a)=\sum_{s'',r}p(s'',r\mid s,a)[r+\gamma v_*(s'')].$$

      Kökte bir max yoktur; o eylem verilmiştir. Sonraki en iyilik v* içinde bulunur.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
