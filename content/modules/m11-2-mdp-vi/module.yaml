      program: durum mevcut sembolik ifadeler, açık hedefler ve kalan hesap bütçesi; eylem çıkarım kuralı; ödül
      doğrulanmış ispata +1, işlem maliyetine negatif. Bu örnek iç hesaplamayı eylem yaparak fiziksel motor örneklerinin
      dışına çıkar. Sonlu tablo için her üçünün uzaylarını sonlu düzeylere ayır; bu ayrıştırmanın hangi bilgiyi
      kaybettiğini açıkla. Başka üç tutarlı örnek de geçerlidir.'
