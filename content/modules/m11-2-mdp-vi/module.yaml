    - Üç görev birbirinden belirgin farklıdır.
    - Her biri için S/A/R açık tanımlıdır.
    - En az biri soyut eylem, kısmi gözlem veya temsil sınırını tartışır.
  - id: p8
    type: karşı-örnek
    level: 2
    title: 'Sutton 3.2: her amaçlı görev sonlu MDP mi?'
    goal: her amaçlı görev sonlu MDP mi?
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'MDP çerçevesi, amaç yönelimli bütün öğrenme görevlerini yararlı biçimde temsil etmeye yeter mi? Açık
