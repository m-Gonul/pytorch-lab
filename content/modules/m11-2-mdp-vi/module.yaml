    level: 2
    title: 'Sutton 3.27: Q yıldızından en iyi politika'
    goal: Q yıldızından en iyi politika
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'π* politikasını q* cinsinden veren bir eşitlik yaz.

      (Kaynak: Sutton ve Barto, s.67, Alıştırma 3.27.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'B(s)=argmaxₐq*(s,a) olsun. π*(a|s)>0 ancak a∈B(s) ise, ve Σₐπ*(a|s)=1 olacak şekilde seç. Belirlenimci
      bir çözüm a*(s)∈B(s) seçip π*(a|s)=1{a=a*(s)} yazmaktır. Tüm eşit en iyi eylemler üzerinde düzgün dağılım
      da mümkündür: π*(a|s)=1{a∈B(s)}/|B(s)|. Argmax bir küme olabileceği için bağ kırma kuralını veya karışımı
      belirtmek gerekir.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p34
    type: açıkla
    level: 2
    title: 'Sutton 3.28: V yıldızından en iyi politika'
    goal: V yıldızından en iyi politika
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'π* politikasını v* ve dört argümanlı p cinsinden yaz.

      (Kaynak: Sutton ve Barto, s.67, Alıştırma 3.28.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Bir adımlık eylem puanı F(s,a)=Σₛ′,ᵣp(s′,r|s,a)[r+γv*(s′)] olsun. B(s)=argmaxₐF(s,a). π*(·|s)
      yalnız B(s) üzerinde olasılık taşıyan herhangi bir dağılımdır; örneğin π*(a|s)=1{a∈B(s)}/|B(s)|. v* geleceği
      zaten içerdiği için bu bir adımlık seçim uzun vadede en iyidir. Yalnız en büyük v*(s′) durumunu seçmek
      yetmez: geçiş olasılıkları, anlık ödüller ve bütün sonuçlar hesaba katılmalıdır.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p35
    type: açıkla
    level: 3
    title: 'Sutton 3.29: dört Bellman denklemini marjinal modelle yaz'
    goal: dört Bellman denklemini marjinal modelle yaz
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'vπ,v*,qπ,q* için dört Bellman denklemini, üç argümanlı p(s′|s,a) (3.4) ve iki argümanlı r(s,a) (3.5)
      ile yeniden yaz.

      (Kaynak: Sutton ve Barto, s.67, Alıştırma 3.29.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Ödül terimi ortak modelden r(s,a) olarak, geleceğin ağırlığı ise marjinal P=p(s′|s,a) olarak çıkar:

      $$v_\pi(s)=\sum_a\pi(a\mid s)\left[r(s,a)+\gamma\sum_{s''}p(s''\mid s,a)v_\pi(s'')\right],$$

      $$v_*(s)=\max_a\left[r(s,a)+\gamma\sum_{s''}p(s''\mid s,a)v_*(s'')\right],$$

      $$q_\pi(s,a)=r(s,a)+\gamma\sum_{s''}p(s''\mid s,a)\sum_{a''}\pi(a''\mid s'')q_\pi(s'',a''),$$

      $$q_*(s,a)=r(s,a)+\gamma\sum_{s''}p(s''\mid s,a)\max_{a''}q_*(s'',a'').$$

      Bölümlü durumda sonraki durumlar S⁺, terminal değer 0. Bu dönüşüm, ödül ile sonraki durum bağımsızmış varsayımına
      dayanmaz; r(s,a) zaten ortak dağılım üzerinden beklenen ödüldür. Sonraki değer ödüle değil s′ değişkenine
      bağlı olduğundan toplamlar ayrılabilir.'
    rubric:
    - Dört değer fonksiyonu için ayrı doğru denklem yazar.
    - Politika ortalaması ve maksimumun yerini korur.
    - Beklenen ödülü yanlışlıkla her sonraki durum için yeniden toplamıyor.
    - Bağımsızlık varsayımı eklemez.

pitfalls:
  - wrong: "γ yalnız matematiksel bir kolaylıktır."
    right: "γ aynı zamanda problemin tanımıdır: küçük γ kısa vadeli, büyük γ uzun vadeli davranış ister ve yakınsamayı yavaşlatır."
  - wrong: "Değer iterasyonu değerler tam yakınsamadan durdurulursa politika kötüdür."
    right: "Greedy politika genellikle değerlerden çok önce sabitlenir (deney: 'Erken durdurma'); bu politika iterasyonunun hızlı olmasının nedenidir."
  - wrong: "Ödül her zaman pozitif olmalı."
    right: "Negatif adım ödülü (ceza) 'hızlı bitir' demektir; ödül tasarımı istenen davranışı belirler, tuhaf kısayollara da açabilir."
  - wrong: "Değer yinelemesi ‖V_n − V_{n−1}‖∞ ≤ ε olunca durduğunda değerlerin hatası en çok ε'dur."
    right: "Kalan adımların toplamı γε/(1 − γ) kadar olabilir: γ = 0.99'da 99ε. ε-en iyi bir politika için ‖V_n − V_{n−1}‖ < ε(1 − γ)/(2γ) olana dek yinelenir."

whatif:
  - q: "Geçiş olasılıkları bilinmiyorsa?"
    a: "Değer iterasyonu doğrudan uygulanamaz; deneyimden öğrenen modelsiz yöntemler (MC, TD, Q-öğrenme — M11.4–11.5) ya da modeli öğrenip planlama (Dyna, M11.10) gerekir."
  - q: "Durum sayısı 10¹⁰ olsaydı?"
    a: "Tablo tutulamaz; değer fonksiyonu yaklaşık temsil edilir (doğrusal ya da sinir ağı, M11.6) ve büzülme garantisi kaybolabilir (ölümcül üçlü)."
  - q: "Sonsuz ufukta γ = 1 alınsaydı?"
    a: "Bellman operatörü büzülme olmaz ve indirimsiz toplam sonsuz olabilir; değer yinelemesi yakınsamayabilir. İki çıkış yolu var: her politikanın olasılık 1 ile bir son duruma ulaştığı problemlerde (en kısa yol) indirimsiz toplam sonludur ve yineleme yine yakınsar; sürekli işleyen sistemlerde ise ortalama ödül ölçütü (adım başına uzun dönem kazanç) kullanılır ve göreli değer yinelemesiyle çözülür."
