    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Sonlu, tam gözlenen, durağan MDP bütün görevlerin birebir modeli değildir. Kart oyununda gizli
      kartlar varken son gözlem aynı olsa da rakibin gizli eli farklı gelecek dağılımları yaratır: gözlenen durum
      Markov değildir. Sürekli konum veya sınırsız sembolik bellek sonlu küme varsayımını aşar; değişen rakip
      durağanlığı bozabilir. Birden fazla hedefin kesin sözlüksel önceliği de tek sınırlı skaler ödüle doğrudan
