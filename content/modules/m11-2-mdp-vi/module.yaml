  - id: p27
    type: yorumla
    level: 2
    title: 'Sutton 3.21: ilk putt, sonra en iyi sopa'
    goal: ilk putt, sonra en iyi sopa
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Golf için q*(s,putter) en iyi eylem-değer konturlarını çiz veya tarif et.

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.21.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'İlk vuruş putter zorunlu, devamında iki sopa serbest:

      $$q_*(s,\mathrm{putter})=-1+\mathbb E[v_*(S'')\mid s,\mathrm{putter}]$$

      (burada γ=1). Putter kesin geçiş sağlıyorsa −1+v*(f_putt(s)) olur. Delikten önceki tek-putt bölgesinde
      −1; daha dışarıda ilk putt hangi en iyi V bölgesine indiriyorsa onun bir eksiği. Bu konturlar hep-putter
      v_putt halkalarıyla genel olarak aynı değildir: ileride driver kullanmak yolu kısaltır. Kumda putter topu
      yerinde bırakır ve driver ile çıkmak mümkünse q*putter=−1+v*(s) sonludur; hep-putter değeri ise −∞. Özgün
      sonlu modelde kumdan driver ile bitirmek iki vuruş, önce boşa putt sonra driver/putt üç vuruştur: −3. Tam
      saha geometrisi verilmediği için biricik koordinatlı kontur iddiası kurulmaz.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
