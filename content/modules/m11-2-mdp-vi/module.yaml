  - id: p10
    type: hesap
    level: 2
    title: 'Sutton 3.4: ortak dağılım tablosunun eksik varsayımı'
    goal: ortak dağılım tablosunun eksik varsayımı
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Örnek 3.3 geri dönüşüm robotu için s, a, s′, r ve p(s′,r|s,a) sütunlu, olasılığı pozitif her dörtlüyü
      içeren bir tablo kur. Yüksek/düşük pil, α/β, rₛ>r𝓌, kurtarma −3 ve şarj ödülü 0 koşullarını koru.

      (Kaynak: Sutton ve Barto, s.53, Alıştırma 3.4.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Kaynak notu: örnekte rₛ/r𝓌 koşullu ortalamalardır; bütün ödül dağılımları verilmediğinden tek
      bir ortak tablo belirlenmez. Genel çözüm, verilen ortalamalara sahip ρ(r|s,a,s′) dağılımlarıyla p(s′,r|s,a)=P(s′|s,a)ρ(r|s,a,s′)
      yazmaktır. Ortalama 1 olan sürekli 1 ödül ile yarı yarıya 0/2 ödülü aynı kaynak tablosunu verir, farklı
      ortak dağılım üretir.


      Ek olarak her dal ödülünün koşullu ortalamaya eşit ve belirlenimci olduğunu VARSAYARSAK:


      | s | a | s′ | r | p(s′,r\|s,a) |

      |---|---|---|---|---|

      | h | ara | h | rₛ | α |

      | h | ara | l | rₛ | 1−α |

      | l | ara | h | −3 | 1−β |

      | l | ara | l | rₛ | β |

      | h | bekle | h | r𝓌 | 1 |

      | l | bekle | l | r𝓌 | 1 |

      | l | şarj | h | 0 | 1 |


      Her durum–eylem için toplam 1. α veya β uç değerdeyse sıfır olan satırları çıkar; soru yalnız pozitif dörtlüleri
      istiyor. Diğer ödül değerlerinin olasılığı 0. Bu yedi satır kaynakta verilmemiş belirlenimci-ödül varsayımına
      bağlıdır.'
    rubric:
    - Verilen ortalamaların tam dağılımı belirlemediğini saptar.
    - Genel ρ çözümünü veya ek varsayımı açık yazar.
    - Yedi dalı, −3 ve 0 ödüllerini ve pozitiflik koşulunu korur.
  - id: p11
    type: açıkla
    level: 1
    title: 'Sutton 3.5: terminali olasılık toplamına kat'
    goal: terminali olasılık toplamına kat
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Denklem 3.3 devam eden görevde her (s,a) için geçerlidir. Bölümlü görev için küçük ama gerekli değişiklik
      nedir? Değişmiş denklemi yaz.

      (Kaynak: Sutton ve Barto, s.54, Alıştırma 3.5.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Terminal olmayan s∈S ve a∈A(s) için sonraki durumları terminali de içeren S⁺ üzerinden topla:

      $$\sum_{s''\in\mathcal S^+}\sum_{r\in\mathcal R}p(s'',r\mid s,a)=1.$$

      Terminale giriş olasılığını dışarıda bırakan S toplamı 1 değerinden küçük kalabilir. Soğurucu terminalde
      ayrıca bir kukla eylem tanımlarsan onun kendine dönüş olasılığı 1, ödülü 0 olur.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p12
    type: hesap
    level: 2
    title: 'Sutton 3.6: çubuk dengesinde ilk ceza'
    goal: çubuk dengesinde ilk ceza
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Çubuk dengesini bölümlü ve indirimli ele al: başarısızlıkta −1, diğer bütün ödüller 0 olsun. Her andaki
      getiri nedir? Devam eden ve indirimli formülasyondan farkı nedir?

      (Kaynak: Sutton ve Barto, s.56, Alıştırma 3.6.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Sonraki başarısızlık ödülü t anından K adım sonra, Rₜ₊ₖ=−1 olarak gelsin. T=t+K, diğer ödüller
      0 ise Gₜ=−γ^(K−1). Eşdeğer biçimde Gₜ=−γ^(T−t−1); terminalde G_T=0. γ=0 için yalnız K=1 durumunda −1, diğerlerinde
      0 olur. Devam eden görevde sıfırlama etkileşimi bitirmez: başarısızlıklar t+K₁,t+K₂,… anlarında gelirse
      Gₜ=−Σⱼγ^(Kⱼ−1). Dolayısıyla yalnız ilk başarısızlığın cezasını değil sonraki bölümlerin cezalarını da sayar.
      Bu iki amaç genel olarak aynı değildir. Hiç başarısızlık yoksa her iki sıfır-ödüllü yörüngenin getirisi
      0 olur.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p13
    type: hata-bul
    level: 2
    title: 'Sutton 3.7: kaçış ödülü neden hız öğretmez?'
    goal: kaçış ödülü neden hız öğretmez?
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Labirent robotuna kaçışta +1, diğer zamanlarda 0 veriliyor; görev bölümlü ve Denklem 3.7 indirimsiz getirisi
      en çoklanıyor. Bir süre sonra hızlı kaçışta gelişme görünmüyor. Amaç etkili iletilmiş mi; sorun ne olabilir?

      (Kaynak: Sutton ve Barto, s.56, Alıştırma 3.7.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: Her sonlu başarılı yörüngenin getirisi 1; iki adımda veya iki yüz adımda kaçmak aynı sonuçtur.
      Bu ödül başarı olasılığını ayırabilir ama başarıya kadar geçen süreyi ayırmaz. Yalnız kaçışta ödül almak
      keşfi de zorlaştırabilir; tek başına “öğrenme hiç olmaz” sonucu çıkarmaz. Hız hedefi için kaçış öncesi
      her adım −1 gibi süre maliyeti veya γ<1 ile terminal +1 kullanılabilir. Bunlar yeni amaçlardır; çözümün
      neyi optimize ettiğini açık belirtmek gerekir.
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p14
    type: hesap
    level: 1
    title: 'Sutton 3.8: getirileri tersten hesapla'
    goal: getirileri tersten hesapla
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'γ=0.5, T=5, R₁=−1, R₂=2, R₃=6, R₄=3, R₅=2. G₀,G₁,…,G₅ değerlerini tersten hesapla. Sayısal alana G₀ gir.

      (Kaynak: Sutton ve Barto, s.56, Alıştırma 3.8.)'
    hints:
    - Terminal getiri G₅=0.
    - Gₜ=Rₜ₊₁+0.5Gₜ₊₁ uygula.
    solution: G₅=0. G₄=2; G₃=3+0.5×2=4; G₂=6+0.5×4=8; G₁=2+0.5×8=6; G₀=−1+0.5×6=2. Dizi (2,6,8,4,2,0). Her adımda
      bir sonraki ödül indirimsizdir, kalan getiri 0.5 ile çarpılır. İlk ödülün −1 işareti kaynak sayfa görüntüsünden
      doğrulandı.
    answer: 2
    calc: -1+0.5*(2+0.5*(6+0.5*(3+0.5*2)))
    tol: 1.0e-09
  - id: p15
    type: hesap
    level: 1
    title: 'Sutton 3.9: ilk ödülden sonraki sabit kuyruk'
    goal: ilk ödülden sonraki sabit kuyruk
