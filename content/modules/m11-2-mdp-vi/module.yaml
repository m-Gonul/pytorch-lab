    q: 'γ=0.9, önce R₁=2, sonra sonsuza dek her ödül 7. G₁ ve G₀ nedir? Sayısal alana G₀ gir.

      (Kaynak: Sutton ve Barto, s.56, Alıştırma 3.9.)'
