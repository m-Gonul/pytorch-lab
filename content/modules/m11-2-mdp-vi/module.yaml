  - id: p26
    type: yorumla
    level: 2
    title: 'Sutton 3.20: golfün en iyi durum değerini tarif et'
    goal: golfün en iyi durum değerini tarif et
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Golf örneği için en iyi durum-değer fonksiyonunu çiz veya sözle tarif et.

      (Kaynak: Sutton ve Barto, s.66, Alıştırma 3.20.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Her yerde v*(s)=max{q*(s,putter),q*(s,driver)}. Delik 0, tek putt ile bitirilen green −1. Green
      dışında driver ile bir sonraki vuruşu green içine kesin indirebilen yerlerde iki vuruş yeterliyse değer
      −2; daha uzakta gerektiğinde −3 ve sonraki bölgeler vardır. Tee için kaynak iki drive ve bir putt olanağını
      gösterir: en iyi değer −3, hep putter değeriyse −6. Kumdan driver çıkabiliyorsa v* artık −∞ değildir. En
      iyi konturlar iki sopanın erişim bölgelerinin iyi olanını birleştirir. Kaynak tam koordinat ve iniş dağılımları
      vermediği için tekil sayısal sınır çizgisi çıkarılamaz; bu nitel tarif veya koşullarını açıklayan özgün
      model geçerlidir.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
