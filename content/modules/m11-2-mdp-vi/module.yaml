  - id: p16
    type: kanıt
    level: 2
    title: 'Sutton 3.10: sonsuz geometrik seriyi kanıtla'
    goal: sonsuz geometrik seriyi kanıtla
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Denklem 3.10 içindeki ikinci eşitliği, Σₖ₌₀^∞γᵏ=1/(1−γ), kanıtla; gerekli γ koşulunu belirt.

      (Kaynak: Sutton ve Barto, s.56, Alıştırma 3.10.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 0≤γ<1 al. Sₙ=1+γ+…+γⁿ; γSₙ=γ+…+γⁿ⁺¹. Çıkarınca (1−γ)Sₙ=1−γⁿ⁺¹. γⁿ⁺¹→0 ve 1−γ>0 olduğundan limit
      1/(1−γ). γ=0 doğrudan 1, γ=1 ise kısmi toplam n+1 büyür ve eşitlik sonlu bir toplam vermez. Daha genel
      olarak |γ|<1 için de aynı seri kanıtı çalışır.
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
  - id: p17
    type: açıkla
    level: 2
    title: 'Sutton 3.11: bir sonraki ödül beklentisi'
    goal: bir sonraki ödül beklentisi
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'Şimdiki durum Sₜ olsun ve eylemler stokastik π ile seçilsin. E[Rₜ₊₁|Sₜ] beklentisini π ve dört argümanlı
      p (3.2) ile yaz.

      (Kaynak: Sutton ve Barto, s.58, Alıştırma 3.11.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'Sₜ=s verildiğinde önce eylem, sonra ortak sonraki durum/ödül üzerinden koşulla:

      $$\mathbb E_\pi[R_{t+1}\mid S_t=s]=\sum_{a\in\mathcal A(s)}\pi(a\mid s)\sum_{s'',r}r\,p(s'',r\mid s,a).$$

      Bu ayrıca Σₐπ(a|s)r(s,a). Sonraki durum toplamı bölümlü görevde S⁺ üzerindedir. İndirimin yeri yoktur:
      istenen tek sonraki ödüldür, bütün getiri değildir.'
    rubric:
    - Verilen koşulları ve istenen bütün parçaları kullanır.
    - Ara adımları gerekçelendirir.
    - Sonucun geçerlilik koşulunu belirtir.
