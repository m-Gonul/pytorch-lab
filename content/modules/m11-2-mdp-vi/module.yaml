  - id: p19
    type: açıkla
    level: 1
    title: 'Sutton 3.13: Q değerini V ile yaz'
    goal: Q değerini V ile yaz
    needs: MDP ortak modeli, getiri ve ilgili Sutton Bölüm 3 anlatımı.
    q: 'qπ değerini vπ ve dört argümanlı p cinsinden yaz.

      (Kaynak: Sutton ve Barto, s.58, Alıştırma 3.13.)'
    hints:
    - Önce hangi değişkenin sabit, hangisinin rastgele olduğunu yaz.
    - Getiri özyinelemesi veya toplam olasılık kuralıyla ilgili anlatımdaki bağıntıyı aç.
    solution: 'İlk eylem a sabit; ödül ve sonraki durum ortamdan gelir. Oradan itibaren π izlenir:

      $$q_\pi(s,a)=\sum_{s'',r}p(s'',r\mid s,a)[r+\gamma v_\pi(s'')].$$

      Aynı satırda ilk a için ayrıca π(a|s) ile çarpma: qπ zaten bu eylemin yapılmasına koşulludur. Terminal
      yaprağın V değeri 0 olur.'
    rubric:
