id: m9-14-features
code: M9.14
title: Ölçekten bağımsız öznitelikler — SIFT, SURF, HOG
phase: 9
minutes: 480
prereq: [m9-7-corners, m9-3-spatial-filtering]
summary: >
  Ölçek uzayı, oktavlar ve Gauss farkı (DoG); 3 × 3 × 3 uç noktalar, kontrast
  ve kenar eleme; baskın yön ve 128 boyutlu SIFT betimleyicisi. SURF'ün
  integral görüntü + kutu süzgeçli Hessian'ı ve Haar dalgacıklı 64 boyutlu
  betimleyicisi. HOG: hücre histogramları, blok normalizasyonu (L2-Hys).
  Saf Python'da tek bloklu HOG; NumPy'da `skimage.feature.hog` ile birebir
  HOG ve SURF'ün Fast-Hessian yanıtı; PyTorch'ta DoG piramidi ve bulunan
  ölçeğin bloba göre ölçeklendiğini gösteren deney; en sonda yüzlerce
  anahtar noktanın dönmeden bağımsız betimleyicisini tek seferde çıkaran
  vektörel kod.
goals:
  - "[[ölçek uzayı]] $L(x,y,\\sigma)=G(\\sigma)*f$, oktavlar, $k=2^{1/s}$, oktav başına $s+3$ görüntü"
  - "DoG ≈ ölçek-normalize LoG; uç nokta, kontrast eşiği ve $\\mathrm{Tr}^2/\\mathrm{Det}<(r+1)^2/r$"
  - "SURF: kutu süzgeçli Hessian $\\det\\approx D_{xx}D_{yy}-(0.9D_{xy})^2$, süzgeç büyütülerek ölçek uzayı"
  - "HOG: 8 × 8 hücre, 9 yön, 2 × 2 blok, L2-Hys; 64 × 128 pencerede 3780 boyut"
sources:
  - {title: "Lowe — Distinctive Image Features from Scale-Invariant Keypoints (IJCV 2004)", url: "https://doi.org/10.1023/B:VISI.0000029664.99615.94", license: "©", use: link}
  - {title: "Bay, Tuytelaars, Van Gool — SURF: Speeded Up Robust Features (ECCV 2006)", url: "https://doi.org/10.1007/11744023_32", license: "©", use: link}
  - {title: "Dalal & Triggs — Histograms of Oriented Gradients for Human Detection (CVPR 2005)", url: "https://doi.org/10.1109/CVPR.2005.177", license: "©", use: link}
  - {title: "Gonzalez & Woods — Digital Image Processing, 4. baskı, Bölüm 11.7", url: "https://www.imageprocessingplace.com/", license: "©", use: link}
  - {title: "scikit-image — feature.hog", url: "https://scikit-image.org/docs/stable/api/skimage.feature.html#skimage.feature.hog", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "SIFT ölçek uzayı, $s=2$, $\\sigma_1=\\sqrt2/2$"
      fields:
        - {id: k, label: "$k=2^{1/s}$", answer: 1.414214, tol: 0.0001}
        - {id: n, label: "Oktav başına Gauss görüntüsü ($s+3$)", answer: 5}
        - {id: s3, label: "Oktavdaki 3. görüntünün σ'sı", answer: 1.414214, tol: 0.0001}
        - {id: r, label: "Kenar eşiği $(r+1)^2/r$, $r=10$", answer: 12.1}
        - {id: tr, label: "$D_{xx}=20$, $D_{yy}=2$, $D_{xy}=1$: $\\mathrm{Tr}^2/\\mathrm{Det}$ (≥ eşik → kenar, at)", answer: 12.41026, tol: 0.001}
    - title: "SURF ve HOG"
      fields:
        - {id: det, label: "SURF: $D_{xx}=5$, $D_{yy}=4$, $D_{xy}=2$, $w=0.9$: $\\det$", answer: 16.76, tol: 0.0001}
        - {id: sg, label: "SURF: 27 × 27 süzgecin karşılığı σ (9 × 9 ↔ 1.2)", answer: 3.6, tol: 0.0001}
        - {id: hog, label: "HOG boyutu: 64 × 128 pencere, 8 × 8 hücre, 2 × 2 blok (adım 1 hücre), 9 yön", answer: 3780}
        - {id: bin, label: "HOG: 100°'lik gradyanın bölmesi (9 bölme, 0–180°, 20°'lik)", answer: 5}
  verify: |
    import math
    k = 2 ** 0.5
    s1 = 2 ** 0.5 / 2
    tr = (20 + 2) ** 2 / (20 * 2 - 1)
    answers = dict(k=k, n=5, s3=s1 * k * k, r=11 ** 2 / 10, tr=tr, det=5 * 4 - (0.9 * 2) ** 2, sg=1.2 * 27 / 9,
                   hog=(64 // 8 - 1) * (128 // 8 - 1) * 4 * 9, bin=100 // 20)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "U-SURF betimleyicisi: Haar dalgacıkları ve integral görüntü", engine: browser}
  - {id: x2, title: "HOG + doğrusal SVM ile sınıflandırma", engine: browser}
  - {id: x3, title: "OpenCV SIFT ve ORB ile eşleştirme, Lowe oran testi", engine: browser}

quiz:
  - q: "SIFT ölçek uzayında uç noktaları neden DoG'da arar?"
    options:
      - {t: "DoG, ölçek-normalize LoG'un ($\\sigma^2\\nabla^2G$) ucuz bir yaklaşığıdır ve zaten hesaplanmış Gauss görüntülerinin farkıdır", ok: true, why: "$G(k\\sigma)-G(\\sigma)\\approx(k-1)\\sigma^2\\nabla^2G$; ölçek normalizasyonu sayesinde farklı ölçeklerdeki yanıtlar karşılaştırılabilir."}
      - {t: "DoG kenarları daha iyi bulduğu için", why: "Kenar yanıtları ayrıca elenir."}
      - {t: "Gürültüyü sıfırladığı için", why: "Gürültüyü azaltır ama amaç ölçek seçimidir."}
  - q: "SURF'ün hızının ana kaynağı nedir?"
    options:
      - {t: "İkinci türev Gauss çekirdeklerini kutu süzgeçlerle yaklaşıklayıp integral görüntüyle her boyutta sabit sürede hesaplamak", ok: true, why: "Ölçek uzayı görüntüyü küçültmek yerine süzgeci büyüterek kurulur."}
      - {t: "Daha az anahtar nokta bulması", why: "Benzer sayıda bulur."}
      - {t: "GPU kullanması", why: "Algoritmik bir hızlanmadır."}
  - q: "HOG'da blok normalizasyonu ne sağlar?"
    options:
      - {t: "Yerel aydınlatma ve kontrast değişimlerine karşı dayanıklılık", ok: true, why: "Komşu hücrelerin histogramları birlikte normalize edilir; bir hücre birden fazla blokta farklı normalize edilerek tekrar görünür."}
      - {t: "Dönme değişmezliği", why: "HOG büyük dönmelere değişmez değildir."}
      - {t: "Boyut azaltma", why: "Bloklar örtüştüğü için boyut artar."}

homework:
  - title: "SURF'ü sıfırdan uygula"
    paper: "Bay, Tuytelaars, Van Gool — SURF: Speeded Up Robust Features (ECCV 2006)"
    url: "https://doi.org/10.1007/11744023_32"
    level: ileri
    hours: 14
    goal: |
      Bu modüldeki Fast-Hessian (c) ve U-SURF betimleyicisini (x1) tam SURF'e tamamla: 4 oktav × 4 ölçek, 3 × 3 × 3 non-maximum suppression, ölçek ve konum interpolasyonu (2. derece Taylor), 60°'lik kayan pencereyle baskın yön, döndürülmüş 64 boyutlu betimleyici ve Laplacian işaretiyle hızlı eşleştirme.
    steps:
      - "Oktav ve ölçekler: süzgeç boyutları 9, 15, 21, 27 / 15, 27, 39, 51 / … ve örnekleme adımları."
      - "Interpolasyon: $\\hat x=-\\left(\\frac{\\partial^2H}{\\partial x^2}\\right)^{-1}\\frac{\\partial H}{\\partial x}$, sonlu farklarla."
      - "Yön: 6s yarıçapında 4s'lik Haar yanıtları, σ = 2s Gauss ağırlığı, π/3'lük kayan pencere."
      - "Oxford affine veri setinde (graf, wall, boat, bikes…) tekrarlanabilirlik ve eşleşme skoru; OpenCV SIFT ile karşılaştır."
    accept:
      - "Rotasyon (boat) ve ölçek dizilerinde SIFT'e yakın tekrarlanabilirlik (±10 puan)."
      - "Saniyede işlenen piksel olarak SIFT'ten hızlı (aynı dilde, ör. NumPy/Torch sürümleri)."
      - "Laplacian işareti ön elemesinin eşleştirme süresine etkisi."
  - title: "Dalal–Triggs yaya dedektörü"
    paper: "Dalal & Triggs — Histograms of Oriented Gradients for Human Detection (CVPR 2005)"
    url: "https://doi.org/10.1109/CVPR.2005.177"
    level: orta
    hours: 12
    goal: |
      INRIA Person (ya da Penn-Fudan) verisinde 64 × 128 pencerelerden HOG + doğrusal SVM yaya dedektörü eğit; zor negatif madenciliği (hard negative mining), çok ölçekli kayan pencere ve non-maximum suppression (M4.9) ekle; makaledeki DET eğrisini (miss rate – FPPW) üret.
    steps:
      - "c aşamasındaki HOG'u kullan; makaledeki iyileştirmeleri ekle: üçgen (bilineer) oy dağıtımı ve blok Gauss penceresi (σ = 8)."
      - "Doğrusal SVM (C = 0.01); negatiflerden rastgele 10 pencere / görüntü, sonra zor negatifler."
      - "Görüntü piramidi (ölçek 1.05) ve kutu NMS."
      - "Ablasyon: hücre boyutu (6, 8, 10), yön sayısı (6, 9, 18), işaretsiz / işaretli yön."
    accept:
      - "10⁻⁴ FPPW'de miss rate ≤ %20 (makale ≈ %11)."
      - "Zor negatif madenciliğinin etkisini gösteren iki DET eğrisi."
      - "`cv2.HOGDescriptor_getDefaultPeopleDetector` ile nitel karşılaştırma."
  - title: "SIFT dedektör + betimleyici (uzantı)"
    paper: "Lowe — Distinctive Image Features from Scale-Invariant Keypoints (IJCV 2004)"
    url: "https://doi.org/10.1023/B:VISI.0000029664.99615.94"
    level: ileri
    hours: 12
    goal: |
      d (DoG piramidi) ve e (betimleyici) aşamalarını tam SIFT'e tamamla: başlangıçta 2× büyütme, alt piksel ve alt ölçek interpolasyonu, kontrast ve kenar eleme, 36 bölmeli yön histogramı (parabol uydurma, %80'in üstündeki ikinci tepeler için ek anahtar nokta), trilineer oy dağıtımı. `cv2.SIFT_create` ile anahtar nokta konumlarını ve eşleşme doğruluğunu karşılaştır.
    steps:
      - "Lowe'un parametreleri: σ = 1.6, s = 3, kontrast 0.03, r = 10."
      - "Yön ve betimleyiciyi Gauss pencereli ve trilineer olarak yaz."
    accept:
      - "OpenCV SIFT anahtar noktalarının %70'inden fazlasıyla 1.5 piksel içinde örtüşme."
      - "Döndürülmüş + ölçeklenmiş görüntü çiftinde OpenCV SIFT'e yakın doğru eşleşme oranı."

labs:
  - id: l1
    lab: dogscale
    title: "Ölçek uzayında DoG uç noktaları: küçük bir SIFT dedektörü"
    goal: |
      Std'si 2, 3.5 ve 6 olan üç Gauss leke ve bir dikdörtgen içeren sahnede oktav başına s + 3 Gauss görüntüsü, DoG ve 26 komşulu uç nokta arama ile anahtar noktaları bul; kontrast eşiği ve kenar oranı r ile elemeleri say. Lekelerde bulunan ölçekleri, ölçek-normalize ve ham Laplasyen eğrisini, girdiyi 2 kat büyütmenin ve sahneyi büyütmenin (ölçek kovaryansı) etkisini gör.
    predict:
      q: "Girdi büyütülmeden (Lowe'un 2× adımı olmadan) std'si 2 olan en küçük leke bulunur mu?"
      options:
        - {t: "Evet, σ = 2.02'de", why: "DoG'un mutlak değeri en alt düzeyde (σ = 1.6) daha büyük; uç nokta ölçek aralığının dışında kalıyor."}
        - {t: "Hayır", ok: true, why: "26 komşulu karşılaştırma alt düzeyde yapılamıyor. 2× büyütmeyle σ < 1.6 ölçekleri de taranıyor ve leke σ = 1.6'da bulunuyor."}
        - {t: "Yalnız kontrast eşiği 0'sa", why: "Sorun kontrast değil, ölçek aralığı."}
    presets:
      - {name: "Varsayılan (2× büyütme)", params: {s: 3, c: 0.01, r: 10, z: 1, noise: 0.01, dbl: 1}, note: "43 aday: 25 kontrast, 4 kenar elendi, 14 kaldı. Leke ölçekleri 1.6, 3.2, 5.08."}
      - {name: "Büyütmesiz", params: {dbl: 0}, note: "En küçük leke kayıp; 28 aday, 10 nokta."}
      - {name: "Sahne × 1.5", params: {z: 1.5}, note: "Ölçekler 2.54, 5.08, 8.06: hepsi 1.59 katı (ızgara nicemlemesiyle)."}
      - {name: "Sahne × 0.7", params: {z: 0.7}, note: "Ölçekler 1.27, 2.02, 4.03."}
      - {name: "s = 1", params: {s: 1}, note: "Kaba ölçek ızgarası: 64 aday, 43'ü kenar testiyle eleniyor; iki leke aynı ölçeğe (3.2) düşüyor."}
      - {name: "Yüksek kontrast eşiği", params: {c: 0.04}, note: "Yalnız 3 nokta kalıyor."}
      - {name: "Gürültü", params: {noise: 0.05}, note: "25 nokta: gürültü sahte uçlar ekliyor; en küçük leke 2.02'de."}
    questions:
      - q: "Normalize edilmemiş ∇²L neden ölçek seçemez, σ² çarpanı neyi düzeltir?"
        a: "Gauss türevlerinin genliği σ büyüdükçe azalır (∇²G ∝ 1/σ⁴ · σ² alan): ham yanıt σ ile monoton düşer ve tepe yapmaz. σ² ile çarpmak türevleri ölçeğe göre normalize eder; böylece yanıt, yapının boyutuna eşit σ'da tepe yapar (Gauss leke için σ = t)."
    limits: "96 × 96 yapay sahne; alt piksel Taylor enterpolasyonu yok; kontrast eşiği ham D değerinde; 4 oktav."
  - id: l2
    lab: hoglab
    title: "HOG: hücre, bölme, blok normalizasyonu ve aydınlatma"
    goal: |
      64 × 128 pencerede yapay bir yaya silueti için HOG betimleyicisini hesapla (scikit-image ile 10⁻⁷ düzeyinde aynı). Hücre boyutunu, bölme sayısını, işaretli/işaretsiz yönü ve blok normalizasyonunu değiştir; aydınlatma kazancı ve gölge rampası altında betimleyicinin özgüne kosinüs benzerliğini ve doğrusal bir şablon puanının oranını ölç.
    predict:
      q: "Kazanç 0.6, gölge 0.5. Normalizasyon olmadan doğrusal şablon puanı (w·d) özgününün kaç katı olur?"
      options:
        - {t: "≈ 1", why: "Bu kosinüs benzerliği (0.978): kosinüs ölçeği zaten affeder."}
        - {t: "≈ 0.45", ok: true, why: "Gradyanlar kazançla ve gölgeyle ölçeklenir; L2-Hys ile oran 0.97'ye çıkıyor."}
        - {t: "≈ 0", why: "Yapı korunuyor, yalnız ölçek değişiyor."}
    presets:
      - {name: "Dalal–Triggs", params: {cell: 1, bins: 1, signed: 0, norm: 2, gain: 0.6, shadow: 0.5, noise: 0.01}, note: "3780 boyut; kosinüs 0.972, puan oranı 0.972."}
      - {name: "Normalizasyonsuz", params: {norm: 0}, note: "Kosinüs 0.978 ama puan oranı 0.45."}
      - {name: "Yalnız kazanç", params: {norm: 0, shadow: 0}, note: "Kosinüs 1.000, puan oranı 0.600: tam kazanç kadar."}
      - {name: "Sert aydınlatma", params: {norm: 2, gain: 0.3, shadow: 0.8}, note: "L2-Hys: 0.91; normalizasyonsuz puan oranı 0.18."}
      - {name: "4 × 4 hücre", params: {cell: 0}, note: "16 740 boyut."}
      - {name: "16 × 16 hücre", params: {cell: 2}, note: "756 boyut; kaba ama aydınlatmaya daha az duyarlı (0.992)."}
      - {name: "İşaretli, 18 bölme", params: {bins: 2, signed: 1}, note: "7560 boyut."}
    questions:
      - q: "Blok normalizasyonu neden kosinüs benzerliğini biraz düşürebiliyor, buna rağmen neden kullanılır?"
        a: "Normalizasyon her bloğu aynı boya getirir: zayıf gradyanlı düz bloklar da güçlü bloklar kadar ağırlık kazanır. Gölge rampası düz arka planda gerçek bir yatay gradyan eklediği için bu bloklar değişir. Ama sınıflandırıcı için asıl önemli olan puanın yerel kontrastla ölçeklenmemesidir; normalizasyonsuz bir SVM'nin eşiği aydınlatmaya bağlı kalırdı."
    limits: "Tek yapay pencere; aydınlatma modeli çarpımsal (kazanç × rampa); bölmeler arası enterpolasyon yok (skimage gibi); SVM yok, şablon olarak özgün betimleyici."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Ölçek uzayı tablosu
    goal: k ve σ'ları hesaplamak
    needs: $k=2^{1/s}$, oktav başına $s+3$
    q: |-
      $s=3$, $\sigma_0=1.6$. $k$, birinci oktavın σ'ları ve ikinci oktavın ilk σ'sı?
    solution: |-
      $k=2^{1/3}=1.26$. Altı görüntü: 1.6, 2.02, 2.54, 3.2, 4.03, 5.08; oktav görüntüsü (yukarıdan üçüncü) 3.2 = 2σ₀. İkinci oktav bu görüntünün 2 ile alt örneklenmesiyle başlar; görüntü koordinatlarında σ yine 1.6, özgün görüntüye göre 3.2.
  - id: p2
    type: hesap
    level: 1
    title: Kenar testi
    goal: Tr²/Det'i eşikle karşılaştırmak
    needs: $(r+1)^2/r$
    q: |-
      $D_{xx}=8$, $D_{yy}=3$, $D_{xy}=2$, $r=10$. $\operatorname{Tr}^2/\operatorname{Det}$? (3 basamak)
    answer: 6.05
    calc: "round((8+3)**2/(8*3-2**2), 3)"
    tol: 0.001
    mistakes:
      - {answer: 5.042, msg: "Det = D_xx D_yy − D_xy² = 20, 24 değil."}
      - {answer: 12.1, msg: "Bu eşik (r + 1)²/r."}
    hints:
      - "Tr = 11, Det = 20."
    solution: |-
      $121/20=6.05<12.1$: nokta kenar değil, tutulur.
  - id: p3
    type: hesap
    level: 1
    title: SURF süzgeç boyutu
    goal: Süzgeç boyutundan ölçeğe geçmek
    needs: $\sigma=1.2\cdot L/9$
    q: |-
      SURF'te 51 × 51 kutu süzgeci hangi σ'ya karşılık gelir? (2 basamak)
    answer: 6.8
    calc: "round(1.2*51/9, 2)"
    tol: 0.01
    mistakes:
      - {answer: 5.67, msg: "Oran 9'a göre: 51/9 = 5.67, ama 1.2 ile çarpılmalı."}
      - {answer: 61.2, msg: "1.2 · 51 değil, 1.2 · (51/9)."}
    hints:
      - "9 × 9 ↔ 1.2."
    solution: |-
      $1.2\cdot51/9=6.8$.
  - id: p4
    type: hesap
    level: 2
    title: HOG boyutu
    goal: Örtüşen blokları saymak
    needs: Blok sayısı × hücre/blok × bölme
    q: |-
      48 × 96 pencere, 8 × 8 hücre, 2 × 2 blok (adım 1 hücre), 9 bölme. Boyut?
    answer: 1980
    calc: "(48//8-1)*(96//8-1)*4*9"
    tol: 0
    mistakes:
      - {answer: 2592, msg: "Bu hücre sayısı × 4 × 9; bloklar (6 − 1)(12 − 1) = 55."}
      - {answer: 648, msg: "Bu yalnız hücre histogramları (72 × 9); bloklar örtüşür ve her hücre birden çok kez sayılır."}
    hints:
      - "Hücre ızgarası 6 × 12, blok ızgarası 5 × 11."
    solution: |-
      $55\cdot36=1980$.
  - id: p5
    type: yorumla
    level: 2
    title: Küçük görüntüde SIFT eşleşmesi yok
    goal: Ölçek ve kontrastın etkisini tanımak
    needs: Kontrast eşiği, ölçek aralığı
    q: |-
      Yarı boyuta küçültülmüş bir görüntünün alt görüntüsü, özgün görüntüyle SIFT ile hiç eşleşmiyor (ders örneği). Hangisi en olası çözümdür?
    choices:
      - {t: "r'yi 2'ye indirmek", why: "Bu daha çok noktayı kenar sayıp eler."}
      - {t: "Görüntüyü hafifçe aydınlatmak / karşıtlığını artırmak (ya da histogram belirtmeyle sorguya benzetmek): küçültmeyle zayıflayan D değerleri kontrast eşiğini yeniden geçer", ok: true, why: "Derste gamma ile aydınlatınca 7 eşleşme (biri yanlış) bulundu."}
      - {t: "128 yerine 64 boyutlu betimleyici", why: "Sorun anahtar nokta bulunamaması."}
    hints:
      - "Küçültme ince ayrıntıyı ve DoG genliğini azaltır."
    solution: |-
      Küçültmede ayrıntı kaybolur, DoG değerleri düşer ve eşiği geçen nokta sayısı azalır. Karşıtlık iyileştirme (gamma, histogram belirtme) noktaları geri getirir; kütüphane eşiğini düşürmek de bir seçenektir.
  - id: p6
    type: kanıt
    level: 3
    title: Isı denklemi ve DoG
    goal: DoG ≈ (k − 1)σ²∇²G'yi türetmek
    needs: Kısmi türevler
    q: |-
      (a) $G=\frac1{2\pi\sigma^2}e^{-r^2/2\sigma^2}$ için $\partial G/\partial\sigma=\sigma\nabla^2G$ olduğunu göster. (b) Buradan $G(k\sigma)-G(\sigma)\approx(k-1)\sigma^2\nabla^2G$'yi çıkar. (c) Yaklaşımın hatasının $k$'ye nasıl bağlı olduğunu (Taylor'un bir sonraki terimiyle) söyle.
    rubric:
      - "∂G/∂σ = (r²/σ³ − 2/σ)G hesapladım"
      - "∇²G = (r² − 2σ²)/σ⁴ · G (M9.6) ile çarpıp σ∇²G'ye eşit olduğunu gösterdim"
      - "Sonlu farkla G(kσ) − G(σ) ≈ (kσ − σ)∂G/∂σ yazdım"
      - "Hatanın (k − 1)² mertebesinde olduğunu ve k → 1'de sıfıra gittiğini belirttim"
    hints:
      - "Ön çarpan $1/\\sigma^2$'nin türevini de unutma."
    solution: |-
      (a) $\partial_\sigma G=G\,(-2/\sigma+r^2/\sigma^3)=\sigma\cdot\frac{r^2-2\sigma^2}{\sigma^4}G=\sigma\nabla^2G$. (b) $G(k\sigma)-G(\sigma)\approx(k-1)\sigma\,\partial_\sigma G=(k-1)\sigma^2\nabla^2G$. (c) Bir sonraki terim $\frac12(k-1)^2\sigma^2\partial^2_\sigma G$'dir: göreli hata $(k-1)$ ile orantılıdır; $k=\sqrt2$'de (k − 1 = 0.41) Şekil 1'deki %40'lık fark bunun sonucudur.
pitfalls:
  - wrong: "SIFT anahtar noktaları ölçek uzayında yalnız 8 komşuyla karşılaştırılır."
    right: "26 komşuyla: aynı DoG görüntüsündeki 8 ve üstteki ve alttaki ölçekteki 9'ar komşu. Bu yüzden oktavın ilk ve son DoG'unda uç nokta aranamaz."
  - wrong: "Kütüphaneler arasında SIFT eşikleri aynı anlama gelir."
    right: "Lowe'un 0.03'ü [0, 1] görüntü ve alt piksel D içindir; OpenCV contrastThreshold'u katman sayısına böler ve farklı ölçekte uygular. Eşikler doğrudan taşınamaz."
  - wrong: "HOG'da blok normalizasyonu her zaman benzerliği artırır."
    right: "Doğrusal sınıflandırıcının puanını aydınlatmadan bağımsız kılar; ama zayıf blokları güçlendirdiği için gölge gibi gerçek gradyanlar düz bölgelerde betimleyiciyi değiştirebilir (lab l2)."
  - wrong: "SURF, Gauss yerine kutu süzgeci kullandığı için SIFT'ten her zaman kötüdür."
    right: "Bay ve ark.'ın ölçümlerinde tekrarlanabilirlikte yaklaşır ya da geçer; asıl fark hızdır ve o da gerçekleştirime bağlıdır."
whatif:
  - q: "SIFT'te Gauss pencerenin σ'sı bölge boyunun yarısı yerine çok büyük seçilse?"
    a: "Kenardaki gradyanlar da merkezdekiler kadar ağırlık alır: anahtar noktanın küçük kaymaları betimleyiciyi daha çok değiştirir (piksellerin alt bölgeler arasında geçişi). Ağırlık bu ani değişimleri yumuşatmak içindir."
  - q: "HOG'da işaretsiz yerine işaretli yön kullanılsa?"
    a: "Açık zemin üzerindeki koyu bir nesneyle koyu zemin üzerindeki açık bir nesne farklı betimlenir. Yayalarda giysi ve arka plan rengi rastgele olduğu için işaretsiz yön daha iyidir (Dalal–Triggs); araç gibi tutarlı karşıtlıklı nesnelerde işaretli yön yararlı olabilir."
  - q: "SIFT betimleyicisi 0.2'de kırpılmasa?"
    a: "Doygunluk ya da yansımadan doğan tek bir güçlü kenar vektöre egemen olur; doğrusal olmayan aydınlatma değişimlerinde eşleşme bozulur. 0.2 eşiği büyüklüklerin göreli önemini azaltıp yön dağılımını öne çıkarır."
