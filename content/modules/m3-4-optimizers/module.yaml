id: m3-4-optimizers
code: M3.4
title: "Optimizer'lar: SGD, momentum, RMSProp, Adam, AdamW"
phase: 3
minutes: 240
prereq: [m1-2-gd-variants, m3-2-mlp-backprop]
summary: >
  Adam'ın iki adımını bias düzeltmesiyle elle atıyor, saf Python'da dört
  optimizer'ı PyTorch'un formülleriyle birebir yazıyor, NumPy'da Adam ile
  AdamW farkını ölçüyor, PyTorch'ta `torch.optim.Optimizer`'dan türeyen kendi
  AdamW'ını yazıp resmi olanla bit düzeyinde eşleştiriyor ve en sonda
  `_foreach` çok-tensörlü işlemlerle parametre döngüsünü kaldırıyorsun.
goals:
  - "RMSProp'un ikinci moment ölçeklemesini ve Adam'ın [[bias düzeltmesi|bias düzeltmesini]] türetmek"
  - "L2 cezası ile ayrık (decoupled) weight decay'in Adam'da neden farklı sonuç verdiğini göstermek (AdamW)"
  - "`param_groups` ve `state` yapısıyla tam bir `torch.optim.Optimizer` alt sınıfı yazmak"
  - "Çok sayıda parametre tensörünü `torch._foreach_*` ile tek seferde güncellemek"
sources:
  - {title: "Kingma & Ba — Adam: A Method for Stochastic Optimization", url: "https://arxiv.org/abs/1412.6980", license: "arXiv", use: link}
  - {title: "Loshchilov & Hutter — Decoupled Weight Decay Regularization (AdamW)", url: "https://arxiv.org/abs/1711.05101", license: "arXiv", use: link}
  - {title: "Dive into Deep Learning §12.8–12.10 RMSProp, Adadelta, Adam", url: "https://d2l.ai/chapter_optimization/adam.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "PyTorch — torch.optim.Adam / AdamW (algoritma sözde kodları)", url: "https://docs.pytorch.org/docs/stable/generated/torch.optim.AdamW.html", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "Adam, $L(w)=(w-3)^2$, $w_0=0$, $\\eta=0.1$, $\\beta_1=0.9$, $\\beta_2=0.999$, $\\epsilon=0$. Adım 1: $g_1=-6$"
      fields:
        - {id: m1, label: "$m_1=(1-\\beta_1)g_1$", answer: -0.6, tol: 0.0005, hint: "$0.1\\cdot(-6)$"}
        - {id: v1, label: "$v_1=(1-\\beta_2)g_1^2$", answer: 0.036, tol: 0.0001, hint: "$0.001\\cdot36$"}
        - {id: mh1, label: "$\\hat m_1=m_1/(1-\\beta_1^1)$", answer: -6, tol: 0.001, hint: "bias düzeltmesi ilk adımda $g_1$'i geri verir"}
        - {id: w1, label: "$w_1=w_0-\\eta\\,\\hat m_1/\\sqrt{\\hat v_1}$", answer: 0.1, tol: 0.0005, hint: "$\\hat v_1=36$; adım tam $\\eta$ büyüklüğünde"}
    - title: "Adım 2: $g_2=2(w_1-3)$"
      fields:
        - {id: m2, label: "$m_2$", answer: -1.12, tol: 0.001, hint: "$0.9\\cdot(-0.6)+0.1\\cdot(-5.8)$"}
        - {id: w2, label: "$w_2$", answer: 0.199897, tol: 0.0005, hint: "$\\hat m_2=-1.12/0.19$, $\\hat v_2=v_2/(1-0.999^2)$; adım yine ≈ $\\eta$"}
    - title: "AdamW ayrık weight decay, $\\lambda=0.01$, $\\eta=0.1$"
      fields:
        - {id: wd, label: "$w=2$ için yalnız decay adımı $w(1-\\eta\\lambda)$", answer: 1.998, tol: 0.0001, hint: "Adam güncellemesinden önce uygulanır"}
  verify: |
    import math
    b1, b2, lr = 0.9, 0.999, 0.1
    w, m, v = 0.0, 0.0, 0.0
    out = {}
    for t in (1, 2):
        g = 2 * (w - 3)
        m = b1 * m + (1 - b1) * g; v = b2 * v + (1 - b2) * g * g
        mh, vh = m / (1 - b1 ** t), v / (1 - b2 ** t)
        w = w - lr * mh / math.sqrt(vh)
        out[t] = (m, v, mh, w)
    answers = dict(m1=out[1][0], v1=round(out[1][1], 9), mh1=out[1][2], w1=round(out[1][3], 9),
                   m2=round(out[2][0], 9), w2=round(out[2][3], 6), wd=2 * (1 - lr * 0.01))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Bias düzeltmesi olmasaydı Adam'ın ilk adımları nasıl olurdu?"
    options:
      - {t: "$m$ ve $v$ sıfırdan başladığı için ilk adımlarda sıfıra doğru yanlı; $m$ $(1-\\beta_1)$, $\\sqrt v$ $\\sqrt{1-\\beta_2}$ kadar küçük olur ve oranları adımı yaklaşık 3 kat büyütür", ok: true, why: "$\\frac{0.1}{\\sqrt{0.001}}\\approx3.16$. Düzeltme $\\frac{1}{1-\\beta^t}$ bu yanlılığı tam iptal eder."}
      - {t: "Adımlar sıfır olurdu", why: "$m\\ne0$ ilk adımdan itibaren; sorun ölçek."}
      - {t: "Fark olmazdı", why: "Hand alanında gördüğün gibi ilk adım $\\hat m_1=g_1$ sayesinde düzgün."}
  - q: "Adam'da L2 cezası (`weight_decay`) ile AdamW'ın ayrık weight decay'i neden farklı?"
    options:
      - {t: "L2 cezası gradyana eklenir ve $1/\\sqrt{\\hat v}$ ile ölçeklenir; gradyanı büyük parametreler daha az küçülür. AdamW decay'i ölçeklemeden doğrudan uygular", ok: true, why: "SGD'de ikisi eşdeğer (M1.3). Uyarlamalı yöntemlerde değil; Loshchilov & Hutter'ın gözlemi."}
      - {t: "AdamW bias düzeltmesi kullanmaz", why: "İkisi de kullanır."}
      - {t: "Fark yoktur", why: "c aşamasında farkı sayısal olarak görüyorsun."}
  - q: "`torch._foreach_add_(params, grads, alpha=-lr)` bir Python döngüsüne göre neyi kazandırır?"
    options:
      - {t: "Tüm tensör listesini tek bir dispatch ile işler; mümkünse işleri birleştirilmiş (multi-tensor apply) kernel'lara toplar", ok: true, why: "Binlerce küçük parametre tensörü olan modellerde optimizer adımının çoğu Python + dispatch maliyetidir. `foreach=True` PyTorch optimizer'larında varsayılan."}
      - {t: "Gradyanları daha doğru hesaplar", why: "Sayısal sonuç aynı; kazanç hızda."}
      - {t: "Bellek kullanımını yarıya indirir", why: "Bellek değil, çağrı sayısı azalır."}

extras:
  - {id: x1, title: "Unutma faktörü, ağır top ve Nesterov momentumu (ders alıştırması 3)", engine: browser}
  - {id: x2, title: "AdaGrad, AdaMax, Nadam ve seyrek öznitelikler", engine: browser}
  - {id: x3, title: "Öğrenme oranı takvimleri: power, üstel, parçalı, performans, 1cycle", engine: browser}

homework:
  - title: "Sutskever, Martens, Dahl, Hinton (2013): başlatma ve momentumun önemi"
    paper: "Sutskever, Martens, Dahl, Hinton — On the importance of initialization and momentum in deep learning (ICML 2013)"
    url: "https://proceedings.mlr.press/v28/sutskever13.html"
    level: orta
    hours: 8
    goal: |
      Makalenin derin otomatik kodlayıcı deneyini küçük ölçekte tekrarla (MNIST, 784-400-200-100-50-25-6 simetrik AE, sigmoid): seyrek başlatma (her birime 15 rastgele bağlantı) ile klasik momentum ve Nesterov'u, makaledeki μ takvimiyle (Denk. 5: $\mu_t=\min(1-2^{-1-\log_2(\lfloor t/250\rfloor+1)},\mu_{max})$) karşılaştır; μ_max ∈ {0.9, 0.99, 0.995} için Tablo 1'deki gibi eğitim hatasını raporla. Nesterov'un yüksek μ'da daha kararlı olduğunu x1'deki kuadratik analizle ilişkilendir.
    steps:
      - "Son 'ince ayar' aşamasında μ'yu 0.9'a düşürmenin etkisini de ölç."
    accept:
      - "Nesterov, yüksek μ_max'ta klasik momentumdan belirgin düşük hata."
      - "Rastgele (yoğun) başlatma ile seyrek başlatma farkı tabloda."
  - title: "Smith & Topin (2019): süper yakınsama ve 1cycle"
    paper: "Smith & Topin — Super-Convergence: Very Fast Training of Neural Networks Using Large Learning Rates (2019)"
    url: "https://arxiv.org/abs/1708.07120"
    level: orta
    hours: 8
    goal: |
      Öğrenme oranı aralık testini (LR range test: oranı üstel artırırken kaybı izle) uygula, bundan η₁'i seç; CIFAR-10'da küçük bir ResNet'i aynı epoch bütçesinde sabit oran, adım takvimi ve 1cycle (oran + ters momentum döngüsü 0.95 → 0.85 → 0.95) ile eğit. Makale Şekil 1'deki gibi doğruluk eğrilerini ve son doğrulukları raporla; az veri (CIFAR'ın %10'u) rejiminde farkın büyüdüğünü kontrol et.
    steps:
      - "PyTorch'ta OneCycleLR ile kendi x3 uygulamanı karşılaştır."
    accept:
      - "1cycle, aynı epoch'ta adım takviminden yüksek ya da eşit doğruluk."
      - "LR aralık testi grafiği ve seçilen η₁ gerekçesi."

labs:
  - id: l1
    lab: optim2d
    title: "Kötü koşullu vadide SGD, Momentum, Nesterov, RMSProp, Adam"
    goal: |
      İki boyutlu kuadratik $f(w)=\tfrac12 w^\top Hw$, özdeğerler 1 ve $1/\kappa$. Dik yön η'nun üst sınırını ($2/\lambda_{max}$), yatık yön hızı belirler. Momentum yatık yönde hızı birikimle artırır; RMSProp/Adam her **koordinatı** kendi gradyan büyüklüğüyle ölçekler — vadi eksenlere hizalıysa harika, döndürülmüşse avantaj azalır.
    predict:
      q: "κ = 100, açı 0°. Aynı η = 0.05 ile 150 adımda hangisi en düşük kayba iner?"
      options:
        - {t: "SGD", why: "Yatık yönde çarpan 1 − 0.05·0.01 ≈ 0.9995: neredeyse hiç ilerlemez."}
        - {t: "RMSProp ya da Adam", ok: true, why: "Eksenlere hizalı vadide koordinat başına ölçekleme eğriliği tam dengeler. Açıyı 45°'ye getirip tekrar dene."}
        - {t: "Hepsi aynı", why: "Ön koşullandırma farkı burada çok büyük."}
    presets:
      - {name: "SGD vs Momentum", params: {m: 0, lr: 0.3, kappa: 50, rot: 30, T: 120, B: {m: 1, lr: 0.3}}, note: "Aynı η. A (SGD) yatık yönde sürünür; B (momentum β = 0.9) hızlanır ama dik yönde salınır."}
      - {name: "Momentum fazla", params: {m: 1, lr: 0.3, beta: 0.99, kappa: 50, rot: 30}, note: "β → 1: sönümsüz salınım, uzun 'spiral'. Etkin adım ≈ η/(1 − β) = 30."}
      - {name: "Nesterov sönümler", params: {m: 1, lr: 0.3, beta: 0.95, kappa: 50, rot: 30, B: {m: 2}}, note: "Bakış noktasında gradyan almak salınımı erken fark eder."}
      - {name: "Eksen hizalı: Adam parlar", params: {m: 4, lr: 0.1, kappa: 100, rot: 0, B: {m: 0}}, note: "A Adam, B SGD; vadi eksenlere hizalı."}
      - {name: "Döndürülmüş: avantaj azalır", params: {m: 4, lr: 0.1, kappa: 100, rot: 45, B: {m: 1}}, note: "45°'de iki koordinat da aynı karışık eğriliği görür; köşegen ölçekleme yardım etmez."}
      - {name: "Gürültülü gradyan", params: {m: 1, lr: 0.1, noise: 1, kappa: 10, rot: 30, B: {m: 4}}, note: "Mini-batch gürültüsü minimum çevresinde bir 'gürültü topu' bırakır; sabit η ile tam yakınsama yok — η'yı azaltmak (takvim) gerekir."}
    questions:
      - q: "SGD için η'yı 2'nin hemen üstüne çıkar. Ne olur, neden 2?"
        a: "λ_max = 1 olduğundan dik yönde çarpan 1 − η > 1 olur: ıraksama. Momentumla sınır 2(1 + β)/λ_max'a genişler."
      - q: "Gürültülü preset'te tohumu değiştir. Hangi büyüklük tohumdan bağımsız?"
        a: "Son kaybın kendisi değişir ama ortalama 'gürültü topu' boyutu ≈ ησ²·(boyut)/(2λ) mertebesinde kalır: η'yı yarıya indirince taban da yarıya iner."
    limits: "Kuadratik kayıp, sabit Hessian. Gerçek ağlarda eğrilik konuma bağlı, Adam'ın genelleme davranışı ayrı bir konu (bu deney yalnız optimizasyon hızını gösterir)."
  - id: l2
    lab: ema
    title: "Üstel hareketli ortalama: momentum ve Adam'ın içindeki süzgeç"
    goal: "Momentum ve Adam'ın birinci/ikinci momentleri, gradyanların EMA'sıdır: $m_t=\\beta m_{t-1}+(1-\\beta)g_t$. β gürültü bastırma ile gecikme arasında bir ödünleşim kurar; sıfırdan başlatma ilk adımlarda yanlılık getirir, Adam bunu $1-\\beta^t$'ye bölerek düzeltir."
    predict:
      q: "β = 0.99 iken sinyal aniden sıçrıyor. EMA'nın yeni seviyeye ~%63 yaklaşması kaç adım sürer?"
      options:
        - {t: "≈ 1", why: "Bu β = 0 için geçerli."}
        - {t: "≈ 100", ok: true, why: "Zaman sabiti 1/(1 − β) = 100 adım; $1-0.99^{100}\\approx 0.63$."}
        - {t: "≈ 1000", why: "Bu β = 0.999'un zaman sabiti."}
    presets:
      - {name: "β = 0.9 (momentum)", params: {beta: 0.9}, note: "Pencere 10 adım."}
      - {name: "β = 0.999 (Adam v)", params: {beta: 0.999, T: 1000}, note: "Ham EMA ilk yüzlerce adım sıfıra yapışık; düzeltme olmadan Adam'ın ilk adımları çok büyük olurdu (v küçük → bölme büyük)."}
      - {name: "β karşılaştır", params: {beta: 0.8, B: {beta: 0.98}}, note: "A hızlı ama gürültülü, B düzgün ama gecikmeli."}
    questions:
      - q: "Gürültünün kalan std oranı neden √((1−β)/(1+β))?"
        a: "Bağımsız gürültü için $\\mathrm{Var}(m)=(1-\\beta)^2\\sum_k\\beta^{2k}\\sigma^2=\\frac{(1-\\beta)^2}{1-\\beta^2}\\sigma^2=\\frac{1-\\beta}{1+\\beta}\\sigma^2$."
    limits: "Gürültü bağımsız Gauss; gerçek gradyan gürültüsü ilişkili ve durağan değildir."
