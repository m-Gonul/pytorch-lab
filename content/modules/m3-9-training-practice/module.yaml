id: m3-9-training-practice
code: M3.9
title: Eğitim pratiği — kapasite ve aşırı uyum, model seçimi, transfer öğrenme, veri sızıntısı
phase: 3
minutes: 360
prereq: [m3-8-perceptron, m3-7-regularization-nn]
summary: >
  Derin ağ eğitmenin mühendislik tarafı. Daha geniş ve daha derin tam bağlı
  ağlar (784-300-100-10'dan 7 katmana: ders alıştırması 4) eğitim kaybını
  sıfıra indirirken doğrulama kaybının yükselmesi — aşırı uyum; erken
  durdurma ve kontrol noktası; k-katlı çapraz doğrulama ve öğrenme eğrileri.
  Önceden eğitilmiş katmanları yeniden kullanmak: alt katmanları dondurma,
  yalnız başlığı eğitme, kademeli çözme ve ince ayar; benzer görevlerde
  transferin neden işe yaradığı. Veri sızıntısı: ölçekleme istatistiğini
  testten öğrenmek, tekrarlanan/gruplu örneklerin iki tarafa düşmesi, zaman
  serisinde rastgele bölme. Saf Python'da 1-NN ile grup sızıntısı, NumPy'da
  k-katlı CV ve erken durdurma, PyTorch'ta kapasite deneyi ve transfer,
  sonda tüm katlar × kapasiteleri tek seferde eğiten toplu CV.
goals:
  - "Eğitim ve doğrulama eğrilerinin ayrışması: [[aşırı uyum]]; erken durdurma"
  - "k-katlı CV ile model seçimi; test kümesine yalnız en sonda dokunmak"
  - "[[transfer öğrenme]]: dondur → başlığı eğit → çöz → küçük öğrenme oranıyla ince ayar"
  - "[[veri sızıntısı]] türleri: ön işlemede, gruplarda, zamanda, hedefte"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 10–11", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Yosinski, Clune, Bengio, Lipson — How transferable are features in deep neural networks? (NeurIPS 2014)", url: "https://arxiv.org/abs/1411.1792", license: "arXiv", use: link}
  - {title: "Kaufman, Rosset, Perlich — Leakage in Data Mining: Formulation, Detection, and Avoidance (KDD 2011 / TKDD 2012)", url: "https://doi.org/10.1145/2382577.2382579", license: "©", use: link}
  - {title: "Prechelt — Early Stopping — But When? (Neural Networks: Tricks of the Trade 1998)", url: "https://doi.org/10.1007/3-540-49430-8_3", license: "©", use: link}
  - {title: "scikit-learn — Cross-validation: evaluating estimator performance", url: "https://scikit-learn.org/stable/modules/cross_validation.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "Ders alıştırması 4'ün modelleri (Fashion-MNIST, 784 girdi, 10 sınıf): parametre sayısı"
      fields:
        - {id: p1, label: "784-300-100-10", answer: 266610}
        - {id: p2, label: "784-400-500-300-100-10", answer: 695910}
        - {id: p3, label: "784-600-700-500-400-300-100-10", answer: 1594010}
    - title: "Transfer"
      fields:
        - {id: fz, label: "784-300-100-10'da iki gizli katman dondurulursa eğitilebilir parametre", answer: 1010}
        - {id: kf, label: "5 katlı CV, 3 aday model: eğitilen toplam model (son yeniden eğitim hariç)", answer: 15}
  verify: |
    def params(s):
        return sum(a * b + b for a, b in zip(s[:-1], s[1:]))
    answers = dict(p1=params([784, 300, 100, 10]), p2=params([784, 400, 500, 300, 100, 10]), p3=params([784, 600, 700, 500, 400, 300, 100, 10]),
                   fz=100 * 10 + 10, kf=5 * 3)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Çapraz doğrulamanın yanlış yolu: öznitelik seçimi sızıntısı", engine: browser}
  - {id: x2, title: "Öğrenme eğrileri: daha çok veri mi, daha büyük model mi?", engine: browser}
  - {id: x3, title: "Az veriyle veri artırma (1-NN)", engine: browser}

quiz:
  - q: "Ders alıştırması 4'te modeller büyüdükçe eğitim kaybı sıfıra giderken doğrulama kaybı yükseliyor. Bu nedir?"
    options:
      - {t: "Aşırı uyum (overfitting): model eğitim örneklerini ezberler, genelleme kötüleşir; kapasite arttıkça daha erken ve daha belirgin başlar", ok: true, why: "Doğrulama doğruluğu çoğu zaman benzer kalır — kayıp, aşırı güvenli yanlışları da cezalandırır."}
      - {t: "Yetersiz uyum", why: "Eğitim kaybı çok düşük."}
      - {t: "Öğrenme oranı çok küçük", why: "Eğitim kaybı düşüyor."}
  - q: "Ölçekleme (standardizasyon) istatistiklerini tüm veriden hesaplayıp sonra bölmek neden sızıntıdır?"
    options:
      - {t: "Test örneklerinin bilgisi (ortalama/varyans) eğitim sürecine girer; test skoru gerçek dağıtım koşulunu yansıtmaz", ok: true, why: "Ön işleme yalnız eğitim katında öğrenilmeli (Pipeline)."}
      - {t: "Standardizasyon modeli bozduğu için", why: "Sorun sıralama."}
      - {t: "Sızıntı değildir", why: "Küçük de olsa sızıntıdır; bazı ön işlemelerde büyük."}
  - q: "Transfer öğrenmede neden önce yalnız yeni başlık eğitilir, sonra katmanlar küçük öğrenme oranıyla çözülür?"
    options:
      - {t: "Rastgele başlatılmış başlığın büyük gradyanları önceden eğitilmiş öznitelikleri bozmasın diye; başlık oturunca ince ayar güvenlidir", ok: true, why: "Alt katmanlar genel (kenar, doku), üst katmanlar göreve özgüdür."}
      - {t: "Hesap tasarrufu için", why: "Asıl neden kararlılık."}
      - {t: "Alt katmanlar hiç eğitilemez", why: "Çözülüp ince ayar yapılabilir."}

homework:
  - title: "Yosinski ve ark. (2014): Özellikler ne kadar aktarılabilir?"
    paper: "Yosinski, Clune, Bengio, Lipson — How transferable are features in deep neural networks? (NeurIPS 2014)"
    url: "https://arxiv.org/abs/1411.1792"
    level: orta
    hours: 10
    goal: |
      Makalenin A/B bölünmesi deneyini küçük ölçekte yeniden üret: CIFAR-100'ü (ya da Fashion-MNIST'i) iki rastgele sınıf yarısına böl, iki taban ağ eğit (baseA, baseB), sonra n = 1…L katmanı kopyalayıp (i) dondurarak (AnB) ve (ii) ince ayarla (AnB+) B görevinde eğit; ayrıca BnB ve BnB+ kontrollerini yap. Doğruluk – n eğrisini makalenin Şekil 2'siyle nitel karşılaştır: "kırılgan birlikte uyum" (fragile co-adaptation) ve "özgüllük" etkilerini ayır.
    steps:
      - "d aşamasındaki transfer fonksiyonunu katman sayısı parametresiyle genelleştir."
      - "Her nokta için en az 3 tohum."
    accept:
      - "BnB orta katmanlarda düşer (birlikte uyum), BnB+ toparlanır."
      - "AnB+ taban ağdan iyi ya da eşit (transferin genelleme bonusu)."
  - title: "Kaufman ve ark. (2012): Veri madenciliğinde sızıntı"
    paper: "Kaufman, Rosset, Perlich — Leakage in Data Mining (TKDD 2012)"
    url: "https://doi.org/10.1145/2382577.2382579"
    level: başlangıç
    hours: 4
    goal: |
      Makaledeki sızıntı sınıflandırmasını (öznitelik sızıntısı, eğitim örneği sızıntısı) kullanarak bu modüldeki üç örneği (b, x1 ve ölçekleme) sınıfla; gerçek bir Kaggle yarışması sızıntısını (makalede örnekler var) özetleyip kendi küçük veri kümende yeniden canlandır. "Öğrenme-tahmin ayrımı" (learn-predict separation) ilkesini bir scikit-learn `Pipeline` + `GroupKFold`/`TimeSeriesSplit` ile uygula.
    steps:
      - "Sızıntılı ve sızıntısız skorları aynı tabloda raporla."
    accept:
      - "Her sızıntı türü için skor farkı ve düzeltilmiş protokol."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Sızıntı nereden girer?
    goal: Ön işlemedeki veri sızıntısını tanımak
    needs: Eğitim/doğrulama/test ayrımı
    q: |-
      Bir öğrenci önce **tüm** veriyi standartlaştırıp (ortalama/std), sonra eğitim/test diye bölüyor; ayrıca PCA'yı ve öznitelik seçimini de bölmeden önce yapıyor. Test skoru neden iyimser ve doğru akış ne?
    solution: |-
      **Sızıntı:** test örnekleri ortalama/std, PCA yönleri ve öznitelik seçimine katkı yaptı: model dolaylı olarak test dağılımını "gördü". Ortalama/std'de etki küçüktür; **öznitelik seçiminde** büyüktür: binlerce gürültülü öznitelikten etiketle en ilişkili olanlar tüm veride seçilirse, saf gürültüde bile test doğruluğu şansın çok üstünde çıkar.

      **Doğru akış:** önce böl; her dönüşümün parametrelerini **yalnız eğitim** kümesinde öğren (`fit`), sonra doğrulama ve teste uygula (`transform`). Çapraz doğrulamada bu her katmanın içinde tekrarlanır (scikit-learn `Pipeline`). Zaman serisinde ve gruplu veride (aynı hastanın birden çok görüntüsü) bölme de zamana/gruba göre yapılmalı.
  - id: p2
    type: hesap
    level: 1
    title: MLP'nin parametre sayısı
    goal: Tam bağlı ağın parametrelerini saymak
    needs: Doğrusal katman
    q: |-
      784-300-100-10 MLP (bias'lı). Toplam parametre?
    answer: 266610.0
    calc: "784*300+300+300*100+100+100*10+10"
    mistakes:
      - {answer: 266200.0, msg: "Bias'ları ekle: 300 + 100 + 10."}
    hints:
      - "Her katman $n_{in}n_{out}+n_{out}$."
    solution: |-
      $235\,500+30\,100+1\,010=266\,610$. İlk katman parametrelerin %88'i: girdi boyu büyük katmanlar pahalıdır (CNN'in ağırlık paylaşımı bunu çözer, M4.8).
  - id: p3
    type: hesap
    level: 1
    title: Epoch başına adım
    goal: Epoch, batch ve adım ilişkisini kurmak
    needs: Bölme, tavan
    q: |-
      60 000 örnek, batch 128, son eksik batch atılmıyor. Epoch başına adım sayısı?
    answer: 469.0
    calc: "math.ceil(60000/128)"
    mistakes:
      - {answer: 468.0, msg: "Bu drop_last=True; son eksik batch de bir adım."}
    hints:
      - "$\\lceil60000/128\\rceil$."
    solution: |-
      469 (468 tam batch + 96 örnekli son batch). 20 epoch ≈ 9380 adım; öğrenme oranı takvimleri adımla tanımlanıyorsa bu sayı lazım.
  - id: p4
    type: yorumla
    level: 2
    title: Eğitim kaybı hiç düşmüyor
    goal: Hata ayıklama sırasını uygulamak
    needs: Eğitim döngüsü
    q: |-
      Yeni bir modelin eğitim kaybı ilk epoch'tan beri ln(10) ≈ 2.30 civarında sabit (10 sınıf). İlk yapılacak kontrol hangisi?
    choices:
      - {t: "Modeli büyüt", why: "Kayıp hiç düşmüyorsa kapasite sorunu değil."}
      - {t: "Tek bir küçük batch'i aşırı ezberletmeyi dene: kayıp ~0'a inmiyorsa döngüde hata var (zero_grad, optimizer'a verilen parametreler, etiket/çıktı uyumu, öğrenme oranı)", ok: true, why: "ln(10) = rastgele tahminin kaybı; model hiçbir şey öğrenmiyor."}
      - {t: "Daha çok veri topla", why: "Aynı."}
    hints:
      - "ln(10) hangi tahminin çapraz entropisi?"
    solution: |-
      ln K, düzgün tahminin kaybıdır: model girdiyi hiç kullanmıyor. Karpathy'nin "tek batch'i ezberle" testi bunu hızla ayırır. Sık nedenler: `optimizer.step()`/`zero_grad()` eksik, optimizer başka bir modelin parametrelerini tutuyor, softmax iki kez uygulanmış (`CrossEntropyLoss` logit bekler), etiketler karışık, η çok küçük ya da çok büyük, veri normalize edilmemiş.
  - id: p5
    type: proje
    level: 3
    title: Öğrenme oranı aralık testi
    goal: η'yı sistematik seçmek
    needs: LR takvimleri (M3.4)
    q: |-
      Bir öğrenme oranı aralık testi (LR range test) tasarla: nasıl çalıştırırsın, eğrinin hangi noktasından η seçersin, ne zaman yanıltır?
    rubric:
      - "η'yı birkaç yüz adım boyunca küçükten büyüğe üstel artırıp kaybı kaydettiğimi söyledim"
      - "Kaybın en hızlı düştüğü bölgeden (ya da minimumun ~1/10'u) seçtiğimi söyledim"
      - "Kaybın patladığı noktanın üst sınırı verdiğini açıkladım"
      - "Gürültülü eğriyi yumuşatmak, testi model ilk ağırlıklarıyla tekrarlamak ve takvim/ısınma ile birlikte düşünmek gerektiğini belirttim"
    hints:
      - "x ekseni log η, y ekseni (yumuşatılmış) kayıp."
    solution: |-
      Smith (2017): η'yı 10⁻⁷'den 10'a üstel artır, her adımda kaybı kaydet (EMA ile yumuşat), kayıp minimumun ~4 katını geçince dur. Seçim: eğimin en dik olduğu η ya da minimumdaki η'nın ~1/10'u. Yanıltabilir: Adam'da ısınma etkisi, BN'li ağlarda ölçek değişmezliği, çok kısa test. Seçilen η ile kısa bir doğrulama koşusu yap.
pitfalls:
  - wrong: "Test kümesine bakarak hiperparametre seçmek sorun değil, yalnız bir kez baktım."
    right: "Her bakış testi doğrulama kümesine çevirir; raporlanan skor iyimser olur. Test kümesi en sonda bir kez kullanılır."
  - wrong: "Eğitim kaybı sıfırsa model iyidir."
    right: "Aşırı uyum olabilir; doğrulama kaybına ve eğitim–doğrulama farkına bak."
whatif:
  - q: "Aynı deneyi farklı tohumlarla tekrarlayınca sonuç ±2 puan değişiyorsa?"
    a: "Karşılaştırmalar en az 3–5 tohumla ortalama ± std ve eşleştirilmiş bootstrap ile raporlanmalı (M8.2 x3); tek koşuluk 1 puanlık 'iyileşme' gürültü olabilir."

labs:
  - id: l1
    lab: capcurve
    title: "Teşhis: öğrenme eğrisi ve kapasite eğrisi"
    goal: |
      Aynı veri üreticisinde model genişliğini (p) ve veri miktarını (n) değiştir. Eğitim ve doğrulama hatasının birbirine ve gürültü tabanına göre konumundan yanlılık mı, varyans mı olduğunu oku; öğrenme eğrisinin "daha çok veri yardım eder mi?" sorusuna verdiği cevabı gör.
    predict:
      q: "p = 4 nöronla eğitim ve doğrulama hatası ikisi de ≈ 0.2 (σ² = 0.09). Veriyi 40'tan 400'e çıkarmak ne yapar?"
      options:
        - {t: "Doğrulama hatasını gürültü tabanına indirir", why: "Model kapasitesi yetmiyor: eğitim hatası bile yüksek. Veri yanlılığı azaltmaz."}
        - {t: "Pek bir şey değiştirmez", ok: true, why: "Yüksek yanlılık: öğrenme eğrisi zaten düzleşmiş. Kapasiteyi artırmak (p ↑) gerekiyor."}
        - {t: "Aşırı uyumu artırır", why: "Daha çok veri aşırı uyumu azaltır, artırmaz."}
    presets:
      - {name: "Eksik uyum", params: {p: 4, n: 40, lam: 0.001}, note: "Eğitim ≈ doğrulama ≈ 0.2 > σ²: yüksek yanlılık. Öğrenme eğrisi sağda düz."}
      - {name: "Aşırı uyum", params: {p: 120, n: 20, lam: 1.0e-6}, note: "Eğitim ≈ 0.004, doğrulama 1'in üstünde: 20 noktaya 120 nöron, neredeyse düzenlileştirme yok."}
      - {name: "Aynı model, çok veri", params: {p: 120, n: 400, lam: 1.0e-6}, note: "400 örnekte aynı büyük model dengeli: varyans sorunu veriyle çözüldü."}
      - {name: "Aynı model, güçlü ridge", params: {p: 120, n: 20, lam: 1}, note: "Veri az ama λ büyük: aşırı uyum bastırılıyor (bedeli biraz yanlılık)."}
      - {name: "Dengeli", params: {p: 16, n: 40, lam: 0.001}, note: "Orta kapasite: eğitim hatası σ²'ye yakın, fark küçük (tohuma göre sınırda)."}
    questions:
      - q: "Kapasite eğrisinde doğrulama hatası neden p büyüdükçe önce azalıp sonra artıyor?"
        a: "Küçük p'de yanlılık baskın; p büyüdükçe yanlılık düşer ama sabit n = 40 veride varyans artar. Burada son katmanda hafif ridge olduğu için M3.8'deki keskin çift iniş tepesi görünmez; λ'yı 10⁻⁶'ya indirip n'yi küçültürsen p ≈ n civarında yükseliş belirginleşir."
    limits: "Tek boyutlu girdi, rastgele ReLU gizli katmanı sabit, yalnız çıktı katmanı (kapalı biçimde, ridge ile) eğitiliyor; 4 rastgele çekilişin ortalaması, 200 doğrulama noktası. Teşhis etiketi σ²/2 eşikli kaba bir kuraldır; sınırda tohuma göre değişir."
  - id: l2
    lab: leakage
    title: "Veri sızıntısı: rapor edilen ve gerçek doğruluk"
    goal: |
      Aynı veride iki değerlendirme protokolü: biri sızdırıyor, biri sızdırmıyor. Rapor edilen doğruluğun gerçek (yeni veride ölçülen) doğruluktan ne kadar saptığını gör.
    predict:
      q: "Etiketler tamamen rastgele, 1000 gürültü öznitelikten tüm veriye bakarak en iyi 20'si seçiliyor, sonra 5-katlı CV. CV doğruluğu ne çıkar?"
      options:
        - {t: "≈ %50", why: "Doğru protokolde öyle. Ama seçim test katlarının etiketlerini de görmüş."}
        - {t: "%80'in üstünde", ok: true, why: "Tohum 1'de %95. Seçilen öznitelikler şans eseri tüm etiketlerle (test katları dahil) ilişkili."}
        - {t: "%50'nin belirgin altında", why: "Doğru protokolde %40 gibi değerler gürültüyle görülebilir ama beklenen değer %50."}
    presets:
      - {name: "Grup sızıntısı", params: {mode: 0, G: 40, m: 6, sw: 0.1}, note: "Rastgele bölme %100, grup bölmesi ≈ %81, gerçek ≈ %76: rastgele bölme hastayı tanımayı ölçüyor."}
      - {name: "Dağınık gruplar", params: {mode: 0, sw: 1}, note: "Grup içi yayılım büyük: kardeşler artık birbirine yakın değil, sızıntı azalıyor."}
      - {name: "Grup başına tek örnek", params: {mode: 0, m: 1}, note: "Sızacak kardeş yok: iki protokol istatistiksel olarak eşdeğer."}
      - {name: "Öznitelik seçimi", params: {mode: 1, n: 40, d: 1000, k: 20}, note: "Yanlış protokol %95, doğru protokol ≈ %40–60 (şans)."}
      - {name: "Az öznitelik", params: {mode: 1, d: 100, k: 20}, note: "d küçülünce sızıntı zayıflıyor ama yine %80 civarında sahte doğruluk."}
    questions:
      - q: "Grup bölmesinin sonucu neden gerçek doğruluktan biraz farklı?"
        a: "Test kümesi yalnız ≈ 8 hastanın örneklerinden oluşuyor; kestirim gürültülü. Pratikte GroupKFold ile tüm katların ortalaması alınır. Sistematik bir yanlılık yok; rastgele bölmenin farkı ise sistematik."
    limits: "İki boyutlu yapay gruplar ve 1-NN; öznitelik seçiminde en yakın merkez sınıflandırıcı. Gerçek sızıntılar çoğu zaman daha sinsidir (yakın kopyalar, zamana bağlı öznitelikler); zaman sızıntısı bu deneyde yok."
  - id: l3
    lab: classweight
    title: "Dengesiz sınıflar: sınıf ağırlığı karar sınırını nasıl kaydırır?"
    goal: |
      Azınlık sınıfına w ağırlığı ver ve ağırlıklı çapraz entropiyle lojistik regresyon eğit. Sabit terimin ≈ log w kaydığını, karar sınırının paralel kaydığını, recall'un artıp precision ve kalibrasyonun bozulduğunu gör; çıkarımda log w'yi geri çıkarınca ne olduğuna bak.
    predict:
      q: "π = %5, ters frekans ağırlığı w = 19. Öğrenilen sabit terim yaklaşık ne kadar kayar?"
      options:
        - {t: "≈ 19", why: "Ağırlık logit'i çarpmaz; olabilirlik oranını çarpar."}
        - {t: "≈ log 19 ≈ 2.94", ok: true, why: "logit q* = logit p + log w. Ölçülen kayma ≈ 3.07."}
        - {t: "Kaymaz, yalnız eğim değişir", why: "Doğru belirlenmiş modelde eğimler değişmez; değişen sabit terimdir."}
    presets:
      - {name: "Ağırlıksız", params: {pi: 0.05, wmode: 0, corr: 0}, note: "Doğruluk %96 ama azınlık recall'u yalnız ≈ 0.32."}
      - {name: "Ters frekans", params: {pi: 0.05, wmode: 1, corr: 0}, note: "Recall 0.32 → 0.84, precision 0.69 → 0.23, dengeli doğruluk 0.66 → 0.84, ham doğruluk 0.96 → 0.85. Ortalama tahmin olasılığı 0.24 — gerçek π 0.05."}
      - {name: "Ters frekans + düzeltme", params: {pi: 0.05, wmode: 1, corr: 1}, note: "log w çıkarılınca kalibrasyon geri geliyor ama karar da ağırlıksız modele dönüyor: bu modelde ağırlık = eşik kaydırma."}
      - {name: "Ilımlı ağırlık w = 5", params: {pi: 0.05, wmode: 2, w: 5, corr: 0}, note: "Arada bir nokta: recall ≈ 0.61, precision ≈ 0.42."}
      - {name: "Çok nadir sınıf", params: {pi: 0.01, wmode: 1, corr: 0}, note: "π = %1: ağırlıksız model azınlığın %89'unu kaçırıyor; ağırlıklı model yakalıyor ama precision %5."}
    questions:
      - q: "Ağırlıklandırma ile eşiği 0.5'ten π'ye düşürmek bu deneyde neden neredeyse aynı sonucu veriyor?"
        a: "Model doğru belirlenmiş (eşit kovaryanslı Gauss → lojistik): ağırlık yalnız logit'e sabit log w ekliyor. 0.5 eşiğinde logit + log w > 0 ⇔ p > 1/(1 + w), w = (1 − π)/π için p > π."
    limits: "İki boyutlu, eşit kovaryanslı iki Gauss sınıfı; 3000 eğitim, 20 000 test örneği; Newton yöntemiyle tam çözüm (SGD değil). Ağırlıklandırmanın eşik kaydırmanın ötesindeki etkisi kapasitesi sınırlı ya da yanlış belirlenmiş modellerde ortaya çıkar."
