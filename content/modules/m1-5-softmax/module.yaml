id: m1-5-softmax
code: M1.5
title: Softmax regression ve log-sum-exp
phase: 1
minutes: 210
prereq: [m1-4-logreg]
summary: >
  Çok sınıflı sınıflandırmanın standart kafası. Üç logit'te softmax,
  cross-entropy ve gradyanı elle hesaplıyor; taşmayan log-sum-exp yazıyor;
  CS231n'in klasik vektörize softmax kaybını NumPy'da kuruyor; PyTorch'ta
  `F.cross_entropy`'yi kendin yeniden yazıyor ve en sonda softmax
  Jacobian'larını ve confusion matrix'i döngüsüz üretiyorsun.
goals:
  - "[[softmax]] ve kategorik [[cross-entropy]]'yi tanımlayıp gradyanın $p-\\text{onehot}(y)$ olduğunu türetmek"
  - "[[log-sum-exp]] hilesiyle $z=[1000,999,998]$ gibi logit'lerde taşmayan bir uygulama yazmak"
  - "Softmax kaybını ve gradyanını $(n,K)$ matrislerle tek ifadede hesaplamak"
  - "Softmax Jacobian'ını $\\text{diag}(p)-pp^\\top$ olarak batch hâlinde kurmak"
sources:
  - {title: "CS231n — Linear classification: Softmax classifier", url: "https://cs231n.github.io/linear-classify/#softmax", license: "MIT", use: adapt}
  - {title: "CS231n Assignment 1 — softmax_loss_naive / softmax_loss_vectorized", url: "https://cs231n.github.io/assignments2025/assignment1/", license: "MIT", use: adapt}
  - {title: "Dive into Deep Learning §4.1 Softmax Regression", url: "https://d2l.ai/chapter_linear-classification/softmax-regression.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "PyTorch — F.cross_entropy, torch.logsumexp", url: "https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.cross_entropy.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "Logit'ler $z=[2,1,0]$, doğru sınıf $y=0$. Tablo: $e^2\\approx7.389$, $e^1\\approx2.718$"
      fields:
        - {id: Z, label: "$\\sum_k e^{z_k}$", answer: 11.107, tol: 0.003, hint: "$7.389+2.718+1$"}
        - {id: p0, label: "$p_0$", answer: 0.665241, tol: 0.002, hint: "$7.389/11.107$"}
        - {id: p1, label: "$p_1$", answer: 0.244728, tol: 0.002, hint: "$2.718/11.107$"}
        - {id: p2, label: "$p_2$", answer: 0.090031, tol: 0.002, hint: "$1/11.107$"}
    - title: "Kayıp ve gradyan"
      fields:
        - {id: lse, label: "$\\text{LSE}(z)=\\ln\\sum_k e^{z_k}$", answer: 2.407606, tol: 0.003, hint: "$\\ln 11.107$; $\\ln 11\\approx2.398$"}
        - {id: ce, label: "$\\ell=\\text{LSE}(z)-z_y$", answer: 0.407606, tol: 0.003, hint: "$2.4076-2$"}
        - {id: g0, label: "$\\partial\\ell/\\partial z_0=p_0-1$", answer: -0.334759, tol: 0.002, hint: "doğru sınıfın logit'i yükselmek ister"}
        - {id: g2, label: "$\\partial\\ell/\\partial z_2=p_2$", answer: 0.090031, tol: 0.002, hint: "yanlış sınıflar kendi olasılıkları kadar itilir"}
    - title: "Kararlılık: $z'=[1000,999,998]$"
      fields:
        - {id: shift, label: "$\\max z'$ çıkarılınca logit'ler: ilk eleman", answer: 0, hint: "$1000-1000$; sonuç $[0,-1,-2]$"}
        - {id: pp0, label: "$p'_0$", answer: 0.665241, tol: 0.002, hint: "softmax kaydırmaya karşı değişmez: $z$ ile aynı"}
  verify: |
    import math
    z = [2, 1, 0]
    e = [math.exp(v) for v in z]; S = sum(e); p = [v / S for v in e]
    answers = dict(Z=round(S, 3), p0=round(p[0], 6), p1=round(p[1], 6), p2=round(p[2], 6),
                   lse=round(math.log(S), 6), ce=round(math.log(S) - 2, 6), g0=round(p[0] - 1, 6), g2=round(p[2], 6),
                   shift=0, pp0=round(p[0], 6))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Softmax neden logit'lere sabit eklemeye karşı değişmez ve bu neden işe yarar?"
    options:
      - {t: "$e^{z_k+c}=e^c e^{z_k}$; $e^c$ pay ve paydada sadeleşir. $c=-\\max z$ seçince en büyük üs $e^0=1$ olur, taşma olmaz", ok: true, why: "Aynı hile log-sum-exp'te: $\\text{LSE}(z)=m+\\ln\\sum e^{z_k-m}$."}
      - {t: "Softmax lineer bir fonksiyondur", why: "Lineer değil; değişmezlik yalnız toplamsal kaydırmaya karşı."}
      - {t: "Logit'ler her zaman pozitiftir", why: "Logit'ler herhangi bir gerçek sayı olabilir."}
  - q: "$K=2$ için softmax regression neye indirgenir?"
    options:
      - {t: "Logistic regression'a: $p_1=\\sigma(z_1-z_0)$", ok: true, why: "$\\frac{e^{z_1}}{e^{z_0}+e^{z_1}}=\\frac{1}{1+e^{-(z_1-z_0)}}$. İki ağırlık vektöründen yalnız farkları önemlidir; bu fazlalık parametrizasyondur."}
      - {t: "İki bağımsız logistic regression'a", why: "O one-vs-rest (M1.4); softmax olasılıkları birbirine bağlar."}
      - {t: "Linear regression'a", why: "Çıktı bir olasılık; kayıp MSE değil cross-entropy."}
  - q: "`nn.CrossEntropyLoss` hangi girdiyi bekler?"
    options:
      - {t: "Ham logit'ler (softmax uygulanmamış) ve sınıf indeksleri", ok: true, why: "İçeride `log_softmax` + NLL yapar. Önce softmax uygulayıp verirsen softmax iki kez uygulanır ve gradyanlar sönükleşir."}
      - {t: "Softmax olasılıkları ve one-hot etiketler", why: "Olasılıkları vermek yaygın bir hata; logit verilmeli."}
      - {t: "log-olasılıklar", why: "O `nn.NLLLoss`'un girdisi."}

homework:
  - title: "Guo ve ark. (2017): modern sinir ağlarının kalibrasyonu"
    paper: "Guo, Pleiss, Sun, Weinberger — On Calibration of Modern Neural Networks (ICML 2017)"
    url: "https://arxiv.org/abs/1706.04599"
    level: orta
    hours: 6
    goal: |
      Bir sınıflandırıcının (ör. M4.2'deki CNN) güvenilirlik diyagramını ve beklenen kalibrasyon hatasını (ECE, 15 kova) çiz. Makalenin sıcaklık ölçeklemesini (doğrulama kümesinde tek parametre T ile NLL'yi en küçükle) uygula ve histogram kovalama, izotonik regresyonla karşılaştır (Tablo 1). Sıcaklık ölçeklemenin doğruluğu neden hiç değiştirmediğini softmax'ın argmax değişmezliğiyle açıkla.
    steps:
      - "T'yi tek boyutlu doğrusal arama ya da LBFGS ile bul."
    accept:
      - "Sıcaklık ölçekleme ECE'yi belirgin düşürür, doğruluk sabit."
      - "Güvenilirlik diyagramları önce/sonra."

labs:
  - id: l1
    lab: softmaxT
    title: "Softmax: sıcaklık, entropi ve kayma değişmezliği"
    goal: "Softmax logitleri olasılığa çevirir: $p_i=e^{z_i/T}/\\sum_j e^{z_j/T}$. Bu deneyde logit aralığını, sınıf sayısını ve sıcaklığı değiştir; en büyük olasılık, entropi ve 'etkin sınıf sayısı' $e^H$ canlı hesaplanır."
    predict:
      q: "Tüm logitlere 50 eklersen olasılıklar ne olur?"
      options:
        - {t: "Hepsi büyür", why: "Paydaki ve paydadaki her terim aynı e^{50} ile çarpılır."}
        - {t: "Değişmez", ok: true, why: "softmax(z + c) = softmax(z)."}
        - {t: "Taşma olur, NaN çıkar", why: "Saf formülde e^{50+…} büyük ama float64'te taşmaz; uygulama zaten max'ı çıkararak hesaplar."}
    presets:
      - {name: "Logitler eşit", params: {spread: 0}, note: "Düzgün dağılım: H = ln K."}
      - {name: "Büyük aralık", params: {spread: 12}, note: "Neredeyse one-hot: çapraz entropi kaybı doğru sınıf için ≈ 0, yanlışsa ≈ 12."}
    limits: "Sabit, yapay logit dizisi."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Softmax + çapraz entropinin gradyanı
    goal: $\nabla_zL=p-e_y$'yi türetmek
    needs: Softmax Jacobian'ı
    q: |-
      $p_i=e^{z_i}/\sum_je^{z_j}$, $L=-\ln p_y$. $\partial L/\partial z_k$'yı bul.
    solution: |-
      **Yol 1 (log-sum-exp):** $L=-z_y+\ln\sum_je^{z_j}$. Türev: $\frac{\partial L}{\partial z_k}=-\mathbb 1[k=y]+\frac{e^{z_k}}{\sum_je^{z_j}}=p_k-\mathbb 1[k=y]$.

      **Yol 2 (Jacobian):** $\frac{\partial p_i}{\partial z_k}=p_i(\mathbb 1[i=k]-p_k)$. $\frac{\partial L}{\partial z_k}=-\frac1{p_y}\frac{\partial p_y}{\partial z_k}=-(\mathbb 1[y=k]-p_k)$ — aynı sonuç.

      **Yorum:** $\sum_kp_k-1=0$: gradyanın bileşenleri toplamı sıfırdır. Bu, softmax'ın kayma değişmezliğinin ($z\to z+c\mathbf 1$ hiçbir şeyi değiştirmez) gradyandaki izidir: $\mathbf 1$ yönünde öğrenecek bir şey yoktur.
  - id: p2
    type: hesap
    level: 1
    title: Kayıp
    goal: LSE ile kaybı hesaplamak
    needs: P1
    q: |-
      $z=[2,1,0]$, doğru sınıf $y=0$. $L=-\ln p_0$ kaç?
    answer: 0.40760596444438013
    calc: "math.log(math.exp(2)+math.exp(1)+1)-2"
    tol: 1e-3
    mistakes:
      - {answer: 2.40760596444438, msg: "LSE(z)'yi buldun; doğru sınıfın logit'ini (2) çıkar."}
      - {answer: 0.6652409557748219, msg: "Bu p₀; kayıp −ln p₀."}
    hints:
      - "$L=\\ln(e^2+e^1+e^0)-2$."
    solution: |-
      $e^2+e+1=11.107$, $\ln=2.4076$, $L=0.4076$; $p_0=e^{-0.4076}=0.665$.
  - id: p3
    type: hesap
    level: 1
    title: Yanlış sınıfın gradyanı
    goal: $p-e_y$'yi bileşen bileşen okumak
    needs: P1, P2
    q: |-
      Aynı örnekte $\partial L/\partial z_1$ kaç?
    answer: 0.24472847105479764
    calc: "math.exp(1)/(math.exp(2)+math.exp(1)+1)"
    tol: 1e-3
    mistakes:
      - {answer: -0.7552715289452023, msg: "−1 yalnız doğru sınıfın (y = 0) bileşeninde; z₁ yanlış sınıf."}
    hints:
      - "Yanlış sınıflar için gradyan kendi olasılığıdır."
    solution: |-
      $p_1=e/11.107=0.2447$. GD $z_1$'i olasılığı oranında düşürür.
  - id: p4
    type: hata-bul
    level: 2
    title: "e^1000"
    goal: Kayma değişmezliğini sayısal kararlılık için kullanmak
    needs: Kayan nokta aralığı
    q: |-
      `p = np.exp(z) / np.exp(z).sum()` $z=[1000, 999, 998]$ için `[nan, nan, nan]` veriyor. Düzeltme hangisi ve neden doğru?
    choices:
      - {t: "z'yi 1000'e böl", why: "Bu sıcaklığı değiştirir: başka bir dağılım hesaplarsın."}
      - {t: "z'den max(z)'yi çıkar: softmax(z − c) = softmax(z), en büyük üs 0 olur", ok: true, why: "Pay ve payda aynı e^{−c} ile çarpılır; taşma imkânsızlaşır."}
      - {t: "float32 yerine float64 kullan", why: "float64'te de e^{1000} = inf."}
    hints:
      - "$e^{709}$ float64'ün sınırına yakın."
    solution: |-
      $\frac{e^{z_i-c}}{\sum_je^{z_j-c}}=\frac{e^{-c}e^{z_i}}{e^{-c}\sum e^{z_j}}$. $c=\max z$ ile üslerin en büyüğü 0, hiçbir terim taşmaz, en az biri 1 olduğu için payda ≥ 1. Kayıp için doğrudan $\mathrm{LSE}(z)=c+\ln\sum e^{z_j-c}$ kullan (log-softmax).
  - id: p5
    type: açıkla
    level: 2
    title: İki sınıfta softmax = sigmoid
    goal: Softmax ile lojistik regresyon arasındaki bağı kurmak
    needs: M1.4
    q: |-
      İki sınıflı softmax'ın lojistik regresyona indirgendiğini göster. Bu, softmax'ın parametreleri hakkında ne söyler?
    rubric:
      - "$p_1=\\frac{e^{z_1}}{e^{z_0}+e^{z_1}}=\\sigma(z_1-z_0)$ yazdım"
      - "Yalnız logit farkının önemli olduğunu, K sınıfta K−1 serbest logit olduğunu söyledim"
      - "Bu fazlalığın (ağırlık vektörlerine aynı vektörü eklemek) tanımlanabilirlik sorunu yarattığını ve düzenlileştirmenin bunu çözdüğünü belirttim"
    hints:
      - "Payı ve paydayı $e^{z_1}$'e böl."
    solution: |-
      $p_1=\frac1{1+e^{-(z_1-z_0)}}=\sigma(z_1-z_0)$. Softmax'ta tüm $w_k$'lara aynı $v$'yi eklemek hiçbir olasılığı değiştirmez: parametreler tek değildir (K−1 bağımsız). Cezasız eğitimde bu yön boyunca kayma serbesttir; L2 cezası en küçük normlu (ortalaması sıfır) temsiliyi seçer.
  - id: p6
    type: kanıt
    level: 3
    title: Çapraz entropinin dışbükeyliği
    goal: Logit'lerde dışbükeyliği Hessian ile göstermek
    needs: P1, pozitif yarı tanımlılık
    q: |-
      $L(z)=\mathrm{LSE}(z)-z_y$'nin Hessian'ı $H=\mathrm{diag}(p)-pp^\top$'dir. $H$'nin pozitif yarı tanımlı olduğunu kanıtla ve sıfır özdeğerinin yönünü bul.
    rubric:
      - "$v^\\top Hv=\\sum_ip_iv_i^2-(\\sum_ip_iv_i)^2$ yazdım"
      - "Bunu $p$ dağılımı altında $v$'nin varyansı olarak tanıdım (≥ 0)"
      - "Sıfır özdeğer yönünün $v=\\mathbf 1$ (sabit vektör) olduğunu ve kayma değişmezliğiyle ilişkisini söyledim"
    hints:
      - "Bir rastgele değişken $V$ olasılığı $p_i$ ile $v_i$ değerini alsın."
    solution: |-
      $v^\top Hv=\sum_ip_iv_i^2-(\sum_ip_iv_i)^2=\mathbb E_p[V^2]-\mathbb E_p[V]^2=\mathrm{Var}_p(V)\ge0$. Eşitlik ancak $V$ sabitken: $v\propto\mathbf 1$. $W$'ye göre ($z=Wx$) dışbükeylik doğrusal bir dönüşümle korunur; dolayısıyla softmax regresyonu dışbükeydir (ama $\mathbf 1$ yönünde tek değildir, P5).
pitfalls:
  - wrong: "Softmax çıktısı modelin ne kadar emin olduğunu güvenilir biçimde gösterir."
    right: "Softmax olasılıkları çoğu zaman aşırı güvenlidir (özellikle dağılım dışı girdilerde); kalibrasyon için sıcaklık ölçekleme gerekir."
  - wrong: "softmax ve log'u ayrı ayrı hesapla."
    right: "log(softmax(z)) küçük olasılıklarda −∞'a yuvarlanır; doğrudan log-softmax = z − LSE(z) kullan (PyTorch: `F.cross_entropy` logit alır)."
  - wrong: "Softmax en büyük logit'in sırasını değiştirebilir."
    right: "exp tekdüze olduğu için argmax değişmez; sıcaklık yalnız 'ne kadar keskin' olduğunu değiştirir."
whatif:
  - q: "Hedefler one-hot değil de yumuşak (ör. 0.9 / 0.05 / 0.05, etiket yumuşatma) olsaydı?"
    a: "Gradyan yine $p-q$ ($q$ hedef dağılım) olur; model logit'leri sonsuza itmeye çalışmaz, aşırı güven azalır (M4.14)."
  - q: "Sınıf sayısı 50 000 (sözlük) olsaydı?"
    a: "Her adımda tüm sınıfların toplamı pahalıdır: örneklenmiş softmax, negatif örnekleme (M4.12) ya da hiyerarşik softmax kullanılır."
