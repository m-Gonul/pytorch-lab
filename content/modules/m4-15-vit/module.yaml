  - {id: x1, title: "Konum embedding'leri: interpolasyon ve 2B sin-cos", engine: browser}
  - {id: x2, title: "Konumsuz ViT = yama torbası (permütasyon eşdeğerliği)", engine: browser}
  - {id: x3, title: "Swin: pencere attention'ı ve kaydırılmış pencereler", engine: browser}

quiz:
  - q: "ViT neden ImageNet boyutunda veride ResNet'in gerisinde kalıp JFT-300M'de onu geçer?"
    options:
      - {t: "CNN'in yerellik ve kaydırma eşdeğerliği önseli ViT'te (yalnız MLP ve yama düzeyinde) yoktur; az veride bu önsel avantajdır, çok veride ViT'in esnekliği öne geçer", ok: true, why: "Makale: 'large scale training trumps inductive bias'. d aşamasında küçük ölçekte görülür."}
      - {t: "ViT'in daha az parametresi olduğu için", why: "Daha fazla ya da benzer."}
      - {t: "Attention'ın yanlış uygulanması", why: "Hayır."}
  - q: "Yama embedding'i neden bir konvolüsyonla yazılabilir?"
    options:
      - {t: "Her yamaya aynı doğrusal izdüşüm uygulanır ve yamalar örtüşmez: çekirdeği ve adımı P olan, D filtreli konvolüsyonun tanımı budur", ok: true, why: "c ve e aşamaları eşitliği gösterir."}
      - {t: "Konvolüsyon daha doğru olduğu için", why: "Aynı hesap."}
      - {t: "Yazılamaz", why: "Yazılabilir."}
  - q: "Daha yüksek çözünürlükte ince ayar yaparken ne değişir?"
    options:
      - {t: "Yama boyutu sabit kalır, yama sayısı artar; önceden eğitilmiş konum embedding'leri artık anlamlı değildir → 2B ızgara olarak interpole edilir (ViT'te görüntünün 2B yapısının elle verildiği tek yer)", ok: true, why: "Makale Bölüm 3.2."}
      - {t: "Yama boyutu büyütülür", why: "Önceden eğitilmiş embedding izdüşümü değişirdi."}
      - {t: "Hiçbir şey", why: "Dizi uzunluğu değişir."}

homework:
  - title: "Dosovitskiy ve ark. (2021): ViT'i CIFAR-10'da sıfırdan"
    paper: "Dosovitskiy ve ark. — An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale (ICLR 2021)"
    url: "https://arxiv.org/abs/2010.11929"
    level: ileri
    hours: 14
    goal: |
      d aşamasındaki ViT'i CIFAR-10'a taşı (32 × 32, P = 4, D = 192, L = 6): (1) artırmasız, (2) RandAugment + Mixup/CutMix + etiket yumuşatma ile eğit; aynı bütçeli bir ResNet-18 ile karşılaştır. Makalenin analizlerini küçük ölçekte tekrarla: öğrenilmiş konum embedding'lerinin benzerlik haritası (Şekil 7 orta), katman başına ortalama attention uzaklığı (Şekil 7 sağ, c aşamasındaki fonksiyonla), yama boyutu P ∈ {2, 4, 8} için doğruluk/hesap ödünleşimi.
    steps:
      - "Ortalama attention uzaklığı: başlar boyunca ve 100 test görüntüsü üzerinde ortala."
    accept:
      - "Artırma ViT'e CNN'den çok daha fazla yarar (endüktif yanlılık eksikliğini veri artırma telafi eder)."
      - "İlk katmanlarda bazı başlar yerel (kısa uzaklık), bazıları küresel; derinlikle uzaklık artar."
  - title: "Touvron ve ark. (2021): DeiT ve damıtma token'ı"
    paper: "Touvron ve ark. — Training data-efficient image transformers & distillation through attention (ICML 2021)"
    url: "https://arxiv.org/abs/2012.12877"
    level: orta
    hours: 10
    goal: |
      d aşamasındaki ViT'e [class] token'ının yanına bir damıtma token'ı ekle; öğretmen olarak eğitilmiş bir CNN kullanıp (d aşamasındaki ya da CIFAR'da ResNet) yumuşak (KL, sıcaklık τ) ve sert (öğretmenin argmax'ı) damıtmayı karşılaştır (makale Tablo 3). Çıkarımda iki token'ın başlarının ortalamasını kullan; iki token'ın vektörleri arasındaki kosinüs benzerliğinin katmanlar boyunca nasıl değiştiğini ölç.
    steps:
      - "Sert damıtma kaybı: ½ CE(Z_cls, y) + ½ CE(Z_dist, argmax öğretmen)."
    accept:
      - "CNN öğretmenli sert damıtma, damıtmasız DeiT'i geçer."
      - "İki token'ın benzerliği derin katmanlarda artar ama 1'e ulaşmaz."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Yama boyutu, dizi uzunluğu ve maliyet
    goal: ViT'nin hesap maliyetini yama boyutuna bağlamak
    needs: Attention maliyeti (M4.6 P4)
    q: |-
      224 × 224 görüntü. Yama boyu 16 ve 8 için token sayısını ve attention skor matrisinin boyutunu karşılaştır.
    solution: |-
      $P=16$: $(224/16)^2=196$ yama + [class] = **197** token; skor matrisi $197^2\approx38.8$k (baş başına).

      $P=8$: $28^2=784$ + 1 = 785 token; skor matrisi $\approx616$k — **16 kat**. Genel olarak token sayısı $\propto1/P^2$, attention maliyeti $\propto1/P^4$.

      **Ödünleşim:** küçük yama daha ince ayrıntı ve genelde daha yüksek doğruluk verir (ViT-B/16 vs B/32), ama maliyet hızla büyür. Swin bu yüzden attention'ı yerel pencerelerle sınırlar, yüksek çözünürlüklü görevlerde maliyeti doğrusal tutar.
  - id: p2
    type: hesap
    level: 1
    title: Token sayısı
    goal: Yamalama formülünü uygulamak
    needs: P1
    q: |-
      384 × 384 görüntü, yama 16, [class] token'ı var. Token sayısı?
    answer: 577.0
    calc: "(384//16)**2+1"
    mistakes:
      - {answer: 576.0, msg: "[class] token'ını ekle."}
    hints:
      - "$24^2+1$."
    solution: |-
      $576+1=577$. Ön eğitim 224'te yapıldıysa konum gömmeleri 14 × 14'ten 24 × 24'e 2B enterpolasyonla büyütülür (Dosovitskiy ve ark. ince ayar yöntemi).
  - id: p3
    type: hesap
    level: 1
    title: Yama gömme katmanının parametreleri
    goal: Yamalama + doğrusal izdüşümü konvolüsyon olarak saymak
    needs: M4.1 P3
    q: |-
      Yama 16, 3 kanal, $d=768$, bias'lı. Yama gömme katmanı kaç parametre?
    answer: 590592.0
    calc: "16*16*3*768+768"
    mistakes:
      - {answer: 197376.0, msg: "Yama 3 kanallı: 16·16·3 = 768 değer."}
    hints:
      - "Çekirdeği ve adımı 16 olan Conv2d(3, 768)."
    solution: |-
      $590\,592$. Yamalama + doğrusal izdüşüm, çekirdeği = adımı = P olan bir konvolüsyonla tam aynıdır.
  - id: p4
    type: yorumla
    level: 2
    title: ImageNet-1k'da ViT, ResNet'in gerisinde
    goal: Tümevarımsal yanlılık ile veri miktarı ilişkisini okumak
    needs: Endüktif yanlılık
    q: |-
      Yalnız ImageNet-1k (1.3M görüntü) ile eğitilen ViT-B, benzer boyuttaki ResNet'in gerisinde; JFT-300M'de önce eğitilince öne geçiyor. Neden?
    choices:
      - {t: "ViT'nin mimarisi hatalı", why: "Çok veride üstün; sorun veri verimliliği."}
      - {t: "CNN yerellik ve öteleme eşdeğerliği yanlılıklarını mimariyle bedava alır; ViT bunları veriden öğrenmek zorunda, bu yüzden daha çok veri ister — ama çok veride bu yanlılıklar sınırlayıcı olur", ok: true, why: "Dosovitskiy ve ark.'ın ana bulgusu."}
      - {t: "ViT'nin parametresi az", why: "Parametre sayıları karşılaştırılabilir."}
    hints:
      - "CNN hangi varsayımları mimarisine gömmüş?"
    solution: |-
      Endüktif yanlılık az veride yardımcı, çok veride kısıtlayıcıdır. DeiT güçlü veri artırma, düzenlileştirme ve CNN öğretmenden damıtmayla ViT'yi yalnız ImageNet-1k'da da rekabetçi yaptı.
  - id: p5
    type: yöntem-seç
    level: 3
    title: Sınıflandırma için [class] token'ı mı ortalama havuzlama mı?
    goal: Çıkış temsili seçimini gerekçelendirmek
    needs: P1
    q: |-
      ViT'de sınıflandırma başlığına [class] token'ının son durumu mu, tüm yama token'larının ortalaması (GAP) mı verilmeli? Avantajları ve bir uyarıyla değerlendir.
    rubric:
      - "[class] token'ının BERT'ten gelen, tüm yamalara attention ile bakan özel bir toplayıcı olduğunu söyledim"
      - "GAP'in de benzer sonuç verdiğini, ama farklı öğrenme oranı gerektirebildiğini (ViT makalesi ek deneyleri) belirttim"
      - "Kendi kendine denetimli yöntemlerde (MAE) ortalama havuzlamanın sık kullanıldığını söyledim"
      - "Seçimin ince ayar ve aktarımda tutarlı tutulması gerektiğini vurguladım"
    hints:
      - "İki yöntem de 'tüm görüntünün özeti'ni nasıl çıkarır?"
    solution: |-
      [class] token öğrenilen bir sorgu gibi tüm yamalardan bilgi toplar; GAP sabit bir ortalamadır. Dosovitskiy ve ark. ikisinin benzer sonuç verdiğini, ama GAP'in daha düşük öğrenme oranıyla çalıştığını raporladı. MAE gibi yöntemler GAP kullanır. Önemli olan ön eğitim ile ince ayarın aynı seçimi kullanması.
pitfalls:
  - wrong: "ViT görüntüyü piksel piksel işler."
    right: "16 × 16'lık yamalar tek token olur; yama içindeki uzamsal yapı ilk doğrusal izdüşümde düzleştirilir."
  - wrong: "ViT her koşulda CNN'den iyidir."
    right: "Az veride ve küçük modellerde CNN (ya da hibrit) çoğu zaman daha iyidir; ViT'nin üstünlüğü ölçekle gelir."
whatif:
  - q: "Konum gömmeleri kaldırılırsa?"
    a: "Model yama torbasına döner; ViT makalesinde bu ImageNet doğruluğunu birkaç puan düşürdü (yamalar içerikten kısmen konum ipucu taşır)."

labs:
  - id: l1
    lab: patchviz
    title: "Yamalara bölmek: dizi uzunluğu, maliyet ve yama torbası"
    goal: |
      Bir görüntüyü P × P'lik yamalara böl. Yama sayısının, dizi uzunluğunun ve yama embedding'i parametresinin P ile nasıl değiştiğini, bir katmandaki dikkat ve MLP hesabının oranını (T/4D) ölç. Konum embedding'i olmayan bir ViT'in gördüğü karıştırılmış yamaları göster.
    predict:
      q: "224 × 224 görüntüde yama boyunu 16'dan 2'ye indirirsen (D = 768) dikkat/MLP hesap oranı ne olur?"
      options:
        - {t: "Değişmez: ikisi de token sayısıyla büyür", why: "MLP T ile doğrusal, dikkat T² ile büyür."}
        - {t: "≈ 0.06'dan ≈ 4'e çıkar", ok: true, why: "T = 197 → 12 545; oran T/(4D) = 0.064 → 4.08. Dikkat baskın hâle gelir."}
        - {t: "Azalır", why: "Daha küçük yama daha çok token demektir."}
    presets:
      - {name: "ViT-B/16 (224, P = 16)", params: {H: 3, P: 3, D: 768, C: 3, shuf: 0}, note: "196 yama, 197 token, yama embedding'i 590 592 parametre; dikkat/MLP = 0.064."}
      - {name: "Piksel düzeyine yakın (P = 2)", params: {H: 3, P: 0, D: 768, C: 3, shuf: 0}, note: "12 545 token; dikkat/MLP = 4.08. Katman başına dikkat ≈ 2.4·10¹¹ çarpma-toplama."}
      - {name: "Yama torbası", params: {H: 1, P: 2, D: 768, C: 3, shuf: 1}, note: "Konumsuz bir ViT için karıştırılmış görüntü özgün görüntüyle aynıdır: yalnız yama içi düzen kalır."}
      - {name: "Büyük yama (ViT-B/32)", params: {H: 3, P: 4, D: 768, C: 3, shuf: 0}, note: "224 / 32: 49 yama, 50 token; dikkat/MLP = 0.016. Ucuz ama kaba: makalede ViT-B/32 ImageNet-21k ön eğitimiyle 81.3, B/16 84.0."}
    questions:
      - q: "Yama embedding'i neden bir konvolüsyon olarak yazılabilir?"
        a: "Her yamaya aynı E matrisi uygulanır (ağırlık paylaşımı) ve yamalar örtüşmeden ızgarayı kaplar: çekirdek boyu = adım = P olan bir Conv2d tam olarak budur."
      - q: "Konumsuz ViT bir görüntüyü nasıl hâlâ kısmen tanıyabilir?"
        a: "Her yamanın içindeki P × P'lik düzen korunur; yerel doku ve renk istatistikleri sınıf hakkında bilgi taşır. Makaledeki ablasyonda konumsuz ViT-B/16 0.614, 1-B konumlu 0.642 aldı."
    limits: "Görüntü sentetik bir sahne; hesap sayıları tek katman ve yalnız çarpma-toplama (softmax, LN, GELU hariç)."
  - id: l2
    lab: posinterp
    title: "Çözünürlük değişince konum embedding'lerini taşımak"
    goal: |
      g × g ızgarada öğrenilmiş (burada pürüzsüz bir 2-B alanla temsil edilen) konum embedding'lerini g' × g' ızgaraya bilineer, en yakın komşu ve ham sıra yöntemleriyle taşı. Görüntüdeki aynı yere karşılık gelen ideal embedding'e kosinüs benzerliğini ve seçilen bir yamanın benzerlik haritasını karşılaştır.
    predict:
      q: "14 × 14'ten 24 × 24'e taşırken yeni k. konuma eski k. embedding'i verirsen (ham sıra) ideal embedding'e ortalama kosinüs ne olur?"
      options:
        - {t: "≈ 0.98: embedding'ler zaten benzer", why: "Satır uzunluğu 14'ten 24'e değiştiği için aynı indis görüntünün başka bir yerine düşer."}
        - {t: "≈ 0.15", ok: true, why: "Ölçülen 0.147 (bilineer 0.998, en yakın 0.981): 2-B yapı tamamen bozuluyor."}
        - {t: "Tam 0", why: "Bazı konumlar tesadüfen yakın düşer."}
    presets:
      - {name: "224 → 384 (bilineer)", params: {g: 14, G: 24, method: 0, D: 64, ref: 0.3}, note: "Ortalama kosinüs 0.998, en kötü konum 0.985."}
      - {name: "En yakın komşu", params: {g: 14, G: 24, method: 1}, note: "Ortalama 0.981, en kötü 0.934: bloklu kopyalar."}
      - {name: "Ham sıra (yanlış)", params: {g: 14, G: 24, method: 2}, note: "Ortalama 0.147; benzerlik haritası parçalanıyor."}
      - {name: "Çok kaba ön eğitim ızgarası", params: {g: 4, G: 24, method: 0}, note: "4 × 4'ten 24 × 24'e: bilineer bile 0.87; az örnekten çok ayrıntı üretilemiyor."}
    questions:
      - q: "Sabit 2-B sin-cos embedding'lerinde (MAE) interpolasyon gerekir mi?"
        a: "Hayır: fonksiyon her ızgara için yeniden hesaplanabilir. Ama ızgaranın neyi temsil ettiği (görüntü kesri mi, mutlak yama indisi mi) tutarlı seçilmeli; indisle hesaplanırsa büyük ızgarada model hiç görmediği konum değerleriyle karşılaşır."
    limits: "Gerçek öğrenilmiş embedding'ler bu kadar pürüzsüz değildir; ideal karşılaştırma burada tanımlı, gerçek modelde değil. Sonuç ince ayardan sonra modelin doğruluğuyla ölçülür."
  - id: l3
    lab: swinreach
    title: "CNN, ViT ve Swin: erişim ve dikkat maliyeti"
    goal: |
      Bir çıktı yamasını L katman sonra hangi girdi yamalarının etkileyebildiğini 3 × 3 konvolüsyon, küresel öz-dikkat (ViT), kaydırılmış pencere (Swin) ve kaydırmasız pencere için hesapla. Katman başına dikkat maliyetini küresel ve pencere biçimlerinde karşılaştır.
    predict:
      q: "16 × 16 yama ızgarasında 4 × 4 pencere ve her ikinci katmanda kaydırma ile, bir çıktı tüm ızgaraya kaç katmanda ulaşır?"
      options:
        - {t: "1", why: "Bu ViT'in küresel dikkatidir."}
        - {t: "5", ok: true, why: "Ölçülen erişim 16, 64, 144, 196, 256: 5. katmanda tüm ızgara. 3 × 3 CNN aynı konumdan 9 katmanda ulaşıyor."}
        - {t: "Hiçbir zaman", why: "Bu kaydırmasız pencerede olur."}
    presets:
      - {name: "Swin, 2 katman", params: {model: 2, g: 16, M: 4, L: 2, pos: 0.4, C: 96}, note: "64 girdi (%25); tüm ızgara 5. katmanda. Dikkat maliyeti 2.2·10⁷ yerine 10⁷."}
      - {name: "CNN, 8 katman", params: {model: 0, g: 16, L: 8, pos: 0.4}, note: "Alıcı alan (2L + 1)²: 8 katmanda 225 girdi, tüm ızgara 9. katmanda."}
      - {name: "ViT", params: {model: 1, g: 16}, note: "İlk katmanda tüm 256 girdi."}
      - {name: "Kaydırmasız pencere", params: {model: 3, g: 16, M: 4, pos: 0.4}, note: "Erişim 16'da kalıyor: pencereler yalıtılmış."}
      - {name: "Swin ölçeği (32, M = 8)", params: {model: 2, g: 32, M: 8, L: 4, C: 96}, note: "4 katmanda 784 / 1024; küresel dikkat 2.4·10⁸, pencere 5·10⁷ çarpma-toplama."}
    questions:
      - q: "Swin'in kaydırılmış pencerelerinde neden maske gerekir?"
        a: "Görüntü döngüsel kaydırıldığında (torch.roll) karşı kenardaki bölgeler aynı pencereye düşer; orijinal görüntüde komşu olmadıkları için birbirlerine bakmamaları gerekir. Maske bu çiftleri −∞ yapar ve pencere sayısını artırmadan doğru sonucu verir (ek x3)."
      - q: "Büyük erişim tek başına iyi bir model demek midir?"
        a: "Hayır. Erişim yalnız hangi girdinin etkileyebileceğini söyler; CNN'in yerellik varsayımı az veride daha iyi genelleme sağlar. ViT küresel erişimi kullanmayı veriden öğrenmek zorundadır."
    limits: "Erişim ikili (etkiler / etkilemez); etkinin büyüklüğü, öğrenilmiş dikkatin gerçekte ne kadar yerel olduğu (ortalama dikkat uzaklığı) burada yok. Swin'de yama birleştirme (hiyerarşi) modellenmiyor."
