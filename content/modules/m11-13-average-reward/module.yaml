- id: x1
  title: '10.9: gerçek n-adım diferansiyel SARSA ve gain izi'
  engine: browser
- id: x2
  title: '10.4: tablosal Differential Q-learning, azalan adım'
  engine: browser
quiz:
- q: Diferansiyel değer fonksiyonuna bütün durumlarda aynı sabit eklenirse ne olur?
  options:
  - t: Gain ve TD farkı aynı kalır.
    ok: true
    why: Sonraki ve mevcut değerdeki sabitler iptal olur.
  - t: Her ödüle bu sabit eklenir.
    why: Ödül ortam verisidir; yalnız değer normalizasyonu değişti.
- q: Sabit adımlı son Rbar neyi ölçer?
  options:
  - t: Uzun dönem ödül için dalgalanan bir TD kestirimini.
    ok: true
    why: Gerçek toplam ödül / adım ile özdeş değildir.
  - t: Öğrenme sırasında ödüllerin tam örnek ortalamasını.
    why: Bu ayrı toplanmalıdır.
homework:
- title: Erişim kontrolünde zamanlama ve n-adım karşılaştırması
  paper: Sutton–Barto, Örnek10.2 ve Alıştırma10.9
  url: http://incompleteideas.net/book/the-book-2nd.html
  level: ileri
  hours: 8
  goal: Her iki boşalma sırası için n1/2/4/8, en az10 tohum ve her koşu2m gerçek geçişle diferansiyel SARSA
    karşılaştır. Öğrenen p bilmesin; son politikayı oracle ile ayrı değerlendir.
  steps:
  - α,β ve iz tanımını sonuçlara bakmadan seç; n ölçeğini kaydet.
  - Rbar, gerçek ortalama, son blok ve dondurulmuş politika gain ölç; ziyaretleri sakla.
  - Aynı normalizasyonla Q ve Poisson değerlerini karşılaştır; az görülen durumları işaretle.
  accept:
  - Tüm fiziksel adımlar sayılmış; eksik koşular gizlenmemiş.
  - Tohumlar arası SE ve her modelin kesin gain referansı raporlanmış.
  - Sonlu sabit-adım deneyinden genel yakınsama teoremi çıkarılmamış.
