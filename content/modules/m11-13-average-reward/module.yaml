practice:
- id: p1
  type: kod
  level: 2
  title: 10.4 — Diferansiyel Q-learning
  goal: 10.4 — Diferansiyel Q-learning
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: 'Sürekli görev için diferansiyel yarı-gradyan Q-learning sözde-kodu yazın. Davranış eylemini, hedefteki
    maksimumu, ortalama ödül kestirimini ve parametre güncellemesini belirtin. (Kaynak: Sutton–Barto, s.250,
    Alıştırma 10.4.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: 'Qθ ve ρbar başlatın, bir S alın. Her adımda bütün izinli eylemleri yeterince ziyaret eden davranıştan
    A seçin; R,S′ gözleyin. Eski değerlerle δ=R−ρbar+max_b Qθ(S′,b)−Qθ(S,A) hesaplayın. ρbar←ρbar+βδ, θ←θ+αδ∇Qθ(S,A),
    S←S′. Hedef eyleminin gradyanı alınmaz; terminal veya bölüm sıfırlaması yoktur. Bu biçimsel uzantı için
    genel fonksiyon yaklaşımı yakınsama iddiası yoktur. x2, Wan–Naik–Sutton (2021) tablosal Differential Q-learning
    biçimini uygular: tüm güncellemelerde ρbar←ρbar+ηα_t(s,a)δ ve Q(s,a)←Q(s,a)+α_t(s,a)δ. Bu iki adımın bağıntısı,
    ziyaret ve azalan adım koşulları teoremin parçasıdır; yalnız açgözlü eylemde gain güncelleyen başka R-learning
    varyantıyla karıştırılmaz.'
  rubric:
  - Davranış ile max hedefi ayrılır.
  - Aynı eski δ iki güncellemede kullanılır.
  - Hedef türevi alınmaz, γ ve terminal yoktur.
  - Genel FA için koşulsuz yakınsama ileri sürülmez.
- id: p2
  type: açıkla
  level: 1
  title: 10.5 — Diferansiyel TD(0) tam algoritması
  goal: 10.5 — Diferansiyel TD(0) tam algoritması
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: 'Diferansiyel TD(0) için δ=R−ρbar+vθ(S′)−vθ(S) dışında hangi denklemler gerekir? (Kaynak: Sutton–Barto,
    s.250, Alıştırma 10.5.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: Sabit π altında A∼π(·|S) ile geçiş toplanır; başlangıç θ,ρbar ve S belirlenir. Her geçişte eski
    değerlerden δ alınır; ρbar←ρbar+βδ ve θ←θ+αδ∇vθ(S), ardından S←S′. Tablosal sürümde yalnız v(S) değişir.
    Model tabanlı tanımlama için ayrıca ρ=µᵀr, µᵀP=µᵀ ve h=r−ρ1+Ph gerekir; h bir referansa veya µᵀh=0 koşuluna
    bağlanır. Sabit π için uygun SA/rank/Markov koşulları ayrıca gereklidir; bu satırlar her doğrusal olmayan
    tahminciye yakınsama kanıtı olmaz.
  rubric:
  - Gain ve değer güncellemeleri yazılır.
  - Sabit politika ve durum ilerlemesi belirtilir.
  - Diferansiyel değer normalizasyonu açıklanır.
- id: p3
  type: hesap
  level: 1
  title: 10.6 — Üç durumlu halka
  goal: 10.6 — Üç durumlu halka
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: 'A→B→C→A deterministik döngüsünde yalnız A durumuna varış +1, diğer geçişler 0 ödül verir. Diferansiyel
    değerleri bulun. µᵀh=0 normalizasyonunu kullanın; sayısal alana h(A) girin. (Kaynak: Sutton–Barto, s.251,
    Alıştırma 10.6.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: 'ρ=1/3. Poisson denklemleri hA=−1/3+hB, hB=−1/3+hC, hC=2/3+hA; çözüm (c,c+1/3,c+2/3). Durağan dağılım
    (1/3,1/3,1/3) ile sıfır ortalama c=−1/3 verir: h=(−1/3,0,+1/3). Halka periyodiktir; sıradan sonsuz merkezli
    toplamın limiti varmış gibi işlem yapılamaz. Burada Poisson/Abel bias seçilmiştir; hA=0 referansı da (0,1/3,2/3)
    verir ve aynı politikayı temsil eder.'
  answer: -0.3333333333333333
  calc: -1/3
  tol: 1.0e-07
  mistakes:
  - answer: 0
    msg: Bu A referansını seçer; soru µ-ortalaması0 koşulunu ister.
- id: p4
  type: kanıt
  level: 2
  title: 10.7 — Önce ufuk, sonra indirim limiti
  goal: 10.7 — Önce ufuk, sonra indirim limiti
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: 'Ödüller sonsuza kadar +1,0,+1,0… biçiminde dönüşümlüdür. A durumunda ilk ödül +1, B durumunda ilk ödül
    0. Ortalama ödülü ve h(s)=lim_{γ↑1} lim_{H→∞}Σ_{t=0}^{H−1}γ^t(E[R_{t+1}|s]−ρ) değerlerini bulun. (Kaynak:
    Sutton–Barto, s.252, Alıştırma 10.7; Denklem 10.13.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: 'ρ=1/2. Sabit 0≤γ<1 için A toplamı (1/2)(1−γ+γ²−…)=1/[2(1+γ)], B bunun negatifidir. Önce sonsuz
    geometrik toplam alınır, sonra γ↑1: hA=+1/4, hB=−1/4. Sonlu H toplamında önce γ=1 koymak pariteye göre
    salınır ve bu limiti vermez. Sabit eklemek Bellman denklemini korur; Abel tanımı bu simetrik normalizasyonu
    seçer.'
  rubric:
  - ρ=1/2 bulunur.
  - Geometrik toplam sabit γ<1 koşuluyla yazılır.
  - hA=1/4 ve hB=−1/4 elde edilir.
  - Limit sırasının değiştirilemeyeceği belirtilir.
- id: p5
  type: yorumla
  level: 2
  title: 10.8 — Ödül hatası mı, TD hatası mı?
  goal: 10.8 — Ödül hatası mı, TD hatası mı?
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: 'Alıştırma 10.6 halkasında ρbar zaten 1/3. ρbar güncellemesinde R−ρbar kullanılmasıyla δ=R−ρbar+h(S′)−h(S)
    kullanılmasını karşılaştırın. Hangisi daha kararlı olabilir ve hangi koşulla? (Kaynak: Sutton–Barto, s.252–253,
    Alıştırma 10.8.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: 'Başlangıç A için yalnız ödül hataları (−1/3,−1/3,+2/3) olarak tekrarlanır. Doğru h=(−1/3,0,+1/3)
    ile üç TD hatası da0: örneğin A→B için −1/3+0−(−1/3)=0. Böylece gain kestirimi sabit kalır, ödül-only güncellemesi
    çevrim boyunca dalgalanır. Bu karşılaştırma doğru diferansiyel değeri kullanır. Kötü öğrenilmiş Q/h, TD
    gürültüsünü büyütebilir; genel varyans azalması teoremi yoktur. Sabit h ve durağan π altında E[h(S′)−h(S)]=0,
    dolayısıyla iki hatanın ortalaması aynıdır. Öğrenen rastgele ağırlıklar Markov durumuyla ilişkiliyse bu
    eşitliği koşulsuz sabit-h kanıtı gibi kullanamayız.'
  choices:
  - t: Doğru diferansiyel h ile δ bu halkada0; kötü h için üstünlük garantisi yok.
    ok: true
    why: Geçişteki öngörülebilir merkezli ödülü h farkı tam iptal eder.
  - t: TD hatası her yaklaşık h için daha az varyanslıdır.
    why: Yanlış h kendi değişkenliğini ekleyebilir.
- id: p6
  type: kanıt
  level: 3
  title: 10.9 — n-adımda başlangıç etkisini kaldırmak
  goal: 10.9 — n-adımda başlangıç etkisini kaldırmak
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: 'Küçük β ile ρbar başlangıcının etkisi uzun sürer; örnek ortalaması ise sonradan değişime yavaş yanıt
    verir. Bölüm2 sabit-adım iz hilesini diferansiyel n-adım SARSA kutusuna uyarlayın. (Kaynak: Sutton–Barto,
    s.255, Alıştırma 10.9.)'
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: 'Aynı güncel ρbar ile δ=Σ_{i=1}^n R_i−nρbar+qboot−qold. Ortalama hedefi Y=(ΣR+qboot−qold)/n olduğundan
    δ=n(Y−ρbar). o0=0, o_k=o_{k−1}+β(1−o_{k−1}), ρbar_k=ρbar_{k−1}+(β/o_k)(δ_k/n). Q güncellemesi αδ∇q olarak
    kalır. o1=β olduğu için ilk gain adımı doğrudan Y1 olur, başlangıç katsayısı0. Genel olarak o_k=1−(1−β)^k;
    gain, Y_i hedeflerinin β(1−β)^{k−i}/o_k ağırlıklı ortalamasıdır. Ham kutudaki βδ katsayısını aynen sürdürmek
    isterseniz iz adımı nβ olmalıdır: o←o+nβ(1−o), ρbar←ρbar+(β/o)δ; dışbükey ortalama için 0<nβ≤1. Naif β/o·δ,
    n>1 için ilk gain değerinde (1−n)ρbar0 bırakır: n2,ρbar0=10,ΣR2,q farkı0 için −8; doğru sonuç1. Bu, verilen
    hedef dizisine göre başlangıç katsayısını kaldırır; adaptif Q/politika altında gerçek ρ için yansızlık
    ve ilk Q adımının başlangıçtan bağımsızlığı anlamına gelmez. x1 gerçek sürekli n-adım döngüsünü uygular.'
  rubric:
  - δ içindeki nρbar fark edilir.
  - Gain için δ/n ve Q için ham δ ayrılır.
  - İz ve ilk güncelleme hesabı verilir.
  - Yansız gerçek gain iddiasının sınırı belirtilir.
