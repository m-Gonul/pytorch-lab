  groups:
  - title: A→B→C→A; yalnız A varışı +1
    fields:
    - id: rho3
      label: Ortalama ödül ρ
      answer: 0.3333333333333333
    - id: ha
      label: µᵀh=0 için h(A)
      answer: -0.3333333333333333
    - id: hc
      label: µᵀh=0 için h(C)
      answer: 0.3333333333333333
  - title: A ilk1, B ilk0; ödüller dönüşümlü
    fields:
    - id: rho2
      label: Ortalama ödül
      answer: 0.5
    - id: abel
      label: Abel limiti h(A)
      answer: 0.25
  - title: n2, β0.1, Rbar0=10, ödül toplamı2, Q farkı0
    fields:
    - id: delta
      label: Ham δ
      answer: -18
    - id: bad
      label: İlk naif iz sonrası Rbar
      answer: -8
