  title: Öğrenen mi, doğrulama modeli mi?
  goal: Öğrenen mi, doğrulama modeli mi?
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: Ajan p değerini bilmiyor. Son tablosundan oluşturulan ε-politikayı bilinen geçiş matrisiyle değerlendirdik.
    Bu sayı neyi ölçer? (Kendi öğretim sorumuz.)
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: Tablo o anda dondurulup aynı ε davranışı sonsuza kadar sürdürülse, açıkça seçilen model altındaki
    politika gain değeridir. Öğrenme sırasında toplanmış gerçek ortalama değildir; son Rbar da değildir. Oracle
    yalnız doğrulama için kullanılır, öğrenene verilmez.
  choices:
  - t: Dondurulmuş son politikanın model altındaki uzun dönem ödülü.
    ok: true
    why: Poisson/durağan model hesabı bu sabit politikayı değerlendirir.
  - t: Öğrenme boyunca alınan ödüllerin tam örnek ortalaması.
    why: Bu, ödül toplamı / gerçek adım sayısıyla ölçülür.
- id: p9
  type: karşı-örnek
  level: 2
  title: Ergodiklik ham toplamı kurtarır mı?
  goal: Ergodiklik ham toplamı kurtarır mı?
  needs: Diferansiyel Bellman denklemi ve yarı-gradyan güncelleme
  q: Tek durumlu, ödülü bağımsız ve eşit olasılıklı ±1 olan süreçte ρ=0. Ham Σ(R−ρ) neredeyse kesin yakınsar
    mı? Beklenen-kısmi-toplam bias değeri nedir? (Kendi öğretim sorumuz.)
  hints:
  - Önce hangi niceliğin sabite kadar tanımlandığını ve hedefin hangi politikanın eylemini kullandığını ayırın.
  solution: Hayır. Yakınsayan bir serinin artışları0 değerine gitmelidir; burada her artışın mutlak değeri1.
    Bu nedenle ham toplam hiçbir örnek yolda yakınsayamaz. Süreç tek durumlu ve aperiodiktir; durum ergodikliği
    bu sorunu çözmez. Her sonlu ufuktaki beklenen toplam0, dolayısıyla beklenen-kısmi-toplam bias0; Poisson/Abel
    tanımı da0 verir. E[sonsuz toplam] yazıp limit ile beklentiyi gerekçesiz değiştirmeyin.
  rubric:
  - Seri artışlarının0 gereği kullanılır.
  - Ham rastgele toplam ile beklenen kısmi toplam ayrılır.
  - Bias0 ve normalizasyon belirtilir.
pitfalls:
- wrong: Ergodik zincirde Σ(R−ρ) bir rastgele değişken olarak mutlaka yakınsar.
  right: Tek durumlu bağımsız ±1 örneğinde bile yakınsamaz. Beklenen-kısmi-toplam bias/Poisson veya açık Abel
    tanımı gerekir.
- wrong: Durağan dağılım varsa sabit başlangıçtan dağılım limiti de vardır.
  right: Periyodik halkada durağan dağılım vardır ama tek-zaman dağılımı salınır; Cesàro ortalaması ayrıdır.
- wrong: Kaynak bütün indirimli fonksiyon yaklaşımı kontrolünü olanaksız kanıtlar.
  right: Kanıt her politikanın kendi durağan dağılımıyla ağırlıklanan J amaç fonksiyonu içindir. Sabit başlangıç
    amacı farklıdır.
- wrong: β/o izini ham n-adım δ ile kullanmak başlangıcı hemen siler.
  right: δ içinde nRbar vardır; ortalama hedefi için δ/n ya da nβ ile kurulan iz gerekir.
- wrong: Hiç görülmeyen durumda Q0 gerçek değeri gösterir.
  right: Başlangıç değeri ve seyrek ziyaret politikada sahte eşitlikler yaratabilir; ziyaret sayısını inceleyin.
whatif:
- q: Bütün h değerlerine7 eklersek?
  a: TD hatası ve politika değişmez; sayısal raporda seçilen referans belirtilir.
- q: γ0 seçilince durağan amaç myopik olur mu?
  a: J=µπᵀr hâlâ politikanın uzun dönem ziyaretlerini içerir; µπ politika değişince değişir.
- q: Sunucu boşalmasını kabulden önce sayarsak?
  a: Geçiş çekirdeği ve optimal gain değişir. Buradaki iki açık sıra için kısıtsız optimum2.74764195 ve2.67319221;
    bunlar kendi modellerimizin sonuçlarıdır.
