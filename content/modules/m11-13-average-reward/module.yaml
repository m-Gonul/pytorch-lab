id: m11-13-average-reward
code: M11.13
title: 'Sürekli görevler: ortalama ödül ve diferansiyel kontrol'
phase: 11
minutes: 480
prereq:
- m11-1-markov
- m11-2-mdp-vi
- m11-6-dqn
summary: 'Doğal bitişi olmayan görevlerde adım başı ödülü optimize et: durağan dağılım, gain, diferansiyel
  değer ve Poisson denklemi. Periyodik halka/Abel limiti, yarı-gradyan SARSA, 10 sunuculu erişim kontrolü,
  indirimli amacın kapsamı ve n-adım başlangıç izi. Saf Python geçiş/öğrenme → NumPy tam model → PyTorch stop-gradient
  → bağımsız ajanları vektörleştirme; altı kaynak sorusu çözümlü.'
goals:
- '[[ortalama ödül]] ρ ile [[diferansiyel değer]] h kavramlarını ayırmak'
- '[[poisson denklemi]] h=r−ρ1+Ph ve normalizasyon koşulunu çözmek'
- Cesàro ortalaması, tek-zaman limiti ve Abel bias farkını açıklamak
- Diferansiyel SARSA/Q-learning hedeflerini ve koşullarını yazmak
- Erişim kontrolünde son Rbar, gerçek ortalama ve sabit politika gain değerini ayrı ölçmek
- n-adım gain izinde δ/n ölçeğini ve başlangıç katsayısını türetmek
sources:
- title: Sutton & Barto — Reinforcement Learning, 2e, Bölüm10 (s.243–256)
  url: http://incompleteideas.net/book/the-book-2nd.html
  license: CC BY-NC-ND 2.0
  use: link
- title: Wan, Naik, Sutton (2021) — Learning and Planning in Average-Reward Markov Decision Processes (yalnız
    tablosal Q doğrulaması)
  url: https://proceedings.mlr.press/v139/wan21a.html
  license: Lisans doğrulanmadı
  use: link
