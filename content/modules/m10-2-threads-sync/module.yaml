id: m10-2-threads-sync
code: M10.2
title: Thread'ler ve eşzamanlama — yarışlar, atomikler, kilitler, koşul değişkenleri
phase: 10
minutes: 420
prereq: [m10-1-parallel-models]
summary: >
  Süreçten (fork, ayrı adres uzayı) thread'e (yalnız yığını ayrı, belleği
  paylaşan hafif yürütme birimi); POSIX thread'lerinden C++11 `std::thread`'e:
  oluşturma, argüman geçirme (değerle/`std::ref`), `join`/`detach`, ömür.
  Paylaşılan veri: veri yarışı (data race, C/C++'ta tanımsız davranış) ve
  yarış koşulu (race condition), banka hesabı örneği, oku–değiştir–yaz
  atomikliği, `std::atomic`, `std::mutex`/`lock_guard`, koşul değişkenleriyle
  sınırlı tampon, kilitlenme (deadlock) ve kilit sıralaması, sahte paylaşım
  (false sharing). Saf Python'da tüm iç içe geçmeleri (interleaving) gezen bir
  doğrulayıcı, NumPy'da yarış olasılığı, C++'ta atomik/mutex/özel histogram,
  sahte paylaşım ve üretici–tüketici, sonda kendi thread havuzumuz ve görev
  ayrıntı düzeyi.
goals:
  - "[[veri yarışı]]: en az biri yazma olan eşzamanlı, eşzamanlanmamış erişim; [[yarış koşulu]]: sonuç zamanlamaya bağlı"
  - "Atomik oku–değiştir–yaz (`fetch_add`) vs mutex vs thread'e özel kopya + birleştirme"
  - "Koşul değişkeni ile bekleme (`wait(lock, pred)`), sahte uyanmalar"
  - "Kilitlenmenin dört koşulu ve kilit sıralaması; sahte paylaşım ve önbellek satırı hizalama"
sources:
  - {title: "Barlas — Multicore and GPU Programming (2. baskı), Bölüm 3: Threads and concurrency in standard C++", url: "https://www.elsevier.com/books/multicore-and-gpu-programming/barlas/978-0-12-814120-5", license: "©", use: link}
  - {title: "Williams — C++ Concurrency in Action (2. baskı)", url: "https://www.manning.com/books/c-plus-plus-concurrency-in-action-second-edition", license: "©", use: link}
  - {title: "cppreference — Concurrency support library", url: "https://en.cppreference.com/w/cpp/thread", license: "CC BY-SA 3.0", use: link}
  - {title: "Boehm — Threads Cannot Be Implemented as a Library (PLDI 2005)", url: "https://doi.org/10.1145/1065010.1065042", license: "©", use: link}
  - {title: "Peterson — Myths About the Mutual Exclusion Problem (IPL 1981)", url: "https://doi.org/10.1016/0020-0190(81)90106-X", license: "©", use: link}
  - {title: "Coffman, Elphick, Shoshani — System Deadlocks (ACM Computing Surveys 1971)", url: "https://doi.org/10.1145/356586.356588", license: "©", use: link}

hand:
  groups:
    - title: "İki thread, her biri x = x + 1'i iki adımda yapar: LOAD, STORE(+1); x = 0"
      fields:
        - {id: il, label: "Olası iç içe geçme (interleaving) sayısı", answer: 6}
        - {id: lost, label: "Bunlardan kaç tanesi x = 1 bırakır (kayıp güncelleme)?", answer: 4}
    - title: "Banka: bakiye 10 000, eşzamanlı 1000 ve 500 yatırma (oku → topla → yaz)"
      fields:
        - {id: bank, label: "Olası farklı son bakiye sayısı", answer: 3}
    - title: "Diğer"
      fields:
        - {id: phil, label: "5 filozof, 5 çatal: aynı anda en çok kaç kişi yiyebilir?", answer: 2}
        - {id: cl, label: "64 baytlık önbellek satırına sığan int64 sayaç", answer: 8}
        - {id: merge, label: "4 thread'e özel 256 kutulu histogramın birleştirilmesi: toplama sayısı", answer: 1024}
  verify: |
    from math import comb
    answers = dict(il=comb(4, 2), lost=comb(4, 2) - 2, bank=len({11500, 11000, 10500}), phil=5 // 2, cl=64 // 8, merge=4 * 256)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Yemek yiyen filozoflar: kilitlenme ve kaynak sıralaması", engine: browser}
  - {id: x2, title: "Peterson algoritması: karşılıklı dışlamanın kanıtı (durum uzayı)", engine: browser}
  - {id: x3, title: "Okuyucu–yazıcı kilidi ve yazıcı açlığı", engine: browser}
  - {id: x4, title: "Semaforlarla sınırlı tampon ve zehirli hapla sonlandırma (monitörler)", engine: browser}
  - {id: x5, title: "CAS ile kilitsiz yığın ve ABA sorunu (LL/SC, livelock)", engine: browser}

quiz:
  - q: "Veri yarışı ile yarış koşulu arasındaki fark nedir?"
    options:
      - {t: "Veri yarışı: aynı bellek konumuna eşzamanlanmamış eşzamanlı erişim (en az biri yazma) — C++'ta tanımsız davranış. Yarış koşulu: doğruluğun zamanlamaya bağlı olması; atomik işlemlerle de (veri yarışı olmadan) oluşabilir", ok: true, why: "Banka örneğinde ayrı atomik oku ve yaz → veri yarışı yok ama yarış koşulu var."}
      - {t: "Aynı şeyler", why: "Ayrı kavramlar."}
      - {t: "Yarış koşulu yalnız GPU'da olur", why: "Her paylaşımlı bellek sisteminde."}
  - q: "Koşul değişkeninde `wait` neden bir döngü (ya da yüklem) içinde çağrılır?"
    options:
      - {t: "Sahte uyanmalar ve uyandıktan sonra kilidi yeniden alana kadar başka bir thread'in koşulu değiştirmesi mümkündür; koşul yeniden kontrol edilmelidir", ok: true, why: "`cv.wait(lock, pred)` bunu yapar."}
      - {t: "Performans için", why: "Doğruluk için."}
      - {t: "Gerekmez", why: "Gerekir."}
  - q: "Her thread kendi sayacını artırıyor ama sayaçlar bitişik bir dizide; neden yavaş?"
    options:
      - {t: "Sayaçlar aynı önbellek satırında: bir çekirdeğin yazması diğer çekirdeklerdeki kopyayı geçersiz kılar, satır çekirdekler arasında gidip gelir (sahte paylaşım)", ok: true, why: "`alignas(64)` ile her sayaç kendi satırına."}
      - {t: "Atomik işlemler yavaştır", why: "Dolgulu sürümde de atomik, ama hızlı."}
      - {t: "Yarış koşulu", why: "Her thread kendi sayacına yazar."}

homework:
  - title: "Boehm (2005): Thread'ler kütüphane olarak gerçeklenemez"
    paper: "Boehm — Threads Cannot Be Implemented as a Library (PLDI 2005)"
    url: "https://doi.org/10.1145/1065010.1065042"
    level: orta
    hours: 6
    goal: |
      Makalenin üç örneğini (eşzamanlı değişken değiştirme, bitişik bit alanlarının yeniden yazılması, kayıt yükseltme/register promotion) C++'ta yeniden üret: `-O0` ve `-O3` ile derle, x86-64 assembly'sini (`objdump -d` ya da godbolt) incele, hatalı davranışı gösteren bir test yaz. Sonra `std::atomic` ve C++11 bellek modeliyle düzelt ve neden düzeldiğini bellek sırası (memory order) kavramlarıyla açıkla.
    steps:
      - "d aşamasındaki `racy` modunun neden tanımlı ama yanlış olduğunu tartış."
      - "Bit alanı örneğinde iki thread'in komşu alanlara yazmasını test et."
    accept:
      - "Her örnek için hatalı çıktı veren bir çalıştırma (ya da derleyici dönüşümünü gösteren assembly)."
      - "Düzeltilmiş sürümler 10⁶ denemede doğru."
  - title: "Peterson (1981) ve donanım bellek modeli"
    paper: "Peterson — Myths About the Mutual Exclusion Problem (IPL 1981)"
    url: "https://doi.org/10.1016/0020-0190(81)90106-X"
    level: ileri
    hours: 8
    goal: |
      x2'de durum uzayında kanıtladığın Peterson algoritmasını C++'ta (a) düz `int` değişkenlerle, (b) `std::atomic` + `memory_order_relaxed` ile, (c) `memory_order_seq_cst` ile yaz. Kritik bölgede ortak bir sayacı artırıp 10⁷ girişte ihlal say. x86'nın TSO modelinde (a)/(b)'nin neden bozulduğunu (store buffer) açıkla ve `std::atomic_thread_fence` ile düzelt.
    steps:
      - "İki thread farklı çekirdeklere sabitlenmeli (`pthread_setaffinity_np`)."
    accept:
      - "(a) ve (b)'de ihlal gözlenir, (c)'de gözlenmez."

labs:
  - id: l1
    lab: interleave
    title: "Kayıp güncellemeler: veri yarışı ve yarış koşulu"
    goal: |
      T thread paylaşılan bir sayacı n kez artırıyor. Korumasız oku–artır–yaz, "atomik oku + atomik yaz" ve bölünmez fetch_add sürümlerini rastgele bir önalımlı zamanlayıcıyla 1000 kez çalıştır; sonuç dağılımını, kayıp güncellemeleri ve önalım olasılığının etkisini ölç. 2 thread × 1 artırım için bütün iç içe geçmeler tam sayılır.
    predict:
      q: "Okuma ve yazma ayrı ayrı atomik yapılırsa (arada yerel artırma) kayıp güncellemeler ne olur?"
      options:
        - {t: "Kaybolur; artık veri yarışı yok", why: "Veri yarışı gerçekten yok, ama oku ile yaz arasında başka bir thread yazabilir."}
        - {t: "Korumasız sürümle aynı dağılımda sürer", ok: true, why: "Yarış koşulu bölünmez olmayan oku–değiştir–yaz bütününden gelir: ortalama kayıp yine 30."}
        - {t: "Azalır ama sıfırlanmaz", why: "Zamanlama aynı kaldıkça atomik tek tek erişimler sonucu değiştirmez."}
    presets:
      - {name: "Korumasız, 2 × 50", params: {mode: 0, T: 2, n: 50, q: 0.05}, note: "Doğru oranı 0.044, ortalama kayıp 30."}
      - {name: "Atomik oku + yaz", params: {mode: 1, T: 2, n: 50, q: 0.05}, note: "Aynı: yarış koşulu sürüyor."}
      - {name: "fetch_add", params: {mode: 2, T: 2, n: 50, q: 0.05}, note: "Her çalıştırmada 100."}
      - {name: "Seyrek önalım", params: {mode: 0, T: 2, n: 50, q: 0.001}, note: "%96 doğru: hata nadir, test onu kaçırır."}
      - {name: "Sık önalım", params: {mode: 0, T: 2, n: 50, q: 0.9}, note: "Hiç doğru yok, ortalama kayıp 42."}
      - {name: "8 thread", params: {mode: 0, T: 8, n: 50, q: 0.05}, note: "400 yerine ortalama 114."}
      - {name: "Tek artırım", params: {mode: 0, T: 2, n: 1, q: 0.05}, note: "%95.5 doğru; tam sayımda 20 sıranın 2'si doğru."}
    questions:
      - q: "Önalım seyrekken korumasız sayaç çalıştırmaların %96'sında doğru sonuç veriyor. Bu, kodun 'çoğunlukla doğru' olduğu anlamına gelir mi?"
        a: "Hayır. Gerçek bir makinede önalım olasılığı yük, çekirdek sayısı ve frekans ölçeklemeyle değişir; geliştirici makinesinde hiç görülmeyen hata üretimde sık görülebilir. Üstelik C++'ta bu bir veri yarışıdır: derleyici sayacı yazmaçta tutup döngü sonunda tek seferde yazabilir ve sonuç burada ölçülenden çok daha kötü olabilir. Doğruluk test sıklığıyla değil, eşzamanlama ile güvence edilir."
    limits: "Sıralı tutarlı bellek modeli (yazma tamponu yok); zamanlayıcı adım başına önalım; derleyici eniyilemeleri modellenmiyor."
  - id: l2
    lab: deadlock
    title: "Kilitlenme, livelock ve açlık: yemek yiyen filozoflar"
    goal: |
      Halkadaki N thread, iki komşu kilidi birlikte tutarak "yer". Önce sol / sonra sağ, küresel kilit sırası, try_lock + sabit geri çekilme ve try_lock + rastgele geri çekilme stratejilerini karşılaştır; kilitlenme anını, toplam yemeği, thread başına dağılımı ve boşa harcanan adımları ölç. Süre sapması sıfırken thread'ler tam eşzamanlıdır.
    predict:
      q: "Tam eşzamanlı thread'lerde 'try_lock + sabit geri çekilme' ne yapar?"
      options:
        - {t: "Kilitlenmeyi önler ve normal yemek yenir", why: "Kilitlenme yok, ama hepsi aynı anda alıp aynı anda bırakıyor."}
        - {t: "Livelock: kimse bloklu değil ama hiç yemek yenmiyor", ok: true, why: "Zamanın %99.5'i geri çekilme ve başarısız denemede; rastgele geri çekilme simetriyi kırıp 360 yemek veriyor."}
        - {t: "Önce sol stratejisi gibi kilitlenir", why: "try_lock başarısız olunca sol kilit bırakılıyor: döngüsel bekleme oluşmuyor."}
    presets:
      - {name: "Önce sol, eşzamanlı", params: {strat: 0, N: 5, jit: 0, think: 10, eat: 10}, note: "10. adımda kilitlenme."}
      - {name: "Önce sol, rastgele", params: {strat: 0, N: 5, jit: 0.5, think: 10, eat: 10}, note: "Bu tohumda kilitlenme yok ama 211 yemek: sol kilidi tutarak beklemek eşzamanlılığı düşürüyor."}
      - {name: "Küresel sıra", params: {strat: 1, N: 5, jit: 0.5, think: 10, eat: 10}, note: "Kilitlenme yok, 362 yemek."}
      - {name: "Sabit geri çekilme, eşzamanlı", params: {strat: 2, N: 5, jit: 0, think: 10, eat: 10}, note: "Livelock: 0 yemek."}
      - {name: "Rastgele geri çekilme, eşzamanlı", params: {strat: 3, N: 5, jit: 0, think: 10, eat: 10}, note: "360 yemek."}
      - {name: "İki filozof", params: {strat: 0, N: 2, jit: 0.5, think: 10, eat: 10}, note: "1067. adımda kilitlenme: olasılıksal."}
    questions:
      - q: "Önce sol stratejisi rastgele sürelerle bu tohumda kilitlenmedi. Neden yine de yanlıştır?"
        a: "Kilitlenme olasılıksaldır: döngüsel beklemenin dört koşulu yapısal olarak sağlanıyor; yalnız bütün thread'lerin aynı anda sol kilidi tutması gerekiyor. Uzun çalışan bir sistemde bu er ya da geç olur (iki filozofla 1067. adımda oldu). Küresel kilit sırası ise döngüyü yapısal olarak imkânsız kılar."
    limits: "Zaman adımlı simülasyon, 2000 adım; aynı kilit için eşzamanlı isteklerde rastgele kazanan; işletim sistemi zamanlaması ve öncelikler yok."
  - id: l3
    lab: prodcons
    title: "Üretici–tüketici: sınırlı tampon, meşgul bekleme ve sonlandırma"
    goal: |
      P üretici ve C tüketici, B yuvalı bir tampon üzerinden 200 öğe alışverişi yapıyor. Tampon doluluğunu ve bekleyen thread'leri izle; bloklayan semafor ile meşgul beklemenin CPU maliyetini, zehirli hap ile paylaşılan bayrakla sonlandırmanın farkını ölç.
    predict:
      q: "Tüketiciler üreticilerden hızlıyken sonlandırma paylaşılan bir bayrakla yapılırsa ne olur?"
      options:
        - {t: "Bütün tüketiciler bayrağı görüp çıkar", why: "Boş tamponda semaforda uyuyan bir tüketici bayrağa hiç bakmaz."}
        - {t: "Bazı tüketiciler semaforda sonsuza dek bloklu kalır", ok: true, why: "Bu tohumda 1 tüketici takılı kalıyor; 6 tüketiciyle 2. Zehirli hap her tüketiciyi uyandırır."}
        - {t: "Üreticiler bloklanır", why: "Üreticiler işini bitirmiştir; sorun bekleyen tüketicilerde."}
    presets:
      - {name: "Zehirli hap", params: {P: 2, C: 3, B: 8, tp: 1, tc: 0.5, wait: 0, term: 0}, note: "Bütün tüketiciler çıktı; bloklu bekleme 159 thread·birim."}
      - {name: "Bayrak", params: {P: 2, C: 3, B: 8, tp: 1, tc: 0.5, wait: 0, term: 1}, note: "1 tüketici takılı."}
      - {name: "Meşgul bekleme + bayrak", params: {P: 2, C: 3, B: 8, tp: 1, tc: 0.5, wait: 1, term: 1}, note: "Bayrak görülüyor ama 159 thread·birim CPU boşa."}
      - {name: "Tek yuvalı tampon", params: {P: 2, C: 3, B: 1, tp: 1, tc: 1.5, wait: 0, term: 0}, note: "Verim 1.6'ya düşüyor; üreticiler sık bekliyor."}
      - {name: "Büyük tampon", params: {P: 2, C: 3, B: 64, tp: 1, tc: 1.5, wait: 0, term: 0}, note: "Verim 1.95 ≈ sınır 2."}
      - {name: "Tek tüketici", params: {P: 2, C: 1, B: 8, tp: 1, tc: 1.5, wait: 0, term: 0}, note: "Darboğaz tüketici: verim ≈ 0.7."}
    questions:
      - q: "Tampon boyunu artırmak verimi neden ancak bir yere kadar artırıyor?"
        a: "Verimin üst sınırı min(P/tp, C/tc)'dir: tampon yalnız iki tarafın anlık hız dalgalanmalarını emer. Rastgele süreler yüzünden kısa süreli dengesizlikler bir tarafın beklemesine yol açar; büyük tampon bunları yumuşatır (1 yuvada 1.6, 64 yuvada 1.95), ama ortalama hızı yavaş taraf belirler."
    limits: "Zaman adımlı simülasyon (dt = 0.02); kilitlerin kendi maliyeti ve bağlam değiştirme yok; bayrak sürümünde bekleyenler uyandırılmıyor (sorunu göstermek için)."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: İç içe geçmeleri saymak
    goal: Kayıp güncellemenin kombinatoriğini görmek
    needs: $\binom{2k}{k}$
    q: |-
      İki thread'in her biri `x = x + 1`'i üç adımda yapıyor (oku, artır, yaz); başta x = 0. Kaç iç içe geçme var, kaçı x = 2 bırakır?
    solution: |-
      $\binom63=20$ sıra. x = 2 için bir thread'in yazması ötekinin okumasından önce olmalı: yalnız AAABBB ve BBBAAA. 18 sıra bir güncellemeyi kaybeder. İki adımlı modelde (LOAD, STORE+1) $\binom42=6$ sıranın 4'ü kaybeder.
  - id: p2
    type: hesap
    level: 1
    title: Dört adımlı iç içe geçmeler
    goal: Sıra sayısının büyümesini hesaplamak
    needs: $\binom{2k}{k}$
    q: |-
      İki thread'in her biri 4 adımlık bir dizi yürütüyor (her thread kendi sırasını koruyor). Kaç farklı iç içe geçme vardır?
    answer: 70
    calc: "math.comb(8,4)"
    tol: 0
    mistakes:
      - {answer: 40320, msg: "8! bütün sıralamalardır; her thread'in kendi sırası korunur."}
      - {answer: 16, msg: "2⁴ değil: 8 konumdan 4'ü birinci thread'e seçilir."}
    hints:
      - "8 konumdan birinci thread'in 4 adımının yerlerini seç."
    solution: |-
      $\binom84=70$. Her thread 10 adımda $\binom{20}{10}=184\,756$: elle denetlemek olanaksız.
  - id: p3
    type: hesap
    level: 1
    title: Sayan semaforun durumu
    goal: P ve V işlemlerinin sayaca etkisini izlemek
    needs: P → C−1 (negatifse blokla), V → C+1
    q: |-
      Bir sayan semafor C = 3 ile başlıyor. Beş thread art arda acquire (P) çağırıyor, sonra bir thread release (V) çağırıyor. C'nin son değeri (negatifse bekleyen sayısının eksiğidir)?
    answer: -1
    calc: "3-5+1"
    tol: 0
    mistakes:
      - {answer: 0, msg: "Sayaç sıfırda kırpılmaz: negatif değer bekleyen thread sayısını gösterir."}
      - {answer: 2, msg: "Bloklanan iki thread de sayacı azalttı."}
    hints:
      - "Üç thread geçer, iki thread bloklanır (C = −2); V birini uyandırır."
    solution: |-
      $3-5=-2$ (iki bekleyen), $-2+1=-1$: biri uyandı, biri hâlâ bekliyor.
  - id: p4
    type: hesap
    level: 1
    title: Sahte paylaşımı önlemek
    goal: Önbellek satırı dolgusunu hesaplamak
    needs: 64 baytlık satır, alignas
    q: |-
      8 thread'in her biri kendi 8 baytlık sayacını sık sık artırıyor. Sayaçlar bitişik bir dizideyse hepsi tek bir 64 baytlık önbellek satırını paylaşır. Her sayacı kendi satırına koymak (`alignas(64)`) için dizinin toplam boyutu kaç bayt olur?
    answer: 512
    calc: "8*64"
    tol: 0
    mistakes:
      - {answer: 64, msg: "Bu dolgusuz dizi: sekizi de aynı satırda."}
      - {answer: 72, msg: "Her sayaç kendi 64 baytlık satırını kaplar."}
    hints:
      - "Her eleman 64 bayta dolgulanır."
    solution: |-
      $8\cdot64=512$ bayt. Veri paylaşılmasa bile aynı satıra yazan çekirdekler satırı birbirinden geri çeker (MESI geçersizleştirmeleri); dolgu bunu önler. C++17'de `std::hardware_destructive_interference_size`.
  - id: p5
    type: yorumla
    level: 2
    title: Release derlemesinde donan program
    goal: Veri yarışının derleyiciyle etkileşimini tanımak
    needs: Veri yarışı, eniyileme, atomic
    q: |-
      Bir işçi thread `while (!done) { iş(); }` döngüsünde çalışıyor; ana thread bir süre sonra `done = true;` yazıyor (`bool done` sıradan bir küresel değişken). Hata ayıklama derlemesinde program düzgün bitiyor, `-O2` ile işçi hiç durmuyor. Neden ve çözüm?
    choices:
      - {t: "Önbellek tutarsızlığı; bayrağın önbellekten silinmesi için sleep eklenmeli", why: "Önbellekler eşevrelidir; sorun derleyicide."}
      - {t: "Veri yarışı tanımsız davranış: derleyici done'ın döngüde değişmediğini varsayıp okumayı döngü dışına taşıdı; done std::atomic<bool> olmalı", ok: true, why: "SC-DRF: yarışsız programda okuma her turda yapılır ve yazma görünür."}
      - {t: "done volatile yapılmalı", why: "volatile okumayı korur ama atomiklik ve sıralama vermez; hâlâ veri yarışıdır."}
    hints:
      - "Derleyici tek thread'li anlamı koruyarak neyi yapabilir?"
    solution: |-
      Derleyici `iş()`'in done'ı değiştirmediğini görürse okumayı döngü dışına çıkarır (`if (!done) while (true) iş();`). Bu, veri yarışı olmayan bir programda geçerli bir dönüşümdür. `std::atomic<bool> done` her turda gerçek bir okuma ve ana thread'in yazmasının görünmesini güvence eder.
  - id: p6
    type: kanıt
    level: 3
    title: Kilit sıralaması kilitlenmeyi önler
    goal: Döngüsel beklemenin imkânsızlığını kanıtlamak
    needs: Bekleme grafiği, toplam sıra
    q: |-
      Kilitlere bir toplam sıra verildiğini ve her thread'in birden çok kilidi yalnız artan sırada aldığını varsayın. Hiçbir zaman kilitlenme olamayacağını kanıtlayın.
    rubric:
      - "Kilitlenmeyi bekleme grafiğinde bir döngü olarak ifade ettim"
      - "Döngüdeki her thread'in tuttuğu en büyük kilitten büyük bir kilidi beklediğini gösterdim"
      - "Döngü boyunca kilitlerin kesin artan bir dizi oluşturup kendine döndüğü çelişkisini kurdum"
      - "Diğer üç Coffman koşulunun sağlansa bile döngüsüz kilitlenme olamayacağını belirttim"
    hints:
      - "Thread $T_i$'nin beklediği kilit, tuttuğu bütün kilitlerden büyüktür."
    solution: |-
      Bkz. derste "Kilitlenmenin dört koşulu ve kilit sıralaması" türetimi.
pitfalls:
  - wrong: "Sonlandırma bayrağını volatile yapmak thread'ler arası görünürlüğü sağlar."
    right: "C/C++'ta volatile atomiklik ve sıralama vermez; bir thread'in yazıp ötekinin okuduğu volatile değişken hâlâ veri yarışıdır. std::atomic<bool> kullanılmalı."
  - wrong: "Okumayı ve yazmayı ayrı ayrı atomik yapmak yarışı giderir."
    right: "Veri yarışını giderir, yarış koşulunu gidermez: oku–değiştir–yaz bütünü bölünmez olmalı (fetch_add ya da kilit). Lab l1'de iki sürüm aynı kayıpları veriyor."
  - wrong: "Doğruluk için her eleman güncellemesini kilitle korumak iyi bir yoldur."
    right: "Kritik bölge her elemanda girilirse thread'ler sıraya girer ve kilit maliyeti eklenir: program sıralıdan yavaşlar. Thread'e özel yerel toplam + sonda tek kilitli birleştirme kullanılır."
  - wrong: "Koşul değişkeninde `if (koşul yok) cv.wait(lock);` yeterlidir."
    right: "Lampson–Redell monitörlerinde uyanan thread çalışana kadar koşul yeniden bozulabilir ve sahte uyanmalar olur: bekleme `while` ile (ya da wait(lock, pred)) yapılır."
whatif:
  - q: "Banka monitöründe deposit notify_all yerine notify_one çağırsa?"
    a: "Bekleyen birden çok çekme varsa yalnız biri uyanır; o da bakiyeyi yetersiz bulup yeniden uyursa, bakiyenin karşılayabileceği başka bir çekme hiç uyanmaz (kaybolan uyanma). notify_one yalnız her sinyalin tam bir bekleyeni ilerletebildiği durumlarda (ör. sayan bir kaynak) güvenlidir."
  - q: "N üretici ve M tüketici görevi N + M'den az thread'li bir havuzda çalıştırılsa?"
    a: "Bloklanan görevler thread'leri tutar: tampon doluyken bütün thread'ler üreticilerle dolarsa tüketici görevleri hiç çalışamaz ve tampon hiç boşalmaz: havuz düzeyinde kilitlenme. Çözüm bloklamayan görevler (iş yoksa görevi kuyruğa geri koymak), ayrı havuzlar ya da fiber/eşyordam tabanlı bekleme."
  - q: "std::async varsayılan politikayla çağrılsa ve sonuçlar hemen get() ile alınmasa?"
    a: "Varsayılan politika async | deferred'dır; kütüphane deferred seçerse hiçbir thread açılmaz ve fonksiyon get() çağrısında, çağıran thread'de çalışır: paralellik kaybolur. Paralellik isteniyorsa launch::async açıkça verilmelidir."
