whatif:
  - q: "İşleç değişmeli değilse (ör. afin bileşim ya da matris çarpımı)?"
    a: "Tarama birleşmeli olmayı ister, değişmeliliği istemez; ama sıra korunmalıdır. Kogge–Stone güncellemesi XY[i] = XY[i − s] ⊕ XY[i] biçiminde (sol işlenen önce) yazılmalı; Brent–Kung'da da aynı yön gözetilmeli. Toplamada yazılan XY[i] += XY[i − s] alışkanlığı sırayı ters çevirir ve değişmeli olmayan işleçte yanlış sonuç verir."
  - q: "n 2'nin kuvveti değilse?"
    a: "Bölüm, birim elemanla (toplamada 0) bir sonraki 2'nin kuvvetine doldurulur ya da yükleme/yazmada sınır denetimi yapılır. Birim eleman dolgusu sonucu değiştirmez; hiyerarşik taramada yalnız son bölüm eksik kalır."
  - q: "Taban sıralamasında her bit için bir sıkıştırma yerine 4 bitlik gruplar kullanılsa?"
    a: "Geçiş sayısı b'den b/4'e iner (32 bit için 8 geçiş), ama her geçişte 16 kutulu bir sayma ve 16 kutunun taraması gerekir. Daha az global bellek geçişi genellikle daha hızlıdır; GPU taban sıralamaları (CUB) geçiş başına 4–8 bit kullanır."
