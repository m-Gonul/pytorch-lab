quiz:
  - q: "Skorlar neden $\\sqrt{d_k}$'ye bölünür?"
    options:
      - {t: "Bileşenleri birim varyanslı q, k için $q\\cdot k$'nın varyansı $d_k$'dir; ölçeklenmezse softmax doyar ve gradyan neredeyse sıfır olur", ok: true, why: "Bölme varyansı 1'e çeker; softmax'ın girdisi makul aralıkta kalır."}
      - {t: "Sayısal taşmayı önlemek için", why: "Taşmayı max çıkarma hilesi önler; ölçek gradyan akışı için."}
      - {t: "Head sayısına göre normalize etmek için", why: "Ölçek, head başına boyut $d_k$'ye bağlı."}
  - q: "Causal maske neden softmax'tan **önce** $-\\infty$ ile uygulanır, sonra 0 ile çarpılarak değil?"
    options:
      - {t: "$e^{-\\infty}=0$ olduğundan maskelenen konumlar paydaya da girmez; sonradan sıfırlamak satırların toplamını 1'den küçük bırakır", ok: true, why: "Sonradan sıfırlarsan yeniden normalize etmen gerekir; önce $-\\infty$ bunu bedavaya yapar."}
      - {t: "İkisi aynı sonucu verir", why: "Sonradan sıfırlamada payda gelecek token'ları hâlâ içerir."}
      - {t: "Gradyan hesabı için gereklidir", why: "Mesele normalizasyon."}
  - q: "FlashAttention neden standart attention'dan hızlıdır, oysa FLOP sayısı aynı (hatta biraz fazla)?"
    options:
      - {t: "T×T skor matrisini HBM'e yazıp okumaz; blokları SRAM'de tutar ve online softmax ile birleştirir: darboğaz bellek trafiği", ok: true, why: "Attention bellek-bağımlı bir işlem; IO azalınca hız gelir. Geri geçişte de skorları saklamak yerine yeniden hesaplar."}
      - {t: "Yaklaşık (approximate) attention hesaplar", why: "Kesin sonuç verir; e aşamasında `F.scaled_dot_product_attention` ile birebir karşılaştırıyorsun."}
      - {t: "Daha az head kullanır", why: "Head yapısı değişmez."}

homework:
  - title: "Dao ve ark. (2022): FlashAttention"
    paper: "Dao, Fu, Ermon, Rudra, Ré — FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness (NeurIPS 2022)"
    url: "https://arxiv.org/abs/2205.14135"
    level: ileri
    hours: 12
    goal: |
      e aşamasındaki online softmax'ı bir Triton çekirdeğine (M7.2) çevir: Q bloğu başına K/V bloklarını SRAM'e yükle, satır maksimumu ve paydayı güncelle (Algoritma 1), çıktıyı yeniden ölçekle. Geri geçişi makalenin yeniden hesaplama yaklaşımıyla (Algoritma 2; yalnız logsumexp sakla) yaz. Bellek kullanımını (O(N) vs O(N²)) ve HBM okuma sayısını kuramsal formülle (Teorem 2) karşılaştır; nedensel maske ve blok atlama ekle.
    steps:
      - "GPU yoksa TRITON_INTERPRET=1 ile doğruluğu, Colab'da hızı ölç."
    accept:
      - "Çıktı ve gradyanlar standart attention'la 10⁻³ içinde."
      - "Uzun dizide bellek ve süre kazancı tablosu."

labs:
  - id: l1
    lab: attnscale
    title: "Neden √d_k'ya bölüyoruz?"
    goal: |
      $q,k$ bileşenleri bağımsız N(0,1) ise $q\cdot k=\sum_i q_ik_i$'nin varyansı $d_k$'dır. Skorlar büyüdükçe softmax tek bir anahtara yığılır (doyar), Jacobian'ı $\mathrm{diag}(\alpha)-\alpha\alpha^\top\to0$ olur ve gradyan akmaz. $1/\sqrt{d_k}$ ölçeği varyansı 1'e çeker.
    predict:
      q: "Ölçeksiz, d_k = 512, 32 anahtar: en büyük attention ağırlığı tipik olarak ne olur?"
      options:
        - {t: "≈ 1/32", why: "Bu düzgün dağılım; skorların std'si ≈ 22 iken imkânsız."}
        - {t: "≈ 0.3", why: "Ölçekli durumda bile tipik değer daha küçük."}
        - {t: "≈ 1 (one-hot)", ok: true, why: "En büyük skor ikinciden onlarca birim büyük: e^{farklar} hepsini ezer."}
    presets:
      - {name: "Ölçekli vs ölçeksiz", params: {d: 256, scale: 0, B: {scale: 1}}, note: "A Transformer'daki gibi, B ölçeksiz."}
      - {name: "Küçük d_k", params: {d: 2, scale: 1}, note: "d_k küçükken ölçeğin etkisi az: √2 ≈ 1.4."}
      - {name: "Uzun dizi", params: {d: 64, n: 128}, note: "Entropinin üst sınırı ln n büyür; ölçekli attention'da bile ağırlıklar dağılır."}
    questions:
      - q: "Entropi–d_k grafiğinde ölçekli eğri neden yatay?"
        a: "Ölçekli skorların dağılımı d_k'dan bağımsız (std 1); dolayısıyla softmax dağılımı da d_k'dan bağımsız."
    limits: "Rastgele q, k; eğitilmiş modellerde q ve k ilişkilidir ve normları öğrenilir (QK-norm gibi teknikler bu yüzden var)."
  - id: l2
    lab: attnviz
    title: "Dikkat matrisi, satır satır: sorgu, skor, maske, ağırlıklı toplam"
    goal: |
      Küçük bir cümlede elle tasarlanmış sorgu/anahtar/değer vektörleriyle ölçekli nokta çarpımı dikkatini hesapla. Bir sorguya tıkla: skorlar, softmax ağırlıkları ve çıktının hangi değerlerden karıştığı görünür. Nedensel ve dolgu maskelerini, ölçeklemeyi ve sıcaklığı değiştir.
    predict:
      q: "Dolgu maskesi kapalıyken &lt;pad&gt; tokenı ne olur?"
      options:
        - {t: "Hiçbir etkisi olmaz, anahtarı sıfır vektör", ok: false, why: "Anahtar sıfırsa skoru 0 olur — −∞ değil; softmax'ta e⁰ = 1 pay alır."}
        - {t: "Her sorgudan bir miktar ağırlık alıp çıktıları kirletir", ok: true, why: "Skor 0, diğer skorlarla yarışır; maske −∞ ile tam 0 yapar."}
        - {t: "Softmax tanımsız olur", why: "Yalnız tüm skorlar −∞ olursa (tamamen maskeli satır) sorun çıkar."}
    presets:
      - {name: "Kodlayıcı öz-dikkati", params: {q: 0, causal: 0, pad: 1, sq: 1, temp: 1}, note: "'Kraliçe' en çok 'Krallık'ı' ve 'Birleşik'e bakıyor (yer arıyor)."}
      - {name: "Nedensel maske", params: {q: 4, causal: 1, pad: 1}, note: "'ziyaret' yalnız kendinden öncekilere bakabiliyor; üst üçgen sıfır."}
      - {name: "Dolgu maskesi kapalı", params: {q: 0, pad: 0}, note: "Dolgu tokenı her satırdan pay alıyor."}
      - {name: "Sert dikkat (τ = 0.2)", params: {q: 0, temp: 0.2}, note: "Dağılım argmax'a yaklaşıyor: neredeyse tek bir tokena bakıyor."}
      - {name: "Düz dikkat (τ = 10)", params: {q: 0, temp: 10}, note: "Ağırlıklar eşitleniyor: çıktı tüm değerlerin ortalamasına yaklaşıyor."}
    questions:
      - q: "&lt;pad&gt; satırı (dolgu tokenının kendi sorgusu) neden önemsiz?"
        a: "Sorgusu sıfır: tüm skorları eşit, ağırlıkları düzgün. Ama dolgu konumlarının çıktısı kayıpta da maskelendiği için hiçbir şeyi etkilemez."
    limits: "4 boyutlu, elle tasarlanmış ve yorumlanabilir Q/K/V; tek baş. Gerçek modelde Q, K, V öğrenilen izdüşümlerdir ve boyutları yorumlanamaz."
  - id: l3
    lab: onlinesoftmax
    title: "Çevrimiçi softmax: tam matrisi tutmadan tam sonuç"
    goal: |
      Bir sorgunun T skorunu B'lik bloklar hâlinde işle; koşan maksimum ve paydayı her blokta yeniden ölçekleyerek güncelle. Sonucun tam softmax'la (yuvarlama dışında) aynı olduğunu, belleğin T × T yerine T × B olduğunu ve max çıkarmayan saf softmax'ın büyük skorlarda taştığını gör.
    predict:
      q: "Blok boyunu 32'den 1'e indirirsen sonuç nasıl değişir?"
      options:
        - {t: "Yaklaşıklık hatası büyür", why: "Çevrimiçi softmax yaklaşık değil: her blok boyunda aynı sonucu verir."}
        - {t: "Sonuç aynı kalır", ok: true, why: "Yeniden ölçekleme kesin bir cebirsel eşitlik; yalnız işlem sırası (ve yuvarlama) değişir."}
        - {t: "Sonuç ıraksar", why: "Her adımda max çıkarıldığı için sayılar sınırlı kalır."}
    presets:
      - {name: "Varsayılan", params: {T: 256, B: 32, sc: 3, tr: 80}, note: "8 blok; fark ≈ 10⁻¹⁵."}
      - {name: "Büyük skorlar", params: {sc: 1000}, note: "exp(1000) taşar: saf softmax NaN; çevrimiçi ve kararlı sürüm sorunsuz."}
      - {name: "Blok boyu 1", params: {B: 1}, note: "Tamamen akış hâlinde (her anahtar tek tek): sonuç yine aynı."}
      - {name: "Uzun bağlam", params: {T: 4096, B: 128}, note: "Tam matris 16.7 milyon skor; blok tamponu 0.5 milyon."}
    questions:
      - q: "Baskın skor dizinin sonundaysa (tr = 100) koşan çıktı neden son bloğa kadar yanlış görünür?"
        a: "Koşan çıktı, o ana kadarki blokların softmax ortalamasıdır; baskın anahtar henüz görülmediği için ağırlıkları yanlıştır. Baskın blok gelince m sıçrar, eski toplamlar e^(m − m′) ile küçülür ve sonuç doğruya oturur. Ara sonuçlar anlamsızdır; yalnız son sonuç doğrudur."
    limits: "Tek sorgu, skaler değerler, CPU'da JavaScript. Gerçek FlashAttention sorgu bloklarını da paralel işler, Q·Kᵀ'yi blok blok hesaplar ve geri geçişte P'yi yeniden hesaplar."


practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: "q·k'nın varyansı d_k: √d_k nereden geliyor?"
    goal: Ölçekleme çarpanını türetmek
    needs: Bağımsız değişkenlerin çarpımının varyansı
    q: |-
      $q,k\in\mathbb R^{d_k}$, bileşenler bağımsız, ortalama 0, varyans 1. $q\cdot k$'nın ortalamasını ve varyansını bul.
    solution: |-
      $q\cdot k=\sum_{i=1}^{d_k}q_ik_i$. Her terim: $\mathbb E[q_ik_i]=\mathbb E[q_i]\mathbb E[k_i]=0$, $\mathrm{Var}(q_ik_i)=\mathbb E[q_i^2]\mathbb E[k_i^2]=1$. Terimler bağımsız: $\mathrm{Var}(q\cdot k)=d_k$.

      $\frac{q\cdot k}{\sqrt{d_k}}$'nın varyansı 1'dir, $d_k$'dan bağımsız. Ölçeklenmezse $d_k=512$'de skorların std'si ≈ 22.6 olur; softmax neredeyse one-hot'a doyar ve Jacobian'ı $\mathrm{diag}(\alpha)-\alpha\alpha^\top\approx0$ olur (deney alanı). **Varsayım:** başlangıçta bağımsız birim varyanslı bileşenler; eğitim sonrası q ve k ilişkili olur — bu yüzden bazı modeller ayrıca QK-norm kullanır.
  - id: p2
    type: hesap
    level: 1
    title: Bir attention ağırlığı
    goal: Ölçekli skor ve softmax'ı elle hesaplamak
    needs: P1, softmax (M1.5)
    q: |-
      $q=[1,1]$, anahtarlar $k_1=[1,0]$, $k_2=[0,1]$, $k_3=[1,1]$, $d_k=2$. Üçüncü anahtarın ağırlığı $\alpha_3$?
    answer: 0.5034898434845538
    calc: "math.exp(2/math.sqrt(2))/(2*math.exp(1/math.sqrt(2))+math.exp(2/math.sqrt(2)))"
    tol: 1e-3
    mistakes:
      - {answer: 0.5761168847658291, msg: "Skorları √d_k = √2'ye bölmeyi unuttun."}
      - {answer: 0.5, msg: "Ağırlıklar skorların oranı değil, softmax'ı."}
    hints:
      - "Skorlar $[1,1,2]/\\sqrt2$."
    solution: |-
      Skorlar $[0.707,0.707,1.414]$; $\alpha_3=\frac{e^{1.414}}{2e^{0.707}+e^{1.414}}=\frac{4.113}{4.056+4.113}=0.503$.
  - id: p3
    type: hesap
    level: 1
    title: Çok başlı attention'ın parametreleri
    goal: Başların parametreyi değil hesabı böldüğünü görmek
    needs: Doğrusal izdüşümler
    q: |-
      $d_{model}=512$, 8 baş, $d_k=d_v=64$, $W_Q,W_K,W_V,W_O$ bias'lı. Toplam parametre?
    answer: 1050624.0
    calc: "4*512*512+4*512"
    mistakes:
      - {answer: 787968.0, msg: "Çıkış izdüşümü W_O'yu (512 × 512 + bias) unuttun: dört izdüşüm var."}
      - {answer: 1048576.0, msg: "Dört izdüşümün bias'larını (4 × 512) ekle."}
    hints:
      - "Q, K, V izdüşümleri 8 başın birleşimi olarak $512\\times512$; çıkış $512\\times512$."
    solution: |-
      $4\cdot512^2+4\cdot512=1\,050\,624$. Baş sayısı parametreyi değiştirmez (h·d_k = d_model sabit), yalnız temsili alt uzaylara böler.
  - id: p4
    type: hesap
    level: 2
    title: Skor matrisinin belleği
    goal: Attention'ın n² maliyetini somutlaştırmak
    needs: Bellek hesabı
    q: |-
      $n=4096$ token, 16 baş, fp16 (2 bayt), batch 1. Tek katmandaki skor matrislerinin (softmax öncesi) toplam belleği kaç MiB?
    answer: 512.0
    calc: "16*4096*4096*2/2**20"
    unit: MiB
    mistakes:
      - {answer: 0.125, msg: "Skor matrisi n × n: 4096² eleman."}
      - {answer: 1024.0, msg: "fp16 2 bayttır, fp32 değil."}
    hints:
      - "Eleman sayısı: baş × n × n."
    solution: |-
      $16\cdot4096^2\cdot2\ \text{B}=512$ MiB, tek katman, tek örnek — geri yayılım için saklanırsa katman sayısıyla çarpılır. FlashAttention bu matrisi hiç tam yazmadan, bloklar hâlinde çevrimiçi softmax ile hesaplar (M7.2).
  - id: p5
    type: açıkla
    level: 2
    title: Attention bir sözlük aramasıdır
    goal: Q/K/V rollerini kendi cümlelerinle anlatmak
    needs: Ağırlıklı ortalama
    q: |-
      Q, K, V'yi "yumuşak sözlük araması" benzetmesiyle açıkla; sert (argmax) aramadan farkını ve neden türevlenebilir olmanın önemli olduğunu söyle.
    rubric:
      - "Sorgu ile her anahtarın benzerliği (iç çarpım) ölçülür dedim"
      - "Değerlerin benzerliğe göre ağırlıklı ortalaması döner dedim"
      - "Sert aramanın tek anahtarı seçtiğini ve türevlenemediğini, softmax'ın ağırlıkları sürekli yaptığını açıkladım"
      - "Anahtar ile değerin neden ayrı izdüşümler olduğunu (neye göre bulunduğu ≠ ne taşıdığı) söyledim"
    hints:
      - "Python sözlüğü `d[q]` ile karşılaştır."
    solution: |-
      Sözlükte sorgu tam bir anahtarla eşleşir, o anahtarın değeri döner. Attention'da sorgu tüm anahtarlarla benzerlik skoru üretir; softmax bu skorları olasılığa çevirir; çıktı değerlerin bu olasılıklarla ortalamasıdır. Argmax'ın türevi hemen her yerde 0'dır; softmax ağırlıkları skorların düzgün fonksiyonudur, böylece "neye bakılacağı" gradyanla öğrenilir. K ve V'nin ayrı izdüşümleri, bir token'ın "nasıl bulunacağını" (anahtar) "ne aktaracağından" (değer) ayırır.
  - id: p6
    type: karşı-örnek
    level: 3
    title: Konumsuz attention sırayı görmez
    goal: Permütasyon eşdeğerliğini göstermek
    needs: Matris permütasyonu
    q: |-
      Konum kodlaması olmayan öz-attention'ın permütasyona eşdeğer olduğunu ($\mathrm{Attn}(PX)=P\,\mathrm{Attn}(X)$) kanıtla ve bunun "köpek adamı ısırdı" / "adam köpeği ısırdı" için ne anlama geldiğini söyle.
    rubric:
      - "$Q=XW_Q$ ise $PX$ için $PQ$, $PK$, $PV$ olduğunu yazdım"
      - "$\\mathrm{softmax}(PQK^\\top P^\\top)=P\\,\\mathrm{softmax}(QK^\\top)P^\\top$ (satır işlemi permütasyonla değişir) gösterdim"
      - "Sonucu $P\\,\\mathrm{Attn}(X)$ olarak tamamladım ($P^\\top P=I$)"
      - "Kelime sırası farklı iki cümlenin aynı çıktı kümesini (yeniden sıralanmış) vereceğini ve konum kodlamasının gerekli olduğunu söyledim"
    hints:
      - "Satır-bazlı softmax, satırları ve sütunları aynı permütasyonla değiştirmeye nasıl tepki verir?"
    solution: |-
      $S'=(PQ)(PK)^\top/\sqrt d=PSP^\top$. Softmax satır satır uygulanır ve bir satırdaki elemanların yerini değiştirmek çıktıyı aynı biçimde değiştirir: $\mathrm{softmax}(PSP^\top)=P\,\mathrm{softmax}(S)\,P^\top$. Çıktı $P\,\mathrm{softmax}(S)P^\top PV=P\,\mathrm{Attn}(X)$. Yani iki cümledeki "köpek" token'ı aynı vektörü alır; anlam farkı kaybolur. Sinüzoidal ya da öğrenilen konum kodlaması (M4.14) ya da göreli konum (RoPE) bu simetriyi kırar. Nedensel maske de sırayı kısmen kodlar (P'yi bozar).
pitfalls:
  - wrong: "Attention ağırlıkları modelin 'neye baktığını' güvenilir biçimde açıklar."
    right: "Ağırlıklar değerlerin normunu ve sonraki katmanları hesaba katmaz; farklı ağırlıklar aynı çıktıyı verebilir (Jain & Wallace 2019)."
  - wrong: "Çok başlı attention parametre sayısını baş sayısıyla çarpar."
    right: "Toplam izdüşüm boyutu sabit tutulur (P3); başlar alt uzaylara bölünmüş temsil sağlar."
  - wrong: "Maske eklemek için skoru 0 yap."
    right: "Softmax'tan **önce** −∞ (ya da çok negatif sayı) eklenir; 0 skoru e⁰ = 1 ağırlık demektir."
whatif:
  - q: "Ölçek √d_k yerine d_k olsaydı?"
    a: "Skor varyansı 1/d_k olur: büyük d_k'da softmax neredeyse düzgüne yakınsar, attention seçiciliğini kaybeder (öğrenilebilir ama başlangıç kötü)."
  - q: "Dizi uzunluğu 10 katına çıkarsa?"
    a: "Skor matrisi ve hesap 100 kat büyür (n²); seyrek, kayan pencereli ya da doğrusal attention ve FlashAttention bu yüzden var."
