  - {id: x2, title: "MobileNetV2 ters artık bloğu: genişleme oranının bedeli", engine: browser}
  - {id: x3, title: "EfficientNet bileşik ölçekleme", engine: browser}

quiz:
  - q: "Ders alıştırması 5'te ~62 bin parametreli CNN, aynı parametreli FC ağdan neden daha iyi?"
    options:
      - {t: "Konvolüsyon yerellik ve ağırlık paylaşımı önseli taşır: aynı desen her konumda aynı filtreyle tanınır (kaydırma eşdeğerliği), parametreler konuma göre çoğalmaz", ok: true, why: "FC aynı rakamı her konum için ayrı ayrı öğrenmek zorunda."}
      - {t: "CNN daha çok parametreye sahip", why: "Eşit."}
      - {t: "CNN daha hızlı eğitildiği için", why: "Daha yavaş bile olabilir."}
  - q: "Inception'daki 1×1 konvolüsyonların asıl işlevi nedir?"
    options:
      - {t: "Pahalı 3×3/5×5 konvolüsyonlardan önce kanal sayısını azaltan darboğaz: hesabı ve parametreleri ~10 kat düşürür (ayrıca kanallar arası doğrusalsızlık ekler)", ok: true, why: "'Network in Network' fikrinin uygulaması."}
      - {t: "Uzamsal çözünürlüğü azaltmak", why: "1×1 uzamsal boyutu değiştirmez."}
      - {t: "Receptive field'ı büyütmek", why: "Büyütmez."}
  - q: "Derinlemesine ayrılabilir konvolüsyon FLOP'u ~8–9 kat azaltır ama CPU/GPU'da süre aynı oranda düşmeyebilir. Neden?"
    options:
      - {t: "Derinlemesine kısım kanal başına küçük bir işlem: aritmetik yoğunluğu düşük, bellek-bağımlı; donanım tam kullanılamaz", ok: true, why: "Roofline (M7.1): FLOP değil, hangi tavana çarptığın önemli."}
      - {t: "Daha çok parametre içerdiği için", why: "Daha az içerir."}
      - {t: "Doğrusal olmadığı için", why: "İkisi de doğrusal."}

homework:
  - title: "Chollet (2017): Xception"
    paper: "Chollet — Xception: Deep Learning with Depthwise Separable Convolutions (CVPR 2017)"
    url: "https://arxiv.org/abs/1610.02357"
    level: orta
    hours: 10
    goal: |
      Makalenin "Inception modülü = düzenli konvolüsyon ile derinlemesine ayrılabilir konvolüsyon arasındaki bir spektrum" savını deneyle sına: CIFAR-10'da aynı derinlik/genişlikte (a) standart konvolüsyonlu, (b) segment sayısı 1, 2, 4, 8 olan Inception-benzeri (grup konvolüsyonu ile), (c) tam derinlemesine ayrılabilir bloklar kur; parametre/FLOP/doğruluk tablosu çıkar. Makaledeki "ara doğrusalsızlık yok" bulgusunu (Şekil 10) de test et.
    steps:
      - "d aşamasındaki DepthwiseSeparable ve grup konvolüsyonu modüllerini kullan."
    accept:
      - "Ayrılabilir sürüm, benzer doğrulukta belirgin daha az parametre."
      - "Derinlemesine ve noktasal arasında ReLU olmaması daha iyi ya da eşit."
  - title: "Hu ve ark. (2018): Sıkıştır-uyar ağları"
    paper: "Hu, Shen, Sun — Squeeze-and-Excitation Networks (CVPR 2018)"
    url: "https://arxiv.org/abs/1709.01507"
    level: orta
    hours: 8
    goal: |
      Küçük bir ResNet'e (M4.2) SE blokları ekle, r ∈ {4, 8, 16, 32} için parametre artışı ve CIFAR-10 doğruluğunu ölç; makalenin Şekil 6'sındaki gibi farklı sınıflarda farklı katmanlardaki uyarım (excitation) dağılımlarını çiz ve derin katmanların sınıfa özgü hâle geldiğini göster.
    steps:
      - "Uyarım vektörlerini hook ile topla; sınıf başına ortalamasını al."
    accept:
      - "SE, %1'den az ek parametreyle doğruluğu artırır ya da korur."
      - "Son katmanlarda sınıflar arası uyarım farkı ilk katmanlardan büyük."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Derinlemesine ayrılabilir konvolüsyon ne kadar tasarruf eder?
    goal: Maliyet oranını türetmek
    needs: M4.1 P3
    q: |-
      $k\times k$ standart konvolüsyonu ($C_{in}\to C_{out}$) derinlemesine ($k\times k$, kanal başına) + noktasal (1 × 1) konvolüsyonla değiştir. Parametre oranını türet.
    solution: |-
      Standart: $k^2C_{in}C_{out}$. Ayrılabilir: $k^2C_{in}$ (derinlemesine) $+\ C_{in}C_{out}$ (noktasal).
      $$\frac{k^2C_{in}+C_{in}C_{out}}{k^2C_{in}C_{out}}=\frac1{C_{out}}+\frac1{k^2}.$$
      $k=3$, $C_{out}=256$: $\approx\frac19+\frac1{256}=0.115$ → ~8.7 kat az parametre ve FLOP (aynı uzamsal boyutta).

      **Varsayım ve bedel:** uzamsal ve kanal karışımının ayrılabildiği varsayılır (düşük ranklı bir çarpanlama); ifade gücü biraz düşer, ama MobileNet/Xception aynı bütçede daha derin/geniş ağla bunu telafi eder. Derinlemesine konvolüsyonun aritmetik yoğunluğu düşüktür: FLOP kazancı her donanımda süre kazancına dönmez (bellek bant genişliği sınırı, M7).
  - id: p2
    type: hesap
    level: 1
    title: Ayrılabilir katmanın parametreleri
    goal: P1'i uygulamak
    needs: P1
    q: |-
      3 × 3, $C_{in}=C_{out}=256$, bias'sız. Derinlemesine ayrılabilir konvolüsyonun parametre sayısı?
    answer: 67840.0
    calc: "3*3*256+256*256"
    mistakes:
      - {answer: 589824.0, msg: "Bu standart konvolüsyon."}
      - {answer: 2304.0, msg: "Noktasal (1 × 1) kısmı unuttun: 256 × 256."}
    hints:
      - "$k^2C_{in}+C_{in}C_{out}$."
    solution: |-
      $2304+65\,536=67\,840$; standart 589 824.
  - id: p3
    type: hesap
    level: 1
    title: Darboğaz bloğu
    goal: 1 × 1 ile kanal azaltmanın kazancını hesaplamak
    needs: P2
    q: |-
      ResNet darboğazı: 1 × 1 (256 → 64), 3 × 3 (64 → 64), 1 × 1 (64 → 256), bias'sız. Toplam parametre?
    answer: 69632.0
    calc: "256*64+9*64*64+64*256"
    mistakes:
      - {answer: 1179648.0, msg: "Bu iki 3 × 3 (256 kanal) temel bloğun sayısı; darboğaz çok daha ucuz."}
      - {answer: 53248.0, msg: "Son 1 × 1 genişletme katmanını ekle."}
    hints:
      - "Üç katmanı ayrı ayrı say."
    solution: |-
      $16\,384+36\,864+16\,384=69\,632$; 256 kanallı iki 3 × 3 katman 1 179 648 ederdi.
  - id: p4
    type: açıkla
    level: 2
    title: Squeeze-and-excitation ne yapar?
    goal: Kanal attention'ını kendi cümlelerinle açıklamak
    needs: Global havuzlama, sigmoid
    q: |-
      SE bloğunun adımlarını açıkla, neden ucuz olduğunu ve neyi öğrendiğini söyle.
    rubric:
      - "Global ortalama havuzlamayla kanal başına tek sayı (squeeze) aldığını söyledim"
      - "İki küçük FC (C → C/r → C) + sigmoid ile kanal ağırlıkları ürettiğini (excitation) söyledim"
      - "Haritaların bu ağırlıklarla kanal kanal ölçeklendiğini, yani girdiye bağlı kanal seçimi olduğunu açıkladım"
      - "Parametre maliyetinin 2C²/r olduğunu, FLOP'un ihmal edilebilir olduğunu belirttim"
    hints:
      - "Uzamsal bilgi nerede kayboluyor, neden önemli değil?"
    solution: |-
      Squeeze: her kanal için küresel bağlam (ortalama). Excitation: darboğazlı MLP ve sigmoid → (0, 1) kanal ağırlıkları. Ölçekleme: bu görüntü için hangi kanalların önemli olduğu dinamik olarak seçilir (attention'ın kanal ekseninde bir biçimi). Maliyet r = 16, C = 256 için 8192 parametre; uzamsal boyuttan bağımsız.
  - id: p5
    type: yöntem-seç
    level: 3
    title: Ağı büyütmek için bütçe nereye?
    goal: Bileşik ölçeklemenin gerekçesini değerlendirmek
    needs: FLOP ölçekleme
    q: |-
      FLOP bütçeni 2 katına çıkarabilirsin. Yalnız derinliği, yalnız genişliği, yalnız çözünürlüğü mü artırırsın, yoksa üçünü dengeli mi? FLOP'un her birine bağımlılığını kullan.
    rubric:
      - "FLOP ∝ derinlik, ∝ genişlik², ∝ çözünürlük² olduğunu yazdım"
      - "Tek eksende büyütmenin getirisinin hızla doyduğunu söyledim"
      - "EfficientNet'in α·β²·γ² ≈ 2 kısıtlı bileşik ölçeklemesini açıkladım"
      - "Daha yüksek çözünürlüğün daha geniş alıcı alan ve kanal gerektirdiği sezgisini verdim"
    hints:
      - "Genişliği √2 katına çıkarmak FLOP'u kaç katına çıkarır?"
    solution: |-
      Derinlik ×2 → FLOP ×2; genişlik ×√2 → ×2; çözünürlük ×√2 → ×2. Tan & Le (2019) tek eksende büyütmenin getirisinin hızla doyduğunu gösterdi; φ katsayısıyla $d=\alpha^\phi$, $w=\beta^\phi$, $r=\gamma^\phi$, $\alpha\beta^2\gamma^2\approx2$ (ızgara aramasıyla α = 1.2, β = 1.1, γ = 1.15) aynı FLOP'ta daha yüksek doğruluk verir.
pitfalls:
  - wrong: "Daha az FLOP her zaman daha hızlı çıkarım demektir."
    right: "Derinlemesine konvolüsyon gibi düşük aritmetik yoğunluklu katmanlar bellek sınırlıdır; gerçek süre donanıma bağlıdır — ölç."
  - wrong: "1 × 1 konvolüsyon uzamsal bilgi işlemez, işe yaramaz."
    right: "Kanallar arası karışım ve boyut azaltma yapar; darboğaz ve Inception'ın temelidir."
whatif:
  - q: "Gruplu konvolüsyonda grup sayısı = kanal sayısı olursa?"
    a: "Derinlemesine konvolüsyon elde edilir; grup sayısı 1 standart konvolüsyondur — ResNeXt ikisinin arasıdır."

labs:
  - id: l1
    lab: blockcost
    title: "Beş blok, aynı girdi/çıktı: parametre, MAC ve aritmetik yoğunluk"
    goal: |
      Aynı $C_{in}\to C_{out}$ dönüşümünü yapan standart konvolüsyonu, grup konvolüsyonunu, derinlemesine ayrılabilir bloğu, ResNet darboğazını ve MobileNetV2 ters artığını karşılaştır. Parametreyi ve çarpma–toplama sayısını (MAC) say; kaba bir bellek trafiği modeliyle her bloğun FLOP/bayt oranını (aritmetik yoğunluk) hesapla ve bir GPU'nun "sırt noktası" ile kıyasla.
    predict:
      q: "C_in = 128, C_out = 256, 3×3: derinlemesine ayrılabilir blok standart konvolüsyonun MAC'inin yaklaşık ne kadarını yapar?"
      options:
        - {t: "Yarısını", why: "Oran 1/C_out + 1/K² ≈ 0.004 + 0.111."}
        - {t: "≈ %11.5'ini", ok: true, why: "1/256 + 1/9 = 0.115: yaklaşık 8.7 kat az. K² terimi baskın, C_out büyük olduğu sürece oran ≈ 1/K²."}
        - {t: "≈ %1'ini", why: "Kanal karışımı (1×1) hâlâ C_in·C_out MAC yapıyor."}
    presets:
      - {name: "Ders örneği (128 → 256, 3×3)", params: {Cin: 128, Cout: 256, K: 3, H: 28, g: 32, r: 4, t: 6}, note: "Ayrılabilir 8.7 kat az MAC; ama derinlemesine katmanın yoğunluğu ≈ 2 FLOP/B."}
      - {name: "ResNet-50 aşama 3 darboğazı", params: {Cin: 512, Cout: 512, K: 3, H: 28, r: 4, g: 32}, note: "Darboğaz standardın ≈ %12'si; ResNeXt (g = 32) aynı bütçeyle daha çok dal."}
      - {name: "MobileNetV2 tipik blok", params: {Cin: 32, Cout: 32, K: 3, H: 56, t: 6, g: 1, r: 4}, note: "Dar girdi/çıktı, 6 kat geniş derinlemesine ara katman: standart 32 → 32'den bile ucuz değil ama 192 kanallı temsili ucuza işliyor."}
      - {name: "Girdi katmanı (C_in = 3)", params: {Cin: 3, Cout: 32, K: 3, H: 224, g: 1}, note: "Uyarıya bak: 3 kanallık girdide derinlemesine konvolüsyon neredeyse işe yaramaz."}
      - {name: "Büyük çekirdek 7×7", params: {Cin: 256, Cout: 256, K: 7, H: 14, g: 32}, note: "K büyüdükçe ayrılabilirliğin kazancı artar (≈ 1/K²): ConvNeXt'in 7×7 derinlemesine katmanları."}
    questions:
      - q: "Grup konvolüsyonunda g = C_in = C_out olursa ne elde edilir?"
        a: "Derinlemesine konvolüsyon: her çıktı kanalı yalnız bir girdi kanalına bağlı. PyTorch'ta nn.Conv2d(C, C, K, groups=C)."
      - q: "MAC'i 9 kat azaltan bir blok GPU'da neden 9 kat hızlanmayabilir?"
        a: "Derinlemesine katman her ağırlığı ve her aktivasyonu az sayıda çarpmada kullanır: aritmetik yoğunluğu düşüktür, süreyi bellek trafiği belirler (roofline modeli). Ayrıca çekirdek başlatma ve ara aktivasyonları belleğe yazma gibi sabit maliyetler küçük katmanlarda oransal olarak büyür."
    limits: "Bias, BN, aktivasyon ve artık toplama sayılmadı; bellek modeli her katmanın girdisini, ağırlığını ve çıktısını bir kez okuyup yazdığını varsayar (önbellek yeniden kullanımı, birleştirilmiş çekirdekler ve batch yok). Sırt noktası tek bir örnek donanım değeridir."
  - id: l2
    lab: sepkernel
    title: "Hangi çekirdek ayrılabilir? SVD ile rank"
    goal: |
      Bir $K\times K$ çekirdek iki 1-B çekirdeğin dış çarpımıysa (rank 1) önce dikey sonra yatay konvolüsyonla $K^2$ yerine $2K$ çarpımla uygulanır. SVD her çekirdeği rank-1 terimlerin toplamına ayırır; tekil değerlere bakarak çekirdeğin rankını ve rank-$r$ yaklaşıklığın hatasını ölç.
    predict:
      q: "Gauss'un Laplace'ı (LoG, kenar ve leke bulucu) kaç rank-1 terimle tam yazılır?"
      options:
        - {t: "1 — Gauss ayrılabilir, türevi de", why: "Laplace iki ikinci türevin toplamıdır; toplam ayrılabilirliği bozar."}
        - {t: "2", ok: true, why: "∇²G = G''(x)G(y) + G(x)G''(y): iki ayrılabilir terimin toplamı."}
        - {t: "K (tam rank)", why: "Yapısı çok daha basit."}
    presets:
      - {name: "Gauss", params: {type: 0, K: 7, sig: 1.2, rk: 1}, note: "Tek tekil değer: tam ayrılabilir. g(x, y) = g(x)·g(y)."}
      - {name: "Sobel benzeri", params: {type: 2, K: 5, rk: 1}, note: "Düzleştirme ⊗ türev: rank 1 (slayttaki [1, 2, 1] örneğinin genellemesi)."}
      - {name: "LoG, rank 1", params: {type: 3, K: 9, sig: 1.5, rk: 1}, note: "Tek terim yetmez; ikinci tekil değer büyük."}
      - {name: "LoG, rank 2", params: {type: 3, K: 9, sig: 1.5, rk: 2}, note: "İki terimle tam."}
      - {name: "Disk", params: {type: 4, K: 9, rk: 2}, note: "Dairesel çekirdekler ayrılabilir değil; birkaç terim kaba bir yaklaşıklık."}
      - {name: "Rastgele", params: {type: 5, K: 5, rk: 1}, note: "Öğrenilmiş filtreler genelde tam ranklıdır: uzamsal ayrılabilirlik bir kısıt, bedava değil."}
    questions:
      - q: "Inception-v3'ün 7×7'yi 1×7 + 7×1 ile değiştirmesi hangi varsayımı yapar?"
        a: "Öğrenilmiş 7×7 filtrelerin rank 1 olduğunu (ya da aradaki doğrusalsızlık ve birden çok kanal sayesinde bu kısıtın zararsız olduğunu). Parametre 49'dan 14'e iner; kısıt eğitimle uyum sağlanarak telafi edilir."
      - q: "Derinlemesine ayrılabilir konvolüsyon bu SVD anlamında bir ayrışım mı?"
        a: "Hayır: o kanal ve uzay boyutlarını ayırır (her kanalda bir K×K uzamsal filtre, sonra 1×1 kanal karışımı). Buradaki uzamsal ayrılabilirlik ise tek bir K×K çekirdeği iki 1-B çekirdeğe ayırır. İkisi de bir 'ayrılabilirlik' kısıtı, farklı eksenlerde."
    limits: "Tek kanallı, sabit çekirdekler. SVD AᵀA'nın özdeğerleriyle hesaplandığı için 10⁻⁷·σ₁ altındaki tekil değerler sayısal gürültüdür."
  - id: l3
    lab: camviz
    title: "GAP + doğrusal katman = nesneyi bulan bir harita (CAM)"
    goal: |
      Sabit konvolüsyon filtreleri + ReLU'nun üstüne küresel ortalama havuzlama ve bir softmax sınıflandırıcı koy; yalnız "bu görüntüde hangi çubuk var" etiketiyle eğit. Sonra sınıf aktivasyon haritasını $\mathrm{CAM}_c(x,y)=\sum_k w_{ck}f_k(x,y)$ çiz: model konum etiketi görmediği hâlde nesneyi yerelleştirir.
    predict:
      q: "Görüntüde hem dikey hem yatay bir çubuk varsa \"dikey çubuk\" sınıfının CAM'i nerede parlar?"
      options:
        - {t: "İki çubukta da eşit", why: "Yatay çizgi filtresinin dikey sınıf ağırlığı negatif ya da küçük."}
        - {t: "Yalnız dikey çubuğun üzerinde", ok: true, why: "CAM_c, c sınıfının skoruna piksel piksel katkıdır; dikey sınıf için yalnız dikey çizgi öznitelikleri pozitif katkı verir."}
        - {t: "Görüntünün ortasında", why: "GAP konumdan bağımsızdır ama haritanın kendisi değildir."}
    presets:
      - {name: "İki nesne", params: {cls: 1, px: 7, py: 15, dis: 1, noise: 0.3, n: 150, filt: 0}, note: "Her sınıfın haritası kendi nesnesini gösteriyor."}
      - {name: "Tek nesne", params: {cls: 0, px: 12, py: 8, dis: 0}, note: "Harita çubuğun üzerinde; tepe merkezden 1–2 piksel uzakta (çubuk boyunca)."}
      - {name: "Az veri, gürültülü", params: {n: 20, noise: 0.8}, note: "Doğruluk düşüyor, haritalar dağınık."}
      - {name: "Rastgele filtreler", params: {filt: 1, n: 150, noise: 0.3}, note: "Öznitelikler yönelime az seçici: hem doğruluk hem yerelleştirme bozuluyor. Gerçek ağda filtreler de öğrenilir."}
    questions:
      - q: "Logit'in CAM'in ortalaması olduğunu göster."
        a: "logit_c = Σ_k w_ck·(1/HW)Σ_{x,y} f_k(x,y) + b_c = (1/HW)Σ_{x,y} Σ_k w_ck f_k(x,y) + b_c = ortalama(CAM_c) + b_c. Toplamların yer değiştirmesi; GAP ve doğrusal katman doğrusal olduğu için kesin bir eşitlik."
      - q: "Düzleştir + tam bağlı katman kullansaydık CAM tanımlanabilir miydi?"
        a: "Doğrudan değil: FC her pikselin her kanalına ayrı ağırlık verir; 'kanal başına bir ağırlık' yapısı kaybolur. Grad-CAM bu durumda kanal ağırlıklarını gradyanların uzamsal ortalamasıyla tanımlar."
    limits: "Filtreler sabit (öğrenilmiyor), tek konvolüsyon katmanı, 24×24 sentetik görüntüler. Gerçek CNN'lerde son haritalar düşük çözünürlüklüdür ve CAM büyütülerek kaba bir yerelleştirme verir."
