hand:
  groups:
    - title: "Ders alıştırması 5 (Fashion-MNIST 28×28): eğitilebilir parametre"
      fields:
        - {id: cnn2, label: "CNN: 7×7×16 → havuz → 3×3×32 → havuz → 3×3×64 → havuz → FC 64 → 10 (same dolgu)", answer: 61514}
        - {id: fc3, label: "FC: 784 → 74 → 50 → 10", answer: 62350}
    - title: "Bloklar (bias yok)"
      fields:
        - {id: inc, label: "5×5 konv. 192 → 32 kanal: parametre", answer: 153600}
        - {id: incb, label: "Önce 1×1 ile 192 → 16, sonra 5×5 16 → 32: parametre", answer: 15872}
        - {id: sep, label: "3×3 konv. 128 → 256: standart / derinlemesine ayrılabilir oranı", answer: 8.69433962264151, tol: 1.0e-6}
        - {id: se, label: "SE, C = 256, r = 16: parametre (bias'lar dahil)", answer: 8464}
    - title: "LRN (AlexNet): $b=a/(k+\\alpha\\sum a^2)^\\beta$"
      fields:
        - {id: lrn, label: "a = 2, komşu kanallarda Σa² = 8, k = 2, α = 10⁻⁴, β = 0.75", answer: 1.1888504776892002, tol: 1.0e-6}
  verify: |
    conv = lambda k, ci, co: k * k * ci * co + co
    cnn2 = conv(7, 1, 16) + conv(3, 16, 32) + conv(3, 32, 64) + 3 * 3 * 64 * 64 + 64 + 64 * 10 + 10
    fc3 = 784 * 74 + 74 + 74 * 50 + 50 + 50 * 10 + 10
    answers = dict(cnn2=cnn2, fc3=fc3, inc=5 * 5 * 192 * 32, incb=192 * 16 + 5 * 5 * 16 * 32,
                   sep=(3 * 3 * 128 * 256) / (3 * 3 * 128 + 128 * 256), se=256 * 16 + 16 + 16 * 256 + 256, lrn=2 / (2 + 1e-4 * 8) ** 0.75)

stages:
  b: {engine: browser}
  c: {engine: browser}
