id: m4-4-lstm-gru
code: M4.4
title: LSTM ve GRU
phase: 4
minutes: 240
prereq: [m4-3-rnn]
summary: >
  Kapılı hücrelerle uzun bellek. Bir LSTM ve bir GRU adımını elle hesaplayıp
  hücre durumunun gradyanı neden taşıdığını görüyor, saf Python'da iki hücreyi
  PyTorch'un formülleriyle yazıyor, NumPy'da LSTM adımının ileri/geri
  geçişini kuruyor, PyTorch'ta `nn.LSTMCell` ile aynı sayıları veren kendi
  hücreni yazıyor ve en sonda farklı uzunluktaki dizileri maskeleyerek tek
  batch'te işliyorsun.
goals:
  - "LSTM'in dört kapısını (input, forget, cell, output) ve hücre durumu güncellemesini yazmak"
  - "$\\partial c_t/\\partial c_{t-1}=f_t$ ilişkisinin gradyanın uzun mesafe taşınmasını nasıl sağladığını göstermek"
  - "GRU'nun reset/update kapılarını PyTorch'un formülüyle uygulamak"
  - "Dört kapıyı tek bir matmul ile hesaplamak ve değişken uzunluklu dizileri maskeyle işlemek"
sources:
  - {title: "Hochreiter & Schmidhuber — Long Short-Term Memory", url: "https://www.bioinf.jku.at/publications/older/2604.pdf", license: "©", use: link}
  - {title: "Colah — Understanding LSTM Networks", url: "https://colah.github.io/posts/2015-08-Understanding-LSTMs/", license: "©", use: link}
  - {title: "Dive into Deep Learning §10.1–10.2 LSTM, GRU", url: "https://d2l.ai/chapter_recurrent-modern/index.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "CS231n Assignment 3 — LSTM (lstm_step_forward/backward)", url: "https://cs231n.github.io/assignments2025/assignment3/", license: "MIT", use: adapt}
  - {title: "PyTorch — nn.LSTMCell / nn.GRUCell formülleri", url: "https://docs.pytorch.org/docs/stable/generated/torch.nn.LSTMCell.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "LSTM adımı; kapı ön-aktivasyonları $a_i=0$, $a_f=1$, $a_g=1$, $a_o=0$; $c_{t-1}=0.5$"
      fields:
        - {id: f, label: "$f=\\sigma(a_f)$", answer: 0.731059, tol: 0.002, hint: "$1/(1+e^{-1})$"}
        - {id: c, label: "$c_t=f\\,c_{t-1}+i\\,g$", answer: 0.746326, tol: 0.003, hint: "$i=0.5$, $g=\\tanh1=0.7616$"}
        - {id: h, label: "$h_t=o\\tanh(c_t)$", answer: 0.316476, tol: 0.003, hint: "$o=0.5$; $\\tanh(0.7463)\\approx0.6331$"}
        - {id: dc, label: "$\\partial c_t/\\partial c_{t-1}$", answer: 0.731059, tol: 0.002, hint: "toplamsal yol: yalnız $f$"}
        - {id: car, label: "$f=0.9$ ile 10 adım: $\\prod f$", answer: 0.348678, tol: 0.002, hint: "$0.9^{10}$ — sade RNN'deki $0.25^{10}$ ile karşılaştır"}
    - title: "GRU: $z=0.5$, $h_{t-1}=0.4$, aday $n=\\tanh(0.8)$: $h_t=(1-z)\\,n+z\\,h_{t-1}$"
      fields:
        - {id: n, label: "$n$", answer: 0.664037, tol: 0.002}
        - {id: hg, label: "$h_t$", answer: 0.532018, tol: 0.002, hint: "$0.5\\cdot0.664+0.5\\cdot0.4$"}
  verify: |
    import math
    s = lambda x: 1 / (1 + math.exp(-x))
    i, f, g, o = s(0), s(1), math.tanh(1), s(0)
    c = f * 0.5 + i * g
    n = math.tanh(0.8)
    answers = dict(f=round(f, 6), c=round(c, 6), h=round(o * math.tanh(c), 6), dc=round(f, 6), car=round(0.9 ** 10, 6),
                   n=round(n, 6), hg=round(0.5 * n + 0.5 * 0.4, 6))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "LSTM'de gradyan neden RNN'e göre çok daha uzak geçmişe ulaşır?"
    options:
      - {t: "$c_t=f_t\\odot c_{t-1}+i_t\\odot g_t$ toplamsal; $\\partial c_t/\\partial c_{t-1}=f_t$ ağırlık matrisi ve tanh türevi içermez. Forget kapısı 1'e yakınken gradyan neredeyse kayıpsız taşınır", ok: true, why: "\"Constant error carousel\". Residual bağlantıyla (M4.2) aynı fikir: toplamsal yol."}
      - {t: "LSTM'in daha çok parametresi olduğu için", why: "Parametre sayısı değil, hücre durumunun toplamsal güncellemesi."}
      - {t: "Gradient clipping içerdiği için", why: "LSTM'in kendisi clipping içermez."}
  - q: "Forget kapısının bias'ı neden sıklıkla 1 (ya da daha büyük) başlatılır?"
    options:
      - {t: "Başlangıçta $f\\approx\\sigma(1)=0.73$ ya da daha yüksek olur; hücre varsayılan olarak hatırlar ve gradyan uzak geçmişe erişebilir", ok: true, why: "Jozefowicz et al. (2015) bunun LSTM performansını belirgin artırdığını gösterdi."}
      - {t: "Simetriyi kırmak için", why: "Simetriyi rastgele ağırlıklar kırar."}
      - {t: "Aşırı uyumu önlemek için", why: "Amaç optimizasyon, regularization değil."}
  - q: "Değişken uzunluklu dizileri tek batch'te işlerken maskeleme neden gerekir?"
    options:
      - {t: "Kısa diziler bitince dolgu (padding) adımları durumu değiştirmemeli; aksi hâlde son gizli durum dolguyla kirlenir", ok: true, why: "`pack_padded_sequence` ya da $h\\leftarrow m\\,h_{\\text{yeni}}+(1-m)\\,h$ maskesi. e aşamasında ikincisini yazıyorsun."}
      - {t: "Dolgu değerleri NaN olduğu için", why: "Dolgu genelde 0; sorun durumun güncellenmesi."}
      - {t: "Gerekli değil", why: "Son durum yanlış olur; kontrol bunu test ediyor."}

extras:
  - {id: x1, title: "Peephole LSTM ve bağlı giriş–unutma kapısı (CIFG)", engine: browser}
  - {id: x2, title: "Unutma kapısı bias'ı ve chrono başlatma", engine: browser}
  - {id: x3, title: "Hücre varyantlarının parametre sayıları", engine: browser}

homework:
  - title: "Greff ve ark. (2017): LSTM — bir arama uzayı yolculuğu"
    paper: "Greff, Srivastava, Koutník, Steunebrink, Schmidhuber — LSTM: A Search Space Odyssey (IEEE TNNLS 2017)"
    url: "https://arxiv.org/abs/1503.04069"
    level: orta
    hours: 12
    goal: |
      Makalenin sekiz varyantından altısını (standart, giriş kapısız, unutma kapısız, çıkış kapısız, peephole'suz, CIFG) PyTorch'ta tek bir yapılandırılabilir hücreyle yaz; karakter düzeyinde dil modellemesi (Shakespeare) ve x2'deki gibi bir "toplama problemi" üzerinde aynı hiperparametre bütçesiyle rastgele arama yap. Makale Şekil 3'ün küçük sürümü: varyant başına test hatası dağılımı; unutma kapısının ve çıkış aktivasyonunun kaldırılmasının en zararlı olduğunu doğrula.
    steps:
      - "Hiperparametre önemini fANOVA yerine basit bir doğrusal model + etkileşim terimleriyle tahmin et."
    accept:
      - "Unutma kapısız varyant uzun bağımlılık görevinde belirgin kötü."
      - "CIFG ve peephole'suz varyantlar standarda yakın."
  - title: "Cho ve ark. (2014): GRU ve kodlayıcı–kod çözücü"
    paper: "Cho, van Merriënboer, Gulcehre, Bahdanau, Bougares, Schwenk, Bengio — Learning Phrase Representations using RNN Encoder–Decoder for Statistical Machine Translation (EMNLP 2014)"
    url: "https://arxiv.org/abs/1406.1078"
    level: orta
    hours: 8
    goal: |
      Makalenin "gizli birim" (GRU) tanımını sıfırdan yaz ve M4.13'teki tarih çevirisi görevinde attention'sız kodlayıcı–kod çözücüde LSTM ile karşılaştır (eşit parametre bütçesi, x3). Makale Şekil 4'teki gibi, eğitilmiş kodlayıcının son gizli durumlarını (cümle temsilleri) PCA ile 2B'ye indirip benzer tarih biçimlerinin kümelendiğini göster; sıfırlama kapısı r'nin hangi girdi karakterlerinde kapandığını incele.
    steps:
      - "r ve z kapılarının zamana göre ortalama değerlerini ısı haritası olarak çiz."
    accept:
      - "GRU, eşit bütçede LSTM'e yakın doğruluk."
      - "Temsiller biçime/aya göre anlamlı kümeler oluşturur."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bir LSTM adımı, sayılarla
    goal: Kapıların hücre durumunu nasıl güncellediğini izlemek
    needs: Sigmoid, tanh
    q: |-
      $c_{t-1}=2$, kapılar $f=0.9$, $i=0.5$, $o=1.0$, aday $\tilde c=-1$. $c_t$ ve $h_t$?
    solution: |-
      $c_t=f\,c_{t-1}+i\,\tilde c=0.9\cdot2+0.5\cdot(-1)=1.3$. $h_t=o\tanh(c_t)=\tanh1.3=0.862$.

      **Okuma:** unutma kapısı eski belleğin %90'ını tuttu; giriş kapısı yeni adayın yarısını ekledi; çıkış kapısı hücrenin tamamını dışarı açtı. **Türev:** $\partial c_t/\partial c_{t-1}=f=0.9$ (doğrudan yol) — intro'daki türetim kutusu. Hücre durumu sınırsız büyüyebilir (toplamsal); $h$ ise tanh ile $(-1,1)$'de kalır.
  - id: p2
    type: hesap
    level: 1
    title: LSTM parametre sayısı
    goal: Kapı başına ağırlıkları saymak
    needs: P1
    q: |-
      Girdi $d=64$, gizli $h=128$, **tek** bias vektörü (kapı başına). LSTM hücresi kaç parametre?
    answer: 98816.0
    calc: "4*(128*(64+128)+128)"
    mistakes:
      - {answer: 99328.0, msg: "Bu PyTorch'un sayısı (b_ih ve b_hh ayrı: 8h bias); soru tek bias diyor."}
      - {answer: 74112.0, msg: "Üç kapı + aday: GRU'nun sayısı (3 blok). LSTM'de dört blok var (i, f, o, aday)."}
    hints:
      - "Dört blok, her biri $W\\in\\mathbb R^{h\\times(d+h)}$ + bias."
    solution: |-
      $4\cdot(128\cdot192+128)=98\,816$. GRU: 74 112 (¾'ü). PyTorch iki bias tuttuğu için `sum(p.numel())` 99 328 verir.
  - id: p3
    type: hesap
    level: 1
    title: Hücre yolunda 50 adım
    goal: Unutma kapısının bellek ufkunu sayıyla görmek
    needs: P1
    q: |-
      Unutma kapısı sürekli 0.98. Hücre yolunda 50 adım geriye ulaşan gradyan oranı?
    answer: 0.36416968008711675
    calc: "0.98**50"
    tol: 1e-4
    mistakes:
      - {answer: 49.0, msg: "Çarpanlar çarpılır: 0.98⁵⁰."}
    hints:
      - "Doğrudan yolda çarpan $f$."
    solution: |-
      $0.98^{50}=0.364$; düz RNN'de 0.9 çarpanla aynı mesafe 0.005 idi (M4.3 P3). Bellek ufku ≈ $1/(1-f)=50$ adım.
  - id: p4
    type: yöntem-seç
    level: 2
    title: LSTM mi GRU mu?
    goal: İki kapılı hücreyi koşula göre seçmek
    needs: P2
    q: |-
      Küçük bir veri setinde (10k dizi) mobil cihazda çalışacak bir model. LSTM mi GRU mu?
    choices:
      - {t: "LSTM: her zaman daha güçlü", why: "Karşılaştırmalı çalışmalar (Chung ve ark. 2014; Jozefowicz ve ark. 2015) çoğu görevde fark bulamadı."}
      - {t: "GRU: ~%25 daha az parametre ve hesap, benzer başarı; az veri ve kısıtlı donanımda iyi bir varsayılan", ok: true, why: "Ama bazı görevlerde (ör. sayma) LSTM'in ayrı hücre durumu avantajlıdır; ikisini de dene."}
      - {t: "Düz RNN", why: "Uzun bağımlılıkta kaybolan gradyan."}
    hints:
      - "Parametre farkı ve bilinen karşılaştırmalar."
    solution: |-
      GRU, unutma ve giriş kapılarını tek bir güncelleme kapısında birleştirir ($1-z$ ve $z$) ve ayrı hücre durumu tutmaz. Kesin üstünlük yok; az parametre küçük veri ve sınırlı donanımda avantaj.
  - id: p5
    type: kanıt
    level: 3
    title: Unutma kapısı bias'ını 1 başlatmak
    goal: Başlatmanın bellek ufkuna etkisini nicelendirmek
    needs: P3, sigmoid
    q: |-
      $f=\sigma(W_fx+U_fh+b_f)$, ağırlıklar küçük başlatılmış. $b_f=0$ ile $b_f=1$ için başlangıçta tipik $f$'yi ve bellek ufkunu ($1/(1-f)$) karşılaştır. Neden önerilir?
    rubric:
      - "Küçük ağırlıklarda ön-aktivasyonun ≈ b_f olduğunu söyledim"
      - "$\\sigma(0)=0.5$ → ufuk 2 adım; $\\sigma(1)=0.73$ → ≈ 3.7 adım buldum"
      - "Başlangıçta bilgiyi koruma eğiliminin gradyanın uzun mesafeye ulaşmasını sağladığını açıkladım"
      - "Chrono başlatmayı (b_f ~ log U(1, T−1)) bağlantılı olarak andım"
    hints:
      - "$\\sigma(1)=1/(1+e^{-1})$."
    solution: |-
      $b_f=0$: $f\approx0.5$, ufuk ≈ 2 adım — başlangıçta LSTM neredeyse her şeyi unutur, uzak bağımlılıkların gradyanı ulaşmaz. $b_f=1$: $f\approx0.73$, ufuk ≈ 3.7; daha büyük $b_f$ daha uzun. Jozefowicz ve ark. (2015) 1'in tutarlı kazanç sağladığını buldu; chrono başlatma (Tallec & Ollivier 2018) beklenen bağımlılık uzunluğu T'ye göre $b_f$'yi seçer (M4.4 ek alıştırması).
pitfalls:
  - wrong: "LSTM kaybolan gradyanı tamamen çözer."
    right: "Yalnız doğrudan hücre yolunda çarpanı f yapar; f küçük öğrenilirse ya da dolaylı yollarda gradyan yine söner/patlar."
  - wrong: "Gizli durum h ile hücre durumu c aynı şeydir."
    right: "c toplamsal bellek (sınırsız), h ise o ⊙ tanh(c): dışarıya açılan, sınırlı görünüm."
whatif:
  - q: "Unutma kapısı kaldırılırsa (ilk LSTM sürümü)?"
    a: "c_t = c_{t−1} + i ⊙ c̃: bellek hiç silinmez, uzun akışlarda c sınırsız büyür; Gers ve ark. (2000) unutma kapısını bu yüzden ekledi."
