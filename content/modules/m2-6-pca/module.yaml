id: m2-6-pca
code: M2.6
title: PCA ve SVD
phase: 2
minutes: 210
prereq: [m0-2-matmul, m0-4-probability]
summary: >
  Verinin en çok değiştiği yönler. 2×2 kovaryansın özdeğerlerini ve power
  iteration'ın bir adımını elle hesaplıyor, saf Python'da deflation ile ilk k
  bileşeni buluyor, NumPy'da SVD ile PCA ve yeniden kurma yapıyor, PyTorch'ta
  baş bileşeni Rayleigh bölümünü autograd ile maksimize ederek buluyor ve en
  sonda yüzlerce küçük veri setinin PCA'sını tek batched SVD ile alıyorsun.
goals:
  - "Kovaryans matrisinin [[özvektör|özvektörlerinin]] maksimum varyans yönleri olduğunu göstermek"
  - "Power iteration ve deflation ile en büyük özdeğerleri bulmak"
  - "Ortalanmış verinin SVD'si $X_c=USV^\\top$ ile PCA'yı ($V$ bileşenler, $s^2/(n-1)$ varyanslar) ilişkilendirmek"
  - "Özvektörlerin işaret belirsizliğini sabit bir kuralla gidermek"
  - "Rayleigh bölümü $\\frac{v^\\top Cv}{v^\\top v}$'yu gradyanla maksimize etmek"
sources:
  - {title: "Mathematics for Machine Learning — Bölüm 10 (PCA)", url: "https://mml-book.github.io/", license: "© (PDF ücretsiz)", use: link}
  - {title: "MIT 18.06 — Singular Value Decomposition (Strang)", url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", license: "CC BY-NC-SA 4.0", use: link}
  - {title: "ISLP — §12.2 Principal Components Analysis", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "PyTorch — torch.linalg.svd / eigh (batched)", url: "https://docs.pytorch.org/docs/stable/generated/torch.linalg.svd.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "Kovaryans $C=\\begin{bmatrix}2&1\\\\1&2\\end{bmatrix}$; $\\det(C-\\lambda I)=(2-\\lambda)^2-1=0$"
      fields:
        - {id: l1, label: "$\\lambda_1$ (büyük)", answer: 3, hint: "$2-\\lambda=\\pm1$"}
        - {id: l2, label: "$\\lambda_2$", answer: 1}
        - {id: v1x, label: "$v_1$'in 1. bileşeni (birim, pozitif)", answer: 0.707107, tol: 0.002, hint: "$(C-3I)v=0\\Rightarrow v\\propto(1,1)$, normu $\\sqrt2$"}
        - {id: ratio, label: "1. bileşenin açıkladığı varyans oranı", answer: 0.75, tol: 0.001, hint: "$3/(3+1)$"}
        - {id: proj, label: "$x=(2,0)$'ın $v_1$ üzerine izdüşümü $x\\cdot v_1$", answer: 1.414214, tol: 0.002, hint: "$2\\cdot0.7071$"}
    - title: "Power iteration $v\\leftarrow Cv/\\lVert Cv\\rVert$, $v_0=(1,0)$"
      fields:
        - {id: p1x, label: "$v_1$'in 1. bileşeni (bir adım)", answer: 0.894427, tol: 0.002, hint: "$Cv_0=(2,1)$, normu $\\sqrt5$"}
        - {id: p1y, label: "… 2. bileşeni", answer: 0.447214, tol: 0.002, hint: "$1/\\sqrt5$"}
        - {id: rq, label: "Rayleigh $v^\\top Cv$ (bir adım sonra)", answer: 2.8, tol: 0.002, hint: "$2(0.8)+2\\cdot0.4+2(0.2)$; gerçek $\\lambda_1=3$'e yaklaşıyor"}
  verify: |
    import math
    v = (2 / math.sqrt(5), 1 / math.sqrt(5))
    rq = 2 * v[0] ** 2 + 2 * v[0] * v[1] + 2 * v[1] ** 2
    answers = dict(l1=3, l2=1, v1x=round(1 / math.sqrt(2), 6), ratio=0.75, proj=round(2 / math.sqrt(2), 6),
                   p1x=round(v[0], 6), p1y=round(v[1], 6), rq=round(rq, 6))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "PCA'dan önce veriyi neden ortalarız?"
    options:
      - {t: "PCA varyans yönlerini arar; ortalanmamış veride ilk bileşen çoğu zaman yalnız orijinden ortalamaya giden yönü gösterir", ok: true, why: "Ortalamadan uzaklık bir varyans değildir. $X_c=X-\\bar x$ ile $\\frac1{n-1}X_c^\\top X_c$ gerçekten kovaryanstır."}
      - {t: "SVD yalnız ortalanmış matriste çalışır", why: "SVD her matriste çalışır; ortalamazsan farklı (yanlış) bir şey hesaplarsın."}
      - {t: "Gerekmez", why: "Gerekir; c aşamasında kontrol bunu test ediyor."}
  - q: "Kovaryans matrisini kurup `eigh` yapmak yerine $X_c$'nin SVD'sini almak neden tercih edilir?"
    options:
      - {t: "$X^\\top X$ koşul sayısının karesini alır; küçük özdeğerler kayan noktada kaybolur. SVD doğrudan $X$ üzerinde çalışır", ok: true, why: "$\\kappa(X^\\top X)=\\kappa(X)^2$. $d\\gg n$ olduğunda SVD ayrıca $d\\times d$ matrisi hiç kurmaz."}
      - {t: "eigh yanlış sonuç verir", why: "Matematiksel olarak aynı; fark sayısal kararlılık ve maliyette."}
      - {t: "SVD her zaman daha hızlıdır", why: "$n\\gg d$ iken $d\\times d$ eigh daha ucuz olabilir; ana fark kararlılık."}
  - q: "Bir özvektörün işareti neden belirsizdir ve neden önemli?"
    options:
      - {t: "$v$ özvektörse $-v$ de öyle; farklı kütüphaneler/çalıştırmalar farklı işaret döndürür, testler ve görselleştirmeler kararsız olur", ok: true, why: "Bu modülde kural: her bileşenin mutlak değerce en büyük elemanı pozitif."}
      - {t: "Negatif özvektör negatif varyans demektir", why: "Varyans özdeğerdir, işaretten bağımsız."}
      - {t: "Belirsiz değildir", why: "$C(-v)=\\lambda(-v)$."}

homework:
  - title: "Halko, Martinsson, Tropp (2011): rastgele matris ayrışımları"
    paper: "Halko, Martinsson, Tropp — Finding Structure with Randomness: Probabilistic Algorithms for Constructing Approximate Matrix Decompositions (SIAM Review 2011)"
    url: "https://arxiv.org/abs/0909.4061"
    level: orta
    hours: 8
    goal: |
      Rastgele SVD'yi (Algoritma 4.1 + 5.1) yaz: Gauss test matrisi, aşırı örnekleme p ve q güç yinelemesi. Tekil değerleri yavaş ve hızlı sönen matrislerde (ör. görüntü yamaları, sentetik spektrumlar) rank-k yaklaşım hatasını kuramsal sınırla (Bölüm 10) ve np.linalg.svd ile karşılaştır; süre ölçeklemesini büyük matrislerde ölç. sklearn PCA(svd_solver='randomized') ile aynı sonucu verdiğini göster.
    steps:
      - "Güç yinelemesinde her adımda QR ile yeniden ortogonalleştir."
    accept:
      - "Hata kesin SVD'nin σ_{k+1}'ine yakın; q arttıkça iyileşir."
      - "Büyük matrislerde belirgin hızlanma."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: 2 × 2 kovaryansta bileşenler
    goal: Özdeğer ve açıklanan varyans oranını elle bulmak
    needs: Intro'daki türetim kutusu, karakteristik polinom
    q: |-
      $S=\begin{bmatrix}2&1\\1&2\end{bmatrix}$. Ana bileşenleri ve birinci bileşenin açıkladığı varyans oranını bul.
    solution: |-
      **Özdeğerler:** $\det(S-\lambda I)=(2-\lambda)^2-1=0\Rightarrow\lambda=3,\,1$. Kontrol: toplam = iz = 4, çarpım = det = 3 ✓.

      **Özvektörler:** $\lambda=3$: $(S-3I)u=0\Rightarrow-u_1+u_2=0\Rightarrow u=\frac1{\sqrt2}(1,1)$. $\lambda=1$: $u=\frac1{\sqrt2}(1,-1)$ — birbirine dik ✓.

      **Oran:** $3/(3+1)=0.75$. Veri en çok $x_1=x_2$ köşegeni boyunca değişir (iki öznitelik pozitif ilişkili: kovaryans 1). Tek bileşenle izdüşürmek varyansın %25'ini, yani $(1,-1)$ yönündeki farkları atar.
  - id: p2
    type: hesap
    level: 1
    title: İki bileşenin açıkladığı varyans
    goal: Açıklanan varyans oranını hesaplamak
    needs: P1
    q: |-
      Özdeğerler $[5,3,1,1]$. İlk iki bileşenin açıkladığı varyans oranı?
    answer: 0.8
    calc: "(5+3)/10"
    mistakes:
      - {answer: 0.5, msg: "Bu yalnız ilk bileşen; ikinciyi (3) ekle."}
      - {answer: 0.8888888888888888, msg: "Payda tüm özdeğerlerin toplamı: 5 + 3 + 1 + 1 = 10."}
    hints:
      - "Toplam varyans = özdeğerlerin toplamı = kovaryansın izi."
    solution: |-
      $8/10=0.8$.
  - id: p3
    type: hesap
    level: 1
    title: Kuvvet iterasyonunun bir adımı
    goal: Kuvvet iterasyonunu uygulamak
    needs: Matris–vektör çarpımı, normalizasyon
    q: |-
      $S$ P1'deki gibi, $v_0=(1,0)$. $v_1=Sv_0/\|Sv_0\|$'nin birinci bileşeni?
    answer: 0.8944271909999159
    calc: "2/math.sqrt(5)"
    tol: 1e-3
    mistakes:
      - {answer: 2.0, msg: "Normalize etmeyi unuttun: Sv₀ = (2, 1), ‖·‖ = √5."}
      - {answer: 0.7071067811865475, msg: "Bu yakınsanan değer (birinci özvektör); tek adım henüz orada değil."}
    hints:
      - "$Sv_0=(2,1)$."
    solution: |-
      $(2,1)/\sqrt5=(0.894,0.447)$. Her adımda $\lambda_2/\lambda_1=1/3$ oranında ikinci özvektör bileşeni söner; yakınsama hızı özdeğer boşluğuna bağlıdır.
  - id: p4
    type: hata-bul
    level: 2
    title: Merkezlemeyi unutmak
    goal: PCA'nın ortalamayı çıkarma adımının gerekliliğini görmek
    needs: Kovaryans tanımı
    q: |-
      Bir öğrenci `U, S, Vt = np.linalg.svd(X)` ile PCA yapıyor (X merkezlenmemiş, tüm değerler 100 civarında). Birinci "bileşen" hep yaklaşık $(1,1,\dots,1)/\sqrt d$ çıkıyor. Neden?
    choices:
      - {t: "Verideki en büyük varyans yönü gerçekten bu", why: "Değil: merkezlenmemiş veride SVD, ikinci momenti (ortalama dahil) çözümler."}
      - {t: "Merkezlenmemiş SVD XᵀX'i çözümler; ortalama vektörü (100, …, 100) baskın yön olur. Önce X − ortalama", ok: true, why: "Kovaryans merkezlenmiş verinin XᵀX/n'sidir."}
      - {t: "Öznitelikler standartlaştırılmamış", why: "Ölçek sorunu ayrı bir konu; sabit yönün nedeni ortalama."}
    hints:
      - "$X^\\top X/n$, merkezlenmemişken kovaryansa eşit mi?"
    solution: |-
      $\frac1nX^\top X=S+\mu\mu^\top$. $\|\mu\|$ büyük olduğundan baskın özvektör $\mu$ yönüdür. Merkezlemek (`X - X.mean(0)`) bu terimi kaldırır. (Seyrek veride merkezleme yoğunluğu bozduğu için bazen bilinçli olarak yapılmaz: TruncatedSVD/LSA.)
  - id: p5
    type: karşı-örnek
    level: 3
    title: Ayırt edici bilgi düşük varyanslı yönde
    goal: PCA'nın denetimsiz olmasının bedelini göstermek
    needs: LDA (fikir düzeyinde)
    q: |-
      İki sınıflı bir 2B veri kümesi tarif et: PCA'nın birinci bileşenine izdüşürünce sınıflar tamamen karışsın, ikinci bileşende mükemmel ayrılsın. Hangi yöntem bunu kendiliğinden doğru yapar?
    rubric:
      - "Sınıfların x₁ boyunca uzun (büyük varyans), x₂ boyunca küçük ama farklı ortalamalı olduğu bir örnek verdim"
      - "PCA'nın etiketleri kullanmadığını, yalnız toplam varyansa baktığını söyledim"
      - "LDA'nın sınıf içi varyansa göre sınıflar arası ayrımı en büyüklediğini ve doğru yönü seçtiğini söyledim"
    hints:
      - "İki uzun, paralel, birbirine yakın şerit düşün."
    solution: |-
      Sınıf A: $x_1\sim U(-10,10)$, $x_2=+0.5+$ küçük gürültü; sınıf B: aynı ama $x_2=-0.5$. Toplam varyans $x_1$ boyunca ≫: PCA1 = $x_1$, izdüşümde sınıflar üst üste. Ayrım $x_2$'de. LDA $\max\frac{w^\top S_Bw}{w^\top S_Ww}$ ile $x_2$'yi seçer. Ders: boyut indirgemeyi aşağıdaki görevi göz önüne almadan yapmak bilgi atabilir.
  - id: p6
    type: hesap
    level: 2
    title: SVD'den özdeğere
    goal: SVD ile kovaryans özayrışımı arasındaki ilişkiyi kullanmak
    needs: SVD
    q: |-
      Merkezlenmiş $X$ (n = 9 satır) için en büyük tekil değer $s_1=6$. Kovaryansın ($S=X^\top X/n$) en büyük özdeğeri?
    answer: 4.0
    calc: "6**2/9"
    mistakes:
      - {answer: 0.6666666666666666, msg: "Özdeğer tekil değerin karesine karşılık gelir: XᵀX = V S² Vᵀ."}
      - {answer: 4.5, msg: "Bu yansız (n − 1) kovaryans; soru S = XᵀX/n tanımını kullanıyor."}
    hints:
      - "$X=U\\Sigma V^\\top\\Rightarrow X^\\top X=V\\Sigma^2V^\\top$."
    solution: |-
      $36/9=4$. Pratikte PCA SVD ile yapılır: kovaryansı kurmak koşul sayısının karesini alır ve sayısal olarak daha kötüdür.
pitfalls:
  - wrong: "PCA bileşenleri anlamlı, yorumlanabilir etkenlerdir."
    right: "Bileşenler yalnız varyansı en büyükleyen dik yönlerdir; işaretleri keyfidir, karışık yorumlanır (yorum için seyrek PCA/faktör analizi)."
  - wrong: "Öznitelikleri ölçeklemeden PCA uygulamak sorun değil."
    right: "Birimi büyük öznitelik toplam varyansa hâkim olur; farklı birimlerde standartlaştır (korelasyon matrisi PCA'sı)."
  - wrong: "Test verisinin ortalamasıyla merkezle."
    right: "Ortalama ve bileşenler yalnız eğitim verisinden öğrenilir, test verisine aynen uygulanır (sızıntı)."
whatif:
  - q: "Veri doğrusal olmayan bir manifold üzerindeyse (ör. İsviçre rulosu)?"
    a: "PCA doğrusal alt uzay arar; manifoldu açamaz. Çekirdek PCA, Isomap, t-SNE/UMAP ya da otomatik kodlayıcılar (M5.6) gerekir."
  - q: "Özdeğerler hepsi eşitse?"
    a: "Hiçbir yön ayrıcalıklı değildir (izotropik veri); bileşenler tek değildir ve boyut indirgemenin anlamı yoktur."

labs:
  - id: l1
    lab: pca2d
    title: "Bir yön seç: korunan varyans ve yeniden kurma hatası"
    goal: |
      Ortalanmış 2B veri. Turuncu doğru senin seçtiğin yön θ; turuncu noktalar izdüşümler, gri parçalar artıklar (yeniden kurma hataları). Yeşil ok birinci temel bileşen. Sağda, tüm yönler için korunan varyans ve kaybedilen varyans: ikisinin toplamı sabit.
    predict:
      q: "θ'yı PC1'e dik yaparsan korunan varyans ne olur?"
      options:
        - {t: "En küçük değerine, λ₂'ye iner; hata en büyük olur", ok: true, why: "Korunan varyans λ₁cos² + λ₂sin² biçiminde: dik yönde λ₂."}
        - {t: "Sıfır olur", why: "Ancak veri tam bir doğru üzerindeyse (λ₂ = 0)."}
        - {t: "Toplam varyansın yarısı olur", why: "Bu, yalnız λ₁ = λ₂ iken (ya da 45°'de değil) geçerli değildir."}
    presets:
      - {name: "Seçili = PC1", params: {th: 30, rot: 30}, note: "Artıklar en kısa, korunan varyans en büyük."}
      - {name: "Dik yön", params: {th: 120, rot: 30}, note: "Korunan varyans λ₂: en kötü 1-B özet."}
      - {name: "İzotropik", params: {s1: 1, s2: 1, th: 60}, note: "λ₁ ≈ λ₂: her yön neredeyse eşit; PC1 tohumdan tohuma döner."}
      - {name: "Aykırı nokta", params: {s1: 2, s2: 0.4, rot: 0, th: 0, out: 1}, note: "Tek nokta PC1'i yukarı doğru çeviriyor."}
    questions:
      - q: "Sağ grafikteki iki eğrinin toplamı neden her θ'da aynı?"
        a: "Her nokta için ‖x‖² = (izdüşüm)² + (artık)² (Pisagor). Toplam varyans = iz(C) = λ₁ + λ₂, yönden bağımsız."
      - q: "Verinin açısını değiştirirsen λ₁ ve λ₂ değişir mi?"
        a: "Hayır (örnekleme gürültüsü dışında): döndürme özdeğerleri korur, yalnız özvektörleri döndürür."
    limits: "2B Gauss veri; kovaryans n − 1 ile. Aykırı nokta veri ortalamasına da katılır."
  - id: l2
    lab: powerit
    title: "Kuvvet yinelemesi: hız özdeğer oranına bağlı"
    goal: |
      2 × 2 simetrik bir matris (baş özdeğer 1, ikincisi oranla verilir). Sol: ilk yinelemeler birim çember üzerinde, yeşil doğru baş özvektör. Sağ: açı hatası ve kuramsal $|\lambda_2/\lambda_1|^t$.
    predict:
      q: "λ₂/λ₁ = 0.9 iken 10⁻⁶ hataya kabaca kaç adımda inilir?"
      options:
        - {t: "~130 adım", ok: true, why: "log(10⁻⁶)/log 0.9 ≈ 131."}
        - {t: "~6 adım", why: "Bu, oran 0.1 olsaydı."}
        - {t: "Hiç inilmez", why: "Oran < 1 olduğu sürece geometrik olarak iner; yalnız yavaş."}
    presets:
      - {name: "Hızlı", params: {ratio: 0.2, T: 15}, note: "Her adımda hata 5'te birine iner."}
      - {name: "Yavaş", params: {ratio: 0.95, T: 60}, note: "Neredeyse eşit özdeğerler: çok yavaş."}
      - {name: "Negatif λ₂", params: {ratio: -0.7, T: 20}, note: "Yaklaşım iki yandan, zikzak yaparak."}
      - {name: "Neredeyse dik başlangıç", params: {ratio: 0.5, ang0: 114, T: 40}, note: "Başlangıç baş özvektöre neredeyse dik (25° + 90°): ilk hata ~1, ama oran aynı olduğu için yine geometrik iner."}
    questions:
      - q: "Başlangıç tam dik (a₁ = 0) olsaydı ne olurdu?"
        a: "Kesin aritmetikte Cᵗv₀ hep e₂ yönünde kalır, e₁ hiç bulunmaz. Kayan noktada küçük yuvarlama hataları bir a₁ bileşeni yaratır ve yöntem sonunda kurtulur."
    limits: "2 × 2 matris, baş özdeğer 1, özvektör 25°'de. Gerçek uygulamalarda boyut büyüktür ama yakınsama analizi aynıdır."
  - id: l3
    lab: svdcompress
    title: "Görüntü bir matristir: rank-k yaklaşım ve gürültü giderme"
    goal: |
      48 × 48 gri tonlu bir görüntünün SVD'si tarayıcında hesaplanır (Jacobi yöntemi). Sol üst: girdi; sağ üst: yalnız ilk k tekil değerle kurulan görüntü. Alt: tekil değer spektrumu ve rank'a göre hata.
    predict:
      q: "'Pürüzsüz doku' görüntüsünü kusursuz kurmak için kaç bileşen gerekir?"
      options:
        - {t: "Birkaç (≤ 4): görüntü sinüs çarpımlarından oluşuyor, rank'ı çok düşük", ok: true, why: "sin(12x)cos(7y) bir dış çarpımdır (rank 1), sin(5y) ve sabit terim birer rank daha ekler."}
        - {t: "48", why: "Tam rank yalnız rastgele ya da çok ayrıntılı görüntülerde gerekir."}
        - {t: "~24", why: "Spektrum grafiğine bak: birkaç bileşenden sonra σ'lar sayısal sıfır."}
    presets:
      - {name: "Şekiller, k = 4", params: {img: 0, k: 4, noise: 0}, note: "Bulanık: kenarlar birçok bileşen ister."}
      - {name: "Şekiller, k = 16", params: {img: 0, k: 16, noise: 0}, note: "Neredeyse kusursuz; özgün verinin ~%67'si kadar sayı (16 · 97 = 1552)."}
      - {name: "Doku, k = 3", params: {img: 1, k: 3, noise: 0}, note: "Düşük ranklı görüntü: birkaç bileşen yeter."}
      - {name: "Gürültü giderme", params: {img: 0, k: 6, noise: 0.15}, note: "Rank-6, temiz görüntüye gürültülü girdiden daha yakın (tabloya bak)."}
      - {name: "Gürültü geri geliyor", params: {img: 0, k: 40, noise: 0.15}, note: "Büyük k gürültüyü de kurar."}
    questions:
      - q: "Gürültü eklenince spektrumun kuyruğu neden düzleşiyor?"
        a: "Bağımsız gürültü matrisinin tekil değerleri birbirine yakın, düz bir dağılım oluşturur (yaklaşık σ√N civarında). Sinyalin büyük tekil değerleri bunun üstünde kalır; kuyruk gürültüye aittir."
      - q: "Rank-k görüntüyü saklamak için kaç sayı gerekir?"
        a: "k tekil değer + k sol + k sağ tekil vektör: k(2N + 1). N = 48, k = 8 için 776 sayı (özgün 2304)."
    limits: "Küçük (48 × 48) yapay görüntüler; SVD, AᵀA'nın Jacobi özdeğer ayrışımıyla hesaplanır (küçük boyut için yeterli doğruluk). Gerçek görüntü sıkıştırma (JPEG) sabit bir taban (DCT) kullanır, veriye uyarlanmış SVD değil."
