id: m4-12-word2vec
code: M4.12
title: Kelime gömmeleri — one-hot, OOV, word2vec
phase: 4
minutes: 380
prereq: [m4-5-embed-bpe]
summary: >
  Kategorik bir özniteliği (ör. ocean_proximity) ya da bir kelimeyi ağa
  vermek: one-hot kodlama ve sözlük dışı (OOV) kovaları, one-hot + biassız
  yoğun katman = embedding katmanı, "10'dan az kategori one-hot, 50'den
  fazla embedding" kuralı. Ardından word2vec (Mikolov ve ark. 2013):
  skip-gram ve CBOW, negatif örneklemeli kayıp ve gradyanları elle,
  unigram^0.75 gürültü dağılımı ve sık kelime alt-örneklemesi; NumPy'da
  döngüsüz toplu SGNS ile analojilerin (kral − erkek + kadın ≈ kraliçe)
  ortaya çıkışı, PyTorch'ta nn.Embedding, seyrek gradyanlar ve CBOW,
  sonda tam softmax ile negatif örneklemenin maliyet farkı. Ekler:
  PPMI + SVD (sayım tabanlı gömmeler), Huffman ağaçlı hiyerarşik softmax ve
  fastText alt-kelime n-gramları.
goals:
  - "One-hot vs embedding; [[oov kovası]]; one-hot × W = satır seçimi"
  - "[[skip-gram]] ve CBOW; [[negatif örnekleme]] kaybı ve gradyanı elle"
  - "Toplu SGNS'i `np.add.at` ile döngüsüz yazıp analojileri ölçmek"
  - "SGNS ≈ kaydırılmış PMI'nin çarpanlara ayrılması; hiyerarşik softmax; alt-kelime vektörleri"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 13 ve 16", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Mikolov ve ark. — Efficient Estimation of Word Representations in Vector Space (2013)", url: "https://arxiv.org/abs/1301.3781", license: "arXiv", use: link}
  - {title: "Mikolov ve ark. — Distributed Representations of Words and Phrases and their Compositionality (NeurIPS 2013)", url: "https://arxiv.org/abs/1310.4546", license: "arXiv", use: link}
  - {title: "Levy & Goldberg — Neural Word Embedding as Implicit Matrix Factorization (NeurIPS 2014)", url: "https://papers.nips.cc/paper/2014/hash/feab05aa91085b7a8012516bc3533958-Abstract.html", license: "©", use: link}
  - {title: "Pennington, Socher, Manning — GloVe (EMNLP 2014)", url: "https://nlp.stanford.edu/pubs/glove.pdf", license: "©", use: link}
  - {title: "Bojanowski ve ark. — Enriching Word Vectors with Subword Information (fastText, TACL 2017)", url: "https://arxiv.org/abs/1607.04606", license: "arXiv", use: link}
  - {title: "Stanford CS224n — Lecture 1–2, Assignment 2 (word2vec)", url: "https://web.stanford.edu/class/cs224n/", license: "©", use: link}

hand:
  groups:
    - title: "One-hot, OOV, embedding"
      fields:
        - {id: d2, label: "İki farklı one-hot vektör arasındaki Öklid uzaklığının karesi", answer: 2}
        - {id: oov, label: "10 000 kelimelik sözlük + 100 OOV kovası: one-hot vektör boyu", answer: 10100}
        - {id: emb, label: "20 kategori, 10 boyutlu embedding = one-hot + biassız yoğun katman: parametre", answer: 200}
    - title: "Skip-gram ve negatif örnekleme"
      fields:
        - {id: pairs, label: "5 kelimelik cümle, pencere 2: (merkez, bağlam) çifti sayısı", answer: 14}
        - {id: loss, label: "$u_o\\cdot v_c=1$, iki negatif $u_k\\cdot v_c\\in\\{0,-1\\}$: $J=-\\log\\sigma(u_o^\\top v_c)-\\sum_k\\log\\sigma(-u_k^\\top v_c)$", answer: 1.3196705557466014, tol: 1.0e-6}
        - {id: grad, label: "1 boyutlu: $v_c=1$, $u_o=1$, $u_1=0$, $u_2=-1$ → $\\partial J/\\partial v_c$", answer: -0.5378828427399902, tol: 1.0e-6}
        - {id: noise, label: "İki kelime, sayılar 81 ve 16: $P_n\\propto c^{3/4}$ ile ilkinin olasılığı", answer: 0.7714285714285715, tol: 1.0e-6}
        - {id: disc, label: "Alt-örnekleme: frekans $f=10^{-3}$, $t=10^{-5}$ → atılma olasılığı $1-\\sqrt{t/f}$", answer: 0.9, tol: 1.0e-9}
  verify: |
    import math
    sig = lambda x: 1 / (1 + math.exp(-x))
    answers = dict(d2=2, oov=10100, emb=200, pairs=sum(len([j for j in range(max(0, i - 2), min(5, i + 3)) if j != i]) for i in range(5)),
                   loss=-math.log(sig(1)) - math.log(sig(0)) - math.log(sig(1)),
                   grad=(sig(1) - 1) * 1 + sig(0) * 0 + sig(-1) * (-1), noise=81 ** 0.75 / (81 ** 0.75 + 16 ** 0.75),
                   disc=1 - math.sqrt(1e-5 / 1e-3))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Sayım tabanlı gömmeler: PPMI + SVD", engine: browser}
  - {id: x2, title: "Hiyerarşik softmax ve Huffman ağacı", engine: browser}
  - {id: x3, title: "fastText: alt-kelime n-gramlarıyla OOV vektörleri", engine: browser}

quiz:
  - q: "One-hot kodlamanın kelimeler için temel kusuru nedir?"
    options:
      - {t: "Boyut sözlük kadar büyür ve tüm vektörler ortonormaldir: her iki kelime arasındaki uzaklık aynı (karesi 2), iç çarpım 0 — benzerlik bilgisi yoktur", ok: true, why: "Embedding'ler öğrenilir ve benzer anlamlar yakınlaşır."}
      - {t: "Öğrenilebilir olması", why: "One-hot öğrenilmez."}
      - {t: "Negatif değer içermesi", why: "İçermez."}
  - q: "Negatif örnekleme tam softmax'ı neden ucuzlatır?"
    options:
      - {t: "Her (merkez, bağlam) çifti için V sınıflı normalizasyon yerine 1 pozitif + k negatif ikili lojistik regresyon yapılır: maliyet O(V) yerine O(k)", ok: true, why: "e aşamasında V büyüdükçe fark açılır."}
      - {t: "Gradyanı sıfırlayarak", why: "Hayır."}
      - {t: "Embedding boyutunu azaltarak", why: "Boyut değişmez."}
  - q: "Gürültü dağılımında neden unigram sayısının 3/4 kuvveti kullanılır?"
    options:
      - {t: "Dağılımı düzleştirir: nadir kelimeler daha sık negatif örnek olur, 'the' gibi çok sık kelimelerin baskınlığı azalır (deneysel olarak en iyi)", ok: true, why: "Mikolov ve ark. 2013b."}
      - {t: "Olasılıkları normalize etmek için", why: "Normalizasyon ayrıca yapılır."}
      - {t: "Matematiksel olarak zorunlu", why: "Deneysel bir seçim."}

homework:
  - title: "Mikolov ve ark. (2013b): word2vec'in tam sürümü"
    paper: "Mikolov, Sutskever, Chen, Corrado, Dean — Distributed Representations of Words and Phrases and their Compositionality (NeurIPS 2013)"
    url: "https://arxiv.org/abs/1310.4546"
    level: orta
    hours: 12
    goal: |
      text8 (Wikipedia'nın ilk 100 MB'ı) üzerinde d aşamasındaki SGNS'i alt-örnekleme (Denk. 5), dinamik pencere ve doğrusal azalan öğrenme oranıyla eğit; makaledeki analoji test setinin (Google analogy) anlamsal ve sözdizimsel bölümlerinde doğruluğu raporla. Ardından ifade (phrase) birleştirmeyi uygula: $\mathrm{score}(w_i,w_j)=(c(w_iw_j)-\delta)/(c(w_i)c(w_j))$ ile "new_york" gibi bigramları tek token yap ve vektör toplamsallığını (Tablo 5) göster.
    steps:
      - "Alt-örnekleme olmadan / ile eğitim süresi ve analoji doğruluğu tablosu."
    accept:
      - "Anlamsal analojilerde %30'un üzerinde doğruluk (text8, d = 100)."
      - "Alt-örnekleme eğitimi hızlandırır ve nadir kelimelerin vektörlerini iyileştirir."
  - title: "Levy & Goldberg (2014): SGNS = kaydırılmış PMI'nin çarpanlara ayrılması"
    paper: "Levy & Goldberg — Neural Word Embedding as Implicit Matrix Factorization (NeurIPS 2014)"
    url: "https://papers.nips.cc/paper/2014/hash/feab05aa91085b7a8012516bc3533958-Abstract.html"
    level: orta
    hours: 8
    goal: |
      Makalenin ana sonucunu deneyle doğrula: yeterli boyutta SGNS'in optimumunda $w\cdot c=\mathrm{PMI}(w,c)-\log k$. c aşamasındaki sentetik derlemde ve küçük bir gerçek derlemde k ∈ {1, 5, 15} ve d ∈ {10, 50, V} için öğrenilmiş $W_{in}W_{out}^\top$ ile kaydırılmış PMI arasındaki korelasyonu ölç; x1'deki SPPMI + SVD gömmeleriyle analoji doğruluğunu karşılaştır (Tablo 2).
    steps:
      - "Sayımı sıfır olan çiftler için PMI = −∞: değerlendirmeyi gözlenen çiftlerle sınırla."
    accept:
      - "d büyüdükçe korelasyon 1'e yaklaşır."
      - "SPPMI-SVD ile SGNS'in analoji doğrulukları aynı mertebede."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Skip-gram eğitim çiftleri
    goal: Bağlam penceresinden eğitim örneklerini üretmek
    needs: Pencere kavramı
    q: |-
      Cümle: "kedi süt içti sonra uyudu", pencere 2 (her yana 2 kelime). Kaç (merkez, bağlam) çifti oluşur?
    solution: |-
      Her konumda pencereye düşen komşu sayısı:
      - "kedi": sağda 2 → 2
      - "süt": solda 1, sağda 2 → 3
      - "içti": 2 + 2 → 4
      - "sonra": 2 + 1 → 3
      - "uyudu": solda 2 → 2

      Toplam **14** çift. Skip-gram her çift için $\log\sigma(u_c^\top v_w)$'yi büyütür; tam softmax yerine **negatif örnekleme** $k$ rastgele kelime için $\log\sigma(-u_n^\top v_w)$ ekler. word2vec ayrıca pencere boyunu rastgele kısaltır (yakın komşular daha sık örneklenir) ve çok sık kelimeleri alt örnekler.
  - id: p2
    type: hesap
    level: 1
    title: Negatif örnekleme dağılımı
    goal: Unigram^0.75 düzeltmesinin etkisini görmek
    needs: Normalizasyon
    q: |-
      İki kelime: sayımlar 100 ve 1. Negatifler $P(w)\propto\mathrm{sayım}^{0.75}$ ile çekiliyor. Nadir kelimenin seçilme olasılığı?
    answer: 0.030653430031715508
    calc: "1/(100**0.75+1)"
    tol: 1e-4
    mistakes:
      - {answer: 0.009900990099009901, msg: "Bu ham unigram olasılığı; 0.75 kuvveti nadir kelimelerin payını artırır."}
    hints:
      - "$100^{0.75}=31.6$."
    solution: |-
      $1/(31.6+1)=0.0307$ — ham olasılığın (0.0099) ~3 katı. Mikolov ve ark. (2013) 0.75'i deneysel olarak seçti: sık kelimeleri hâlâ çok örnekler ama nadirlere de pay bırakır.
  - id: p3
    type: hesap
    level: 1
    title: One-hot × W
    goal: Gömme katmanının bir satır seçimi olduğunu görmek
    needs: Matris çarpımı
    q: |-
      Sözlük 10 000, gömme boyu 300. 10 000 boyutlu one-hot vektör ile $W$ (10 000 × 300) çarpımı kaç **sıfırdan farklı** çarpma içerir (verimli uygulamada kaç sayı okunur)?
    answer: 300.0
    calc: "300"
    mistakes:
      - {answer: 3000000.0, msg: "Naif matris çarpımı; one-hot'un yalnız bir elemanı 1 olduğundan yalnız bir satır okunur."}
    hints:
      - "One-hot vektörde kaç eleman sıfır değil?"
    solution: |-
      Yalnız bir satır (300 sayı) seçilir: embedding katmanı = biassız, one-hot girdili yoğun katman, ama indekslemeyle uygulanır.
  - id: p4
    type: yöntem-seç
    level: 2
    title: One-hot mu, gömme mi?
    goal: Kategorik özniteliği kodlama biçimini seçmek
    needs: P3
    q: |-
      Tablo verisinde "şehir" sütunu 900 farklı değer alıyor; bir sinir ağına vereceksin. One-hot mu gömme mi?
    choices:
      - {t: "One-hot", why: "900 boyutlu seyrek girdi; benzer şehirler arasında hiçbir benzerlik paylaşılmaz."}
      - {t: "Öğrenilen gömme (ör. 16–32 boyut)", ok: true, why: "Kategori sayısı büyük; gömme benzer kategorileri yakın yerleştirip istatistik paylaştırır."}
      - {t: "Etiket kodlama (0, 1, 2, …) tek sayı olarak", why: "Var olmayan bir sıra ve uzaklık dayatır."}
    hints:
      - "Kural: <10 kategori one-hot, >50 gömme."
    solution: |-
      Géron'un sezgisel kuralı: 10'dan az kategoride one-hot, 50'den fazlada gömme, arası deneme. Nadir kategoriler için OOV kovası ya da sıklık eşiği; çok sayıda nadir kategori için hedef kodlama (sızıntıya dikkat) bir alternatif.
  - id: p5
    type: açıkla
    level: 3
    title: Analoji aritmetiği neden çalışır, neden yanıltır?
    goal: Gömme geometrisinin sınırlarını tartışmak
    needs: Kosinüs benzerliği
    q: |-
      "kral − erkek + kadın ≈ kraliçe" neden çoğu zaman çalışır? Değerlendirmedeki yaygın hileyi ve gömmelerdeki toplumsal yanlılık sorununu açıkla.
    rubric:
      - "Benzer bağlamlarda geçen kelimelerin farklarının tutarlı bir 'ilişki yönü' oluşturduğunu söyledim (PMI matrisi çarpanlaması bağlantısı)"
      - "Değerlendirmede girdi kelimelerin aday listesinden çıkarıldığını, aksi hâlde en yakının çoğu zaman 'kral' olduğunu belirttim"
      - "Eğitim metnindeki yanlılıkların (meslek–cinsiyet) gömmelere geçtiğini ve analojilerle görünür olduğunu açıkladım"
    hints:
      - "Kosinüs komşusu ararken 'kral'ı listeden çıkarmazsan ne olur?"
    solution: |-
      Skip-gram negatif örneklemeyle örtük olarak kaydırılmış PMI matrisini çarpanlar (Levy & Goldberg 2014); "erkek→kadın" bağlam farkı birçok kelime çiftinde benzer olduğu için yaklaşık sabit bir vektör olur. Ama standart değerlendirme girdi kelimeleri aday dışı bırakır; bırakmazsa vektörün en yakını genelde "kral"ın kendisidir (Nissim ve ark. 2020). Gömmeler eğitim metnindeki kalıp yargıları da kodlar ("doktor − erkek + kadın → hemşire"); Bolukbasi ve ark. (2016) bunu ölçtü ve azaltma yöntemleri önerdi.
pitfalls:
  - wrong: "word2vec kelimenin anlamını öğrenir."
    right: "Dağılımsal benzerliği (hangi bağlamlarda geçtiğini) öğrenir; zıt anlamlılar benzer bağlamlarda geçtiği için yakın çıkabilir."
  - wrong: "Her kelimenin tek bir vektörü yeterlidir."
    right: "Çok anlamlı kelimeler (yüz: sayı / surat) tek vektörde karışır; bağlamsal gömmeler (M4.16) bunu çözer."
whatif:
  - q: "Pencere boyu 2'den 10'a çıkarsa?"
    a: "Küçük pencere sözdizimsel/işlevsel benzerlik (aynı rolde kelimeler), büyük pencere konusal benzerlik yakalar."

labs:
  - id: l1
    lab: sgnsgrad
    title: "SGNS kaybı ve gradyanı: bir pozitif, k negatif, 2-B vektörler"
    goal: |
      Tek bir (merkez, bağlam) çifti ve en fazla iki negatif örnek için skip-gram + negatif örnekleme kaybını ve gradyanlarını hesapla. Vektörleri değiştirerek gradyanın merkez vektörünü pozitif bağlama doğru nasıl çektiğini, negatiflerden nasıl ittiğini gör. Ardından gradyan inişiyle ya yalnız merkez vektörünü ya da (word2vec'teki gibi) üç vektörü birden güncelle.
    predict:
      q: "Negatif örnek yokken (k = 0) yalnız pozitif terimi en küçüklersen vektörlere ne olur?"
      options:
        - {t: "u_o ve v_c aynı noktaya yakınsar, kayıp 0 olur", why: "Kayıp −log σ(u_o·v_c), ancak iç çarpım sonsuza giderken 0'a yaklaşır; aynı noktada durmak yetmez."}
        - {t: "Normları sınırsız büyür; kayıp 0'a yaklaşır ama ulaşmaz", ok: true, why: "'Negatifsiz yozlaşma' senaryosunda 200 adımda ‖v_c‖ 1'den 4.6'ya çıkıyor, kayıp 0.010. Bütün vektörler bu şekilde büyüyüp hizalanırsa her kelime her kelimeye benzer olur; negatifler bunu engeller."}
        - {t: "Hiçbir şey: gradyan sıfırdır", why: "σ(1) − 1 = −0.27 ≠ 0."}
    presets:
      - {name: "Varsayılan 2-B sahne", params: {vx: -0.5, vy: 1, ox: 1, oy: 0.5, k: 2, n1x: -1, n1y: 0.5, n2x: 0.5, n2y: -1, lr: 0.5, steps: 30, upd: 1}, note: "v_c, negatif u_1'e yakın başlıyor: J = 2.258, ∂J/∂v_c = (−1.120, −0.107). 30 adımda J = 0.014, cos(v_c, u_o) = 0.97. Yalnız v_c güncellenirse aynı sürede J = 0.384."}
      - {name: "Ders el hesabı", params: {vx: 1, vy: 0, ox: 1, oy: 0, k: 2, n1x: 0, n1y: 0, n2x: -1, n2y: 0, steps: 0, upd: 1}, note: "1-B el hesabının 2-B gömülmüş hâli: J = 1.3197, ∂J/∂v_c = (−0.538, 0), ∂J/∂u_o = −0.269. Modülün el hesabı alanlarıyla aynı sayılar."}
      - {name: "Sıfır vektörlü negatif", params: {vx: 1, vy: 0, ox: 1, oy: 0, k: 2, n1x: 0, n1y: 0, n2x: -1, n2y: 0, steps: 200, upd: 0}, note: "Yalnız v_c güncellenince kayıp 0.703'te kalıyor: u_1 = 0 olduğu için o terim sabit log 2 = 0.693 katkı veriyor ve gradyan üretmiyor. 'üçü birden' seçince u_1 v_c'nin tersine kayıyor ve taban kalkıyor (200 adımda 0.0013)."}
      - {name: "Negatifsiz yozlaşma", params: {vx: 1, vy: 0, ox: 1, oy: 0, k: 0, steps: 200, upd: 0}, note: "k = 0: 200 adımda J 0.313'ten 0.010'a iniyor ama ‖v_c‖ 4.6'ya büyüyor. Kayıp yalnız büyüyerek azalabiliyor."}
      - {name: "Ters yönden başla", params: {vx: -1, vy: 0.5, ox: 1, oy: 1, k: 1, n1x: -1, n1y: 1, steps: 60, upd: 1}, note: "v_c başta negatifin yanında, pozitiften uzak: J = 2.68. 60 adımda J = 0.0053 ve cos(v_c, u_o) = 0.92. Pozitif u_o da v_c'ye doğru dönüyor."}
    questions:
      - q: "Gradyan formülünde bir negatifin itme gücünü ne belirler?"
        a: "σ(u_k·v_c): modelin o gürültü kelimesine verdiği 'gerçek' olasılığı. Zaten ayrılmış (σ ≈ 0) bir negatif neredeyse hiç gradyan vermez. Bu yüzden rastgele ve kolay negatiflerin çoğu boşa gider; zor negatif seçme (hard negative mining) yöntemleri bu gözleme dayanır."
      - q: "Neden u_o ve u_k de güncellenmelidir? Yalnız v_c'yi eğitsek ne olurdu?"
        a: "Çıktı vektörleri sabit kalsaydı, her kelimenin girdi vektörü sabit (rastgele) bir bağlam uzayına göre konumlanırdı: bağlam kelimeleri arasındaki benzerlik hiç öğrenilmezdi. 'Sıfır vektörlü negatif' senaryosu bir sonucunu gösteriyor: sıfır olan bir u_k hiç düzelmez ve kayba sabit log 2 katar."
    limits: "Tek çift, en fazla iki negatif, 2 boyut, sabit öğrenme oranlı tam gradyan. Gerçek eğitimde negatifler her adımda yeniden çekilir, milyonlarca çift aynı vektörleri paylaşır ve öğrenme oranı doğrusal azalır."
  - id: l2
    lab: noisedist
    title: "Gürültü dağılımı ve sık kelime alt-örneklemesi (Zipf sözlüğü)"
    goal: |
      Frekansları Zipf yasasına (f ∝ sıra^−s) uyan bir sözlükte iki word2vec ayarını ölç. Gürültü üssü α, negatif örneklerin sık ve nadir kelimeler arasında nasıl paylaştırıldığını belirler. Alt-örnekleme eşiği t ile formül (makale ya da word2vec.c kodu), metinden hangi tokenların atılacağını belirler.
    predict:
      q: "V = 10 000, s = 1: en sık 10 kelime tokenların ≈ %30'unu oluşturuyor. α = 0.75 ile negatif örneklerin yüzde kaçı bu 10 kelimeden gelir?"
      options:
        - {t: "≈ %30 (frekansla aynı)", why: "Bu α = 1'de olur."}
        - {t: "≈ %10", ok: true, why: "Ölçülen %10.3: 3/4 kuvveti sık kelimelerin payını üçte birine indiriyor, kuyruğun (sıra > 1000) payını %23.5'ten %47.9'a çıkarıyor."}
        - {t: "≈ %0.1", why: "Bu α = 0 (düzgün dağılım) olur: 10/10 000."}
    presets:
      - {name: "word2vec varsayılanları", params: {V: 10000, s: 1, alpha: 0.75, form: 1, tl: -5}, note: "Makale formülü, t = 10⁻⁵: tokenların %80'i atılıyor, en sık 10 kelimenin payı %29.9'dan %2.5'e iniyor."}
      - {name: "Düzgün gürültü", params: {alpha: 0}, note: "α = 0: en sık 10 kelime negatiflerin yalnız %0.1'i. 've', 'bir' gibi kelimeler neredeyse hiç negatif olmuyor; model onları her şeye 'benzer' bulabilir."}
      - {name: "Ham unigram", params: {alpha: 1}, note: "α = 1: negatiflerin %29.9'u en sık 10 kelimeden. Sıra > 1000 kuyruğun negatiflerdeki payı %23.5: nadir kelimeler az ceza alıyor."}
      - {name: "Kod formülü", params: {form: 2, tl: -5}, note: "word2vec.c formülü aynı t'de %74 atıyor (makale %80). Tam tutulma f ≤ 2.618 t'de başlıyor; makalede f ≤ t."}
      - {name: "Kodun varsayılan eşiği", params: {form: 2, tl: -3}, note: "t = 10⁻³ (word2vec.c ve Gensim varsayılanı) çok daha yumuşak: tokenların %28'i atılıyor (aynı t ile makale formülü %34), en sık kelime 0.109 olasılıkla tutuluyor."}
    questions:
      - q: "Alt-örnekleme olasılıkları neden kelime türüne değil frekansa bağlı? 've' gibi bir işlev kelimesi nadir olsaydı ne olurdu?"
        a: "Yöntem anlamı bilmez, yalnız frekansı görür. Fikir şudur: çok sık bir kelimenin her ek geçişi, bağlam dağılımı hakkında çok az yeni bilgi taşır. Nadir bir işlev kelimesi atılmazdı, ama nadir olduğu için zaten az pencereye girerdi."
      - q: "Etkin frekansın √(t·f) olması, eğitimin hangi kelimelere daha çok zaman ayırması anlamına gelir?"
        a: "f > t olan kelimelerin token payı karekökle sıkışır; f ≤ t olanlar olduğu gibi kalır. Toplam token sayısı düştüğü için aynı epoch'ta orta ve düşük frekanslı kelimelerin göreli güncelleme payı artar ve eğitim kısalır (2013b, Tablo 1: NEG-5 38 dk → 14 dk)."
    limits: "Frekanslar ideal Zipf; gerçek derlemlerde baş kısım daha düz, kuyruk daha dik olabilir. Grafikte gösterilen yalnız beklenen değerler; örnekleme gürültüsü yok. Alt-örneklemenin pencereyi örtük genişletme etkisi burada görünmez."
  - id: l3
    lab: pmisvd
    title: "SGNS'in optimumu kaydırılmış PMI mi? Beklenen kaybı doğrudan en küçükle"
    goal: |
      Sentetik derlemin skip-gram çift sayımlarından SGNS'in beklenen amacını tam batch Adam ile en küçükle. Öğrenilen w·c değerlerini, her hücre bağımsız seçilebilseydi elde edilecek optimum x* = log(#(w,c) / (k·#(w)·P_n(c))) ile karşılaştır. α = 1 için bu PMI − log k'dır. Boyut d'yi küçülterek rank kısıtının ne zaman devreye girdiğini, SPPMI matrisinin tekil değer spektrumuyla birlikte izle.
    predict:
      q: "d = 2'de öğrenilen w·c ile x* arasındaki korelasyon ne olur?"
      options:
        - {t: "≈ 1: SGNS her zaman PMI'yi bulur", why: "Bu ancak d, matrisin rankına yetiyorsa geçerli."}
        - {t: "≈ 0.8: kaba bir yaklaşım", ok: true, why: "Ölçülen 0.81. Rank-2 bir matris 29 ranklı SPPMI'yi taşıyamaz; d = 16'da 0.99, d = 32'de 1.00."}
        - {t: "≈ 0: ilişki kalmaz", why: "Ağırlıklı düşük-rank yaklaşım yine de en büyük yapıyı yakalar."}
    presets:
      - {name: "Varsayılan (d = 8, k = 5)", params: {d: 8, k: 5, alpha: 0, win: 2, iters: 400, n: 1500}, note: "corr = 0.962, RMS fark 0.217; rank(SPPMI) = 29, rank-8 SVD enerjinin %91.6'sını tutuyor."}
      - {name: "Yeterli boyut", params: {d: 32, iters: 1500}, note: "d = 32 ≥ rank: corr = 1.000, RMS fark 0.003, kayıp alt sınıra (1.790) iniyor. Levy–Goldberg sonucunun koşulu sağlanıyor."}
      - {name: "Dar boyut", params: {d: 2}, note: "d = 2: corr = 0.814, RMS fark 0.661; kayıp 2.288 (alt sınır 1.790)."}
      - {name: "α = 0.75", params: {alpha: 1, d: 32, iters: 1500}, note: "Hedef x* ile corr = 1.000, ama ham PMI − log k ile 0.994: düzleştirilmiş gürültü hedefi hafifçe kaydırıyor."}
      - {name: "Büyük k", params: {k: 15}, note: "log 15 = 2.7 kaydırması çoğu PMI'yi sıfırın altına itiyor: SPPMI'nin rankı 6'ya düşüyor, d = 8 yetiyor ama corr 0.922 (400 adım yetmiyor)."}
    questions:
      - q: "Gözlenmeyen çiftlerde (sayım 0) öğrenilen w·c neden çok negatif?"
        a: "Bu hücrelerde yalnız negatif terim var: k·#(w)·P_n(c)·softplus(x). Bu terim x → −∞'da 0'a iner. Sayım tabanlı karşılığı PMI = −∞ olduğu için SPPMI bu hücreleri 0'a kırpar."
      - q: "SGNS ile SPPMI + SVD neden aynı gömmeleri vermez?"
        a: "İkisi de aynı matrisi hedefler ama farklı kayıpla. SVD tüm hücrelere eşit ağırlıklı kare hata uygular; SGNS ise her hücreyi sayımıyla orantılı lojistik kayıpla ağırlıklandırır ve kırpma yapmaz. Ayrıca SVD vektörleri U√Σ biçiminde bölüşülür; SGNS'te bölüşüm optimizasyonun sonucudur."
    limits: "Beklenen kayıp tam batch en küçükleniyor: stokastik örnekleme, dinamik pencere ve alt-örnekleme yok. Sözlük ≈ 50 kelime ve derlem yapay. Sayılar tohum 1 içindir; başka tohumlarda birkaç binde bir oynar."
  - id: l4
    lab: w2vlab
    title: "word2vec'i eğit: PCA görünümü ve analoji sorguları"
    goal: |
      Yapısı bilinen sentetik bir Türkçe derlemde (insanlar: cinsiyet × statü × yaş; şehir–ülke–dil üçlüleri) SGNS eğit. Vektörleri PCA ile 2-B'de gör ve a − b + c analojilerini 16 boyutta kosinüsle sorgula. Boyut, pencere, k, epoch, α ve alt-örneklemeyi değiştirip analojilerin ne zaman ortaya çıktığını ve ne zaman bozulduğunu ölç.
    predict:
      q: "Boyutu d = 16'dan d = 4'e indirirsen beş hazır analojiden kaçı doğru kalır?"
      options:
        - {t: "Beşi de: 4 boyut yeter", why: "Varlıklar 5 ayrı özellikle (cinsiyet, statü, yaş, şehir/ülke, dil) tanımlanıyor."}
        - {t: "Biri", ok: true, why: "Ölçülen: yalnız madrid − ispanya + almanya → berlin doğru; d = 2'de hiçbiri, d = 8'de beşi de doğru."}
        - {t: "Hiçbiri", why: "Bu d = 2'de olur."}
    presets:
      - {name: "Varsayılan (d = 16)", params: {d: 16, win: 3, k: 5, ep: 6, alpha: 0.75, sub: 0, a: kral, b: adam, c: kadın, show: 0}, note: "Beş hazır analojinin beşi de doğru, kosinüs ≈ 0.99."}
      - {name: "d = 2", params: {d: 2, win: 3, k: 5, ep: 6, alpha: 0.75, sub: 0, a: kral, b: adam, c: kadın, show: 0}, note: "Analojilerin hepsi bozuluyor: 2 boyutta birçok vektör aynı yöne düşüyor ve yanlış kelimeler de kosinüs ≈ 1.00 alıyor."}
      - {name: "d = 4", params: {d: 4, win: 3, k: 5, ep: 6, alpha: 0.75, sub: 0, a: madrid, b: ispanya, c: almanya, show: 0}, note: "Beşten yalnız biri (berlin) doğru. kral − adam + kadın → taht."}
      - {name: "Zayıf eğitim", params: {d: 16, win: 3, k: 1, ep: 1, alpha: 0, sub: 0, a: paris, b: fransa, c: italya, show: 0}, note: "k = 1, α = 0, 1 epoch: kral − adam + kadın hâlâ kraliçe buluyor ama paris − fransa + italya → italyanca (roma değil)."}
      - {name: "Başkent ilişkisi", params: {d: 16, win: 3, k: 5, ep: 6, alpha: 0.75, sub: 0, a: paris, b: fransa, c: italya, show: 1}, note: "paris − fransa + italya ≈ roma (kosinüs 0.99). 'tüm kelimeler' görünümünde bağlam kelimeleri de çiziliyor."}
    questions:
      - q: "Neden 2-B PCA çiziminde çiftleri birleştiren çizgiler tam paralel görünmüyor da analoji yine doğru çıkıyor?"
        a: "Analoji 16 boyutta hesaplanıyor; PCA yalnız en büyük iki varyans yönünü gösterir. Paralellik geri kalan 14 boyutta da olabilir. İzdüşüm bunu bozar."
      - q: "Gerçek metinde analojiler neden bu kadar temiz çıkmaz?"
        a: "Burada her varlık yalnız kendi özelliklerine özgü bağlam kelimeleriyle geçiyor. Gerçek metinde ilişkiler gürültülü, kelimeler çok anlamlı, frekanslar Zipf dağılımlı. Ayrıca analoji testi girdi kelimelerini hariç tutmasa çoğu zaman b'nin kendisi dönerdi."
    limits: "≈ 50 kelimelik yapay sözlük, 1 500 cümle, tarayıcıda saf JS SGD. Alt-örnekleme eşiği bu küçük derleme uygun olsun diye t = 10⁻² seçildi (gerçekte 10⁻⁵–10⁻³). Sonuçlar tohum 1 içindir."
