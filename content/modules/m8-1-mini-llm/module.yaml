id: m8-1-mini-llm
code: M8.1
title: "Mini-LLM: eğit, profil çıkar, hızlandır"
phase: 8
minutes: 420
prereq: [m4-7-transformer, m6-5-compile, m7-3-amp]
summary: >
  Önceki fazların hepsini tek bir projede birleştiriyorsun: iki basamaklı
  toplamayı sıfırdan öğrenen küçük bir GPT. Hesap bütçesini (Chinchilla,
  6ND FLOP) ve öğrenme oranı programını elle çıkarıyor, saf Python'da veri
  biçimini ve programı yazıyor, NumPy'da veri kümesini string üretmeden,
  tamamen vektörel kuruyor ve taban kayıpları hesaplıyor, PyTorch'ta
  warmup + cosine, gradyan kırpma ve maskeli kayıpla eğitip %95+ doğruluğa
  ulaşıyor ve en sonda profiler ile darboğazı bulup head döngüsünü tek bir
  batch'li işleme indiriyorsun.
goals:
  - "Bir eğitim koşusunu bütçelemek: parametre, token, FLOP, süre"
  - "Eğitim döngüsünün parçaları: warmup + cosine, AdamW, gradyan kırpma, maskeli kayıp, değerlendirme"
  - "Görev biçiminin öğrenilebilirliğe etkisi: ters çevrilmiş cevap basamakları"
  - "`torch.profiler` ile darboğaz bulmak ve vektörleştirerek gidermek"
sources:
  - {title: "Karpathy — nanoGPT ve minGPT (adder örneği)", url: "https://github.com/karpathy/minGPT", license: "MIT", use: adapt}
  - {title: "Stanford CS336 — Language Modeling from Scratch (Assignment 1)", url: "https://github.com/stanford-cs336/assignment1-basics", license: "MIT", use: adapt}
  - {title: "Hoffmann ve ark. — Training Compute-Optimal Large Language Models (Chinchilla)", url: "https://arxiv.org/abs/2203.15556", license: "arXiv", use: link}
  - {title: "Kaplan ve ark. — Scaling Laws for Neural Language Models", url: "https://arxiv.org/abs/2001.08361", license: "arXiv", use: link}
  - {title: "Lee ve ark. — Teaching Arithmetic to Small Transformers (ters çevrilmiş çıktı)", url: "https://arxiv.org/abs/2307.03381", license: "arXiv", use: link}
  - {title: "PyTorch Tutorials — Profiling your PyTorch Module", url: "https://docs.pytorch.org/tutorials/beginner/profiler.html", license: "BSD-3-Clause", use: adapt}

hand:
  groups:
    - title: "Bütçe: $N=10^7$ parametre"
      fields:
        - {id: chin, label: "Chinchilla-optimal token sayısı ($\\approx20N$)", answer: 200000000}
        - {id: flops, label: "Eğitim FLOP'u $\\approx6ND$", answer: 1.2e16, tol: 1e10}
        - {id: secs, label: "100 TFLOP/s tepe, %40 MFU ile süre (s)", answer: 300}
    - title: "Warmup 100 adım, toplam 1100, $\\eta_{\\max}=10^{-3}$, $\\eta_{\\min}=10^{-4}$, cosine"
      fields:
        - {id: lr50, label: "Adım 49'da $\\eta$ (doğrusal warmup: $\\eta_{\\max}(t+1)/W$)", answer: 0.0005, tol: 0.0000001}
        - {id: lr600, label: "Adım 600'de $\\eta=\\eta_{\\min}+\\tfrac12(\\eta_{\\max}-\\eta_{\\min})(1+\\cos\\pi p)$", answer: 0.00055, tol: 0.0000001, hint: "$p=(600-100)/1000$"}
    - title: "Biçim: `07+45=250⏎` (cevap 052 ters çevrilmiş), 10 karakter"
      fields:
        - {id: ans, label: "`38+67=` için ters çevrilmiş 3 basamaklı cevap (sayı olarak)", answer: 501, hint: "105 → \"501\""}
        - {id: tok, label: "Batch 128: adım başına girdi token'ı (satır başına 9)", answer: 1152}
  verify: |
    import math
    N = 1e7
    D = 20 * N
    def lr(t, W=100, T=1100, mx=1e-3, mn=1e-4):
        if t < W:
            return mx * (t + 1) / W
        p = (t - W) / (T - W)
        return mn + 0.5 * (mx - mn) * (1 + math.cos(math.pi * p))
    answers = dict(chin=D, flops=6 * N * D, secs=6 * N * D / (100e12 * 0.4), lr50=lr(49), lr600=lr(600),
                   ans=int(str(38 + 67).zfill(3)[::-1]), tok=128 * 9)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Toplamanın cevabını neden ters çevrilmiş basamaklarla (birler önce) üretmek öğrenmeyi kolaylaştırır?"
    options:
      - {t: "Otoregresif model soldan sağa üretir; birler basamağı önce gelirse eldeyi (carry) hesaplamak için gereken bilgi o ana kadar üretilmiş olur", ok: true, why: "Normal sırada en anlamlı basamak, henüz hesaplanmamış eldelere bağlı. Görev biçimi, mimariyle uyumlu olmalı."}
      - {t: "Token sayısını azaltır", why: "Uzunluk aynı."}
      - {t: "Sözlüğü küçültür", why: "Sözlük aynı."}
  - q: "Kaybı yalnız cevap basamaklarında hesaplamak neden mantıklı?"
    options:
      - {t: "Operand basamakları rastgele: onları tahmin etmek indirgenemez bir kayıp ($\\log10$) ekler ve gradyanı öğrenilebilir kısımdan saptırır", ok: true, why: "Talimat ayarlamasında (instruction tuning) da kayıp genelde yalnız cevap token'larında hesaplanır."}
      - {t: "Daha hızlı olduğu için", why: "İleri geçiş aynı; mesele sinyal."}
      - {t: "Aşırı uyumu önlemek için", why: "Asıl sebep gürültülü hedefler."}
  - q: "Learning rate warmup neden kullanılır?"
    options:
      - {t: "Başlangıçta Adam'ın ikinci moment tahmini gürültülü ve gradyanlar büyük; küçük adımlarla başlamak erken patlamaları ve kararsızlığı önler", ok: true, why: "Transformer eğitiminde warmup + cosine (ya da WSD) standart."}
      - {t: "Eğitimi hızlandırmak için", why: "Başlangıçta adımlar küçük; amaç kararlılık."}
      - {t: "Ezberlemeyi önlemek için", why: "Düzenlileştirme amaçlı değil."}

homework:
  - title: "Touvron ve ark. (2023): LLaMA"
    paper: "Touvron ve ark. — LLaMA: Open and Efficient Foundation Language Models (2023)"
    url: "https://arxiv.org/abs/2302.13971"
    level: ileri
    hours: 12
    goal: |
      Mini-LLM'ine LLaMA'nın mimari değişikliklerini (Bölüm 2.2) tek tek ekleyip ablasyon yap: RMSNorm (Pre-norm), SwiGLU FFN (gizli boyut 2/3·4d), RoPE (M4.14 x1), bias'sız doğrusal katmanlar. Aynı hesap bütçesiyle doğrulama kaybını ve token/s'yi karşılaştır; KV-cache'li üretimde RoPE'nin konum kaydırmayla nasıl çalıştığını göster.
    steps:
      - "SwiGLU'da parametre sayısını eşitlemek için gizli boyutu ayarla."
    accept:
      - "Her değişikliğin kayba etkisi tablosu."
      - "LLaMA tarzı model aynı bütçede GPT-2 tarzından iyi ya da eşit."
  - title: "Hoffmann ve ark. (2022): hesap-optimal LLM eğitimi (Chinchilla)"
    paper: "Hoffmann ve ark. — Training Compute-Optimal Large Language Models (NeurIPS 2022)"
    url: "https://arxiv.org/abs/2203.15556"
    level: ileri
    hours: 12
    goal: |
      Makalenin 1. yaklaşımını (sabit model boyutları, farklı token sayıları) küçük ölçekte uygula: 4–6 model boyutu × farklı eğitim uzunlukları; her FLOP bütçesi için minimum kaybı veren (N, D)'yi bul ve N_opt ∝ C^a, D_opt ∝ C^b üslerini uydur (makale: a ≈ b ≈ 0.5). Parametrik kayıp formunu L(N, D) = E + A/N^α + B/D^β (Yaklaşım 3) ölçümlerine uydur.
    steps:
      - "FLOP ≈ 6ND; öğrenme oranı kosinüs takvimini eğitim uzunluğuna eşitle (makalenin kritik bulgusu)."
    accept:
      - "a ve b üsleri raporlanmış, yaklaşık eşit."
      - "Parametrik form uydurması ve kalıntılar."

labs:
  - id: l1
    lab: budget
    title: "Hesap bütçesi ve eş-FLOP eğrisi"
    goal: |
      Parametre sayısı ve token/parametre oranından eğitim FLOP'unu (6ND) ve süreyi hesapla. Chinchilla'nın uydurulmuş kayıp yasasıyla aynı hesap bütçesinde kaybı model boyuna göre çiz; en iyi bölüşümü "20 token/parametre" kuralıyla karşılaştır.
    predict:
      q: "Sabit hesap bütçesinde 10 kat fazla token (D/N = 200) ile daha küçük bir model eğitmek kaybı nasıl etkiler?"
      options:
        - {t: "Daha düşük kayıp: daha çok veri her zaman iyidir", why: "Aynı C'de daha çok token daha küçük model demektir."}
        - {t: "Daha yüksek kayıp (eş-FLOP eğrisinin dibinden uzaklaşılır)", ok: true, why: "N = 10⁷, D/N = 200: kayıp 4.41, aynı C'nin en iyisi 4.25."}
        - {t: "Aynı", why: "Eğri dipte düz ama 10 katlık sapma hissedilir."}
    presets:
      - {name: "El hesabı", params: {logN: 7, ratio: 20, peak: 100, mfu: 0.4}, note: "C = 1.2·10¹⁶ FLOP, 300 s. En iyi N* ≈ 1.1·10⁷ (kurala çok yakın)."}
      - {name: "Çok token", params: {ratio: 200}, note: "Kayıp 4.41, eş-FLOP en iyisi 4.25; ama çıkarımda daha ucuz bir model."}
      - {name: "Az token", params: {ratio: 2}, note: "Kayıp 7.09, en iyisi 6.87: büyük model az eğitilmiş."}
      - {name: "Chinchilla ölçeği", params: {logN: 10.85, ratio: 20, peak: 312, mfu: 0.4}, note: "C ≈ 6·10²³; yaklaşım 3 katsayılarıyla N* ≈ 3.2·10¹⁰ (makale yaklaşım 3 için 40 milyar bildirir)."}
    questions:
      - q: "LLaMA gibi modeller neden Chinchilla-optimal oranın çok üstünde token ile eğitilir?"
        a: "Chinchilla eğitim hesabını en aza indirir; çıkarım maliyeti model boyuyla orantılıdır. Model çok kez çalıştırılacaksa daha küçük bir modeli daha uzun eğitmek toplam maliyeti düşürür."
    limits: "Uydurulmuş yasa ve sabitler büyük dil modelleri için; küçük görevlere doğrudan taşınmaz. 6ND dikkat terimini ihmal eder."
  - id: l2
    lab: mfu
    title: "MFU: modelin donanımı ne kadar kullandığı"
    goal: |
      GPT benzeri bir yapılandırmadan parametre sayısını, token başına eğitim FLOP'unu ve ölçülen adım süresinden ulaşılan hızı ve MFU'yu hesapla. Bağlam uzadıkça dikkatin FLOP payının nasıl büyüdüğünü gör.
    predict:
      q: "Bu modüldeki mini-GPT (2 katman, d = 128, bağlam 9) için MFU büyük modellerdekine göre nasıldır?"
      options:
        - {t: "Benzer (%40–60)", why: "Küçük matrislerde süre ek yük bağımlıdır."}
        - {t: "Çok düşük", ok: true, why: "Adım başına FLOP küçük, sabit maliyetler (Python, çekirdek başlatma) baskın."}
        - {t: "%100'e yakın", why: "Ancak saf matmul işinde ve büyük boyutlarda yaklaşılır."}
    presets:
      - {name: "Mini-GPT", params: {L: 2, d: 128, T: 9, V: 13, B: 128, ms: 15, peak: 1}, note: "N ≈ 4·10⁵; 1 TFLOP/s'lik bir CPU tepesine göre MFU 0.18."}
      - {name: "GPT-2 small", params: {L: 12, d: 768, T: 1024, V: 50257, B: 8, ms: 150, peak: 312}, note: "N ≈ 1.24·10⁸ (gerçek 124 439 808); MFU 0.14."}
      - {name: "7B, uzun bağlam", params: {L: 32, d: 4096, T: 4096, V: 32000, B: 1, ms: 400, peak: 989}, note: "N ≈ 6.6·10⁹; 400 ms'de MFU 0.44. Dikkat, ileri FLOP'un ≈ %7.5'i."}
    questions:
      - q: "MFU ile donanım kullanımı (HFU) neden farklı olabilir?"
        a: "MFU yalnız modelin gerektirdiği FLOP'ları sayar. Aktivasyon checkpointing'deki yeniden hesap (M6.4) donanımın yaptığı ama modelin gerektirmediği FLOP'lardır; HFU onları da sayar ve daha yüksektir."
    limits: "Yaklaşık FLOP sayımı (LayerNorm, softmax ve eleman bazlı işlemler yok); nedensel maske indirimi yok."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Koşu bütçesi
    goal: 6ND ve süre hesabı
    needs: C ≈ 6ND
    q: |-
      $N=5\cdot10^7$, Chinchilla-optimal token, 50 TFLOP/s tepe, %30 MFU. Süre?
    solution: |-
      $D=20N=10^9$; $C=6\cdot5\cdot10^7\cdot10^9=3\cdot10^{17}$ FLOP; etkin hız $1.5\cdot10^{13}$ FLOP/s; süre $2\cdot10^4$ s ≈ 5.6 saat.
  - id: p2
    type: hesap
    level: 1
    title: Kosinüs programı
    goal: Formülü uygulamak
    needs: $\eta=\eta_{\min}+\frac12(\eta_{\max}-\eta_{\min})(1+\cos\pi p)$
    q: |-
      Isınma 200, toplam 2200, $\eta_{\max}=3\cdot10^{-3}$, $\eta_{\min}=3\cdot10^{-4}$. Adım 1700'de $\eta$?
    answer: 0.000695406
    calc: "3e-4 + 0.5*(3e-3-3e-4)*(1+cos(pi*0.75))"
    tol: 1e-6
    mistakes:
      - {answer: 0.000525, msg: "p = (1700 − 200)/2000 = 0.75; cos(3π/4) ≈ −0.707."}
      - {answer: 0.00165, msg: "Bu p = 0.5'teki değer."}
    hints:
      - "$p=0.75$, $1+\\cos(0.75\\pi)\\approx0.2929$."
    solution: |-
      $3\cdot10^{-4}+0.5\cdot2.7\cdot10^{-3}\cdot0.2929\approx6.95\cdot10^{-4}$.
  - id: p3
    type: hesap
    level: 1
    title: Ters cevap
    goal: Biçimi uygulamak
    needs: Üç basamak, ters
    q: |-
      `09+93=` satırının ters çevrilmiş 3 basamaklı cevabı (sayı olarak, baştaki sıfırlar atılarak)?
    answer: 201
    calc: "201"
    tol: 0
    mistakes:
      - {answer: 102, msg: "Bu toplamın kendisi; cevap ters yazılır: 102 → \"201\"."}
      - {answer: 21, msg: "Üç basamak: 102 → \"201\"."}
    hints:
      - "9 + 93 = 102."
    solution: |-
      $102$ → `"102"` → ters `"201"`.
  - id: p4
    type: yorumla
    level: 2
    title: Kayıp tabanın altında, doğruluk %60
    goal: Hatayı yerelleştirmek
    needs: Tam eşleşme, elde
    q: |-
      Eğitim kaybı 0.4 nat/konum (taban 1.77) ama tam eşleşme doğruluğu %60'ta takıldı. İlk bakılacak şey?
    choices:
      - {t: "Öğrenme oranını artırmak", why: "Önce hatanın nerede olduğunu bulmak gerekir."}
      - {t: "Doğruluğu elde olan ve olmayan örneklere ve basamak konumuna göre ayırmak", ok: true, why: "Genellikle eldeli durumlar (özellikle onlar basamağı) geride kalır; hedefli veri ya da daha uzun eğitim gerekir."}
      - {t: "Modeli büyütmek", why: "Belki gerekir ama önce hata türü anlaşılmalı."}
    hints:
      - "Hangi örneklerde yanlış?"
    solution: |-
      Ortalama kayıp iyi olsa da tam eşleşme bütün basamakları ister. Hataları elde durumuna ve konuma göre ayırmak, modelin hangi alt görevi öğrenmediğini gösterir.
  - id: p5
    type: kanıt
    level: 3
    title: Eğitim FLOP'u 6N
    goal: İleri 2N, geri 4N'yi göstermek
    needs: Doğrusal katman, VJP
    q: |-
      Doğrusal bir katman $y=Wx$ ($W\in\mathbb R^{m\times n}$) için bir token'ın ileri geçişinin $2mn$, geri geçişinin $4mn$ FLOP olduğunu göster; bütün katmanlar toplanınca token başına $\approx6N$ çıktığını açıkla.
    rubric:
      - "İleri: mn çarpma + mn toplama = 2mn"
      - "Geri: girdi gradyanı Wᵀȳ için 2mn"
      - "Geri: ağırlık gradyanı ȳxᵀ için 2mn"
      - "Ağırlıkların toplamı N olduğu için 2N + 4N = 6N; dikkat skorları gibi ağırlıksız işlemlerin ihmal edildiğini belirttim"
    hints:
      - "Geri geçişte iki VJP vardır."
    solution: |-
      İleri $2mn$; geri $\bar x=W^\top\bar y$ ($2mn$) ve $\bar W=\bar yx^\top$ ($2mn$). Katmanlar üzerinden $\sum mn=N$, token başına $6N$. İlk katmanın girdi gradyanı gerekmez ve dikkatin $QK^\top$ terimi ağırlıksızdır; bunlar küçük düzeltmelerdir.
pitfalls:
  - wrong: "Daha çok veri her zaman daha iyidir."
    right: "Sabit hesapta daha çok token daha küçük model demektir; eş-FLOP eğrisinin dibinden uzaklaşınca kayıp artar."
  - wrong: "Kayıp tüm diziye uygulanmalıdır."
    right: "Rastgele soru kısmını tahmin etmek öğrenilemez; kayıp yalnız cevap konumlarına uygulanır, yoksa kayıp değeri yanıltıcı olur."
  - wrong: "Profil çıkarmadan önce torch.compile ekle."
    right: "Önce darboğaz bulunur: ek yük mü, bellek mi, hesap mı? Çözüm buna göre seçilir (birleştirme, batch, compile, düşük hassasiyet)."
  - wrong: "Kayıp düşüyorsa doğruluk da yeterlidir."
    right: "Tam eşleşme bütün basamakları ister; ortalama kayıp bazı durumların (eldeli) öğrenilmediğini gizleyebilir."
whatif:
  - q: "Cevap ters değil normal sırada yazılsaydı?"
    a: "Model önce yüzler basamağını, yani bütün eldelerin sonucunu tahmin etmek zorundadır; öğrenme yavaşlar ve daha çok örnek gerektirir (Lee ve ark. 2023)."
  - q: "Isınma olmadan büyük öğrenme oranıyla başlansaydı?"
    a: "İlk adımlarda Adam'ın ikinci moment kestirimi güvenilmez ve gradyanlar büyüktür; kayıp sıçrayabilir ya da NaN olabilir. Kırpma kısmen korur."
  - q: "Üç basamaklı toplamaya geçilse?"
    a: "Satır 13 karakter, cevap 4 basamak; aynı biçim ve maske çalışır. Elde zincirleri uzadığı için daha çok veri ve adım gerekir; uzunluk genelleştirmesi (eğitimde görülmeyen uzunluklar) transformer'lar için ayrıca zordur."
