quiz:
  - q: "Amdahl ve Gustafson neden farklı sonuçlara varır?"
    options:
      - {t: "Amdahl problem boyunu sabit tutar (güçlü ölçekleme); Gustafson işlemci sayısıyla problemi büyütür ve seri kısmın süresini sabit sayar (zayıf ölçekleme)", ok: true, why: "İkisi de doğru; soruları farklı."}
      - {t: "Gustafson iletişim maliyetini sayar", why: "İkisi de saymaz."}
      - {t: "Amdahl yanlıştır", why: "Sabit boyutta doğrudur."}
  - q: "PCAM'in bölümleme adımında neden işlemci sayısından 1–2 mertebe fazla görev hedeflenir?"
    options:
      - {t: "Sonraki adımlarda (birleştirme, eşleme) yük dengeleme ve iletişimi azaltma için esneklik bırakmak", ok: true, why: "Görevler sonra gruplanır; grup sayısı yine işlemciden fazla tutulur."}
      - {t: "Her görev ayrı thread olsun diye", why: "Thread başına görev pahalıdır."}
      - {t: "İletişimi artırmak için", why: "Tersine."}
  - q: "Mandelbrot satırlarını thread'lere ardışık bloklar hâlinde dağıtmak neden kötü olabilir?"
    options:
      - {t: "Satırların maliyeti çok farklı (kümenin içi maxit iterasyon); bir thread pahalı satırları toplarken diğerleri boşta kalır", ok: true, why: "Döngüsel ya da dinamik dağıtım işi dengeler."}
      - {t: "Önbellek kaçırmaları", why: "Asıl sorun yük dengesizliği."}
      - {t: "Yarış koşulu", why: "Satırlar bağımsız."}

homework:
  - title: "Gustafson (1988): Amdahl yasasını yeniden değerlendirmek"
    paper: "Gustafson — Reevaluating Amdahl's Law (CACM 1988)"
    url: "https://doi.org/10.1145/42411.42415"
    level: başlangıç
    hours: 4
    goal: |
      d aşamasındaki C++ Mandelbrot'u (ya da M10.3'teki konvolüsyonu) kullanarak kendi makinende (i) sabit boyutta 1..p thread ile güçlü ölçekleme, (ii) thread sayısıyla orantılı büyüyen problemle zayıf ölçekleme ölç. c aşamasındaki Amdahl uydurmasıyla seri oranı kestir; Gustafson'un ölçeklenmiş hızlanma eğrisini çiz ve makaledeki 1024 işlemcili sonuçlarla nitel karşılaştır.
    steps:
      - "Her ölçümü 5 kez tekrarla, ortancayı al; ısınma (warm-up) çalıştırması ekle."
      - "Hiper-iş parçacığı (SMT) olan çekirdeklerde eğrinin kırılmasını yorumla."
    accept:
      - "Güçlü ölçeklemede hızlanma Amdahl eğrisine, zayıf ölçeklemede Gustafson doğrusuna yakın."
  - title: "Blumofe & Leiserson (1999): İş çalma ile zamanlama"
    paper: "Blumofe & Leiserson — Scheduling Multithreaded Computations by Work Stealing (JACM 1999)"
    url: "https://doi.org/10.1145/324133.324234"
    level: ileri
    hours: 12
    goal: |
      C++'ta thread başına çift uçlu kuyruk (deque) ile iş çalan bir zamanlayıcı yaz: sahibi alttan push/pop, hırsızlar üstten çalar. Paralel merge sort ve Fibonacci (fork–join) ile merkezi tek kuyruklu havuza karşı ölç; makaledeki $T_p\le T_1/p+O(T_\infty)$ sınırını b aşamasındaki iş–yol hesabıyla karşılaştır.
    steps:
      - "Önce mutex korumalı deque, sonra (isteğe bağlı) Chase–Lev kilitsiz deque."
      - "Görev ayrıntı düzeyini (cutoff) tara."
    accept:
      - "Küçük görevlerde merkezi kuyruk çekişmeden yavaşlar, iş çalma ölçeklenir."
      - "Çalma sayısı p·T∞ mertebesinde."

labs:
  - id: l1
    lab: amdahl
    title: "Amdahl ve Gustafson–Barsis: aynı sayılar, farklı sorular"
    goal: "Amdahl (problem sabit): $S(N)=1/(f+(1-f)/N)\\le1/f$. Gustafson (işlemci başına iş sabit, problem N ile büyür): $S(N)=f+(1-f)N$. İletişim ek yükü eklenince Amdahl eğrisi bir N'den sonra düşer."
    predict:
      q: "f = %5 seri kod: 1024 çekirdekle en fazla kaç kat hızlanırsın (Amdahl)?"
      options:
        - {t: "≈ 1024", why: "Seri kısım hızlanmaz."}
        - {t: "≈ 20", ok: true, why: "1/(0.05 + 0.95/1024) ≈ 19.6."}
        - {t: "≈ 50", why: "Üst sınır 1/f = 20."}
    presets:
      - {name: "f = %1", params: {f: 0.01}, note: "Tavan 100: büyük makinelerde %1 seri kod bile çok pahalı."}
      - {name: "İletişim ek yükü", params: {f: 0.02, ov: 0.004}, note: "En iyi N belirdi; sonrası yavaşlama."}
    limits: "Kusursuz yük dengesi; ek yük modeli log₂N (ağaç indirgeme)."
