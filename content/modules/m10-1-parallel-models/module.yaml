id: m10-1-parallel-models
code: M10.1
title: Paralel mimariler, hızlanma yasaları ve paralel program tasarımı
phase: 10
minutes: 380
prereq: [m7-1-cuda]
summary: >
  Saat frekansı ~2005'te 2–4 GHz'de takılınca performansın tek yolu
  paralellik oldu: çok çekirdekli CPU'lar ve GPGPU. Flynn sınıflaması (SISD,
  SIMD, MISD, MIMD; paylaşımlı/dağıtık bellek, NUMA, efendi–işçi), heterojen
  mimariler (Cell BE, Kepler SMX, APU), Amdahl ve Gustafson yasaları,
  verimlilik ve Karp–Flatt ölçüsü, iş–yol (work–span) modeli ve Brent
  teoremi. Tasarım: Foster'ın PCAM'i (bölümleme, iletişim, birleştirme,
  eşleme), ayrıştırma desenleri (görev paralelliği, böl ve yönet, geometrik,
  özyinelemeli veri, boru hattı, olay tabanlı) ve program yapısı desenleri
  (SPMD, MPMD, efendi–işçi, fork–join, döngü paralelliği). Saf Python'da
  liste zamanlama ve boru hattı simülasyonu, NumPy'da kritik yol ve
  Amdahl uydurma, C++ `std::thread` ile Mandelbrot'ta statik, döngüsel ve
  dinamik yük dağıtımı.
goals:
  - "[[Amdahl yasası]] $S=1/((1-f)+f/N)$ ve [[Gustafson yasası]] $S=(1-f)+fN$; güçlü ve zayıf ölçekleme"
  - "İş $W$, yol $S_\\infty$, paralellik $W/S_\\infty$; Brent: $T_p\\le W/p+S_\\infty$"
  - "[[PCAM]]: görevleri bul, iletişimi say, birleştir, işlemcilere dengeli eşle"
  - "Yük dengeleme: blok, döngüsel ve dinamik (atomik sayaç) dağıtım"
sources:
  - {title: "Barlas — Multicore and GPU Programming: An Integrated Approach (2. baskı), Bölüm 1–2", url: "https://www.elsevier.com/books/multicore-and-gpu-programming/barlas/978-0-12-814120-5", license: "©", use: link}
  - {title: "Foster — Designing and Building Parallel Programs (1995, çevrimiçi)", url: "https://www.mcs.anl.gov/~itf/dbpp/", license: "ücretsiz çevrimiçi", use: link}
  - {title: "Amdahl — Validity of the single processor approach to achieving large scale computing capabilities (AFIPS 1967)", url: "https://doi.org/10.1145/1465482.1465560", license: "©", use: link}
  - {title: "Gustafson — Reevaluating Amdahl's Law (CACM 1988)", url: "https://doi.org/10.1145/42411.42415", license: "©", use: link}
  - {title: "Mattson, Sanders, Massingill — Patterns for Parallel Programming (2004)", url: "https://www.oreilly.com/library/view/patterns-for-parallel/0321228111/", license: "©", use: link}
  - {title: "Blumofe & Leiserson — Scheduling Multithreaded Computations by Work Stealing (JACM 1999)", url: "https://doi.org/10.1145/324133.324234", license: "©", use: link}

hand:
  groups:
    - title: "Yasalar: paralelleşebilir oran f = 0.9, N = 8"
      fields:
        - {id: am, label: "Amdahl hızlanması", answer: 4.705882352941177, tol: 1.0e-6}
        - {id: lim, label: "N → ∞ sınırı", answer: 10}
        - {id: gu, label: "Gustafson (ölçeklenmiş) hızlanması", answer: 7.3}
        - {id: ef, label: "Amdahl verimliliği S/N", answer: 0.5882352941176471, tol: 1.0e-6}
        - {id: kf, label: "Karp–Flatt: ölçülen S = 4.70588, p = 8 → seri oran e", answer: 0.1, tol: 1.0e-4}
    - title: "Boru hattı ve indirgeme"
      fields:
        - {id: pipe, label: "Aşama süreleri (2, 3, 5, 2, 3), 100 öğe: toplam süre", answer: 510}
        - {id: wk, label: "1024 sayının ağaç toplamı: iş (toplama sayısı)", answer: 1023}
        - {id: sp, label: "Aynı ağacın yolu (adım sayısı)", answer: 10}
  verify: |
    f, N = 0.9, 8
    S = 1 / ((1 - f) + f / N)
    answers = dict(am=S, lim=1 / (1 - f), gu=(1 - f) + f * N, ef=S / N, kf=(1 / 4.70588 - 1 / 8) / (1 - 1 / 8),
                   pipe=sum([2, 3, 5, 2, 3]) + 99 * 5, wk=1023, sp=10)

