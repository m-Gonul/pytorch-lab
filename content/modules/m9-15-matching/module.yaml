id: m9-15-matching
code: M9.15
title: Eşleştirme — şablon, homografi, RANSAC, panorama, korelasyon filtreleri
phase: 9
minutes: 480
prereq: [m9-14-features, m9-10-frequency]
summary: >
  Örüntü tanımanın en yalın biçimi şablon eşleme ve normalize korelasyon
  katsayısı; öznitelik eşleştirmeden homografiye (DLT, Hartley
  normalizasyonu), aykırı değerlere dayanıklı RANSAC ve alıştırma 6'nın
  panoraması; şablonu her karede yeniden öğrenen ayırt edici korelasyon
  süzgeçleri (MOSSE → CSRT). Saf Python'da NCC ve 4 noktadan homografi;
  NumPy'da `cv2.matchTemplate` ile aynı NCC haritası ve tüm hipotezleri tek
  SVD çağrısında çözen vektörel RANSAC; PyTorch'ta frekans uzayında MOSSE
  izleyici; en sonda torch'ta toplu RANSAC + `grid_sample` ile panorama.
goals:
  - "Normalize korelasyon katsayısı $\\gamma\\in[-1,1]$: genlik ve ofset değişimine dayanıklı şablon eşleme"
  - "[[homografi]] ve DLT: 4 nokta, 8 serbestlik; normalizasyonun koşul sayısına etkisi"
  - "[[RANSAC]]: gereken iterasyon $N=\\frac{\\log(1-p)}{\\log(1-w^s)}$; içerdeğerlerle yeniden kestirim"
  - "DCF/MOSSE: $H^*=\\frac{\\sum G\\odot F^*}{\\sum F\\odot F^*+\\lambda}$, PSR ile güven"
sources:
  - {title: "Gonzalez & Woods — Digital Image Processing, 4. baskı, Bölüm 12.2–12.3", url: "https://www.imageprocessingplace.com/", license: "©", use: link}
  - {title: "Hartley & Zisserman — Multiple View Geometry, Bölüm 4 (DLT, normalizasyon, RANSAC)", url: "https://www.robots.ox.ac.uk/~vgg/hzbook/", license: "©", use: link}
  - {title: "Fischler & Bolles — Random Sample Consensus (CACM 1981)", url: "https://doi.org/10.1145/358669.358692", license: "©", use: link}
  - {title: "Bolme, Beveridge, Draper, Lui — Visual Object Tracking using Adaptive Correlation Filters (CVPR 2010)", url: "https://doi.org/10.1109/CVPR.2010.5539960", license: "©", use: link}
  - {title: "OpenCV — matchTemplate, findHomography", url: "https://docs.opencv.org/4.x/df/dfb/group__imgproc__object.html", license: "Apache-2.0", use: adapt}

hand:
  groups:
    - title: "Korelasyon ve homografi"
      fields:
        - {id: ncc, label: "$\\gamma([1,2,3,4],[2,1,4,3])$", answer: 0.6}
        - {id: npt, label: "Homografiyi belirlemek için gereken en az nokta eşi", answer: 4}
        - {id: hp, label: "$H=\\begin{bmatrix}1&0&0\\\\0&1&0\\\\0.01&0&1\\end{bmatrix}$ ile $(100,50)$'nin $x'$'i", answer: 50}
    - title: "RANSAC ve MOSSE"
      fields:
        - {id: N, label: "$p=0.99$, içerdeğer oranı $w=0.5$, $s=4$: gereken iterasyon (yukarı yuvarla)", answer: 72}
        - {id: N2, label: "Aynı, $w=0.8$", answer: 9}
        - {id: mo, label: "1-B MOSSE: $F=2$, $G=4$, $\\lambda=1$: $H^*=GF^*/(FF^*+\\lambda)$", answer: 1.6}
  verify: |
    import math
    import numpy as np
    x, y = np.array([1, 2, 3, 4.]), np.array([2, 1, 4, 3.])
    xz, yz = x - x.mean(), y - y.mean()
    H = np.array([[1, 0, 0], [0, 1, 0], [0.01, 0, 1]])
    p = H @ [100, 50, 1]
    N = lambda w: math.ceil(math.log(1 - 0.99) / math.log(1 - w ** 4))
    answers = dict(ncc=(xz @ yz) / math.sqrt((xz @ xz) * (yz @ yz)), npt=4, hp=p[0] / p[2], N=N(0.5), N2=N(0.8), mo=4 * 2 / (2 * 2 + 1))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Şablon eşleme yöntemleri ve çok ölçekli arama", engine: browser}
  - {id: x2, title: "Hartley normalizasyonu neden şart?", engine: browser}
  - {id: x3, title: "Laplacian piramidiyle dikişsiz harmanlama", engine: browser}

quiz:
  - q: "Normalize korelasyon katsayısı neden ham korelasyondan iyidir?"
    options:
      - {t: "Şablonun ve pencerenin ortalamasını çıkarıp standart sapmalarına bölerek parlaklık ofsetine ve kazanca karşı değişmez olur", ok: true, why: "Ham korelasyon parlak bölgelerde her zaman büyüktür."}
      - {t: "Daha hızlı hesaplanır", why: "Daha pahalıdır (integral görüntüyle hızlandırılır)."}
      - {t: "Dönmeye karşı değişmezdir", why: "Değildir; döndürülmüş şablonlar gerekir."}
  - q: "RANSAC'ta neden önce minimal örnek (4 nokta) kullanılır?"
    options:
      - {t: "Örneğin tamamen içerdeğerlerden oluşma olasılığı w^s, s küçüldükçe büyür", ok: true, why: "Bulunan en iyi hipotezin içerdeğerleriyle sonra en küçük kareler kestirimi yapılır."}
      - {t: "4 noktadan fazlasıyla homografi çözülemez", why: "Fazlası en küçük kareler ile çözülür."}
      - {t: "Hesap belleği yetmediği için", why: "Sebep olasılıksal."}
  - q: "MOSSE izleyicide süzgeç neden her karede güncellenir?"
    options:
      - {t: "Hedefin görünümü (dönme, ölçek, aydınlatma) değiştikçe sabit bir şablon kayar; hareketli ortalama süzgeci uyarlar", ok: true, why: "Öğrenme oranı η ile $A_t=\\eta G F^*+(1-\\eta)A_{t-1}$."}
      - {t: "FFT boyutu değiştiği için", why: "Pencere boyutu sabit."}
      - {t: "Gürültüyü artırmak için", why: "Tersine, birçok örnekte ortalar."}

homework:
  - title: "CSR-DCF: kanal ve uzamsal güvenilirlikli korelasyon süzgeci"
    paper: "Lukežič, Vojíř, Čehovin Zajc, Matas, Kristan — Discriminative Correlation Filter with Channel and Spatial Reliability (CVPR 2017)"
    url: "https://arxiv.org/abs/1611.08461"
    level: ileri
    hours: 16
    goal: |
      d aşamasındaki MOSSE'yi CSRT'ye (OpenCV'deki adıyla) genişlet: HOG + renk adları (color names) öznitelik kanalları, ön plan/arka plan histogramlarından uzamsal güvenilirlik haritası ve bu maskeyle kısıtlı süzgeç öğrenimi (ADMM), kanal başına güvenilirlik ağırlıkları. VOT ya da OTB'den birkaç dizide `cv2.TrackerCSRT_create` ve MOSSE ile karşılaştır.
    steps:
      - "Çok kanallı DCF: kanal başına süzgeç, yanıtların ağırlıklı toplamı."
      - "Uzamsal güvenilirlik: renk histogramlarından olasılık + Markov rastgele alan düzgünleştirmesi (basitleştirilmiş: morfolojik kapama, M9.8)."
      - "Maskeli süzgeç için ADMM (makaledeki Algoritma 1)."
      - "Başarı grafiği (IoU eşiğine karşı başarı oranı) ve hassasiyet grafiği (merkez hatası)."
    accept:
      - "En az 5 dizide başarı grafiği; CSR-DCF'in AUC'si MOSSE'den yüksek."
      - "Uzamsal maskenin kapalı/açık ablasyonu."
  - title: "Otomatik panorama (alıştırma 6'nın tamamı)"
    paper: "Brown & Lowe — Automatic Panoramic Image Stitching using Invariant Features (IJCV 2007)"
    url: "https://doi.org/10.1007/s11263-006-0002-3"
    level: orta
    hours: 12
    goal: |
      Sırasız bir görüntü kümesinden panorama: SIFT eşleştirme, RANSAC ile homografi, görüntü eşleşme grafiği ve bağlı bileşenler, demet ayarı (bundle adjustment; basitleştirilmiş: dönme + odak uzaklığı), silindirik izdüşüm, kazanç telafisi ve çok bantlı (Laplacian piramidi, x3) harmanlama. Altın Kapı (goldengate-00…05) dizisinde `cv2.Stitcher` ile karşılaştır.
    steps:
      - "Her görüntü çifti için eşleşme sayısı ve olasılıksal doğrulama ($n_i>8+0.3n_f$)."
      - "Silindirik çarpıtma ve yalnız ötelemeli hizalamanın basit sürümü; sonra tam homografi zinciri."
      - "Kazanç telafisi: örtüşmelerde ortalama yoğunluk eşitleme (en küçük kareler)."
    accept:
      - "6 görüntülük dizide gözle görülür dikiş ve hayalet olmadan panorama."
      - "Çift başına RANSAC içerdeğer sayıları tablosu ve `cv2.Stitcher` çıktısıyla yan yana görsel."

labs:
  - id: l1
    lab: ncclab
    title: "Ham korelasyon, SSD ve normalize korelasyon katsayısı"
    goal: |
      Bir şablonun iki kopyasını (biri aydınlatması değişmiş bölgede) ve parlak düz bir çeldirici kare içeren sahnede ham korelasyon, SSD ve korelasyon katsayısı γ ile şablon eşleme yap. Eşleme haritasını, bulunan konumu ve iki kopyadaki değerleri karşılaştır. γ, cv2.matchTemplate(TM_CCOEFF_NORMED) ile 10⁻⁵ içinde aynı.
    predict:
      q: "Ham korelasyon (Σ w·f) en büyük değerini nerede alır?"
      options:
        - {t: "Özgün kopyada", why: "Kopyada değer 42; parlak düz kare daha büyük çarpım veriyor (60)."}
        - {t: "Parlak çeldirici karenin yakınında", ok: true, why: "Ham korelasyon genliğe duyarlı: düz ama parlak bir bölge şablonla büyük çarpım verir."}
        - {t: "Aydınlatması değişmiş kopyada", why: "Orada kazanç 0.6, değer daha da küçük (32)."}
    presets:
      - {name: "Ham korelasyon", params: {m: 0, gain: 0.6, bias: 0.1, dist: 0.9, noise: 0.03}, note: "En iyi konum çeldiricinin yakınında: yanlış."}
      - {name: "Çeldiricisiz", params: {m: 0, dist: 0.3}, note: "Ham korelasyon da özgün kopyayı buluyor."}
      - {name: "SSD", params: {m: 1}, note: "Özgün kopya −0.13, değişmiş kopya −2.83: aydınlatma cezalandırılıyor."}
      - {name: "NCC", params: {m: 2}, note: "İki kopya 0.991 ve 0.977: kazanç ve ofset affediliyor."}
      - {name: "NCC, sert aydınlatma", params: {m: 2, gain: 0.3, bias: 0.3}, note: "Değişmiş kopya 0.917: kazanç azaldıkça gürültünün göreli payı artıyor."}
      - {name: "NCC, güçlü gürültü", params: {m: 2, noise: 0.15}, note: "0.83 ve 0.69: hâlâ doğru yer."}
    questions:
      - q: "γ kazanca tam değişmezse, sert aydınlatmada (kazanç 0.3) değişmiş kopyanın γ'sı neden 0.98'den 0.92'ye düşüyor?"
        a: "Gürültü aydınlatmadan sonra eklenmiyor; sahne gürültüsü kazançla birlikte küçülmüyor (sabit σ). Kazanç sinyali küçültünce sinyal/gürültü oranı düşer ve normalize vektörler arasındaki açı büyür. γ kazancı affeder, ama gürültüye göre zayıflayan sinyali affedemez."
    limits: "72 × 72 yapay sahne, 11 × 11 şablon; ölçek ve dönme değişimi yok."
  - id: l2
    lab: ransaclab
    title: "RANSAC: iterasyon formülü, eşik ve aykırı değerler"
    goal: |
      Aykırı değer oranı ε olan noktalara RANSAC ile doğru uydur ve bütün noktalara en küçük karelerle karşılaştır. Gerçekleşen içerdeğer oranından hesaplanan kuramsal başarı olasılığını, aynı N ile 1000 bağımsız denemenin deneysel oranıyla karşılaştır; eşik t'nin ve N'nin etkisini gör.
    predict:
      q: "ε = 0.5 nominal oranla N = 17 seçiliyor (p = 0.99 için). Bu örnekte gerçekleşen içerdeğer oranı 0.37 ise başarı olasılığı ne olur?"
      options:
        - {t: "≈ 0.99", why: "Bu nominal w = 0.5 içindir."}
        - {t: "≈ 0.91", ok: true, why: "Kuram 0.914, deney 0.898: gerçek w düşük olduğu için 32 iterasyon gerekirdi."}
        - {t: "≈ 0.5", why: "17 iterasyon yine de çoğu zaman temiz bir örnek bulur."}
    presets:
      - {name: "Varsayılan", params: {n: 100, eps: 0.5, sn: 0.1, t: 0.3, N: 17}, note: "Kuram 0.914, deney 0.898; RANSAC hatası 0.04, EKK 2.36."}
      - {name: "Az iterasyon", params: {N: 3}, note: "Kuram 0.352, deney 0.331."}
      - {name: "%80 aykırı, N = 113", params: {eps: 0.8, N: 113}, note: "Gerçek w = 0.17: kuram 0.957, deney 0.944; 166 gerekirdi."}
      - {name: "Aykırı yok", params: {eps: 0}, note: "RANSAC ve EKK aynı: hata 0.016."}
      - {name: "Dar eşik", params: {t: 0.05}, note: "Yalnız 19 içerdeğer: model daha az destekle seçiliyor."}
      - {name: "Geniş eşik", params: {t: 2}, note: "64 içerdeğer: bazı aykırılar da katılıyor, hata 0.10."}
      - {name: "Çok nokta", params: {n: 300}, note: "Gerçek w 0.467, nominal 0.5'e yakın: kuram 0.984, deney 0.993."}
    questions:
      - q: "Neden RANSAC son modeli tek bir minimal örnekten değil, bütün içerdeğerlerden yeniden kestirir?"
        a: "Minimal örnek (2 ya da 4 nokta) gürültülüdür; içerdeğerlerin hepsiyle en küçük kareler gürültüyü ortalar. RANSAC'ın görevi aykırıları ayıklamaktır; içerdeğerler bulunduktan sonra en iyi kestirici yine en küçük karelerdir."
    limits: "Doğru modeli (s = 2); homografi için s = 4 ve N çok daha büyür (Şekil 1)."
  - id: l3
    lab: mossetrack
    title: "MOSSE izleyici, PSR ve sabit şablon"
    goal: |
      60 karelik yapay bir videoda dokusu dönen, aydınlatması değişen ve kısmen örtülen bir hedefi MOSSE ile izle; sabit şablonlu bir NCC izleyiciyle karşılaştır. Öğrenme oranı η, düzenleme λ, örtme ve PSR ile güncellemeyi durdurma eşiğinin etkisini merkez hatası ve PSR eğrileriyle ölç.
    predict:
      q: "Varsayılan sahnede sabit şablonlu NCC izleyicinin ortalama hatası nedir (MOSSE 0.7 piksel)?"
      options:
        - {t: "≈ 1 piksel", why: "Görünüş değişmeseydi öyle olurdu (yalnız örtmeli sahnede 1.4)."}
        - {t: "≈ 24 piksel", ok: true, why: "Doku döndükçe ilk karedeki şablon artık eşleşmiyor; 60 karenin 41'inde 8 pikselden fazla sapma."}
        - {t: "≈ 0.5 piksel", why: "Sabit şablon görünüş değişimine uyum sağlamaz."}
    presets:
      - {name: "Varsayılan", params: {eta: 0.125, lam: 100, speed: 1, occ: 1, morph: 0.5, light: 0.4, noise: 0.02, gate: 0}, note: "MOSSE 0.70, NCC 24 piksel."}
      - {name: "Güncellemesiz MOSSE", params: {eta: 0}, note: "34 piksel: sabit süzgeç de görünüşü izleyemiyor."}
      - {name: "Yalnız örtme", params: {morph: 0, light: 0}, note: "MOSSE örtücüyü öğreniyor: 7.0 piksel (NCC 1.4)."}
      - {name: "Örtme + PSR eşiği", params: {morph: 0, light: 0, gate: 6}, note: "Düşük güvende güncelleme durunca 2.8 piksel."}
      - {name: "Eşik, değişen görünüş", params: {gate: 6}, note: "8.4 piksel: eşik güncellemeyi gereğinden sık durduruyor."}
      - {name: "Düzenlemesiz", params: {lam: 0.01}, note: "Bu sahnede yine 0.74; ama η = 0 ile durgun hedefte λ = 0.01 izleyiciyi kaybettiriyor."}
    questions:
      - q: "PSR eşiği neden hem iyileştirebiliyor hem kötüleştirebiliyor?"
        a: "PSR, hem örtmede hem de görünüşün hızla değiştiği karelerde düşer. Örtmede güncellemeyi durdurmak örtücünün öğrenilmesini önler; ama görünüş değişirken durdurmak süzgeci eski görünüşte bırakır ve hedef kaybedilir. Eşik, uyum ile sağlamlık arasında bir ödünleşimdir; CSRT gibi yöntemler bu yüzden güvenilirliği piksel ve kanal düzeyinde modeller."
    limits: "96 × 96, 60 kare yapay video; gri seviye MOSSE (ölçek kestirimi yok); NCC izleyici ±10 piksel arama, sabit şablon."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Korelasyon katsayısı
    goal: γ'yı elle hesaplamak
    needs: Ortalama çıkarma, normalizasyon
    q: |-
      $w=[0,2,4]$, pencere $f=[10,14,18]$. Ham korelasyon ve γ?
    solution: |-
      Ham: $0+28+72=100$. Ortalamalar 2 ve 14: $a=[-2,0,2]$, $b=[-4,0,4]$; $a\cdot b=16$, $\|a\|=\sqrt8$, $\|b\|=\sqrt{32}$: $\gamma=16/16=1$. Pencere şablonun $2w+10$'udur: kazanç ve ofset γ'yı değiştirmez.
  - id: p2
    type: hesap
    level: 1
    title: RANSAC iterasyonu
    goal: Formülü uygulamak
    needs: $N=\lceil\log(1-p)/\log(1-w^s)\rceil$
    q: |-
      Homografi ($s=4$), içerdeğer oranı 0.6, $p=0.99$. $N$?
    answer: 34
    calc: "math.ceil(math.log(0.01)/math.log(1-0.6**4))"
    tol: 0
    mistakes:
      - {answer: 11, msg: "Bu s = 2 için (doğru)."}
      - {answer: 72, msg: "Bu w = 0.5 için."}
    hints:
      - "$0.6^4=0.1296$."
    solution: |-
      $\log0.01/\log0.8704=33.1\to34$.
  - id: p3
    type: hesap
    level: 1
    title: Homografinin etkisi
    goal: Homojen koordinatlarla nokta eşlemek
    needs: $\mathbf x'\sim\mathbf H\mathbf x$, sonra bölme
    q: |-
      $\mathbf H=\begin{bmatrix}2&0&10\\0&2&0\\0&0.01&1\end{bmatrix}$, nokta $(20,100)$. $y'$?
    answer: 100
    calc: "(0*20+2*100+0)/(0*20+0.01*100+1)"
    tol: 1e-9
    mistakes:
      - {answer: 200, msg: "Homojen bölme unutuldu: payda 0.01 · 100 + 1 = 2."}
      - {answer: 25, msg: "x′'yi değil y′'yi sordu: x′ = 50/2 = 25."}
    hints:
      - "Payda $h_{31}x+h_{32}y+h_{33}=2$."
    solution: |-
      $y'=200/2=100$, $x'=(40+10)/2=25$.
  - id: p4
    type: hesap
    level: 2
    title: MOSSE güncellemesi
    goal: Üstel ortalamayı uygulamak
    needs: $A_t=\eta G\bar F+(1-\eta)A_{t-1}$
    q: |-
      Tek bir frekansta (gerçel) $A_{t-1}=6$, $B_{t-1}=4$; yeni karede $F=1$, $G=4$; $\eta=0.2$, $\lambda=0$. Güncel $\bar H=A_t/B_t$?
    answer: 1.6471
    calc: "round((0.2*4*1+0.8*6)/(0.2*1*1+0.8*4), 4)"
    tol: 0.0001
    mistakes:
      - {answer: 4.0, msg: "Bu yalnız yeni karenin süzgeci (G/F); geçmiş ağırlıklı ortalamaya girer."}
      - {answer: 1.5, msg: "Bu eski süzgeç (6/4)."}
    hints:
      - "$A_t=0.8+4.8=5.6$, $B_t=0.2+3.2=3.4$."
    solution: |-
      $5.6/3.4=1.6471$: eski (1.5) ile yeni (4) arasında, eskiye yakın. Pay ve payda ayrı ortalandığı için bu, süzgeçlerin doğrudan ortalaması değildir.
  - id: p5
    type: yorumla
    level: 2
    title: Panoramada hayalet görüntü
    goal: Eşleştirme hatasının kaynağını bulmak
    needs: Oran testi, RANSAC eşiği
    q: |-
      İki fotoğraftan panorama kurarken birleşim bölgesinde bina pencereleri çift görünüyor; findHomography 200 eşleşmenin 40'ını içerdeğer sayıyor. Pencereler tekrar eden bir desen. En olası neden ve çözüm?
    choices:
      - {t: "Harmanlama yanlış", why: "Harmanlama çift görüntüyü yumuşatır ama yanlış homografiyi düzeltmez."}
      - {t: "Tekrar eden pencereler yanlış ama tutarlı eşleşmeler üretiyor; oran testini sıkılaştır (0.7), eşleşmeleri benzersizlik ve karşılıklılık ile süz, RANSAC eşiğini ve N'yi gözden geçir", ok: true, why: "Ders örneğindeki özdeş konnektörler gibi: tekrar eden yapılar oran testini zorlar."}
      - {t: "Homografi yerine afin kullanmak", why: "Model gücünü azaltmak hatalı eşleşmeleri düzeltmez."}
    hints:
      - "Tekrar eden yapılar oran testinde neden zorlanır?"
    solution: |-
      Özdeş pencerelerde en yakın iki komşu benzer uzaklıktadır ve oran testi bazılarını geçirebilir; bir pencere dizisi kaydırılmış ama tutarlı bir homografiyi destekleyebilir. Daha sıkı oran, çift yönlü eşleşme ve yeterli N ile RANSAC; gerekirse eşleşmeleri görüntünün farklı bölgelerine yayılmaya zorlamak.
  - id: p6
    type: kanıt
    level: 3
    title: MOSSE'nin kapalı çözümü
    goal: Frekansta en küçük kareleri çözmek
    needs: Parseval, karmaşık türev
    q: |-
      $\sum_i\|f_i\star h-g_i\|^2+\lambda\|h\|^2$'yi en küçükleyen süzgecin frekans uzayında $\bar H=\frac{\sum_iG_i\bar F_i}{\sum_iF_i\bar F_i+\lambda}$ olduğunu göster. Neden her frekansın ayrı çözüldüğünü açıkla.
    rubric:
      - "Parseval ile uzamsal toplamı frekans toplamına çevirdim (sabit çarpan dışında)"
      - "Korelasyonun frekansta F ⊙ H̄ çarpımı olduğunu kullandım"
      - "Amacın frekanslar üzerinde ayrık terimlerin toplamı olduğunu ve her frekansın bağımsız en küçüklendiğini belirttim"
      - "H̄'ye (ya da H'ye) göre karmaşık türevi sıfırlayıp kapalı biçimi buldum"
    hints:
      - "$\\partial|a\\bar H-b|^2/\\partial H=\\bar a(a\\bar H-b)$ (Wirtinger)."
    solution: |-
      Parseval: $\|f\star h-g\|^2\propto\sum_\omega|F\bar H-G|^2$; düzenleme $\lambda\sum|H|^2$. Amaç $\sum_\omega\bigl[\sum_i|F_i\bar H-G_i|^2+\lambda|\bar H|^2\bigr]$ biçimindedir: her $\omega$ ayrı bir terimdir ve bağımsız en küçüklenir. Türev $\sum_i\bar F_i(F_i\bar H-G_i)+\lambda\bar H=0$ → kapalı biçim. Bu yüzden MOSSE eğitimi piksel sayısında doğrusal (FFT ile $N\log N$) sürededir.
pitfalls:
  - wrong: "Ham korelasyonun en büyük değeri en iyi eşleşmedir."
    right: "Yalnız genlik sabitse. Parlak bölgeler büyük çarpım verir; korelasyon katsayısı (TM_CCOEFF_NORMED) kullanılmalı."
  - wrong: "RANSAC'ta iterasyon sayısını aykırı oranının nominal tahminine göre seçmek yeter."
    right: "Gerçekleşen içerdeğer oranı daha düşükse başarı olasılığı düşer (lab l2'de 0.99 yerine 0.91). Uyarlamalı RANSAC N'yi bulunan en iyi içerdeğer oranına göre günceller."
  - wrong: "Homografi için 3 nokta eşi yeter."
    right: "8 serbestlik vardır: en az 4 eş (üçü doğrudaş olmamalı); 3 eş ancak afin dönüşümü belirler."
  - wrong: "MOSSE'nin λ'sı küçük bir sayısal koruma terimidir, değeri önemsizdir."
    right: "λ, |F|² ile aynı ölçekte olmalıdır; aksi hâlde süzgeç neredeyse bir ters süzgeçtir ve eğitim örneklerine aşırı uyar."
whatif:
  - q: "Şablon eşlemede hedef 20° dönmüş ya da 1.5 kat büyümüş olsaydı?"
    a: "γ hızla düşer: şablon eşleme dönme ve ölçeğe değişmez değildir. Çözümler: şablonun döndürülmüş/ölçeklenmiş sürümleriyle arama (maliyet çarpılır), log-polar dönüşüm ya da değişmez öznitelikler (SIFT) + homografi."
  - q: "RANSAC yerine bütün eşleşmelere Huber gibi sağlam bir kayıp kullanılsa?"
    a: "Az aykırıda iyi çalışır, ama aykırı oranı %50'yi aşınca M-kestiriciler çöker (kırılma noktası); RANSAC yüksek aykırı oranlarını kaldırabilir ama iterasyon sayısı büyür. Pratikte RANSAC ile başlangıç + sağlam kayıpla iyileştirme birlikte kullanılır."
  - q: "MOSSE'de istenen çıktı G Gauss tepe yerine tek bir dürtü olsa?"
    a: "Süzgeç, örneklerdeki küçük kaymalara karşı aşırı keskin olur ve yanıt kararsızlaşır; Gauss tepe, hedefin yakın komşu konumlarını da kısmen kabul ederek süzgeci düzgünleştirir. σ'yı büyütmek sağlamlığı artırır ama konum hassasiyetini düşürür."
