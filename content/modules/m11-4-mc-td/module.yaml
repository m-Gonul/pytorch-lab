quiz:
- q: TD hedefi neden yanlıdır?
  options:
  - t: 'Gerçek getiri yerine kendi (henüz yanlış) kestirimimiz V(s'')''yi kullanır: önyükleme (bootstrapping)'
    ok: true
    why: Karşılığında tek adımlık rastgelelik içerdiği için varyansı düşüktür.
  - t: İndirim faktörü kullandığı için
    why: MC de indirim kullanır.
  - t: Öğrenme oranı sabit olduğu için
    why: Yanlılık hedefin kendisinden gelir.
- q: Toplu (batch) MC ve TD aynı veride neden farklı V(A) bulur?
  options:
  - t: MC gözlenen getirilerin ortalamasını (eğitim kare hatasını en aza indirir), TD ise veriye en uygun Markov
      modelinin değerini (kesinlik eşdeğerliği) bulur
    ok: true
    why: A'dan hep B'ye geçildiği için TD, V(A) = V(B) der.
  - t: TD daha az bölüm kullandığı için
    why: Aynı veri.
  - t: MC yakınsamadığı için
    why: İkisi de yakınsar.
- q: λ = 1 ile TD(λ) neye karşılık gelir?
  options:
  - t: Monte Carlo (çevrimdışı, bölüm sonunda güncellemede tam eşdeğer)
    ok: true
    why: λ = 0 tek adımlı TD'dir.
  - t: Değer yinelemesine
    why: Model gerektirmez.
  - t: Q-öğrenmeye
    why: Bu değerlendirme yöntemidir.
homework:
- title: 'Sutton (1988): TD yöntemleriyle tahmin'
  paper: Sutton — Learning to Predict by the Methods of Temporal Differences (Machine Learning 1988)
  url: https://doi.org/10.1007/BF00115009
  level: orta
  hours: 8
  goal: 'Makalenin rastgele yürüyüş deneylerini (Şekil 3, 4, 5) yeniden üret: 100 eğitim kümesi × 10 dizi,
    (1) tekrarlı sunum (batch, yakınsayana dek) altında λ''ya karşı RMS hata, (2) tek sunum altında farklı
    α ve λ için hata. Doğrusal fonksiyon yaklaştırıcı (birim vektör öznitelikleri) ile Widrow–Hoff kuralının
    TD(1) olduğunu göster.

    '
  steps:
  - Bu modüldeki d aşamasının iz uygulamasını kullan; ağırlıkları dizi sonunda güncelle.
  - Tekrarlı sunumda ağırlık değişimi < 1e-3 olana dek tekrar.
  - En iyi α ile λ ∈ {0, 0.1, …, 1} eğrisi.
  accept:
  - 'Şekil 3: hata λ arttıkça artar (λ = 0 en iyi, ≈ 0.19), λ = 1 ≈ 0.25.'
  - 'Şekil 4/5''in nitel biçimi: ara λ (≈ 0.3) tek sunumda en iyi.'
labs:
- id: l1
  lab: mctd
  title: 'Beş durumlu rastgele yürüyüş: Monte Carlo ve TD(0)'
  goal: 'Rastgele politikanın değerini her ziyaret Monte Carlo ve TD(0) ile kestir. Çok sayıda bağımsız çalıştırmanın
    ortalama RMS hatasını bölüm sayısına göre çiz. Sabit öğrenme oranının gürültü tabanını, α = 1/n(s)''nin
    davranışını ve iki yöntemin hız farkını gör.

    '
  predict:
    q: Sabit α (MC 0.02, TD 0.1) ile 100 bölüm sonunda hangisinin ortalama hatası daha düşüktür?
    options:
    - t: 'MC: yansız olduğu için'
      why: Yansızlık tek başına yetmez; varyansı yüksek (0.080'e karşı 0.054).
    - t: TD
      ok: true
      why: 100 çalıştırma ortalamasında TD 0.054, MC 0.080.
    - t: 'İkisi aynı: aynı veriyi kullanıyorlar'
      why: Aynı veriden farklı hedefler kuruyorlar.
  presets:
  - name: Varsayılan
    params:
      sched: 0
      am: 0.02
      at: 0.1
      E: 100
      R: 100
    note: MC 0.080, TD 0.054.
  - name: Örnek ortalaması (1/n)
    params:
      sched: 1
      E: 100
      R: 100
    note: MC 0.062, TD 0.046.
  - name: Küçük TD adımı
    params:
      sched: 0
      am: 0.02
      at: 0.05
      E: 100
      R: 100
    note: TD 0.036.
  - name: Büyük TD adımı
    params:
      sched: 0
      am: 0.02
      at: 0.15
      E: 100
      R: 100
    note: TD hızlı iner, 0.068'de durur.
  - name: Uzun, sabit α
    params:
      sched: 0
      am: 0.04
      at: 0.05
      E: 300
      R: 100
    note: 'MC 0.104''te takılı: sabit α''nın gürültü tabanı.'
  - name: Tek çalıştırma
    params:
      sched: 0
      am: 0.02
      at: 0.1
      E: 100
      R: 1
    note: Tek eğri gürültülü; ortalama almadan sonuç çıkarılamaz.
  questions:
  - q: Sabit α ile hata neden sıfıra inmiyor, ve hangi koşulda bu bir avantaj olur?
    a: 'Sabit α Robbins–Monro''nun Σα² < ∞ koşulunu bozar: her güncelleme yeni gürültü ekler ve tahmin gerçek
      değer etrafında α ile büyüyen bir dağılımla dolaşır. Ortam zamanla değişiyorsa (durağan değilse) bu bir
      avantajdır: eski deneyim (1 − α)^k ağırlıkla unutulur ve tahmin değişen değeri izler; 1/n ise eski gözlemleri
      sonsuza dek eşit ağırlıkta tutar.'
  limits: Rastgele politika, γ = 1, başlangıç V = 0.5. MC her ziyaret; ödül yalnız sağ çıkışta olduğu için
    getiri bölümün son ödülüdür. RMS, beş durumun eşit ağırlıklı ortalaması.
- id: l2
  lab: batchmctd
  title: 'Toplu MC ve toplu TD: aynı veriden iki farklı cevap'
  goal: 'Sınırlı bir deneyim kümesi üzerinde yakınsayana dek tekrarlanan (toplu) MC ve TD güncellemelerinin
    sabit noktalarını hesapla. Sutton''ın A–B örneğinde V(A)''nın iki yöntemde neden farklı çıktığını ve rastgele
    yürüyüşte veri miktarı arttıkça hangisinin daha az hata yaptığını gör.

    '
  predict:
    q: A–B örneğinde (A, 0, B, 0 bir bölüm; B'den 6 bölüm 1, 1 bölüm 0) toplu TD V(A) için ne verir?
    options:
    - t: '0: A''dan görülen tek getiri 0'
      why: Bu toplu MC'nin cevabı.
    - t: '0.75'
      ok: true
      why: A'dan her zaman 0 ödülle B'ye geçiliyor (kestirilen model); V(A) = 0 + V(B) = 0.75.
    - t: '0.5'
      why: A'nın getirisi ile B'nin değeri ortalanmaz.
  presets:
  - name: A–B örneği
    params:
      data: 0
      k: 6
    note: MC 0, TD 0.75.
  - name: A–B, k = 3
    params:
      data: 0
      k: 3
    note: MC 0, TD 0.375.
  - name: A–B, k = 0
    params:
      data: 0
      k: 0
    note: 'V(B) = 0: iki yöntem aynı.'
  - name: Rastgele yürüyüş, 20 bölüm
    params:
      data: 1
      E: 20
      R: 100
    note: MC 0.133, TD 0.086.
  - name: Rastgele yürüyüş, 100 bölüm
    params:
      data: 1
      E: 100
      R: 100
    note: MC 0.062, TD 0.041.
  - name: Tek veri kümesi
    params:
      data: 1
      E: 20
      R: 1
    note: Gürültülü eğriler.
  questions:
  - q: Süreç Markov değilse (ör. A'dan sonra gelen B'nin sonucu A'dan gelinip gelinmediğine bağlıysa) hangi
      cevap daha güvenilirdir?
    a: 'Toplu TD''nin kesinlik eşdeğeri, B''nin değerinin nereden gelindiğinden bağımsız olduğunu varsayar.
      A''dan gelindiğinde B gerçekten hep 0 veriyorsa (gizli bir durum), Markov varsayımı yanlıştır ve MC''nin
      V(A) = 0 cevabı daha doğrudur: MC durumlar arasında hiçbir yapı varsaymaz, yalnız gözlenen getirileri
      ortalar. TD''nin üstünlüğü Markov özelliğinin doğru olmasına bağlıdır.'
  limits: 'γ = 1; toplu sabit noktalar kapalı biçimde hesaplanıyor (MC: getirilerin ortalaması, TD: sayım oranlı
    modelin doğrusal sistemi). Rastgele yürüyüşte hiç ziyaret edilmemiş durum 0.5 sayılıyor.'
