practice:
- id: p1
  type: çözülmüş
  level: 0
  title: Bir bölümden MC ve TD güncellemeleri
  goal: İki güncellemeyi aynı veriyle uygulamak
  needs: $G_t$, $\delta$
  q: 'Rastgele yürüyüşte bütün değerler 0.5 iken bir bölüm gözleniyor: C → D → E → (sağdan çık, ödül 1). $\alpha=0.1$,
    $\gamma=1$. Her ziyaret MC ve TD(0) güncellemelerinden sonra $V(C)$, $V(D)$, $V(E)$ nedir?'
  solution: 'MC: her durumun getirisi 1; $V\leftarrow0.5+0.1(1-0.5)=0.55$ üçü için. TD (sırayla): C: $\delta=0+V(D)-V(C)=0$,
    değişmez (0.5); D: $\delta=0+V(E)-V(D)=0$, 0.5; E: $\delta=1+0-0.5=0.5$, $V(E)=0.55$. TD bu bölümde yalnız
    son durumu değiştirdi; bilgi önceki durumlara sonraki bölümlerde yayılır.'
- id: p2
  type: hesap
  level: 1
  title: TD hatası ve güncelleme
  goal: TD(0) güncellemesini hesaplamak
  needs: $V(s)\leftarrow V(s)+\alpha\delta$
  q: $V(s)=2$, $r=-1$, $V(s^+)=4$, $\gamma=0.9$, $\alpha=0.25$. Güncellenmiş $V(s)$ nedir?
  answer: 2.15
  calc: 2 + 0.25*(-1 + 0.9*4 - 2)
  mistakes:
  - answer: 2.25
    msg: 'γ unutulmuş: −1 + 4 − 2 = 1.'
  - answer: 2.6
    msg: δ = 0.6'nın tamamı eklenmiş; α ile çarpılmalı.
  hints:
  - Önce $\delta=r+\gamma V(s^+)-V(s)$.
  solution: $\delta=-1+3.6-2=0.6$; $V(s)=2+0.25\cdot0.6=2.15$.
- id: p3
  type: hesap
  level: 1
  title: λ-getirisinde ağırlık
  goal: Geometrik ağırlıkları hesaplamak
  needs: $(1-\lambda)\lambda^{n-1}$
  q: $\lambda=0.8$ ile λ-getirisinde 3 adımlık getirinin ($G^{(3)}$) ağırlığı nedir?
  answer: 0.128
  calc: (1-0.8)*0.8**2
  mistakes:
  - answer: 0.512
    msg: λ³; (1 − λ) çarpanı ve üs n − 1 olmalı.
  - answer: 0.64
    msg: λ² tek başına; (1 − λ) ile çarpılmalı.
  hints:
  - $n=1$'in ağırlığı $1-\lambda$'dır.
  solution: $(1-0.8)\cdot0.8^2=0.2\cdot0.64=0.128$. İlk üç getirinin toplam ağırlığı $1-0.8^3=0.488$.
- id: p4
  type: yöntem-seç
  level: 2
  title: Bitmeyen bir görevde değerlendirme
  goal: MC ve TD'nin uygulanabilirliğini ayırt etmek
  needs: Epizodik ve sürekli görevler
  q: Bir veri merkezinin soğutma politikasının değerini kestirmek istiyorsunuz. Sistem hiç durmuyor (bölüm
    yok), ödül her dakika ölçülüyor, $\gamma=0.99$. Hangisi?
  choices:
  - t: 'Monte Carlo: yansız'
    why: Getiri bölüm sonunda hesaplanır; bölüm yoksa hiç güncelleme yapılamaz.
  - t: 'TD(0) ya da küçük λ''lı TD(λ): her adımda öğrenir'
    ok: true
    why: Bootstrapping, bitmeyen akışta da çalışır.
  - t: Toplu MC, akışı keyfi uzunlukta parçalara bölerek
    why: 'Kesilen getiri, kalan sonsuz kuyruğu yok sayar: yanlı ve keyfi.'
  hints:
  - MC hedefi $G_t$ ne zaman hesaplanabilir?
  solution: TD her geçişte öğrenir. Akışı parçalara bölmek gerekiyorsa getiri parçanın sonunda $\gamma^nV(s_{t+n})$
    ile tamamlanır — bu zaten n adımlı TD'dir.
- id: p5
  type: hata-bul
  level: 2
  title: Yanlış indirimlenen MC getirisi
  goal: Getirinin ziyaret anından indirimlenmesi
  needs: $G_t=\sum_{k\ge t}\gamma^{k-t}r_k$
  q: Bir öğrenci her ziyaret MC'de, bölümün ödüllerinden `G = sum(gamma**k * r[k] for k in range(T))` getirisini
    hesaplıyor ve bölümde ziyaret edilen her durumu bu $G$'ye doğru güncelliyor. $\gamma<1$ iken bölümün sonlarına
    doğru ziyaret edilen durumların değerleri sistematik olarak yanlış çıkıyor. Neden?
  choices:
  - t: Öğrenme oranı fazla büyük
    why: Hata sistematik ve yönlü; oran değil hedef yanlış.
  - t: Getiri bölümün başından indirimleniyor ve önceki ödülleri de içeriyor; t anındaki durum için G_t = Σ_{k≥t}
      γ^{k−t} r_k olmalı
    ok: true
    why: Sonradan ziyaret edilen durumun hedefi hem geçmiş ödülleri hem de fazladan γ^t indirimi taşıyor.
  - t: İlk ziyaret yerine her ziyaret kullanılmış
    why: Her ziyaret MC de tutarlıdır; sorun getirinin tanımında.
  hints:
  - $t=5$'te ziyaret edilen bir durum $r_0$'dan etkilenmeli mi?
  solution: 'Getiriler geriye doğru tek geçişte hesaplanır: `G = 0; for t in reversed(range(T)): G = r[t] +
    gamma * G; ret[t] = G`. Kaynaktaki formül de indirimi mutlak zamandan başlatıyor; bu yalnız bölümün ilk
    durumu için doğrudur.'
- id: p6
  type: kanıt
  level: 3
  title: λ-getirisi ve TD hataları
  goal: İleri ve geri bakışın eşdeğerliğinin anahtar özdeşliğini kanıtlamak
  needs: Teleskopik toplam, geometrik seri
  q: $V$ bölüm boyunca sabitken $\delta_k=r_k+\gamma V(s_{k+1})-V(s_k)$ olsun. $G_t^{(n)}-V(s_t)=\sum_{k=t}^{t+n-1}\gamma^{k-t}\delta_k$
    ve $G_t^\lambda-V(s_t)=\sum_{k\ge t}(\gamma\lambda)^{k-t}\delta_k$ olduğunu gösterin.
  rubric:
  - Σ γ^{k−t} δ_k toplamında γ^{k−t+1}V(s_{k+1}) ile γ^{k+1−t}V(s_{k+1}) terimlerinin sadeleştiğini (teleskopik)
    gösterdim
  - Geriye Σ γ^{k−t} r_k + γ^n V(s_{t+n}) − V(s_t) = G^{(n)} − V(s_t) kaldığını yazdım
  - λ-getirisinde δ_k'nin katsayısını Σ_{n>k−t} (1 − λ)λ^{n−1} γ^{k−t} olarak buldum
  - Bu geometrik toplamın λ^{k−t} olduğunu, katsayının (γλ)^{k−t} çıktığını gösterdim
  hints:
  - $\sum_{n=m+1}^\infty(1-\lambda)\lambda^{n-1}=\lambda^m$.
  solution: 'Teleskopik toplam: $\sum_{k=t}^{t+n-1}\gamma^{k-t}[r_k+\gamma V(s_{k+1})-V(s_k)]=\sum\gamma^{k-t}r_k+\gamma^nV(s_{t+n})-V(s_t)$.
    λ ile ağırlıklandırınca $\delta_k$, $n>k-t$ olan bütün $G^{(n)}$''lerde $\gamma^{k-t}$ katsayısıyla yer
    alır: $\gamma^{k-t}\lambda^{k-t}$. Değerler bölüm içinde değişirse eşdeğerlik yaklaşıktır (çevrimiçi TD(λ));
    "true online TD(λ)" bunu tam yapar.'
