id: m11-4-mc-td
code: M11.4
title: Modelden bağımsız değerlendirme — Monte Carlo ve TD
phase: 11
minutes: 560
prereq:
- m11-3-policy-iteration
summary: 'Geçiş ve ödül modeli bilinmiyorsa değer, oynayarak kestirilir. Monte Carlo: bölüm sonuna kadar oyna,
  getiriyi ortala (ilk-ziyarette uygun koşullarla yansız, yüksek varyans); zamansal fark (TD): bir adım oyna,
  $r+\gamma V(s'')$''ye doğru güncelle (yanlı, düşük varyans). Öğrenme oranı koşulları, toplu (batch) MC ve
  TD''nin farklı cevaplara yakınsaması, n adımlı getiriler ve uygunluk izleriyle TD(λ). Saf Python''da 5 durumlu
  rastgele yürüyüşte MC ve TD; NumPy''da toplu güncelleme ve Sutton''ın A–B örneği; PyTorch''ta ileri bakışlı
  λ-getirisi ile geriye bakışlı izlerin çevrimdışı eşdeğerliği; en sonda 1000 bağımsız deneyi aynı anda yürüten
  vektörel TD.

  '
goals:
- MC hedefi $G_t$, TD hedefi $r+\gamma V(s')$, [[TD hatası]] $\delta=r+\gamma V(s')-V(s)$
- 'Artımlı ortalama ve Robbins–Monro: $\sum\alpha=\infty$, $\sum\alpha^2<\infty$'
- Toplu MC eğitim hatasını, toplu TD en çok olabilirlikli Markov modelinin değerini bulur
- n adımlı TD, λ-getirisi, uygunluk izleri
- 'Sutton Bölüm5: ilk/her ziyaret, 200 durumlu Blackjack ve Dirichlet yüzeyi'
- Ordinary/weighted önem örnekleme; sonsuz varyans ile tutarlılığı ayırmak; indirim/karar başına oranlar
