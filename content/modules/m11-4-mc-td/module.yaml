- id: p18
  type: açıkla
  level: 2
  title: Ağırlıklı karar başına sürüm var mı?
  goal: 2018 literatür notunu bir imkânsızlık teoreminden ayırmak
  needs: Önek oranları, normalized IS, tutarlılık
  q: 'Karar başına önem örneklemesinin weighted sürümü var mı? Kaynağın bu soruya verdiği araştırma notunu
    hangi tarihle ve hangi kapsamla okumalıyız?


    Kaynak: Sutton ve Barto (2018), s.115, numarasız metin içi soru.'
  rubric:
  - Baskının2018 tarihini belirttim
  - Bilinen öneriler ifadesini evrensel imkânsızlıktan ayırdım
  - Sabit sonlu ufuk örneğinde ayrı normalizasyon koşullarını yazdım
  hints:
  - Her ödül zamanının öneklerini ayrı normalize etmek, bütün ziyaretlerin tek paydasını kullanmakla aynı mıdır?
  solution: Kitap2018, yazarların bildiği o zamanki önerilerin tutarlı olmadığını söyler. Bu tarihsel bilgi,
    tüm mümkün weighted yöntemlerin tutarsızlığı teoremi değildir. Kendi öğretim uzantımızda sabit sonlu H
    için terminal sonrasını sıfır ödülle doldurup her zamanda ΣρönekR/Σρönek hesaplarız; kapsama ve integrallenebilirlikle
    her zamanın oranı tutarlı, sonlu toplam da tutarlıdır. Yalnız hayatta kalanları normalize etmek terminal
    olasılığını siler. Bu örnek kaynağın(5.10) formülüyle aynı yöntem değildir, rastgele sonsuz ufka koşulsuz
    taşınmaz.
pitfalls:
- wrong: TD yanlı olduğu için yanlış değere yakınsar.
  right: TD'nin yanlılığı hedefin henüz yanlış olan tahmini kullanmasından gelir ve öğrenme ilerledikçe kaybolur;
    Robbins–Monro koşulları ve yeterli ziyaretle tablo TD(0) doğru V^π'ye yakınsar.
- wrong: Sabit öğrenme oranıyla da tahmin sonunda gerçek değere eşit olur.
  right: 'Sabit α Σα² < ∞ koşulunu bozar: tahmin gerçek değer etrafında α ile orantılı bir gürültüyle dolaşmaya
    devam eder (lab l1). Yakınsama için α_n = 1/n gibi azalan oranlar gerekir; değişen ortamlarda ise sabit
    α bilinçli bir seçimdir.'
- wrong: Aynı veriyle toplu MC ve toplu TD aynı tahmini verir.
  right: Toplu MC eğitim getirilerine kare hatayı en küçükler; toplu TD veriden kestirilen Markov modelinin
    değerini (kesinlik eşdeğeri) bulur. A–B örneğinde V(A) = 0'a karşı 0.75.
- wrong: Monte Carlo yansız olduğu için her zaman en iyi kestiricidir.
  right: Yansızlık hata ölçüsünün yalnız bir parçasıdır; MC'nin yüksek varyansı aynı veriyle daha büyük ortalama
    hata verir (C'de hedef varyansı 1/4'e karşı TD'de 1/36).
- wrong: MC kestirimleri başka değerlere dayanmaz, dolayısıyla istatistiksel olarak bağımsızdır.
  right: Önyükleme yoktur; aynı bölümlerin ödüllerini paylaşan durum tahminleri yine bağımlı olabilir.
- wrong: Sonsuz varyans ordinary IS tutarsızlığını kanıtlar.
  right: Örnek5.5 için E|X|=1; güçlü büyük sayılar yasası yakınsamayı sağlar. Sonlu varyans hız garantisi kaybolur.
whatif:
- q: Ödüller rastgele olsaydı (aynı geçişte farklı ödüller)?
  a: 'İki yöntem de değişmeden çalışır: MC getirileri, TD tek adımlık hedefleri ortalar; ödül gürültüsü her
    iki hedefin varyansını artırır. TD''de yalnız bir ödülün gürültüsü, MC''de bölüm boyunca bütün ödüllerin
    gürültüsü (γ^{2k} ağırlıklı) toplanır.'
- q: Durum sayısı çok büyük olsaydı (her durum en çok bir kez görülseydi)?
  a: 'Tablo tahminleri hiç ortalama alamaz. Değer fonksiyonu parametrik bir fonksiyonla yaklaşılır: V(s) ≈
    v(s; w), güncelleme w ← w + α δ ∇_w v(s; w) (yarı-gradyan TD). Benzer durumlar arasında genelleme yapılır;
    bedeli TD''nin yakınsama güvencelerinin zayıflamasıdır (M11.6).'
- q: λ bölüm içinde değişseydi (ör. durumun ne kadar tanıdık olduğuna göre)?
  a: Durum bağımlı λ(s) ile iz e(s) ← γλ(s_t) e(s) + 1 olarak güncellenir. Tahmini güvenilir durumlarda küçük
    λ (bootstrapping), belirsiz durumlarda büyük λ (gerçek getiriye güven) seçilebilir; Sutton ve Barto'nun
    12. bölümündeki genel λ-getirisi bu fikrin biçimselleştirilmesidir.
