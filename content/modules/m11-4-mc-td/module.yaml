- id: p15
  type: kanıt
  level: 2
  title: Ağırlıklı artımlı ortalamanın türetimi
  goal: Sutton Bölüm 5 içindeki koşulları koruyarak ağırlıklı artımlı ortalamanın türetimi
  needs: MC getiri, ilk/her ziyaret ve önem oranları
  q: 'Kaynak (5.7) içindeki ilk n−1 getirinin weighted ortalamasından (5.8) güncellemesini türetin. C indekslerini
    açık yazın.


    Kaynak: Sutton ve Barto (2018), s.109, Alıştırma 5.10. Ağırlıksız güncelleme (2.3) türetiminin örüntüsünü
    izleyin.'
  hints:
  - Getirinin hangi ziyaret anından ve hangi politika altında hesaplandığını açıkça yazın.
  solution: V_n=Σ_{k<n}W_kG_k/Σ_{k<n}W_k ve C_n=Σ_{k≤n}W_k olsun. Yeni pay=(C_n−W_n)V_n+W_nG_n; C_n ile bölünce
    V_{n+1}=V_n+(W_n/C_n)(G_n−V_n). Kaynağın C_{n+1}=C_n+W_{n+1} indeksi bu tanımla uyumludur. Kodda önce C+=W,
    sonra V+=(W/C)(G−V); C>0 şartını denetle. Ağırlıksız türetimdeki eski toplam=n·ortalama adımı burada eski
    toplam=C_old·V_old olur; yeni ağırlık1 yerine W konur.
