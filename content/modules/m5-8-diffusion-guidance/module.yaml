id: m5-8-diffusion-guidance
code: M5.8
title: Diffusion II — koşullu üretim, sınıflandırıcı ve sınıflandırıcısız yönlendirme, latent diffusion
phase: 5
minutes: 380
prereq: [m5-3-diffusion, m5-6-autoencoders]
summary: >
  DDPM'den Stable Diffusion'a: ileri sürecin ölçeklemesi (varyansın 1'e
  yakınsaması), doğrusal ve kosinüs gürültü takvimleri ve SNR; koşullu
  gürültü tahmini, sınıflandırıcı yönlendirmesi (Dhariwal & Nichol 2021) ve
  sınıflandırıcısız yönlendirme (Ho & Salimans 2022) — ikisinin kesin
  modellerde neden aynı olduğu, yönlendirme ölçeğinin kesinlik–çeşitlilik
  ödünleşimi ve "aşırı doyma"; latent diffusion (Rombach ve ark. 2022):
  önce otomatik kodlayıcıyla sıkıştır, gizli uzayda difüze et. NumPy'da
  Gauss karışımı için kapalı formda "kâhin" ε ile yönlendirilmiş DDIM, PyTorch'ta
  etiket bırakmalı koşullu bir ağ ve CFG, sonda piksel uzayı vs gizli uzay
  difüzyonu. Ekler: takvimler, DDIM ters çevirme ile düzenleme, ε/x₀/v/skor
  parametrizasyonları.
goals:
  - "[[sınıflandırıcısız yönlendirme]]: $\\hat\\varepsilon=\\varepsilon_u+s(\\varepsilon_c-\\varepsilon_u)$; [[sınıflandırıcı yönlendirmesi]]: $\\hat\\varepsilon=\\varepsilon-s\\sqrt{1-\\bar\\alpha}\\nabla\\log p(y|x_t)$"
  - "Yönlendirme = $p(x)p(y|x)^s$'den örneklemek: Gauss örneğinde kapalı form"
  - "Kosinüs takvimi, SNR; etiket bırakma ile tek ağda koşullu + koşulsuz model"
  - "[[latent diffusion]]: AE + gizli uzayda difüzyon; maliyet ve kalite"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 17 (DDPM)", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Ho, Jain, Abbeel — Denoising Diffusion Probabilistic Models (NeurIPS 2020)", url: "https://arxiv.org/abs/2006.11239", license: "arXiv", use: link}
  - {title: "Nichol & Dhariwal — Improved Denoising Diffusion Probabilistic Models (ICML 2021)", url: "https://arxiv.org/abs/2102.09672", license: "arXiv", use: link}
  - {title: "Dhariwal & Nichol — Diffusion Models Beat GANs on Image Synthesis (NeurIPS 2021)", url: "https://arxiv.org/abs/2105.05233", license: "arXiv", use: link}
  - {title: "Ho & Salimans — Classifier-Free Diffusion Guidance (2022)", url: "https://arxiv.org/abs/2207.12598", license: "arXiv", use: link}
  - {title: "Rombach ve ark. — High-Resolution Image Synthesis with Latent Diffusion Models (CVPR 2022)", url: "https://arxiv.org/abs/2112.10752", license: "arXiv", use: link}
  - {title: "Song, Meng, Ermon — Denoising Diffusion Implicit Models (ICLR 2021)", url: "https://arxiv.org/abs/2010.02502", license: "arXiv", use: link}
  - {title: "Salimans & Ho — Progressive Distillation (v-parametrizasyonu, ICLR 2022)", url: "https://arxiv.org/abs/2202.00512", license: "arXiv", use: link}
  - {title: "fast.ai Part 2 — Stable Diffusion from the Foundations", url: "https://course.fast.ai/Lessons/part2.html", license: "Apache-2.0", use: link}

hand:
  groups:
    - title: "Yönlendirme"
      fields:
        - {id: cfg, label: "CFG: $\\varepsilon_u=0.2$, $\\varepsilon_c=0.5$, s = 3 → $\\hat\\varepsilon$", answer: 1.1, tol: 1.0e-9}
        - {id: cg, label: "Sınıflandırıcı yönlendirmesi: ε = 0.4, $\\bar\\alpha=0.75$, s = 2, $\\nabla\\log p(y|x_t)=0.3$", answer: 0.1, tol: 1.0e-9}
        - {id: gmean, label: "$p(x)=N(0,1)$, $p(y|x)\\propto N(x;2,1)$, $p(x)p(y|x)^s$ ile s = 3: ortalama", answer: 1.5, tol: 1.0e-9}
        - {id: gvar, label: "Aynı dağılımın varyansı", answer: 0.25, tol: 1.0e-9}
    - title: "Takvimler ve latent diffusion"
      fields:
        - {id: cosab, label: "Kosinüs takvimi (s = 0.008): $\\bar\\alpha$ tam ortada (t = T/2)", answer: 0.49384359044063775, tol: 1.0e-6}
        - {id: snr, label: "$\\bar\\alpha=0.75$'te SNR = $\\bar\\alpha/(1-\\bar\\alpha)$", answer: 3, tol: 1.0e-9}
        - {id: lat, label: "512 × 512 × 3 görüntü → 64 × 64 × 4 gizli kod: boyut küçülme oranı", answer: 48}
  verify: |
    import math
    f = lambda t: math.cos((t + 0.008) / 1.008 * math.pi / 2) ** 2
    answers = dict(cfg=0.2 + 3 * (0.5 - 0.2), cg=0.4 - 2 * math.sqrt(1 - 0.75) * 0.3, gmean=2 * 3 / (1 + 3), gvar=1 / (1 + 3),
                   cosab=f(0.5) / f(0.0), snr=0.75 / 0.25, lat=512 * 512 * 3 // (64 * 64 * 4))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Gürültü takvimleri: doğrusal vs kosinüs, SNR", engine: browser}
  - {id: x2, title: "DDIM ters çevirme ve koşulu değiştirerek düzenleme", engine: browser}
  - {id: x3, title: "Parametrizasyonlar: ε, x₀, v ve skor", engine: browser}

quiz:
  - q: "Sınıflandırıcısız yönlendirmede s > 1 ne yapar?"
    options:
      - {t: "$p(x)p(y|x)^s$'den örnekler: koşula daha 'emin' örnekler (kesinlik ↑) ama çeşitlilik ↓; çok büyük s'de örnekler verinin dışına taşar (aşırı doyma)", ok: true, why: "c ve d aşamalarında yarıçapın s ile büyüdüğü görülür."}
      - {t: "Örneklemeyi hızlandırır", why: "Her adımda iki ağ değerlendirmesi gerekir: yavaşlatır."}
      - {t: "Modeli yeniden eğitir", why: "Yalnız örnekleme anında."}
  - q: "Tek bir ağ hem koşullu hem koşulsuz ε'yu nasıl tahmin eder?"
    options:
      - {t: "Eğitimde etiket rastgele (%10–20) boş (null) token'la değiştirilir; çıkarımda aynı ağ etiketle ve boş token'la iki kez çağrılır", ok: true, why: "Ho & Salimans 2022."}
      - {t: "İki ayrı ağ zorunludur", why: "Gerekmez."}
      - {t: "Koşulsuz model gerekmez", why: "CFG'nin tanımında var."}
  - q: "Latent diffusion'ın temel kazancı nedir?"
    options:
      - {t: "Algısal olarak önemsiz yüksek frekans ayrıntısını otomatik kodlayıcıya bırakıp difüzyonu çok daha küçük bir gizli uzayda yapmak: eğitim ve örnekleme maliyeti büyük ölçüde düşer, kalite korunur", ok: true, why: "Rombach ve ark. 2022; e aşamasında aynı bütçede fark."}
      - {t: "Gürültü takvimine gerek kalmaması", why: "Takvim yine var."}
      - {t: "Tek adımda örnekleme", why: "Hayır."}

homework:
  - title: "Ho & Salimans (2022): CFG'yi rakamlarda/CIFAR'da"
    paper: "Ho & Salimans — Classifier-Free Diffusion Guidance (NeurIPS 2021 Workshop / 2022)"
    url: "https://arxiv.org/abs/2207.12598"
    level: orta
    hours: 12
    goal: |
      M5.3'teki U-Net'i sınıf embedding'iyle koşullu yap, etiket bırakma olasılığı p_uncond ∈ {0.1, 0.2, 0.5} ile MNIST/CIFAR-10'da eğit. Makale Tablo 1–2'nin küçük sürümü: yönlendirme ağırlığı w ∈ {0, 0.3, 1, 2, 4} için FID ve IS (M5.7'deki ölçücüler); FID–IS eğrisini çiz (Şekil 4). Büyük w'de renk/kontrast aşırı doymasını gözle ve "dinamik eşikleme" (Saharia ve ark. 2022, Imagen) ile düzelt.
    steps:
      - "Dinamik eşikleme: x̂₀'ın mutlak değerlerinin p-yüzdeliği s ile kırp ve s'ye böl."
    accept:
      - "w arttıkça IS artar, FID önce düşer sonra artar."
      - "Dinamik eşikleme büyük w'de FID'i iyileştirir."
  - title: "Rombach ve ark. (2022): küçük bir latent diffusion"
    paper: "Rombach, Blattmann, Lorenz, Esser, Ommer — High-Resolution Image Synthesis with Latent Diffusion Models (CVPR 2022)"
    url: "https://arxiv.org/abs/2112.10752"
    level: ileri
    hours: 18
    goal: |
      CelebA-64 ya da CIFAR-10'da KL düzenlemeli bir konvolüsyonel otomatik kodlayıcı (f ∈ {1, 2, 4, 8} küçültme, M5.6) eğit; her f için gizli uzayda aynı U-Net bütçesiyle difüzyon modeli eğitip FID ve eğitim süresini karşılaştır (makale Şekil 6: f = 4–16 tatlı nokta). Sınıf koşulunu U-Net'e cross-attention ile ver (M4.14), CFG ile örnekle.
    steps:
      - "Gizli kodları birim varyansa ölçekle (makalenin 'scale factor'ü)."
    accept:
      - "f = 1 (piksel uzayı) en yavaş; f çok büyükse yeniden yapılandırma kalitesi FID'i sınırlar."
      - "Cross-attention koşullama + CFG sınıf doğruluğunu artırır."

labs:
  - id: l1
    lab: cfg2d
    title: "Yönlendirme ölçeği s: kalite mi, çeşitlilik mi?"
    goal: |
      Üç bileşenli 2B Gauss karışımında koşulsuz ve koşullu ε **tam** bilinir (kâhin). CFG: $\hat\varepsilon=\varepsilon_u+s(\varepsilon_c-\varepsilon_u)$. s = 1 koşullu dağılımı verir; s > 1 örnekleri hedef bileşenin "en tipik" bölgesine iter — sınıf doğruluğu artar, çeşitlilik (std) azalır, merkez öteki sınıflardan uzağa kayar.
    predict:
      q: "s = 6 ile hedef kümedeki std (gerçek değer 0.5) ne olur?"
      options:
        - {t: "≈ 0.5, değişmez", why: "Yalnız s = 1 koşullu dağılımı korur."}
        - {t: "Belirgin küçülür (≈ 0.3)", ok: true, why: "Aşırı yönlendirme dağılımı daraltır: p(x)p(c|x)^s keskinleşir."}
        - {t: "Büyür", why: "Yönlendirme çeşitliliği azaltır."}
    presets:
      - {name: "s = 0 / 1", params: {s: 0, B: {s: 1}}, note: "A koşulsuz: örneklerin %33'ü hedef sınıfta (üç küme). B koşullu: %99.7, kümedeki std 0.48 (gerçek 0.5)."}
      - {name: "Aşırı yönlendirme", params: {s: 6}, note: "Std 0.30'a daraldı ve küme merkezi gerçek merkezden 0.95 uzağa, öteki kümelerden uzağa itildi."}
      - {name: "Az adım", params: {s: 3, steps: 5, B: {steps: 60}}, note: "DDIM adım sayısının etkisi: kâhin modelde bile az adım dağılımı bozar."}
    questions:
      - q: "Kâhin model kusursuzken neden s > 1 'yanlış' dağılım verir?"
        a: "Çünkü $\\varepsilon_u+s(\\varepsilon_c-\\varepsilon_u)$ hiçbir gerçek dağılımın skoru değildir (her t'de farklı üsle keskinleşmiş karışım); s > 1 bilinçli bir yanlılıktır: algısal kalite için çeşitlilikten vazgeçilir."
    limits: "Kâhin ε (öğrenilmiş ağ yok); deterministik DDIM, T = 200 doğrusal takvim."
  - id: l2
    lab: guide1d
    title: "Yönlendirme 1-B'de kesin: denklik, eğik dağılım ve gürültüsüz sınıflandırıcı"
    goal: |
      İki sınıflı 1-B karışımda koşulsuz ve koşullu ε kapalı formda bilinir. Deterministik DDIM ile CFG ve sınıflandırıcı yönlendirmesini çalıştır; örnek histogramını yönlendirmenin "hedeflediği" eğik dağılım p(x)p(y|x)^s ile karşılaştır. Gürültüye duyarlı kesin sınıflandırıcının CFG ile aynı örnekleri verdiğini, yalnız temiz veride eğitilmiş bir sınıflandırıcının ise bozuk sonuç verdiğini gör.
    predict:
      q: "Kesin skorlarla s = 3 CFG örneklerinin ortalaması, hedef p(x)p(y|x)³'ün ortalamasına (1.11) göre nasıl çıkar?"
      options:
        - {t: "Eşit: kesin skorlarla CFG tam eğik dağılımı verir", why: "Her adımdaki eğik gürültülü dağılımlar, eğik temiz dağılımın gürültülenmiş hâlleri değildir; ters süreç tutarlı değildir."}
        - {t: "Belirgin büyük (≈ 1.6) ve daha dar", ok: true, why: "Ölçülen: ortalama 1.61, std 0.355; hedef 1.11 / 0.522. Yüksek gürültüde sınıflar örtüştüğü için eğim güçlüdür ve yörüngeleri erkenden dışa iter."}
        - {t: "Daha küçük", why: "Yönlendirme örnekleri hedef sınıfa ve ötesine iter."}
    presets:
      - {name: "s = 1: koşullu", params: {s: 1, mode: 0, m: 1, sig: 0.6, steps: 50, n: 1500}, note: "Ortalama 0.99, std 0.58 (hedef 1 / 0.6); toplam değişim uzaklığı 0.04: kesin skorlarla DDIM koşullu dağılımı verir."}
      - {name: "s = 3 CFG", params: {s: 3, mode: 0}, note: "Ortalama 1.61, std 0.355; eğik hedef 1.11 / 0.522, uzaklık 0.48. 200 adımda da aynı (1.62 / 0.373): fark ayrıklaştırmadan değil."}
      - {name: "Kesin sınıflandırıcı = CFG", params: {s: 3, mode: 1}, note: "Örnekler CFG ile birebir aynı (1.61 / 0.355): Bayes kuralının sayısal doğrulaması."}
      - {name: "Temiz veride eğitilmiş sınıflandırıcı", params: {s: 3, mode: 2}, note: "Ortalama 1.91, uzaklık 0.59. s = 1'de bile std 0.196'ya çöküyor (koşullu dağılımın std'si 0.6)."}
      - {name: "s = 0", params: {s: 0}, note: "Koşulsuz: iki tepe, örneklerin %49'u sağda."}
      - {name: "Aşırı yönlendirme", params: {s: 8}, note: "Ortalama 2.32, std 0.28: sınıf merkezinin (1) çok ötesinde. Gerçek görüntülerde bunun karşılığı aşırı doygunluktur."}
      - {name: "Az adım", params: {s: 3, steps: 5}, note: "5 DDIM adımıyla std 0.167: ayrıklaştırma hatası yönlendirmeyle birleşince dağılım daha da daralıyor."}
    questions:
      - q: "Kesin skorlarla s = 1 neden tam koşullu dağılımı verir de s = 3 eğik dağılımı vermez?"
        a: "s = 1'de her adımdaki skor p_t(x|y)'nin, yani p_0(x|y)'nin ileri süreçle gürültülendirilmiş hâlinin skorudur; ters süreç tutarlıdır. s ≠ 0, 1'de p_t(x)p_t(y|x)^s ailesi tek bir temiz dağılımın gürültülenmiş hâlleri değildir; her adım farklı bir hedefe çeker."
    limits: "1-B, iki eşit ağırlıklı Gauss; skorlar kesin. Sınıf doğruluğu 'x > 0' ile ölçülüyor. Gerçek modellerde ε_c ve ε_u kusurludur ve iki yönlendirme ayrılır."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: CFG'de ölçek gösterimleri
    goal: İki gösterimi dönüştürmek
    needs: $\hat\varepsilon=\varepsilon_u+s(\varepsilon_c-\varepsilon_u)$ ve $(1+w)\varepsilon_c-w\varepsilon_u$
    q: |-
      Bir makale $w=2$ ile sonuç veriyor. Bu modüldeki $s$ kaçtır? $\varepsilon_u=0.1$, $\varepsilon_c=0.3$ için yönlendirilmiş tahmin?
    solution: |-
      $(1+w)\varepsilon_c-w\varepsilon_u=\varepsilon_u+(1+w)(\varepsilon_c-\varepsilon_u)$, dolayısıyla $s=1+w=3$. Tahmin $0.1+3\cdot0.2=0.7$ (iki gösterimde de: $3\cdot0.3-2\cdot0.1=0.7$).
  - id: p2
    type: hesap
    level: 1
    title: Eğik Gauss
    goal: p(x)p(y|x)^s'yi kare tamamlayarak bulmak
    needs: Gauss çarpımı
    q: |-
      $p(x)=\mathcal N(0,1)$, $p(y\mid x)\propto\mathcal N(x;3,1)$, $s=2$. Eğik dağılımın ortalaması?
    answer: 2.0
    calc: "3*2/(1+2)"
    tol: 1e-6
    mistakes:
      - {answer: 1.5, msg: "Bu s = 1 (koşullu): 3/2. Olabilirlik s kez çarpılıyor."}
      - {answer: 3.0, msg: "Önsel de katkı verir: ortalama 3s/(1 + s)."}
    hints:
      - "Kesinlikler toplanır: $1+s$; ortalama $\\frac{3s}{1+s}$."
    solution: |-
      $\frac{3\cdot2}{1+2}=2$, varyans $1/3$. s büyüdükçe ortalama 3'e yaklaşır, varyans sıfıra iner.
  - id: p3
    type: hesap
    level: 1
    title: Sınıflandırıcı yönlendirmesi
    goal: Formülü uygulamak
    needs: $\hat\varepsilon=\varepsilon-s\sqrt{1-\bar\alpha}\,\nabla\log p(y\mid x_t)$
    q: |-
      $\varepsilon=-0.2$, $\bar\alpha=0.36$, $s=5$, $\nabla\log p(y\mid x_t)=0.1$. $\hat\varepsilon$?
    answer: -0.6
    calc: "-0.2-5*sqrt(1-0.36)*0.1"
    tol: 1e-6
    mistakes:
      - {answer: 0.2, msg: "İşaret: gradyan çıkarılır (ε, skorun eksi işaretlisi ile orantılı)."}
      - {answer: -0.52, msg: "√(1 − ᾱ) yerine 1 − ᾱ kullanılmış: √0.64 = 0.8."}
    hints:
      - "$\\sqrt{1-0.36}=0.8$."
    solution: |-
      $-0.2-5\cdot0.8\cdot0.1=-0.6$. ε'u azaltmak, $\hat{\mathbf x}_0$'ı gradyan yönünde (sınıf olasılığını artıran yöne) kaydırır.
  - id: p4
    type: yorumla
    level: 2
    title: guidance_scale = 20
    goal: Aşırı yönlendirmeyi tanımak
    needs: Ödünleşim
    q: |-
      Stable Diffusion'da `guidance_scale` 7.5'ten 20'ye çıkarılınca görüntüler isteme daha bağlı ama renkleri aşırı doygun, kontrastı yapay ve birbirine benzer oluyor. Açıklama?
    choices:
      - {t: "Model aşırı uyum yapmış", why: "Model değişmedi; yalnız örnekleme."}
      - {t: "Büyük s, p(x)p(y|x)^s'yi aşırı keskinleştirip dışdeğerlemeyle örnekleri veri dağılımının dışına (piksel aralığının ötesine) itiyor", ok: true, why: "Kesinlik ↑, çeşitlilik ↓, aşırı doyma. Dinamik eşikleme ya da daha küçük s."}
      - {t: "DDIM adımı yetersiz", why: "Adım sayısı bu sistematik etkiyi açıklamaz."}
    hints:
      - "s > 1 bir dışdeğerlemedir."
    solution: |-
      $\boldsymbol\varepsilon_u+s(\boldsymbol\varepsilon_c-\boldsymbol\varepsilon_u)$, büyük s'de eğitim sırasında hiç görülmemiş tahminler üretir; $\hat{\mathbf x}_0$ veri aralığının dışına çıkar. Çareler: s'yi düşürmek, dinamik eşikleme (Imagen), yönlendirmeyi yalnız orta gürültü aralığında uygulamak.
  - id: p5
    type: kanıt
    level: 3
    title: İki yönlendirmenin denkliği
    goal: CFG'yi sınıflandırıcı yönlendirmesinden türetmek
    needs: Bayes kuralı, ε ile skor ilişkisi
    q: |-
      $\nabla\log p_t(\mathbf x)=-\boldsymbol\varepsilon_u/\sqrt{1-\bar\alpha_t}$ ve $\nabla\log p_t(\mathbf x\mid y)=-\boldsymbol\varepsilon_c/\sqrt{1-\bar\alpha_t}$ ise, kesin sınıflandırıcıyla sınıflandırıcı yönlendirmesinin $\boldsymbol\varepsilon_u+s(\boldsymbol\varepsilon_c-\boldsymbol\varepsilon_u)$ verdiğini göster.
    rubric:
      - "Bayes kuralıyla ∇log p(y|x) = ∇log p(x|y) − ∇log p(x) yazdım"
      - "İki skoru ε cinsinden yerine koydum"
      - "Sınıflandırıcı yönlendirmesi formülünde √(1 − ᾱ)'ların sadeleştiğini gösterdim"
      - "Denkliğin yalnız kesin modellerde geçerli olduğunu belirttim"
    hints:
      - "$p(y)$, $\\mathbf x$'e bağlı değildir."
    solution: |-
      $\nabla\log p(y\mid\mathbf x)=-(\boldsymbol\varepsilon_c-\boldsymbol\varepsilon_u)/\sqrt{1-\bar\alpha}$. Yerine koyunca $\boldsymbol\varepsilon_u-s\sqrt{1-\bar\alpha}\cdot(-(\boldsymbol\varepsilon_c-\boldsymbol\varepsilon_u)/\sqrt{1-\bar\alpha})=\boldsymbol\varepsilon_u+s(\boldsymbol\varepsilon_c-\boldsymbol\varepsilon_u)$. Gerçek modellerde koşullu ağın örtük sınıflandırıcısı ile ayrı sınıflandırıcı farklı hatalar yapar; denklik kırılır (deney 2, seçenek 1 ve 2).
pitfalls:
  - wrong: "CFG için iki ayrı ağ eğitmek gerekir."
    right: "Etiket bırakma ile tek ağ hem koşullu hem koşulsuz tahmin yapar; örneklemede iki kez çağrılır."
  - wrong: "Sınıflandırıcı yönlendirmesinde herhangi bir hazır ImageNet sınıflandırıcısı kullanılabilir."
