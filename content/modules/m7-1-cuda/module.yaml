id: m7-1-cuda
code: M7.1
title: GPU programlama modeli ve C++/CUDA extension
phase: 7
minutes: 300
prereq: [m6-5-compile]
summary: >
  GPU'nun nasıl düşündüğünü CPU'da öğrenmek. Grid/block/thread indekslerini
  ve tiling'in global bellek okumalarını nasıl azalttığını elle hesaplıyor,
  saf Python'da bir CUDA ızgarası simülatörü ve okuma sayan tiled matmul
  yazıyor, NumPy'da roofline modeliyle işlemleri bellek- ya da hesap-bağımlı
  diye sınıflandırıyor, `torch.utils.cpp_extension.load_inline` ile kendi
  C++ operatörünü derleyip PyTorch'a bağlıyor (GPU varsa CUDA çekirdeğiyle)
  ve en sonda döngü sırasının önbellek üzerindeki etkisini C++'ta ölçüyorsun.
goals:
  - "CUDA yürütme modeli: grid, block, thread; global indeks; sınır kontrolü"
  - "[[tiling]] ile veri yeniden kullanımı: global okumalar $2n^3\\to2n^3/T$"
  - "[[roofline]] modeli: aritmetik yoğunluk ve tepe noktası (ridge point)"
  - "`load_inline` ile C++ (ve CUDA) extension yazmak, `TORCH_CHECK` ile girdileri doğrulamak"
sources:
  - {title: "GPU MODE — Lectures (CUDA, profiling, tiling)", url: "https://github.com/gpu-mode/lectures", license: "Apache-2.0", use: adapt}
  - {title: "Hwu, Kirk, El Hajj — Programming Massively Parallel Processors (4. baskı)", url: "https://www.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-323-91231-0", license: "©", use: link}
  - {title: "PyTorch Tutorials — Custom C++ and CUDA Extensions", url: "https://docs.pytorch.org/tutorials/advanced/cpp_extension.html", license: "BSD-3-Clause", use: adapt}
  - {title: "Williams, Waterman, Patterson — Roofline: An Insightful Visual Performance Model", url: "https://dl.acm.org/doi/10.1145/1498765.1498785", license: "©", use: link}
  - {title: "MiniTorch — Module 3: Efficiency (CUDA)", url: "https://minitorch.github.io/", license: "lisans dosyası yok", use: link}
  - {title: "Simon Boehm — How to Optimize a CUDA Matmul Kernel", url: "https://siboehm.com/articles/22/CUDA-MMM", license: "©", use: link}

hand:
  groups:
    - title: "Vektör toplama, $N=1000$, `blockDim.x = 256`"
      fields:
        - {id: grid, label: "Gereken block sayısı", answer: 4, hint: "$\\lceil N/256\\rceil$"}
        - {id: idle, label: "Boşta kalan (sınır kontrolüne takılan) thread", answer: 24}
        - {id: idx, label: "`blockIdx.x = 2`, `threadIdx.x = 5` → global indeks", answer: 517}
    - title: "$4\\times4$ matmul $C=AB$, global bellekten okunan eleman sayısı"
      fields:
        - {id: naive, label: "Naif: her $C_{ij}$ kendi satır/sütununu okur", answer: 128, hint: "$16\\cdot2\\cdot4$"}
        - {id: tiled, label: "$2\\times2$ tile, shared memory ile", answer: 64, hint: "4 block × 2 k-adımı × (4 + 4)"}
        - {id: ai, label: "fp32 matmul, $n=1024$, ideal aritmetik yoğunluk (FLOP/bayt, 3 matris bir kez taşınır)", answer: 170.666667, tol: 0.01, hint: "$2n^3/(3n^2\\cdot4)$"}
  verify: |
    import math
    N, B = 1000, 256
    g = math.ceil(N / B)
    n, T = 4, 2
    answers = dict(grid=g, idle=g * B - N, idx=2 * B + 5, naive=n * n * 2 * n, tiled=2 * T * T * (n // T) ** 3,
                   ai=2 * 1024 ** 3 / (3 * 1024 ** 2 * 4))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Bir CUDA çekirdeğinde `if (i < n)` sınır kontrolü neden gerekir?"
    options:
      - {t: "Block sayısı yukarı yuvarlandığı için son block'ta $N$'yi aşan thread'ler olur; kontrol olmadan dizinin dışına yazarlar", ok: true, why: "Triton'da aynı işi `mask` yapar."}
      - {t: "Thread'ler sırasız çalıştığı için", why: "Sıra değil, fazla thread meselesi."}
      - {t: "Performans için", why: "Doğruluk için; dizi dışına erişim tanımsız davranış."}
  - q: "A100'de fp32 için tepe noktası ≈ 19.5 TFLOP/s ÷ 1.55 TB/s ≈ 12.5 FLOP/bayt. Vektör toplama (1 FLOP / 12 bayt) için ne söylenebilir?"
    options:
      - {t: "Derin şekilde bellek-bağımlı: ulaşılabilir hız ≈ bant genişliği × 0.083 FLOP/bayt, tepenin %1'inden az", ok: true, why: "Bu yüzden elementwise işlemleri füzyonlamak (M6.5) ve matmul'ü tiling ile yüksek yoğunlukta çalıştırmak kritik."}
      - {t: "Hesap-bağımlı", why: "Yoğunluk tepe noktasının çok altında."}
      - {t: "Tepe FLOP'a ulaşır", why: "Bellek trafiği sınırlar."}
  - q: "`load_inline` ile yazdığın C++ fonksiyonunda neden `TORCH_CHECK(x.is_contiguous())` yazarsın?"
    options:
      - {t: "Ham işaretçiyle `data_ptr<float>()[i*d+j]` indekslemesi satır-ana bitişik bellek varsayar; transpoze ya da dilimlenmiş bir görünüm yanlış elemanları okutur", ok: true, why: "Alternatif: `x.contiguous()` çağırmak ya da stride'larla indekslemek (`accessor`)."}
      - {t: "PyTorch tüm extension'larda zorunlu tutar", why: "Zorunlu değil; varsayımı açık etmek için."}
      - {t: "GPU'ya kopyalamak için", why: "Bellek düzeniyle ilgili, cihazla değil."}

homework:
  - title: "Williams, Waterman, Patterson (2009): Roofline modeli"
    paper: "Williams, Waterman, Patterson — Roofline: An Insightful Visual Performance Model for Multicore Architectures (CACM 2009)"
    url: "https://dl.acm.org/doi/10.1145/1498765.1498785"
    level: orta
    hours: 6
    goal: |
      Kendi makinenin (CPU ve varsa GPU) roofline'ını çıkar: STREAM benzeri bir triad çekirdeğiyle tepe bant genişliğini, yoğun matmul ile tepe FLOP/s'yi ölç. Makale Şekil 2'deki gibi çiz ve c aşamasındaki işlemleri (vektör toplama, softmax, matmul, konvolüsyon) ölçülen aritmetik yoğunluk ve elde edilen performansla noktalar halinde yerleştir; hangilerinin tavanların altında kaldığını ve nedenini (önbellek, vektörleştirme, paralellik) açıkla.
    steps:
      - "Bant genişliği için dizi boyutunu son düzey önbellekten büyük seç."
    accept:
      - "Ölçülen tavanlar donanım özelliklerinin makul bir yüzdesinde."
      - "Her işlem için 'hangi tavan' gerekçesi."
  - title: "Volkov & Demmel (2008): GPU'da yoğun lineer cebir"
    paper: "Volkov & Demmel — Benchmarking GPUs to Tune Dense Linear Algebra (SC 2008)"
    url: "https://dl.acm.org/doi/10.5555/1413370.1413402"
    level: ileri
    hours: 12
    goal: |
      b aşamasındaki tiled matmul simülatörünü bir CUDA (ya da Triton, M7.2) çekirdeğine çevir; paylaşımlı bellek tiling'i, kayıt (register) bloklaması ve thread başına birden çok çıktı ile adım adım hızlan; her adımda global bellek trafiğini (simülatörün okuma sayacıyla) ve ölçülen GFLOP/s'yi karşılaştır. Makalenin "daha az thread, daha çok iş" gözlemini doluluk (occupancy) ölçerek test et.
    steps:
      - "GPU yoksa Triton'u TRITON_INTERPRET=1 ile CPU'da doğrula, performansı Colab'da ölç."
    accept:
      - "Her optimizasyon adımında ölçülen hızlanma ve trafik azalması tablosu."
      - "Düşük doluluk + yüksek ILP'nin yüksek doluluktan hızlı olabildiği bir örnek."

labs:
  - id: l1
    lab: coalesce
    title: "Bellek birleştirme: bir warp kaç sektör getirir?"
    goal: |
      Bir warp'ın 32 thread'inin eriştiği adresleri 32 baytlık sektörlere düşür. Adım, başlangıç kayması ve eleman boyuyla getirilen bayt ile gereken baytın oranını (verim) izle. Aynı deneyde N elemanlık bir dizi için block sayısını ve sınır kontrolüne takılan thread'leri hesapla.
    predict:
      q: "fp32, thread'ler arası adım 32 eleman. Verim ne olur?"
      options:
        - {t: "%100", why: "Yalnız adım 1'de."}
        - {t: "%50", why: "Bu adım 2."}
        - {t: "%12.5", ok: true, why: "Her thread ayrı bir sektöre düşer: 32 sektör × 32 bayt = 1024 bayt getirilir, 128 bayt kullanılır."}
    presets:
      - {name: "Birleşik", params: {stride: 1, offset: 0, es: 2, N: 1000, bd: 3}, note: "fp32: 4 sektör, verim %100. Izgara: 4 block, 24 boşta thread (el hesabı)."}
      - {name: "Adım 2", params: {stride: 2}, note: "8 sektör, verim %50."}
      - {name: "Sütun okuma", params: {stride: 32}, note: "32 sektör, verim %12.5: satır-ana matriste sütun boyunca thread atamak."}
      - {name: "Hizasız", params: {offset: 1}, note: "5 sektör, verim %80."}
      - {name: "fp64, adım 4", params: {es: 3, stride: 4}, note: "32 sektör, verim %25."}
    questions:
      - q: "Satır-ana bir matrisin transpozesini yazan bir çekirdek, okumayı da yazmayı da nasıl birleşik yapar?"
        a: "Bir tile'ı satır boyunca (birleşik) shared memory'ye okur, shared memory içinde indeksleri değiştirerek okur ve çıktıya yine satır boyunca (birleşik) yazar. Shared memory'de banka çakışmalarını önlemek için tile'a bir sütun dolgu eklenir (T × (T + 1))."
    limits: "Yalnız sektör sayımı; önbellek, banka çakışmaları ve işlem sayısı modellenmedi. Sektör boyu 32 bayt (NVIDIA'nın yeni mimarileri)."
  - id: l2
    lab: tilecount
    title: "Döşenmiş matris çarpımı: okumaları say"
    goal: |
      n × n matris çarpımında global bellek okumalarını naif çekirdek ve T × T döşemeyle karşılaştır (küçük n'de döngüyle sayılır). Shared memory kullanımını, thread sınırını ve tile'ın aritmetik yoğunluğunu (T / eleman boyu) donanımın dirsek noktasıyla karşılaştır.
    predict:
      q: "fp32'de, thread başına bir çıktıyla (T ≤ 32), A100'ün fp32 dirseğine (≈ 10 FLOP/bayt) ulaşılabilir mi?"
      options:
        - {t: "Evet, T = 32 ile", why: "T = 32'de yoğunluk 32/4 = 8 < 10."}
        - {t: "Hayır; yazmaç döşemesi gerekir", ok: true, why: "T ≥ 40 gerekir ama 1024 thread sınırı T'yi 32'de tutar. Her thread birden çok çıktı biriktirirse etkin tile büyür."}
        - {t: "Döşeme yoğunluğu değiştirmez", why: "Yoğunluk T ile doğrusal artar."}
    presets:
      - {name: "El hesabı", params: {logn: 2, logT: 1, es: 1, smem: 48, ridge: 10}, note: "4 × 4, T = 2: 64 okuma (naif 128)."}
      - {name: "Naif", params: {logn: 2, logT: 0}, note: "128 okuma."}
      - {name: "T = 32", params: {logn: 5, logT: 5}, note: "32 kat az okuma, 8 KiB shared memory, 1024 thread; yoğunluk 8 < 10."}
      - {name: "T = 64", params: {logn: 10, logT: 6}, note: "4096 thread gerekir (sınır 1024): yazmaç döşemesi olmadan yapılamaz; yoğunluk 16."}
      - {name: "bf16, tensör çekirdeği dirseği", params: {es: 0, logT: 5, ridge: 150}, note: "Yoğunluk 16, dirsek 150: tensör çekirdeklerini doyurmak için çok daha büyük etkin tile'lar gerekir."}
    questions:
      - q: "Shared memory döşemesi okumaları T kat azaltıyorsa neden T'yi olabildiğince büyütmüyoruz?"
        a: "Üç sınır var: block başına thread (1024), block başına shared memory (2T² × eleman boyu) ve doluluk: büyük tile'lı block'lar SM başına daha az block çalıştırabilir, gecikme gizlenemez. Hızlı çekirdekler bu yüzden orta boy shared tile'ları yazmaç döşemesiyle birleştirir."
    limits: "Global okuma sayımı; önbellek isabetleri, birleşme ve hesap süresi modellenmedi. n, T'ye bölünür."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Izgara boyutu
    goal: Block sayısını ve global indeksi hesaplamak
    needs: ⌈N / blockDim⌉
    q: |-
      $N=5000$ elemanlı bir vektör, `blockDim.x = 128`. Kaç block gerekir, kaç thread boşta kalır, `blockIdx.x = 10`, `threadIdx.x = 100` hangi elemanı işler?
    solution: |-
      $\lceil5000/128\rceil=40$ block, $40\cdot128=5120$ thread, $120$ boşta. İndeks $10\cdot128+100=1380$.
  - id: p2
    type: hesap
    level: 1
    title: Döşenmiş okumalar
    goal: 2n³/T formülünü uygulamak
    needs: Döşeme
    q: |-
      $n=256$, $T=16$. Global okuma sayısı (eleman)?
    answer: 2097152
    calc: "2*256**3/16"
    tol: 0
    mistakes:
      - {answer: 33554432, msg: "Bu naif sayı: 2n³."}
      - {answer: 131072, msg: "T² ile değil T ile bölünür."}
    hints:
      - "$2n^3/T$."
    solution: |-
      $2\cdot256^3/16=2\,097\,152$; naife göre 16 kat az.
  - id: p3
    type: hesap
    level: 1
    title: Adımlı erişimin verimi
    goal: Sektör sayımını uygulamak
    needs: 32 baytlık sektörler
    q: |-
      bf16 (2 bayt), adım 4 eleman, hizalı. Bir warp kaç sektör getirir?
    answer: 8
    calc: "32*4*2/32"
    tol: 0
    mistakes:
      - {answer: 2, msg: "Bu adım 1: 64 bayt = 2 sektör."}
      - {answer: 32, msg: "Thread'ler arası boşluk 8 bayt; dört thread bir sektörü paylaşır."}
    hints:
      - "Adresler 0, 8, 16, …, 248."
    solution: |-
      Adres aralığı 0–255 bayt: 8 sektör. Gereken 64 bayt, getirilen 256: verim %25 (= 1/adım).
  - id: p4
    type: yorumla
    level: 2
    title: Çekirdek bazen yanlış sonuç veriyor
    goal: Sınır kontrolü ve bitişiklik hatasını tanımak
    needs: TORCH_CHECK, sınır kontrolü
    q: |-
      Kendi yazdığınız bir CUDA uzantısı `x` için doğru, ama `x.T` (transpoze görünüm) verilince yanlış sonuç veriyor. Neden ve düzeltme?
    choices:
      - {t: "CUDA transpozeyi desteklemez", why: "Destekler; sorun bellek düzeni."}
      - {t: "x.T bitişik değil; data_ptr satır-ana düzen varsayıyor. TORCH_CHECK(x.is_contiguous()) ekle ya da sarmalayıcıda x.contiguous() çağır", ok: true, why: "Görünüm aynı depoyu farklı adımlarla okur."}
      - {t: "Sınır kontrolü eksik", why: "Boyutlar aynı; sorun adımlar."}
    hints:
      - "x.T.stride() nedir?"
    solution: |-
      Transpoze görünüm verinin kopyasını almaz; yalnız adımları değiştirir. Ham işaretçiyle satır-ana indeksleme yanlış elemanları okur. Girdileri denetlemek (TORCH_CHECK) ya da contiguous() ile kopyalamak gerekir.
  - id: p5
    type: kanıt
    level: 3
    title: Tile'ın aritmetik yoğunluğu
    goal: T / e formülünü türetmek
    needs: FLOP ve bayt sayımı
    q: |-
      T × T döşemeli matris çarpımında bir block'un bir k adımında yaptığı FLOP'u ve taşıdığı baytı say; yoğunluğun $T/e$ olduğunu ve global okumaların $2n^3/T$ olduğunu göster.
    rubric:
      - "Adım başına 2T² eleman (iki tile) yüklendiğini yazdım"
      - "Adım başına T² çıktının her biri için T çarpma-toplama: 2T³ FLOP"
      - "Oranı 2T³ / (2T² e) = T / e olarak buldum"
      - "Block × adım sayısıyla toplam okumayı (n/T)² · (n/T) · 2T² = 2n³/T olarak çarptım"
    hints:
      - "Block sayısı $(n/T)^2$, adım sayısı $n/T$."
    solution: |-
      Adım başına $2T^2$ eleman, $2T^3$ FLOP: $\frac{2T^3}{2T^2e}=T/e$. Toplam okuma $(n/T)^3\cdot2T^2=2n^3/T$. İkisi de T ile doğrusal: tile büyüdükçe her yüklenen eleman daha çok kullanılır.
pitfalls:
  - wrong: "Daha çok thread her zaman daha hızlıdır."
    right: "Thread başına iş çok azsa ek yük baskın olur; bellek bağımlı bir çekirdek bant genişliğiyle sınırlıdır. Hız, birleşik erişim ve veri yeniden kullanımından gelir."
  - wrong: "Block'lar sırayla çalışır, bir block diğerinin sonucunu okuyabilir."
    right: "Block'lar bağımsızdır ve herhangi bir sırada çalışabilir; block'lar arası iletişim ancak çekirdek sınırında (ya da atomiklerle) mümkündür."
  - wrong: "data_ptr ile her tensör satır-ana okunabilir."
    right: "Görünümler (transpoze, dilim) bitişik olmayabilir; adımları dikkate almak ya da contiguous() ile kopyalamak gerekir."
  - wrong: "CUDA çekirdeği bir hata verdiyse hata o satırda görünür."
    right: "Çekirdekler eşzamansız başlar; hata sonraki bir eşzamanlamada (ör. .item() ya da .cpu()) görünür. CUDA_LAUNCH_BLOCKING=1 hata ayıklamada yardımcı olur."
whatif:
  - q: "blockDim 32'nin katı olmasaydı (ör. 100)?"
    a: "Warp'lar 32'şer gruplanır; son warp 4 thread'le çalışır ama bir warp'lık kaynak tutar. Doluluk ve verim düşer; blockDim genellikle 32'nin katı seçilir."
  - q: "Shared memory'ye yükledikten sonra __syncthreads() unutulsaydı?"
    a: "Bazı thread'ler tile tam yüklenmeden hesaba başlar ve henüz yazılmamış (ya da önceki adımın) değerleri okur: sonuç rastgele yanlış olur, yarış durumu."
  - q: "Aynı çekirdek bf16 yerine fp32 ile çalışsaydı?"
    a: "Taşınan bayt iki katına çıkar; bellek bağımlıysa süre de yaklaşık iki katına çıkar. Tensör çekirdekleri bf16'da çok daha yüksek tepe verir; fp32'de (tf32 kapalıysa) CUDA çekirdekleriyle sınırlı kalınır."
