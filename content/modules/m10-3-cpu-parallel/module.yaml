quiz:
  - q: "Integral dizinin (önek toplamı) her elemanı bir öncekine bağlıyken nasıl paralelleşir?"
    options:
      - {t: "Diziyi p bloğa böl, her blokta yerel tarama (paralel), blok toplamlarını tara (p eleman, sıralı), her bloğa ofseti ekle (paralel)", ok: true, why: "İş ~2n, yol ~2n/p + p."}
      - {t: "Paralelleşemez", why: "Toplama birleşmeli olduğu için paralelleşir (M10.6)."}
      - {t: "Her thread farklı bir elemandan başlayıp sona kadar toplar", why: "O(n²) iş."}
  - q: "21×21 konvolüsyonu satır bantlarına bölünce her thread'in girdisi neden bandından büyüktür?"
    options:
      - {t: "Bandın üst/alt kenarındaki çıktılar komşu bantların 10'ar satırına ihtiyaç duyar (halo); bunlar salt okunur, yarış yok", ok: true, why: "Dağıtık bellekte halo değiş tokuşu iletişim maliyetidir."}
      - {t: "Yanlış paylaşım yüzünden", why: "Okumalar için sorun değil."}
      - {t: "Sıfır dolgu için", why: "Dolgu yalnız görüntü kenarında."}
  - q: "Naif ijk matmul'da B'ye erişim neden yavaştır (satır-öncelikli bellek)?"
    options:
      - {t: "İç döngü B'nin bir sütununda yürür: her erişim n eleman ileride, her biri ayrı önbellek satırı; ikj ya da devrik B ardışık erişim sağlar", ok: true, why: "Karo (blok) çarpımı ayrıca önbellekte yeniden kullanımı artırır."}
      - {t: "B'ye yazıldığı için", why: "B yalnız okunur."}
      - {t: "Thread'ler B'yi paylaştığı için", why: "Salt okuma paylaşımı serbest."}

homework:
  - title: "Goto & van de Geijn (2008): Yüksek başarımlı matris çarpımının anatomisi"
    paper: "Goto & van de Geijn — Anatomy of High-Performance Matrix Multiplication (ACM TOMS 2008)"
    url: "https://doi.org/10.1145/1356052.1356053"
    level: ileri
    hours: 16
    goal: |
      d aşamasındaki matmul'u makalenin katmanlı yapısına dönüştür: B'yi L2'ye sığan $k_c\times n_c$ panellere, A'yı L2'de $m_c\times k_c$ bloklara paketle, en içte $m_r\times n_r$ (ör. 6×16) yazmaç-mikroçekirdeği AVX2 intrinsics (`_mm256_fmadd_ps`) ile yaz; thread'leri $n_c$ ya da $m_c$ döngüsünde paralelleştir. `torch.matmul` (MKL/OpenBLAS) ile GFLOP/s karşılaştır ve makinenin tepe değerine oranını hesapla.
    steps:
      - "Önbellek boyutlarını `lscpu` ile öğren; m_c, k_c, n_c'yi makalenin kurallarına göre seç."
      - "Paketlemenin süresini ayrıca ölç."
    accept:
      - "Tek thread'de tepe değerin ≥ %60'ı."
      - "Çok thread'de BLAS'ın ≥ %50'si."
  - title: "Crow (1984): Toplam alan tabloları"
    paper: "Crow — Summed-Area Tables for Texture Mapping (SIGGRAPH 1984)"
    url: "https://doi.org/10.1145/964965.808600"
    level: orta
    hours: 6
    goal: |
      Integral görüntüyü (toplam alan tablosu) d aşamasındaki paralel C++ ile hesapla; ardından makaledeki gibi değişken boyutlu kutu filtresiyle "doku" bulanıklaştırma (her pikselde farklı pencere) uygula. int32 taşma sınırını (8 bit görüntü için en büyük güvenli boyut) hesapla, fp32 integral görüntünün hassasiyet kaybını büyük görüntülerde ölç ve Viola–Jones'taki kaydırılmış (ortalaması çıkarılmış) çözümle karşılaştır.
    steps:
      - "Pencere boyutu konuma göre değişsin (ör. odak bulanıklığı)."
    accept:
      - "Değişken pencereli filtre doğrudan toplamla aynı (int64)."
      - "fp32 integral görüntüde 4096² sonrası hata ölçülür ve açıklanır."
