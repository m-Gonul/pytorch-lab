id: m10-3-cpu-parallel
code: M10.3
title: CPU'da paralel çekirdekler — integral dizi/görüntü, 2B konvolüsyon, matris çarpımı
phase: 10
minutes: 420
prereq: [m10-2-threads-sync]
summary: >
  Paralel programlama alıştırmalarının CPU yarısı: tek ve çok thread'li
  integral dizi (iki geçişli blok taraması), integral görüntü (önce satırlar,
  sonra sütunlar), uint8 girişli/fp32 hesaplı 3×3…21×21 2B konvolüsyon (satır
  bantları ve kenar "halo"su) ve fp32 matris çarpımı (satır blokları, devrik
  B, karo/blok). Her birinde iş bölme (geometrik ayrıştırma), bağımlılıkların
  nasıl kırıldığı ve thread sayısı ile problem boyunun hızlanmaya etkisi.
  Saf Python'da bantlı/bloklu algoritmalar, NumPy'da vektörel karşılıkları ve
  ayrılabilir filtre, C++ `std::thread` ile gerçek uygulamalar, sonda
  PyTorch'un kendi çekirdekleriyle karşılaştırma ve küçük problemlerde thread
  ek yükü.
goals:
  - "Ardışık bağımlılığı kırmak: blok içi tarama + blok toplamlarının taraması + ofset ekleme"
  - "2B ayrıştırma: satır bantları, halo genişliği $\\lfloor k/2\\rfloor$, sınır koşulu"
  - "Matmul'da bellek erişim deseni: ijk vs ikj vs devrik B vs karo; [[aritmetik yoğunluk]]"
  - "Hızlanmanın problem boyuna bağımlılığı: thread oluşturma ek yükü ve önbellek"
sources:
  - {title: "Crow — Summed-Area Tables for Texture Mapping (SIGGRAPH 1984)", url: "https://doi.org/10.1145/964965.808600", license: "©", use: link}
  - {title: "Viola & Jones — Rapid Object Detection using a Boosted Cascade of Simple Features (CVPR 2001)", url: "https://doi.org/10.1109/CVPR.2001.990517", license: "©", use: link}
  - {title: "Goto & van de Geijn — Anatomy of High-Performance Matrix Multiplication (ACM TOMS 2008)", url: "https://doi.org/10.1145/1356052.1356053", license: "©", use: link}
  - {title: "Barlas — Multicore and GPU Programming (2. baskı), Bölüm 3–4", url: "https://www.elsevier.com/books/multicore-and-gpu-programming/barlas/978-0-12-814120-5", license: "©", use: link}
  - {title: "Hwu, Kirk, El Hajj — Programming Massively Parallel Processors (4. baskı), Bölüm 7 ve 11", url: "https://www.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-323-91231-0", license: "©", use: link}

