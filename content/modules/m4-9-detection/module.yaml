id: m4-9-detection
code: M4.9
title: Nesne tespiti — IoU, NMS, YOLO, mAP, FPN
phase: 4
minutes: 420
prereq: [m4-8-cnn-blocks]
summary: >
  Sınıflandırma + konum belirlemeden (kutu regresyonu) çok nesneli tespite:
  IoU ölçütü, kayan pencere ve maksimum olmayanı bastırma (NMS), yoğun
  katmanları konvolüsyona çevirip ağı tam konvolüsyonel (FCN) yapmak ve
  tek geçişte ızgara tahmini, YOLO'nun hücre göreli koordinatları, k-means
  ile bulunan çapa kutuları ve log-ölçekli boyut tahmini, precision/recall
  eğrisinden 11 noktalı ve tüm noktalı AP, mAP@0.5 ve COCO'nun
  AP@[.50:.95]'i, FPN'nin yukarıdan-aşağı yolu ve RoI'nin piramit
  seviyesine atanması, Soft-NMS. Saf Python'da IoU/NMS/AP, NumPy'da
  döngüsüz IoU matrisi, Fast NMS ve IoU-uzaklıklı k-means, PyTorch'ta
  sentetik şekiller üzerinde sıfırdan küçük bir YOLO, sonda NMS
  varyantlarının ve sınıf-duyarlı "ofset hilesi"nin ölçümü.
goals:
  - "[[iou]] ve [[nms]]; NMS'nin açgözlü ve matris (Fast NMS) biçimleri"
  - "[[tam konvolüsyonel ağ]]: yoğun katman = çekirdeği girdi boyutunda konvolüsyon → tek geçişte kayan pencere"
  - "YOLO kodlaması: hücre ofseti (sigmoid), [[çapa kutusu]] (k-means, 1 − IoU uzaklığı), log ölçek"
  - "[[ortalama hassasiyet]]: 11 nokta, tüm noktalar, mAP@0.5, AP@[.50:.95]; [[öznitelik piramidi ağı]]"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 14", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Redmon ve ark. — You Only Look Once (CVPR 2016)", url: "https://arxiv.org/abs/1506.02640", license: "arXiv", use: link}
  - {title: "Redmon & Farhadi — YOLO9000 (CVPR 2017) / YOLOv3 (2018)", url: "https://arxiv.org/abs/1612.08242", license: "arXiv", use: link}
  - {title: "Lin ve ark. — Feature Pyramid Networks for Object Detection (CVPR 2017)", url: "https://arxiv.org/abs/1612.03144", license: "arXiv", use: link}
  - {title: "Long, Shelhamer, Darrell — Fully Convolutional Networks for Semantic Segmentation (CVPR 2015)", url: "https://arxiv.org/abs/1411.4038", license: "arXiv", use: link}
  - {title: "Bodla ve ark. — Soft-NMS (ICCV 2017)", url: "https://arxiv.org/abs/1704.04503", license: "arXiv", use: link}
  - {title: "Bolya ve ark. — YOLACT (Fast NMS), ICCV 2019", url: "https://arxiv.org/abs/1904.02689", license: "arXiv", use: link}
  - {title: "Everingham ve ark. — The PASCAL VOC Challenge (IJCV 2010)", url: "http://host.robots.ox.ac.uk/pascal/VOC/", license: "©", use: link}
  - {title: "CS231n — Detection and Segmentation", url: "https://cs231n.stanford.edu/", license: "©", use: link}

hand:
  groups:
    - title: "IoU ve NMS (kutular $(x_1,y_1,x_2,y_2)$)"
      fields:
        - {id: iou, label: "IoU((1, 1, 5, 5), (3, 2, 7, 6))", answer: 0.23076923076923078, tol: 1.0e-6}
        - {id: kept, label: "NMS (eşik 0.5): (0,0,10,10) 0.9 · (1,1,11,11) 0.8 · (20,20,30,30) 0.7 · (8,8,18,18) 0.6 · (21,19,31,29) 0.5 — kaç kutu kalır?", answer: 3}
    - title: "YOLO"
      fields:
        - {id: nout, label: "Ders slaytındaki düzen: 13 × 13 ızgara, hücre başına 5 kutu (4 koordinat + nesnellik) + hücre başına 20 sınıf → toplam sayı", answer: 7605}
        - {id: cx, label: "416 × 416 görüntü, 13 × 13 ızgara, hücre (satır 4, sütun 7), $t_x=0$: kutu merkezinin x'i (piksel)", answer: 240}
        - {id: area, label: "Çapa 100 piksel yüksek, 50 geniş; ağ $t_h=\\ln 1.5$, $t_w=\\ln 0.9$ tahmin ediyor: kutu alanı", answer: 6750}
    - title: "AP — skora göre sıralı tespitler: D D Y D Y Y D Y (D = doğru), toplam 5 gerçek nesne"
      fields:
        - {id: ap11, label: "11 noktalı AP (VOC 2007)", answer: 0.6948051948051948, tol: 1.0e-6}
        - {id: apall, label: "Tüm noktalı AP (VOC 2010+)", answer: 0.6642857142857143, tol: 1.0e-6}
    - title: "FCN ve FPN"
      fields:
        - {id: grid, label: "224'te 7 × 7 darboğaz veren FCN'e 448 × 448 girdi; çıkış katmanı 7 × 7 valid konv.: çıkış ızgarası kenarı", answer: 8}
        - {id: lvl, label: "FPN Denk. (1), $k_0=4$: 100 × 50'lik RoI hangi seviyeye ($P_k$, $k\\in[2,5]$)?", answer: 2}
  verify: |
    import math
    def _iou(a, b):
        iw = max(0, min(a[2], b[2]) - max(a[0], b[0])); ih = max(0, min(a[3], b[3]) - max(a[1], b[1]))
        i = iw * ih
        return i / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - i)
    B = [(0, 0, 10, 10), (1, 1, 11, 11), (20, 20, 30, 30), (8, 8, 18, 18), (21, 19, 31, 29)]
    keep = []
    for i in range(5):
        if all(_iou(B[i], B[j]) <= 0.5 for j in keep):
            keep.append(i)
    tp = [1, 1, 0, 1, 0, 0, 1, 0]
    P, R, c = [], [], 0
    for k, t in enumerate(tp):
        c += t; P.append(c / (k + 1)); R.append(c / 5)
    ap11 = sum(max([p for p, r in zip(P, R) if r >= k / 10] or [0]) for k in range(11)) / 11
    env = [max(P[k:]) for k in range(len(P))]
    apall = sum((R[k] - (R[k - 1] if k else 0)) * env[k] for k in range(len(P)))
    answers = dict(iou=_iou((1, 1, 5, 5), (3, 2, 7, 6)), kept=len(keep), nout=13 * 13 * (5 * 5 + 20), cx=(7 + 0.5) * 32,
                   area=100 * 1.5 * 50 * 0.9, ap11=ap11, apall=apall, grid=14 - 7 + 1,
                   lvl=min(5, max(2, math.floor(4 + math.log2(math.sqrt(100 * 50) / 224)))))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Yoğun katmanı konvolüsyona çevir: FCN = kayan pencere", engine: browser}
  - {id: x2, title: "FPN: yukarıdan-aşağı yol, yanal bağlantılar, RoI → seviye", engine: browser}
  - {id: x3, title: "Kalabalık sahne: Soft-NMS ve AP@[.50:.95]", engine: browser}

quiz:
  - q: "YOLOv3 genişlik/yükseklik için neden $\\ln(w/w_a)$ tahmin eder, $w$'yi doğrudan değil?"
    options:
      - {t: "Ölçek çarpımsal: log uzayda aynı göreli hata aynı kayıp verir, çıktı her zaman pozitif ($w=w_ae^{t}$) ve çapa iyi bir başlangıç noktası olur", ok: true, why: "Géron'un 'karekök tahmini' fikrinin daha ilkeli hâli."}
      - {t: "Logaritma hesabı hızlandırır", why: "Konu bu değil."}
      - {t: "Negatif genişlikleri temsil etmek için", why: "Tam tersi: pozitifliği garanti eder."}
  - q: "NMS'yi IoU eşiği 0.3'e indirirsen ne olur?"
    options:
      - {t: "Yinelenen kutular daha agresif silinir ama birbirine yakın gerçek nesneler (kalabalık) de bastırılır → recall düşer", ok: true, why: "Eşik, yinelenme/kalabalık dengesidir; Soft-NMS bu ikilemi skoru sürekli azaltarak yumuşatır."}
      - {t: "Hiçbir etkisi olmaz", why: "Etkisi büyük."}
      - {t: "Daha çok kutu kalır", why: "Daha az kalır."}
  - q: "11 noktalı AP'de neden her recall düzeyinde 'en az bu recall'daki en yüksek precision' kullanılır?"
    options:
      - {t: "Daha yüksek recall'da daha yüksek precision varsa, düşük recall'da çalışmanın anlamı yoktur; zarf (envelope) PR eğrisinin zikzaklarını düzleştirir", ok: true, why: "Géron: '%10 recall'da %90, %20'de %96 ise %10'a bakmak yanıltır'."}
      - {t: "Hesabı kolaylaştırmak için", why: "Asıl neden mantıklı çalışma noktası."}
      - {t: "Precision her zaman artan olduğu için", why: "Değildir; zarf bu yüzden var."}

homework:
  - title: "Redmon ve ark. (2016): YOLOv1'i sıfırdan"
    paper: "Redmon, Divvala, Girshick, Farhadi — You Only Look Once: Unified, Real-Time Object Detection (CVPR 2016)"
    url: "https://arxiv.org/abs/1506.02640"
    level: ileri
    hours: 16
    goal: |
      Makaledeki 7 × 7 × (2·5 + 20) çıkışlı YOLOv1'i, kaybı Denk. (3)'teki gibi (λ_coord = 5, λ_noobj = 0.5, karekök genişlik/yükseklik, "sorumlu" kutu = en yüksek IoU) uygula; PASCAL VOC'un küçük bir alt kümesinde (ör. 3 sınıf) önceden eğitilmiş bir ResNet-18 omurgasıyla eğit, mAP@0.5'i d aşamasındaki ölçücüyle raporla. Sonra çapa kutulu (YOLOv2) hâline geçip farkı ölç.
    steps:
      - "d aşamasındaki encode/decode/yolo_loss'u v1 kodlamasına uyarla (çapa yok, hücre başına B kutu)."
      - "Hata analizi: makale Şekil 4'teki gibi hataları konum / benzer sınıf / arka plan olarak sınıfla."
    accept:
      - "Eğitim kaybı düşer, doğrulama mAP@0.5 sıfırdan belirgin büyük."
      - "Hata dağılımı tablosu; YOLOv1'in konum hatası baskın çıkmalı (makaleyle uyumlu)."
  - title: "Lin ve ark. (2017): Öznitelik piramidi ağları"
    paper: "Lin, Dollár, Girshick, He, Hariharan, Belongie — Feature Pyramid Networks for Object Detection (CVPR 2017)"
    url: "https://arxiv.org/abs/1612.03144"
    level: ileri
    hours: 14
    goal: |
      d aşamasındaki tek ölçekli dedektörü, nesne boyutlarının 4–48 piksel arasında değiştiği bir sentetik veri setinde (64 → 128 tuval) dene; ardından x2'deki yukarıdan-aşağı yol ve yanal bağlantılarla P3–P5 çıkışlı bir FPN başı ekle, her seviyeye uygun çapaları ata. Makale Tablo 1'deki ablasyonun küçük sürümü: (a) yalnız en kaba seviye, (b) yukarıdan-aşağı yolsuz piramit (SSD tarzı), (c) yanal bağlantısız, (d) tam FPN — küçük/orta/büyük nesnelerde AP.
    steps:
      - "Ölçek başına AP için x3'teki ölçücüyü boyut aralıklarına göre filtrele."
    accept:
      - "Tam FPN küçük nesnelerde AP'yi belirgin artırır."
      - "Yanal bağlantısız sürüm konumlandırmada (AP@0.75) geride kalır."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: NMS adım adım
    goal: Maksimum olmayanı bastırmayı elle uygulamak
    needs: IoU
    q: |-
      Aynı sınıf için kutular ve skorlar: A (0.9), B (0.8), C (0.7), D (0.6). IoU(A,B) = 0.7, IoU(A,C) = 0.1, IoU(A,D) = 0.05, IoU(C,D) = 0.6, IoU(B,C) = 0.2. Eşik 0.5 ile NMS hangi kutuları tutar?
    solution: |-
      **Algoritma:** skora göre sırala; en yükseği tut; onunla IoU'su eşiği aşanları sil; kalanlarla tekrarla.

      1. A tutulur. B (0.7 > 0.5) silinir; C (0.1) ve D (0.05) kalır.
      2. Kalanlardan en yüksek C tutulur. D (0.6 > 0.5) silinir.
      3. Sonuç: **A ve C**.

      **Not:** B'nin C ile IoU'su hiç kullanılmadı — B önce A tarafından silindi. NMS açgözlüdür ve sıralamaya bağlıdır. Kalabalık sahnede birbirine çok yakın iki gerçek nesneden biri yanlışlıkla silinebilir; Soft-NMS silmek yerine skoru IoU'ya göre düşürür.
  - id: p2
    type: hesap
    level: 1
    title: IoU
    goal: Kesişim / birleşim oranını hesaplamak
    needs: Dikdörtgen alanı
    q: |-
      Kutular $(x_1,y_1,x_2,y_2)$: $[0,0,2,2]$ ve $[1,1,3,3]$. IoU?
    answer: 0.14285714285714285
    calc: "1/7"
    tol: 1e-4
    mistakes:
      - {answer: 0.25, msg: "Payda birleşim: 4 + 4 − 1 = 7, tek kutunun alanı değil."}
      - {answer: 0.125, msg: "Kesişim birleşimde bir kez sayılır: toplamdan çıkar."}
    hints:
      - "Kesişim $[1,1,2,2]$, alanı 1."
    solution: |-
      Kesişim 1, birleşim $4+4-1=7$ → $1/7=0.143$. Kutular yarı yarıya kaymış gibi görünse de IoU düşük: IoU küçük konum hatalarına çok duyarlıdır.
  - id: p3
    type: hesap
    level: 1
    title: Izgara tabanlı tespitte aday sayısı
    goal: Tek geçişli dedektörün çıktı boyutunu hesaplamak
    needs: Izgara ve çapa kutuları
    q: |-
      13 × 13 ızgara, hücre başına 5 çapa kutusu. Görüntü başına kaç kutu tahmini çıkar?
    answer: 845.0
    calc: "13*13*5"
    mistakes:
      - {answer: 169.0, msg: "Her hücre birden çok çapa (5) için tahmin yapar."}
    hints:
      - "Hücre sayısı × çapa."
    solution: |-
      845 aday; çoğu düşük skorlu. Skor eşiği + NMS bunları birkaç kutuya indirir. Çok ölçekli dedektörlerde (FPN, M4.9 ödevi) her seviyenin adayları toplanır.
  - id: p4
    type: yorumla
    level: 2
    title: mAP@0.5 yüksek, mAP@[.5:.95] düşük
    goal: Ölçütleri okumak
    needs: AP
    q: |-
      Modelin mAP@0.5'i 0.72, COCO tarzı mAP@[0.5:0.95]'i 0.31. Ne söyler?
    choices:
      - {t: "Model nesneleri bulamıyor", why: "0.5 IoU'da çoğunu buluyor."}
      - {t: "Nesneleri buluyor ama kutuları gevşek yerleştiriyor: yüksek IoU eşiklerinde eşleşme başarısız", ok: true, why: "COCO ölçütü kutu kalitesini ödüllendirir."}
      - {t: "Sınıflandırma hatalı", why: "Sınıf hatası her iki ölçütü de düşürürdü."}
    hints:
      - "İki ölçüt arasındaki tek fark IoU eşiği."
    solution: |-
      mAP@[.5:.95], IoU eşiği 0.5'ten 0.95'e 10 eşikte AP ortalaması. Büyük fark, yerleştirme hassasiyetinin düşük olduğunu gösterir: kutu regresyonu kaybı (GIoU/DIoU), daha ince öznitelik haritaları ya da ikinci aşamalı iyileştirme yardım eder.
  - id: p5
    type: açıkla
    level: 3
    title: Tam bağlı katmanı konvolüsyona çevirmek
    goal: FCN dönüşümünün kayan pencereyi neden bedavalaştırdığını açıklamak
    needs: Konvolüsyon, M4.2 P5
    q: |-
      7 × 7 × 512 haritadan 4096'ya giden FC katmanı 7 × 7 konvolüsyona çevrilirse ve ağa daha büyük bir görüntü verilirse ne olur? Kayan pencereyle ilişkisini ve hesap tasarrufunu açıkla.
    rubric:
      - "FC'nin, girdi tam 7 × 7 iken 7 × 7 çekirdekli (4096 çıkış kanallı) konvolüsyonla aynı hesap olduğunu söyledim"
      - "Büyük girdide çıktının uzamsal bir skor haritası olduğunu, her konumun bir pencereye karşılık geldiğini açıkladım"
      - "Örtüşen pencerelerin ortak hesaplarının paylaşıldığını (tasarruf) söyledim"
      - "Pencere adımının ağın toplam adımı (ör. 32) olduğunu belirttim"
    hints:
      - "Ağırlık tensörünü (4096, 512·7·7)'den (4096, 512, 7, 7)'ye yeniden şekillendir."
    solution: |-
      Ağırlıklar aynen yeniden şekillendirilir; 7 × 7 girdide çıktı 1 × 1 (aynı sayı). Daha büyük girdide çıktı H' × W' skor haritası: her konum, girdide ağın toplam adımıyla kaydırılmış bir pencerenin sınıf skorlarıdır (OverFeat, Sermanet ve ark. 2014). Örtüşen pencerelerin konvolüsyon öznitelikleri bir kez hesaplanır; ayrı ayrı kırpıp ağdan geçirmeye göre büyük tasarruf.
pitfalls:
  - wrong: "IoU 0.5 'yarı yarıya doğru' demektir."
    right: "Aynı boyutlu iki kutu, kenarının ~1/3'ü kadar kayınca IoU 0.5'e düşer; IoU kaymaya çok duyarlıdır."
  - wrong: "NMS eşiği ne kadar düşükse o kadar temiz sonuç."
    right: "Düşük eşik birbirine yakın gerçek nesneleri de siler; kalabalık sahnelerde eşik ya da Soft-NMS ayarlanmalı."
whatif:
  - q: "NMS'siz, uçtan uca bir dedektör mümkün mü?"
    a: "DETR: tahminler ile gerçek kutular arasında Macar eşlemesi (birebir) kayıpla eğitilir; tekrar eden tahminler cezalandırıldığı için NMS gerekmez."

labs:
  - id: l1
    lab: nmsviz
    title: "NMS: yinelenen kutuları silmek, yakın nesneleri korumak"
    goal: |
      Her nesnenin çevresinde birkaç gürültülü tespit ve rastgele yanlış pozitifler içeren bir sahnede açgözlü NMS'i ve Soft-NMS'i uygula. Bastırmadan önce ve sonra tek görüntülük AP@0.5'i ölç; NMS'in IoU eşiğini taradığında AP'nin nasıl değiştiğini ve sahne kalabalıklaştıkça en iyi eşiğin nereye kaydığını gör.
    predict:
      q: "Sahne çok kalabalıkken (nesneler birbirine yaslanmış) NMS IoU eşiğini 0.5'ten 0.2'ye indirirsen ne olur?"
      options:
        - {t: "AP artar: daha çok yineleme silinir", why: "Yinelemeler zaten 0.5'te çoğunlukla siliniyor; düşük eşik başka bir şeyi de siliyor."}
        - {t: "AP düşer: yakın duran farklı nesnelerin kutuları birbirini siler", ok: true, why: "İki gerçek nesnenin kutuları arasındaki IoU 0.2'yi aşınca düşük skorlu olan bastırılır: recall kaybı."}
        - {t: "Değişmez", why: "Eşik, hangi kutuların 'aynı nesne' sayılacağını doğrudan belirler."}
    presets:
      - {name: "Seyrek sahne", params: {n: 6, crowd: 0, fp: 8, method: 0, thr: 0.5, smin: 0.3}, note: "Nesneler ayrık: geniş bir eşik aralığı iyi çalışıyor."}
      - {name: "Kalabalık, düşük eşik", params: {n: 10, crowd: 0.9, method: 0, thr: 0.2}, note: "Yakın nesneler birbirini siliyor: recall düşüyor."}
      - {name: "Yüksek eşik", params: {n: 6, crowd: 0.3, method: 0, thr: 0.85}, note: "Yinelenen kutular hayatta kalıyor: precision düşüyor."}
      - {name: "Soft-NMS", params: {n: 10, crowd: 0.9, method: 1, sigma: 0.5, smin: 0.05}, note: "Kutular silinmiyor, skorları küçülüyor."}
      - {name: "Skor eşiği yok", params: {smin: 0, method: 0, thr: 0.5}, note: "Yanlış pozitifler sıralamanın sonuna yığılıyor."}
    questions:
      - q: "NMS neden her sınıf için ayrı uygulanır?"
        a: "Farklı sınıflardan iki nesne (ör. bisiklet ve üzerindeki insan) yüksek IoU ile üst üste binebilir; sınıflar karıştırılırsa biri diğerini siler. torchvision.ops.batched_nms bunu kutuları sınıf başına büyük bir ofsetle kaydırarak tek çağrıda yapar (ek x3)."
      - q: "Açgözlü NMS'in en kötü durum karmaşıklığı nedir ve Fast NMS bunu nasıl değiştirir?"
        a: "n kutuda O(n²) IoU hesabı ve sıralı bir döngü. Fast NMS (YOLACT) tüm IoU matrisini bir kerede hesaplar ve bir kutuyu, kendisinden yüksek skorlu herhangi bir kutuyla IoU'su eşiği aşıyorsa siler (zaten silinmiş kutuların bastırmasına da izin vererek): paralel, biraz daha agresif."
    limits: "Tek görüntü, tek sınıf, sentetik kutular; tespit skorları IoU'ya bağlı bir kuralla üretiliyor. Gerçek AP birçok görüntü ve sınıf üzerinden hesaplanır."
  - id: l2
    lab: apcurve
    title: "Precision–recall eğrisinden AP: zarf, 11 nokta, tüm noktalar"
    goal: |
      Doğru ve yanlış tespitlerin skorlarını iki normal dağılımdan üret, skora göre sırala ve her eşikte precision ile recall'u hesapla. Ham eğriyi, "en az bu recall'daki en yüksek precision" zarfını ve bu zarfın üç özetini (11 nokta, tüm noktalar, 101 nokta) karşılaştır.
    predict:
      q: "Nesnelerin %30'u hiç tespit edilmiyorsa (diğer her şey mükemmel) tüm noktalı AP en fazla kaç olabilir?"
      options:
        - {t: "1", why: "Bulunamayan nesneler recall'u sınırlar; tavanın ötesinde precision 0 sayılır."}
        - {t: "≈ 0.7", ok: true, why: "Recall 0.7'de kesilir; zarfın altındaki alan en fazla 0.7 × 1."}
        - {t: "≈ 0.5", why: "Mükemmel sıralamayla tavan kadar alan elde edilir."}
    presets:
      - {name: "Ders örneği gibi", params: {nGT: 20, miss: 0.1, nFP: 30, sep: 1.5}, note: "Testere dişli ham eğri, onu kapsayan zarf."}
      - {name: "Mükemmel ayrışma", params: {sep: 5, miss: 0, nFP: 30}, note: "Tüm doğrular yanlışlardan önce: AP = 1."}
      - {name: "Az tespit", params: {nGT: 4, miss: 0, nFP: 3, sep: 1}, note: "Birkaç tespitte 11 noktalı ve tüm noktalı AP birkaç puan ayrışabiliyor (tohumu değiştir)."}
      - {name: "Yüksek recall tavanı kaybı", params: {miss: 0.5, sep: 3}, note: "Ayrışma iyi ama nesnelerin yarısı yok: AP ≈ 0.5."}
    questions:
      - q: "Slayttaki örnek: 10% recall'da %90, 20% recall'da %96 precision. 10% recall için AP hangi değeri kullanır?"
        a: "%96: en az %10 recall veren tüm eşikler içindeki en yüksek precision. Recall'u ve precision'ı birlikte artıran bir eşik varken düşük olanı seçmek anlamsızdır."
      - q: "Neden yanlış pozitif sayısı artınca AP düşer ama doğruluk (accuracy) gibi bir ölçüt tanımlanamaz?"
        a: "Tespitte 'gerçek negatif' sayılamaz (görüntüde nesne olmayan sonsuz sayıda kutu vardır); bu yüzden TN içermeyen precision ve recall kullanılır."
    limits: "Skorlar iki normal dağılımdan; eşleştirme (IoU) adımı yok, her tespitin doğru/yanlış olduğu baştan belli. Tek sınıf."
  - id: l3
    lab: anchorkm
    title: "Çapa kutuları: k-means'te hangi uzaklık?"
    goal: |
      Sentetik bir eğitim kümesinin kutu boyutlarını (küçük nesneler, yayalar, arabalar, büyük nesneler) k-means ile kümele. Öklid uzaklığını YOLOv2'nin $d=1-\mathrm{IoU}$ uzaklığıyla karşılaştır; ölçüt, her kutunun en iyi çapasıyla ortalama IoU'su.
    predict:
      q: "Büyük nesneler sıkken Öklid uzaklığıyla bulunan çapalar en çok hangi kutulara kötü hizmet eder?"
      options:
        - {t: "Büyük kutulara", why: "Öklid uzaklığında büyük kutuların farkları büyük sayılır; merkezler onlara çekilir."}
        - {t: "Küçük kutulara", ok: true, why: "Merkezler büyük kutuların geniş dağılımına harcanır; çok sayıdaki küçük kutu az sayıda (ya da tek) çapayla temsil edilir."}
        - {t: "Hiçbirine; uzaklık önemli değil", why: "Küçük kutuların ortalama IoU'su farkı gösteriyor."}
    presets:
      - {name: "YOLOv2 ayarı", params: {k: 5, d: 1, mix: 1, n: 600}, note: "1 − IoU, k = 5."}
      - {name: "Öklid, büyük nesneler sık", params: {k: 3, d: 0, mix: 3}, note: "Küçük kutuların ortalama IoU'su belirgin biçimde düşüyor."}
      - {name: "Çok çapa", params: {k: 9, d: 1}, note: "Ortalama IoU artıyor (YOLOv3 9 çapa kullanır: 3 ölçek × 3)."}
      - {name: "Tek çapa", params: {k: 1, d: 1}, note: "Tek bir 'ortalama' kutu: hiçbir türe iyi uymuyor."}
    questions:
      - q: "Neden çapa boyutları değil, ölçek faktörlerinin logaritması tahmin edilir?"
        a: "e^t her zaman pozitiftir (geçerli boyut), t = 0 çapanın kendisidir, ve log ölçekte 2 kat büyük ile 2 kat küçük simetriktir. Ayrıca kayıp görece hataları cezalandırır."
    limits: "Dört türden log-normal sentetik kutular; k-means++ başlatma ve 60 iterasyon. Gerçek veri kümelerinde (COCO) dağılım çok daha geniş ve kuyrukludur."
