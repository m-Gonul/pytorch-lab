id: m3-1-micrograd
code: M3.1
title: Skaler autograd (micrograd)
phase: 3
minutes: 240
prereq: [m0-3-chain-rule]
summary: >
  PyTorch'un kalbindeki mekanizmayı kendin kuruyorsun. Karpathy'nin klasik
  örneğinde geri geçişi elle yapıyor, saf Python'da `Value` sınıfıyla bir
  autograd motoru yazıyor, aynı nöronu NumPy'da batch hâlinde elle türetiyor,
  PyTorch'la birebir karşılaştırıyor ve en sonda örnek başına gradyanları
  `vmap` ile döngüsüz hesaplıyorsun.
goals:
  - "Her işlemin kendi yerel türevini bildiği bir [[hesap grafiği]] veri yapısı kurmak"
  - "Geri geçişi [[topolojik sıralama]]nın tersiyle yürütmek ve gradyanları `+=` ile biriktirmek"
  - "Skaler motorun ($O(\\text{düğüm})$ Python çağrısı) ile tensor motorunun (tek kernel) farkını ölçmek"
  - "[[per-sample gradient|Örnek başına gradyanı]] `torch.func.vmap(grad(...))` ile hesaplamak"
sources:
  - {title: "Karpathy — micrograd", url: "https://github.com/karpathy/micrograd", license: "MIT", use: adapt}
  - {title: "Karpathy — Neural Networks: Zero to Hero, 1: The spelled-out intro to neural networks and backpropagation", url: "https://karpathy.ai/zero-to-hero.html", license: "kod MIT; video ©", use: adapt}
  - {title: "CS231n — Backpropagation, Intuitions", url: "https://cs231n.github.io/optimization-2/", license: "MIT", use: adapt}
  - {title: "MiniTorch — Module 1: Autodiff", url: "https://minitorch.github.io/", license: "lisans dosyası yok", use: link}
  - {title: "PyTorch — torch.func: per-sample gradients", url: "https://docs.pytorch.org/tutorials/intermediate/per_sample_grads.html", license: "BSD-3", use: adapt}

hand:
  groups:
    - title: "Grafik: $e=a\\cdot b$, $d=e+c$, $L=d\\cdot f$; $a=2$, $b=-3$, $c=10$, $f=-2$. İleri geçiş"
      fields:
        - {id: e, label: "$e$", answer: -6, hint: "$2\\cdot(-3)$"}
        - {id: d, label: "$d$", answer: 4, hint: "$-6+10$"}
        - {id: L, label: "$L$", answer: -8, hint: "$4\\cdot(-2)$"}
    - title: "Geri geçiş ($\\partial L/\\partial L=1$ ile başla)"
      fields:
        - {id: gd, label: "$\\partial L/\\partial d$", answer: -2, hint: "çarpım düğümü: diğer girdi, $f$"}
        - {id: gf, label: "$\\partial L/\\partial f$", answer: 4, hint: "çarpım düğümü: diğer girdi, $d$"}
        - {id: gc, label: "$\\partial L/\\partial c$", answer: -2, hint: "toplama düğümü gradyanı aynen geçirir"}
        - {id: ge, label: "$\\partial L/\\partial e$", answer: -2, hint: "toplama düğümü"}
        - {id: ga, label: "$\\partial L/\\partial a$", answer: 6, hint: "$\\partial L/\\partial e\\cdot b=-2\\cdot(-3)$"}
        - {id: gb, label: "$\\partial L/\\partial b$", answer: -4, hint: "$\\partial L/\\partial e\\cdot a=-2\\cdot2$"}
    - title: "Nöron: $n=x_1w_1+x_2w_2+b$, $o=\\tanh(n)$; $x=(2,0)$, $w=(-3,1)$, $b=6.8814$ (öyle seçildi ki $o=1/\\sqrt2$)"
      fields:
        - {id: n, label: "$n$ (3 ondalık)", answer: 0.8814, tol: 0.002, hint: "$2\\cdot(-3)+0\\cdot1+6.8814$"}
        - {id: dodn, label: "$\\partial o/\\partial n=1-o^2$", answer: 0.5, tol: 0.001, hint: "$o^2=1/2$"}
        - {id: dw1, label: "$\\partial o/\\partial w_1$", answer: 1.0, tol: 0.002, hint: "$0.5\\cdot x_1$"}
        - {id: dw2, label: "$\\partial o/\\partial w_2$", answer: 0, tol: 0.002, hint: "$0.5\\cdot x_2$ — girdisi 0 olan ağırlık öğrenmez"}
        - {id: dx1, label: "$\\partial o/\\partial x_1$", answer: -1.5, tol: 0.002, hint: "$0.5\\cdot w_1$"}
  verify: |
    import math
    a, b, c, f = 2, -3, 10, -2
    e = a * b; d = e + c; L = d * f
    bb = 6.8813735870195432
    n = 2 * -3 + 0 * 1 + bb; o = math.tanh(n); g = 1 - o * o
    answers = dict(e=e, d=d, L=L, gd=f, gf=d, gc=f, ge=f, ga=f * b, gb=f * a,
                   n=round(n, 4), dodn=round(g, 9), dw1=round(g * 2, 9), dw2=g * 0, dx1=round(g * -3, 9))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "`Value` sınıfında `self.grad = out.grad * other.data` yazmak (`+=` yerine) hangi durumda yanlış sonuç verir?"
    options:
      - {t: "Bir düğüm grafikte birden fazla kez kullanıldığında (ör. `b = a + a` ya da `a * a`)", ok: true, why: "İkinci kullanım birincinin gradyanının üzerine yazar. M0.3'te $y$'nin iki yolunu toplamak zorunda kaldığın durumun kodu bu."}
      - {t: "Hiçbir zaman; sonuç aynıdır", why: "`b = a + a` için doğru $\\partial b/\\partial a=2$, `=` ile 1 çıkar."}
      - {t: "Yalnız tanh düğümlerinde", why: "Sorun işlem türünden değil, düğümün paylaşılmasından kaynaklanır."}
  - q: "Geri geçişte düğümler neden topolojik sıranın **tersiyle** işlenir?"
    options:
      - {t: "Bir düğümün `_backward`'ı çağrılmadan önce, o düğümü kullanan tüm düğümlerden gelen gradyan katkıları toplanmış olmalı", ok: true, why: "Ters topolojik sıra, her düğüme ulaşmadan önce onun tüm 'tüketicilerinin' işlendiğini garanti eder."}
      - {t: "Bellekten tasarruf için", why: "Bellek yönetimi ayrı bir konu (M6.4); burada konu doğruluk."}
      - {t: "Rastgele sıra da çalışır", why: "Bir düğüm, gradyanı henüz eksikken çocuklarına yanlış değer iletir."}
  - q: "e aşamasındaki modelde örnek başına gradyanın kapalı formu $g_i=(1-o_i^2)\\,x_i$. O hâlde `vmap` neden gerekli?"
    options:
      - {t: "Gerekli değil bu model için; ama kapalı formu bilinmeyen keyfi bir ağda (ör. bir CNN) aynı satır çalışır", ok: true, why: "`vmap(grad(f))` modelden bağımsız bir dönüşüm; kapalı form türetmek her mimari için yeniden iş."}
      - {t: "Kapalı form yanlış", why: "Kontrol tam bu formülle karşılaştırıyor."}
      - {t: "`loss.backward()` örnek başına gradyan verir", why: "`backward` batch toplamının gradyanını verir; örnekler tek bir vektöre toplanmış olur."}

homework:
  - title: "Paszke ve ark. (2017): PyTorch'ta otomatik türev"
    paper: "Paszke ve ark. — Automatic differentiation in PyTorch (NIPS 2017 Autodiff Workshop)"
    url: "https://openreview.net/forum?id=BJJsrmfCZ"
    level: orta
    hours: 6
    goal: |
      micrograd'ını makalenin tasarım ilkelerine göre genişlet: (1) dinamik, çalıştırarak tanımlanan (define-by-run) grafik, (2) yerinde (in-place) işlemleri sürüm sayaçlarıyla güvenli kılma (Bölüm 3), (3) create_graph ile ikinci türevler (grafiğin kendisini türevlenebilir yapmak). Sürüm sayacının yakaladığı bir 'yerinde değişiklik' hatası örneği üret; ikinci türevleri sayısal türevlerle doğrula.
    steps:
      - "Value'ya _version alanı ekle; geri geçişte kaydedilen sürümle karşılaştır."
    accept:
      - "Yerinde değişiklik geri geçişte yakalanır."
      - "Hessian-vektör çarpımı sonlu farkla eşleşir."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bir nöronun elle geri geçişi
    goal: Skaler autograd'ın adımlarını izlemek
    needs: Zincir kuralı (M0.3)
    q: |-
      $o=\tanh(n)$, $n=x_1w_1+x_2w_2+b$; $x_1=2$, $w_1=-3$, $x_2=0$, $w_2=1$, $b=6.8814$. Tüm gradyanları bul.
    solution: |-
      **İleri:** $x_1w_1=-6$, $x_2w_2=0$, $n=0.8814$, $o=\tanh(0.8814)=0.7071$.

      **Geri:** $\partial o/\partial n=1-o^2=0.5$. Toplama düğümü dağıtır: $\partial o/\partial b=0.5$, $\partial o/\partial(x_1w_1)=0.5$, $\partial o/\partial(x_2w_2)=0.5$. Çarpma değiştokuş eder: $\partial o/\partial w_1=0.5\cdot x_1=1.0$, $\partial o/\partial x_1=0.5\cdot w_1=-1.5$, $\partial o/\partial w_2=0.5\cdot x_2=0$, $\partial o/\partial x_2=0.5\cdot w_2=0.5$.

      **Uygulama ilkesi:** her düğüm yerel türevini bilir; geri geçiş topolojik sıranın tersinde her düğümün `_backward`'ını çağırır ve gradyanları **toplar** (`+=`). $x_2=0$ olduğu için $w_2$ hiç öğrenmez: sıfır girdi sıfır ağırlık gradyanı verir.
  - id: p2
    type: hesap
    level: 1
    title: Basit bir grafik
    goal: Çarpma düğümü kuralını uygulamak
    needs: P1
    q: |-
      $f=a\cdot b+c$, $a=2$, $b=-3$, $c=10$. $\partial f/\partial a$?
    answer: -3.0
    calc: "-3"
    mistakes:
      - {answer: 2.0, msg: "Çarpma düğümünde gradyan diğer girdinin değeridir: b = −3."}
    hints:
      - "Toplama c'yi ayırır, çarpma $a\\cdot b$'nin türevi $b$."
    solution: |-
      $-3$.
  - id: p3
    type: hesap
    level: 1
    title: tanh'ın yerel türevi
    goal: Aktivasyonun yerel türevini kullanmak
    needs: $\tanh'=1-\tanh^2$
    q: |-
      $o=\tanh(n)=0.6$. $\partial o/\partial n$?
    answer: 0.64
    calc: "1-0.36"
    mistakes:
      - {answer: 0.4, msg: "1 − tanh², yani 1 − 0.36."}
    hints:
      - "Çıktının kendisiyle ifade edilir: $1-o^2$."
    solution: |-
      $0.64$. Yerel türevi çıktıdan hesaplamak, girdiyi saklamaya gerek bırakmaz.
  - id: p4
    type: hata-bul
    level: 2
    title: Bir değişken iki kez kullanılınca yanlış gradyan
    goal: Gradyan biriktirmenin gerekliliğini göstermek
    needs: M0.3 P3
    q: |-
      `b = a + a` için `b.backward()` sonrası `a.grad` 1 çıkıyor (doğrusu 2). `_backward` içinde hangi hata var?
    choices:
      - {t: "`self.grad = 1.0 * out.grad` (atama)", ok: true, why: "İkinci kullanım birincinin katkısının üstüne yazar; `+=` olmalı."}
      - {t: "Topolojik sıralama yanlış", why: "Tek düğümlü grafikte sıra sorun değil."}
      - {t: "`out.grad` 1 ile başlatılmamış", why: "Öyle olsaydı 0 çıkardı."}
    hints:
      - "`a` toplama düğümünün iki girdisi; her biri için `_backward` ne yazıyor?"
    solution: |-
      Toplama düğümünün iki girdisi de aynı nesne; ikinci `self.grad = …` birincinin üstüne yazar. Çok değişkenli zincir kuralı gradyanların toplanmasını ister: `self.grad += out.grad`. Bu yüzden her `backward`'dan önce gradyanlar sıfırlanır (`zero_grad`).
  - id: p5
    type: açıkla
    level: 3
    title: Neden topolojik sıra?
    goal: Geri geçiş sırasının doğruluk koşulunu açıklamak
    needs: Yönlü döngüsüz graf
    q: |-
      Bir düğümün `_backward`'ı çağrılmadan önce neden tüm "kullanıcılarının" (onu girdi alan düğümlerin) gradyanlarını yaymış olması gerekir? Ters topolojik sıranın bunu nasıl garanti ettiğini açıkla.
    rubric:
      - "Bir düğümün gradyanının tüm kullanıcılarından gelen katkıların toplamı olduğunu söyledim"
      - "Eksik toplanmış bir gradyanı yaymanın aşağıdaki düğümlere eksik gradyan göndereceğini açıkladım"
      - "Topolojik sıranın her düğümü girdilerinden sonra koyduğunu, tersinin her düğümü kullanıcılarından sonra işlediğini söyledim"
      - "Grafiğin döngüsüz olması gerektiğini (yerinde döngüler yerine zamana açılmış grafik) belirttim"
    hints:
      - "Diamond biçimli bir grafik düşün: a → b, a → c, b, c → d."
    solution: |-
      $a$'nın gradyanı $b$ ve $c$ yollarının toplamıdır. $a$'yı $c$'nin katkısı gelmeden yayarsak yalnız $b$ yolunu aşağı göndeririz. Ters topolojik sıra (d, c, b, a ya da d, b, c, a) bir düğümü tüm kullanıcılarından sonra işler; DFS ile çıkış sırasında listeye eklemek bu sırayı verir. Grafik döngüsüz olmalı: RNN'ler zamana açılarak (BPTT) döngüsüz hâle getirilir.
pitfalls:
  - wrong: "Geri geçiş ileri geçişin tersine aynı işlemleri yapar."
    right: "Her işlem için ayrı bir türev kuralı (VJP) uygulanır; geri geçiş ileri geçişin değerlerini kullanır ama farklı hesaplar yapar."
  - wrong: "Gradyanlar her backward'da kendiliğinden sıfırlanır."
    right: "Birikir (`+=`); her adımdan önce `zero_grad()` gerekir — gradyan biriktirme (accumulation) bu davranışı bilerek kullanır."
whatif:
  - q: "Grafikte max(a, b) düğümü ve a = b olursa?"
    a: "Türevlenemez nokta; uygulama bir alt gradyan seçer (genelde ilk girdi ya da eşit bölüşüm) — tutarlı olduğu sürece sorun çıkmaz."

labs:
  - id: l1
    lab: exprgraph
    title: "Tarayıcıda micrograd: kendi ifadeni yaz, grafiği ve gradyanları gör"
    goal: |
      Bir ifade ve değişken değerleri yaz; bir `Value` grafiği kurulur (bu sayfadaki JavaScript, micrograd'ın birebir çevirisi). Her kutu bir düğüm: #sıra (topolojik), işlem, ileri değer (yeşil) ve gradyan (turuncu). Tablo, geri yayılımın sonucunu merkezi farkla karşılaştırır.
    predict:
      q: "x*x + x ifadesinde x = 3. Geri yayılım ∂/∂x için ne verir?"
      options:
        - {t: "7: çarpmanın iki girdisi de x (3 + 3), toplamadan 1 daha", ok: true, why: "x üç yerde kullanılıyor; += ile katkılar toplanır: 3 + 3 + 1 = 7 = 2x + 1."}
        - {t: "4", why: "Bu, gradyanlar '=' ile yazılırsa (son yol öncekileri silerse) çıkabilecek yanlış bir sonuç."}
        - {t: "6", why: "Toplamadaki doğrudan yol unutulmuş."}
    presets:
      - {name: "Karpathy örneği", params: {preset: "karpathy"}, note: "L = (a·b + c)·f: ∂L/∂a = b·f = 6, ∂L/∂f = a·b + c = 4."}
      - {name: "Tek nöron", params: {preset: "noron"}, note: "tanh(x₁w₁ + x₂w₂ + b) = 0.7071; ∂o/∂w₂ = 0 çünkü x₂ = 0."}
      - {name: "Tekrar eden değişken", params: {preset: "tekrar"}, note: "Gradyan birikimi: 2x + 1 = 7."}
      - {name: "Bölme", params: {preset: "bolme"}, note: "Bölme, çarpma ve −1. kuvvet düğümlerine açılır."}
    questions:
      - q: "Bir düğümün gradyanı neden ancak onu kullanan tüm düğümler işlendikten sonra doğrudur?"
        a: "Gradyan, onu kullanan her düğümden gelen katkıların toplamıdır. Ters topolojik sıra, bir düğüm işlenmeden önce tüm kullanıcılarının katkılarını eklemesini garanti eder."
      - q: "exp(x) düğümünün geri fonksiyonu neden çıktının kendisini kullanıyor?"
        a: "d eˣ/dx = eˣ = o: ileri geçişte hesaplanan değer saklanır ve yeniden kullanılır; üs yeniden hesaplanmaz (tanh ve sigmoid için de aynı)."
    limits: "Skaler ifadeler, en fazla 60 düğüm; üs sabit olmalı. Sayısal karşılaştırma h = 10⁻⁶ ile merkezi fark."
  - id: l2
    lab: mlpmoons
    title: "Küçük bir MLP iki ay verisinde"
    goal: |
      Tam batch gradyan inişi (momentum 0.9) ile eğitilen bir MLP. Arka plan modelin P(y = 1 | x) tahmini. Gizli katman sayısını 0 yaparak lojistik regresyona dön, genişlik ve derinlikle oyna.
    predict:
      q: "Gizli katman sayısı 0 iken (yalnız doğrusal çıktı) iki ay verisinde doğruluk ne olur?"
      options:
        - {t: "~%85–90: doğrusal sınır ayların büyük kısmını ayırır ama uçlardaki kıvrımları kaçırır", ok: true, why: "Ayların uçları birbirinin içine girer; tek bir doğru onları ayıramaz."}
        - {t: "%100", why: "İki ay doğrusal ayrılabilir değildir."}
        - {t: "%50", why: "Doğrusal model yine de ayların ana gövdelerini ayırır."}
    presets:
      - {name: "Doğrusal (gizli katman yok)", params: {depth: 0, steps: 300}, note: "Lojistik regresyon: düz sınır."}
      - {name: "Tek gizli katman, 4 nöron", params: {depth: 1, width: 4, act: 0, steps: 400}, note: "Birkaç bükülme yeter."}
      - {name: "2 × 12, ReLU", params: {depth: 2, width: 12, act: 1, steps: 300}, note: "Parçalı doğrusal sınır (ReLU ağı parçalı doğrusal bir fonksiyondur)."}
      - {name: "Derin sigmoid", params: {depth: 3, width: 12, act: 2, steps: 300}, note: "Aynı adım sayısında çok daha yavaş öğrenme: sigmoid'in küçük türevi ve sıfır merkezli olmayan çıktısı (M3.5)."}
      - {name: "Büyük η", params: {depth: 2, width: 12, act: 0, lr: 1.5, steps: 300}, note: "Kayıp salınır ya da patlar."}
    questions:
      - q: "ReLU ağının olasılık haritası neden düz parçalardan oluşuyor gibi görünüyor?"
        a: "ReLU ağı, girdi uzayını bölgelere ayırır ve her bölgede doğrusal bir fonksiyondur (aktivasyon desenleri sabit); logit parçalı doğrusaldır, sigmoid'den geçince yumuşar."
    limits: "100 eğitim örneği, tam batch; çıkış kaybı BCE (logit üzerinden), çok küçük L2 (10⁻⁴). Başlatma tanh/sigmoid için √(1/n), ReLU için √(2/n)."
