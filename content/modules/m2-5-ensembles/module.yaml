id: m2-5-ensembles
code: M2.5
title: Random forest ve gradient boosting
phase: 2
minutes: 240
prereq: [m2-4-tree]
summary: >
  Zayıf modellerden güçlü model. Gradient boosting'in iki turunu ve
  bagging'in varyans azaltmasını elle hesaplıyor; saf Python'da tek özellikli
  boosting yazıyor; NumPy'da regresyon stump'ını cumsum ile döngüsüz buluyor;
  PyTorch'ta pseudo-residual'ları autograd'a hesaplatarak keyfi kayıpla
  boosting yapıyor ve en sonda B bootstrap ağacını tek tensörde eğitiyorsun.
goals:
  - "Gradient boosting'i fonksiyon uzayında gradient descent olarak görmek: her tur [[pseudo-residual]]'lara bir ağaç oturtur"
  - "Regresyon stump'ının SSE kazancını $\\frac{S_L^2}{n_L}+\\frac{S_R^2}{n_R}$ ile tüm eşiklerde birden hesaplamak"
  - "Bagging'in varyansı $\\rho\\sigma^2+\\frac{1-\\rho}{B}\\sigma^2$'ye indirdiğini ve random forest'ın $\\rho$'yu neden düşürmeye çalıştığını açıklamak"
  - "Kayıp fonksiyonunu değiştirince boosting'in yalnız gradyan hesabının değiştiğini autograd ile göstermek"
sources:
  - {title: "ISLP — §8.2 Bagging, Random Forests, Boosting", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "Elements of Statistical Learning — Bölüm 10 (Boosting) ve 15 (Random Forests)", url: "https://hastie.su.domains/ElemStatLearn/", license: "doğrulanmadı", use: link}
  - {title: "Friedman — Greedy Function Approximation: A Gradient Boosting Machine", url: "https://jerryfriedman.su.domains/ftp/trebst.pdf", license: "©", use: link}
  - {title: "Chen & Guestrin — XGBoost: A Scalable Tree Boosting System", url: "https://arxiv.org/abs/1603.02754", license: "arXiv", use: link}

hand:
  groups:
    - title: "Boosting (MSE): $x=[1,2,3,4]$, $y=[1,1,3,3]$, $\\eta=0.5$, stump eşiği 2.5"
      fields:
        - {id: F0, label: "$F_0$ (sabit başlangıç)", answer: 2, hint: "MSE'yi minimize eden sabit: ortalama"}
        - {id: r0, label: "1. örneğin residual'ı $y_1-F_0$", answer: -1, hint: "$1-2$"}
        - {id: F1, label: "$F_1(x_1)=F_0+\\eta\\,h_1(x_1)$", answer: 1.5, tol: 0.001, hint: "stump sol yaprağı residual ortalaması $-1$"}
        - {id: F2, label: "$F_2(x_1)$", answer: 1.25, tol: 0.001, hint: "yeni residual $-0.5$; $1.5+0.5\\cdot(-0.5)$"}
        - {id: mse2, label: "2 tur sonra eğitim MSE'si", answer: 0.0625, tol: 0.0005, hint: "her örnekte hata $0.25$"}
    - title: "Bagging"
      fields:
        - {id: vote, label: "3 sınıflandırıcının oyları $[1,0,1]$: çoğunluk", answer: 1}
        - {id: avgp, label: "Olasılıkları $[0.9,0.4,0.6]$: ortalama", answer: 0.633333, tol: 0.002, hint: "$1.9/3$"}
        - {id: vind, label: "$B=5$ bağımsız model, her biri $\\sigma^2=1$: ortalamanın varyansı", answer: 0.2, tol: 0.001, hint: "$\\sigma^2/B$"}
        - {id: vcor, label: "Aynısı, korelasyon $\\rho=0.5$", answer: 0.6, tol: 0.001, hint: "$\\rho\\sigma^2+\\frac{1-\\rho}{B}\\sigma^2$"}
  verify: |
    x = [1, 2, 3, 4]; y = [1, 1, 3, 3]
    F = [sum(y) / 4] * 4; hist = [F[0]]
    for _ in range(2):
        r = [a - b for a, b in zip(y, F)]
        L, Rr = r[:2], r[2:]
        h = [sum(L) / 2] * 2 + [sum(Rr) / 2] * 2
        F = [f + 0.5 * v for f, v in zip(F, h)]; hist.append(F[0])
    answers = dict(F0=hist[0], r0=y[0] - hist[0], F1=hist[1], F2=hist[2], mse2=sum((a - b) ** 2 for a, b in zip(y, F)) / 4,
                   vote=1, avgp=round(1.9 / 3, 6), vind=1 / 5, vcor=0.5 + 0.5 / 5)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Random forest, bagging'e ek olarak her bölünmede özelliklerin rastgele bir alt kümesine bakar. Neden?"
    options:
      - {t: "Ağaçlar arasındaki korelasyon $\\rho$'yu düşürmek için; güçlü bir özellik her ağacın kökünü ele geçirirse ağaçlar birbirine benzer ve ortalama varyansı az düşürür", ok: true, why: "Varyans $\\rho\\sigma^2+\\frac{1-\\rho}{B}\\sigma^2$; $B\\to\\infty$'da $\\rho\\sigma^2$'ye takılır. Özellik altörneklemesi $\\rho$'yu küçültür."}
      - {t: "Hız için", why: "Hız bir yan fayda; asıl amaç dekorelasyon."}
      - {t: "Bias'ı düşürmek için", why: "Tek tek ağaçların bias'ı biraz artar bile; kazanç varyanstan."}
  - q: "Gradient boosting'de MSE yerine logistic kayıp kullanınca ne değişir?"
    options:
      - {t: "Yalnız pseudo-residual'lar: $y-F$ yerine $y-\\sigma(F)$. Ağaç oturtma adımı aynı kalır", ok: true, why: "Boosting her turda kaybın $F$'ye göre negatif gradyanına bir regresyon ağacı oturtur. d aşamasında bu gradyanı autograd hesaplıyor."}
      - {t: "Ağaçlar sınıflandırma ağacı olur", why: "Hayır, her zaman regresyon ağacı (gradyana oturuyor)."}
      - {t: "Learning rate kullanılmaz", why: "Shrinkage (η) her kayıpta kullanılır."}
  - q: "Boosting'de çok küçük $\\eta$ ile çok sayıda tur, büyük $\\eta$ ile az tura göre genelde neden daha iyi genelleştirir?"
    options:
      - {t: "Her ağaç fonksiyonu küçük bir adımla değiştirir; bu bir regularization etkisidir (shrinkage) ve aşırı uyuma daha geç girer", ok: true, why: "Friedman'ın gözlemi: $\\eta\\le0.1$ hemen her zaman test hatasını iyileştirir, karşılığında daha çok tur gerekir."}
      - {t: "Küçük η daha hızlı yakınsar", why: "Daha yavaş yakınsar; daha çok tur gerekir."}
      - {t: "Fark yoktur", why: "Belirgin bir fark vardır."}

homework:
  - title: "Breiman (2001): rastgele ormanlar"
    paper: "Breiman — Random Forests (Machine Learning 2001)"
    url: "https://link.springer.com/article/10.1023/A:1010933404324"
    level: orta
    hours: 8
    goal: |
      Rastgele ormanı M2.4'teki ağacınla kur (bootstrap + düğüm başına m rastgele öznitelik). Makalenin kuramsal ilişkisini ölç: genelleme hatası üst sınırı ρ̄(1 − s²)/s² (ağaçlar arası ortalama korelasyon ρ̄ ve güç s); m'yi değiştirerek ρ̄ ve s'yi out-of-bag tahminlerle hesapla (Bölüm 2.3). OOB hatasının test hatasını izlediğini ve permütasyon önemini (Bölüm 10) göster.
    steps:
      - "Korelasyonu ağaçların marj fonksiyonları üzerinden hesapla."
    accept:
      - "m arttıkça ρ̄ ve s birlikte artar; en iyi m ödünleşimde."
      - "OOB hatası test hatasına yakın."
  - title: "Friedman (2001): gradyan artırma makinesi"
    paper: "Friedman — Greedy Function Approximation: A Gradient Boosting Machine (Annals of Statistics 2001)"
    url: "https://projecteuclid.org/journals/annals-of-statistics/volume-29/issue-5/Greedy-function-approximation-A-gradient-boosting-machine/10.1214/aos/1013203451.full"
    level: orta
    hours: 8
    goal: |
      Gradyan artırmayı (Algoritma 1) kayıp fonksiyonundan bağımsız yaz; kare, mutlak (LAD) ve Huber kayıpları için sözde kalıntıları ve yaprak değerlerini (Bölüm 4) uygula. Aykırı değerli bir regresyon probleminde üç kaybı karşılaştır; küçültme (ν, Bölüm 5) ve alt örneklemenin (stokastik artırma) test hatasına etkisini çiz.
    steps:
      - "Ağaç derinliği J ∈ {2, 4, 8} ile etkileşim düzeyini değiştir."
    accept:
      - "Huber/LAD aykırı değerlerde kareden iyi."
      - "Küçük ν daha çok ağaçla daha iyi test hatası."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Bagging varyansı ne kadar azaltır?
    goal: İlişkili tahminlerin ortalamasının varyansını türetmek
    needs: Kovaryans, varyansın doğrusallığı
    q: |-
      $B$ model, her birinin varyansı $\sigma^2$, her çiftin korelasyonu $\rho$. Ortalamalarının varyansı?
    solution: |-
      $\mathrm{Var}\big(\frac1B\sum_bf_b\big)=\frac1{B^2}\Big[\sum_b\mathrm{Var}(f_b)+\sum_{b\ne b'}\mathrm{Cov}(f_b,f_{b'})\Big]=\frac1{B^2}\big[B\sigma^2+B(B-1)\rho\sigma^2\big]$.
      $$=\rho\sigma^2+\frac{1-\rho}B\sigma^2.$$
      **Yorum:** $B\to\infty$ iken ikinci terim söner, ilk terim **kalır**: ortalama alma ilişkili hatayı silemez. Bagging'in sınırı $\rho$'dur; rastgele orman her bölünmede özniteliklerin rastgele bir alt kümesini deneyerek ağaçlar arası $\rho$'yu düşürür. Yanlılık değişmez: bagging yanlılığı düşük, varyansı yüksek (derin ağaç) modeller için uygundur.
  - id: p2
    type: hesap
    level: 1
    title: Sayılarla
    goal: P1'i uygulamak
    needs: P1
    q: |-
      $\rho=0.3$, $\sigma^2=1$, $B=10$. Ortalamanın varyansı?
    answer: 0.37
    calc: "0.3+0.7/10"
    mistakes:
      - {answer: 0.1, msg: "Bu bağımsız modeller (ρ = 0) için; korelasyon terimi ρσ² kalır."}
      - {answer: 0.3, msg: "Bu B → ∞ limiti; B = 10'da (1 − ρ)σ²/B = 0.07 eklenir."}
    hints:
      - "$\\rho\\sigma^2+(1-\\rho)\\sigma^2/B$."
    solution: |-
      $0.3+0.07=0.37$; 1000 ağaç bile 0.3'ün altına inemez.
  - id: p3
    type: hesap
    level: 1
    title: Gradient boosting'in bir turu
    goal: Kare kayıpta pseudo-residual'ı kullanmak
    needs: Gradyan, ortalama
    q: |-
      $y=[1,3,8]$. $F_0=\bar y$. Kare kayıpta pseudo-residual $r_i=y_i-F_0(x_i)$; bir stump üçüncü örneğin residual'ını tam tahmin ediyor. Öğrenme oranı 0.1 ile $F_1(x_3)$?
    answer: 4.4
    calc: "4+0.1*(8-4)"
    mistakes:
      - {answer: 8.0, msg: "Öğrenme oranı (shrinkage) 0.1 ile çarpmayı unuttun."}
      - {answer: 8.0, msg: "Tek turda hedefe atlamaz; F₀ + η·r."}
    hints:
      - "$F_0=4$, $r_3=4$."
    solution: |-
      $F_1(x_3)=4+0.1\cdot4=4.4$. Küçük adımlar çok tur ister ama genellemeyi iyileştirir (Friedman'ın shrinkage'ı).
  - id: p4
    type: yorumla
    level: 2
    title: Boosting turları ve doğrulama hatası
    goal: Boosting'de aşırı uyumu okumak
    needs: Erken durdurma
    q: |-
      Öğrenme oranı 1.0 ile boosting: doğrulama hatası 30. turda dibe iniyor, sonra yükseliyor. Öğrenme oranı 0.05 ile dip 500. turda ve daha alçak. Yorum?
    choices:
      - {t: "Boosting asla aşırı uymaz", why: "AdaBoost'un marj davranışı için zaman zaman söylenir; gradient boosting kesinlikle aşırı uyar."}
      - {t: "Her tur eğitim artıklarına uyar; turlar arttıkça gürültüye uyar. Küçük η + erken durdurma daha iyi bir dibe ulaşır", ok: true, why: "Shrinkage düzenlileştirmedir; tur sayısı doğrulamayla seçilir."}
      - {t: "η = 1.0 daha iyi: daha az tur", why: "Hız için evet, ama dip daha yüksek."}
    hints:
      - "Bagging ile boosting aynı hatayı mı azaltır?"
    solution: |-
      Bagging varyansı, boosting yanlılığı azaltır; boosting sıralı olarak artıklara uyduğu için yeterince turda gürültüyü de öğrenir. Küçük η, her ağacın katkısını küçük tutar ve daha pürüzsüz bir yol izler. Ek düzenlileştirmeler: alt örnekleme (stokastik GB), ağaç derinliği sınırı, yaprak sayısı cezası (XGBoost'ta γ, λ).
  - id: p5
    type: kanıt
    level: 3
    title: Pseudo-residual = negatif gradyan
    goal: Gradient boosting'i fonksiyon uzayında gradyan inişi olarak görmek
    needs: Türev
    q: |-
      Her örnek için $r_i=-\frac{\partial\ell(y_i,F)}{\partial F}\big|_{F=F_{m-1}(x_i)}$. Kare kayıp ($\frac12(y-F)^2$), mutlak kayıp ($|y-F|$) ve lojistik kayıp için $r_i$'yi bul; yeni ağacın bu değerlere uydurulmasının neden mantıklı olduğunu açıkla.
    rubric:
      - "Kare kayıpta $r=y-F$ (sıradan artık) buldum"
      - "Mutlak kayıpta $r=\\mathrm{sign}(y-F)$ buldum ve aykırı değerlere dayanıklılığı yorumladım"
      - "Lojistik kayıpta $r=y-\\sigma(F)$ buldum (M1.4 ile aynı biçim)"
      - "Ağacın, F'nin n boyutlu 'fonksiyon değerleri' uzayında negatif gradyanı yaklaşan bir adım olduğunu açıkladım"
    hints:
      - "F'yi her örnekte ayrı bir parametre gibi düşün."
    solution: |-
      Eğitim kaybı $\sum_i\ell(y_i,F(x_i))$, $F$'nin n noktadaki değerlerinin fonksiyonu; gradyan inişi her $F(x_i)$'yi $-\partial\ell/\partial F$ yönünde iter. Ama yeni noktalara genelleşen bir **fonksiyon** gerektiğinden bu yön bir ağaçla yaklaştırılır. Kare: $y-F$; mutlak: $\mathrm{sign}(y-F)$ (aykırı değerin büyüklüğü önemsiz); lojistik: $y-\sigma(F)$. Ayrıntı: ağacın yaprak değerleri sonra her yaprak için ayrı bir çizgi aramasıyla (ya da Newton adımıyla — XGBoost) yeniden hesaplanır.
  - id: p6
    type: yöntem-seç
    level: 2
    title: Tablo verisi
    goal: Tablo verisi için model ailesi seçmek
    needs: Ağaç ve topluluk yöntemleri
    q: |-
      50 000 satır, 40 sütun (kategorik + sayısal, eksik değerler var), bir kredi temerrüt tahmini. İlk denenecek güçlü model?
    choices:
      - {t: "Derin MLP", why: "Tablo verisinde genelde iyi ayarlanmış GBDT'nin gerisinde kalır (Grinsztajn ve ark. 2022)."}
      - {t: "Gradient boosted ağaçlar (XGBoost/LightGBM/CatBoost)", ok: true, why: "Ölçekleme gerektirmez, eksik değerleri ve kategorikleri doğrudan işler, güçlü varsayılan."}
      - {t: "Tek karar ağacı", why: "Yorumlanabilir ama yüksek varyans; taban çizgisi olarak kalsın."}
    hints:
      - "Bu veri türünde rekabetlerde hangi model aileleri baskın?"
    solution: |-
      GBDT tablo verisinin güçlü varsayılanıdır; taban çizgisi olarak lojistik regresyon ve tek ağaç da raporlanmalı. Değerlendirme dengesiz sınıflar için PR-AUC ve kalibrasyonla (M1.4 P6).
pitfalls:
  - wrong: "Daha çok ağaç her zaman aşırı uyuma yol açar."
    right: "Bagging/rastgele ormanda ağaç eklemek varyansı azaltır, aşırı uyutmaz; boosting'de ise tur sayısı aşırı uyumu artırabilir."
  - wrong: "Bagging yanlılığı da azaltır."
    right: "Ortalama, bileşenlerin yanlılığını korur; bagging yalnız varyansı azaltır (P1)."
whatif:
  - q: "Tüm modeller aynı veri ve aynı tohumla eğitilirse?"
    a: "ρ = 1: topluluk tek modele eşittir, hiçbir kazanç yok. Çeşitlilik (bootstrap, öznitelik alt kümesi, farklı tohum) şarttır."
  - q: "Derin ağlarda topluluk?"
    a: "Farklı tohumlarla eğitilmiş birkaç ağın ortalaması doğruluğu ve kalibrasyonu belirgin iyileştirir (derin topluluklar); maliyeti çıkarımda çarpar — damıtma bunu tek ağa sığdırır."
