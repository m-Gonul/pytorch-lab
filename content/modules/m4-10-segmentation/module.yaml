id: m4-10-segmentation
code: M4.10
title: Segmentasyon — FCN, transposed convolution, U-Net
phase: 4
minutes: 400
prereq: [m4-9-detection]
summary: >
  Her pikseli sınıflandırmak: anlamsal (semantic) ve örnek (instance)
  segmentasyon. CNN'in toplam adımı (32) çözünürlüğü yok eder; FCN bunu
  bir yukarı örnekleme katmanıyla geri kazanır. Transposed convolution'un
  dört eşdeğer görünümü: girdiyi çekirdekle "saçma" (scatter), sıfır
  ekleyip normal konvolüsyon (kesirli adım), konvolüsyon matrisinin
  transpozu ve konvolüsyonun girdiye göre gradyanı. Bilineer çekirdekle
  başlatma, FCN-32s → FCN-8s atlama bağlantıları, U-Net'in kodlayıcı-kod
  çözücüsü ve kopyalama bağlantıları, valid konvolüsyonlu 572 → 388
  geometrisi, IoU/Dice/mIoU, dama tahtası (checkerboard) artefaktı,
  alt-piksel konvolüsyonu (PixelShuffle), genişletilmiş (dilated)
  konvolüsyon ve bağlantılı bileşenlerle örnek ayırma.
goals:
  - "[[transposed convolution]]: çıkış boyutu $(H-1)s-2p+k$; scatter = sıfır ekleme + konv. = $C^\\top$ = $\\partial\\,\\mathrm{conv}/\\partial x$"
  - "FCN-32s/8s ve bilineer başlatma; [[u-net]] kopyalama bağlantıları"
  - "Segmentasyon ölçütleri: piksel doğruluğu, IoU, mIoU, Dice; kenar doğruluğu"
  - "Yukarı örnekleme artefaktları; PixelShuffle; [[genişletilmiş konvolüsyon]]"
sources:
  - {title: "Géron — Hands-On Machine Learning (3. baskı), Bölüm 14", url: "https://github.com/ageron/handson-ml3", license: "Apache-2.0 (kod)", use: link}
  - {title: "Long, Shelhamer, Darrell — Fully Convolutional Networks for Semantic Segmentation (CVPR 2015)", url: "https://arxiv.org/abs/1411.4038", license: "arXiv", use: link}
  - {title: "Ronneberger, Fischer, Brox — U-Net (MICCAI 2015)", url: "https://arxiv.org/abs/1505.04597", license: "arXiv", use: link}
  - {title: "Dumoulin & Visin — A guide to convolution arithmetic for deep learning", url: "https://arxiv.org/abs/1603.07285", license: "arXiv", use: link}
  - {title: "Odena, Dumoulin, Olah — Deconvolution and Checkerboard Artifacts (Distill 2016)", url: "https://distill.pub/2016/deconv-checkerboard/", license: "CC-BY 4.0", use: link}
  - {title: "Shi ve ark. — Real-Time Single Image and Video Super-Resolution Using an Efficient Sub-Pixel CNN (CVPR 2016)", url: "https://arxiv.org/abs/1609.05158", license: "arXiv", use: link}
  - {title: "Yu & Koltun — Multi-Scale Context Aggregation by Dilated Convolutions (ICLR 2016)", url: "https://arxiv.org/abs/1511.07122", license: "arXiv", use: link}
  - {title: "Wang ve ark. — Understanding Convolution for Semantic Segmentation (HDC, WACV 2018)", url: "https://arxiv.org/abs/1702.08502", license: "arXiv", use: link}
  - {title: "d2l.ai — 14.10 Transposed Convolution, 14.11 FCN", url: "https://d2l.ai/chapter_computer-vision/transposed-conv.html", license: "CC-BY-SA 4.0", use: link}

hand:
  groups:
    - title: "Transposed convolution"
      fields:
        - {id: osz, label: "Girdi 7 × 7, k = 4, s = 2, p = 1: çıkış kenarı", answer: 14}
        - {id: o4, label: "1B: x = [1, 2, 3], w = [1, 2, 1], s = 2, p = 0 → çıkışın 4. indeksi (0'dan)", answer: 5}
        - {id: zl, label: "Aynı işlem 'sıfır ekle + normal konv.' olarak: sıfır eklenip dolgulanmış girdinin uzunluğu", answer: 9}
        - {id: cb, label: "2B, k = 3, s = 2: iç bölgede bir çıkış pikseline katkı yapan girdi sayısının en büyüğü / en küçüğü", answer: 4}
        - {id: bil, label: "2× bilineer yukarı örnekleme çekirdeği (k = 4) merkezdeki ağırlık", answer: 0.5625, tol: 1.0e-9}
    - title: "U-Net ve ölçütler"
      fields:
        - {id: unet, label: "Özgün U-Net (valid 3×3 konv. ×2 her seviyede, 4 havuz, 2×2 yukarı konv.): 572 × 572 girdi → çıkış kenarı", answer: 388}
        - {id: iou, label: "Tahmin 6 piksel, gerçek 5 piksel, kesişim 4: IoU", answer: 0.5714285714285714, tol: 1.0e-6}
        - {id: dice, label: "Aynı örnek: Dice", answer: 0.7272727272727273, tol: 1.0e-6}
  verify: |
    o = [0] * 7
    for i, xv in enumerate([1, 2, 3]):
        for u, wv in enumerate([1, 2, 1]):
            o[2 * i + u] += xv * wv
    cnt = [0] * 21
    for i in range(10):
        for u in range(3):
            cnt[2 * i + u] += 1
    inner = cnt[4:16]
    h = 572
    for _ in range(4):
        h = (h - 4) // 2
    h -= 4
    for _ in range(4):
        h = h * 2 - 4
    answers = dict(osz=(7 - 1) * 2 - 2 + 4, o4=o[4], zl=(3 - 1) * 2 + 1 + 2 * (3 - 1), cb=max(inner) ** 2 // min(inner) ** 2,
                   bil=0.75 * 0.75, unet=h, iou=4 / 7, dice=2 * 4 / (6 + 5))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

extras:
  - {id: x1, title: "Alt-piksel konvolüsyonu (PixelShuffle) = transposed conv", engine: browser}
  - {id: x2, title: "Genişletilmiş (dilated) konvolüsyon ve ızgaralanma", engine: browser}
  - {id: x3, title: "Anlamsaldan örneğe: bağlantılı bileşenler", engine: browser}

quiz:
  - q: "Transposed convolution'da adım (stride) 2 ne anlama gelir?"
    options:
      - {t: "Girdinin ne kadar 'gerileceği': elemanlar arasına s − 1 sıfır eklenip normal konvolüsyon yapılır; adım büyüdükçe çıkış büyür (kesirli adım 1/s)", ok: true, why: "Géron: konvolüsyonun tersine, stride çıktıyı büyütür."}
      - {t: "Filtrenin iki piksel atlaması: çıkış yarıya iner", why: "Bu normal konvolüsyon."}
      - {t: "Çekirdeğin iki kez uygulanması", why: "Hayır."}
  - q: "U-Net'in kopyalama (skip) bağlantıları hangi sorunu çözer?"
    options:
      - {t: "Kodlayıcının havuzlamalarla kaybettiği ince uzamsal ayrıntıyı (kenarlar) kod çözücüye doğrudan taşır; kod çözücü 'ne' bilgisini derin katmandan, 'nerede' bilgisini sığ katmandan alır", ok: true, why: "d aşamasında kenar doğruluğu farkı tam bunu ölçer."}
      - {t: "Gradyan patlamasını", why: "Asıl amaç çözünürlük."}
      - {t: "Parametre sayısını azaltmayı", why: "Birleştirme parametreyi artırır."}
  - q: "k = 3, s = 2'lik transposed convolution neden dama tahtası artefaktı üretir?"
    options:
      - {t: "Çekirdek boyutu adıma bölünmediği için çıkış pikselleri eşit olmayan sayıda katkı alır (1, 2, 4): düzensiz örtüşme", ok: true, why: "Odena ve ark.: k'yı s'nin katı seç ya da 'yeniden boyutlandır + konv.' kullan."}
      - {t: "Bilineer başlatma yapılmadığı için", why: "Başlatma yapısal örtüşmeyi değiştirmez."}
      - {t: "ReLU'dan dolayı", why: "Doğrusal katmanın kendisinde."}

homework:
  - title: "Long, Shelhamer, Darrell (2015): FCN-32s/16s/8s"
    paper: "Long, Shelhamer, Darrell — Fully Convolutional Networks for Semantic Segmentation (CVPR 2015)"
    url: "https://arxiv.org/abs/1411.4038"
    level: orta
    hours: 12
    goal: |
      Önceden eğitilmiş bir VGG-16'nın yoğun katmanlarını konvolüsyona çevir (fc6 → 7 × 7 konv., fc7 → 1 × 1; ağırlıkları yeniden şekillendirerek, M4.9 x1), PASCAL VOC 2012'nin küçük bir alt kümesinde FCN-32s, ardından 16s ve 8s'i makaledeki aşamalı ince ayar düzeninde eğit; Tablo 2'deki gibi piksel doğruluğu, ortalama doğruluk, mIoU ve frekans ağırlıklı IoU raporla. Yukarı örnekleme katmanlarını bilineer başlat; donuk bilineer ile öğrenilebiliri karşılaştır.
    steps:
      - "c aşamasındaki bilinear_kernel ve confusion/miou'yu kullan."
    accept:
      - "FCN-8s, FCN-32s'ten mIoU'da belirgin iyi."
      - "Öğrenilebilir yukarı örnekleme ile donuk bilineer arasındaki fark küçük (makaleyle uyumlu)."
  - title: "Ronneberger ve ark. (2015): U-Net ve ağırlık haritası"
    paper: "Ronneberger, Fischer, Brox — U-Net: Convolutional Networks for Biomedical Image Segmentation (MICCAI 2015)"
    url: "https://arxiv.org/abs/1505.04597"
    level: orta
    hours: 12
    goal: |
      Valid konvolüsyonlu özgün U-Net'i (572 → 388) ve döşemeli (overlap-tile) çıkarımı uygula; sentetik "birbirine değen hücreler" veri setinde (x3'teki gibi) makaledeki Denk. (2) ağırlık haritasıyla — $w(x)=w_c(x)+w_0\,e^{-(d_1+d_2)^2/2\sigma^2}$, $w_0=10$, $\sigma\approx5$ — ve onsuz eğit. Ayırma çizgilerinin doğru öğrenildiğini örnek sayısı (bağlantılı bileşen) üzerinden ölç; elastik deformasyon artırmasını ekle.
    steps:
      - "$d_1$, $d_2$: her piksel için en yakın ve ikinci en yakın hücrenin sınırına uzaklık."
    accept:
      - "Ağırlık haritasıyla değen hücreler ayrı örnekler olarak çıkar; onsuz birleşir."
      - "Döşemeli çıkarım, tek parça çıkarımla kenarlarda aynı sonucu verir."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Transposed convolution'ın çıkış boyu
    goal: Formülü konvolüsyonun tersinden türetmek
    needs: M4.1 P1
    q: |-
      Adımı $s$, çekirdeği $k$, dolgusu $p$ olan transposed convolution'ın çıkış boyunu türet; $n=16$, $s=2$, $k=4$, $p=1$ için hesapla.
    solution: |-
      Transposed conv, aynı parametreli konvolüsyonun **geri geçişidir** (gradyanını alır): konvolüsyon $m\to n$ ise transposed $n\to m$. Konvolüsyon: $n=\lfloor(m+2p-k)/s\rfloor+1$. Bölme tam iken $m$'yi çöz: $m=(n-1)s-2p+k$.

      $n=16$: $(15)\cdot2-2+4=32$ — tam iki kat. **Belirsizlik:** taban fonksiyonu yüzünden birden çok $m$ aynı $n$'yi verebilir; PyTorch'ta `output_padding` bunu seçer.

      **Dama tahtası artefaktı:** $k$, $s$'nin katı değilse (ör. $k=3$, $s=2$) çıkış pikselleri farklı sayıda katkı alır → düzenli desen. Çare: $k$'yı $s$'nin katı seç ya da "yukarı örnekle + konvolüsyon" kullan (Odena ve ark. 2016).
  - id: p2
    type: hesap
    level: 1
    title: Çıkış boyu
    goal: Formülü uygulamak
    needs: P1
    q: |-
      Transposed conv: $n=7$, $s=2$, $k=3$, $p=1$, output_padding 0. Çıkış boyu?
    answer: 13.0
    calc: "(7-1)*2-2+3"
    mistakes:
      - {answer: 14.0, msg: "Çıkış tam 2n olmayabilir: (n − 1)s − 2p + k."}
    hints:
      - "$(n-1)s-2p+k$."
    solution: |-
      $12-2+3=13$; 14 istiyorsan `output_padding=1`.
  - id: p3
    type: hesap
    level: 1
    title: IoU'dan Dice'a
    goal: İki örtüşme ölçütünü birbirine çevirmek
    needs: Küme kesişimi
    q: |-
      Bir maskenin IoU'su 0.5. Dice?
    answer: 0.6666666666666666
    calc: "2*0.5/(1+0.5)"
    tol: 1e-4
    mistakes:
      - {answer: 0.5, msg: "Dice ve IoU farklıdır: Dice = 2·IoU/(1 + IoU) ≥ IoU."}
    hints:
      - "Dice $=\\frac{2|A\\cap B|}{|A|+|B|}$, $|A|+|B|=|A\\cup B|+|A\\cap B|$."
    solution: |-
      $\frac{2\cdot0.5}{1.5}=0.667$. Dice her zaman IoU'dan büyük ya da eşit; ölçütleri karıştırma.
  - id: p4
    type: yöntem-seç
    level: 2
    title: Küçük nesneler kayboluyor
    goal: Atlama bağlantısının rolünü değerlendirmek
    needs: U-Net
    q: |-
      FCN-32s ile segmentasyonda büyük bölgeler doğru, ince yapılar (direk, tel) kaybolmuş. En etkili mimari değişiklik?
    choices:
      - {t: "Daha derin kodlayıcı", why: "Toplam adımı ve dolayısıyla ayrıntı kaybını artırır."}
      - {t: "Kodlayıcının yüksek çözünürlüklü haritalarını kod çözücüye atlama bağlantılarıyla taşımak (FCN-8s, U-Net) ya da genişletilmiş konvolüsyonla adımı küçük tutmak", ok: true, why: "İnce konum bilgisi yüksek çözünürlüklü katmanlardadır."}
      - {t: "Daha büyük batch", why: "Çözünürlük kaybını etkilemez."}
    hints:
      - "32 kat küçültülmüş bir haritada 2 piksellik bir tel nerede?"
    solution: |-
      Toplam adım 32 ise 32 pikselden ince yapılar en derin haritada temsil edilemez. Atlama bağlantıları yerel ayrıntıyı (nerede) derin anlamla (ne) birleştirir; genişletilmiş konvolüsyon (DeepLab) alıcı alanı büyütürken çözünürlüğü korur.
  - id: p5
    type: karşı-örnek
    level: 3
    title: Piksel doğruluğu yanıltır
    goal: Segmentasyon ölçütünü sınıf dengesizliğine göre seçmek
    needs: P3
    q: |-
      Piksel doğruluğu %95 olan ama işe yaramayan bir segmentasyon modeli örneği ver. Hangi ölçüt bunu yakalar?
    rubric:
      - "Arka planın %95 olduğu, modelin her şeye 'arka plan' dediği örneği verdim"
      - "Sınıf başına IoU ve ortalaması (mIoU) ya da Dice'ın bunu yakaladığını söyledim"
      - "Sınıf ağırlıklandırma / Dice kaybı (M8.2 x1) bağlantısını kurdum"
    hints:
      - "Piksellerin çoğu hangi sınıf?"
    solution: |-
      Tümör pikselleri %5: her şeye "arka plan" diyen model %95 piksel doğruluğu alır, tümör IoU'su 0. mIoU her sınıfı eşit ağırlıkla ortalar (bu model için ~0.47); Dice/IoU ön plan sınıfı için 0. Eğitimde de BCE yerine Dice ya da ağırlıklı kayıp gerekir.
pitfalls:
  - wrong: "Transposed convolution konvolüsyonun matematiksel tersidir."
    right: "Tersi değil, transpozudur (geri geçişi): boyutu geri getirir, değerleri değil."
  - wrong: "Örnek (instance) segmentasyon, anlamsal segmentasyonun aynısıdır."
    right: "Anlamsal segmentasyon aynı sınıftaki iki nesneyi ayırt etmez; örnek segmentasyon her nesneye ayrı maske verir (Mask R-CNN)."
whatif:
  - q: "Kod çözücüde transposed conv yerine çift doğrusal yukarı örnekleme + 3 × 3 konv kullanılırsa?"
    a: "Dama tahtası artefaktı kaybolur, parametre sayısı benzer; çoğu modern U-Net bunu kullanır (M8.2 U-Net'i de öyle)."

labs:
  - id: l1
    lab: tconv1d
    title: "Transposed convolution'ın üç yüzü, sayısal olarak"
    goal: |
      Aynı 1-B transposed convolution'ı üç yoldan hesapla ve sonuçların eşit olduğunu doğrula: (1) her girdi örneği çekirdeği kendisiyle ölçekleyip çıkışa saçar, (2) girdiye $s-1$ sıfır ekle, $k-1-p$ dolgula, ters çevrilmiş çekirdekle normal konvolüsyon yap, (3) aynı ayarlı normal konvolüsyonun matrisinin devriği $C^\top$. Her çıkış konumuna kaç girdinin katkı yaptığını say: $k$, $s$'nin katı değilse dama tahtası.
    predict:
      q: "Girdi sabit (hepsi 1), çekirdek düz (hepsi 1), k = 3, s = 2: iç bölgede çıkış neye benzer?"
      options:
        - {t: "Sabit", why: "Bazı konumlara iki girdinin çekirdeği düşüyor, bazılarına bir."}
        - {t: "1, 2, 1, 2, … dönüşümlü", ok: true, why: "k/s = 1.5: çıkış konumlarına dönüşümlü 2 ve 1 katkı düşer. Dama tahtası artefaktının 1-B hâli."}
        - {t: "Kenarlara doğru artan", why: "Kenarlarda katkı daha az, ama iç bölge periyodik."}
    presets:
      - {name: "El hesabı", params: {n: 3, k: 3, s: 2, p: 0, op: 0, ker: 1, inp: 1}, note: "x = [1, 2, 3], w = [1, 1, 1]: çıkış [1, 1, 3, 2, 5, 3, 3]. (El hesabı alanındaki w = [1, 2, 1] ile 4. indeks 5.)"}
      - {name: "Dama tahtası", params: {n: 8, k: 3, s: 2, p: 0, ker: 1, inp: 0}, note: "k = 3, s = 2: 2-1-2-1 deseni."}
      - {name: "Bilineer 2× (k = 4)", params: {n: 8, k: 4, s: 2, p: 1, ker: 0, inp: 0}, note: "k = 2s, p = s/2: iç bölgede sabit girdi sabit kalır — kusursuz 2× bilineer interpolasyon."}
      - {name: "output_padding", params: {n: 5, k: 3, s: 2, p: 1, op: 1, ker: 2, inp: 2}, note: "Adım 2'li konvolüsyon 10 ve 9 uzunluğu aynı 5'e indirir; ters yönde hangisinin isteneceğini output_padding seçer."}
      - {name: "Adım 1", params: {n: 6, k: 3, s: 1, p: 0, ker: 2, inp: 2}, note: "Tam dolgulu normal konvolüsyon: boyut k − 1 büyür."}
    questions:
      - q: "Çıkış boyu formülünü (n − 1)s − 2p + k saçma görünümünden türet."
        a: "Son girdi örneği (indeks n − 1) çekirdeği (n − 1)s konumundan başlatır ve k uzunluğunda yayar: tam çıkış (n − 1)s + k. Dolgu p, normal konvolüsyonda girdiye eklenen p'nin karşılığı olarak çıkışın iki ucundan kırpılır: −2p."
      - q: "Neden 'dekonvolüsyon' adı yanlıştır?"
        a: "Dekonvolüsyon, bir konvolüsyonun etkisini geri almak (ters işlem) demektir. Transposed conv tersini değil devriğini uygular: CᵀC ≠ I. Yalnız boyutları (ve bağlantı desenini) tersine çevirir."
    limits: "1-B, tek kanal, bias yok, genişletme (dilation) yok. 2-B'de her eksen ayrı ayrı aynı kuralla çalışır; katkı sayıları çarpılır."
  - id: l2
    lab: upsample2d
    title: "Büyütme yöntemleri ve dama tahtası artefaktı"
    goal: |
      Düşük çözünürlüklü bir görüntüyü f kat büyüt: en yakın komşu, bilineer interpolasyon, bilineer çekirdekle başlatılmış transposed conv ve çekirdek boyu adıma bölünmeyen bir transposed conv. Gerçek yüksek çözünürlüklü görüntüye göre hatayı ölç; dama tahtası desenini gör.
    predict:
      q: "Bilineer çekirdekli transposed conv (k = 2f, s = f, p = f/2) bilineer interpolasyondan nerede farklıdır?"
      options:
        - {t: "Her yerde biraz", why: "İç bölgede ağırlıklar bilineer interpolasyonun ağırlıklarıyla aynı."}
        - {t: "Yalnız görüntünün en dış kenarında", ok: true, why: "Kenarda saçılan katkılardan biri eksik kalır (görüntü dışı sıfır sayılır); F.interpolate kenar pikselini tekrarlar."}
        - {t: "Hiçbir yerde", why: "RMSE'lerin tüm görüntü ve iç bölge için farkına bak."}
    presets:
      - {name: "Dama tahtası (f = 4)", params: {scene: 0, n: 8, f: 1, m: 3}, note: "k = 5, s = 4: ızgara biçiminde parlak çizgiler."}
      - {name: "Bilineer conv = interpolasyon", params: {scene: 2, n: 8, f: 1, m: 2}, note: "İç bölgede RMSE interpolasyonla aynı; kenar şeridi koyu."}
      - {name: "En yakın komşu", params: {scene: 1, n: 8, f: 2, m: 0}, note: "8 kat büyütmede basamaklar."}
      - {name: "Büyük çarpan", params: {scene: 0, n: 6, f: 2, m: 1}, note: "Bilineer interpolasyon ×8'de çok bulanık: slayttaki '×4–×8'e kadar iş görür' gözlemi."}
    questions:
      - q: "Dama tahtasından kaçınmak için iki tasarım seçeneği söyle."
        a: "(1) Çekirdek boyunu adımın katı seç (k = 2s gibi); (2) önce en yakın komşu ya da bilineer interpolasyonla büyütüp sonra normal bir konvolüsyon uygula (resize-conv). Alt-piksel konvolüsyonu (PixelShuffle) da uygun başlatmayla (ICNR) artefaktı azaltır."
    limits: "Tek kanal, sabit (öğrenilmemiş) çekirdekler; gerçek görüntü yerine analitik sahneler. Öğrenilen yukarı örnekleme katmanları ayrıntıyı atlama bağlantılarından da alır."
  - id: l3
    lab: segmetrics
    title: "Piksel doğruluğu, IoU, mIoU, Dice: aynı tahmin, farklı sayılar"
    goal: |
      Gerçek maske bir disk; tahmin kaydırılmış, ölçeklenmiş ve sınırı gürültülü bir disk. Dört ölçütü birlikte hesapla; nesne küçüldükçe piksel doğruluğunun neden anlamsızlaştığını ve Dice ile IoU'nun neden aynı sıralamayı verdiğini gör.
    predict:
      q: "64 × 64 görüntüde yarıçapı 3 piksel olan bir nesne, 4 piksel kaydırılarak tahmin ediliyor. Piksel doğruluğu ve IoU yaklaşık kaç?"
      options:
        - {t: "Doğruluk ≈ %50, IoU ≈ 0.5", why: "Nesne görüntünün %1'inden az; arka plan pikselleri doğruluğu yukarı çeker."}
        - {t: "Doğruluk ≈ %99, IoU ≈ 0.15", ok: true, why: "Yanlış piksellerin sayısı görüntüye göre çok az, ama nesneye göre çok fazla."}
        - {t: "Doğruluk ≈ %99, IoU ≈ 0.9", why: "4 piksellik kayma, 6 piksel çaplı bir nesneyi neredeyse ıskalatır."}
    presets:
      - {name: "Küçük nesne, küçük kayma", params: {R: 3, dx: 4, sc: 1, noise: 0}, note: "Doğruluk %98.8, IoU 0.14."}
      - {name: "Büyük nesne, aynı kayma", params: {R: 20, dx: 4, sc: 1, noise: 0}, note: "Aynı 4 piksel, IoU ≈ 0.78."}
      - {name: "Aşırı büyük tahmin", params: {R: 10, dx: 0, sc: 1.6, noise: 0}, note: "Gerçek nesnenin hepsi kapsanıyor (FN = 0) ama FP çok: IoU = 1/1.6² ≈ 0.39."}
      - {name: "Pürüzlü sınır", params: {R: 15, dx: 0, sc: 1, noise: 0.4}, note: "Merkez ve boyut doğru, sınır gürültüsü IoU'yu düşürüyor."}
    questions:
      - q: "Dice = 2J/(1 + J) eşitliğini türet."
        a: "a = TP, b = FP + FN dersek J = a/(a + b), D = 2a/(2a + b). b = a(1 − J)/J yerine konursa D = 2J/(2J + 1 − J) = 2J/(1 + J). Tekdüze artan bir fonksiyon: iki tahmini sıralarken aynı sonucu verirler, ama ortalamaları farklı sıralayabilir."
      - q: "mIoU neden sınıf sayısı arttıkça ön plan başarısını daha iyi yansıtır?"
        a: "mIoU tüm sınıfların IoU'sunun eşit ağırlıklı ortalamasıdır. İki sınıfta yüksek arka plan IoU'su ortalamanın yarısıdır; 21 sınıfta (VOC) yalnız 1/21'i. Ayrıca mIoU genelde tüm görüntüler üzerinde biriktirilmiş TP/FP/FN'den hesaplanır, görüntü başına değil."
    limits: "İki sınıf, tek görüntü, sentetik disk maskeler. Gerçek değerlendirmede ölçüler veri kümesi boyunca biriktirilir ve 'yok sayılan' (ignore) piksel etiketleri vardır."
