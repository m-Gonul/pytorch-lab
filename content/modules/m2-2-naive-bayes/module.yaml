id: m2-2-naive-bayes
code: M2.2
title: Naive Bayes
phase: 2
minutes: 180
prereq: [m0-4-probability]
summary: >
  Sayarak öğrenen sınıflandırıcı. Altı satırlık bir tabloda posterior'u
  Laplace düzeltmesiyle ve düzeltmesiz elle hesaplıyor; saf Python'da
  kategorik Naive Bayes yazıyor; NumPy'da Gaussian NB'yi, pandas'ta olasılık
  tablolarını döngüsüz kuruyor; PyTorch'ta metin için multinomial NB eğitiyor
  ve en sonda 20 farklı α değerini tek tensörle değerlendiriyorsun.
goals:
  - "Bayes kuralını ve [[naive bayes|koşullu bağımsızlık]] varsayımını $p(y\\mid x)\\propto p(y)\\prod_j p(x_j\\mid y)$ olarak uygulamak"
  - "Sıfır sayımın tüm posterior'u neden öldürdüğünü ve [[laplace düzeltmesi|Laplace düzeltmesinin]] bunu nasıl çözdüğünü göstermek"
  - "Olasılık çarpımlarını log uzayında toplayıp logsumexp ile normalize etmek"
  - "Sayım tabanlı bir modelin parametrelerini tek bir one-hot matris çarpımıyla hesaplamak"
sources:
  - {title: "Stanford CS229 — Lecture notes: Generative learning algorithms, Naive Bayes", url: "https://cs229.stanford.edu/main_notes.pdf", license: "doğrulanmadı", use: link}
  - {title: "Murphy — PML1 §9.3 Naive Bayes classifiers", url: "https://probml.github.io/pml-book/book1.html", license: "CC BY-NC-ND", use: link}
  - {title: "scikit-learn User Guide — Naive Bayes", url: "https://scikit-learn.org/stable/modules/naive_bayes.html", license: "BSD-3", use: link}
  - {title: "Manning, Raghavan, Schütze — IR Book, Bölüm 13 (multinomial NB)", url: "https://nlp.stanford.edu/IR-book/html/htmledition/naive-bayes-text-classification-1.html", license: "©", use: link}

hand:
  groups:
    - title: "Tablo (hava, rüzgâr → oyna): (güneş, zayıf, E), (güneş, güçlü, E), (yağmur, güçlü, H), (yağmur, zayıf, E), (güneş, güçlü, H), (yağmur, güçlü, H). Sorgu: (güneş, güçlü)"
      fields:
        - {id: prior, label: "$P(E)$", answer: 0.5, tol: 0.001, hint: "6 satırın 3'ü E"}
        - {id: sunE, label: "$P(\\text{güneş}\\mid E)$", answer: 0.666667, tol: 0.002, hint: "3 E'nin 2'si güneşli"}
        - {id: strE, label: "$P(\\text{güçlü}\\mid E)$", answer: 0.333333, tol: 0.002, hint: "3 E'nin 1'i güçlü rüzgârlı"}
        - {id: strH, label: "$P(\\text{güçlü}\\mid H)$", answer: 1, tol: 0.001, hint: "3 H'nin 3'ü"}
        - {id: post, label: "$P(E\\mid \\text{güneş},\\text{güçlü})$", answer: 0.4, tol: 0.002, hint: "skorlar $0.5\\cdot\\frac23\\cdot\\frac13=\\frac19$ ve $0.5\\cdot\\frac13\\cdot1=\\frac16$; normalize et"}
    - title: "Sıfır sayım ve Laplace ($\\alpha=1$, her özellik 2 değerli): $\\frac{\\#+\\alpha}{N_c+2\\alpha}$"
      fields:
        - {id: zero, label: "Düzeltmesiz $P(\\text{zayıf}\\mid H)$", answer: 0, tol: 0.0001, hint: "H'lerde zayıf rüzgâr hiç yok → (yağmur, zayıf) sorgusunda H skoru tam 0"}
        - {id: lstrH, label: "Laplace $P(\\text{güçlü}\\mid H)$", answer: 0.8, tol: 0.001, hint: "$(3+1)/(3+2)$"}
        - {id: lpost, label: "Laplace ile $P(E\\mid\\text{güneş},\\text{güçlü})$", answer: 0.428571, tol: 0.002, hint: "E: $0.5\\cdot0.6\\cdot0.4=0.12$; H: $0.5\\cdot0.4\\cdot0.8=0.16$"}
  verify: |
    rows = [("g", "z", "E"), ("g", "s", "E"), ("y", "s", "H"), ("y", "z", "E"), ("g", "s", "H"), ("y", "s", "H")]
    def P(f, v, c, a=0):
        sub = [r for r in rows if r[2] == c]
        return (sum(r[f] == v for r in sub) + a) / (len(sub) + 2 * a)
    pE = sum(r[2] == "E" for r in rows) / 6
    sE, sH = pE * P(0, "g", "E") * P(1, "s", "E"), (1 - pE) * P(0, "g", "H") * P(1, "s", "H")
    lE, lH = pE * P(0, "g", "E", 1) * P(1, "s", "E", 1), (1 - pE) * P(0, "g", "H", 1) * P(1, "s", "H", 1)
    answers = dict(prior=pE, sunE=round(P(0, "g", "E"), 6), strE=round(P(1, "s", "E"), 6), strH=P(1, "s", "H"),
                   post=round(sE / (sE + sH), 6), zero=P(1, "z", "H"), lstrH=P(1, "s", "H", 1), lpost=round(lE / (lE + lH), 6))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Naive Bayes'in \"naive\" varsayımı yanlış olsa bile neden sıklıkla iyi sınıflandırır?"
    options:
      - {t: "Sınıflandırma için yalnız argmax'ın doğru olması gerekir; olasılıklar kötü kalibre olsa da sıralama çoğu zaman korunur", ok: true, why: "Bağımlı özellikler kanıtı çift sayar ve olasılıkları uçlara iter (0 ya da 1'e yakın), ama karar sınırı çoğu zaman makul kalır."}
      - {t: "Varsayım pratikte hep doğrudur", why: "Metinde kelimeler, görüntüde pikseller açıkça bağımlıdır."}
      - {t: "Laplace düzeltmesi bağımlılığı giderir", why: "Laplace yalnız sıfır sayımları düzeltir."}
  - q: "Multinomial NB'de log-olasılıkları toplamanın matris karşılığı nedir?"
    options:
      - {t: "Sayım matrisi $X\\,(n\\times V)$ çarpı $\\log\\theta^\\top\\,(V\\times C)$, artı log-prior: lineer bir sınıflandırıcı", ok: true, why: "$\\log p(y=c\\mid x)=\\log\\pi_c+\\sum_v x_v\\log\\theta_{cv}+\\text{sabit}$. NB, ağırlıkları sayılardan hesaplanan bir lineer modeldir."}
      - {t: "Eleman eleman çarpım", why: "Kelime sayıları log-olasılıklarla ağırlıklandırılıp toplanır: bu bir iç çarpım."}
      - {t: "Matris karşılığı yoktur", why: "Tam bir matris çarpımıdır; e aşamasında bunu kullanıyorsun."}

homework:
  - title: "Ng & Jordan (2001): ayırt edici ve üretken sınıflandırıcılar"
    paper: "Ng & Jordan — On Discriminative vs. Generative Classifiers: A comparison of logistic regression and naive Bayes (NeurIPS 2001)"
    url: "https://ai.stanford.edu/~ang/papers/nips01-discriminativegenerative.pdf"
    level: orta
    hours: 6
    goal: |
      Makalenin Şekil 1'ini tekrarla: birkaç UCI veri setinde (sklearn'ün yerleşik kümeleri) eğitim örneği sayısına göre naive Bayes ve lojistik regresyonun test hatası eğrilerini çiz. Kuramsal iddiayı doğrula: NB asimptotik hatasına O(log d) örnekle, LR O(d) örnekle yaklaşır; az veride NB önde, çok veride LR. NB'nin bağımsızlık varsayımını bilerek bozan sentetik bir problemde asimptotik farkın büyüdüğünü göster.
    steps:
      - "Her eğitim boyutunda 20 rastgele alt örnekle ortalama al."
    accept:
      - "Eğriler kesişir: az veride NB, çok veride LR daha iyi."
      - "Varsayım ihlalinde LR'nin asimptotik üstünlüğü artar."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: İstenmeyen e-posta, sayılarla
    goal: Önsel, olabilirlik ve posterior'u bir örnekte birleştirmek
    needs: Bayes kuralı, intro'daki türetim kutusu
    q: |-
      E-postaların %40'ı istenmeyen (S). "bedava" kelimesi S'lerin %20'sinde, normal (N) e-postaların %2'sinde geçiyor; "toplantı" S'lerin %1'inde, N'lerin %10'unda. İkisini de içeren bir e-posta için $P(S\mid x)$?
    solution: |-
      **Koşullu bağımsızlık varsayımıyla:** $P(x\mid S)=0.20\cdot0.01=0.002$, $P(x\mid N)=0.02\cdot0.10=0.002$.

      **Pay:** $P(S)P(x\mid S)=0.4\cdot0.002=0.0008$; $P(N)P(x\mid N)=0.6\cdot0.002=0.0012$.

      **Normalize:** $P(S\mid x)=\frac{0.0008}{0.0008+0.0012}=0.4$. İki kelimenin kanıtları birbirini tam götürdü (biri S yönünde 10 kat, diğeri N yönünde 10 kat), geriye önsel kaldı.

      **Log-oran biçimi** (daha sağlam ve okunur): $\log\frac{P(S|x)}{P(N|x)}=\log\frac{0.4}{0.6}+\log\frac{0.20}{0.02}+\log\frac{0.01}{0.10}=\log\frac23+\log10-\log10$. Her kelime log-orana **toplamsal** bir katkı yapar — Naive Bayes doğrusal bir sınıflandırıcıdır (P7).
  - id: p2
    type: hesap
    level: 1
    title: Laplace düzeltmesi
    goal: Sıfır sayımı düzeltmek
    needs: Intro'daki türetim kutusu
    q: |-
      Bir sınıfta toplam 8 kelime sayıldı, sözlükte 4 kelime var, bir kelime bu sınıfta hiç görülmedi. α = 1 ile o kelimenin olasılığı?
    answer: 0.08333333333333333
    calc: "(0+1)/(8+1*4)"
    tol: 1e-4
    mistakes:
      - {answer: 0.0, msg: "Düzeltmesiz tahmin; tek bir görülmemiş kelime tüm çarpımı sıfırlar."}
      - {answer: 0.1111111111111111, msg: "Paydaya α yerine α·V (her kelimeye 1 eklendi: 4) eklenmeli."}
    hints:
      - "$\\frac{n+\\alpha}{N+\\alpha V}$."
    solution: |-
      $\frac{0+1}{8+4}=\frac1{12}=0.0833$. Diğer kelimelerin olasılıkları da aynı paydayla küçülür; toplam yine 1.
  - id: p3
    type: hesap
    level: 1
    title: Posterior
    goal: Bayes kuralını uygulamak
    needs: P1
    q: |-
      $P(S)=0.4$, $P(x\mid S)=0.05$, $P(x\mid N)=0.01$. $P(S\mid x)$?
    answer: 0.7692307692307693
    calc: "0.4*0.05/(0.4*0.05+0.6*0.01)"
    tol: 1e-3
    mistakes:
      - {answer: 0.05, msg: "Bu olabilirlik P(x | S); posterior için önsel ve normalizasyon gerekir."}
      - {answer: 0.020000000000000004, msg: "Bu pay; P(x)'e (iki sınıfın toplamı) böl."}
    hints:
      - "Payda $P(x)=0.4\\cdot0.05+0.6\\cdot0.01$."
    solution: |-
      $\frac{0.02}{0.02+0.006}=0.769$.
  - id: p4
    type: hata-bul
    level: 2
    title: Uzun belgelerde hep aynı sınıf
    goal: Alttan taşmayı fark etmek
    needs: Kayan nokta
    q: |-
      ```python
      score[c] = prior[c] * np.prod(p_word[c, words])
      ```
      500 kelimelik belgelerde her sınıfın skoru 0 çıkıyor ve argmax hep 0. sınıfı veriyor. Düzeltme?
    choices:
      - {t: "float32 yerine float64", why: "0.01⁵⁰⁰ = 10⁻¹⁰⁰⁰, float64'ün alt sınırı (~10⁻³⁰⁸) da yetmez."}
      - {t: "Log uzayında topla: `log(prior[c]) + np.log(p_word[c, words]).sum()`", ok: true, why: "Toplam alttan taşmaz; argmax log altında değişmez."}
      - {t: "Laplace α'yı büyüt", why: "Sıfır olasılığı çözer, alttan taşmayı değil."}
    hints:
      - "500 tane 0.01'in çarpımı kaçtır?"
    solution: |-
      Olasılık çarpımı alttan taşar; log monoton olduğu için sınıflandırma log-toplamla aynı kalır. Olasılık gerekiyorsa log-sum-exp ile normalize et (M1.5).
  - id: p5
    type: açıkla
    level: 2
    title: Yanlış varsayım, iyi sınıflandırıcı
    goal: Sınıflandırma ile olasılık kestirimini ayırmak
    needs: P1
    q: |-
      Kelimeler açıkça bağımsız değil ("New" ve "York"). Naive Bayes yine de metin sınıflandırmada neden çoğu zaman iyi çalışır ve neyi kötü yapar?
    rubric:
      - "Sınıflandırma için yalnız argmax'ın doğru olmasının yettiğini söyledim"
      - "İlişkili kanıtın çift sayılmasının olasılıkları uçlara ittiğini (kötü kalibrasyon) açıkladım"
      - "Az veriyle düşük varyanslı (az parametre) olduğunu, yanlılık–varyans dengesine değindim"
      - "Ayırıcı bir modelle (lojistik regresyon) karşılaştırdım: çok veride genelde LR kazanır (Ng & Jordan 2002)"
    hints:
      - "Çift sayılan kanıt, doğru sınıfın sırasını mı değiştirir yoksa yalnız güveni mi?"
    solution: |-
      Hedef $\arg\max_yP(y|x)$; olasılıklar yanlış ölçekli olsa da sıralama çoğu zaman korunur (Domingos & Pazzani 1997). İlişkili kelimeler aynı kanıtı iki kez ekler: posterior'lar 0/1'e yığılır (kalibrasyon kötü). Parametre sayısı az olduğu için az veride hızla yakınsar; çok veride ayırıcı modeller (LR) daha düşük asimptotik hata verir.
  - id: p6
    type: yöntem-seç
    level: 2
    title: Hangi Naive Bayes?
    goal: Olabilirlik ailesini veriye göre seçmek
    needs: Dağılımlar
    q: |-
      Belgeler kelime **sayımlarıyla** temsil ediliyor (bir kelime belgede birçok kez geçebilir). Gaussian, Bernoulli, multinomial?
    choices:
      - {t: "Gaussian NB", why: "Sayımlar negatif olmayan tamsayı ve çok çarpık; Gauss uygun değil."}
      - {t: "Bernoulli NB", why: "Yalnız var/yok bilgisini kullanır; sayımları atar (kısa metinlerde yine de iyi olabilir)."}
      - {t: "Multinomial NB", ok: true, why: "Belge, sınıfa özgü bir kelime dağılımından bağımsız çekilişler dizisi olarak modellenir."}
    hints:
      - "Verinin türü: sürekli mi, ikili mi, sayım mı?"
    solution: |-
      Sayım → multinomial; ikili var/yok → Bernoulli (görülmeyen kelimeleri de kanıt sayar); sürekli öznitelik → Gaussian. TF-IDF ağırlıkları sürekli olsa da pratikte multinomial ile iyi çalışır (Rennie ve ark. 2003).
  - id: p7
    type: kanıt
    level: 3
    title: Ortak varyanslı Gaussian NB doğrusal sınıflandırıcıdır
    goal: Üretken ve ayırıcı modeller arasındaki bağı kurmak
    needs: Gauss log-yoğunluğu, M1.4
    q: |-
      İki sınıf, her öznitelik için sınıflardan bağımsız varyans $\sigma_j^2$ ve sınıfa bağlı ortalama $\mu_{yj}$. $\log\frac{P(1|x)}{P(0|x)}$'in $x$'te doğrusal olduğunu göster ve $w_j$'yi yaz.
    rubric:
      - "Log-orantıyı önsel oranı + öznitelik başına log-olabilirlik oranları toplamı olarak yazdım"
      - "$x_j^2$ terimlerinin ortak varyans sayesinde sadeleştiğini gösterdim"
      - "$w_j=(\\mu_{1j}-\\mu_{0j})/\\sigma_j^2$ buldum"
      - "Sonucun lojistik regresyon biçiminde olduğunu, ama parametrelerin farklı (üretken) yoldan kestirildiğini söyledim"
    hints:
      - "$\\log\\mathcal N(x;\\mu,\\sigma^2)=-\\frac{(x-\\mu)^2}{2\\sigma^2}+c$."
    solution: |-
      $\log\frac{P(1|x)}{P(0|x)}=\log\frac{\pi_1}{\pi_0}+\sum_j\frac{(x_j-\mu_{0j})^2-(x_j-\mu_{1j})^2}{2\sigma_j^2}$. Açınca $x_j^2$'ler sadeleşir: $\sum_j\frac{\mu_{1j}-\mu_{0j}}{\sigma_j^2}x_j+b$. Yani $P(1|x)=\sigma(w^\top x+b)$, $w_j=\frac{\mu_{1j}-\mu_{0j}}{\sigma_j^2}$. Varyanslar sınıfa bağlı olsaydı karesel terimler kalır, sınır karesel olurdu (QDA).
pitfalls:
  - wrong: "Naive Bayes'in verdiği olasılık güvenilir bir güven ölçüsüdür."
    right: "Bağımsızlık varsayımı yüzünden olasılıklar aşırı uçlara itilir; karar iyi olsa da olasılık kötü kalibredir."
  - wrong: "Laplace düzeltmesi yalnız sıfırları değiştirir."
    right: "Payda da büyüdüğü için tüm olasılıklar biraz değişir (sıfıra doğru değil, düzgüne doğru)."
whatif:
  - q: "α çok büyük seçilirse (ör. 1000)?"
    a: "Tüm kelime olasılıkları düzgüne yaklaşır; veri neredeyse yok sayılır ve sınıflandırma önsele indirgenir."
  - q: "İki öznitelik birbirinin tam kopyası olsaydı?"
    a: "Kanıt iki kez sayılır: log-oran o özniteliğin katkısının iki katı olur. Sınıflandırma değişebilir, kalibrasyon kesin bozulur."

labs:
  - id: l1
    lab: gnb2d
    title: "Gaussian NB: naif varsayım bozulunca ne olur?"
    goal: |
      İki sınıflı 2B Gauss verisi. Turuncu noktalar GNB'nin karar sınırı, yeşil noktalar gerçek dağılımı bilen en iyi (Bayes) sınır. Sınıf içi korelasyon ρ, naif varsayımın ne kadar yanlış olduğunu ayarlar. Sağda NB ile lojistik regresyonun öğrenme eğrileri.
    predict:
      q: "ρ = 0.8, varyanslar eşit. GNB'nin olasılıkları gerçek posterior'a göre nasıldır?"
      options:
        - {t: "Aşırı uçlarda: x₁ ve x₂ aynı kanıtı taşıyor, NB onu iki kez sayıyor", ok: true, why: "Bağımlı öznitelikleri bağımsız saymak log-olabilirlik oranlarını toplar; ortak kısım çift sayılır, posterior 0/1'e itilir."}
        - {t: "Gerçek posterior'la aynı", why: "Yalnız ρ = 0'da (varsayım doğruysa) ve parametreler doğru kestirilmişse."}
        - {t: "0.5'e daha yakın (çekingen)", why: "Ters yönde: çift sayım güveni artırır."}
    presets:
      - {name: "Varsayım doğru", params: {rho: 0, vr: 1, shared: 0, sep: 2, n: 100}, note: "ρ = 0: GNB sınırı gerçek Bayes sınırına çok yakın."}
      - {name: "Güçlü korelasyon", params: {rho: 0.85, vr: 1, shared: 0, sep: 2, n: 200}, note: "Sınır döner, kalibrasyon farkı büyür."}
      - {name: "Farklı varyanslar", params: {rho: 0, vr: 2, shared: 0, sep: 2, n: 200}, note: "Gerçek sınır kuadratik (eğri); GNB de eğri sınır çizebilir."}
      - {name: "Ortak varyans", params: {rho: 0, vr: 2, shared: 1, sep: 2, n: 200}, note: "Ortak varyans varsayımı: GNB sınırı düz bir doğru (lojistik regresyonla aynı biçim) — ama gerçek sınır eğri."}
      - {name: "Az veri", params: {rho: 0.6, vr: 1, shared: 0, sep: 1.5, n: 12}, note: "Öğrenme eğrisinin sol ucuna bak: az veride NB genelde LR'den iyi."}
    questions:
      - q: "Öğrenme eğrileri neden çoğu zaman kesişir?"
        a: "NB'nin parametreleri ayrı ayrı sayıldığı için çok az veriyle oturur (düşük varyans), ama varsayım yanlışsa asimptotik olarak yanlıdır. LR daha yavaş oturur (birlikte optimizasyon), ama doğru sınırı bulmaya daha esnektir."
      - q: "ρ = −0.85 yapınca sınır hangi yöne döner? Neden?"
        a: "Korelasyon işareti, çift sayılan kanıtın hangi doğrultuda olduğunu belirler; gerçek Bayes sınırı kovaryans elipsinin yönüne göre döner, NB bunu göremez."
    limits: "İki sınıf, iki öznitelik, Gauss veri. Öğrenme eğrisi küçük bir benzetimdir (6 tekrar, 2000 test örneği); LR tam batch GD ile 300 adım ve çok küçük bir L2 cezasıyla eğitilir."
  - id: l2
    lab: nbvslr
    title: "Üretken mi ayırt edici mi? NB ve lojistik regresyonun öğrenme eğrileri"
    goal: |
      d öznitelikli ikili sınıflandırma; özniteliklerin yarısı ±δ sinyal taşır, diğer yarısı yalnız gürültü. İki model de doğrusal sınır çizer: Gaussian NB (ortak varyans, sayarak) ve lojistik regresyon (GD ile). Eğriler eğitim boyuna göre test hatasıdır.
    predict:
      q: "ρ = 0.6 (ortak gürültü faktörü). n = 256'da hangisi daha düşük hatada olur?"
      options:
        - {t: "Lojistik regresyon — bilgisiz öznitelikleri ortak gürültüyü çıkarmak için kullanabilir", ok: true, why: "En iyi doğrusal sınıflandırıcı Σ⁻¹Δμ yönündedir; bilgisiz özniteliklere negatif ağırlık verir. NB onlara 0 verir."}
        - {t: "NB — her zaman daha hızlı öğrenir", why: "Daha hızlı yakınsar ama yanlış bir şeye: varsayım bozukken asimptotik hatası yüksektir."}
        - {t: "Eşit", why: "ρ = 0'da yakın olabilirler; ρ > 0'da fark açılır."}
    presets:
      - {name: "Varsayım doğru, yüksek boyut", params: {d: 50, delta: 0.3, rho: 0}, note: "n ≈ d bölgesinde NB daha hızlı iner."}
      - {name: "Ortak gürültü", params: {d: 20, delta: 0.25, rho: 0.6}, note: "LR, n büyüdükçe NB'yi açıkça geçer; NB'nin eğrisi bir tabanda kalır."}
      - {name: "Güçlü ortak gürültü", params: {d: 10, delta: 0.3, rho: 0.8}, note: "NB'nin hatası n arttıkça bile düşmüyor: varsayımın yanlılığı."}
    questions:
      - q: "NB'nin hatası neden çok veride bile belli bir değerin altına inmiyor (ρ > 0)?"
        a: "Kestirdiği parametreler doğru (sınıf ortalamaları, varyanslar) ama model yanlış: koşullu bağımsızlık varsayımı ortak gürültüyü modelleyemez. Veri arttıkça varyans gider, yanlılık kalır."
      - q: "ρ = 0'da bile LR neden sonunda NB'ye yetişir?"
        a: "Varsayım doğruyken iki model aynı en iyi sınırı hedefler; LR'nin daha yavaş yakınsaması yalnız varyanstan kaynaklanır ve n büyüdükçe kapanır."
    limits: "Benzetim: 1000 test örneği, her n için 4 tekrar; LR tam batch GD (300 adım, η = 0.5, λ = 10⁻³) — tam yakınsamış olmayabilir. Öznitelikler eşit varyanslı Gauss."
