- id: p10
  title: Bonusu Q hedefinden eylem seçimine taşı
  type: kod
  level: 3
  goal: Bonusu Q hedefinden eylem seçimine taşı
  needs: Dyna model sırası, yaş ve bonusun kullanım yeri
  q: 'Bonusun değeri değiştirmesi şart mı? Güncellemelerde bonus kullanmadan her zaman $\arg\max_a[Q(s,a)+\kappa\sqrt{\tau(s,a)}]$
    seçen yöntemi programlayın; bir ızgara deneyiyle güçlü ve zayıf yanlarını gösterin.


    Kaynak: Sutton ve Barto (2018), s.168, Alıştırma 8.4.'
  solution: x 4 plain/plus/selection yöntemlerini, l 3 aynı haritaları karşılaştırır. selection ε karışımı
    içermez; tüm gerçek/model yedekleri bonussuzdur. τ yalnız gerçek saatle yaşlanır. plus yalnız simüle ödülü
    bonuslar ve görülmüş durumun denenmemiş eylemlerini öz döngü modeliyle açar. İki ortam×3 yöntem×30 koşu,
    n 50/α1/κ.001 kendi seçimimizdir. Değişim sonrası ortalama gerçek ödül engellemede Q 22.3667/Q+92.1667/selection
    77.7333; kısayolda 165.6333 / 228.3667 / 181.5333. Q+ bu ayarda daha iyi; selection Q hedefine yapay bonus
    taşımadan keşif yapar ama uzak bir fırsatın çekiciliğini model üzerinden geriye bonuslayamaz. Yerel Q farkıΔ
    için yaklaşıkτ>(Δ/κ)² gecikmesi olabilir. Bu sonlu deney her ızgara için sıralama garantisi değildir.
  rubric:
  - Soruya uygun εsiz seçim
  - Bonussuz Q hedefleri/gerçek ödül
  - Yaş yalnız gerçek deneyim
  - İki ortam/tam ölçüm ve sınırlar
  hints:
  - Tek gerçek adımda henüz ödül yoksa seçim bonusu Q değerini değiştirmeli mi?
- id: p11
  title: Hem stokastik hem değişen model
  type: açıkla
  level: 2
  goal: Hem stokastik hem değişen model
  needs: Ampirik model, durağanlık ve keşif
  q: 's.164 tablo Dyna-Q’yu stokastik ortama nasıl uyarlarsınız? Bu değişiklik, engelleme/kısayol gibi değişen
    görevlerde neden kötü olabilir? İkisini birlikte ele alan bir model önerin.


    Kaynak: Sutton ve Barto (2018), s.168, Alıştırma 8.5.'
  solution: 'Son deterministik sonucu saklamak yerine sonuç sayımları n(s, a, s′, r), geçiş olasılıkları ve
    koşullu ödül ortalamalarını tut. Tam dağılımla beklenen yedek veya gözlenen sonuçlar arasından ampirik
    sıklıkla örnek yedek kullan; bir tampon da bu örnek modelini sağlar. Bütün geçmişi eşit ağırlıkla tutan
    model eski ortamı yeniyle karıştırır: değişimden sonra yeni gözlemler eski yüksek sayımları yavaş etkiler.
    Kayan pencere/üstel unutma, değişim algılayıp modeli yenileme ve bayat çiftleri gerçek keşifle sınama önerilebilir.
    Küçük pencere daha hızlı uyum ama daha çok varyans getirir. Sayımları/son deneme saatini modelden örneklerle
    artırma; simülasyon yeni çevre kanıtı değildir. Bu fikirlerin yakınsama/adaptasyon koşulları durağan sayım
    tahmininden farklıdır.'
  rubric:
  - Olasılık/ödül modeli
  - Expected veya ampirik örnekleme
  - Tümgeçmişin değişim gecikmesi
  - Unutma/keşif ve gerçek veri ayrımı
  hints:
  - Bir çift 1000 eski, 1 yeni sonuç taşıyorsa yeni olasılık ne kadar değişir?
- id: p12
  title: Çarpık olasılık her zaman örneklemeyi kolaylaştırır mı?
  type: yorumla
  level: 2
  goal: Çarpık olasılık her zaman örneklemeyi kolaylaştırır mı?
  needs: Varyans ve expected/sample maliyeti
  q: 'Şekil 8.7’nin b eş olasılıklı ardılı yerine çok çarpık bir ardıl dağılımı olsaydı, örnek güncellemeler
    lehindeki sav güçlenir mi, zayıflar mı? Destekleyin.


    Kaynak: Sutton ve Barto (2018), s.174, Alıştırma 8.6.'
  solution: Genel ölçüt dal sayısı değil $\sigma_p^2=\sum_i p_i(Y_i-\mu)^2$; bağımsız örnek ortalamasının RMS'i
    $\sigma_p/\sqrt t$. Olasılık benzer değerli birkaç dalda yoğunlaşırsa varyans azalır ve pahalı bütün-dal
    beklentisine göre örnekler daha yararlı olabilir. Ancak b 100'de bir Y 1 ve 99 Y 0 olsun. Düzgün p=.01
    için varyans.0099; aykırı dalın p'si.5 olduğunda .25. Dağılım daha çarpıkken RMS yaklaşık 5.025 kat büyür.
    Tersine p=.999 için varyans.000999 ve RMS küçülür. Yalnız dağılımın çarpıklığından koşulsuz sonuç çıkmaz;
    değerler ve maliyetler de gerekir. Kaynak eğrisi ayrıca σ²=(b−1)/b normalizasyonunu kullanır.
  rubric:
  - Genel ağırlıklı varyans
  - Yararlı koşul
  - Sayısal karşı örnek
  - Hedef hesap maliyeti
  hints:
  - Örnek ortalamasının varyansı hangi popülasyon niceliğine bağlı?
- id: p13
  title: Erken taraklanmanın dönemi
  type: açıkla
  level: 2
  goal: Erken taraklanmanın dönemi
  needs: Asenkron inplace yedek sırası
  q: 'Şekil 8.8’in özellikle 1000 durum/b 1/uniform eğrisinin erken bölümündeki taraklanma neden olabilir?
    Grafikte hipotezi destekleyen hangi özellikler var?


    Kaynak: Sutton ve Barto (2018), s.177, Alıştırma 8.7.'
  solution: Uniform burada rastgele çift değil döngüsel inplace taramadır. İki eylem×S durum=2 S yedeklik dönem.
    Başlangıç çiftleri erken güncellenir; ardıllarda daha sonra ortaya çıkan bilgi onların sonraki turuna kadar
    başlangıca taşınmayabilir. Tam tarama çevresindeki değer artışı sonra yataylaşma, yinelenen tarak görünümü
    verir. b 1'de bu gecikmiş zincir yayılımı daha belirgindir; çok dal beklentisi daha fazla yolu karıştırır.
    S=1000 için 2000, S=10000 için 20000 dönem çevresini incele; l 6 ilkiki tarama görünümü bunu açar. Davranışın
    rastgeleliği tek başına bu sabit dönemi açıklamaz. Hipotez periyot/S/ara ölçüm yoğunluğuyla sınanır; seyrek
    ölçüm tarakları gizleyebilir.
  rubric:
  - Döngüsel uniform ayrımı
  - 2 S dönemi
  - Bilginin geri yayılım gecikmesi
  - b/S grafik ipuçları
  hints:
  - Bir başlangıç çifti yeniden ne zaman güncelleniyor?
- id: p14
  title: 10000 durumlu deneyi b3 ile yinele
  type: kod
  level: 3
  goal: 10000 durumlu deneyi b3 ile yinele
  needs: MDP modeli, Bellman politika değerlendirmesi, hesap bütçesi
  q: 'Şekil 8.8’in alt deneyini tekrarlayın; sonra aynı deneyi b=3 ile çalıştırın. Sonuçları tartışın.


    Kaynak: Sutton ve Barto (2018), s.177, Alıştırma 8.8.'
  solution: 'x 5 modeli/eşlenmiş yöntemleri/gerçek politika değerlendirmesini kurar. Tam kaynak bütçesi: S=10000,
    ikiA, 200 görev, yöntem başına 200000 expected atama, ε.1, γ1, .1 terminal; ardından b 3 aynı bütçe. Terminal
    ödül 0 ve çift içinde farklı ardıllar kendi açık seçimimizdir. Döngüsel çift taramasıyla onpolicy yörünge
    aynı beklenen hedefi kullanır. C++ tam deney b 1 ve b 3 için 80 m+80 m yedek yaptı. 10000. yedekte döngüsel/yörünge
    v 0 b 1: 3.228833 / 6.113305, b 3: 1.514746 / 1.882717; 200000''de b 1: 7.733512 / 7.326420, b 3: 3.150903
    / 2.778139. Daha çok dalda başlangıç odağının üstünlük süresi kısaldı. En büyük politika Bellman kalanı
    1.1 e−12. Kaynağın≈3.5 b 1 çizgisiyle sayısal yükseklik eşleşmedi; özgün görev/tohum/bütün model ayrıntıları
    yok. Kendi doğrulanmış çıktısı kaynak verisi diye sunulmaz; 200 görev standart hatası l 6''da var. Küçük
    notebook kontrolü tam deneyi ikame etmez.'
  rubric:
  - Tam 10000 / 200 / 200000 bütçe
  - b 1 sonra b 3
  - Aynı expected yedek, farklı konum
  - Gerçek greedy politika değeri/SE/kalan
  - Kaynak ve kendi varsayımı ayrımı
  hints:
  - maxQ(0) ile gerçek vπ(0) neden aynı olmak zorunda değil?
- id: p15
  type: karşı-örnek
  level: 2
  title: Tek ardıl ama rastgele ödül
  goal: Örtük varsayımı bulmak
  needs: Expected hedef ve tek örnek
  q: 'b=1 ve α=1 ise beklenen ve örnek Q yedeği her zaman aynı mıdır? Tek terminal ardıl ve eşit olasılıklı
    R=−1/+1 düşün. Kaynak: Sutton ve Barto, s.173 ifadesinin örtük ödül koşulunu açan kendi karşı örneğimiz.'
  hints:
