quiz:
- q: Dyna'daki model ile DQN'deki tekrar tamponu arasındaki fark nedir?
  options:
  - t: Tampon yalnız gerçekten yaşanan geçişleri tekrarlar (basit, genelleme yok); model simüle geçiş üretir
      ve görülmemiş (s,a)'lara genelleyebilir (ama model hatası taşır)
    ok: true
    why: Tablo Dyna-Q'nun deterministik modeli aslında bir tampona çok benzer.
  - t: Fark yok
    why: Parametrik model genelleyebilir.
  - t: Model yalnız ödülü öğrenir
    why: Geçişleri de.
- q: MCTS'te yaprak değeri nasıl kestirilir?
  options:
  - t: Varsayılan (ör. rastgele) politikayla oyun sonuna kadar simülasyon — ya da AlphaGo'da değer ağı
    ok: true
    why: Şans düğümleri modelden örneklenir.
  - t: Tam minimax ile
    why: O tam aramadır.
  - t: Sıfır kabul edilir
    why: Bilgi taşımaz.
- q: Dyna-Q kısayol labirentinde yeni açılan kısa yolu neden bulamaz?
  options:
  - t: Mevcut yol hâlâ iyi çalıştığı için model yanlışlığı fark edilmez; ε-açgözlü keşif kısayola giden uzun
      bir eylem dizisini neredeyse hiç denemez
    ok: true
    why: Dyna-Q+ uzun süredir denenmeyen geçişlere κ√τ bonusu vererek planlamada keşfi teşvik eder.
  - t: Öğrenme oranı çok küçük
    why: α = 1.
  - t: Model deterministik olduğu için
    why: Ortam da deterministik.
homework:
- title: 'Kocsis & Szepesvári (2006): UCT'
  paper: Kocsis & Szepesvári — Bandit Based Monte-Carlo Planning (ECML 2006)
  url: https://doi.org/10.1007/11871842_29
  level: orta
  hours: 8
  goal: 'UCT''yi makalenin P-game ağaçlarında (rastgele dallanma 2–8, derinlik 4–20, yapraklarda rastgele değer)
    uygula ve minimax değerine göre hata–örnek sayısı eğrisini, alfa–beta ve düz Monte Carlo (UCB''siz) ile
    karşılaştır. Sonra d/e aşamalarındaki tic-tac-toe kodunu Connect-4''e (6×7) genişlet ve UCT''yi saf rastgele
    oyuncuya ve sınırlı derinlikte minimax''a karşı oynat.

    '
  steps:
  - e aşamasındaki vektörel rastgele oyun fonksiyonunu Connect-4 kazanma çizgileriyle genelleştir.
  - Benzetim sayısı 100, 1000, 10 000.
  accept:
  - UCT'nin hatası örnekle düz MC'den hızlı düşer (makale Şekil 2 nitel).
  - Connect-4'te 10 000 benzetimli UCT, rastgele oyuncuyu ≥ %95 yener.
- title: 'Nagabandi ve ark. (2018): Sinir ağı dinamik modeli + MPC'
  paper: Nagabandi ve ark. — Neural Network Dynamics for Model-Based Deep RL with Model-Free Fine-Tuning (ICRA
    2018)
  url: https://arxiv.org/abs/1708.02596
  level: ileri
  hours: 12
  goal: 'd aşamasındaki modeli Gymnasium MuJoCo (HalfCheetah, Swimmer) ortamlarına taşı: girdi/çıktı normalizasyonu,
    Δs tahmini, rastgele atış MPC (K = 1000, H = 10–20), veri birleştirme (Algoritma 1); ardından MPC''yi taklit
    eden bir politikayla model-free (PPO) ince ayarı başlat (Bölüm IV-B).

    '
  steps:
  - Çok adımlı model hatasını H'ye karşı ölç.
  - 'Örnek sayısına göre ödül eğrisi: MB, MB-MF ve saf MF.'
  accept:
  - MB, MF'ye göre 1–2 büyüklük mertebesi az örnekle makul performansa ulaşır (makale Şekil 6 nitel).
labs:
- id: l1
  lab: dynamaze
  title: 'Dyna labirenti: planlama adımı sayısı ve değişen ortamda Dyna-Q+'
  goal: 'Sutton–Barto labirentinde bölüm başına adım sayısını planlama adımı sayısına (n) bağlı izle: n = 0,
    seçili n ve n = 50 aynı grafikte. Kısayol deneyinde 3000. adımda açılan geçidi düz Dyna-Q ile Dyna-Q+ (κ√τ
    bonusu) arasındaki birikimli ödül farkından izle; κ = 0''da keşif itmesinin ne kadarını yitirdiğini ölç.

    '
  predict:
    q: İkinci bölümde ortalama adım sayısı n = 0'dan n = 50'ye geçince kabaca nasıl değişir?
    options:
    - t: İki katına kadar kısalır
      why: 'Ölçülen değişim çok daha büyük: 30 çalıştırma ortalamasında 752''den 98''e.'
    - t: Birkaç katla yirmi kata kadar kısalır (30 çalıştırmada 752'den 98'e)
      ok: true
      why: Planlama her gerçek adımı n + 1 güncellemeye çoğaltıyor; tohumdan tohuma 37–212 arasında değişen
        ağır kuyruklu bir dağılım var.
    - t: Uzunluğu değiştirmez, yalnız öğrenme sonrası bölüm uzunluğunu iyileştirir
      why: 'En büyük kazanç ilk bölümlerde: ikinci bölüm 752''den 98''e iniyor.'
  presets:
  - name: Varsayılan (n = 10)
    params: {}
    note: 'İkinci bölüm ortalaması: n = 0 için 530, n = 10 için 127, n = 50 için 38 adım. Kısayol deneyinde
      Dyna-Q+ oranı 1.40 (ikinci yarı 165''e karşı 231).'
  - name: Ağır planlama (n = 50)
    params:
      n: 50
    note: İkinci bölüm 42 adım; kısayolda oran 1.34 (168'e karşı 225).
  - name: Dyna'sız (n = 0)
    params:
      n: 0
    note: 'İkinci bölüm 530 adım. Kısayol deneyinde iki ajan da çok yavaş: ikinci yarı 52 ve 93 ödül.'
  - name: Bonus kapalı (κ = 0)
    params:
      kappa: 0
    note: 'Dyna-Q+ kısayolu bulamıyor: ikinci yarı ödülü 145, Dyna-Q 165 (oran 0.879).'
  - name: Keşifsiz (ε = 0)
    params:
      eps: 0
    note: 'İlk yarıda Dyna-Q 85, Dyna-Q+ 130 ödül: bonus olmasa da denenmemiş eylemlerin modele eklenmesi başlı
      başına keşif sağlıyor.'
  questions:
  - q: Kısayol açıldıktan sonra düz Dyna-Q kısayolu neden bulamaz?
    a: Eski yol hâlâ hedefe götürüyor; model 'çalışıyor' görünür ve Q değerlerinde tutarsızlık doğmaz. ε-açgözlü
      keşif kısayola giden uzun eylem dizisini neredeyse hiç denemez; planlama ise yalnız gerçekte görülmüş
      (s, a) çiftlerinden örnekleme yapar. Dyna-Q+ uzun süredir denenmemiş çiftlere κ√τ bonusu eklediği için
      planlama onları yeniden denemeye değer bulur, model güncellenir ve kısayol devreye girer.
  - q: n = 50'de bile ikinci bölüm bazı tohumlarda 200 adımı aşıyor. Neden?
    a: 'Bölüm 1''de hedefe götüren geçişler tesadüfen geç öğrenülürse Q''da yol bilgisi eksik kalır: planlama,
      modelde olan bilgiyi çoğaltır, olmayanı üretemez. Bu yüzden dağılım ağır kuyrukludur; ölçümümüzde n =
      50''nin ikinci bölümü 8 tohumda 37 ile 212 arasında değişti.'
  limits: Deterministik labirent (duvara çarpınca yerinde kalma); tablo model yalnız gerçekte görülmüş (s,
    a) çiftlerinden simüle adım üretir; statik deney 10 çalıştırmanın ortalaması, kısayol deneyi tek koşu (tohum
    arayüzden değiştirilebilir); bölüm en çok 2000 adım; iki deneyde de α, ε, n ve κ ortak.
- id: l2
  lab: mctsttt
  title: 'MCTS ve UCT: keşif katsayısı ve politika önseli'
  goal: 'Üç tic-tac-toe konumunda UCT ağacını kur: kök hamlelerinin ziyaretleri ve ortalama değerleri, minimax
    ile doğru (oyun değerini koruyan) hamlelerin ziyaret payının simülasyon sayısıyla gelişimi. UCT ile PUCT
    (merkez/köşe/kenar ağırlıklı sabit politika önseli) seçim kurallarını karşılaştır; c''nin uç değerlerindeki
    kilitlenme ve dağınıklık davranışını ölç.

    '
  predict:
    q: Engelleme konumunda 200 simülasyon sonunda ziyaretlerin ne kadarı doğru hamleye gider?
    options:
    - t: Yaklaşık yarısı
      why: 'Ölçülen pay daha yüksek: UCT ile 0.87, PUCT ile 0.95.'
    - t: Büyük çoğunluğu (UCT ile 0.87, PUCT ile 0.95)
      ok: true
      why: 174/200 ziyaret kazandıran tek hamleye gidiyor; diğer dört hamle kaybettiriyor ve ağaç onları erken
        bırakıyor.
    - t: Rastgele oyunlar yüzünden ziyaretler dağılır, belirgin bir hamle çıkmaz
      why: 'Rastgele oyunlar gürültülüdür ama 200 simülasyonda fark büyük: hamlelerin ortalama değerleri 0.87''ye
        karşı −0.2 ile −0.55.'
  presets:
  - name: Varsayılan (engelleme konumu)
    params: {}
    note: 'Kare 6: 174/200 ziyaret, ort. değer 0.87; pay UCT 0.87, PUCT 0.95.'
  - name: Az simülasyon
    params:
      sims: 50
    note: 'Pay UCT 0.60, PUCT 0.86: küçük bütçede önselin katkısı büyük.'
  - name: Büyük keşif katsayısı
    params:
      c: 3
    note: UCT payı 0.65'e iniyor (12 tohumda 0.63–0.66 bandı); PUCT'ta önsel dağılmayı frenliyor (≈ 0.91).
  - name: Kazanma konumu
    params:
      pos: 2
    note: Kazandıran hamle üst orta (1-4-7 sütunu); pay UCT 0.875, PUCT 0.92.
  - name: Boş tahta
    params:
      pos: 0
    note: Minimax değeri beraberlik ve bütün ilk hamleler bunu koruyor; ziyaretler yine merkezde yoğun (48/200).
  questions:
  - q: Kökteki hamle neden en yüksek skorlu değil, en çok ziyaret edilen hamle seçilir?
    a: 'Skorda keşif bonusu vardır: az ziyaretli bir kol bonusla en yüksek skoru alabilir ama bu, iyi olduğunun
      kanıtı değildir. Ziyaret sayısı ağacın o kola yatırdığı değerlendirme denemelerinin sayısıdır ve sonsuz
      simülasyonda ziyaretler en iyi hamleye yakınsar (UCT tutarlılığı). AlphaGo da dahil uygulamalarda kök
      seçimi ziyaret sayısıyladır.'
  - q: Yaprak başına rastgele oyun sayısını (roll) artırmak neyi değiştirir?
    a: 'Yaprak değer kestiriminin gürültüsü 1/√roll ölçeğinde azalır; aynı simülasyon bütçesinde daha az ama
      daha güvenilir yaprak değeri hesaplanmış olur. Gürültü azalınca agresif seçim kuralları daha az kilitlenir:
      ölçümümüzde roll = 20 ile c = 0 payı 0.98''di; roll = 1''de ise 12 tohumdan 2''sinde pay 0.005''e düştü.'
  limits: Tic-tac-toe (3 × 3); varsayılan politika düz rastgele oyun; yaprak değeri roll oyunun ortalaması;
    PUCT önseli sabit bir merkez/köşe/kenar ağırlığı (öğrenilmiyor); aynı c katsayısı UCT ve PUCT'ta kullanılıyor;
    kök analizi tek koşu (tohum arayüzden değiştirilebilir).
- id: l3
  lab: dynasource
  title: 'Kaynak Dyna: aynı ilk bölüm ve değişen ortam'
  goal: Kaynak Şekil 8.2/8.4/8.5 koşullarını ve Alıştırma 8.4 seçim bonusunu karşılaştır.
  predict:
    q: Karşılaştırmada hangi ölçütü sabit tutmalıyız?
    options:
    - t: Yedek türü, veri/hesap bütçesi ve değerlendirme politikası açık olmalı
      ok: true
      why: Farkın kaynağını böyle ayırırız.
    - t: Yalnız en iyi görünen tek eğriyi seçmek yeterli
      why: Tohum, yedek türü ve durdurma hedefi kıyası değiştirebilir.
  presets:
  - name: Şekil8.2:30 koşu×50 bölüm
    params:
      R: 30
    note: 'Kaynak ayarı: Q=0, α=.1, ε=.1, γ=.95, n=0/5/50;30 koşu ve 50 tam bölüm. Kaynak ilk bölümü yaklaşık
      1700 bildirir; kendi tohumlarımızda sayı farklı, üç yöntemde ilk bölüm aynıdır.'
  - name: 'Engelleme: kaynak değişim zamanı'
    params:
      mode: 1
      n: 50
      alpha: 1
      R: 30
    note: 1000. adımda değişim, toplam 3000 gerçek adım. κ=.001, n=50, α=1 ve 30 koşu kendi açık seçimlerimizdir;
      kaynak bunları belirtmiyor.
  - name: 'Kısayol: kaynak değişim zamanı'
    params:
      mode: 2
      n: 50
      alpha: 1
      R: 30
    note: 3000. adımda kısayol, toplam 6000 gerçek adım. Q+, yalnız seçim bonusu ve düz Q aynı gerçek ödülle
      kıyaslanır; n/α/κ/koşu sayıları kendi seçimimizdir.
  - name: 'κ0: model farkı sürer'
    params:
      mode: 2
      kappa: 0
      n: 50
      alpha: 1
    note: Q+ denenmemiş eylemleri modele açmaya devam eder. Seçim bonusu yöntemi ayrıca ε kullanmadığından,
      κ=0 iken de yöntemlerin eşleşmesi gerekmez.
  - name: n20 ara bütçe
    params:
      n: 20
    note: n=20 eğrisi kaynak n=0/5/50 eğrilerine eklenir; modelin verdiği bilgiyi daha çok hesapla kullanmanın
      etkisini incele.
  questions:
  - q: Grafiğin sayıları kitabın özgün sayıları mı?
    a: Hayır. Kaynak koşulları ve özgün yazar raporu ayrı belirtilir; bu alan kendi model tercihleri/tohumlarıyla
      gerçekten hesaplanan değerleri veya açık analitik formülü gösterir.
  limits: Planlama önce görülen durum, sonra o durumdaki denenmiş eylemi eşit seçer. Davranış ve planlama üreteçleri
    ayrı. Statik deney 50 tam bölüm;100000 adımlık güvenlik kesmeleri ayrıca sayılır. Varsayılan 5 koşu, kaynak
    ön ayarı 30. Değişen ortamda belirtilen gerçek adım bütçesi kullanılır.
