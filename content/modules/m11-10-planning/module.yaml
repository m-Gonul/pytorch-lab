id: m11-10-planning
code: M11.10
title: Modelli RL ve planlama — Dyna, öğrenilmiş modelle MPC, Monte Carlo ağaç araması
phase: 11
minutes: 700
prereq:
- m11-5-sarsa-q
summary: 'Geçiş ve ödül modelini açıkça öğren, modelle planla: örnek verimliliği artar, karmaşıklık da. Model
  öğrenme (sayımlar, doğrusal ve sinir ağı modelleri), kısmi planlama (her gerçek adımda birkaç simüle Q-öğrenme
  adımı: Dyna), tekrar tamponu ile modelin farkı, değişen ortamda Dyna-Q+, öncelikli tarama; şimdiki durumdan
  planlama: model öngörülü kontrol (MPC) ve Monte Carlo ağaç araması (seçim, genişletme, simülasyon, geri yayılım;
  UCT ve AlphaGo''nun PUCT''u). Saf Python''da Dyna labirenti, NumPy''da kesinlik eşdeğerli planlama, PyTorch''ta
  öğrenilmiş sinir ağı modeliyle CartPole MPC''si ve vektörel rastgele oyunlarla MCTS.

  '
goals:
- 'Modelli döngü: eylem → gözlem → modeli güncelle → planla (değer/politika güncelle)'
- 'Dyna-Q: n planlama adımı; tampon gerçek örnek tekrarlar, model genelleyebilir'
- '[[Monte Carlo ağaç araması]]: yaprakta varsayılan politika, şans düğümünde örnekleme, karar düğümünde yalnız
  umut veren eylemleri genişlet'
- UCT $\bar Q+c\sqrt{\ln N/n}$ ve PUCT $Q+c\,\pi(a|s)\sqrt N/(1+n)$
