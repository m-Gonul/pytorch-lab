- id: p16
  type: hesap
  level: 1
  title: RTDP için adil politika kıyası
  goal: Durdurma ölçütlerini ayırmak
  needs: Yüzde fark
  q: 'Kaynak s.179–180: DP tam değer yakınsamasında 252784, ilk yakın optimal politikada 136725; RTDP 127600
    güncelleme kullanıyor. İlk yakın optimal politika kıyasına göre RTDP yüzde kaç daha az? (Kendi ek hesabımız.)'
  answer: 6.6739806180288905
  calc: (136725-127600)/136725*100
  hints:
  - Paydada aynı hedefi sağlayan DP bütçesini kullan.
  solution: 'Önce farkı bul: 136725−127600=9125. Sonra 9125 / 136725 ×100 = %6.673980618. Yaklaşık yarı hesap,
    252784 tam değer yakınsamasına göredir. Ek politika testlerinin maliyeti bu güncelleme sayılarından ayrıdır.'
  rubric: []
- id: p17
  type: kanıt
  level: 3
  title: Derin aramanın hata üst sınırı
  goal: Sezgiye varsayımlı sınır vermek
  needs: Bellman daralması ve greedy kaybı
  q: Doğru model, 0≤γ<1, tam dallanma ve yaprak sup hatasıε ile k-adım aramada tek karar kaybını, ardından
    her durumda tekrar kullanılan politikanın değer kaybını sınırlayın. Kaynak s.182 derinlik sezgisine kendi
    ek türetimimiz.
  hints:
  - Beklenti/max sup hatayı büyütür mü?
  - Yanlış en büyük seçimine iki hata payı gerekir.
  rubric:
  - γᵏε yaprak etkisi
  - 2γᵏε tek karar
  - 1/(1−γ) politika etkisi
  - Seçicilik/model hatası sınırı
  solution: Her kök eylem tahmini γᵏε yakın. En büyük tahminli eylemin gerçek optimal Q kaybı≤2γᵏε. Bu her
    durum için sağlanırsa Bellman politika kayıp yinelemesiyle değer farkı≤2γᵏε/(1−γ). Üst sınırın k ile küçülmesi
    somut kararların monoton iyi olmasını garanti etmez; doğru model/tam ağaç/hata sınırı varsayımları esastır.
pitfalls:
- wrong: Modelli RL modelsizden her zaman daha örnek-verimlidir; model öğrenmek her durumda kazançtır.
  right: Küçük ve orta ölçekte genelde öyledir; ama model hatası çok adımlı planda birikir ve yanlış model,
    yanlış politikayı hızla planlar. Bu yüzden uygulamalar modelli hızı modellsiz ince ayarla birleştirir (Nagabandi
    ve ark. 2018). Deterministik labirent gibi kolay model problemlerinde modelli yöntem açık ara kazanır.
- wrong: MCTS'te bir düğümün değeri, keşif bonusunu da içeren skoru en yüksek eylemin skorudur.
  right: Bonus yalnız hangi çocuğun derinleştirileceğini seçmek içindir; düğümün değeri geri yayılımla çocuk
    ortalamalarından gelir. Karar düğümünde V(s) = max_a Q̄(s, a) tanımlanır. Bonusu değere katmak, kötü eylemi
    'keşif gereği' şişirir ve üst düğümlerin ortalamalarını bozar.
- wrong: Dyna planlaması durum–eylem uzayından keyfî örnekler çekebilir.
  right: 'Tablo model yalnız gerçekte görülmüş (s, a) çiftleri için tanımlıdır; görülmemiş çift için uydurulan
    değer (ör. kendi-kendine geçiş, ödül 0) Q''yu amaçtan uzaklaştırır. Görülmemiş çiftler yalnız fonksiyon
    yaklaşımı modelinin genelleme yapabildiği durumda kullanılabilir. İstisna: kaynak s.168 Dyna-Q+ dipnotu,
    görülmüş durumdaki denenmemiş eylemleri sıfır ödüllü öz döngü modeliyle planlamaya açar.'
- wrong: Tekrar tamponu modelden üstündür çünkü gerçek örneklerle çalışır; model simüle örnekle eğlence olur.
  right: 'İkisi farklı amaçlara hizmet eder: tampon yalnız yaşanmış örnekleri tekrar eder; model görülmemiş
    (s, a)''lar için de öngörü üretir ve stokastik ortamda tek bir yol yerine beklenen geçişi taşır. Deterministik
    tablo durumunda ikisi aynı bilgiyi taşır (pratik kartında kanıtlı).'
whatif:
- q: Kısayol açılsa ama Dyna-Q+ bonusu κ = 0 olsa ne olur?
  a: 'Dyna-Q+ denenmemiş eylemleri modele eklemeye devam eder ama keşif itmesi kalmaz. Ölçülen sonuç: değişimden
    sonraki 3000 adımda Dyna-Q+ 145 ödül topladı, Dyna-Q 165 — oran 0.879. Kısayolu bulan şey κ√τ bonusunun
    kendisidir; model genişletme tek başına yetmez.'
- q: MCTS'te c = 0 olsaydı?
  a: 'Seçim yalnız ortalamalara bakar. Değer farklarının büyük olduğu ölçtüğümüz konumda doğru hamle yine bulunur
    (pay 0.98); ama yaprak kestirimi gürültülüyse (yaprak başına tek rastgele oyun) kötü ilk izlenim kalıcı
    olur: 12 tohumdan 2''sinde pay 0.005''e düştü. Bonus, kilitlenmeyi kıran sigortadır; c = 3''te ise ziyaretler
    dağılır (pay 0.63–0.66).'
- q: Varsayılan politika (düz rastgele oyun) yerine daha iyi bir politika kullanılsaydı?
  a: 'Yaprak değerleri daha az gürültülü ve gerçek değere daha yakın olurdu; aynı simülasyon bütçesiyle daha
    güvenilir ağaç. AlphaGo tam bunu yapar: yaprakta değer ağı (ya da değer ağı + kısa rastgele oyun karışımı).
    Sınır: varsayılan politika çok açgözlü olursa ağaç tek dala kilitlenebilir; keşif yine c ve politika önseliyle
    dengelenir. Kaynak s.184 bu daha iyi-taban sezgisine Gelly–Silver2007 atfıyla çekince koyar; farklı hedefte
    daha iyi olan bir taban her rolloutta daha iyi karar garantilemez.'
