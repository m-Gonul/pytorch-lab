practice:
- id: p1
  type: çözülmüş
  level: 0
  title: UCT seçim skoru
  goal: Skoru elle hesaplamak
  needs: $\bar Q+c\sqrt{2\ln N/n}$
  q: Bir karar düğümünde iki hamle var. Birincide $\bar Q=0.3$, $N=40$ (düğüm ziyareti), $n=5$ (kol ziyareti),
    $c=\sqrt2$; ikincide $\bar Q=0.4$, aynı $N$, $n=35$. Hangisi seçilir ve skoru nedir?
  solution: 'Birinci kol: $0.3+\sqrt2\sqrt{\ln 40/5}=0.3+1.414\cdot0.859=1.515$. İkinci kol: $0.4+\sqrt2\sqrt{\ln40/35}=0.4+0.325=0.725$.
    Az ziyaretli kol seçilir: keşif bonusu belirsizliği ödüllendirir. (Skordaki 2 çarpanı UCB1''den gelir;
    $c$ bunu içine aldığı için uygulamada genelde $c\sqrt{\ln N/n}$ yazılır.)'
- id: p2
  type: hesap
  level: 1
  title: Ödül modelinin artımlı ortalaması
  goal: Model güncellemesini hesaplamak
  needs: $\hat R\leftarrow(r+(n-1)\hat R)/n$
  q: Bir $(s,a)$ çifti daha önce 4 kez denendi ve $\hat R(s,a)=0.6$. Beşinci denemede ödül $r=1.0$ geldi. Güncellenmiş
    $\hat R(s,a)$ nedir?
  answer: 0.68
  calc: (1.0 + 4*0.6)/5
  mistakes:
  - answer: 0.32
    msg: 'n − 1 yerine 1: (1.0 + 0.6)/5. Eski tahmin tam ağırlıkta değil, gördüğü deneme sayısı kadardır.'
  - answer: 0.8
    msg: 'İki değerin basit ortalaması: 5 örneğin ortalaması değil.'
  - answer: 1.0
    msg: 'Son gözlemle değiştirmek: model son örneği değil beklenen ödülü tahmin eder.'
  hints:
  - 'Beş örneğin ortalaması: (4 eski örnek özet + 1 yeni)/5.'
  solution: '$\hat R=(r+(n-1)\hat R_{\text{eski}})/n=(1.0+4\cdot0.6)/5=0.68$. Bu, M11.4''teki artımlı ortalamanın
    aynısı: $n-1$ eski gözlemin toplamı $4\cdot0.6=2.4$, yenisıyla birlikte $3.4$, beşe bölünce 0.68.'
- id: p3
  type: yorumla
  level: 2
  title: Ağır kuyruklu öğrenme eğrisi
  goal: Ölçüm dağılımını yorumlamak
  needs: planlama, keşif, örneklem varyansı
  q: Bir öğrenci Dyna-Q labirentini n = 50 ile 30 farklı tohumla koşuyor. İkinci bölümün ortalaması 98 adım;
    ama tek tek tohumlarda 37 ile 212 arasında değişiyor. Öğrenci "planlama bazı tohumlarda işe yaramıyor"
    diyor. En doğru yorum hangisi?
  choices:
  - t: 'Planlama bozuk: n = 50 her tohumda ikinci bölümü 40 adımın altına indirmeli'
    why: 'Böyle bir garanti yok: planlama modeldeki bilgiyi çoğaltır, keşif eksikliğini telafi etmez.'
  - t: 'Dağılım ağır kuyruklu: bölüm 1''de hedef yolunun geç keşfedildiği talihsiz koşular ikinci bölümü uzatıyor;
      ortalama hâlâ n = 0''daki 752''den çok düşük'
    ok: true
    why: Planlamanın getirisi ortalamada net (752'den 98'e); kuyruk, keşfin özyinelemeli bağımlılığından geliyor.
  - t: 'Tohum sayısı yetersiz: 30 tohumla ortalama güvenilmez'
    why: 'Ortalama 98''in güven aralığı geniş olabilir ama gözlenen tablo tutarlı: n = 0 için ortalama 752.'
  hints:
  - Bölüm 1'de ne öğrenilirse planlama onu çoğaltır.
  solution: Planlama, modelde olmayan bilgiyi üretemez. Bölüm 1'de rastgele yürüyüş hedefe giden geçişleri
    geç tandaysa Q'da yol eksik kalır ve ikinci bölüm uzar. Ortalama yine de n = 0'a göre çok iyi (98'e karşı
    752); kuyruğu kesmenin yolu keşfi iyileştirmektir (ör. iyimser başlangıç, ε takvimi), planlamayı artırmak
    değil.
- id: p4
  type: yöntem-seç
  level: 2
  title: Depo robotu için yöntem seçimi
  goal: Modelli ve modelsiz yöntemleri duruma göre seçmek
  needs: Dyna, DQN, MCTS
  q: 'Bir depoda yol bulma robotu: ızgara harita, 4 hareket eylemi, pil ve süre pahalı (günde birkaç yüz gerçek
    adım), ortam yavaş değişiyor (raf yerleri arada değişiyor). Hangi yaklaşım en uygun başlangıç?'
  choices:
  - t: Sayım/doğrusal model öğrenen ve Dyna planlaması yapan ajan; ortam değişimine karşı Dyna-Q+ bonusu
    ok: true
    why: Az gerçek denemeyle simüle deneyim üretir; değişen ortamda bonuslu keşif modelin bayatlamasını fark
      eder.
  - t: 'DQN: görsel girdiden Q ağı, milyonlarca adımlık tekrar tamponu'
    why: Örnek verimliliği düşük; pahalı gerçek deneyimle ölçeklenmez (görsel girdi de yok).
  - t: Doğrudan MCTS
    why: MCTS bir geçiş modeli ister; model öğrenilmeden ağaç kurulamaz. Model öğrenilirse MPC/MCTS düşünülebilir.
  hints:
  - Günde birkaç yüz gerçek adımla kaç milyon güncelleme yapılabilir?
  solution: 'Küçük eylem uzayı + pahalı deneyim + değişen ortam: modelli RL''nin tipik senaryosu. Sayım modeli
    (ya da doğrusal model) + Dyna planlaması her gerçek adımı onlarca simüle adıma çevirir; Dyna-Q+''nın κ√τ
    bonusu uzun süredir denenmeyen geçişleri yeniden gündeme getirir. Model hatası riski deterministik ızgarada
    düşüktür.'
- id: p5
  type: hata-bul
  level: 2
  title: Keyfî örneklemeli Dyna
  goal: Planlama örnekleme hatasını bulmak
  needs: görülmüş (s, a) çiftleri
  q: Bir öğrencinin Dyna-Q kodu planlama adımında (ŝ, â) çiftini bütün durum–eylem tablosundan rastgele seçiyor;
    modelde olmayan çiftler için de `(r = 0, s' = ŝ)` varsayıyor. Kod yavaş öğreniyor ve bazı (s, a)'ların
    Q değeri nedeni anlaşılmayan biçimde düşüyor. Hata nerede?
  choices:
  - t: Öğrenme oranı çok küçük
    why: 'Semptom orandan bağımsız: Q düşüşü planlama hedeflerinden geliyor.'
  - t: Hiç denenmemiş (ŝ, â) çiftleri için kendi-kendine-geçiş varsayımı, bu eylemlerin Q'sunu ŝ durumunun
      değerine doğru çekiyor; görülmemiş çiftlerin de Q'su gerçekte varmış gibi güncelleniyor
    ok: true
    why: Planlama yalnız görülmüş çiftlerden örnekleme yapmalı (Sutton ve Barto, Algoritma 8.1). Bu kural olağan
      Dyna-Q içindir; s.168 dipnotundaki Dyna-Q+ görülen durumların denenmemiş eylemlerini bilinçli olarak
      öz döngü modeliyle açar.
  - t: Model güncellemesi yanlış sırada yapılıyor
    why: Sıralama sorunu değil; sorun modelde olmayan çiftlerin uydurma değerlerle kullanılması.
  hints:
  - Hiç denenmemiş bir (ŝ, â) için (r = 0, s' = ŝ) hedefi Q(ŝ, â)'yı hangi değere çeker?
  solution: 'Uydurma hedef $0+\gamma\max_{a''}Q(\hat s,a'')$: hiç denenmemiş eylemin değeri kendi durumunun
    değerine yapıştırılır. Bu, hem görünmüş komşuların öğrenimini gürültüler hem de gerçekten iyi eylemleri
    bastırabilir. Doğrusu: `keys` listesinde yalnız gerçekte denenen çiftleri tutmak ve planlamayı oradan örneklemek.
    Fonksiyon yaklaşımı modelinde görülmemiş girdiye genelleme meşrudur; tabloda değildir.


    Kaynak ayrıntısı: Dyna-Q+ bu varsayımı bilinçli bir keşif modeli olarak kullanır; olağan Dyna-Q ile aynı
    algoritma değildir. Tablo modelde böyle bir model önseli tanımlamak yasak değil, doğruluk varsayımının
    açık olması gerekir.'
- id: p6
  type: kanıt
  level: 3
  title: Tablo model ile tekrar tamponunun ilişkisi
  goal: İki mekanizmanın taşıdığı bilgiyi karşılaştırmak
  needs: deterministik/stokastik MDP, sayım modeli
  q: (a) Deterministik bir MDP'de, her (s, a)'nin son gözlemini saklayan bir tekrar tamponuyla, model(s, a)
    = (r, s') saklayan tablo Dyna-Q'nun simüle ettikleri örneklerin dağılımı bakımından eş olduğunu gösterin.
    (b) Stokastik MDP'de sayım modelinin tek gözlem tekrarından neyi fazladan taşıdığını açıklayın.
  rubric:
  - Deterministik durumda her (s, a) için tek bir (r, s') olası olduğunu ve modelin son gözlemi saklamanın
    tam bilgi olduğunu yazdım
  - Her iki mekanizmanın da aynı (s, a) kümesinden örnekleme yapıp aynı (r, s') değerlerini ürettiğini, dolayısıyla
    Q güncellemelerinin dağılışının aynı olduğunu gösterdim
  - Stokastik durumda tamponun tek bir realized örneği (bir olasılık yolu) tekrarladığını, sayım modelinin
    ise gözlemlerin görece sıklıklarıyla P̂(s'|s, a) ürettiğini belirttim
  - Sayım modelinin gözlenen tek geçişlerden farklı ardışık yollar üretebildiğini; bütün gözlemleri tutan tamponun
    aynı ampirik dağılımı taşıyabileceğini, son gözlem tamponunun bundan ayrıldığını belirttim.
  - Sinir ağı Q ile tamponun da genelleme yaptığını (parametre değişimi benzer durumlara taşar) not ettim
  hints:
  - Deterministik ortamda 'son gözlem' ile 'tek doğru gözlem' aynı şey midir?
  solution: '(a) Deterministik MDP''de (s, a)''nın çıktısı tektir; son gözlem = tek gözlem. Tampon da model
    de aynı (r, s'') değerini verir; ikisi de aynı görülmüş (s, a) kümesinden örneklendiği için Q güncellemelerinin
    dağılımı aynıdır. (b) Stokastik ortamda tampon realized bir yolu tekrar eder; sayım modeli P̂(s''|s, a)
    = n(s,a,s'')/n(s,a) ile beklenen geçişi temsil eder: örnekleme, gözlemlenen s'' değerleri arasında sıklıklarına
    göre seçim yapar ve (planlama turları biriktikçe) gerçekleşmiş olandan farklı birleşik yollar üretebilir.
    Bilgi farkı budur; tablo Q''da ikisi arasındaki en büyük pratik fark dağılımdadır.


    Kesinlik koşulu: eşlik, aynı çift-örnekleme dağılımı altında geçerlidir. Dyna önce durum/sonra eylem seçiyor
    ama tampon olayları sıklıklarına göre seçiyorsa eş dağılım çıkmaz. Stokastik ortamda bütün gözlemleri tutan
    tampon ile aynı ampirik dağılımdan örnekleyen sayım modeli aynı bir-adım dağılımını taşıyabilir; her tamponu
    yalnız tek-son-gözlem sanmayın. Tablo model hiç gözlenmemiş yeni bir ardıl sonucu genelleme yoluyla üretmez;
    geçmişteki tek-geçişlerin yeni ardışık birleşimleri mümkündür.'
- id: p7
  title: Çok adım planlamanın yerini tutar mı?
  type: açıkla
  level: 2
  goal: Çok adım planlamanın yerini tutar mı?
  needs: n-adım TD, Dyna ve model bilgisi
  q: 'Şekil 8.3’te planlamasız yöntem tek-adımlı olduğu için yavaş görünüyor. Bölüm 7’nin çok-adımlı yöntemlerinden
    biri Dyna kadar iyi olabilir mi? Neden?


    Kaynak: Sutton ve Barto (2018), s.166, Alıştırma 8.1.'
  solution: Çok adım, gözlenen yörüngenin daha uzun bölümündeki ödülü tek güncellemeyle geriye taşır; bu labirentte
    tek-adımdan hızlı olup Dyna'ya yaklaşabilir. Ancak her gerçek geçişte bir hedef üretmek, modelde daha önce
    öğrenilmiş birçok alternatif yol/öncül üzerinde n simüle yedek yapmakla aynı değildir. Dyna o anki yol
    dışındaki kayıtlı geçişleri tekrar kullanır; n-adım yalnız o güncellemenin gözlenen dizisini işler. Ödül
    seyrekse ilk keşiften önce ikisi de bilgi üretemez. Hesap bütçesi, n, α ve dağılıma göre sonuç değişir;
    bütün görevlerde n-adımın Dyna'ya eş veya zayıf olduğu söylenemez. Yakın performans mümkün, genel ikame
    garantisi yok.
  rubric:
  - Uzun yolda ödül yayılımı
  - Önceki model geçişleri/alternatif yollar
  - İlk keşif ve bütçe sınırı
  - Mümkünlük ile garanti ayrımı
  hints:
  - Bir önceki bölümde görülen ama şu anki yolda olmayan bir geçiş nerede kullanılır?
- id: p8
  title: Q+ değişimden önce neden yararlı?
  type: açıkla
  level: 2
  goal: Q+ değişimden önce neden yararlı?
  needs: Dyna-Q+ planlama bonusu ve denenmemiş eylemler
  q: 'Dyna-Q+ keşfi teşvik ederken, engelleme ve kısayol görevlerinin değişimden önceki ilk evresinde de neden
    daha iyi performans gösterebilir?


    Kaynak: Sutton ve Barto (2018), s.168, Alıştırma 8.2.'
  solution: 'Daha çok eylemi denemek, ilk evrede de hedefe kısa yolları daha erken buldurabilir; bonus gelecekte
    ulaşılacak geçişlerin değerini model yedekleriyle geriye taşır. Ayrıca s.168 dipnotu sıradan Dyna''dan
    iki fark daha getirir: görülen durumdaki hiç denenmemiş eylemler planlanır ve ödül 0 öz döngüyle başlatılır.
    İlk evredeki fark yalnız çevrenin henüz değişmiş olmasına bağlanmaz. Kendi 30 koşu n 50/α1/κ.001 deneyimizde
    ilk evre gerçek ödülleri engellemede Q 48.9333/Q+71.6; kısayolda 128.3333 / 136.1. Fazla keşif başka ayarlarda
    kaybettirebilir; bu genel üstünlük teoremi değildir.'
  rubric:
  - İlk evrede keşif yararı
  - Bonustan ayrı iki model farkı
  - Gerçek ödüle bonus katılmadı
  - Sonuç sınırı
  hints:
  - Değişimden önce de ajan başlangıçta hangi yolları bilmiyor?
- id: p9
  title: İlk evrede aradaki fark neden daralır?
  type: yorumla
  level: 2
  goal: İlk evrede aradaki fark neden daralır?
  needs: Birikimli ödül, keşif maliyeti
  q: 'Şekil 8.5’te Dyna-Q+ ile Dyna-Q birikimli ödülleri arasındaki farkın ilk evrenin bir kısmında biraz daralmasını
    açıklayın.


    Kaynak: Sutton ve Barto (2018), s.168, Alıştırma 8.3.'
  solution: Q+ daha çabuk iyi yola ulaşmış olabilir; zamanla sıradan Q da ilk evredeki kısa yolu öğrenir ve
    keşfe daha az maliyet harcayarak hızlı ödül biriktirir. Q+ uzun süredir denenmemiş hareketleri sınamayı
    sürdürdüğü için o aralıkta eğimi daha düşük olabilir. Birikimli farkın daralması Q+'nın geçmiş kazançlarının
    yok olduğu veya bonusun hesapta negatif olduğu anlamına gelmez. Kaynak şeklinin gözlemidir; her tohum/κ'da
    daralma zorunlu değil. Modelin henüz denenmemiş eylemleri açmasının etkisi de bonusla karıştırılmamalı.
  rubric:
  - Eğri farkı ile eğim ayrımı
  - Q yetişirken Q+ keşif maliyeti
  - Genel garanti yapılmadı
  hints:
