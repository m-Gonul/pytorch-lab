  rubric:
  - Terminal devam 0
  - Beklenen ödül 0
  - Örnek±1
  - Ödül deterministik/beklenen kullanılırsa eşitlik
  solution: Beklenen hedef 0, tek örnek hedefi−1 veya+1; α1 bu hedefi doğrudan atar. Aynı olası ardıl sayısı
