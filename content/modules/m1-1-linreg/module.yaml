id: m1-1-linreg
code: M1.1
title: "Linear regression: kapalı form ve gradient descent"
phase: 1
minutes: 210
prereq: [m0-2-matmul, m0-3-chain-rule]
summary: >
  İlk öğrenen model. Üç noktalık bir veri setinde bir gradient descent adımını
  elle atıyor, aynı adımı döngüyle ve NumPy'da yazıyor, pandas DataFrame'inden
  özellik isimleriyle model kuruyor, `nn.Linear` ile eğitiyor ve en sonda 64
  farklı learning rate'i tek seferde eğitiyorsun.
goals:
  - "[[mse|MSE]] kaybının gradyanını $\\nabla_w L=\\tfrac{2}{n}X^\\top(Xw+b-y)$ olarak türetmek"
  - "[[gradient descent|Gradient descent]] ile kapalı form (normal denklem) çözümünün aynı noktaya gittiğini göstermek"
  - "Örnekler üzerindeki döngüyü kaldırıp yalnız zaman (adım) döngüsünü bırakmak"
  - "`nn.Linear`, `optim.SGD`, `MSELoss` üçlüsünün elle yazdığın kodla birebir eşdeğer olduğunu doğrulamak"
  - "Birbirinden bağımsız $L$ modeli tek tensör olarak eğitmek ([[learning rate]] taraması)"
sources:
  - {title: "Stanford CS229 — Lecture notes: Linear regression, LMS, normal equations", url: "https://cs229.stanford.edu/main_notes.pdf", license: "doğrulanmadı", use: link}
  - {title: "ISLP — An Introduction to Statistical Learning (Python), Bölüm 3", url: "https://www.statlearning.com/", license: "doğrulanmadı", use: link}
  - {title: "Dive into Deep Learning §3.1–3.5 Linear Regression (scratch + concise)", url: "https://d2l.ai/chapter_linear-regression/index.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "PyTorch — nn.Linear, torch.optim.SGD", url: "https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html", license: "BSD-3", use: adapt}
  - {title: "Anscombe — Graphs in Statistical Analysis (The American Statistician 27(1), 1973)", url: "https://doi.org/10.1080/00031305.1973.10478966", license: "doğrulanmadı", use: link}

hand:
  groups:
    - title: "Veri $x=[1,2,3]$, $y=[2,4,5]$; başlangıç $w=0$, $b=0$. Hatalar $e_i=\\hat y_i-y_i$"
      fields:
        - {id: e1, label: "$e_1$", answer: -2, hint: "$\\hat y_1 = 0\\cdot1+0 = 0$, $0-2$"}
        - {id: e2, label: "$e_2$", answer: -4, hint: "$0-4$"}
        - {id: e3, label: "$e_3$", answer: -5, hint: "$0-5$"}
        - {id: L, label: "$L=\\frac1n\\sum e_i^2$", answer: 15, hint: "$(4+16+25)/3$"}
    - title: "Gradyan ve bir adım, $\\eta=0.1$"
      fields:
        - {id: gw, label: "$\\partial L/\\partial w=\\frac2n\\sum e_ix_i$", answer: -16.6667, tol: 0.01, hint: "$\\frac23(-2\\cdot1-4\\cdot2-5\\cdot3)=\\frac23(-25)$"}
        - {id: gb, label: "$\\partial L/\\partial b=\\frac2n\\sum e_i$", answer: -7.3333, tol: 0.01, hint: "$\\frac23(-11)$"}
        - {id: w1, label: "$w\\leftarrow w-\\eta\\,\\partial L/\\partial w$", answer: 1.66667, tol: 0.01, hint: "$0-0.1\\cdot(-16.67)$"}
        - {id: b1, label: "$b\\leftarrow b-\\eta\\,\\partial L/\\partial b$", answer: 0.73333, tol: 0.01, hint: "$0-0.1\\cdot(-7.33)$"}
    - title: "Kapalı form: $w^*=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sum(x_i-\\bar x)^2}$, $b^*=\\bar y-w^*\\bar x$"
      fields:
        - {id: ws, label: "$w^*$", answer: 1.5, tol: 0.001, hint: "$\\bar x=2$, $\\bar y=11/3$; pay $=(-1)(-\\tfrac53)+0+(1)(\\tfrac43)=3$, payda $=2$"}
        - {id: bs, label: "$b^*$", answer: 0.66667, tol: 0.005, hint: "$\\tfrac{11}{3}-1.5\\cdot2$"}
        - {id: Ls, label: "En iyi kayıp $L(w^*,b^*)$", answer: 0.055556, tol: 0.001, hint: "tahminler $[2.1\\overline6,\\;3.6\\overline6,\\;5.1\\overline6]$; hataların kareleri $\\tfrac1{36},\\tfrac19,\\tfrac1{36}$"}
  verify: |
    xs, ys = [1, 2, 3], [2, 4, 5]
    n = 3; w = b = 0.0; lr = 0.1
    e = [w * x + b - y for x, y in zip(xs, ys)]
    gw = 2 / n * sum(ei * x for ei, x in zip(e, xs)); gb = 2 / n * sum(e)
    xm, ym = sum(xs) / n, sum(ys) / n
    ws = sum((x - xm) * (y - ym) for x, y in zip(xs, ys)) / sum((x - xm) ** 2 for x in xs)
    bs = ym - ws * xm
    Ls = sum((ws * x + bs - y) ** 2 for x, y in zip(xs, ys)) / n
    answers = dict(e1=e[0], e2=e[1], e3=e[2], L=sum(v * v for v in e) / n,
                   gw=round(gw, 4), gb=round(gb, 4), w1=round(w - lr * gw, 5), b1=round(b - lr * gb, 5),
                   ws=ws, bs=round(bs, 5), Ls=round(Ls, 6))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

hints:
  b:
    - "gd_step'te kayıp ve gradyanı aynı döngüde biriktir: her örnek için e = w*x + b − y; loss += e*e/n; gw += 2*e*x/n; gb += 2*e/n."
    - "Güncellemeyi döngü bittikten sonra yap: w = w − lr*gw. Kayıp, güncellemeden önceki (w, b) ile hesaplanmalı (yazılımdaki sözleşme bu)."
    - "fit, gd_step'i steps kez çağırır; closed_form'da x̄, ȳ ve iki toplamı tek geçişte hesapla."
  c:
    - "Tasarım matrisi: Xt = np.column_stack([X, np.ones(len(X))]) — bias hilesi; sonra np.linalg.lstsq (inv alma)."
    - "fit_gd'de örnek döngüsü kalkar: e = X @ w + b − y; w = w − lr*(2/n)*(X.T @ e). Tek katman döngü yalnız adımlar içindir."
    - "fit_df'te katsayıları özellik isimleriyle döndür: pd.Series(w, index=feats.columns)."
  d:
    - "one_step_grads'ta w ve b'yi torch.tensor(0.0, requires_grad=True) yarat; pred = w*x + b; pred'in (n,) olduğundan emin ol."
    - "loss.backward() sonrası w.grad, b.grad'e bak; .grad birikir, her adımda opt.zero_grad() şart."
    - "fit_torch'ta pred = model(X).squeeze(-1): (n,1) ile y (n,) karşılaştırılırsa yayılım (n,n) üretir ve kayıp sessizce yanlış olur."
  e:
    - "W: (L, d) ve b: (L,) tensörler; tahmin X @ W.T + b → (n, L): her sütun bir model."
    - "Kayıplar her model için ayrı: ((pred - y[:, None]) ** 2).mean(dim=0) → (L,)."
    - "loss.sum().backward() yeter: her W[:, j] yalnız kendi kaybında yer alır (sınamanın 3. sorusu). Güncelleme: W -= lrs[:, None] * W.grad."

quiz:
  - q: "Özellikleri standardize etmeden (ör. biri metre, biri milimetre) gradient descent neden yavaş yakınsar?"
    options:
      - {t: "Kayıp yüzeyi bir yönde çok dik, diğerinde çok yassı olur; tek bir learning rate ikisine birden uymaz", ok: true, why: "$X^\\top X$'in koşul sayısı büyür. Büyük $\\eta$ dik yönde salınır/ıraksar, küçük $\\eta$ yassı yönde sürünür."}
      - {t: "Normal denklem çözülemez hâle gelir", why: "Normal denklem ölçekten etkilenmez (sayısal koşul hariç); sorun GD'nin adım büyüklüğünde."}
      - {t: "MSE negatif olabilir", why: "Kareler toplamı her zaman ≥ 0."}
  - q: "`nn.Linear(3, 1)`'in `weight` shape'i nedir ve ileri geçiş ne hesaplar?"
    options:
      - {t: "`(1, 3)`; `x @ weight.T + bias`", ok: true, why: "PyTorch ağırlığı `(out_features, in_features)` saklar. M0.2'deki shape sınamasıyla aynı mantık."}
      - {t: "`(3, 1)`; `x @ weight + bias`", why: "Sonuç sayısal olarak aynı olurdu ama PyTorch'un saklama düzeni böyle değil."}
      - {t: "`(3,)`; `x · weight`", why: "Çıkış boyutu 1 olsa da ağırlık 2 boyutludur."}
  - q: "e aşamasında 64 modeli `loss.sum().backward()` ile birlikte eğitmek neden doğru gradyanı verir?"
    options:
      - {t: "Her modelin kaybı yalnız kendi parametrelerine bağlı; toplamın $W_\\ell$'ye göre türevi yalnız $L_\\ell$'nin türevi", ok: true, why: "$\\partial(\\sum_k L_k)/\\partial W_\\ell=\\partial L_\\ell/\\partial W_\\ell$ çünkü $k\\ne\\ell$ için $L_k$, $W_\\ell$'yi içermez. Ortalama alsaydın gradyanlar $1/L$ ile ölçeklenirdi."}
      - {t: "Toplam kaybı küçültmek her modelin kaybını eşit küçültür", why: "Asıl neden parametrelerin ayrık olması; kayıpların eşit azalması gerekmez."}
      - {t: "Doğru vermez; her model için ayrı backward şart", why: "Parametreler paylaşılmadığı sürece tek backward yeterli. Bu, M0.3'teki toplam hilesinin aynısı."}
  - q: "Kararlılık sınırı η < 2/λ_max'ta tam η = 2/λ_max seçersen λ_max yönünde ne olur?"
    options:
      - {t: "Hata hiç sönmez: |1 − ηλ_max| = 1, işaret değiştiren sabit büyüklüklü salınım sürer", ok: true, why: "Sınırın üstünde |1 − ηλ| > 1: hata büyür (ıraksama), tam sınırdaysa büyüklük korunur. λ_min yönünde yine ilerler. l1 deneyinde η'yi sınıra getirerek gör."}
      - {t: "Tek adımda optimuma gider", why: "Tek adım ancak H çapraz olduğunda (standartlaştırılmış, η = 1/2) tüm yönlerde eşzamanlı mümkündür."}
      - {t: "η büyüdükçe her zaman hızlanır", why: "Kararlılık sınırına kadar hızlanır; sınırda salınım, üstünde ıraksama."}
  - q: "pred'in shape'i (n, 1), y'ninki (n,). (pred − y).mean() hesabı neden yanlış?"
    options:
      - {t: "Yayılım eksenleri hizalar: sonuç (n, n) olur; kayıp çapraz hataların ortalamasıdır", ok: true, why: "(n,1) − (n,) → (n,n). MSE'nin değeri yanlış, backward'ı da bozuk. Önce squeeze(-1) ya da reshape şart."}
      - {t: "PyTorch bunu otomatik düzeltir", why: "nn.MSELoss bu durumda uyarı basar; elle yazılan kayıpta hata tamamen sessizdir."}
      - {t: "Sonuç yine (n,) olur, sorun yok", why: "(n,1) ile (n,) çıkarımında son eksen kaldırılmaz; çıkarım (n,n)'e yayınlanır."}

homework:
  - title: "Golub & Reinsch (1970): SVD ve en küçük kareler"
    paper: "Golub & Reinsch — Singular Value Decomposition and Least Squares Solutions (Numerische Mathematik 1970)"
    url: "https://link.springer.com/article/10.1007/BF02163027"
    level: orta
    hours: 6
    goal: |
      En küçük kareleri dört yolla çöz: normal denklemler, QR (Householder), SVD ve kesilmiş SVD (küçük tekil değerleri at). Koşul sayısı 10²…10¹² olan tasarım matrislerinde (ör. Vandermonde / polinom regresyonu) çözüm hatasını ve kalıntıyı karşılaştır; normal denklemlerin hatanın κ², QR/SVD'nin κ ile büyüdüğünü göster. Kesilmiş SVD'nin ridge'e (M1.3) benzer düzenleyici etkisini tartış.
    steps:
      - "Kesin çözümü bilinen sentetik problemler kur (x* seç, b = Ax* + küçük gürültü)."
    accept:
      - "Hata–κ grafiği: normal denklemler κ², QR/SVD κ."
      - "Kesilmiş SVD'nin gürültülü veride daha iyi genelleme örneği."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Kapalı formu sıfırdan türet
    goal: En küçük kareler çözümünün nereden geldiğini görmek
    needs: Kısmi türev, toplam sembolü
    q: |-
      $L(w,b)=\frac1n\sum_i(wx_i+b-y_i)^2$'yi en küçükleyen $w^*,b^*$'yi türet.
    solution: |-
      **1. Durağan nokta koşulu.** $L$, $(w,b)$'nin karesel ve dışbükey bir fonksiyonu (Hessian'ı $\frac2n\begin{bmatrix}\sum x_i^2&\sum x_i\\\sum x_i&n\end{bmatrix}$, en az iki farklı $x_i$ varsa pozitif tanımlı). Dışbükey bir fonksiyonda gradyanın sıfır olduğu nokta küresel minimumdur.

      **2. $b$'ye göre türev:** $\frac{\partial L}{\partial b}=\frac2n\sum_i(wx_i+b-y_i)=0\Rightarrow b=\bar y-w\bar x$. Yorum: en iyi doğru, verinin ağırlık merkezi $(\bar x,\bar y)$'den geçer.

      **3. $w$'ye göre türev:** $\frac{\partial L}{\partial w}=\frac2n\sum_i(wx_i+b-y_i)x_i=0$. Buraya $b=\bar y-w\bar x$ koy: $\sum_i\big(w(x_i-\bar x)-(y_i-\bar y)\big)x_i=0$.

      **4. Merkezleme hilesi:** $\sum_i(x_i-\bar x)=0$ olduğundan $x_i$ yerine $x_i-\bar x$ yazılabilir (eklenen terim $\bar x\sum(\dots)=0$). Böylece $w\sum(x_i-\bar x)^2=\sum(x_i-\bar x)(y_i-\bar y)$, yani
      $$w^*=\frac{\sum_i(x_i-\bar x)(y_i-\bar y)}{\sum_i(x_i-\bar x)^2}=\frac{\mathrm{Cov}(x,y)}{\mathrm{Var}(x)}.$$

      **Ne söylemez:** $w^*$ nedensellik değildir; yalnız doğrusal ilişkinin en iyi kareler özetidir. Payda 0 ise (bütün $x_i$ aynı) türetim 3. adımda tıkanır: tek çözüm yoktur (P6).
    alt: |-
      Matris biçimi: $X=[\mathbf x\ \mathbf 1]$, $\theta=[w,b]^\top$. $L=\frac1n\|X\theta-y\|^2$, $\nabla_\theta L=\frac2nX^\top(X\theta-y)=0\Rightarrow X^\top X\theta=X^\top y$ (normal denklemler). Geometrik okuma: artık $X\theta-y$, $X$'in sütun uzayına diktir — $X\theta^*$, $y$'nin bu uzaya dik izdüşümüdür.
  - id: p2
    type: hesap
    level: 1
    title: Üç noktada eğim
    goal: Kapalı form eğimini hesaplamak
    needs: P1'deki formül
    q: |-
      $x=[0,1,2]$, $y=[1,3,2]$. En küçük kareler eğimi $w^*$ kaç?
    answer: 0.5
    calc: "1/2"
    mistakes:
      - {answer: 1.4, msg: "Ortalamaları çıkarmadan Σxy/Σx² kullandın: bu, b = 0'a zorlanmış (orijinden geçen) doğrunun eğimi."}
      - {answer: 0.3333333333333333, msg: "Paydada n·Var yerine Σ(x−x̄)²'yi n ile bölmüşsün ama payı bölmemişsin; ikisi aynı ölçekte olmalı."}
    hints:
      - "$\\bar x=1$, $\\bar y=2$."
      - "Merkezlenmiş değerler: $x-\\bar x=[-1,0,1]$, $y-\\bar y=[-1,1,0]$."
    solution: |-
      $\sum(x_i-\bar x)(y_i-\bar y)=(-1)(-1)+0\cdot1+1\cdot0=1$, $\sum(x_i-\bar x)^2=2$ → $w^*=1/2$. $b^*=\bar y-w^*\bar x=1.5$.
    alt: |-
      Normal denklemler: $X^\top X=\begin{bmatrix}5&3\\3&3\end{bmatrix}$, $X^\top y=\begin{bmatrix}7\\6\end{bmatrix}$; çözüm $[0.5,\ 1.5]$.
  - id: p3
    type: tamamla
    level: 1
    title: Kesişim terimi
    goal: $b^*=\bar y-w^*\bar x$ adımını uygulamak
    needs: P2
    q: |-
      P2'deki verinin en iyi kesişimi $b^*$ kaç?
    answer: 1.5
    calc: "2-0.5*1"
    mistakes:
      - {answer: 2.0, msg: "b* = ȳ yalnız x̄ = 0 iken doğru; burada x̄ = 1, w*x̄ terimini çıkar."}
    hints:
      - "En iyi doğru $(\\bar x,\\bar y)$'den geçer."
    solution: |-
      $b^*=\bar y-w^*\bar x=2-0.5\cdot1=1.5$.
  - id: p4
    type: hata-bul
    level: 2
    title: Kayıp neden artıyor?
    goal: Gradyanın işaretini kontrol etmek
    needs: Zincir kuralı (M0.3)
    q: |-
      Aşağıdaki GD döngüsünde kayıp her adımda büyüyor:
      ```python
      e = y - (w * x + b)
      w -= lr * 2 * np.mean(e * x)
      b -= lr * 2 * np.mean(e)
      ```
      Hata nerede?
    choices:
      - {t: "Öğrenme oranı çok büyük", why: "Küçük lr ile de kayıp büyür: yön yanlış, büyüklük değil."}
      - {t: "Hata y − ŷ olarak tanımlanmış; bu tanımla gradyan −2·mean(e·x) olur, güncelleme işareti ters", ok: true, why: "$\\partial L/\\partial w=\\frac2n\\sum(\\hat y-y)x=-\\frac2n\\sum ex$. Ya e = ŷ − y tanımla ya da `w += ...` yaz."}
      - {t: "np.mean yerine np.sum kullanılmalı", why: "Toplam yalnız ölçeği değiştirir (lr ile telafi edilir), yönü değil."}
    hints:
      - "Gradyanı kendi tanımladığın $e$ cinsinden yeniden türet."
    solution: |-
      $L=\frac1n\sum(\hat y-y)^2$, $\partial L/\partial w=\frac2n\sum(\hat y-y)x$. Kodda $e=y-\hat y$, yani gerçek gradyan $-\frac2n\sum ex$. `w -= lr*2*mean(e*x)` gradyan **artı** yönde (yokuş yukarı) adım atar. Düzeltme: `e = (w*x + b) - y`. Genel alışkanlık: gradyanı sayısal farkla bir kez kontrol et (M0.3 gradyan kontrolü).
  - id: p5
    type: yorumla
    level: 2
    title: Artık grafiği U çiziyor
    goal: Model varsayımını artıklarla sınamak
    needs: Artık kavramı
    q: |-
      Doğrusal modelin artıklarını ($y_i-\hat y_i$) $x_i$'ye karşı çizdin: küçük ve büyük $x$'te pozitif, ortada negatif — U şekli. Ne anlama gelir?
    choices:
      - {t: "Gürültü fazla; daha çok veri topla", why: "Gürültü sistematik bir şekil üretmez; artıklar rastgele dağılırdı."}
      - {t: "İlişki doğrusal değil; x² gibi bir öznitelik eksik", ok: true, why: "Artıklarda kalan yapı, modelin yakalayamadığı sinyaldir."}
      - {t: "Öğrenme oranı yanlış", why: "Kapalı form çözümünde lr yok; şekil modelin kendisinden."}
    hints:
      - "İyi bir modelin artıkları $x$'ten bağımsız, sıfır çevresinde rastgele saçılır."
    solution: |-
      U şekli, gerçek ilişkinin eğrisel olduğunu gösterir: doğru, uçlarda veriyi altta, ortada üstte bırakır. Çözüm modeli parametrelerde doğrusal tutup özniteliği genişletmek ($[x, x^2]$) — M1.3'teki polinom deneyi.
  - id: p6
    type: karşı-örnek
    level: 3
    title: Tek çözüm ne zaman yok?
    goal: Kapalı formun varsayımını bulmak
    needs: P1
    q: |-
      "En küçük kareler problemi her zaman tek bir çözüme sahiptir" iddiasına bir karşı örnek ver ve hangi adımın bozulduğunu söyle. Sonra bu durumda hangi çözümü seçmenin makul olduğunu öner.
    rubric:
      - "Tüm $x_i$'lerin eşit olduğu (ya da çok boyutta sütunların doğrusal bağımlı olduğu) bir veri örneği verdim"
      - "$\\sum(x_i-\\bar x)^2=0$ / $X^\\top X$'in tekil olduğunu belirttim"
      - "Sonsuz çözümün aynı tahminleri verdiğini (artık aynı) açıkladım"
      - "En küçük normlu çözüm (sözde ters) ya da ridge önerdim"
    hints:
      - "P1'in 4. adımında paydaya bak."
      - "Çok boyutta: iki öznitelik birbirinin katıysa ne olur?"
    solution: |-
      Örnek: $x=[2,2,2]$, $y=[1,2,3]$. $\sum(x_i-\bar x)^2=0$; $w$ belirsiz: her $w$ için $b=\bar y-2w$ aynı kaybı verir (hepsi $\hat y=2$ tahmin eder). Matris dilinde $X^\top X$ tekil, normal denklemlerin sonsuz çözümü var. Seçim: en küçük normlu çözüm $\theta=X^+y$ (`np.linalg.lstsq` bunu verir) ya da ridge ($X^\top X+\lambda I$ tersinir). Pratikte daha sık görülen hâl "neredeyse tekil": çok ilişkili öznitelikler katsayıları kararsız ve dev yapar.
  - id: p8
    type: hesap
    level: 2
    title: Özdeğerlerden en iyi learning rate
    goal: Kararlılık ve hız formüllerini uygulamak
    needs: Kararlılık türetimi, özdeğer kavramı
    q: |-
      Tek öznitelikli bir veride $H=\frac2n\tilde X^\top\tilde X$'in özdeğerleri $\lambda_{\max}=25$, $\lambda_{\min}=1$ olsun. Kararlılık üst sınırı $2/\lambda_{\max}$'ın hemen altında duran, ama **en iyi sabit** olan $\eta^*=\frac2{\lambda_{\max}+\lambda_{\min}}$ kaç? (ondalıklı yaz, 3 basamak)
    answer: 0.07692307692307693
    tol: 0.0006
    calc: "2/(25+1)"
    mistakes:
      - {answer: 0.08, msg: "2/λ_max = 0.08 kararlılık **üst sınırıdır**, en iyi sabit değil; hız için 2/(λ_max+λ_min)."}
      - {answer: 0.04, msg: "1/λ_max çok muhafazakâr: λ_min yönünde gereksiz yavaş sürünür."}
      - {answer: 1.0, msg: "1/(λ_min) yönünde kararlılık sınırını (0.08) aşar: ıraksarsın."}
    hints:
      - "Kararlılık: $0<\\eta<2/\\lambda_{\\max}$."
      - "En iyi sabit: $\\eta^*=\\frac2{\\lambda_{\\max}+\\lambda_{\\min}}$ — iki ucu da dengeleyen değer."
      - "Kontrol: $\\kappa=25$, daralma $\\frac{\\kappa-1}{\\kappa+1}=\\frac{24}{26}$."
    solution: |-
      $\eta^*=\frac2{26}\approx0.0769$ — ıraksama sınırı $0.08$'in hemen altında. Bu seçimle daralma oranı $\rho=\frac{24}{26}\approx0.923$: her adımda hata ~%7.7 azalır; $10^{-6}$'ya inmek $\ln(10^{-6})/\ln(0.923)\approx80$ adım. $\eta=0.08$ (sınırda) λ_max yönünde hiç sönmez; $\eta=0.04$ (1/λ_max) yaklaşık iki kat yavaştır. l1 deneyinde bu üç η'yi tek tek dene.
  - id: p9
    type: yorumla
    level: 2
    title: R² 0.9 diyor, desen U çiziyor
    goal: Artık deseninden model yanlışlığını tanımak
    needs: Değerlendirme bölümü, R² tanımı
    q: |-
      l4 deneyinde "karesel gerçek" senaryosunu seç. Doğrusal uydurmanın $R^2$'si 0.9'a yakın çıkabilir ama artıklar U deseni çizer.
      (a) $R^2$ neden bu kadar yüksek kalabiliyor? (b) Artıklardaki desen eksik terimi nasıl, katsayısıyla birlikte nasıl ele veriyor?
    choices:
      - {t: "(a) R² yalnız açıklanan varyans oranıdır, biçim doğruluğu değil; (b) U deseni eksik x²'yi, imza katsayısı değerini verir", ok: true, why: "$R^2$ yanlış biçimli bir modelde de yüksek olabilir (Anscombe, Şekil 3). Artık $r\\approx-0.8(x^2-\\bar{x^2})$ kalır; deney tablosundaki imza (artıkları merkezlenmiş x²'ye uyduran katsayı) tam bu değeri döndürür."}
      - {t: "(a) R² yanlış hesaplanıyor; (b) desen rastgele gürültüdür", why: "R² tanımı doğru; gürültü desensizdir, desen sistematik yanlışlıktır."}
      - {t: "(a) Aykırı değerler R²'yi yükseltir; (b) aykırıları atmak gerekir", why: "Senaryoda aykırı yok; sorun ortalama fonksiyonun biçimindedir. Aykırı atmak desen sorunu için ilaç değildir."}
    hints:
      - "$R^2=1-\\sum e_i^2/\\sum(y_i-\\bar y)^2$: payda $y$'nin varyansı. Kimin varyansı açıklanıyor?"
      - "Artıkları $x^2$'ye (merkezlenmiş) uydur; deneyin tablosundaki imza bu."
    solution: |-
      (a) $R^2$, toplam varyansın ne kadarının açıklandığını ölçer; $x$ terimi varyansın çoğunu açıkladığı için eksik $x^2$ bile yüksek $R^2$ bırakır — **açıklanan oran** ile **yanlış biçim** ayrı sorulardır. (b) Doğrusal model $\\hat y=wx+b$ uydurunca $r=\\hat y-y$ içinde $-0.8(x^2-\\bar{x^2})$ kalır (artık, uydurulan alt-uzama diktir; $x^2$ o uzamda yok). Merkezleme şarttır: $x^2$'nin ortalaması bias'a emilir, ham $x^2$'ye uydurmak katsayıyı düşük gösterir. Çözüm öznitelik genişletmek: $[x, x^2]$ ile aynı formüller — E1 alıştırmasında kodla.
  - id: p7
    type: uyarla
    level: 3
    title: Aykırı değerli fiyat verisi
    goal: Kayıp seçimini veriye uydurmak
    needs: MSE'nin Gauss olabilirliğiyle ilişkisi
    q: |-
      Ev fiyatı tahmini yapıyorsun; verinin %2'si girişte yanlış yazılmış (fiyat 10 kat büyük). MSE mi, MAE mi, Huber mı? Seçimini gerekçelendir ve bedelini söyle.
    rubric:
      - "MSE'nin büyük hataları karesiyle cezalandırdığı için aykırı değerlere duyarlı olduğunu söyledim"
      - "MSE = Gauss gürültü, MAE = Laplace gürültü varsayımı bağlantısını kurdum"
      - "Huber'ın küçük hatada karesel, büyükte doğrusal olduğunu ve δ eşiği seçimini belirttim"
      - "Bedeli (MAE'de türevin 0'da tanımsız oluşu, koşullu medyanı tahmin etmesi; kapalı form yok) söyledim"
      - "Veriyi temizlemenin (aykırı değeri bulmanın) kayıp değiştirmekten önce düşünülmesi gerektiğini ekledim"
    hints:
      - "Tek bir 10× hatalı nokta MSE'ye ne kadar katkı yapar?"
    solution: |-
      MSE, Gauss gürültüsü altında en çok olabilirlik kestirimidir ve koşullu **ortalamayı** tahmin eder; hatalı bir noktanın katkısı hatasının karesiyle büyüdüğü için doğruyu ona doğru çeker. MAE (Laplace gürültüsü) koşullu **medyanı** tahmin eder; aykırı değer etkisi doğrusal ve sınırlıdır, ama 0'da türevi tanımsız ve kapalı formu yok. Huber ikisinin arası: $|e|\le\delta$ için $\frac12e^2$, sonrası $\delta(|e|-\frac\delta2)$; δ'yı "normal" hata ölçeğinde seç (ör. artıkların medyan mutlak sapmasının ~1.35 katı). Önce: hatalı girişler bulunabiliyorsa düzelt — kayıp seçimi, bilinmeyen kirliliğe karşı sigortadır.
pitfalls:
  - wrong: "R² yüksekse model doğrudur."
    right: "R² yalnız açıklanan varyans oranıdır; yanlış biçimli bir model de yüksek R² verebilir."
    why: "Anscombe'un dörtlüsü: aynı R², aynı doğru, bambaşka veriler. Her zaman artıkları çiz (P5)."
  - wrong: "Doğrusal regresyon yalnız düz çizgi uydurur."
    right: "Model **parametrelerde** doğrusaldır; öznitelikler ($x^2$, $\\sin x$, etkileşimler) doğrusal olmayabilir."
  - wrong: "Kapalı form her zaman en iyi yöntemdir."
    right: "$X^\\top X$'i kurmak koşul sayısının karesini alır ve $O(d^3)$ maliyetlidir; QR/SVD tabanlı `lstsq` ya da büyük veride GD tercih edilir."
whatif:
  - q: "Gürültü Gauss değil de ağır kuyruklu (ör. ara sıra dev hatalar) olsaydı?"
    a: "MSE'nin olabilirlik gerekçesi kalkar; birkaç uç nokta çözümü sürükler. Sağlam kayıplar (MAE, Huber) ya da RANSAC (M9.15) gerekir."
  - q: "Bir öznitelik başka bir özniteliğin tam kopyası olsaydı?"
    a: "$X^\\top X$ tekil olur, sonsuz çözüm vardır; katsayılar ikisi arasında keyfi bölüşülür. Tahminler değişmez, yorum anlamsızlaşır. Ridge ya da öznitelik eleme."
  - q: "η'yi tam olarak $2/\\lambda_{\\max}$ seçseydik?"
    a: "λ_max yönünde $|1-\\eta\\lambda|=1$: hata hiç sönmez, işaret değiştiren sabit büyüklüklü bir salınım sürer; λ_min yönü yavaş ilerlemeye devam eder. Sınır kesin bir eşiktir, çünkü bu kayıp tam ikinci derecedendir. l1 deneyinde η'yi 2/λ_max'ın hemen altına ve üstüne getirerek iki davranışı da görebilirsin."

extras:
  - {id: x1, title: "Polinom öznitelik genişletme: U desenini kodla", engine: browser}

labs:
  - id: l1
    lab: linregfit
    title: "Kapalı form, gradyan inişi ve koşul sayısı"
    goal: |
      Veri $y=1.5x-1+\varepsilon$'dan üretilir. Sol grafik veriyi, kapalı form çözümünü (yeşil kesikli) ve GD'nin ara/son doğrularını gösterir. Orta grafik $(w,b)$ düzleminde kayıp yüzeyidir (koyu = düşük) ve GD'nin $(0,0)$'dan başlayan yolu. Sağ grafik kaybın optimumdan farkını log ölçekte verir: düz bir çizgi doğrusal (geometrik) yakınsamadır.
    predict:
      q: "x'lerin merkezini 0'dan 8'e taşırsan (aynı η ile) GD'ye ne olur?"
      options:
        - {t: "Ya ıraksar (λ_max büyüdü) ya da η'yi küçültmek zorunda kalınca çok yavaşlar (κ büyüdü)", ok: true, why: "Σx² büyüdükçe λ_max büyür, kararlılık sınırı 2/λ_max küçülür; λ_min ise küçük kalır. Vadi uzar."}
        - {t: "Hiçbir şey değişmez; veri sadece kaydı", why: "Kapalı form çözümü kaymaya uyum sağlar ama GD'nin hızı Hessian'ın şekline bağlıdır."}
        - {t: "Daha hızlı yakınsar", why: "Ters yönde: w ve b'nin etkileri karışır."}
    presets:
      - {name: "İyi koşullu", params: {c: 0, std: 0, lr: 0.3, steps: 50}, note: "x sıfır etrafında: κ küçük, GD hızlı."}
      - {name: "Uzak merkez", params: {c: 6, std: 0, lr: 0.02, steps: 300}, note: "κ yüzlerce: yol önce vadinin dik duvarına iner, sonra dipte sürünür."}
      - {name: "Iraksama", params: {c: 6, std: 0, lr: 0.06, steps: 50}, note: "η > 2/λ_max: her adımda hata büyür."}
      - {name: "Standartlaştırılmış", params: {c: 6, std: 1, lr: 0.5, steps: 5}, note: "H = 2I, η = 1/2: tek adımda optimum. Aynı veri, aynı model, yalnız öznitelik ölçeği değişti."}
      - {name: "Az veri, çok gürültü", params: {n: 5, noise: 2, c: 0, std: 0, lr: 0.3, steps: 100}, note: "Kapalı form bile gerçek doğrudan uzak: optimizasyon değil, veri sınırlayıcı (tohumu değiştir)."}
    questions:
      - q: "Kararlılık sınırını tabloda oku ve η'yi sınırın hemen altına ve hemen üstüne getir. Ne gözlüyorsun?"
        a: "Hemen altında GD salınarak (en dik yönde işaret değiştirerek) yakınsar; hemen üstünde salınım büyür ve ıraksar. 2/λ_max kesin bir eşiktir çünkü kayıp tam olarak ikinci derecedendir."
      - q: "Kayıp grafiği neden log ölçekte düz bir çizgi?"
        a: "Hata her adımda sabit bir oranla (1 − ηλ) çarpılır: geometrik dizi; log'u doğrusal. İki farklı eğim görüyorsan iki özdeğer yönü farklı hızda sönüyor demektir."
    limits: "Tek öznitelik, tam-batch GD (gürültüsüz gradyan). Kayıp yüzeyi penceresi dışına çıkan yol noktaları kenara kırpılarak çizilir. Standartlaştırmada parametreler orijinal x eksenine geri çevrilerek raporlanır."
  - id: l2
    lab: robustfit
    title: "Aykırı değerler: MSE, MAE ve Huber"
    goal: |
      Örneklerin bir kısmı (turuncu) yukarı doğru büyük bir hatayla bozulur. Seçilen kayıpla uydurulan doğru (yeşil) MSE'nin doğrusuyla (kırmızı kesikli) ve gerçek doğruyla (gri kesikli) karşılaştırılır. Sağ grafik kaybın ve bir örneğin gradyana katkısının ($\psi$) artığa göre nasıl büyüdüğünü gösterir.
    predict:
      q: "%10 aykırı değer varken hangi kayıp gerçek doğruya en uzak kalır?"
      options:
        - {t: "MSE — ψ(r) = 2r sınırsız; büyük artıklı birkaç örnek doğruyu kendine çeker", ok: true, why: "MSE koşullu ortalamayı kestirir; ortalama aykırılara duyarlıdır."}
        - {t: "MAE", why: "MAE koşullu medyanı kestirir; %10 aykırı medyanı çok az kaydırır."}
        - {t: "Huber", why: "Büyük artıklarda Huber MAE gibi davranır, katkı ±δ ile sınırlı."}
    presets:
      - {name: "Temiz veri", params: {frac: 0, loss: 0}, note: "Aykırı yokken MSE en verimli kestiricidir (Gauss gürültüsü)."}
      - {name: "%10 aykırı, MSE", params: {frac: 0.1, mag: 12, loss: 0}, note: "Doğru yukarı kaydı: b hatası büyük."}
      - {name: "%10 aykırı, Huber", params: {frac: 0.1, mag: 12, loss: 2, delta: 1}, note: "Huber neredeyse gerçek doğruda."}
      - {name: "%40 aykırı, MAE", params: {frac: 0.4, mag: 12, loss: 1}, note: "Dayanıklı kayıplar bile çoğunluğa yaklaşan bozulmada çekilmeye başlar."}
      - {name: "Büyük δ", params: {frac: 0.1, mag: 12, loss: 2, delta: 5}, note: "δ artıkların çoğundan büyük olunca Huber MSE'ye döner."}
    questions:
      - q: "Huber'de δ'yı 0.1'e indirince ne olur?"
        a: "Neredeyse tüm artıklar |r| > δ bölgesinde kalır: Huber ≈ δ·MAE gibi davranır. Dayanıklıdır ama gürültüsüz örneklerden gelen bilginin bir kısmını kullanmaz (verim kaybı)."
      - q: "Aykırı değerler hep yukarı kaydırıldı. Simetrik (yarısı yukarı yarısı aşağı) olsaydı MSE ne yapardı?"
        a: "Ortalama etkisi kabaca birbirini götürürdü (yan küçük), ama varyans artardı: doğru tohumdan tohuma daha çok oynardı. Tek yönlü bozulma en zararlı durumdur."
    limits: "Uydurma IRLS ile yapılır (100 yineleme). MAE'nin çözümü tek olmayabilir; IRLS bunlardan birini bulur. Tek öznitelikli model."
  - id: l3
    lab: dragfit
    title: "Noktaları sürükle: en küçük kareler veriye nasıl tepki verir?"
    goal: |
      Veri noktalarını fareyle, dokunarak ya da ok tuşlarıyla sürükle; kapalı form doğrusu, ağırlık merkezi (x̄, ȳ) ve artıklar her sürüklemede yeniden hesaplanır. Grafikte boş bir yere çift tıklamak nokta ekler. Doğru her sürüklemeye rağmen (x̄, ȳ)'den geçmeye devam eder — bunu bozamazsın; deneyin amacı bunu görmen.
    presets:
      - {name: "Temiz doğrusal", params: {n: 9, c: 0, out: 0, seed: 1}, note: "Desensiz artıklar: model doğru. Bir noktayı çok uzağa taşı ve doğrunun (x̄, ȳ)'den geçmeye devam ettiğini izle."}
      - {name: "x'leri sağa kaydır", params: {n: 9, c: 1.6, out: 0, seed: 1}, note: "Aynı veri, x'i +1.6 kaydırılmış: kapalı forma yeni çözüm kaymaya uyar ama kayıp yüzeyinin koşul sayısı büyür — linregfit deneyinde bu etkiyi izle."}
      - {name: "Tek aykırı değer", params: {n: 9, c: 0, out: 1, seed: 1}, note: "Bir nokta 3.4 birim yukarı çekildi: doğru kendine döner. Aynı veriyle kaybı Huber yapmanın (robustfit) etkisini önce tahmin et, sonra orada dene."}
      - {name: "Az veri: 3 nokta", params: {n: 3, c: 0, out: 0, seed: 1}, note: "n = 3'te doğru üç nokta arasına sıkışır; tohumu değiştir — kestirim tohumdan tohuma oynar. Optimizasyon değil, veri sınırlayıcı."}
    questions:
      - q: "Doğruyu (x̄, ȳ)'den geçmemeye zorlayabilir misin?"
        a: "Geçiremezsin: b* = ȳ − w*x̄, normal denklemlerin doğrudan sonucudur. Sürüklenen her nokta hem hatayı hem de (x̄, ȳ)'yi aynı anda güncellediği için denklem hep sağlanır. Tek istisna: bütün x'ler aynıysa eğim tanımsızdır (P6) — o zaman doğru hiç çizilemez."
      - q: "Bir noktayı y'de ±3 birim taşı. Aynı büyüklükteki taşımayı x'te yapsan doğru daha mı çok oynar?"
        a: "x'te taşıma iki şeyi birden değiştirir: o örneğin hatasını ve ağırlık merkezi x̄'yi — ve x uçlardaysa x'lerle çarpılan hata katkısı (e_i·x_i) büyük olur. Dene: uçtaki bir noktayı yatayda sürüklemek, dikeyde sürüklemekten genellikle daha sert tepki üretir. Gradyan tanımındaki x_i ağırlığı işte budur."
    limits: "Tek öznitelik, tam-batch kapalı form; GD ve kayıp yüzeyi bu deneyde yok (l1'de). Eğimin tanımlı olması için en az iki farklı x gerekir; bütün x'ler aynıysa tablo boş gelir (P6). Noktalar pencere içinde kalır."
  - id: l4
    lab: linresid
    title: "Artıklarla modeli tanı: U deseni ve huni"
    goal: |
      Doğrusal modeli üç farklı gerçek modele zorlarsın: doğrusal (ideal), karesel (eksik öznitelik) ve hunimsi gürültü (heteroskedastik). Sol grafik veri + uydurma, orta grafik artık–x, sağ grafik artık histogramı. Karesel senaryoda R² ~0.9'da kalır ama yanlış biçimi artıklar ele verir: U deseni ve tablodaki "(x²−x̄²) imzası" — artıkları merkezlenmiş x²'ye uyduran katsayı, eksik terimin katsayısını geri verir.
    predict:
      q: "Karesel gerçek modelde doğrusal uydurmanın artıkları ne gösterir?"
      options:
        - {t: "U deseni: uçlarda bir işaret, ortada tersi", ok: true, why: "Eksik x² terimi artıklarda kalır: r ≈ −0.8(x²−x̄²). Tablodaki imza katsayıyı geri verir."}
        - {t: "Desensiz bulut", why: "Bu ancak gerçek model de doğrusalsa olur."}
        - {t: "Huni: yayılım x'le büyür", why: "Huni gürültünün varyansının x'e bağlılığındandır; karesel senaryoda gürültü homoskedastik."}
    presets:
      - {name: "Doğrusal, temiz", params: {gercek: 0, n: 60, sigma: 0.3}, note: "Artıklar desensiz, imza ≈ 0: model doğru, Gauss varsayımı tutarlı."}
      - {name: "Karesel gerçek", params: {gercek: 1, n: 60, sigma: 0.4}, note: "U deseni; imza ≈ −0.8. R² ~0.9'da kalır: R² yanlış biçimi gizler (Anscombe şekli)."}
      - {name: "Huni", params: {gercek: 2, n: 60, sigma: 0.6}, note: "Yansız ama varyans sabit değil: standart hata formülleri geçersiz; ağırlıklı en küçük kareler (ayrıntı kutusu)."}
      - {name: "Az veri, çok gürültü", params: {gercek: 1, n: 15, sigma: 1.4}, note: "n = 15'te U deseni gürültüye gömülür: artık grafiğini okumak için de veri gerekir."}
    questions:
      - q: "σ'yı büyütürken R²'yi izle: desen değişir mi, imza değişir mi?"
        a: "σ büyüdükçe R² düşer (açıklanamayan varyans artar) ama desenin biçimi değişmez: U hâlâ U'dur ve imza gerçek katsayıya yakın kalır. Sistematik yanlışlık ile rastgele gürültü ölçekten bağımsız ayrı katmanlardır."
      - q: "U deseninde imza neden tam −0.8 (gerçek katsayı) çıkıyor?"
        a: "Doğrusal model ŷ = wx + b uydurunca artık, uydurulan düzleminkine dik kalır; eksik terim x² o uzamda olmadığından imzası artıklarda yaşar. Merkezleme gerekti: x²'nin ortalaması bias'a emildiği için imzayı (x²−x̄²)'ye uydurarak ölçeriz — o zaman tam katsayı çıkar. Bu, 'eksik öznitelik artıklarda kalır' cümlesinin nicel hâlidir."
    limits: "Tek öznitelik, tam-batch kapalı form; gerçek model üç senaryodan biridir. Histogram 15 sabit kutu kullanır; n küçükken düzensizdir. Huni senaryosunda gürültü |x|'e orantılıdır. İmza, merkezlenmiş x²'ye uydurulur; ham x²'ye uydurmak katsayıyı düşük gösterir."
