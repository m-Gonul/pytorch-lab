id: m1-2-gd-variants
code: M1.2
title: Gradient descent varyantları
phase: 1
minutes: 210
prereq: [m1-1-linreg]
summary: >
  Tam batch, stokastik ve mini-batch gradient descent ile momentum. Bir
  kuadratikte ve üç noktalık regresyonda adımları elle atıyor, karıştırılmış
  mini-batch'leri saf Python'da üretiyor, NumPy'da epoch/batch döngüsünü
  kuruyor, PyTorch'ta `DataLoader` + `SGD(momentum)` ile aynı yörüngeyi
  doğruluyor ve en sonda 48 farklı (lr, β) çiftini tek tensörle eğitiyorsun.
goals:
  - "Batch, [[sgd|SGD]] ve mini-batch gradyanlarının aynı beklenen değere sahip ama farklı gürültüde olduğunu göstermek"
  - "Bir [[epoch]]'u karıştırılmış, örtüşmeyen mini-batch'lere bölmek"
  - "[[momentum|Momentum]] güncellemesini $v\\leftarrow\\beta v+g$, $w\\leftarrow w-\\eta v$ olarak yazıp PyTorch'unkiyle eşleştirmek"
  - "Kötü koşullu (ill-conditioned) bir problemde momentumun neden hızlandırdığını ölçmek"
sources:
  - {title: "Stanford CS229 — Lecture notes: LMS, batch vs stochastic gradient descent", url: "https://cs229.stanford.edu/main_notes.pdf", license: "doğrulanmadı", use: link}
  - {title: "Dive into Deep Learning §12.4–12.6 SGD, Minibatch SGD, Momentum", url: "https://d2l.ai/chapter_optimization/index.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}
  - {title: "Goh — Why Momentum Really Works (Distill)", url: "https://distill.pub/2017/momentum/", license: "CC BY 4.0", use: link}
  - {title: "PyTorch — torch.optim.SGD (momentum formülü)", url: "https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html", license: "BSD-3", use: link}

hand:
  groups:
    - title: "Kuadratik $L(w)=(w-3)^2$, $\\nabla L=2(w-3)$, $w_0=0$, $\\eta=0.25$. Düz GD"
      fields:
        - {id: g0, label: "$g_0=\\nabla L(w_0)$", answer: -6, hint: "$2(0-3)$"}
        - {id: w1, label: "$w_1=w_0-\\eta g_0$", answer: 1.5, tol: 0.001, hint: "$0+0.25\\cdot6$"}
        - {id: w2, label: "$w_2$", answer: 2.25, tol: 0.001, hint: "$g_1=2(1.5-3)=-3$"}
    - title: "Momentum, $\\beta=0.5$: $v_t=\\beta v_{t-1}+g_t$, $w_{t+1}=w_t-\\eta v_t$, $v_{-1}=0$"
      fields:
        - {id: mv1, label: "$v_1$ (ikinci adımın hızı)", answer: -6, tol: 0.001, hint: "$v_0=-6$; $g_1=-3$; $0.5\\cdot(-6)+(-3)$"}
        - {id: mw2, label: "$w_2$", answer: 3, tol: 0.001, hint: "$1.5-0.25\\cdot(-6)$ — tam minimuma iki adımda"}
    - title: "Regresyon $x=[1,2,3]$, $y=[2,4,5]$, $w=b=0$, $\\eta=0.1$, MSE"
      fields:
        - {id: sgd_w, label: "SGD, yalnız 1. örnek: yeni $w$", answer: 0.4, tol: 0.001, hint: "$e=-2$, $\\partial_w=2ex=-4$"}
        - {id: sgd_b, label: "… yeni $b$", answer: 0.4, tol: 0.001, hint: "$\\partial_b=2e=-4$"}
        - {id: mb_gw, label: "Mini-batch {2., 3. örnek}: $\\partial L/\\partial w$", answer: -23, tol: 0.001, hint: "$\\frac22(-4\\cdot2-5\\cdot3)$"}
        - {id: mb_gb, label: "… $\\partial L/\\partial b$", answer: -9, tol: 0.001, hint: "$\\frac22(-4-5)$"}
        - {id: steps, label: "$n=1000$, batch 32: epoch başına adım", answer: 32, hint: "$\\lceil1000/32\\rceil$; son batch 8 örnekli"}
  verify: |
    import math
    g = lambda w: 2 * (w - 3)
    w1 = 0 - 0.25 * g(0); w2 = w1 - 0.25 * g(w1)
    v0 = g(0); mw1 = 0 - 0.25 * v0; v1 = 0.5 * v0 + g(mw1); mw2 = mw1 - 0.25 * v1
    e1 = 0 - 2
    answers = dict(g0=g(0), w1=w1, w2=w2, mv1=v1, mw2=mw2,
                   sgd_w=0 - 0.1 * 2 * e1 * 1, sgd_b=0 - 0.1 * 2 * e1,
                   mb_gw=(2 / 2) * (-4 * 2 + -5 * 3), mb_gb=(2 / 2) * (-4 - 5), steps=math.ceil(1000 / 32))

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Mini-batch gradyanı, tam batch gradyanının neyidir?"
    options:
      - {t: "Yansız bir tahmini: beklenen değeri aynı, varyansı batch boyutuyla ters orantılı", ok: true, why: "Örnekler rastgele seçildiğinde $\\mathbb E[g_B]=\\nabla L$, $\\text{Var}[g_B]\\approx\\sigma^2/B$. Bu gürültü keskin minimumlardan kaçmaya da yardım edebilir."}
      - {t: "Her zaman daha küçük normlu bir versiyonu", why: "Norm herhangi bir yönde sapabilir; ilişki beklenen değer düzeyinde."}
      - {t: "Yanlı bir tahmini; bu yüzden daha küçük lr gerekir", why: "Karıştırılmış örneklemede yansızdır; küçük lr'nin nedeni varyans."}
  - q: "Kötü koşullu bir kuadratikte (bir yön dik, bir yön yassı) momentum neden yardım eder?"
    options:
      - {t: "Dik yöndeki salınımlar ardışık adımlarda zıt işaretli olduğu için birbirini sönümler; yassı yöndeki tutarlı gradyan birikir", ok: true, why: "Yassı yönde etkin adım $\\approx\\eta/(1-\\beta)$ olur; $\\beta=0.9$ ile 10 kat."}
      - {t: "Gradyanı normalize eder", why: "O Adam/RMSProp'un işi (M3.4)."}
      - {t: "Learning rate'i otomatik küçültür", why: "lr sabit; değişen, adımların yönü ve birikimi."}
  - q: "Her epoch başında veriyi neden karıştırırız?"
    options:
      - {t: "Sabit sıra, ardışık batch'ler arasında korelasyon yaratır (ör. sınıfa göre sıralı veri); gradyan tahmini yanlı ve salınımlı olur", ok: true, why: "Sıralı veride model önce hep bir sınıfı, sonra diğerini görür ve her blokta bir öncekini unutur."}
      - {t: "Hızlandırmak için", why: "Karıştırmanın küçük bir maliyeti var; amaç istatistiksel."}
      - {t: "Gerekli değil, yalnız alışkanlık", why: "Sıralı verilerde belirgin şekilde kötü sonuç verir."}

homework:
  - title: "Robbins & Monro (1951) ve Polyak & Juditsky (1992): stokastik yaklaşım ve ortalama"
    paper: "Robbins & Monro — A Stochastic Approximation Method (1951); Polyak & Juditsky — Acceleration of Stochastic Approximation by Averaging (SIAM J. Control 1992)"
    url: "https://projecteuclid.org/journals/annals-of-mathematical-statistics/volume-22/issue-3/A-Stochastic-Approximation-Method/10.1214/aoms/1177729586.full"
    level: orta
    hours: 6
    goal: |
      Gürültülü doğrusal regresyonda SGD'yi adım takvimleri ηₜ = c/tᵅ (α ∈ {0.3, 0.5, 0.7, 1}) ile çalıştır; Robbins–Monro koşullarını (Σηₜ = ∞, Σηₜ² < ∞) sağlayan ve sağlamayanların yakınsama davranışını karşılaştır. Polyak–Ruppert ortalamasını (iteratların ortalaması) ekle: α = 0.5 ile ortalanmış SGD'nin α = 1'in (en iyi c ile) asimptotik hızına, c seçimine duyarsız şekilde ulaştığını göster.
    steps:
      - "Hatanın t ile log-log eğimini ölç (beklenen: ortalamalıda −1)."
    accept:
      - "Koşulları sağlamayan sabit adımın gürültü tabanında kaldığı grafik."
      - "Ortalama alma ile c'ye duyarsız O(1/t) hata."

labs:
  - id: l1
    lab: gd1d
    title: "Öğrenme oranı ve kararlılık: f(x) = a·x²/2"
    goal: |
      GD'nin tek boyutlu en basit hâli: $x_{t+1}=x_t-\eta f'(x_t)=(1-\eta a)\,x_t$. Bütün davranış tek bir sayıda, $1-\eta a$'da saklı. Amaç: tekdüze yakınsama, salınımlı yakınsama ve ıraksama arasındaki sınırları **formülden önce** deneyle bulmak, sonra formülle doğrulamak.
    predict:
      q: "a = 2 iken η'yı 0.3'ten yavaşça artırıyorsun. Hangi η'dan sonra x sonsuza kaçar?"
      options:
        - {t: "η > 0.5", why: "η = 0.5 = 1/a tek adımda minimuma iner; sonrası salınımlı ama hâlâ yakınsar."}
        - {t: "η > 1", ok: true, why: "|1 − ηa| < 1 ⇔ 0 < η < 2/a = 1."}
        - {t: "η > 2", why: "Sınır a'ya bağlı: 2/a."}
    presets:
      - {name: "Yavaş ve güvenli", params: {lr: 0.05}, note: "ηa = 0.1: her adım hatanın yalnız %10'unu siler; 25 adımda $0.9^{25}\\approx0.07$."}
      - {name: "Tek adımda çözüm", params: {lr: 0.5}, note: "η = 1/a: Newton adımı. Çok boyutta her yön için ayrı 1/a gerektiği için tek η ile mümkün değil."}
      - {name: "Salınım", params: {lr: 0.9}, note: "1 < ηa < 2: x her adımda işaret değiştirir ama küçülür."}
      - {name: "Iraksama", params: {lr: 1.05}, note: "ηa = 2.1: |1 − ηa| = 1.1 > 1."}
      - {name: "Aynı η, iki eğrilik", params: {lr: 0.3, a: 1, B: {a: 6}}, note: "Çok boyutlu bir problemin iki yönü gibi düşün: η = 0.3 ile a = 6'lık yön ıraksama sınırına yakındır ve şiddetle salınır (ηa = 1.8 < 2), a = 1 yönü ise yavaş ilerler (ηa = 0.3). Koşul sayısının bedeli."}
    questions:
      - q: "Kayıp log ölçekte neden düz bir çizgi?"
        a: "$f(x_t)=\\tfrac a2(1-\\eta a)^{2t}x_0^2$; logaritması t'nin doğrusal fonksiyonu, eğimi $2\\ln|1-\\eta a|$."
      - q: "η'yı sabit tutup a'yı artırınca ne olur? Hangi a'dan sonra ıraksar?"
        a: "Sınır $a<2/\\eta$. Dik (büyük eğrilikli) bir yön, aynı η ile ıraksamaya ilk düşen yöndür — bu yüzden η en büyük özdeğere göre seçilir."
      - q: "η negatif olursa?"
        a: "Deney bunu geçersiz sayar: $1-\\eta a>1$, adım yokuş yukarıdır (gradyan çıkışı)."
    limits: "Tek boyutlu, gürültüsüz kuadratik. Gerçek kayıplarda eğrilik konuma göre değişir; mini-batch gürültüsü ayrıca bir taban oluşturur (bkz. M3.4 deneyi)."

  - id: l2
    lab: sgdnoise
    title: "Batch, mini-batch, SGD: aynı epoch bütçesinde kim nereye varır?"
    goal: |
      200 örneklik bir regresyon ($y=2x-1+\varepsilon$). Her epoch'ta veri karıştırılır ve $B$'lik parçalarla adım atılır. Sol grafik $(w,b)$ düzleminde yolları gösterir: turuncu mini-batch, mavi noktalı tam batch GD (epoch başına tek adım). Sağ grafik her epoch sonunda kaybın optimumdan farkı.
    predict:
      q: "10 epoch, η = 0.05. B = 10 mu, tam batch (B = 200) mı daha düşük kayba ulaşır?"
      options:
        - {t: "B = 10: aynı hesapla 20 kat fazla adım atar; gürültü bu ölçekte ilerlemeyi engellemez", ok: true, why: "Tam batch yalnız 10 adım atar. Mini-batch 200 adım atar; kaybı gürültü tabanına kadar indirir."}
        - {t: "Tam batch: gradyanı kesin", why: "Kesin ama adım sayısı çok az; aynı epoch'ta çok daha geride kalır."}
        - {t: "İkisi aynı yere varır", why: "Epoch başına adım sayıları farklı."}
    presets:
      - {name: "Saf SGD", params: {B: 1, lr: 0.02, epochs: 10, sched: 0}, note: "Epoch başına 200 adım; yol optimumun çevresinde titrer (gürültü topu)."}
      - {name: "SGD + azalan η", params: {B: 1, lr: 0.02, epochs: 30, sched: 1}, note: "Adımlar küçüldükçe top daralır."}
      - {name: "Büyük η, küçük B", params: {B: 2, lr: 0.08, epochs: 10, sched: 0}, note: "Top büyük: sabit η'da son kayıp yüksek kalır."}
      - {name: "Tam batch", params: {B: 200, lr: 0.08, epochs: 30, sched: 0}, note: "Gürültü yok; iki yol çakışır. Epoch başına yalnız 1 adım."}
    questions:
      - q: "B'yi 1'den 4'e çıkarıp η'yı sabit tutunca son çeyrekteki ortalama uzaklık kabaca ne kadar değişmeli?"
        a: "Gürültü topunun std'si ∝ √(η/B): yarıya inmeli. Tabloda 'son çeyrekte optimuma ortalama uzaklık'ı karşılaştır (tohum gürültüsü nedeniyle tam değil)."
      - q: "Tam batch'te η'yı 0.2'ye çıkarınca ne olur, mini-batch'te B = 1 iken?"
        a: "Tam batch'te λ_max ≈ 10 civarı, sınır ~0.19: ıraksamaya çok yakın. B = 1'de tek örnek gradyanının eğriliği daha da büyük olabilir (x² ≤ 9): SGD daha erken patlar. Küçük batch daha küçük η ister."
    limits: "Tek öznitelikli doğrusal regresyon; kayıp kuadratik. Derin ağlarda kayıp yüzeyi dışbükey değildir ve gürültünün yapısı (anizotropik) daha karmaşıktır. Yol en fazla 1500 noktayla çizilir."
  - id: l3
    lab: optim2d
    title: "Momentum, kötü koşullu bir vadide"
    goal: |
      $f(\theta)=\tfrac12\theta^\top H\theta$, $H$'nin özdeğerleri 1 ve $1/\kappa$, vadi verilen açıyla döndürülmüş. Yöntemi değiştir (bu modülde SGD, Momentum, Nesterov ilgili; RMSProp ve Adam M3.4'te), $\beta$'yı ve koşul sayısını oyna.
    predict:
      q: "κ = 100, η = 0.5 iken momentum β = 0.8 ile SGD'ye (β = 0) göre 100 adımda ne kadar ilerler?"
      options:
        - {t: "Çok daha fazla: yatık yönde etkili adım η/(1 − β), yani η'nın 5 katı; dik yöndeki salınımlar sönümlenir", ok: true, why: "Kuadratikte momentum etkili koşul sayısını ~√κ'ya düşürür."}
        - {t: "Daha az: momentum salınım ekler", why: "β çok büyükse (ör. 0.99) uzun salınımlar olur; 0.8 burada iyi bir değer."}
        - {t: "Aynı", why: "Yatık yönde gradyanlar hep aynı işaretli; birikirler."}
    presets:
      - {name: "SGD, κ = 100", params: {m: 0, lr: 0.5, kappa: 100, rot: 30, noise: 0, T: 100}, note: "Yatık yönde her adım hatanın yalnız %0.5'ini siler."}
      - {name: "Momentum, κ = 100", params: {m: 1, lr: 0.5, beta: 0.8, kappa: 100, rot: 30, noise: 0, T: 100}, note: "Aynı η, yol vadi boyunca hızlanır."}
      - {name: "Momentum çok büyük", params: {m: 1, lr: 0.5, beta: 0.98, kappa: 100, rot: 30, noise: 0, T: 100}, note: "Az sönüm: minimumun etrafında uzun salınımlar."}
      - {name: "Nesterov", params: {m: 2, lr: 0.5, beta: 0.8, kappa: 100, rot: 30, noise: 0, T: 100}, note: "İleri bakış: salınım daha erken frenlenir."}
      - {name: "Gürültülü momentum", params: {m: 1, lr: 0.5, beta: 0.8, kappa: 100, rot: 30, noise: 1, T: 100}, note: "Momentum gürültüyü de biriktirir: hızlanma kısmen kaybolur."}
    questions:
      - q: "κ = 1 (çember konturlar) iken momentum avantaj sağlar mı?"
        a: "Hayır, hatta η = 1/λ ile GD tek adımda çözer; momentum aşar ve salınır. Momentumun faydası kötü koşullu problemlerdedir."
      - q: "Nesterov ile ağır top arasındaki fark ne zaman belirginleşir?"
        a: "β büyük ve η sınıra yakınken: ağır top minimumu aşıp salınırken Nesterov ileri bakış gradyanıyla erken düzeltir."
    limits: "İki boyutlu kesin kuadratik; gürültü her adımda eklenen bağımsız Gauss'tur. Gerçek ağlarda eğrilik ve gürültü konuma göre değişir."
practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Kuadratikte GD ne zaman yakınsar?
    goal: Kararlılık koşulunu türetmek
    needs: Geometrik dizi
    q: |-
      $f(x)=\frac a2x^2$ ($a>0$) üzerinde sabit adımlı GD için $\eta$'nın hangi aralıkta yakınsadığını türet.
    solution: |-
      $f'(x)=ax$, güncelleme $x_{t+1}=x_t-\eta ax_t=(1-\eta a)x_t$. Dolayısıyla $x_t=(1-\eta a)^tx_0$ — bir geometrik dizi.

      $x_t\to0$ **ancak ve ancak** $|1-\eta a|<1$, yani $-1<1-\eta a<1\iff0<\eta<\frac2a$.

      Rejimler: $0<\eta a<1$ tekdüze, $\eta a=1$ tek adımda, $1<\eta a<2$ salınarak yakınsama; $\eta a>2$ ıraksama.

      **Çok boyut:** $f(x)=\frac12x^\top Hx$ için $H$'nin özvektör tabanında her bileşen ayrı ayrı $(1-\eta\lambda_i)$ ile çarpılır. Kararlılık için $\eta<2/\lambda_{max}$; en yavaş bileşen $1-\eta\lambda_{min}$ ile söner. En iyi sabit η ile yakınsama hızı $\frac{\kappa-1}{\kappa+1}$, $\kappa=\lambda_{max}/\lambda_{min}$.

      **Ne söylemez:** Dışbükey olmayan kayıplarda eğrilik yere göre değişir; bu sınır yalnız yerel bir rehberdir. Deney alanında dene.
  - id: p2
    type: hesap
    level: 1
    title: En büyük kararlı η
    goal: Kararlılık sınırını uygulamak
    needs: P1
    q: |-
      $f(x)=3x^2$ için GD'nin yakınsadığı en büyük öğrenme oranı (sınır değer) kaç?
    answer: 0.3333333333333333
    calc: "2/6"
    mistakes:
      - {answer: 0.6666666666666666, msg: "a, f''(x) olmalı: 3x²'nin ikinci türevi 6, 3 değil (f = a x²/2 biçimine dikkat)."}
    hints:
      - "$f(x)=\\frac a2x^2$ biçimine getir: $a$ kaç?"
    solution: |-
      $3x^2=\frac62x^2$, yani $a=6$; sınır $\eta<2/a=1/3$.
  - id: p3
    type: hesap
    level: 1
    title: Üç adım sonra
    goal: Güncellemeyi elle izlemek
    needs: P1
    q: |-
      $a=2$, $\eta=0.3$, $x_0=4$. Üç GD adımından sonra $x_3$ kaç?
    answer: 0.25600000000000006
    calc: "4*0.4**3"
    mistakes:
      - {answer: 1.3719999999999997, msg: "Çarpan 1 − η değil, 1 − ηa = 1 − 0.6 = 0.4."}
      - {answer: 1.6, msg: "Bu yalnız bir adım; üç kez çarp."}
    hints:
      - "Her adım $x$'i aynı sayıyla çarpar."
    solution: |-
      $1-\eta a=0.4$; $x_3=4\cdot0.4^3=0.256$.
  - id: p4
    type: tamamla
    level: 2
    title: Kaç adım gerekir?
    goal: Yakınsama hızından adım sayısına geçmek
    needs: Logaritma
    q: |-
      $|x_t|=|1-\eta a|^t|x_0|$. $x_0=1$, $\eta a=0.1$ için $|x_t|\le10^{-3}$ olması için gereken en küçük tamsayı $t$ kaç?
    answer: 66.0
    calc: "math.ceil(math.log(1e-3)/math.log(0.9))"
    mistakes:
      - {answer: 65.0, msg: "Aşağı yuvarladın: bu t'de |x| hâlâ 10⁻³'ün üstünde. Yukarı yuvarla."}
    hints:
      - "$0.9^t\\le10^{-3}$'ün iki yanının logaritmasını al; $\\ln0.9<0$ olduğu için eşitsizlik yön değiştirir."
    solution: |-
      $t\ge\ln10^{-3}/\ln0.9=65.56$ → $t=66$. Genel kural: hatayı $\varepsilon$'a indirmek $\approx\frac1{\eta a}\ln\frac{|x_0|}\varepsilon$ adım ister (küçük ηa için $-\ln(1-\eta a)\approx\eta a$).
  - id: p5
    type: yorumla
    level: 2
    title: SGD kaybı bir yerde takılıyor
    goal: Gürültü tabanını tanımak
    needs: Mini-batch gradyanı
    q: |-
      Sabit η ile mini-batch SGD: kayıp hızla düşüyor, sonra ortalaması sabit kalıp yukarı aşağı sıçrıyor. Tam batch GD ise aynı η ile düşmeye devam ediyor. En iyi açıklama?
    choices:
      - {t: "Model kapasitesi yetmiyor", why: "Tam batch GD aynı modelle daha aşağı iniyor."}
      - {t: "Gradyan gürültüsü sabit η ile minimum çevresinde bir 'gürültü topu' bırakıyor; η'yı azaltmak ya da batch'i büyütmek tabanı düşürür", ok: true, why: "Taban kabaca ησ²/B ile orantılı."}
      - {t: "Öğrenme oranı kararlılık sınırını aştı", why: "Iraksama olsaydı kayıp büyürdü."}
    hints:
      - "Minimumda tam gradyan sıfır; mini-batch gradyanı da sıfır mı?"
    solution: |-
      Minimumda $\nabla L=0$ ama mini-batch gradyanının varyansı ($\sigma^2/B$) sıfır değil; sabit η ile her adım bir rastgele itme. Denge: kabaca $\mathbb E[L-L^*]\propto\eta\sigma^2/B$. Çareler: öğrenme oranı takvimi (azalt), daha büyük batch, ya da ağırlık ortalaması (Polyak/EMA). M3.4 deneyinde "Gürültülü gradyan" senaryosuna bak.
  - id: p6
    type: kanıt
    level: 3
    title: Mini-batch gradyanı yansızdır
    goal: SGD'nin neden çalıştığını kanıtlamak
    needs: Beklenen değer, varyansın doğrusallığı
    q: |-
      Veri kümesinden yerine koyarak düzgün çekilmiş $B$ örnekle $\hat g=\frac1B\sum_{k=1}^B\nabla\ell_{i_k}(w)$. (a) $\mathbb E[\hat g]=\nabla L(w)$, (b) $\mathrm{Cov}(\hat g)=\frac1B\Sigma$ olduğunu göster ($\Sigma$ tek örnek gradyanının kovaryansı). Varsayımları yaz.
    rubric:
      - "$L=\\frac1n\\sum_i\\ell_i$ tanımını ve $i_k$'nın düzgün dağılımını kullandım"
      - "Beklenen değerin doğrusallığıyla (a)'yı gösterdim"
      - "Çekimlerin bağımsızlığını (yerine koyarak) kullanarak varyansların toplandığını gösterdim"
      - "Yerine koymadan çekimde sonlu kitle düzeltmesi $(n-B)/(n-1)$ çıktığını not ettim"
    hints:
      - "Tek bir çekim için $\\mathbb E[\\nabla\\ell_{i}]=\\sum_i\\frac1n\\nabla\\ell_i$."
      - "Bağımsız terimlerin toplamının kovaryansı kovaryansların toplamıdır."
    solution: |-
      (a) $\mathbb E[\nabla\ell_{i_k}]=\sum_{i=1}^n\frac1n\nabla\ell_i=\nabla L$; doğrusallıkla $\mathbb E[\hat g]=\frac1B\sum_k\nabla L=\nabla L$.
      (b) $i_k$'lar bağımsız ve özdeş dağılımlı, her biri kovaryansı $\Sigma$. $\mathrm{Cov}(\sum_k X_k)=\sum_k\mathrm{Cov}(X_k)=B\Sigma$; $1/B^2$ çarpanıyla $\Sigma/B$. Yerine koymadan çekimde terimler hafif negatif ilişkili, sonuç $\frac{n-B}{n-1}\frac\Sigma B$ ($B=n$'de 0: tam batch). **Ne söylemez:** yansızlık yakınsamayı tek başına garanti etmez; adım boyu koşulları (ör. $\sum\eta_t=\infty$, $\sum\eta_t^2<\infty$) gerekir.
  - id: p7
    type: yöntem-seç
    level: 2
    title: 10 milyon örnek
    goal: GD varyantını probleme göre seçmek
    needs: Batch, mini-batch, SGD farkları
    q: |-
      10 milyon örnek, model belleğe sığıyor ama veri sığmıyor. Tam batch GD mi, saf SGD (B = 1) mi, mini-batch (B = 256) mı?
    choices:
      - {t: "Tam batch GD: en doğru gradyan", why: "Tek adım için 10M örneği okumak gerekir; aynı sürede binlerce mini-batch adımı atılır."}
      - {t: "Mini-batch: vektörleşmeden (GPU) yararlanır, gradyan gürültüsünü makul tutar, veriyi akış hâlinde okur", ok: true, why: "Pratik standart."}
      - {t: "Saf SGD: en çok adım", why: "B = 1 donanımı boşa harcar (vektörleşme yok) ve gürültü büyük."}
    hints:
      - "Bir adımın maliyeti ve gürültüsü B ile nasıl değişir?"
    solution: |-
      Adım maliyeti ∝ B, gürültü std'si ∝ $1/\sqrt B$: B'yi 4 katına çıkarmak gürültüyü yalnız yarıya indirir. Donanım belli bir B'ye kadar neredeyse bedava paralel çalıştığı için (GPU doluluğu) o noktaya kadar B'yi büyütmek kazançlıdır; ötesinde örnek başına verim düşer. Mini-batch bu dengedir.
pitfalls:
  - wrong: "Kayıp düşmüyorsa öğrenme oranını büyüt."
    right: "Önce kaybın salınıp salınmadığına bak: salınım ya da büyüme η'nın **fazla** olduğunu gösterir."
    why: "Kararlılık sınırını aşan η kaybı tekdüze değil, zikzaklı ya da üstel artırır (deney alanındaki 'Salınım' ve 'Iraksama' senaryoları)."
  - wrong: "SGD'nin gürültüsü her zaman zararlıdır."
    right: "Gürültü sivri minimumlardan kaçmaya ve genellemeye yardım edebilir; zararı, sabit η ile tam yakınsamayı engellemesidir."
  - wrong: "Bir epoch bir adımdır."
    right: "Bir epoch, veri kümesinin bir kez tamamen geçilmesidir: n/B adım."
whatif:
  - q: "Batch boyutunu 4 katına çıkarırsan η'yı nasıl değiştirmelisin?"
    a: "Gürültü varyansı 4 kat azalır. SGD için yaygın sezgisel kural η'yı da (kararlılık sınırına kadar) 4 katına çıkarmak (doğrusal ölçekleme; Goyal ve ark. 2017), ısınma (warmup) ile. Adam gibi uyarlamalı yöntemlerde √4 = 2 kat daha güvenli bir başlangıçtır. Kararlılık sınırı $2/\\lambda_{max}$ yine de aşılamaz."
  - q: "Kayıp dışbükey değilse 2/a sınırı ne anlama gelir?"
    a: "Yerel eğriliğe göre bir sınırdır; eğitim boyunca eğrilik değişir. Derin ağlarda büyük η ile eğitim sıklıkla tam bu sınırın civarında dolaşır ('kararlılığın kıyısı', Cohen ve ark. 2021)."
