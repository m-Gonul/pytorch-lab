id: m3-7-regularization-nn
code: M3.7
title: Dropout, weight decay, early stopping
phase: 3
minutes: 180
prereq: [m3-2-mlp-backprop, m3-4-optimizers]
summary: >
  Sinir ağlarında aşırı uyumla savaşın üç standart aracı. Inverted dropout'u
  ve early stopping kararını elle uyguluyor, saf Python'da dropout'un ileri/
  geri geçişini yazıyor, NumPy'da MC dropout ile belirsizlik tahminini tek
  tensörde yapıyor, PyTorch'ta `train()/eval()` davranışını taşıyan kendi
  Dropout modülünü ve en iyi ağırlıkları geri yükleyen bir eğitim döngüsü
  kuruyor ve en sonda T stokastik geçişi tek bir batched hesapla yapıyorsun.
goals:
  - "Inverted dropout'ta neden $1/(1-p)$ ile ölçeklendiğini (beklenen değeri korumak) göstermek"
  - "`model.train()` / `model.eval()` farkını ve dropout'un geri geçişinin maske ile çarpım olduğunu uygulamak"
  - "Early stopping'i `patience` ile tanımlayıp en iyi `state_dict`'i geri yüklemek"
  - "MC dropout ile tahmin belirsizliği (ortalama, std, entropi) üretmek"
sources:
  - {title: "Srivastava et al. — Dropout: A Simple Way to Prevent Neural Networks from Overfitting", url: "https://jmlr.org/papers/v15/srivastava14a.html", license: "©", use: link}
  - {title: "CS231n — Neural Networks Part 2: Regularization (inverted dropout)", url: "https://cs231n.github.io/neural-networks-2/#reg", license: "MIT", use: adapt}
  - {title: "Gal & Ghahramani — Dropout as a Bayesian Approximation (MC dropout)", url: "https://arxiv.org/abs/1506.02142", license: "arXiv", use: link}
  - {title: "Dive into Deep Learning §5.6 Dropout", url: "https://d2l.ai/chapter_multilayer-perceptrons/dropout.html", license: "CC BY-SA 4.0 / MIT-0", use: adapt}

hand:
  groups:
    - title: "Inverted dropout, düşürme olasılığı $p=0.5$, $x=[2,4,6,8]$, maske $m=[1,0,1,1]$: $y=x\\odot m/(1-p)$"
      fields:
        - {id: o1, label: "$y_1$", answer: 4, hint: "$2\\cdot1/0.5$"}
        - {id: o2, label: "$y_2$", answer: 0}
        - {id: o4, label: "$y_4$", answer: 16}
        - {id: ex, label: "$\\mathbb E[y_1]$ (maske rastgele)", answer: 2, hint: "$(1-p)\\cdot\\frac{x_1}{1-p}+p\\cdot0$"}
        - {id: test, label: "Test zamanı $y_1$", answer: 2, hint: "eval'de dropout kimlik fonksiyonu"}
    - title: "Weight decay ve early stopping"
      fields:
        - {id: wd, label: "Ayrık decay: $w=1$, $\\eta=0.1$, $\\lambda=0.01$ → $w(1-\\eta\\lambda)$", answer: 0.999, tol: 0.00001}
        - {id: best, label: "Doğrulama kayıpları $[0.9,0.7,0.6,0.62,0.65,0.61]$, patience 2: en iyi epoch (0-tabanlı)", answer: 2}
        - {id: stop, label: "… durdurulan epoch", answer: 4, hint: "epoch 3 ve 4 iyileştirmedi; 2. iyileşmeyen epoch'ta dur"}
  verify: |
    x = [2, 4, 6, 8]; m = [1, 0, 1, 1]; p = 0.5
    y = [a * b / (1 - p) for a, b in zip(x, m)]
    v = [0.9, 0.7, 0.6, 0.62, 0.65, 0.61]
    best, bad, stop = 0, 0, len(v) - 1
    for i in range(1, len(v)):
        if v[i] < v[best]:
            best, bad = i, 0
        else:
            bad += 1
            if bad >= 2:
                stop = i
                break
    answers = dict(o1=y[0], o2=y[1], o4=y[3], ex=x[0], test=x[0], wd=1 * (1 - 0.1 * 0.01), best=best, stop=stop)

stages:
  b: {engine: browser}
  c: {engine: browser}
  d: {engine: torch}
  e: {engine: torch}

quiz:
  - q: "Eğitimde dropout uygulayıp `model.eval()` çağırmayı unutursan ne olur?"
    options:
      - {t: "Test tahminleri rastgele olur ve her çağrıda değişir; doğruluk düşer", ok: true, why: "BatchNorm da aynı bayrağa bakar: eval'de running istatistik kullanır. `eval()` bu yüzden kritik; `torch.no_grad()` ise ayrı bir şey (gradyan kaydını kapatır)."}
      - {t: "Hiçbir şey; inverted dropout zaten ölçekli", why: "Ölçek beklenen değeri korur ama tek bir geçiş yine de rastgele."}
      - {t: "Hata verir", why: "Sessizce yanlış çalışır; en tehlikeli tür."}
  - q: "Dropout bir modelin içinde neyi taklit eder?"
    options:
      - {t: "Ağırlık paylaşan üstel sayıda alt-ağdan oluşan bir topluluğu (ensemble); test zamanı ölçekleme bu topluluğun ortalamasına yaklaşır", ok: true, why: "Her eğitim adımı farklı bir alt-ağı eğitir. MC dropout ise test zamanında bu alt-ağlardan örnekleyip belirsizlik tahmini yapar."}
      - {t: "L1 cezasını", why: "Lineer modelde L2'ye benzer bir etkisi gösterilebilir; asıl yorum topluluk."}
      - {t: "Learning rate azalmasını", why: "İlgisiz."}
  - q: "Early stopping'de neden son epoch'un değil en iyi epoch'un ağırlıklarını döndürürüz?"
    options:
      - {t: "Durma kararı `patience` kadar kötüleşmeden sonra verilir; son ağırlıklar zaten aşırı uyumun başladığı noktadan sonradır", ok: true, why: "Bu yüzden en iyi `state_dict`'in kopyası (deepcopy) saklanır; referans saklamak yetmez, ağırlıklar yerinde değişir."}
      - {t: "Son ağırlıklar her zaman daha kötüdür", why: "Daha kötü olmak zorunda değil ama doğrulama hatasına göre en iyisi değil."}
      - {t: "Farketmez", why: "patience = 10 ile 10 epoch'luk aşırı uyum fark eder."}

extras:
  - {id: x1, title: "Alpha dropout: SELU ile uyumlu bırakma", engine: browser}
  - {id: x2, title: "Max-norm düzenlileştirmesi", engine: browser}
  - {id: x3, title: "Gradyan kırpma: değere göre vs (global) norma göre", engine: browser}

homework:
  - title: "Srivastava ve ark. (2014): Dropout"
    paper: "Srivastava, Hinton, Krizhevsky, Sutskever, Salakhutdinov — Dropout: A Simple Way to Prevent Neural Networks from Overfitting (JMLR 2014)"
    url: "https://jmlr.org/papers/v15/srivastava14a.html"
    level: orta
    hours: 8
    goal: |
      MNIST'te makale Tablo 2'nin küçük sürümü: 784-1024-1024-10 ağı (a) düzenlileştirmesiz, (b) L2, (c) dropout (giriş 0.2, gizli 0.5), (d) dropout + max-norm (r = 3) ile eğit. Şekil 7'deki gibi ilk katman özniteliklerini dropout'lu ve dropout'suz görselleştir; Şekil 8'deki seyreklik etkisini (gizli aktivasyonların histogramı ve ortalama aktivasyon) ölç. Ağırlık ölçekleme çıkarımını Monte Carlo ortalamasıyla (k örnek) karşılaştır (Şekil 11).
    steps:
      - "x2'deki max_norm'u PyTorch'a taşı (her optimizer adımından sonra torch.no_grad içinde)."
    accept:
      - "Dropout + max-norm en düşük test hatası."
      - "Dropout'lu ağın gizli aktivasyonları daha seyrek."
  - title: "Gal & Ghahramani (2016): Bayesçi yaklaşım olarak dropout"
    paper: "Gal & Ghahramani — Dropout as a Bayesian Approximation: Representing Model Uncertainty in Deep Learning (ICML 2016)"
    url: "https://arxiv.org/abs/1506.02142"
    level: orta
    hours: 8
    goal: |
      c aşamasındaki MC dropout'u bir regresyon problemine uygula (makale Şekil 2: CO₂ verisi yerine kendi 1B gürültülü fonksiyonun, eğitim aralığının dışına çıkan test noktalarıyla): T = 100 stokastik geçişin ortalaması ve std'si ile tahmin aralıkları çiz; dropout olasılığı ve model hassasiyeti τ ile öngörü varyansını (Denk. 8: $\tau^{-1}+\mathrm{Var}$) hesapla. Rakamlarda (MNIST/digits) döndürülmüş "1" görüntüleri için sınıf olasılıklarının belirsizliğini çiz (Şekil 4).
    steps:
      - "Kalibrasyon: tahmin aralıklarının kapsama oranını nominal düzeyle karşılaştır."
    accept:
      - "Eğitim aralığı dışında belirsizlik büyür."
      - "Döndürme açısı arttıkça sınıf olasılıklarının yayılımı artar."

practice:
  - id: p1
    type: çözülmüş
    level: 0
    title: Ters (inverted) dropout neden beklenen değeri korur?
    goal: Dropout ölçeklemesini türetmek
    needs: Bernoulli dağılımı
    q: |-
      Tutma olasılığı $q=1-p$. Eğitimde $\tilde h=\frac{m}{q}h$, $m\sim\mathrm{Bernoulli}(q)$. $\mathbb E[\tilde h]$ ve $\mathrm{Var}(\tilde h)$?
    solution: |-
      $\mathbb E[\tilde h]=\frac{\mathbb E[m]}qh=h$: test zamanında hiçbir şey yapmaya gerek kalmaz (eski "test zamanında $q$ ile çarp" kuralının yerine). $\mathrm{Var}(\tilde h)=\frac{q(1-q)}{q^2}h^2=\frac pqh^2$: dropout her birime çarpımsal gürültü ekler; $p=0.5$'te std = $|h|$.

      **Yorum:** beklenen değer korunur ama doğrusal olmayan katmanlardan sonra ortalama bir ağ "tam" ağa eşit değildir — test çıktısı, tüm alt ağların ortalamasının yalnızca bir yaklaşımıdır (geometrik ortalama yorumu, Srivastava ve ark. 2014). Monte Carlo dropout testte de maskeleyip ortalama alarak bunu ve belirsizliği tahmin eder.
  - id: p2
    type: hesap
    level: 1
    title: Ters dropout çıktısı
    goal: Ölçeklemeyi uygulamak
    needs: P1
    q: |-
      $p=0.2$ (bırakma), birim tutuldu, $h=4$. Eğitimdeki çıktı?
    answer: 5.0
    calc: "4/0.8"
    mistakes:
      - {answer: 3.2, msg: "Bu eski (ters olmayan) dropout'un test zamanı ölçeklemesi; ters dropout eğitimde 1/q ile çarpar."}
      - {answer: 20.0, msg: "p bırakma olasılığı; tutma olasılığı q = 0.8 ile böl."}
    hints:
      - "$\\tilde h=h/q$, $q=1-p$."
    solution: |-
      $4/0.8=5$. Birim %20 olasılıkla 0, %80 olasılıkla 5: beklenen 4.
  - id: p3
    type: hesap
    level: 1
    title: Max-norm kısıtı
    goal: Ağırlık vektörünü normu sınırlayarak izdüşürmek
    needs: Öklid normu
    q: |-
      Bir birimin gelen ağırlıkları $w=[3,4]$, max-norm sınırı $c=3$. İzdüşümden sonra $w_1$?
    answer: 1.8
    calc: "3*3/5"
    mistakes:
      - {answer: 3.0, msg: "Max-norm kırpma bileşen bileşen değil, vektörün normunu c'ye ölçekler."}
    hints:
      - "$\\|w\\|=5>3$ ⇒ $w\\leftarrow w\\cdot c/\\|w\\|$."
    solution: |-
      $w\leftarrow[3,4]\cdot3/5=[1.8,2.4]$. Yön korunur, norm sınıra iner. Dropout ile birlikte büyük η kullanmayı mümkün kılar (Srivastava ve ark. 2014).
  - id: p4
    type: yorumla
    level: 2
    title: Doğrulama kaybı U çiziyor
    goal: Erken durdurmayı ve aşırı uyumu okumak
    needs: Eğitim/doğrulama eğrileri
    q: |-
      Eğitim kaybı sürekli iniyor; doğrulama kaybı epoch 12'ye kadar iniyor, sonra yükseliyor; doğrulama **doğruluğu** ise epoch 20'ye kadar hafifçe artmaya devam ediyor. Ne olur, hangi kontrol noktasını seçersin?
    choices:
      - {t: "Epoch 12; doğruluk artışı tesadüf", why: "Kayıp ve doğruluk farklı şeyleri ölçer; ayrılmaları bilgilendiricidir."}
      - {t: "Model aşırı **güvenli** hâle geliyor: yanlış tahminlerinde olasılıkları uçlara itiyor (kayıp ↑) ama sıralaması hâlâ biraz iyileşiyor (doğruluk ↑); seçim hedef ölçüte göre yapılır", ok: true, why: "Kalibrasyon bozulurken sınıflandırma sınırı iyileşebilir."}
      - {t: "Veri sızıntısı var", why: "Sızıntı genelde doğrulamayı gerçekdışı iyi yapar, U çizdirmez."}
    hints:
      - "Çapraz entropi yalnız doğru/yanlışı değil, ne kadar emin olunduğunu da ölçer."
    solution: |-
      Doğruluk argmax'a, kayıp olasılığın kendisine bakar. Geç aşamada model az sayıdaki yanlışına çok emin olur (−ln p büyür) ama sınır bölgesindeki örnekleri biraz daha iyi ayırır. Olasılık lazımsa (risk, kalibrasyon) epoch 12'yi seç ya da sonradan sıcaklık ölçekle; yalnız etiket lazımsa doğruluğa göre seç. Her durumda seçim doğrulama kümesinde, test kümesi dokunulmadan yapılır.
  - id: p5
    type: birleştir
    level: 3
    title: Dropout ve L2 bağlantısı
    goal: Dropout'u doğrusal modelde uyarlamalı bir L2 cezası olarak yorumlamak (M1.3)
    needs: P1, beklenen değer
    q: |-
      Doğrusal regresyonda girdiye dropout: $\hat y=\sum_jw_j\frac{m_j}qx_j$. Beklenen kare kaybın $\mathbb E[(y-\hat y)^2]=(y-w^\top x)^2+\frac pq\sum_jw_j^2x_j^2$ olduğunu göster ve yorumla.
    rubric:
      - "Önyargı–varyans ayrışımını ($\\mathbb E[(y-\\hat y)^2]=(y-\\mathbb E\\hat y)^2+\\mathrm{Var}\\hat y$) kullandım"
      - "$\\mathbb E\\hat y=w^\\top x$ ve $\\mathrm{Var}\\hat y=\\sum_j w_j^2x_j^2\\frac pq$ (bağımsız maskeler) buldum"
      - "Veri üzerinden toplanınca cezanın $\\lambda_j\\propto\\sum_i x_{ij}^2$ ağırlıklı L2 olduğunu söyledim"
      - "Sık/büyük değerli özniteliklerin daha çok cezalandırıldığını yorumladım"
    hints:
      - "$\\mathrm{Var}(m_j/q)=p/q$."
    solution: |-
      $\mathbb E[\hat y]=w^\top x$; maskeler bağımsız olduğundan $\mathrm{Var}(\hat y)=\sum_jw_j^2x_j^2\mathrm{Var}(m_j/q)=\frac pq\sum_jw_j^2x_j^2$. Veri üzerinden toplam: $\|y-Xw\|^2+\frac pq\sum_jw_j^2\sum_ix_{ij}^2$ — veri ölçeğine göre ağırlıklandırılmış ridge (Wager ve ark. 2013). Derin ağlarda bu basit bağlantı tam geçerli değildir ama sezgi aynıdır: dropout tek tek birimlere aşırı güvenmeyi cezalandırır.
pitfalls:
  - wrong: "Dropout'u test zamanında da açık bırak."
    right: "Standart kullanımda test zamanı deterministiktir (`model.eval()`); bilinçli olarak açık bırakmak MC dropout'tur ve ortalama alınmalıdır."
  - wrong: "BatchNorm ve dropout'u her yerde birlikte kullanmak hep iyidir."
    right: "Dropout BN'den önce gelirse eğitim–test arasında varyans kayması yaratır (Li ve ark. 2019); dikkatli yerleştir ya da birini seç."
  - wrong: "Daha çok düzenlileştirme daha iyi genelleme demektir."
    right: "Fazlası eksik uyuma (yüksek yanlılık) götürür; doğrulama eğrisiyle ayarla."
whatif:
  - q: "Veri 100 kat artarsa dropout oranı ne olmalı?"
    a: "Varyans terimi zaten küçüldüğü için genelde daha az düzenlileştirme gerekir; büyük dil modelleri çoğu zaman dropout'suz eğitilir."
  - q: "Gradyan kırpma bir düzenlileştirme midir?"
    a: "Doğrudan değil: amacı optimizasyonu kararlı tutmaktır (patlayan gradyan). Yan etkisi olarak büyük adımları sınırladığı için dinamiği değiştirir."

labs:
  - id: l1
    lab: dropfit
    title: "12 gürültülü nokta, 64 nöron: dropout, weight decay ve early stopping"
    goal: |
      Parametresi verisinden çok olan bir ağ gürültüyü ezberler: eğitim hatası gürültü tabanının (σ²) altına iner, doğrulama hatası yükselir. Üç çareyi tek tek ve birlikte aç; hangisinin doğrulama hatasını ne kadar düşürdüğünü ve fonksiyonun şeklini nasıl değiştirdiğini gör.
    predict:
      q: "Düzenlileştirme yokken eğitim MSE'si gürültü varyansının (σ² = 0.0625) çok altına iniyor. Doğrulama MSE'si için ne beklersin?"
      options:
        - {t: "Eğitim MSE'si kadar küçük", why: "Doğrulama verisinde gürültü yeni ve bağımsızdır; σ²'nin altına inemez."}
        - {t: "σ²'nin belirgin üstünde, en iyi değerinin de üstünde", ok: true, why: "Ezberlenen gürültü yeni noktalarda hata olarak geri döner: tohum 1'de son doğrulama MSE'si ≈ 0.22, early stopping'in bulduğu en iyi değer ≈ 0.09."}
        - {t: "Tam σ²", why: "σ² ancak gerçek fonksiyonu kusursuz öğrenen bir modelin ulaşabileceği tabandır."}
    presets:
      - {name: "Düzenlileştirme yok", params: {p: 0, wd: 0}, note: "Eğitim MSE ≈ 8·10⁻⁴ ≪ σ²; doğrulama 0.22. Early stopping'in seçtiği ağ (adım ≈ 100) doğrulamada ≈ 0.09."}
      - {name: "Dropout 0.3", params: {p: 0.3, wd: 0}, note: "Eğitim MSE ≈ 0.03 (σ²'ye yakın), doğrulama ≈ 0.076. Mor MC dropout bandı noktaların seyrek olduğu yerlerde genişliyor."}
      - {name: "Weight decay 0.15", params: {p: 0, wd: 0.15}, note: "‖w‖ 40'tan ≈ 15'e iniyor, doğrulama ≈ 0.12: yardımcı ama bu problemde dropout ve early stopping kadar değil."}
      - {name: "Çok fazla dropout", params: {p: 0.7}, note: "Eğitim MSE ≈ σ², doğrulama 0.12 — 0.3'ten kötü: düzenlileştirme fazla, ağ eksik uyuyor."}
      - {name: "Çok veri", params: {n: 80, p: 0, wd: 0}, note: "80 örnekte düzenlileştirme olmadan da doğrulama ≈ 0.085: veri en iyi düzenlileştiricidir."}
      - {name: "Kısa eğitim", params: {T: 300, p: 0, wd: 0}, note: "300 adımda durmak (elle early stopping) doğrulamayı 0.11'e indiriyor."}
    questions:
      - q: "Dropout açıkken eğitim kaybı neden düzenlileştirmesiz durumdan çok daha yüksek kalıyor?"
        a: "Eğitimde her adımda farklı bir alt ağ görülüyor; tek bir alt ağa göre ezber yapılamıyor. Grafikteki eğitim kaybı eval modunda (tüm ağ) ölçülüyor; yine de ağ gürültünün ayrıntılarını öğrenmemiş."
      - q: "Tohumu değiştir: sıralama hep aynı mı?"
        a: "6 tohumda (1–6) dropout 0.2–0.4 ve weight decay 0.15 her seferinde düzenlileştirmesiz son ağdan iyi çıktı; ama aralarındaki sıra tohuma göre değişiyor. Küçük veride tek bir koşudan genelleme yapma."
    limits: "Tek girdili, tek gizli katmanlı (tanh) ağ; tam-batch Adam (η = 0.01); doğrulama 120 gürültülü nokta. MC bandı 40 maskeyle; gerçek bir güven aralığı değil. Gerçek ağlarda düzenlileştiricilerin etkisi mimariye ve veriye bağlıdır."
  - id: l2
    lab: clipvec
    title: "Değere göre mi, norma göre mi kırpmalı?"
    goal: |
      Aynı gradyanı iki yöntemle kırp: değere göre kırpma her bileşeni ayrı keser (kare bölge), norma göre kırpma tüm vektörü ölçekler (daire). Hangisinin yönü koruduğunu ve hangi bileşenlerin kaybolduğunu gör.
    predict:
      q: "g = (0.9, 100), c = 1. Değere göre kırpılmış vektörün yönü ne kadar döner?"
      options:
        - {t: "Hiç dönmez", why: "Yalnız ikinci bileşen kesilir; birinci aynı kalır → oran değişir."}
        - {t: "≈ 41°", ok: true, why: "(0.9, 1.0) köşegene yakın: 89.5° − 48.0° ≈ 41.5°."}
        - {t: "≈ 90°", why: "İki bileşen de pozitif kalır; dönüş 90°'den küçüktür."}
    presets:
      - {name: "Ders örneği", params: {g1: 0.9, g2: 100, c: 1}, note: "Değere göre (0.9, 1.0): yön ≈ 41° döndü. Norma göre (0.009, 0.99996): yön aynı, birinci bileşen neredeyse yok."}
      - {name: "Eşiğin altında", params: {g1: 0.5, g2: -0.3, c: 1}, note: "‖g‖ < c ve |gᵢ| < c: iki yöntem de hiçbir şey yapmaz."}
      - {name: "İki büyük bileşen", params: {g1: 50, g2: -80, c: 1}, note: "Değere göre (1, −1): oranı 50:80 olan vektör 1:1'e döndü (≈ 13°). Norma göre yön aynı."}
      - {name: "Gevşek eşik", params: {g1: 0.9, g2: 100, c: 50}, note: "Değere göre yalnız 100 → 50 (yön ≈ 0.5° döner), norma göre ×0.5."}
    questions:
      - q: "Değere göre kırpma hangi durumda yönü korur?"
        a: "Hiçbir bileşen eşiği aşmıyorsa (hiç kırpma yok) ya da tüm bileşenlerin mutlak değeri eşit ve hepsi eşiği aşıyorsa. Genelde büyük bileşenleri küçüklere doğru eşitler."
    limits: "İki boyutlu tek bir gradyan; gerçek ağlarda milyonlarca bileşen ve global norm (tüm parametreler birlikte) kullanılır. Kırpmanın eğitim dinamiğine etkisi burada gösterilmiyor."
