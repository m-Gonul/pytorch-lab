# Terim sözlüğü. Markdown içinde [[terim]] ya da [[terim|görünen metin]] yazınca ilk açıklama tooltip olarak eklenir.
# Anahtarlar küçük harfle eşleşir.
terms:
  autograd: "Otomatik türev: PyTorch'un her işlemi bir hesap grafiğine kaydedip `.backward()` ile zincir kuralını tersten uygulaması."
  broadcasting: "Farklı shape'teki diziler arasında eleman eleman işlem: boyutlar sağdan hizalanır, 1 olan boyutlar kopya yapılmadan genişletilir."
  shape: "Bir dizinin her eksendeki uzunluk listesi; ör. 32 örnek × 128 özellik için (32, 128)."
  tensor: "PyTorch'un çok boyutlu dizisi; NumPy ndarray'e benzer, ayrıca GPU'da yaşayabilir ve autograd'a katılabilir."
  lineer katman: "y = xWᵀ + b; PyTorch'ta nn.Linear. Ağırlık (çıkış, giriş) shape'inde saklanır."
  attention: "Her token'ın diğerlerine benzerlik skorlarıyla ağırlıklı ortalama aldığı işlem: softmax(QKᵀ/√d)·V."
  convolution: "Küçük bir çekirdeğin girdinin üzerinde kayarak her konumda iç çarpım alması; im2col ile matris çarpımına indirgenir."
  blas: "Basic Linear Algebra Subprograms: önbellek, SIMD ve çoklu çekirdek için elle optimize edilmiş lineer cebir kütüphaneleri (OpenBLAS, MKL, Accelerate)."
  gradient descent: "Gradyan inişi: kaybı azaltmak için parametreleri gradyanın tersi yönünde küçük adımlarla güncelleme, θ ← θ − η∇L."
  learning rate: "Öğrenme oranı (η): gradient descent'te her adımın büyüklüğünü ölçekleyen sayı."
  mse: "Mean squared error: hataların karelerinin ortalaması, (1/n)Σ(ŷᵢ − yᵢ)²."
  zincir kuralı: "Bileşik fonksiyonun türevi parçaların türevlerinin çarpımıdır: d f(g(x))/dx = f′(g(x))·g′(x)."
  hesap grafiği: "Bir ifadeyi düğümleri işlem, kenarları ara değer olan yönlü bir grafik olarak yazmak; backprop bu grafiği tersten gezer."
  jacobian: "Vektör değerli f: ℝⁿ→ℝᵐ için m×n kısmi türev matrisi, J_ij = ∂f_i/∂x_j."
  sayısal türev: "Türevi sonlu farkla yaklaştırma: (f(x+h) − f(x−h)) / 2h. Doğrulama için kullanılır, eğitim için yavaştır."
  vmap: "torch.func.vmap: tek örnek için yazılmış fonksiyonu, döngü yazmadan bir batch boyutu üzerine otomatik vektörleştirir."
  sigmoid: "σ(z) = 1/(1 + e^{−z}); gerçek sayıyı (0, 1) aralığına, yani bir olasılığa eşler."
  cross-entropy: "Tahmin edilen olasılığın gerçek etikete atadığı değerin negatif logaritması; ikili hâli −[y log p + (1−y) log(1−p)]."
  logit: "Sigmoid/softmax'tan önceki ham skor z; olasılık p = σ(z)."
  log-sum-exp: "log Σ e^{zᵢ}'yi taşmadan hesaplama hilesi: max(z) çıkarılıp geri eklenir."
  mesafe matrisi: "Her test noktası ile her eğitim noktası arasındaki uzaklıkları tutan (test × eğitim) matris."
  k-nn: "k-en yakın komşu: bir noktanın etiketini eğitim setindeki en yakın k noktanın çoğunluk oyuyla tahmin etme."
  topolojik sıralama: "Yönlü bir grafiği, her düğüm kendisine bağlı düğümlerden sonra gelecek şekilde dizmek; backward bu sıranın tersiyle yürür."
  per-sample gradient: "Batch'teki her örnek için ayrı ayrı hesaplanan gradyan; differential privacy ve veri değerlendirmede kullanılır."
  kernel: "GPU/CPU üzerinde tek seferde çalıştırılan derlenmiş hesap rutini; her PyTorch işlemi bir ya da birkaç kernel çağırır."
  dispatch: "PyTorch'un bir işlem çağrısında dtype/device/autograd durumuna göre doğru kernel'ı seçmesi; çağrı başına sabit maliyeti vardır."
  pyodide: "CPython'un WebAssembly'ye derlenmiş hâli; Python'u (NumPy, pandas, scikit-learn dahil) tarayıcıda çalıştırır."
  web worker: "Tarayıcıda sayfayı dondurmadan arka planda kod çalıştıran ayrı iş parçacığı."
  mle: "Maximum likelihood estimation: gözlenen veriye en yüksek olasılığı veren parametreyi seçmek, θ̂ = argmax Σ log p(xᵢ|θ)."
  nll: "Negatif log-likelihood: −Σ log p(xᵢ|θ); MLE'yi minimizasyon problemi olarak yazmanın yolu. MSE ve cross-entropy birer NLL'dir."
  stride: "Bir tensörde bir eksen boyunca bir adım ilerlemek için bellekte atlanan eleman sayısı. Row-major (n, m) tensörün stride'ı (m, 1)."
  contiguous: "Elemanları bellekte row-major sırada, aradaki boşluksuz duran tensör. Transpoze ve adımlı dilimler contiguous değildir."
  sgd: "Stochastic gradient descent: gradyanı tüm veri yerine rastgele seçilen bir örnek ya da mini-batch üzerinden tahmin edip adım atmak."
  epoch: "Eğitim verisinin tamamının modele bir kez gösterilmesi; n örnek ve batch boyutu B için ⌈n/B⌉ adım."
  momentum: "Gradyanların üstel hareketli ortalamasıyla adım atmak: v ← βv + g, θ ← θ − ηv. Tutarlı yönlerde hızlanır, salınımları sönümler."
  soft-threshold: "S(z, t) = sign(z)·max(|z| − t, 0): değeri sıfıra doğru t kadar çeker, |z| < t ise tam sıfır yapar. Lasso'nun tek koordinat çözümü."
  cross-validation: "Veriyi k parçaya bölüp her parçayı bir kez doğrulama, kalanını eğitim olarak kullanarak bir hiperparametrenin genelleme hatasını tahmin etmek."
  aşırı uyum: "Overfitting: modelin eğitim verisindeki gürültüyü de ezberleyip yeni veride kötü performans göstermesi."
  softmax: "softmax(z)ₖ = e^{zₖ} / Σⱼ e^{zⱼ}: K logit'i toplamı 1 olan pozitif olasılıklara çevirir; en büyük logit'i vurgular."
  naive bayes: "Sınıf bilindiğinde özelliklerin birbirinden bağımsız olduğunu varsayan sınıflandırıcı: p(y|x) ∝ p(y) Πⱼ p(xⱼ|y)."
  laplace düzeltmesi: "Laplace (additive) smoothing: sayım tabanlı olasılıklarda her sayıma α ekleyerek görülmemiş olaylara sıfır olasılık verilmesini önlemek."
  hinge loss: "max(0, 1 − y·f(x)): doğru tarafta ve en az 1 margin uzaklıkta olan örneklere sıfır, diğerlerine doğrusal ceza veren kayıp."
  alt-gradyan: "Subgradient: türevi olmayan (köşeli) noktalarda gradyanın yerine kullanılan, fonksiyonun altında kalan doğruların eğimlerinden biri."
  kernel trick: "Özellik uzayını açıkça kurmadan, yalnız k(x, x′) iç çarpımlarıyla o uzayda lineer model eğitmek."
  gini: "Gini safsızlığı: 1 − Σ pₖ². Rastgele seçilen bir örneğe, düğümün sınıf dağılımından rastgele etiket verilirse yanlış etiketlenme olasılığı; saf düğümde 0."
  pseudo-residual: "Gradient boosting'de kaybın mevcut tahmine göre negatif gradyanı, −∂L/∂F. MSE için gerçek residual (y − F); her tur bu değerlere bir ağaç oturtulur."
  özvektör: "Eigenvector: Cv = λv olan, matrisin yalnız ölçeklediği (yönünü değiştirmediği) sıfırdan farklı vektör; λ özdeğer."
  inertia: "k-means amacı: her noktanın kendi küme merkezine kare uzaklıklarının toplamı, Σ‖xᵢ − c_{zᵢ}‖²."
  responsibility: "GMM'de bir noktanın bir bileşenden gelme posterior olasılığı, r_ik = p(z = k | xᵢ); EM'in E adımında hesaplanan yumuşak atama."
  unbroadcast: "Broadcasting'in geri geçişi: gelen gradyanı, ileri geçişte genişletilen eksenler üzerinden toplayarak girdinin shape'ine indirmek."
  bias düzeltmesi: "Adam'da sıfırdan başlatılan hareketli ortalamaların ilk adımlardaki küçüklüğünü 1/(1 − βᵗ) ile çarparak telafi etmek."
  xavier init: "Glorot başlatması: Var(w) = 2/(n_in + n_out); lineer/tanh ağlarda aktivasyon ve gradyan varyansını katmanlar boyunca korur."
  kaiming init: "He başlatması: Var(w) = 2/n_in; ReLU'nun ikinci momenti yarıya indirmesini telafi ederek ReLU ağlarında varyansı korur."
  im2col: "Convolution'ı matris çarpımına çevirme hilesi: girdinin her pencere konumunu bir sütuna açar; tersi (col2im) pencereleri geri toplar."
  receptive field: "Bir çıktı nöronunun girdide 'gördüğü' bölgenin boyutu; katman katman r ← r + (k − 1)·j ile büyür, j o ana kadarki toplam stride."
  residual bağlantı: "Skip connection: bir bloğun çıktısına girdisini eklemek, y = x + F(x). Jacobian'a birim matris ekler, gradyanın sönmesini engeller."
  associative scan: "Birleşmeli bir işlemin tüm önek (prefix) sonuçlarını O(log T) paralel adımda hesaplamak; doğrusal rekürsiyonlar ve SSM'ler (Mamba) bunu kullanır."
  bpe: "Byte-pair encoding: en sık komşu sembol çiftini tekrar tekrar birleştirerek alt-kelime sözlüğü kuran tokenization algoritması."
  causal maske: "Attention'da her konumun yalnız kendisini ve öncekileri görmesini sağlayan maske; gelecek konumların skorları softmax'tan önce −∞ yapılır."
  online softmax: "Softmax'ı veri üzerinde tek geçişte, koşan maksimum ve paydayı her yeni blokla yeniden ölçekleyerek hesaplama; FlashAttention'ın temeli."
  weight tying: "Giriş embedding matrisini çıkış (logit) katmanının ağırlığı olarak da kullanmak; aynı tensör iki yerde, gradyanlar toplanır."
  kv-cache: "Otoregresif üretimde geçmiş token'ların attention key ve value'larını saklayıp her adımda yalnız yeni token'ı hesaplama tekniği."
  reparametrization trick: "Rastgele örneği z = μ + σ·ε (ε ~ N(0, I)) diye yazarak örneklemeyi parametrelere göre türevlenebilir yapma hilesi."
  iwae: "Importance Weighted Autoencoder sınırı: K örneğin önem ağırlıklarının log-ortalaması; K = 1'de ELBO, K büyüdükçe log p(x)'e yaklaşır."
  non-saturating loss: "GAN üretecinin log(1 − D(G(z))) yerine −log D(G(z)) kaybını küçültmesi; ayırıcı eminken bile güçlü gradyan verir."
  gradient penalty: "Ayırıcının girdiye göre gradyan normunu 1'e (WGAN-GP) ya da 0'a (R1) çeken düzenlileştirme terimi."
  flow matching: "Gürültüden veriye giden yollar boyunca hız alanını regresyonla öğrenip örneklemeyi bir ODE çözerek yapan üretken modelleme yöntemi."
  message passing: "GNN'lerin genel şeması: her düğüm komşularından mesaj toplar, permütasyon-değişmez bir fonksiyonla birleştirir ve kendi temsilini günceller."
  policy gradient: "Politikanın parametrelerini beklenen getirinin gradyanıyla güncelleyen yöntem ailesi; gradyan ∇log π(a|s) ile getirinin çarpımının beklentisi olarak tahmin edilir."
  saved tensors: "Autograd düğümlerinin geri geçişte türevi hesaplamak için ileri geçişte sakladığı tensörler; eğitimdeki aktivasyon belleğinin kaynağı."
  version counter: "Her tensörün in-place değişikliklerde artan sayacı; autograd, sakladığı tensörün geri geçişe kadar değişip değişmediğini bununla denetler."
  straight-through estimator: "Türevlenemeyen (ör. round, örnekleme) bir işlemi geri geçişte özdeşlik gibi davranarak gradyanı aynen geçiren tahminci."
  jvp: "Jacobian-vector product: Jv. Forward-mode AD ile tek bir ileri geçişte, Jacobian kurulmadan hesaplanır."
  activation checkpointing: "İleri geçişte yalnız bazı ara çıktıları saklayıp geri geçişte gerisini yeniden hesaplayarak aktivasyon belleğini azaltma tekniği."
  operatör füzyonu: "Birden çok işlemi tek bir kernel'de birleştirip ara sonuçları belleğe yazmadan hesaplama; bellek-bağımlı işlemlerde büyük hız kazancı sağlar."
  graph break: "torch.compile/Dynamo'nun bir kod parçasını grafa alamayıp normal Python'a döndüğü nokta; graf ikiye bölünür, optimizasyon fırsatı kaybolur."
  tiling: "Veriyi hızlı belleğe (shared memory, önbellek) sığan bloklar hâlinde işleyerek her yüklenen elemanı birçok kez yeniden kullanma tekniği."
  roofline: "Bir işlemin ulaşabileceği performansı min(tepe FLOP, bant genişliği × aritmetik yoğunluk) ile modelleyen grafik model."
  epilogue füzyonu: "Bir çekirdeğin ana hesabından (ör. matmul) sonra gelen bias, aktivasyon, ölçekleme gibi elementwise işlemleri sonucu belleğe yazmadan aynı çekirdekte uygulamak."
  loss scaling: "Kaybı büyük bir sayıyla çarpıp gradyanları sonra aynı sayıya bölerek, düşük hassasiyette küçük gradyanların sıfıra alt taşmasını önleme tekniği."
  stochastic rounding: "Bir sayıyı iki komşu temsil edilebilir değerden birine, uzaklıklarıyla ters orantılı olasılıkla yuvarlama; beklenen değerde yansızdır."
  all-reduce: "Tüm işçilerin tensörlerini toplayıp (ya da ortalayıp) sonucu her işçiye geri veren kolektif iletişim işlemi."
  ZeRO: "Zero Redundancy Optimizer: optimizer durumunu (ZeRO-1), gradyanları (ZeRO-2) ve parametreleri (ZeRO-3, FSDP) işçilere bölerek veri paralel eğitimin bellek tekrarını kaldıran yöntem."
  grup bazlı kuantizasyon: "Bir ağırlık satırını sabit boyutlu gruplara bölüp her gruba ayrı ölçek vererek aykırı değerlerin etkisini sınırlayan kuantizasyon (int4 LLM ağırlıklarında tipik)."
  guard: "Derlenmiş ya da dışa aktarılmış bir grafın geçerli olduğu koşul (ör. batch = 4); çalışma anında koşul sağlanmazsa yeniden derleme ya da hata."
  minGPT: "Karpathy'nin eğitim amaçlı, birkaç yüz satırlık GPT uygulaması; nanoGPT'nin öncülü. İçindeki 'adder' örneği toplamayı öğrenen küçük bir GPT."
  bilineer interpolasyon: "Bir noktanın değerini çevresindeki dört pikselden, iki eksende ardışık doğrusal interpolasyonla tahmin etme."
  histogram eşitleme: "Piksel değerlerini birikimli dağılım fonksiyonu (CDF) ile yeniden eşleyerek çıkış histogramını düzgüne yaklaştıran ve kontrastı artıran nokta dönüşümü."
  ayrılabilir filtre: "Rank-1 olan, yani bir sütun ve bir satır vektörünün dış çarpımı olarak yazılabilen 2-boyutlu çekirdek; iki 1-boyutlu filtreyle k² yerine 2k işlemle uygulanır."
  integral görüntü: "Her konumda sol-üst dikdörtgenin piksel toplamını tutan tablo (summed-area table); herhangi bir dikdörtgenin toplamı dört aramayla bulunur."
  unsharp masking: "Görüntüden bulanık kopyasını çıkararak ayrıntı maskesi elde edip bunu ağırlıklı olarak geri ekleyen keskinleştirme; kazanç 1'den büyükse highboost."
  median filtre: "Her pikseli komşuluk penceresindeki değerlerin medyanıyla değiştiren doğrusal olmayan sıra istatistiği filtresi; dürtü (tuz-biber) gürültüsünde etkili, kenarları korur."
  PSNR: "Peak signal-to-noise ratio: 10·log10(R²/MSE) desibel; iki görüntü arasındaki piksel hatasının logaritmik ölçüsü."
  log: "Laplacian of Gaussian: önce Gauss ile yumuşatıp sonra Laplacian almanın tek çekirdekli hali; ölçeği σ ile ayarlanan, yönden bağımsız ikinci türev operatörü."
  sıfır geçişi: "Bir sinyalin işaret değiştirdiği nokta; ikinci türevin sıfır geçişi kalın bir kenarın merkezini verir."
  non-maxima suppression: "Bir değeri, belirli yöndeki komşularından küçükse sıfırlayarak yalnız yerel tepeleri bırakma; Canny'de kenar sırtlarını tek piksel genişliğe indirir."
  histerezis eşikleme: "İki eşikli eşikleme: yüksek eşiği geçenler kesin, iki eşik arasındakiler yalnız kesin bir piksele bağlıysa kabul edilir."
