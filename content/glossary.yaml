# Terim sözlüğü. Markdown içinde [[terim]] ya da [[terim|görünen metin]] yazınca ilk açıklama tooltip olarak eklenir.
# Anahtarlar küçük harfle eşleşir.
terms:
  autograd: "Otomatik türev: PyTorch'un her işlemi bir hesap grafiğine kaydedip `.backward()` ile zincir kuralını tersten uygulaması."
  broadcasting: "Farklı shape'teki diziler arasında eleman eleman işlem: boyutlar sağdan hizalanır, 1 olan boyutlar kopya yapılmadan genişletilir."
  shape: "Bir dizinin her eksendeki uzunluk listesi; ör. 32 örnek × 128 özellik için (32, 128)."
  tensor: "PyTorch'un çok boyutlu dizisi; NumPy ndarray'e benzer, ayrıca GPU'da yaşayabilir ve autograd'a katılabilir."
  lineer katman: "y = xWᵀ + b; PyTorch'ta nn.Linear. Ağırlık (çıkış, giriş) shape'inde saklanır."
  attention: "Her token'ın diğerlerine benzerlik skorlarıyla ağırlıklı ortalama aldığı işlem: softmax(QKᵀ/√d)·V."
  convolution: "Küçük bir çekirdeğin girdinin üzerinde kayarak her konumda iç çarpım alması; im2col ile matris çarpımına indirgenir."
  blas: "Basic Linear Algebra Subprograms: önbellek, SIMD ve çoklu çekirdek için elle optimize edilmiş lineer cebir kütüphaneleri (OpenBLAS, MKL, Accelerate)."
  gradient descent: "Gradyan inişi: kaybı azaltmak için parametreleri gradyanın tersi yönünde küçük adımlarla güncelleme, θ ← θ − η∇L."
  learning rate: "Öğrenme oranı (η): gradient descent'te her adımın büyüklüğünü ölçekleyen sayı."
  mse: "Mean squared error: hataların karelerinin ortalaması, (1/n)Σ(ŷᵢ − yᵢ)²."
  zincir kuralı: "Bileşik fonksiyonun türevi parçaların türevlerinin çarpımıdır: d f(g(x))/dx = f′(g(x))·g′(x)."
  hesap grafiği: "Bir ifadeyi düğümleri işlem, kenarları ara değer olan yönlü bir grafik olarak yazmak; backprop bu grafiği tersten gezer."
  jacobian: "Vektör değerli f: ℝⁿ→ℝᵐ için m×n kısmi türev matrisi, J_ij = ∂f_i/∂x_j."
  sayısal türev: "Türevi sonlu farkla yaklaştırma: (f(x+h) − f(x−h)) / 2h. Doğrulama için kullanılır, eğitim için yavaştır."
  vmap: "torch.func.vmap: tek örnek için yazılmış fonksiyonu, döngü yazmadan bir batch boyutu üzerine otomatik vektörleştirir."
  sigmoid: "σ(z) = 1/(1 + e^{−z}); gerçek sayıyı (0, 1) aralığına, yani bir olasılığa eşler."
  cross-entropy: "Tahmin edilen olasılığın gerçek etikete atadığı değerin negatif logaritması; ikili hâli −[y log p + (1−y) log(1−p)]."
  logit: "Sigmoid/softmax'tan önceki ham skor z; olasılık p = σ(z)."
  log-sum-exp: "log Σ e^{zᵢ}'yi taşmadan hesaplama hilesi: max(z) çıkarılıp geri eklenir."
  mesafe matrisi: "Her test noktası ile her eğitim noktası arasındaki uzaklıkları tutan (test × eğitim) matris."
  k-nn: "k-en yakın komşu: bir noktanın etiketini eğitim setindeki en yakın k noktanın çoğunluk oyuyla tahmin etme."
  topolojik sıralama: "Yönlü bir grafiği, her düğüm kendisine bağlı düğümlerden sonra gelecek şekilde dizmek; backward bu sıranın tersiyle yürür."
  per-sample gradient: "Batch'teki her örnek için ayrı ayrı hesaplanan gradyan; differential privacy ve veri değerlendirmede kullanılır."
  kernel: "GPU/CPU üzerinde tek seferde çalıştırılan derlenmiş hesap rutini; her PyTorch işlemi bir ya da birkaç kernel çağırır."
  dispatch: "PyTorch'un bir işlem çağrısında dtype/device/autograd durumuna göre doğru kernel'ı seçmesi; çağrı başına sabit maliyeti vardır."
  pyodide: "CPython'un WebAssembly'ye derlenmiş hâli; Python'u (NumPy, pandas, scikit-learn dahil) tarayıcıda çalıştırır."
  web worker: "Tarayıcıda sayfayı dondurmadan arka planda kod çalıştıran ayrı iş parçacığı."
  mle: "Maximum likelihood estimation: gözlenen veriye en yüksek olasılığı veren parametreyi seçmek, θ̂ = argmax Σ log p(xᵢ|θ)."
  nll: "Negatif log-likelihood: −Σ log p(xᵢ|θ); MLE'yi minimizasyon problemi olarak yazmanın yolu. MSE ve cross-entropy birer NLL'dir."
  stride: "Bir tensörde bir eksen boyunca bir adım ilerlemek için bellekte atlanan eleman sayısı. Row-major (n, m) tensörün stride'ı (m, 1)."
  contiguous: "Elemanları bellekte row-major sırada, aradaki boşluksuz duran tensör. Transpoze ve adımlı dilimler contiguous değildir."
  sgd: "Stochastic gradient descent: gradyanı tüm veri yerine rastgele seçilen bir örnek ya da mini-batch üzerinden tahmin edip adım atmak."
  epoch: "Eğitim verisinin tamamının modele bir kez gösterilmesi; n örnek ve batch boyutu B için ⌈n/B⌉ adım."
  momentum: "Gradyanların üstel hareketli ortalamasıyla adım atmak: v ← βv + g, θ ← θ − ηv. Tutarlı yönlerde hızlanır, salınımları sönümler."
  soft-threshold: "S(z, t) = sign(z)·max(|z| − t, 0): değeri sıfıra doğru t kadar çeker, |z| < t ise tam sıfır yapar. Lasso'nun tek koordinat çözümü."
  cross-validation: "Veriyi k parçaya bölüp her parçayı bir kez doğrulama, kalanını eğitim olarak kullanarak bir hiperparametrenin genelleme hatasını tahmin etmek."
  aşırı uyum: "Overfitting: modelin eğitim verisindeki gürültüyü de ezberleyip yeni veride kötü performans göstermesi."
  softmax: "softmax(z)ₖ = e^{zₖ} / Σⱼ e^{zⱼ}: K logit'i toplamı 1 olan pozitif olasılıklara çevirir; en büyük logit'i vurgular."
  naive bayes: "Sınıf bilindiğinde özelliklerin birbirinden bağımsız olduğunu varsayan sınıflandırıcı: p(y|x) ∝ p(y) Πⱼ p(xⱼ|y)."
  laplace düzeltmesi: "Laplace (additive) smoothing: sayım tabanlı olasılıklarda her sayıma α ekleyerek görülmemiş olaylara sıfır olasılık verilmesini önlemek."
  hinge loss: "max(0, 1 − y·f(x)): doğru tarafta ve en az 1 margin uzaklıkta olan örneklere sıfır, diğerlerine doğrusal ceza veren kayıp."
  alt-gradyan: "Subgradient: türevi olmayan (köşeli) noktalarda gradyanın yerine kullanılan, fonksiyonun altında kalan doğruların eğimlerinden biri."
  kernel trick: "Özellik uzayını açıkça kurmadan, yalnız k(x, x′) iç çarpımlarıyla o uzayda lineer model eğitmek."
  gini: "Gini safsızlığı: 1 − Σ pₖ². Rastgele seçilen bir örneğe, düğümün sınıf dağılımından rastgele etiket verilirse yanlış etiketlenme olasılığı; saf düğümde 0."
  pseudo-residual: "Gradient boosting'de kaybın mevcut tahmine göre negatif gradyanı, −∂L/∂F. MSE için gerçek residual (y − F); her tur bu değerlere bir ağaç oturtulur."
  özvektör: "Eigenvector: Cv = λv olan, matrisin yalnız ölçeklediği (yönünü değiştirmediği) sıfırdan farklı vektör; λ özdeğer."
  inertia: "k-means amacı: her noktanın kendi küme merkezine kare uzaklıklarının toplamı, Σ‖xᵢ − c_{zᵢ}‖²."
  responsibility: "GMM'de bir noktanın bir bileşenden gelme posterior olasılığı, r_ik = p(z = k | xᵢ); EM'in E adımında hesaplanan yumuşak atama."
  unbroadcast: "Broadcasting'in geri geçişi: gelen gradyanı, ileri geçişte genişletilen eksenler üzerinden toplayarak girdinin shape'ine indirmek."
  bias düzeltmesi: "Adam'da sıfırdan başlatılan hareketli ortalamaların ilk adımlardaki küçüklüğünü 1/(1 − βᵗ) ile çarparak telafi etmek."
  xavier init: "Glorot başlatması: Var(w) = 2/(n_in + n_out); lineer/tanh ağlarda aktivasyon ve gradyan varyansını katmanlar boyunca korur."
  kaiming init: "He başlatması: Var(w) = 2/n_in; ReLU'nun ikinci momenti yarıya indirmesini telafi ederek ReLU ağlarında varyansı korur."
  im2col: "Convolution'ı matris çarpımına çevirme hilesi: girdinin her pencere konumunu bir sütuna açar; tersi (col2im) pencereleri geri toplar."
  receptive field: "Bir çıktı nöronunun girdide 'gördüğü' bölgenin boyutu; katman katman r ← r + (k − 1)·j ile büyür, j o ana kadarki toplam stride."
  residual bağlantı: "Skip connection: bir bloğun çıktısına girdisini eklemek, y = x + F(x). Jacobian'a birim matris ekler, gradyanın sönmesini engeller."
  associative scan: "Birleşmeli bir işlemin tüm önek (prefix) sonuçlarını O(log T) paralel adımda hesaplamak; doğrusal rekürsiyonlar ve SSM'ler (Mamba) bunu kullanır."
  bpe: "Byte-pair encoding: en sık komşu sembol çiftini tekrar tekrar birleştirerek alt-kelime sözlüğü kuran tokenization algoritması."
  causal maske: "Attention'da her konumun yalnız kendisini ve öncekileri görmesini sağlayan maske; gelecek konumların skorları softmax'tan önce −∞ yapılır."
  online softmax: "Softmax'ı veri üzerinde tek geçişte, koşan maksimum ve paydayı her yeni blokla yeniden ölçekleyerek hesaplama; FlashAttention'ın temeli."
  weight tying: "Giriş embedding matrisini çıkış (logit) katmanının ağırlığı olarak da kullanmak; aynı tensör iki yerde, gradyanlar toplanır."
  kv-cache: "Otoregresif üretimde geçmiş token'ların attention key ve value'larını saklayıp her adımda yalnız yeni token'ı hesaplama tekniği."
  reparametrization trick: "Rastgele örneği z = μ + σ·ε (ε ~ N(0, I)) diye yazarak örneklemeyi parametrelere göre türevlenebilir yapma hilesi."
  iwae: "Importance Weighted Autoencoder sınırı: K örneğin önem ağırlıklarının log-ortalaması; K = 1'de ELBO, K büyüdükçe log p(x)'e yaklaşır."
  non-saturating loss: "GAN üretecinin log(1 − D(G(z))) yerine −log D(G(z)) kaybını küçültmesi; ayırıcı eminken bile güçlü gradyan verir."
  gradient penalty: "Ayırıcının girdiye göre gradyan normunu 1'e (WGAN-GP) ya da 0'a (R1) çeken düzenlileştirme terimi."
  flow matching: "Gürültüden veriye giden yollar boyunca hız alanını regresyonla öğrenip örneklemeyi bir ODE çözerek yapan üretken modelleme yöntemi."
  message passing: "GNN'lerin genel şeması: her düğüm komşularından mesaj toplar, permütasyon-değişmez bir fonksiyonla birleştirir ve kendi temsilini günceller."
  policy gradient: "Politikanın parametrelerini beklenen getirinin gradyanıyla güncelleyen yöntem ailesi; gradyan ∇log π(a|s) ile getirinin çarpımının beklentisi olarak tahmin edilir."
  saved tensors: "Autograd düğümlerinin geri geçişte türevi hesaplamak için ileri geçişte sakladığı tensörler; eğitimdeki aktivasyon belleğinin kaynağı."
  version counter: "Her tensörün in-place değişikliklerde artan sayacı; autograd, sakladığı tensörün geri geçişe kadar değişip değişmediğini bununla denetler."
  straight-through estimator: "Türevlenemeyen (ör. round, örnekleme) bir işlemi geri geçişte özdeşlik gibi davranarak gradyanı aynen geçiren tahminci."
  jvp: "Jacobian-vector product: Jv. Forward-mode AD ile tek bir ileri geçişte, Jacobian kurulmadan hesaplanır."
  activation checkpointing: "İleri geçişte yalnız bazı ara çıktıları saklayıp geri geçişte gerisini yeniden hesaplayarak aktivasyon belleğini azaltma tekniği."
  operatör füzyonu: "Birden çok işlemi tek bir kernel'de birleştirip ara sonuçları belleğe yazmadan hesaplama; bellek-bağımlı işlemlerde büyük hız kazancı sağlar."
  graph break: "torch.compile/Dynamo'nun bir kod parçasını grafa alamayıp normal Python'a döndüğü nokta; graf ikiye bölünür, optimizasyon fırsatı kaybolur."
  tiling: "Veriyi hızlı belleğe (shared memory, önbellek) sığan bloklar hâlinde işleyerek her yüklenen elemanı birçok kez yeniden kullanma tekniği."
  roofline: "Bir işlemin ulaşabileceği performansı min(tepe FLOP, bant genişliği × aritmetik yoğunluk) ile modelleyen grafik model."
  epilogue füzyonu: "Bir çekirdeğin ana hesabından (ör. matmul) sonra gelen bias, aktivasyon, ölçekleme gibi elementwise işlemleri sonucu belleğe yazmadan aynı çekirdekte uygulamak."
  loss scaling: "Kaybı büyük bir sayıyla çarpıp gradyanları sonra aynı sayıya bölerek, düşük hassasiyette küçük gradyanların sıfıra alt taşmasını önleme tekniği."
  stochastic rounding: "Bir sayıyı iki komşu temsil edilebilir değerden birine, uzaklıklarıyla ters orantılı olasılıkla yuvarlama; beklenen değerde yansızdır."
  all-reduce: "Tüm işçilerin tensörlerini toplayıp (ya da ortalayıp) sonucu her işçiye geri veren kolektif iletişim işlemi."
  ZeRO: "Zero Redundancy Optimizer: optimizer durumunu (ZeRO-1), gradyanları (ZeRO-2) ve parametreleri (ZeRO-3, FSDP) işçilere bölerek veri paralel eğitimin bellek tekrarını kaldıran yöntem."
  grup bazlı kuantizasyon: "Bir ağırlık satırını sabit boyutlu gruplara bölüp her gruba ayrı ölçek vererek aykırı değerlerin etkisini sınırlayan kuantizasyon (int4 LLM ağırlıklarında tipik)."
  guard: "Derlenmiş ya da dışa aktarılmış bir grafın geçerli olduğu koşul (ör. batch = 4); çalışma anında koşul sağlanmazsa yeniden derleme ya da hata."
  minGPT: "Karpathy'nin eğitim amaçlı, birkaç yüz satırlık GPT uygulaması; nanoGPT'nin öncülü. İçindeki 'adder' örneği toplamayı öğrenen küçük bir GPT."
  bilineer interpolasyon: "Bir noktanın değerini çevresindeki dört pikselden, iki eksende ardışık doğrusal interpolasyonla tahmin etme."
  histogram eşitleme: "Piksel değerlerini birikimli dağılım fonksiyonu (CDF) ile yeniden eşleyerek çıkış histogramını düzgüne yaklaştıran ve kontrastı artıran nokta dönüşümü."
  ayrılabilir filtre: "Rank-1 olan, yani bir sütun ve bir satır vektörünün dış çarpımı olarak yazılabilen 2-boyutlu çekirdek; iki 1-boyutlu filtreyle k² yerine 2k işlemle uygulanır."
  integral görüntü: "Her konumda sol-üst dikdörtgenin piksel toplamını tutan tablo (summed-area table); herhangi bir dikdörtgenin toplamı dört aramayla bulunur."
  unsharp masking: "Görüntüden bulanık kopyasını çıkararak ayrıntı maskesi elde edip bunu ağırlıklı olarak geri ekleyen keskinleştirme; kazanç 1'den büyükse highboost."
  median filtre: "Her pikseli komşuluk penceresindeki değerlerin medyanıyla değiştiren doğrusal olmayan sıra istatistiği filtresi; dürtü (tuz-biber) gürültüsünde etkili, kenarları korur."
  PSNR: "Peak signal-to-noise ratio: 10·log10(R²/MSE) desibel; iki görüntü arasındaki piksel hatasının logaritmik ölçüsü."
  log: "Laplacian of Gaussian: önce Gauss ile yumuşatıp sonra Laplacian almanın tek çekirdekli hali; ölçeği σ ile ayarlanan, yönden bağımsız ikinci türev operatörü."
  sıfır geçişi: "Bir sinyalin işaret değiştirdiği nokta; ikinci türevin sıfır geçişi kalın bir kenarın merkezini verir."
  non-maxima suppression: "Bir değeri, belirli yöndeki komşularından küçükse sıfırlayarak yalnız yerel tepeleri bırakma; Canny'de kenar sırtlarını tek piksel genişliğe indirir."
  histerezis eşikleme: "İki eşikli eşikleme: yüksek eşiği geçenler kesin, iki eşik arasındakiler yalnız kesin bir piksele bağlıysa kabul edilir."
  harris matrisi: "Yerel penceredeki gradyanların ağırlıklı ikinci moment (yapı) tensörü M = Σw[[fx², fxfy],[fxfy, fy²]]; özdeğerleri pencerenin hangi yönlerde değiştiğini söyler."
  hit-or-miss: "Bir yapı elemanının ön plan kısmının nesneye, arka plan kısmının arka plana aynı anda sığdığı konumları bulan morfolojik şekil dedektörü."
  di zenzo gradyanı: "Çok kanallı (renkli) bir görüntüde en hızlı değişim yönünü ve büyüklüğünü, kanal türevlerinin iç çarpımlarından (gxx, gyy, gxy) oluşan 2 × 2 matrisin en büyük özdeğeriyle veren vektör gradyanı."
  konvolüsyon teoremi: "Uzayda konvolüsyon, Fourier uzayında eleman eleman çarpmaya karşılık gelir (f*h ⇔ F·H); ayrık DFT'de bu dairesel konvolüsyondur."
  wiener süzgeci: "Bulanık ve gürültülü bir gözlemden ortalama kare hatayı en aza indiren doğrusal onarıcı: H*/(|H|² + Sη/Sf)."
  slic: "Simple Linear Iterative Clustering: renk + konum uzayında yalnız yerel pencerede çalışan k-means ile süper piksel üreten algoritma."
  bilateral süzgeç: "Ağırlığı hem uzaysal yakınlığa hem de yoğunluk benzerliğine bağlı olan, kenarları koruyarak yumuşatan doğrusal olmayan süzgeç."
  non-local means: "Her pikseli, arama penceresindeki tüm piksellerin yama benzerliğiyle ağırlıklandırılmış ortalamasıyla değiştiren gürültü giderme yöntemi."
  ssim: "Structural Similarity: iki görüntüyü yerel pencerelerde parlaklık, kontrast ve yapı (korelasyon) karşılaştırmalarının çarpımıyla ölçen, 1'de en büyük olan kalite ölçütü."
  ölçek uzayı: "Bir görüntünün giderek artan σ'lı Gauss süzgeçleriyle yumuşatılmış hallerinden oluşan tek parametreli aile; öznitelikleri bilinmeyen ölçekte aramak için kullanılır."
  homografi: "Düzlemsel bir sahnenin ya da yalnız dönen bir kameranın iki görüntüsü arasındaki 3 × 3 projektif dönüşüm (8 serbestlik)."
  ransac: "Random Sample Consensus: minimal rastgele örneklerden model kurup en çok veri noktasıyla uyuşanı seçen, aykırı değerlere dayanıklı kestirim yöntemi."
  adaboost: "Zayıf sınıflandırıcıları sırayla, önceki turların yanlış sınıfladığı örneklere daha çok ağırlık vererek eğitip ağırlıklı oyla birleştiren boosting algoritması."
  optik akış: "Ardışık iki karede her pikselin görünür hareketini veren (u, v) vektör alanı; parlaklık sabitliği varsayımına dayanır."
  vibe: "Visual Background Extractor: her piksel için geçmiş değerlerden rastgele örnekler tutan, rastgele ve komşulara yayılan güncellemeli parametresiz arka plan çıkarma yöntemi."
  geniş anlamda durağanlık: "Wide-sense stationarity: ortalaması sabit, otokovaryansı yalnız iki zaman arasındaki farka bağlı olan rastgele süreç."
  geçiş matrisi: "Markov zincirinde bir durumdan diğerine geçme olasılıklarını tutan matris; bu modülde sütun j, S_j'den çıkış dağılımıdır."
  bellman denklemi: "Bir durumun değerini anlık ödül ile sonraki durumların indirimli beklenen değeri cinsinden yazan özyinelemeli denklem; en iyi değerde eylemler üzerinde max alınır."
  politika iyileştirme teoremi: "Bir politikanın Q değerlerine göre açgözlü seçilen yeni politikanın her durumda en az eski politika kadar değerli olduğunu söyleyen sonuç."
  td hatası: "Temporal-difference hatası δ = r + γV(s') − V(s): tek adımlık önyüklemeli hedef ile şimdiki kestirim arasındaki fark."
  politika dışı öğrenme: "Off-policy: veri bir davranış politikasıyla (ör. ε-açgözlü) toplanırken başka bir hedef politikanın (ör. açgözlü) değeri öğrenilir. Q-öğrenme politika dışıdır; SARSA politika üstüdür."
  maksimizasyon yanlılığı: "Gürültülü kestirimlerin maksimumu gerçek maksimumu sistematik olarak aşar: E[max Q̂] ≥ max E[Q̂]. Q-öğrenmenin hedefindeki max bu yanlılığı yayar; çift Q-öğrenme seçme ve değerlendirmeyi ayırarak giderir."
  ε-açgözlü: "ε olasılıkla rastgele, 1 − ε olasılıkla en yüksek Q değerli eylemi seçen keşif politikası."
  ölümcül üçlü: "Deadly triad: fonksiyon yaklaştırma, önyükleme (bootstrapping) ve politika dışı eğitim bir araya geldiğinde değer kestirimleri ıraksayabilir; ikisi tek başına güvenlidir."
  deneyim tekrarı: "Experience replay: geçişleri (s, a, r, s') bir tamponda saklayıp rastgele mini-batch'lerle tekrar öğrenmek; korelasyonu kırar ve veriyi yeniden kullanır."
  pişmanlık: "Regret: en iyi kolu hep oynasaydık alacağımız beklenen ödül ile gerçekte seçtiklerimizin beklenen ödülü arasındaki toplam fark."
  eşlenik önsel: "Conjugate prior: olabilirlikle çarpılınca sonsalı yine aynı aileden çıkan önsel (Beta–Bernoulli, Normal–Normal); güncelleme parametre toplamasına iner."
  thompson örneklemesi: "Her kolun ortalama ödülü için sonsaldan örnek çekip en büyük örneğe sahip kolu oynamak; seçim olasılığı kolun en iyi olma sonsal olasılığına eşittir."
  sherman–morrison: "(A + uvᵀ)⁻¹ = A⁻¹ − A⁻¹uvᵀA⁻¹ / (1 + vᵀA⁻¹u): rank-1 güncellemeden sonra ters matrisi O(d²)'de hesaplar."
  politika dışı değerlendirme: "Off-policy evaluation: bir politikanın değerini, başka bir politikayla toplanmış kayıtlardan (bağlam, eylem, ödül, eylem olasılığı) kestirmek; IPS, DM, DR, tekrar oynatma."
  avantaj fonksiyonu: "A(s, a) = Q(s, a) − V(s): bu durumda bu eylemin politikanın ortalamasından ne kadar iyi olduğu; politika gradyanında taban çizgili ağırlık."
  deterministik politika gradyanı: "Sürekli eylemli deterministik politika μ_θ(s) için ∇J = E[∇_θ μ_θ(s) ∇_a Q(s, a)|_{a = μ_θ(s)}] (Silver ve ark. 2014); eleştirmenin eylem gradyanı aktörü yönlendirir."
  monte carlo ağaç araması: "MCTS: arama ağacını tekrar tekrar seçim (UCT/PUCT), genişletme, simülasyon (rastgele oyun ya da değer ağı) ve geri yayılımla büyütür; aramayı umut veren dallara yoğunlaştırır."
  elo derecelendirmesi: "Oyuncu gücü ölçeği: A'nın B'ye karşı beklenen skoru 1/(1 + 10^((R_B − R_A)/400)); 200 puan fark ≈ %76. Bradley–Terry modelinin logaritmik ölçeklenmiş hâlidir."
  fisher bilgi matrisi: "F = E[∇log π ∇log πᵀ]: dağılımlar uzayının yerel metriği; KL(π_θ ‖ π_{θ+d}) ≈ ½ dᵀFd. Doğal gradyan F⁻¹g bu metrikte en dik yöndür."
  gae: "Generalized Advantage Estimation: A_t = Σ_k (γλ)^k δ_{t+k}, δ_t = r_t + γV(s_{t+1}) − V(s_t); λ yanlılık–varyans ödünleşimini ayarlar (0: TD, 1: Monte Carlo)."
  amdahl yasası: "Programın f oranı N işlemciye bölünür, kalan 1 − f seri kalırsa hızlanma S = 1/((1 − f) + f/N) ≤ 1/(1 − f): sabit problem boyunda seri kısım tavanı belirler."
  gustafson yasası: "Problem işlemci sayısıyla büyütülür ve seri süre sabit kalırsa ölçeklenmiş hızlanma S = (1 − f) + fN: zayıf ölçekleme."
  pcam: "Foster'ın paralel tasarım adımları: Partitioning (görevlere böl), Communication (bağımlılıkları belirle), Agglomeration (iletişimi azaltmak için grupla), Mapping (gruplari işlemcilere dengeli ata)."
  veri yarışı: "Data race: iki thread aynı bellek konumuna eşzamanlama olmadan aynı anda erişir ve en az biri yazar; C/C++'ta tanımsız davranıştır."
  yarış koşulu: "Race condition: programın doğruluğunun thread'lerin göreli zamanlamasına bağlı olması; veri yarışı olmadan da (ör. ayrı atomik oku ve yaz) ortaya çıkabilir."
  aritmetik yoğunluk: "Bir çekirdeğin bellekten taşınan bayt başına yaptığı işlem sayısı (FLOP/bayt); roofline modelinde bellek-bağımlı ile hesap-bağımlıyı ayırır."
  simt: "Single Instruction, Multiple Threads: GPU'da 32 thread'lik warp aynı komutu yürütür; her thread'in yazmaçları ayrıdır, dallanınca yollar maskelenerek sırayla yürür."
  birleştirilmiş erişim: "Coalesced access: bir warp'ın global bellek erişimlerinin az sayıda ardışık 32 baytlık sektörde toplanması; ardışık thread → ardışık adres."
  bank çakışması: "Paylaşımlı bellek 32 banka (4 bayt) bölünür; bir warp'ta aynı bankın farklı adreslerine erişen thread'ler sırayla hizmet alır."
  özelleştirme: "Privatization: paylaşılan bir çıktı yapısının (histogram, biriktirici) her thread/blok için ayrı kopyası tutulur, sonda birleştirilir; çekişmeyi ve atomik maliyetini azaltır."
  sabit bellek: "CUDA'da 64 KB'lık salt okunur bellek alanı; önbelleklidir ve bir warp'ın tüm thread'leri aynı adresi okuduğunda değeri tek erişimle yayınlar (konvolüsyon filtreleri)."
  evrensel yaklaşım: "Yeterli genişlikte tek gizli katmanlı bir ağın kompakt bir küme üzerindeki her sürekli fonksiyonu istenen doğrulukla yaklaşıklayabileceğini söyleyen teorem (Cybenko 1989, Hornik 1991)."
  çift iniş: "Double descent: model kapasitesi (parametre sayısı) eğitim örneği sayısına yaklaşınca test hatasının tepe yapıp, daha da artınca yeniden düştüğü gözlem."
  perceptron: "Rosenblatt'ın eşik birimli doğrusal sınıflandırıcısı; hatalı her örnekte w ← w + η(y − ŷ)x kuralıyla öğrenir, doğrusal ayrılabilir veride sonlu adımda yakınsar."
  transfer öğrenme: "Bir görevde eğitilmiş ağın (genellikle alt) katmanlarını başka bir görevde yeniden kullanmak: dondurup yeni başlığı eğitmek, sonra küçük öğrenme oranıyla ince ayar."
  veri sızıntısı: "Modelin eğitimde, dağıtım anında erişemeyeceği bilgiyi (test istatistikleri, aynı grubun kopyaları, gelecekten değerler, hedefin sonucu) görmesi; skorları gerçek dışı şişirir."
  darboğaz: "Bottleneck: pahalı bir katmandan önce 1×1 konvolüsyonla kanal sayısını azaltıp (gerekirse sonra yeniden artırarak) hesabı düşürme düzeni (Inception, ResNet)."
  derinlemesine ayrılabilir konvolüsyon: "Depthwise separable convolution: her kanalı ayrı K×K filtreyle süzüp (derinlemesine) ardından 1×1 konvolüsyonla kanalları karıştırmak; standart konvolüsyona göre ~K² kat az hesap (Xception, MobileNet)."
  iou: "Intersection over Union: iki kutunun (ya da maskenin) kesişim alanının birleşim alanına oranı; tespit ve segmentasyonun temel örtüşme ölçüsü (0 ayrık, 1 özdeş)."
  nms: "Non-max suppression: aynı nesneye ait yinelenen tespitleri ayıklamak için en yüksek skorlu kutuyu tutup onunla IoU'su eşiği aşanları silme işleminin tekrarı."
  tam konvolüsyonel ağ: "Fully convolutional network (FCN): yoğun katmanları, çekirdeği girdi haritası boyutunda konvolüsyonlarla değiştirilmiş ağ; her girdi boyutunda çalışır ve kayan pencere sınıflandırmasını tek geçişte yapar."
  çapa kutusu: "Anchor box: tespit ağının kutuları göre tahmin ettiği önceden belirlenmiş (w, h) prototipleri; YOLOv2+ bunları eğitim kutularına 1 − IoU uzaklıklı k-means ile bulur."
  ortalama hassasiyet: "Average precision (AP): precision–recall eğrisinin zarfının altındaki alan (ya da 11 recall düzeyindeki ortalaması); sınıflar üzerinden ortalaması mAP, IoU eşikleri üzerinden ortalaması COCO AP@[.50:.95]."
  öznitelik piramidi ağı: "Feature Pyramid Network (FPN): omurganın çok ölçekli haritalarını yukarıdan-aşağı bir yol ve yanal bağlantılarla birleştirip her ölçekte anlamca güçlü öznitelikler üreten yapı (Lin ve ark. 2017)."
  transposed convolution: "Konvolüsyonun 'transpozu': her girdi pikseli çekirdeği kendi değeriyle ölçekleyip çıktıya saçar; adım s ile çıktıyı büyütür. Eşdeğer olarak sıfır ekleme + normal konvolüsyon, konvolüsyon matrisinin transpozu ya da konvolüsyonun girdiye göre gradyanı."
  u-net: "Kodlayıcı-kod çözücü segmentasyon ağı (Ronneberger ve ark. 2015): kodlayıcının her ölçekteki haritası kod çözücüdeki aynı ölçeğe kopyalanıp birleştirilir; ince ayrıntı korunur."
  genişletilmiş konvolüsyon: "Dilated (atrous) convolution: çekirdek elemanları arasında d − 1 boşluk bırakan konvolüsyon; parametre ve çözünürlük kaybı olmadan receptive field'ı büyütür."
  durağanlık: "Stationarity: sürecin istatistiklerinin zamanda kaydırmayla değişmemesi. Katı anlamda tüm ortak dağılımlar, geniş anlamda (WSS) yalnız ortalama ve otokovaryans (yalnız zaman farkına bağlı) sabittir."
  arima: "Autoregressive integrated moving average: seriyi d kez farklayıp (trendleri silip) ARMA(p, q) uygulayan, tahmine farkları geri ekleyen model (Box & Jenkins 1970); mevsimsel sürümü SARIMA."
  yule–walker denklemleri: "AR(p) katsayıları ile otokorelasyonlar arasındaki doğrusal ilişki ρ_k = Σ φ_i ρ_{k−i}; örnek otokorelasyonlardan AR katsayılarını tahmin etmeye ya da tersine kullanılır."
  nedensel konvolüsyon: "Causal convolution: çıkışın t anında yalnız t ve öncesindeki girdilere bağlı olduğu, solda (k − 1)d dolgulu 1B konvolüsyon; WaveNet'in yapı taşı."
  oov kovası: "Out-of-vocabulary bucket: eğitimde görülmemiş kategori/kelimelerin karma (hash) ile atandığı birkaç yer tutucu indeks; sözlüğü sabit tutarken bilinmeyenleri temsil eder."
  skip-gram: "word2vec'in merkez kelimeden pencere içindeki bağlam kelimelerini tahmin eden biçimi; tersi (bağlamdan merkezi tahmin) CBOW'dur."
  negatif örnekleme: "Negative sampling: V sınıflı softmax yerine gerçek (kelime, bağlam) çiftini k adet gürültü çiftinden ayıran ikili lojistik kayıp; gürültü dağılımı ∝ sayı^{3/4}."
  öğretmen zorlaması: "Teacher forcing: eğitimde kod çözücüye her adımda kendi önceki tahmini yerine gerçek önceki token'ı vermek; hızlı ve kararlı eğitir ama eğitim–çıkarım uyumsuzluğu (exposure bias) yaratır."
  beam search: "Çözümlemede k en olası kısmi diziyi tutup her adımda hepsini sözlük boyunca uzatarak en iyi k'yı seçen arama; açgözlü çözümlemenin geri dönülemez hatalarını azaltır."
  toplamsal attention: "Bahdanau attention: skor e = vᵀ tanh(W₁h_i + W₂s) — kodlayıcı çıktısı ile kod çözücü durumunun birleştirilip küçük bir ağdan geçirilmesi; çarpımsal (Luong) attention'da skor nokta çarpımdır."
  sinüzoidal konum kodlaması: "Transformer'ın sabit konum vektörleri: P[p, 2i] = sin(p/10000^{2i/d}), P[p, 2i+1] = cos(·); her konuma benzersiz, keyfi uzunluğa uzanır ve P[p+k] = R_k P[p] (göreli konum doğrusal)."
  cross-attention: "Sorguların bir diziden (kod çözücü), anahtar ve değerlerin başka bir diziden (kodlayıcı çıktısı) geldiği attention; kod çözücünün kaynak cümleye bakmasını sağlar."
  etiket yumuşatma: "Label smoothing: one-hot hedefi (1 − ε)·onehot + ε/V ile değiştirmek; modeli aşırı güvenden alıkoyar, logit'leri sınırlı tutar."
  noam takvimi: "Transformer öğrenme oranı takvimi: lr = d^{−1/2}·min(s^{−1/2}, s·w^{−3/2}) — w adım doğrusal ısınma, ardından 1/√s azalma."
  yama embedding'i: "Patch embedding: görüntüyü P × P'lik örtüşmeyen yamalara bölüp her yamayı aynı doğrusal izdüşümle D boyutlu token'a çevirmek; çekirdeği ve adımı P olan konvolüsyona eşdeğer (ViT)."
  endüktif yanlılık: "Inductive bias: modelin mimarisine gömülü, veriden önce gelen varsayımlar (CNN'de yerellik ve kaydırma eşdeğerliği gibi); az veride genellemeyi kolaylaştırır, çok veride esnekliği kısıtlayabilir."
  bağlamsal gömme: "Contextualized embedding: bir kelimenin vektörünün içinde geçtiği cümleye göre değiştiği temsil (ELMo, GPT, BERT); sabit word2vec vektörlerinin çok anlamlılık sorununu çözer."
  maskeli dil modeli: "Masked language modeling: token'ların ~%15'ini seçip (80% [MASK], 10% rastgele, 10% aynı) bağlamın iki yanından orijinallerini tahmin ettiren ön eğitim amacı (BERT)."
  bradley–terry modeli: "İkili tercihler için olasılık modeli: P(a ≻ b) = σ(r(a) − r(b)); RLHF'te insan karşılaştırmalarından ödül modeli eğitmek için kullanılır."
  dpo: "Direct Preference Optimization: KL cezalı ödül maksimizasyonunun kapalı form çözümünü kullanıp ödül modeli ve RL olmadan tercih çiftleri üzerinde −log σ(β[log π/π_ref (y_w) − log π/π_ref (y_l)]) kaybını en küçükleyen hizalama yöntemi."
  bağlı ağırlıklar: "Tied weights: simetrik autoencoder'da kod çözücü katmanının ağırlığını kodlayıcıdaki karşılığının transpozu olarak almak (W_{N−L+1} = W_Lᵀ); parametreleri yarıya indirir."
  gürültü giderici autoencoder: "Denoising autoencoder: girdiye Gauss ya da maskeleme gürültüsü eklenip temiz girdinin geri istendiği AE; aşırı tam kodla bile özdeşliği kopyalayamaz, veri yapısını öğrenir."
  seyrek autoencoder: "Sparse autoencoder: kod katmanında aynı anda az nöronun aktif olmasını L1 ya da KL(ρ‖ρ̂) cezasıyla zorlayan AE; her nöron seçici bir özniteliğe karşılık gelir."
  mod çöküşü: "Mode collapse: GAN üreticisinin çıktılarının çeşitliliğini yitirip verinin birkaç moduna (sınıfına) sıkışması; ayırıcıyla birlikte modlar arasında çevrime girebilir."
  fid: "Fréchet Inception Distance: gerçek ve üretilen görüntülerin önceden eğitilmiş bir ağdaki öznitelikleri Gauss kabul edilerek ‖μ_r − μ_g‖² + tr(Σ_r + Σ_g − 2(Σ_rΣ_g)^{1/2}) ile ölçülen uzaklık; düşük daha iyi, hem kaliteyi hem çeşitliliği yansıtır."
  adain: "Adaptive Instance Normalization: öznitelik haritasını kanal başına kendi ortalama/std'siyle normalize edip dışarıdan verilen stil ölçek ve kaymasını uygulamak: y_s(x − μ)/σ + y_b (StyleGAN, stil aktarımı)."
  sınıflandırıcısız yönlendirme: "Classifier-free guidance: aynı ağın koşullu ve (etiket bırakmayla öğrenilmiş) koşulsuz ε tahminlerini ε_u + s(ε_c − ε_u) ile karıştırmak; s > 1 kesinliği artırır, çeşitliliği azaltır."
  sınıflandırıcı yönlendirmesi: "Classifier guidance: difüzyon örneklemesinde ε tahminini gürültülü veride eğitilmiş bir sınıflandırıcının ∇log p(y|x_t) gradyanıyla kaydırmak; p(x)p(y|x)^s'den örneklemeye karşılık gelir."
  latent diffusion: "Difüzyonu piksel uzayı yerine önceden eğitilmiş bir otomatik kodlayıcının küçük gizli uzayında yapıp sonucu kod çözücüyle görüntüye açmak (Stable Diffusion)."
