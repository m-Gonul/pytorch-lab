  - title: "BİL 467 Görüntü İşleme"
    rows:
      - src: "lect_1_and_2 — Giriş, dijital görüntü"
        topics: "görüntüleme modaliteleri ve EM spektrum, insan görme sistemi, Bayer deseni, örnekleme/nicemleme, bit derinliği, piksel komşulukları, tekil/komşuluk işlemleri, LSI sistemler, Fourier"
        pages: [m9-1-digital-image, m9-10-frequency, m9-9-color]
        status: genis
        gap: "Modaliteler/EM spektrum ve Bayer deseni (demozaikleme) bizde yoktu."
        done: "M9.1'e modalite ve algılayıcı sezgi kutusu + Bayer demozaikleme ek alıştırması (x4) eklendi. M9.1 konu anlatımı lect_1_and_2'nin tamamını (114 slayt) işliyor: görüntü ve piksel, görüntü işleme/bilgisayarlı görü ayrımı, işleme düzeyleri, modaliteler, sistem bileşenleri, insan görme sistemi (koni/çubuk, fovea, fotopik/skotopik, odaklama), ışık ve renk, gri ton, edinim (fotodiyot, filtre, Bayer, demozaikleme), f = i·r oluşum modeli, örnekleme/nicemleme, bit derinliği, uzamsal çözünürlük, koordinat kuralları, interpolasyon (çekirdek olarak türetim, Keys), komşuluk ve metrikler, eleman bazlı/küme/mantıksal işlemler, tek piksel/komşuluk/geometrik işlemler, afin ve homojen koordinatlar, ileri/ters eşleme, kayıtlama (bağlantı noktaları, bilineer model, gerçekçi akış), vektör gösterimi ve g = Hf + n, dönüşüm çiftleri, Fourier, özfonksiyon türetimi, histogram olasılığı. Slayt notları: görünür bant 0.43–0.79 mm → µm; ultrasonun dalga boyu santimetre değil milimetre altı; yeşil duyarlılığının açıklaması (koni tepeleri ve ışık verimi eğrisi); Gonzalez ile OpenCV koordinat kuralları; karmaşık iç çarpımda eşlenik; afin dönüşüm 'düzlemleri' değil paralelliği korur. M9.10 konu anlatımı dönüşüm slaytlarını (99–112) Gonzalez Bölüm 4 ve 5.7–5.8 düzeyinde derinleştiriyor: dönüşüm çifti, ayrılabilir/simetrik çekirdek, özfonksiyonlar ve konum çözünürlüğü kaybı, 1-B/2-B DFT ve ortogonallik türetimi, özellikler (periyodiklik, eşlenik simetri, genlik/faz, öteleme, merkezleme), FFT türetimi, konvolüsyon teoremi türetimi, sarmalanma ve dolgu, süzgeçleme hattı, ideal/Butterworth/Gauss ve halkalanma, YG, frekansta Laplasyen, çentik süzgeçleri, ters süzgeç ve Wiener (türetimli), uzay/frekans maliyeti; circconv, freqfilt ve deconv deneyleri."
