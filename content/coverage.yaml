intro: |
  Bu tablo, siteye kaynak olarak verilen ders notlarının (dört ders: BİL 442 Derin Öğrenme, BİL 467 Görüntü İşleme, BİL 455 Paralel Programlama, YAP 446 Pekiştirmeli Öğrenme; ayrıca 11 makale) her bölümünü sitedeki sayfalara eşler. Slaytlar yayımlanmadı ve kopyalanmadı; içerik kendi anlatımımızla yeniden yazıldı, ilgili modüllerin sonunda kaynak bağlantıları var.

  **Nasıl denetlendi:** 82 PDF'in metni çıkarıldı (toplam ≈ 31 700 satır); her slayt başlığı ilgili modülün tüm dosyalarında (anlatım, alıştırma, kontrol, kod) aranıp eşleşmeyenler elle incelendi. **Erişim sınırı:** slaytlardaki şekil ve ekran görüntüleri metin olarak okunamadı; yalnız başlık, metin ve formüllerin metne dökülebilen kısmı karşılaştırıldı. Görsel içerikli slaytlar (ör. görüntü örnekleri, mimari çizimleri) konu başlığı üzerinden eşlendi.

  **Durumlar:** *kapsandı* — kaynaktaki konu sitede en az aynı derinlikte; *kapsandı + genişletildi* — sitede kaynakta olmayan türetim, alıştırma ya da deney de var; *kısmen* — konu var ama kaynaktaki bir alt başlık bilinçli olarak yüzeysel; *bilinçli olarak farklı* — kaynaktaki araç yerine başka bir araç (ör. Keras yerine PyTorch). Yeni kaynak geldikçe tablo genişletilir; tamamlanmış satırlar geri alınmaz.
