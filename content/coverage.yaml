      - src: "ch_16 — NLP, seq2seq, attention, Transformer"
        topics: "kodlayıcı–kod çözücü NMT, çift yönlü RNN, beam search, Bahdanau/Luong attention, Transformer, konum kodlaması, ViT"
        pages: [m4-13-seq2seq, m4-6-attention, m4-7-transformer, m4-14-transformer-ed, m4-15-vit]
        status: genis
        gap: "Slayt 5–6 (LLM zaman çizelgesi görseli), 7–11 ve 31–44'teki mimari çizimler görüntü olduğu için metne dökülemedi; içerikleri slayt metninden ve orijinal makalelerden (Sutskever 2014, Bahdanau 2015, Luong 2015) yeniden kuruldu."
        done: "√d_k ölçekleme deneyi (softmax doyması ve entropi). M4.13 konu anlatımı (slayt 2–44): öğretmen zorlaması = MLE türetimi, kaynak ters çevirme (Sutskever sayıları), maskeli kayıp ortalamaları, kovalama, örneklenmiş softmax ve log(m·q) düzeltmesinin türetimi, maruz kalma yanlılığında O(εT²) birikim türetimi, zamanlanmış örnekleme takvimleri, çift yönlü RNN (h_n tuzağı), beam search (slayt sayılarıyla ağaç, batch'li uygulama, uzunluk normalizasyonu, boş çeviri), Bahdanau ve Luong tam denklemleri, BLEU; padwaste, sampledsm, beamlab, alignattn deneyleri, 4 şekil. Slayt düzeltmeleri: dolgu sayımı 84/76 → 64/96 (%60); 'tek nöronlu yoğun katman' hizalama modeli adımdan bağımsız α verir (türetim + deney); 'negative sampling (or sampled softmax)' ayrımı; Luong'un concat karşılaştırması için nüans (basitleştirilmiş uygulama, Britz 2017). M4.14 konu anlatımı (slayt 45–88): Tablo 1 karmaşıklıkları, mimari ve 5N/2N sayımı, üç dikkat türü ve −∞ maskeleme türetimi, dikkat tablosunun dört satırı, MHA ve base parametre sayımı, permütasyon eş-değişkenliği türetimi, sinüzoidal PE'nin döndürme ve iç çarpım özdeşlikleri, √d ölçeğinin gerekçesi, Noam tepesi, etiket yumuşatma türetimi, makale sonuçları ve Tablo 3; maskviz, posenc, noamlr, labelsmooth deneyleri, 3 şekil. Slayt notları: softmax 0.88 → 0.87, 0.94 → 0.95; '38 arayla her zaman aynı' → yaklaşık (dalga boyu 37.97); 25/35 örneği slaytın parametreleriyle tutmuyor (25/32); 'slayt 120' → 58; 'keyfi uzunluğa genişler' → makale 'izin verebilir' diyor (ALiBi ölçümü); 'softmax'a yalnız bir embedding ulaşır' yalnız çıkarım için."
      - src: "ch_17 — Üretken modeller"
        topics: "AE ailesi (yığılmış, bağlı ağırlık, gürültü giderici, seyrek), VAE ve maliyet türetimi, KL, GAN ve maliyet türetimi, DCGAN, mod çöküşü, StyleGAN, DDPM"
        pages: [m5-6-autoencoders, m5-1-vae, m5-2-gan, m5-7-gan-advanced, m5-3-diffusion, m5-8-diffusion-guidance]
        status: genis
        gap: "—"
        done: "Gürültü takvimi deneyi (ᾱ, SNR, doğrusal vs kosinüs); CFG ölçeği deneyi (kâhin skorlu 2B karışım); GAN maliyetinin (en iyi ayırıcı → JS) adım adım türetimi (M5.2); ELBO'nun iki yoldan türetimi ve q(x_t|x_0) kapalı formu çözülmüş örnek olarak (M5.1, M5.3). M5.1 konu anlatımı (slayt 2–9, 41–57): dört üretken yaklaşım, doğrusal AE = PCA alt uzayı, gizil değişkenli model, KL ≥ 0 kanıtı ve ileri/ters KL, ELBO'nun Jensen ve kesin özdeşlik türetimleri, Gauss KL kapalı formu, reparametrizasyon türetimi ve skor fonksiyonu, kod çözücü olabilirliği ve örtük β, bulanıklık, interpolasyon ve norm yoğunlaşması, β-VAE ve doğrusal VAE çöküş eşiği, IWAE; klasym, gradest, betavae deneyleri, 3 şekil. Slayt notları: kodlayıcı/kod çözücü parametre gösterimi literatürün tersi; p(z) = N(0, I); 'kodlar Gauss bulutu' ifadesine toplam posterior ve interpolasyon nüansı; slaytlarda reparametrizasyon adımı yok (anlatıma eklendi). M5.2 konu anlatımı (slayt 4–7, 58–77): eğitim döngüsü, V(D, G) = negatif BCE türetimi, D* ve JS türetimi, doyum ve doyumsuz kayıp türetimi, Nash dengesi ve Dirac GAN dinamiği (özdeğer modülü), R1, mod çöküşü, JS doyumu ve WGAN/WGAN-GP; diracgan ve gan1d deneyleri, 3 şekil. Slayt notları: 'Detector network' → discriminator; 'tek Nash dengesi' sonucunun koşulları (sonsuz kapasite, optimal D); eğitim döngüsündeki üreteç adımı minimaks değil doyumsuz kayıptır. M5.3 konu anlatımı (slayt 105–128): tarihçe, ileri süreç ve varyansın 1'e yakınsaması türetimi, kısa yol türetimi, negatif log-olabilirlik sınırının KL'lere ayrılması (teleskop), q(x_{t−1}|x_t, x₀) Gauss türetimi (kare tamamlama), ε-parametrizasyonu ve L_simple, algoritmalar, skor bağlantısı, DDIM, sonuçlar, latent difüzyon, flow matching; diff1d deneyi (kâhin ε ile DDPM/DDIM), 3 şekil. Slayt düzeltmeleri: Z ~ N(μx + μy, σy² + σy²) → σx² + σy² ve bağımsız gürültülerin aynı simgeyle yazılması; 'sinyal doğrusal azalır' → doğrusal olan β (√ᾱ₅₀₀ = 0.28); iki ayrı Nichol–Dhariwal makalesi. M5.6 konu anlatımı (slayt 10–40): verimli temsiller ve Chase–Simon satranç deneyi, kodlayıcı/kod çözücü, eksik tamamlanmış AE ve doğrusal AE = PCA, MNIST 2-B kod, yığılmış AE 784-100-30-100-784, yeniden yapılandırmaları görselleştirme, ağırlık bağlama W_{N−L+1} = W_Lᵀ (parametre 163 814 → 82 414), açgözlü katman katman eğitim, denetimsiz ön eğitim, konvolüsyonel ve rekürent AE, aşırı tamamlanmış AE, gürültü giderici AE ve Tweedie/skor türetimi (difüzyon bağlantısı), seyrek AE (L1 yumuşak eşikleme türetimi, KL cezası); dae1d ve sparsecode deneyleri, 2 şekil. Slayt notları: slayt 28'deki 'bağlı model biraz daha düşük hata' bir gözlemdir, genel kural değil ('model model' yazımı); seyreklik için slaytta yalnız L1 var, KL cezası eklendi. M5.7 konu anlatımı (slayt 74–104): Nash dengesi (yol ve avcı–av örnekleri), tek denge sonucunun koşulları, mod çöküşü çevrimi ve unutma, deneyim tekrarı, mini-batch ayrımı (formülüyle), öznitelik eşleme ve TTUR, doymayan kayıp; DCGAN kuralları ve gerekçeleri, (4, 2, 1) bloğu; IS = exp I(x; y) türetimi ve sınırları, 1-B Fréchet uzaklığı türetimi (monoton eşleştirme), FID'in yanlılığı; ProGAN (yumuşak geçiş, mini-batch std, eşitlenmiş öğrenme oranının türetimi, piksel normu); StyleGAN (eşleme ağı ve ayrıklık, sabit girdi, gürültü enjeksiyonu, AdaIN el hesabı, stil karıştırma, kırpma), StyleGAN2 demodülasyonu; fidis ve trunclab deneyleri, 3 şekil. Slayt notları: 'Tero Kerras' → Karras; slayt 89'daki 'tüm görüntülerin entropisi' ortalama sınıf dağılımının entropisidir; slayt 93'teki 'çok ölçekli benzerlik StyleGAN'a yol açtı' köprüsü kitabın anlatısıdır (ProGAN SWD kullanır, StyleGAN gerekçesi stil aktarımı). M5.8 konu anlatımı (slayt 125–132): yönlendirilmiş difüzyonun iki yolu, Bayes kuralından sınıflandırıcı yönlendirmesinin ε cinsinden türetimi, slayt 131'deki yordamın formülle bağlantısı, sınıflandırıcısız yönlendirmenin Bayes'in ters kullanımıyla türetimi ve kesin modellerde denkliği, etiket bırakma, s = 1 + w gösterimi, Gauss eğiminin kare tamamlamayla türetimi, kesinlik–çeşitlilik ödünleşimi ve aşırı doyma, CFG'nin eğik dağılımdan tam örneklememesi, SNR ve kosinüs takvimi, parametrizasyonlar ve DDIM ters çevirme, latent diffusion (f = 8, 48 kat, cross-attention) ve Stable Diffusion; cfg2d ve guide1d deneyleri, 3 şekil. Slayt notları: CFG çapraz gömme uzayı gerektirmez (koşullama mekanizmasıyla karıştırılmış); slayt 131'deki 'toplamı gürültülü girdiden çıkar' bir kısaltmadır ve sınıflandırıcı gürültülü veride eğitilmelidir; 'sıradan dizüstünde saniyeler içinde' iyimser bir genellemedir."
