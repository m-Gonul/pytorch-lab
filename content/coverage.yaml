        done: "M11.10 konu anlatımı lect_12'nin bütün slaytlarını (1–19) işliyor: modelsizden modelliye geçiş ve dört adımlı döngü, tablo model (sayım kestiriminin en çok olabilirlik olmasının türetimi, artımlı ödül ortalaması) ve değer yinelemesiyle kesinlik eşdeğerli planlama, doğrusal/Gauss süreci/sinir ağı modelleri ve artık tahmini, kısmi planlama ve Dyna-Q, tekrar tamponuyla karşılaştırma, Dyna-Q+ (κ√τ bonusu) ve öncelikli tarama, şimdiki durumdan planlama ve MPC (rastgele atış), ağaç araması ve üç budama (yaprak, şans, karar düğümleri), UCT'nin haydut azaltımı, MCTS'in dört adımı, AlphaGo iskeleti ve PUCT; dynamaze ve mctsttt deneyleri, 2 şekil (BFS yolu ve gerçek UCT koşusundan kök düğümleri). Kaynak düzeltmeleri: planlama çiftleri keyfî değil gerçekte görülmüş olmalı; 'tampon genelleme yapmaz' tablo Q için doğrudur ama sinir ağı Q'da değil; V*(s) = Q(s, a*) (a* bonusla seçilmiş) tanımı; AlphaGo bonusunda √N(s) çarpanı eksik (makale denklemi 2; el hesabı makale formülüyle hesaplandı). Ölçümle düzeltilen taslak: 'X engellemeli' tic-tac-toe konumu aslında tek hamlede kazandıran çift tehdit konumu (ilk el analizi beraberlik sanıyordu); 'kötü politika önseli keşfi yavaşlatır' iddiası ölçümde tutmadı (kenar hamlelik kazanan konumda PUCT yine öndeydi: kesin yaprak değerleri yanlış önseli düzeltiyor). M11.12 konu anlatımı lect_13'ün bütün slaytlarını (1–7) işliyor ve TRPO/PPO/GAE'yi literatürden tamamlıyor: optimizasyon olarak öğrenme, doğru arama ile güven bölgesi, ikinci dereceden Taylor modeli ve alt problem, 1-B örnek, Moré–Sorensen global çözüm koşulları (yeterlilik kanıtı) ve zor durum, Cauchy noktası, dogleg, Steihaug-CG, ρ oranı ve yarıçap uyarlaması (adım kabulü/reddi), KL ≈ ½dᵀFd türetimi ve Fisher bilgi matrisi (softmax'ta tekil), doğal gradyan (Lagrange türetimi, parametreleme değişmezliği), performans farkı lemması ve TRPO vekili/sınırı (C = 4εγ/(1 − γ)²), pratik TRPO (CG, Fisher-vektör çarpımı, çizgi araması), PPO kırpılmış vekili, KL cezası ve uyarlamalı β, tam PPO kaybı, GAE (teleskop türetimi, λ yanlılık–varyans, özyineleme), PPO uygulama ayrıntıları; trustregion, ppoclip ve gae deneyleri, 2 şekil (alt problem geometrisi, kırpılmış amaç). Kaynak düzeltmeleri: Taylor açılımının '|x=c' yazımı; genel algoritmada adım kabulü, oran ölçütü ve sınırda büyütme eksik; belirsiz Hessian'da alt problem global çözülebilir (sezgiseller maliyet için), dogleg yalnız H ≻ 0, simetrik matrisin özdeğerleri zaten gerçel."
